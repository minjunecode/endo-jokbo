"2023-L56-Q104": "정답 ② A=과립막세포(granulosa cell) – B=난포막세포(theca cell) – C=기저막(basement membrane) – D=투명대(zona pellucida). 그림은 전동난포(preantral/antral follicle) 단면으로, 안쪽 C(기저막) 안의 A(과립막세포)가 FSH에 반응하여 aromatase로 에스트라디올을 만들고, 바깥 B(난포막세포)가 LH에 반응하여 안드로겐(androstenedione·testosterone)을 제공한다. 난자 주변은 D(투명대)가 둘러싼다. 💡 Two-cell/two-gonadotropin theory: 난포막(LH→androgens) + 과립막(FSH→aromatase→E2).",
"2023-L56-Q108": "정답 ③ A=FSH – B=에스트라디올(E2) – C=황체형성호르몬(LH) – D=황체호르몬(Progesterone). 그림의 월경주기 호르몬 곡선에서: A는 난포기 초기 소폭 높고 배란 후 낮아지는 FSH, B는 배란 전 첫 번째 peak이 있는 낮은 수준의 E2, C는 배란 직전 급격한 surge를 보이는 LH, D는 황체기에 현저히 상승하는 Progesterone이다. 이미지에서 C가 가장 뚜렷한 peak(LH surge), D가 황체기 전반에 걸쳐 높게 유지(Progesterone)임을 확인할 수 있다. 💡 LH surge = 배란 신호, Progesterone은 배란 이후 황체기에 상승.",
"2023-L57-Q151": "정답 ⑤ 안드로겐 무감응 증후군(Androgen Insensitivity Syndrome, AIS). 핵형 46,XY + 유방 발달 양호(Tanner IV) + 음모 없음(Tanner I) + 자궁 없음 + 질이 맹관인 조합이 완전형 AIS의 전형이다. 완전 AIS에서 안드로겐 수용체 불응으로 외부생식기는 여성형이고, 테스토스테론이 에스트라디올로 말초 전환되어 유방이 발달하지만 뮐러관 억제인자(MIF/AMH)가 작용하여 자궁은 없다. MIF의 작용으로 음모도 거의 없다. ③ 뮐러관 무발생(MRKH)은 46,XX이고 음모는 정상이다. ① 터너 증후군은 46,X(O)이고 유방 발달이 불량하다. ② 처녀막 막힘증은 자궁이 존재하고 주기적 하복통이 있다.",
"2023-L57-Q178": "정답 ④ 자궁내막 유착증(Asherman syndrome). 자궁난관조영술(HSG) 이미지에서 자궁강 내에 불규칙한 충만 결손(filling defect)이 관찰되며 이는 자궁내막 유착을 시사한다. 소파술 후 무월경이 생긴 임상 맥락과 합치된다. Asherman syndrome은 자궁내막 소파술 또는 자궁내 감염 후 자궁내막 유착으로 월경혈 배출이 안 되어 무월경이 발생한다. ① 자궁내막증은 HSG에서 이런 패턴이 아니다. ③ 근층내 근종은 자궁 외형을 변형시킨다. ⑤ 양측 난관 폐쇄는 난관 내 조영제가 통과하지 않는 소견이다. 💡 소파술 후 무월경 + HSG 충만결손 = Asherman syndrome → 치료는 자궁경 유착 박리술(operative hysteroscopy).",
"2023-L58-Q101": "정답 ② estrogen cream. 2023년 3세 여아 음순유착 문항(2025-Q22와 동일 임상 맥락). 소아에서 에스트로겐 결핍에 의한 외음부 위축·음순유착에는 국소 에스트로겐 크림이 일차 치료이다. ① topical emollient는 보습 목적이며 유착 치료 효과가 충분치 않다. ③ metronidazole은 혐기성 균 감염 치료제로 해당 없다. ④ medroxyprogesterone, ⑤ clomiphene은 소아 외음부 유착과 무관하다.",
"2023-L58-Q109": "정답 ② 아이의 나이에 맞는 장난감이 있으면 진료에 도움이 된다. 소아 진료 환경은 아이의 불안을 줄이고 협조를 이끌기 위해 중요하며, 나이에 적합한 장난감이나 친숙한 물건은 라포 형성에 직접 기여한다. ① 진료실 환경은 병력 청취에 큰 영향을 미친다. ③ 보호자를 완전히 배제하는 것은 부적절(아이와 보호자 모두 포함). ④ 아이 답변도 병력 청취의 중요한 정보원이다. ⑤ 학교·관심사 관련 대화는 라포 형성을 위한 유용한 도구이다.",
"2023-L58-Q141": "정답 ② Knee chest position. 5세 여아 비정상 질출혈 진찰 시 골반저 근육을 이완시켜 직장·후방 질 구조물 시야를 최대화하는 자세는 knee-chest position(무릎을 가슴 쪽으로 당기는 자세)이다. 이 자세에서 중력에 의해 직장이 앞으로 밀려 후방 구조물이 잘 보인다. ① frog leg position은 외음부 전반 시야 확보에 좋은 기본 자세이지만 골반저 이완 효과는 knee-chest가 더 크다. 💡 골반저 이완·후방 질 확인 = knee-chest, 일반 외음부 시진 = frog leg.",
"2023-L58-Q186": "정답 ① 십자절개술(Cruciate incision). 14세 여아 초경 없음 + 주기적 회음부 압박감·통증 + 질 입구 돌출 말랑말랑한 종괴 + Valsalva 시 더 돌출 → 처녀막 막힘증(Imperforate hymen)의 전형적 소견이다. 혈경(hematocolpos)으로 월경혈이 고여 종괴를 형성한다. 치료는 십자모양 절개(cruciate incision)로 처녀막을 개방하여 혈경을 배출한다. ② 도수정복은 탈출증 등에 사용한다. ③ 요관 스텐트는 요로 폐쇄 치료. ④ 페서리는 골반장기탈출 지지. ⑤ 질 폐쇄술은 탈출 수술의 일종이다. 이미지에서도 질 입구의 팽윤된 처녀막이 보인다.",
"2022-L54-Q145": "정답 ③ A=FSH – B=E2(에스트라디올) – C=LH – D=Progesterone(황체호르몬). 그림의 월경주기 호르몬 곡선(2023-Q108과 동일 구조): A는 난포기에 약간 상승 후 배란 전 소폭 하강하는 FSH, B는 배란 전 첫 peak이 있는 E2(낮은 수준 곡선), C는 배란 직전 극적 surge를 보이는 LH, D는 황체기에만 높게 유지되는 Progesterone이다. 이미지에서 C peak이 가장 날카롭고(LH surge), D가 배란 이후 완만하게 유지됨을 확인한다.",
"2022-L54-Q146": "정답 ② A=GnRH(생식샘자극호르몬분비호르몬) – B=LH·FSH(황체형성호르몬·난포자극호르몬) – C=Estradiol·Progesterone(에스트라디올·황체호르몬). 그림(2022-Q146)은 HPO axis 다이어그램으로, 시상하부에서 A(GnRH)가 뇌하수체로 내려가 B(LH, FSH) 분비를 자극하고, 생식샘(Testis/Ovary)에서 C(테스토스테론/에스트라디올·프로게스테론)가 생성되어 음성 되먹이기를 형성한다. 이미지에서 A가 hypothalamus와 pituitary 사이 화살표, B가 생식샘을 향하는 화살표, C가 되먹이기 화살표에 해당한다.",
"2022-L54-Q180": "정답 ⑤ A=난포막세포(Theca cell) – B=LH – C=과립막세포(Granulosa cell) – D=FSH. 그림(2022-Q180, 2021-Q187과 동일 two-cell theory 다이어그램): 상단 파란 구획(A=난포막세포)에 B(LH)가 수용체에 결합하여 cAMP를 통해 콜레스테롤→안드로겐(androstenedione·testosterone)을 합성하고, 하단 주황 구획(C=과립막세포)에 D(FSH)가 결합하여 aromatase를 활성화, 안드로겐→에스트론·에스트라디올로 전환된다. 💡 Two-cell two-gonadotropin: 난포막(LH→androgens) + 과립막(FSH→aromatase→E2). 참고: 선지 1·3이 동일하여 족보에 '중복 선지 존재' 표기됨.",
"2022-L55-Q136": "정답 ④ Estrogen-progesterone therapy. 16세, 극단적 체중 감량(20kg) 후 무월경, LH 0.5(저하), 프로게스테론 challenge 출혈 없음, E2-P challenge 출혈 있음 → 에스트로겐 부족에 의한 시상하부성 무월경이다. 출혈 없음(프로게스테론 단독) → 자궁내막 자체는 존재하나 에스트로겐 프라이밍이 안 된 상태, E2-P 후 출혈 → 자궁·자궁내막은 정상. 치료의 목표가 임신이 아니고 골 보호·월경 유도라면 E-P 보충요법이 적합하다. ① Gonadotropin, ② Clomiphene은 배란유도 목적으로 임신을 원할 때 사용. ③ GnRH agonist는 에스트로겐을 더 낮추어 악화. ⑤ 수술은 해당 없다.",
"2022-L55-Q142": "정답 ③ 브로모크립틴(bromocriptine). 35세 여성, 유즙분비, 6개월 무월경, 혈청 프로락틴 상승(구체 수치는 문맥에서 높음 시사), TSH 정상, 골반 정상 → 고프로락틴혈증에 의한 무월경이다. 원인이 프로락틴 분비 선종(prolactinoma) 또는 기능성 고프로락틴혈증일 경우 도파민 작용제(브로모크립틴 또는 카베골린)가 일차 치료이다. 향후 임신을 원하므로 배란 회복을 위해서도 브로모크립틴이 적합하다. ① GnRH 작용제는 오히려 억제. ② 클로미펜은 배란유도제이나 프로락틴 문제를 해결하지 못함. ④ TSH 정상이므로 갑상선호르몬 불필요. ⑤ 프로게스테론 단독은 이 환자에게 적합하지 않다.",
"2022-L55-Q178": "정답 ⑤ 뮐러관 무발생증(Mullerian Agenesis, MRKH syndrome). 16세, 46,XX, 유방 Tanner IV, 음모 Tanner IV(정상), 자궁 없음, 질 맹관, 주기적 골반통 없음 → 뮐러관 발생 실패로 자궁·상부 질이 없지만 난소는 정상이어서 이차성징은 정상 발달한다. ④ 안드로겐 무감응 증후군(AIS)은 46,XY이고 음모가 없다. ② 터너 증후군은 45,X(또는 mosaic)이고 이차성징 발달 불량. ③ 처녀막 막힘증은 자궁 존재 + 혈경 + 주기적 통증이 특징이다. 💡 46,XX + 자궁 없음 + 정상 이차성징 + 음모 있음 = MRKH.",
"2022-L55-Q187": "정답 ③ 시상하부기능이상(Hypothalamic dysfunction). 22세, 체중 41kg(BMI 매우 낮음), 1년간 17kg 감량, 엄격한 식사 제한, FSH 1.0(저하), LH 1.5(저하), E2 12(저하), TSH 정상, 프로게스테론 쇠퇴출혈 없음, E2-P 쇠퇴출혈 있음 → 전형적인 기능성 시상하부성 무월경(FHA)이다. 저고나도트로핀성 저에스트로겐 상태로 신경성 식욕부진/체중 감소에 의한 GnRH 분비 억제가 원인이다. ① 안드로겐 무감응은 일차 무월경이고 이차성징 이상. ② 조기 난소 부전은 FSH가 상승한다. ④ 다낭성 난소는 LH 상승·안드로겐 상승이 특징. ⑤ 아셔만 증후군은 E2-P 쇠퇴출혈이 없어야 한다.",
"2022-L55-Q206": "정답 ② 복용약물 중단 후 프로락틴 재검사. 2025-Q43과 거의 동일 임상 시나리오. 우울증약(항우울제·항정신병약 일부) 복용 중인 환자에서 프로락틴 110 ng/mL 상승, 유즙분비, 무월경 → 약인성 고프로락틴혈증 가능성이 높다. 먼저 원인 약물을 정신건강의학과와 협의하여 중단/변경 후 프로락틴을 재측정해야 한다. ① 뇌하수체 MRI는 약인성 배제 후에 시행한다. ③ TSH 정상이므로 Free T4 추가 불필요. ④⑤ 고안드로겐증 의심 근거 없다.",
"2022-L56-Q123": "정답 ① 십자절개술(Cruciate incision). 14세 여아, 초경 없음, 주기적 회음부 압박감·통증, 질 입구 돌출 종괴, Valsalva 악화 → 처녀막 막힘증(imperforate hymen)에 의한 혈경(hematocolpos)이다. 이미지(초음파)에서 자궁 내 혈액 저류(hypoechoic fluid collection)가 보인다. 치료는 십자절개로 처녀막을 개방하고 혈경을 배출한다. ② 도수정복은 탈출증 등 다른 상황에 사용. ③ 요관 스텐트는 요로계 치료. ④ 페서리는 골반장기탈출 지지. ⑤ 질 폐쇄술은 탈출 수술이다.",
"2022-L56-Q125": "정답 ② Frog leg position. 5세 여아 비정상 질출혈로 외음부 진찰 시 이상적인 자세는 frog leg position이다. 소아 외음부 시진의 기본이며 비침습적이고 협조를 얻기 쉽다. ① Supine position만으로는 외음부 시야가 불충분하다. ③ Fowler's는 반좌위로 외음부 진찰에 적합하지 않다. ④ High Fowler's도 마찬가지. ⑤ Trendelenburg는 두부 하강 자세로 외음부 진찰 목적이 아니다.",
"2022-L56-Q218": "정답 ② estrogen cream. 2023-Q101, 2025-Q22와 동일한 3세 여아 음순유착 임상 시나리오. 소아 에스트로겐 결핍성 외음부 위축/음순유착의 일차 치료는 국소 에스트로겐 크림이다. ① topical emollient(보습제)는 단순 건조피부에 사용. ③ metronidazole은 혐기성 감염 치료. ④ medroxyprogesterone, ⑤ clomiphene은 이 상황에 적응증 없다.",
"2021-L79-Q185": "정답 ② A=에스트라디올 – B=난포자극호르몬 – C=난포자극호르몬 – D=황체호르몬. [주의: 선지 ②가 B와 C 모두 '난포자극호르몬'으로 기재되어 있어 표기 오류 가능성 있음]. 그림(2021-Q185, HPO axis 다이어그램)을 보면: 시상하부 아래 A(GnRH)로 뇌하수체를 자극, 뇌하수체에서 B(FSH·LH)가 생식샘으로, 생식샘에서 C(에스트라디올·테스토스테론)가 되먹이기. 다만 선지 구조상 이 문항은 ②가 정답으로 제시되어 있으나 B=C=FSH는 생물학적으로 맞지 않아 문항 자체 오류 가능성이 있다. 이미지에서 A=GnRH, B=FSH·LH, C=성호르몬(E2·T)임을 확인. 💡 불확실 항목으로 표시.",
"2021-L79-Q186": "정답 ⑤ A=과립막세포(Granulosa cell) – B=난포자극호르몬(FSH) – C=난포막세포(Theca cell) – D=황체호르몬(Progesterone? — 단 선지가 'D=황체호르몬'으로 끝남). [주의: 이미지(2021-Q186)는 월경주기 호르몬 그래프로 A-D 위치 확인 가능]. 그래프에서 A(낮고 납작한 선=FSH 또는 E2 기저), B(낮은 수준)는 난포기 초기, C(가장 높은 peak=LH surge 근처 또는 E2 peak), D(황체기 높게 유지=Progesterone)이다. 정답 선지 ⑤에서 A=과립막세포, B=FSH, C=난포막세포, D=황체호르몬이지만, 이 문항은 two-cell 구조 그림이 아닌 호르몬 주기 그래프이므로 문항 배정 불일치 가능성 있음. 💡 불확실 항목으로 표시.",
"2021-L79-Q187": "정답 ② A=난포막세포(Theca cell) – B=LH(황체형성호르몬) – C=과립막세포(Granulosa cell) – D=FSH(난포자극호르몬). 그림(2021-Q187)은 two-cell two-gonadotropin 다이어그램이다. 상단 파란 구획: A(난포막세포)에 B(LH)가 결합 → cAMP → 콜레스테롤→안드로겐. 하단 주황/연두 구획: C(과립막세포)에 D(FSH)가 결합 → aromatase → 안드로겐→에스트라디올. ① A=난포막·B=FSH는 틀림(난포막에는 LH 수용체). ③ A=과립막·B=FSH·C=난포막·D=LH는 구획을 뒤집은 오답. 💡 LH는 난포막세포, FSH는 과립막세포에 작용.",
"2021-L80-Q166": "정답 ⑤ 자궁내막 조직검사(endometrial biopsy). 이 문항은 '시행해야 할 검사가 아닌 것'을 묻는다. 이차성 무월경 감별을 위한 초기 검사로 ① 소변 hCG(임신 배제), ② TSH(갑상선 기능), ③ 혈청 프로락틴(고프로락틴혈증), ④ 혈청 FSH(난소 기능)는 모두 표준 검사이다. 자궁내막 조직검사는 무월경 초기 감별진단에 필요하지 않으며 자궁내막 병변(증식·암) 의심 시에 시행하는 검사로 이 맥락에서 부적절하다. 💡 무월경 초기 workup = hCG, TSH, PRL, FSH/LH, E2 (조직검사 ×).",
"2021-L80-Q171": "정답 ② 뮐러관 무형성증(Mullerian agenesis). 16세, 46,XX, 유방 Tanner 4, 음모 Tanner 4(정상), 자궁 없음, 질 맹관, 주기적 골반통 없음, 후각 정상 → MRKH syndrome이다. 이차성징 정상(난소 기능 보존)이지만 뮐러관 구조물(자궁·상부 질)이 없는 것이 특징이다. ① 터너 증후군은 45,X이고 이차성징 불량. ③ AIS는 46,XY이고 음모 없음. ④ PCOS는 자궁 없음과 무관. ⑤ 처녀막 막힘증은 자궁 존재 + 혈경 + 주기적 통증.",
"2021-L80-Q172": "정답 ⑤ 방사선·항암제 치료에 의한 성선 독성, 자가면역질환 등의 원인이 밝혀져 있다. 36세 여성, FSH 42 mIU/mL(상승), hCG 음성, TSH·PRL 정상 → 조기 난소 부전(Premature Ovarian Insufficiency, POI) 의심. ① FSH 재측정 기준은 25 mIU/mL 이상(15가 아님)이어야 POI 진단 가능. ② POI에서도 자연임신이 5~10% 가능하다(완전 불임이 아님). ③ FMR1 유전자 돌연변이(Fragile X premutation)는 POI의 원인 중 하나로 유전자 검사가 필요하다. ④ POI의 가장 흔한 원인은 특발성이며 흡연이 주 원인은 아니다. 💡 POI 원인: 자가면역, 방사선/항암치료, FMR1 돌연변이, 특발성.",
"2021-L80-Q173": "정답 ④ 수술적 자궁경(Operative hysteroscopy). 자궁난관조영술(HSG) 이미지에서 자궁강 내 다수의 충만 결손(filling defect)이 보인다. 31세, 소파술+자궁내막염 병력 후 무월경·난임 → Asherman syndrome(자궁내막 유착). 치료는 자궁경을 통한 유착 박리술(hysteroscopic adhesiolysis)이다. ① 개복술은 과도한 침습. ② 메토트렉세이트는 자궁외임신 치료. ③ 자궁경부원추절제술은 자궁경부 병변 치료. ⑤ 레트로졸은 배란유도제이다.",
"2021-L80-Q175": "정답 ① 생식선절제술(Gonadectomy). 18세, 46,XY, 유방 Tanner 4, 음모 Tanner 1, 서혜부 종괴(고환), 질 맹관, 자궁 없음, 테스토스테론 11.6(남성 수준) → 완전 안드로겐 무감응 증후군(Complete AIS). AIS에서 복강 내 또는 서혜부에 위치한 고환(dysgenetic gonad)은 성선세포종(gonadal cell tumor, 특히 gonadoblastoma·seminoma) 발생 위험이 있어 성인 이후(이차성징 완성 후) 예방적 생식선절제술을 시행한다. ② 고환고정술은 잠복고환 치료로 AIS에 해당 없다. ③ E-P 보충요법은 생식선절제 후 호르몬 보충으로 시행하지만 악성종양 예방 자체가 목적이 아님. ④ GnRH agonist는 예방 목적 불충분. ⑤ 카베골린은 고프로락틴혈증 치료. 💡 AIS + 복강/서혜부 고환 = 악성 위험 → 생식선절제술.",
"2021-L81-Q165": "정답 ③ 십자모양 절개(Cruciate incision). 11세 여아, 월 1회 주기적 하복부 통증·외음부 통증, 이미지에서 질 입구 팽창된 막(처녀막 혈종, 혈경에 의한 처녀막 막힘증 소견) → 처녀막 막힘증(Imperforate hymen)이다. 초경이 없는 상태에서 월경혈이 고여 혈경·혈자궁을 형성하고 주기적 통증이 발생한다. 치료는 십자절개로 처녀막을 개방한다. ① 경과관찰은 부적절(증상 있음). ② 세침 천자는 일시적이고 감염 위험. ④ 외음부 전절제는 과도한 수술. ⑤ 자궁내시경은 이 단계에서 불필요.",
"2021-L81-Q167": "정답 ④ 국소 에스트로겐 크림 도포(topical estrogen cream). 생후 13개월 여아, 외부 생식기 이상 소견. 이미지(2021-Q71 공유)는 외음부 협착/융합 소견으로 음순유착(labial agglutination/fusion)을 시사한다. 영아기 에스트로겐 결핍 환경에서 발생하는 음순유착의 치료는 국소 에스트로겐 크림 도포이다. ① 경과관찰은 증상이 없을 때 가능하지만 부모가 걱정하여 치료 원하는 경우 크림을 우선 시도한다. ② 경구 항생제, ③ 정맥 항생제는 감염 소견 없는 이 경우에 해당 없다. ⑤ 경구 에스트로겐은 전신 효과로 과도하다.",
"2021-L81-Q174": "정답 ③ 17-하이드록시프로게스테론(17-hydroxyprogesterone, 17-OHP). 7세 여아, 3개월 전부터 여드름·음모(Tanner 2), 유방 미발달(Tanner 1), 키·체중 급증, 골연령 9세(실제 7세보다 앞섬) → 음모 조기발현(premature pubarche) + 성장 가속. 이 패턴은 부신 안드로겐 과잉을 시사하며, 비전형 선천성 부신 과형성(Non-classic CAH, 21-hydroxylase 결핍)을 배제하기 위해 17-OHP를 측정한다. 성장곡선(이미지)에서 키와 체중이 상위 백분위로 급증한 것을 확인할 수 있다. ① TSH는 갑상선 기능 평가로 이 맥락에 우선순위 낮음. ② IGF-1은 성장호르몬 과잉 선별. ④ 경구당부하검사는 성장호르몬 과잉 확진. ⑤ GnRH 자극검사는 성선자극호르몬 의존성 성조숙증 진단이나, 이 환자는 유방 미발달로 성선자극호르몬 의존성이 아닌 말초성(부신 안드로겐 과잉) 가능성이 높다. 💡 음모 있음 + 유방 없음 + 성장 급증 = non-classic CAH 의심 → 17-OHP 측정.",
"2025-L58-Q15": "【정답 ⑤】 혈전 위험 요인이 없는 산욕기 5주차는 WHO Category 2(이득>위험)에 해당한다. 산후 6주 미만의 수유부는 Category 4(사용 금기)이지만, 5주차는 이미 6주 미만 기간의 끝이고 비수유부라면 Category 2로 허용된다. ①유방암(현재) — Category 4 절대금기. ②중증 간경화 — Category 4. ③35세 이상 흡연자 — Category 4. ④aura 동반 편두통 — 뇌졸중 위험 증가로 Category 4. 💡 산후 6주 미만 수유부=Cat4, 6주 이상 수유부=Cat2, 비수유부는 3~4주부터 사용 가능.",
"2025-L58-Q25": "【정답 ③】 성관계 후 82시간이 경과한 시점에는 levonorgestrel(최대 72시간 유효)은 이미 사용 가능 시간이 지났으나, ulipristal acetate(UPA)는 최대 120시간(5일)까지 사후응급피임 효과가 있다. ①dienogest — 자궁내막증 치료제(피임·응급피임 적응증 없음). ②levonorgestrel 1.5 mg — 72시간 이내에만 유효. ④cyproterone acetate — 항안드로겐제(피임 보조). ⑤medroxyprogesterone — 정기 피임주사(응급피임 아님). 💡 72시간 초과~120시간 이내=UPA 30 mg 유일 선택.",
"2025-L58-Q96": "【정답 ②】 복합경구피임제(COC) 장기 복용 시 위험 감소 암: 가(자궁내막암)·다(난소암)가 맞다. COC는 프로게스틴에 의한 자궁내막 증식 억제로 자궁내막암, 배란 억제로 난소암 위험을 각각 약 40~50% 감소시킨다. 나(자궁경부암) — COC는 오히려 위험 약간 증가(HPV 감수성 상승). 라(유방암) — 경미하게 위험 증가 또는 중립. 💡 COC 보호 효과 = 자궁내막암 + 난소암(배란 억제), 이 둘을 묶어 기억.",
"2025-L59-Q13": "【정답 ②】 이 환자는 불규칙 월경, LH:FSH 비 상승(10.2:5.1≈2:1), 총 테스토스테론 120 ng/dL(정상 상한 80 초과), 정상 BMI, 정상 초음파 소견으로 PCOS(다낭성난소증후군) 의심하에 임신을 원하는 상황이다. 현재 1차 배란유도제는 letrozole(방향화효소 억제제)로, FSH 분비를 자극하여 배란을 유도하며 clomiphene 대비 임신율·배란율이 우수하다는 RCT 결과(Legro 2014)에 따라 ASRM 가이드라인은 letrozole을 일차 약제로 권고한다. ①spironolactone — 다모증 치료제, 임신 유도 목적 아님. ③clomiphene — 과거 1차 약제였으나 letrozole로 대체. ④metformin — 인슐린 저항성 동반 시 보조, 단독 배란유도는 2차. ⑤rFSH — 3차 치료. 💡 PCOS+임신 희망=letrozole 1차.",
"2025-L59-Q30": "【정답 ③】 초음파 이미지에서 양측 난소 각각 10개 이상의 소낭포가 necklace sign을 형성하는 전형적 다낭성난소 소견이다. PCOS에서 LH는 난소 내막세포(theca cell)에 작용하여 안드로겐(주로 테스토스테론·안드로스텐디온)을 과잉 합성시킨다. 이 과잉 안드로겐이 여드름·다모증을 일으키고 배란을 억제한다. ①에스트로겐 — FSH 자극으로 과립세포(granulosa cell)에서 합성. ②프로게스테론 — 황체에서 배란 후 분비. ④인히빈 — 과립세포 분비, LH 직접 산물 아님. ⑤인슐린 — 췌장 분비, LH의 직접 산물 아님. 💡 LH → 내막세포 → 안드로겐(테스토스테론).",
"2025-L59-Q55": "【정답 ①】 프로락틴 386 ng/mL은 정상 상한(25)의 15배 이상으로 극도로 상승해 있다. Olanzapine은 도파민 차단으로 프로락틴을 올릴 수 있지만, 약물 유발 고프로락틴혈증은 일반적으로 200 ng/mL를 초과하지 않는다. 이 수준(386 ng/mL)은 뇌하수체 prolactinoma(특히 macroprolactinoma)를 강력히 시사하므로 brain MRI가 우선 시행이다. ②복부 CT — 뇌하수체 병변 확인에 무관. ③Lithium 수치 — 프로락틴 상승 원인이 아님. ④갑상선 초음파 — TSH 정상이므로 불필요. ⑤소변 임신 검사 — hCG 음성으로 배제 완료. 💡 프로락틴 >200 ng/mL = 약물보다 prolactinoma 의심 → MRI 먼저.",
"2025-L60-Q16": "【정답 ①】 Raloxifene은 SERM(선택적 에스트로겐 수용체 조절제)으로 뼈·심혈관에서는 에스트로겐 작용제, 유방·자궁에서는 길항제로 작용한다. 대표 부작용은 안면홍조(혈관운동증상 악화)와 하지정맥혈전증이다. ②유방암 위험 — 감소(에스트로겐 길항). ③비척추골절 예방 — raloxifene은 척추 골절만 감소 확인; 비척추(고관절 등)는 유의미한 예방 효과 없음. ④자궁내막암 위험 — 증가하지 않음(자궁에서 길항). ⑤골밀도 장기 유지 — 중단 시 골밀도 급격히 감소. 💡 Raloxifene = 척추골절 감소 O, 비척추골절 감소 X, 안면홍조 악화 O.",
"2025-L60-Q41": "【정답 ①】 폐경 이행기 초기에는 난소 예비능 감소로 인해 inhibin B가 먼저 떨어지고, 이에 대한 음성 피드백 소실로 FSH가 가장 먼저 상승한다. 이것이 폐경 이행기의 첫 내분비 변화이다. ②inhibin A — 황체에서 분비되며 초기에는 오히려 정상이거나 LH 자극에 반응해 증가할 수 있으나 감소가 첫 변화는 아님(inhibin B가 먼저). ③TSH — 폐경 이행과 직접 연관 없음. ④LH — FSH보다 나중에 상승. ⑤Testosterone — 폐경 이행기에 큰 변화 없음. 💡 폐경 초기 = Inhibin B↓ → FSH↑(가장 이른 변화).",
"2025-L60-Q53": "【정답 ⑤】 FSH 65(↑), E2 10 pg/mL(↓), TSH·PRL 정상 → 폐경 확정. 자궁절제술을 받았으나 왼쪽 난소만 절제, 오른쪽 난소는 존재 여부 불명확. 문제에서 '왼쪽 난소 및 자궁절제술'이므로 자궁은 없다. 자궁이 없으면 프로게스테론을 추가할 자궁내막 보호 필요가 없으므로 에스트로겐 단독 요법이 원칙이다. 그러나 이 문항의 정답이 ⑤(E+P 병합)인 것은 — 자궁내막증 병력이 있기 때문이다. 자궁내막증은 자궁절제 후에도 잔존 병소가 있을 수 있고, 에스트로겐 단독은 잔존 자궁내막증 조직을 자극하여 악화시킬 위험이 있어 병합요법을 권고한다. 💡 자궁절제 + 자궁내막증 병력 = 에스트로겐 단독 금지 → E+P 병합.",
"2023-L59-Q129": "【정답 ③】 COC에서 WHO Category 4(절대 금기)는 혈전·심혈관·에스트로겐 의존성 악화 위험이 극히 높은 상태다. Aura 동반 편두통은 허혈성 뇌졸중 위험이 에스트로겐으로 현저히 증가하여 Category 4다. ①경증 간경화 — Category 3(일반적으로 금기이나 상대적). ②유방암 가족력 — Category 1~2(가족력 자체는 절대 금기 아님). ④산후 7주 이상 수유부 — Category 2. ⑤혈소판감소증 동반 전신루푸스 — Category 3~4이나 aura 편두통이 더 명확한 Cat4. 💡 COC Cat4 핵심: 현재 유방암, DVT/PE, aura 편두통, 산후 6주 미만 수유부, 중증 간경화·간세포암.",
"2023-L59-Q160": "【정답 ④】 COC와 LNG-IUD의 공통 비피임 이점: 월경통 호전, 월경과다 호전, 자궁내막증 재발 방지, 골반염 예방(정자 이동 차단 등), 빈혈 예방 등이다. 류마티스관절염 감소는 COC의 고유한 이점이며, LNG-IUD의 효능으로는 보고되지 않아 '공통' 이점으로 볼 수 없다. 💡 COC 고유: 류마티스관절염 감소, 난소암·자궁내막암 예방. LNG-IUD 고유: 국소 프로게스틴 효과, 전신 부작용 최소.",
"2023-L59-Q184": "【정답 ③】 프로게스틴 피하이식기구(임플라논, etonogestrel)에서 WHO Category 4(절대 금기)는 현재 유방암이다. 유방암은 호르몬(프로게스틴 포함) 감수성이 있어 악화 위험. ①난소암, ②자궁경부암 — Category 1~2(피임기구 사용 가능). ④현재 골반내감염 — IUD 삽입 시 중요한 금기이나 피하이식기구는 상관없음(Category 1). ⑤자궁강 변형 — IUD 삽입 금기이지 피하이식기구와 무관. 💡 임플라논 Cat4: 현재 유방암만이 핵심 절대금기.",
"2023-L60-Q125": "【정답 ③】 초음파 이미지: 양측 난소에 주변부로 배열된 소낭포 다수(necklace sign) — 전형적 PCOS 소견. PCOS에서 LH 과잉은 난소 내막세포(theca cell)의 안드로겐 합성 경로를 자극하여 주로 테스토스테론을 과잉 생성시킨다. 이 테스토스테론이 여드름·다모증·희소월경을 유발한다. ①에스트로겐 — 과립세포(FSH 자극). ②프로게스테론 — 황체 분비. ④인히빈 — 과립세포 분비. ⑤인슐린 — 췌장 분비. 💡 LH → theca cell → 안드로겐(테스토스테론/안드로스텐디온).",
"2023-L60-Q152": "【정답 ②】 우울증 약(항정신병제·SSRI·TCA 중 도파민 차단 계열)을 복용 중이며 프로락틴 110 ng/mL(정상 상한 25)로 4배 이상 상승 → 약물 유발 고프로락틴혈증 가능성이 높다. 이 경우 다음 단계는 해당 약물 중단 후 프로락틴 재검사다. 약물 중단 불가 시 약물 변경 후 재검사. 프로락틴이 200 이하이면 약물 원인 가능성이 높고, 약물 중단 후에도 여전히 상승하면 MRI로 prolactinoma 확인한다. ①뇌하수체 MRI — 약물 원인 배제 전 시행하면 과잉 진단. ③Free T4 — TSH 정상이라 갑상선 기능 이상 가능성 낮음. ④Free testosterone — 안드로겐 과잉 의심 소견 없음. ⑤17-OHP — 부신기능이상 감별에 필요하나 현재 우선 순위 낮음. 💡 약물 복용 + 프로락틴 경등도 상승 → 약물 중단 후 재검 먼저.",
"2023-L60-Q168": "【정답 ②】 불규칙 월경, LH:FSH≈2:1 상승, 총 테스토스테론 120 ng/dL(↑), 정상 BMI, 정상 초음파 → PCOS. 임신 희망 시 현행 1차 배란유도제는 letrozole(방향화효소 억제제). Letrozole은 에스트로겐 생성을 차단해 FSH 분비를 증가시켜 단일 우성 난포 발달을 유도한다. ①spironolactone — 다모증/여드름 치료; 임신 유도 목적 아님. ③clomiphene — 이전 1차 약제; 현재 가이드라인에서 letrozole에 의해 대체됨. ④metformin — 인슐린 저항성 동반 시 보조제; 단독 배란유도 효과 letrozole에 열등. ⑤rFSH — 2~3차 치료.",
"2023-L61-Q100": "【정답 ④】 51세, 자궁적출술 병력(자궁 없음), 안면홍조·식은땀 5개월 → 폐경 의심. 폐경 진단의 표준 검사는 혈중 FSH(난포자극호르몬)다. FSH ≥40 mIU/mL이면 폐경으로 확정한다. ①프로락틴 — 유루증·무월경이 동반될 때 검사. ②테스토스테론 — 안드로겐 과잉이나 성욕 감소 평가 목적. ③프로게스테론 — 배란 여부 확인; 이미 폐경 의심 상황에서 주된 진단 검사 아님. ⑤LH — FSH와 함께 상승하나, FSH가 더 예민한 폐경 표지자. 💡 폐경 확인 = FSH 측정 (≥40 IU/L).",
"2023-L61-Q110": "【정답 ③】 WHI(Women's Health Initiative) 연구에서 에스트로겐 단독 요법(자궁 없는 여성 대상) 시행 결과: 위험 증가 — 뇌졸중, DVT/PE. 위험 감소 — 고관절 골절, 당뇨, 관상동맥질환(에스트로겐 단독군에서 유방암은 감소 또는 중립). ①요추 골다공증 — 위험 감소(뼈 보호 효과). ②고관절 골절 — 감소. ④부정맥 — WHI에서 주요 outcome 아님. ⑤치매 — 에스트로겐 단독군에서 인지 보호 효과 일부 논문에서 있음. 💡 에스트로겐 단독: 뇌졸중·PE 증가 / 골절·관상동맥질환 감소(자궁 없는 군).",
"2023-L61-Q124": "【정답 ⑤】 FSH 54(↑), E2 12(↓), TSH·PRL 정상 → 폐경 확정. 자궁내막증으로 왼쪽 난소 및 자궁절제술 시행 → 자궁 없음. 자궁이 없으면 통상 에스트로겐 단독 요법이 원칙이나, 자궁내막증 병력이 있으므로 잔존 병소 자극을 막기 위해 에스트로겐-프로게스테론 병합요법을 사용한다. ①에스트로겐 단독 — 자궁내막증 잔존 시 병소 자극 위험. ②프로게스테론 단독 — 혈관운동증상 호전 불충분. ③letrozole — 방향화효소 억제제(배란유도·유방암 보조요법). ④cabergoline — 도파민 수용체 작용제(프로락틴종 치료). 💡 자궁절제 + 자궁내막증 병력 = E+P 병합요법.",
"2022-L57-Q133": "【정답 ④】 COC와 LNG-IUD의 공통 비피임 이점: 월경통 호전, 월경과다 호전, 빈혈 예방, 골반염 예방(일부), 자궁내막증 약물 치료. 류마티스관절염 감소 — COC의 고유한 이점(에스트로겐의 면역조절 효과); LNG-IUD는 국소 작용 위주로 이 효과 없음. ⑤자궁내막증 수술 후 약물 치료 — 두 방법 모두 자궁내막증 재발 방지에 사용 가능하여 공통 이점에 해당.",
"2022-L57-Q153": "【정답 ④】 복용 잊었을 때 7일 추가 피임이 필요한 경우: EE 30 μg 제제는 3일 이상 누락 시 추가 피임 필요(나), EE 20 μg 제제는 용량이 낮아 2일 이상 누락 시 추가 피임 필요(라). EE 30 μg 1~2일 누락(가)과 EE 20 μg 1일 누락(다)은 추가 피임 불필요. 이미지 확인: '나(EE 30μg 3일 이상)·라(EE 20μg 2일 이상)' 조합이 정답. 💡 저용량(20 μg)은 더 일찍(2일 이상)부터 추가 피임 필요 — 용량이 낮을수록 허용 누락일이 짧다.",
"2022-L57-Q202": "【정답 ⑤】 COC Category 4 절대 금기: 현재 유방암, DVT/PE(현재·과거), aura 편두통, 산후 6주 미만 수유부, 심각한 심혈관질환, 중증 간경화·간세포암 등. 산후 6주 미만 수유부는 모유에 에스트로겐 전달 및 혈전 위험으로 Category 4다. ①경증 간경화 — Category 3. ②유방암 가족력 — Category 1~2. ③중증 혈소판감소증 — 출혈 위험이지만 COC Category 4 전통 목록 아님(Category 3). ④aura 없는 편두통 — Category 2~3(aura 없으면 상대적 주의). 💡 aura 유=Cat4, aura 무=Cat2~3 차이 주의.",
"2022-L58-Q150": "【정답 ②】 불규칙 월경, LH:FSH≈2:1, 테스토스테론 수치 정상 상한 범위 내 가정, 정상 BMI, 초음파 정상 → PCOS 또는 기능성 희소배란. 임신을 희망하므로 배란유도가 목적이며, 현행 1차 약제는 letrozole(방향화효소 억제제). ②letrozole 선택. ①spironolactone — 다모증/여드름 치료. ③cyclic progestogen — 소퇴성 출혈 유도(자궁내막 보호); 배란 유도 아님. ④metformin — 인슐린 저항성 동반 보조. ⑤rFSH — 2~3차 치료. 💡 이 문항은 2025-Q13·2023-Q168과 같은 임상 시나리오 변형.",
"2022-L58-Q163": "【정답 ④】 초음파 이미지에서 양측 난소에 다낭성 소견(주변부 소낭포 배열). 22세 여성, 초경부터 희소월경, 비만(BMI 약 28.5), 다모증·여드름, 최근 체중 증가 후 무월경 → PCOS 확진. PCOS에서 만성 에스트로겐 노출(무배란으로 프로게스테론 길항 없음) → 자궁내막 과증식 → 자궁내막암(자궁내막 선암) 위험이 가장 높다. ①골다공증 — PCOS는 에스트로겐 수준이 유지되어 골밀도 감소 위험 낮음. ②부신증식증 — 안드로겐 과잉이나 PCOS에서 직접 합병증 아님. ③자궁근종 — 에스트로겐 의존성이나 PCOS의 대표 합병증 아님. ⑤갑상선기능항진증 — TSH 정상이므로 무관. 💡 PCOS 무배란 → 만성 에스트로겐 unopposed → 자궁내막암 위험 증가.",
"2022-L58-Q174": "【정답 ⑤】 초음파 이미지: 양측 난소 다낭성 소견. 23세 여성, 초경부터 희소월경(35~49일), 최근 6개월 1회 월경, 여드름, 비만(BMI 33.2), 허리둘레 82cm → PCOS 전형. LH → 난소 내막세포(theca cell) → 안드로겐(주로 안드로스텐디온 → 테스토스테론) 과잉 합성. 이 문항은 2023년/2025년 같은 시나리오에서 ③테스토스테론을 정답으로 제시한 것과 달리 ⑤안드로겐을 답으로 제시하였다. '안드로겐'은 테스토스테론을 포함하는 상위 개념으로, 이 문항에서는 안드로겐(테스토스테론 포함 상위 범주)이 정답. 💡 LH → theca cell → 안드로겐 과잉 = PCOS 병태생리 핵심. 연도별로 테스토스테론 또는 안드로겐으로 표현 차이 있음.",
"2022-L59-Q169": "【정답 ⑤】 51세, 자궁선근증으로 자궁절제술 병력, 안면홍조·식은땀 5개월 지속 → 폐경 의심. 폐경 확인을 위한 표준 검사는 혈중 FSH다. 자궁이 없어 월경 유무로 폐경 판단 불가하므로 FSH 측정이 더욱 중요하다. ①프로락틴, ②테스토스테론, ③프로게스테론 — 혈관운동증상의 폐경 진단에 주된 역할 없음. ④LH — 폐경 시 상승하나 FSH가 더 민감하고 표준적. 💡 자궁절제 후 월경 없는 환자의 폐경 진단 = FSH 측정.",
"2022-L59-Q179": "【정답 ⑤】 자궁내막증으로 왼쪽 난소 및 자궁절제술 시행 → 자궁 없음. 폐경 증상(안면홍조·수면장애)으로 호르몬 치료 필요. 자궁이 없으면 통상 에스트로겐 단독이나, 자궁내막증 병력으로 잔존 병소 자극 방지를 위해 에스트로겐-프로게스테론 병합요법이 권고된다. 이 패턴은 2023-L61-Q124, 2025-L60-Q53과 동일 원리. 💡 자궁절제+자궁내막증 병력 = E+P 병합 (자궁내막증 잔존 보호).",
"2022-L59-Q198": "【정답 ④】 자궁 있는 50세 폐경 여성에서 호르몬 요법(HRT) 시작 시 올바른 지식: ①혈관운동증상 완화에 HRT가 가장 효과적 — 사실. ②비만+대사증후군 위험 — 경피 투여가 간 초회 통과 효과 없어 혈전 위험 낮아 선호 — 사실. ③골밀도 감소 예방에 칼슘·비타민D 병용 강조 — 사실. ⑤자궁 있는 여성 → E+P 병합요법 — 자궁내막 보호를 위해 사실. ④오답: '유방암 병력, 활동성 혈전색전증, 간질환 등 동반 시 에스트로겐 단독 시행' — 이 경우는 에스트로겐 자체가 금기이므로 '단독 시행'이 아니라 HRT 전체 금기다. 에스트로겐 단독은 자궁 없는 여성에 한하고, 위 금기 사항이 있으면 HRT를 사용하지 않는다. 💡 유방암·혈전·중증 간질환 = HRT 절대 금기, 에스트로겐 단독으로 대체 불가.",
"2022-L59-Q211": "【정답 ④】 WHI 에스트로겐 단독 요법(자궁절제 여성): 위험 감소 — 고관절 골절, 당뇨. 위험 증가 — 뇌졸중, DVT/PE. 유방암은 에스트로겐 단독군에서 오히려 감소 또는 중립(E+P 병합군에서는 증가). ①직장암, ②대장암 — E+P 병합에서 감소(에스트로겐 단독군 데이터 불명확). ③폐색전증 — 증가. ⑤뇌졸중 — 증가. 💡 에스트로겐 단독 = 고관절 골절 감소 / 뇌졸중·PE 증가. E+P 병합 = 대장암·골절 감소 / 유방암·뇌졸중·PE·관상동맥 증가.",
"2021-L82-Q168": "【정답 ⑤】 COC Category 4 절대 금기 중 '과거 또는 현재 정맥혈전증(DVT/PE)'이 포함된다. 에스트로겐은 응고인자(II, VII, VIII, X) 생성을 촉진하여 혈전 위험을 증가시키므로, 이미 혈전 병력이 있는 경우 COC는 절대 금기다. ①경증 간경화 — Category 3. ②유방암 가족력 — Category 1~2. ③중증 혈소판감소증 — 출혈 위험; COC Cat4 기준에서 전통적 항목은 아님. ④aura 없는 편두통 — Category 2~3. 💡 DVT/PE 병력 + 에스트로겐 = 재발 위험 극히 높음 → Category 4.",
"2021-L82-Q169": "【정답 ④】 COC와 LNG-IUD의 공통 비피임 이점: 빈혈 예방, 월경통 호전, 월경과다 호전, 자궁내막증 수술 후 약물 치료. 류마티스관절염 감소 — COC(경구 에스트로겐·프로게스틴의 면역조절) 고유 이점으로, LNG-IUD(국소 프로게스틴)는 이 효과가 없어 '공통' 이점으로 볼 수 없다. 💡 반복 출제 포인트: 류마티스관절염 감소는 COC 고유, LNG-IUD와 공통되지 않음.",
"2021-L82-Q170": "【정답 ④】 이미지 확인: 선택지 내용 — 가(EE 30μg 1~2일 누락), 나(EE 30μg 3일 이상 누락), 다(EE 20μg 1~2일 누락), 라(EE 20μg 2일 이상 누락). 7일 추가 피임 필요 기준: 고용량(30μg) 제제는 3일 이상 누락 시(나), 저용량(20μg) 제제는 2일 이상 누락 시(라) 추가 피임 필요. 따라서 나+라 = ④. 저용량 제제는 호르몬량이 적어 더 일찍 난소 억제가 풀려 추가 피임이 필요하다. 💡 저용량(20μg) > 고용량(30μg): 더 일찍 추가 피임 필요(허용 누락일 짧음).",
"2021-L83-Q176": "【정답 ④】 Rotterdam 기준(2003): PCOS 진단은 다음 3가지 중 2가지 이상 충족. (1) 희소배란/무배란, (2) 임상적 또는 생화학적 고안드로겐혈증, (3) 초음파에서 다낭성난소 소견. 75g 경구 당부하검사(OGTT)는 인슐린 저항성/당뇨 선별을 위한 추가 검사이지 진단 기준 항목이 아니다. ①다모증 — 고안드로겐증의 임상 소견 (진단 기준 항목). ②희소월경 — 희소배란의 반영 (진단 기준 항목). ③serum testosterone — 생화학적 고안드로겐혈증 (진단 기준 항목). ⑤초음파 다낭성난소 — 진단 기준 항목. 💡 Rotterdam 기준: 희소배란 + 고안드로겐 + 다낭성초음파 (3중 2 이상). OGTT는 기준 항목 아님.",
"2021-L83-Q177": "【정답 ④】 24세, 6개월 무월경, 다낭성난소(초음파), 비만, 다모증·여드름 없음 → PCOS 진단. 자궁내막 15mm로 증가 → 무배란으로 인한 에스트로겐 unopposed. 초기 처치 순서: (1) 기초 호르몬 검사(LH/FSH, testosterone, TSH/PRL) 시행, (2) 임신 제외(요 hCG 이미 음성), (3) 자궁내막 과증식 방지를 위해 프로게스테론 소퇴성 출혈. Metformin 투여 후 배란 확인은 임신을 원하지 않는 현재 상황에서 초기 처치로 적절하지 않다 — metformin 단독 배란유도는 효과가 느리고, 배란 확인보다 자궁내막 보호가 우선이다. 💡 PCOS 초기: 호르몬 검사 + 자궁내막 보호(프로게스테론 소퇴성 출혈) 먼저, metformin은 대사 관리 보조제.",
"2021-L83-Q179": "【정답 ④】 이미지(혈액검사 결과): 갑상샘자극호르몬 2.3(정상), 프로락틴 15(정상), 황체형성호르몬 12.8(정상~경미한 상승), 난포자극호르몬 5.5(정상), 에스트라디올 33(정상), 총 테스토스테론 82(정상 상한 경계). 29세 여성, 불규칙 월경, 여드름·다모증 → PCOS 의심. 임신 희망 → 배란 유도가 목적. 경구배란유도제(letrozole 또는 clomiphene)가 1차 치료로 적합하다. ①인공수정 — 1차 약물 치료 실패 후 고려. ②체외수정 — 2~3차 치료. ③복합경구피임제 — 피임 목적; 임신 희망 시 사용 금지. ⑤항안드로겐제제 — 다모증/여드름 치료, 임신 유도 아님(기형 유발 위험). 💡 PCOS + 임신 희망 = 경구배란유도제(letrozole > clomiphene) 1차.",
"2021-L84-Q178": "【정답 ①】 WHI E+P 병합 요법(자궁 있는 여성): 위험 감소 — 대장암, 고관절 골절. 위험 증가 — 유방암, PE, 뇌졸중, 관상동맥질환(발병 초기). 대장암은 E+P 병합군에서 유의하게 위험이 감소한다. ②유방암 — 증가. ③폐색전증 — 증가. ④관상동맥질환 — 전체 WHI 추적 기간에서 중립 또는 경미 증가(조기 개시 시 일부 감소). ⑤뇌졸중 — 증가. 💡 E+P 병합 위험 감소: 대장암·골절. 증가: 유방암·뇌졸중·PE.",
"2021-L84-Q180": "【정답 ⑤】 48세, 자궁선근증으로 자궁절제술 병력(자궁 없음), 안면홍조·발한 6개월 → 폐경 의심. 폐경 진단을 위한 우선 검사는 혈중 FSH. 자궁이 없어 월경 여부로 폐경 추정 불가하므로 혈청 FSH 측정이 필수. ①프로락틴, ②에스트로겐, ③프로게스테론 — 폐경 일차 진단 검사로 부적절. ④LH — 폐경 시 상승하지만 FSH가 더 민감한 표준 지표. 💡 동일 패턴 반복 출제: 자궁절제 + 혈관운동증상 → FSH 측정으로 폐경 확인.",
"2021-L84-Q181": "【정답 ③】 49세, 자궁근종 및 우측 난소 자궁내막종으로 자궁절제술 + 오른쪽 난소절제술. 왼쪽 난소는 보존. 혈액검사(이미지 없으나 지문 일부): TSH 2.0(정상), 이하 FSH·E2는 폐경 범주 추정. 자궁이 없으므로 에스트로겐 단독 요법이 기본이다. 그러나 자궁내막증(자궁내막종) 병력이 있으므로 잔존 병소 자극을 막기 위해 에스트로겐-프로게스테론 병합요법을 선택한다. ①에스트로겐 단독 — 자궁내막증 잔존 병소 자극 위험. ②프로게스테론 단독 — 혈관운동증상 호전 불충분. ④카베르고린 — 프로락틴종 치료제. ⑤레보티록신 — 갑상선기능저하증 치료. 💡 자궁절제 + 자궁내막증(자궁내막종) 병력 = E+P 병합요법 선택.",
"2022-L60-Q78": "【주제: 프롤락틴선종 치료】\n정답 ③ 도파민 작용제. Prolactin 451 ng/mL(정상 3–25)로 고프롤락틴혈증이 뚜렷하고, MRI에서 뇌하수체 종양이 보인다. 프롤락틴선종의 1차 치료는 도파민 작용제(cabergoline 또는 bromocriptine)이며, 약물로 prolactin 정상화와 종양 축소를 기대할 수 있다.\n오답: ① 추적관찰 — prolactin이 매우 높고 증상(월경불순·유루증)이 명확하므로 치료가 필요하다. ② 소마토스타틴 작용제 — GH·IGF-1이 정상이므로 말단비대증이 아니다. ④ 방사선치료 / ⑤ 수술 — 약물 실패 또는 큰 종양·시신경 압박 시 고려하는 2차 선택이다.",
"2022-L60-Q23": "【주제: 말단비대증 선별검사】\n정답 ⑤ IGF-1(인슐린유사성장인자-1). 얼굴 이마·턱 돌출, 손발이 굵어지는 전형적인 말단비대증(acromegaly) 소견이다. 선별검사로는 GH보다 IGF-1이 우선이며, 반감기가 길어 하루 중 변동이 적어 신뢰도가 높다.\n오답: ② 성장호르몬 — GH는 박동성 분비로 단일 측정값의 진단 가치가 낮다. 나머지 ①③④는 이 임상상과 무관하다.\n💡 말단비대증 선별 = IGF-1 → 확진 = OGTT 중 GH 억제 실패.",
"2022-L60-Q104": "【주제: 뇌하수체 졸중(pituitary apoplexy) 응급처치】\n정답 ① 5% 포도당 생리식염수. 비기능성 뇌하수체선종 추적 중 갑작스러운 두통·저혈압(80/50 mmHg)·저혈당(52 mg/dL)은 뇌하수체 졸중에 의한 급성 범하수체기능저하증(panhypopituitarism)이다. 즉각적인 수액 소생(포도당+식염수)으로 저혈당·쇼크를 교정하고, 스트레스 용량의 glucocorticoid(hydrocortisone)를 투여해야 한다.\n오답: ②③④ 성장호르몬·갑상선·남성호르몬 — 응급이 아니며, 부신피질호르몬 교정이 우선이다. ⑤ 항생제 — 감염 증거 없음.\n💡 응급 우선순위: 수액 → 스트레스 코티솔 → 이후 다른 호르몬 보충.",
"2022-L60-Q101": "【주제: 쿠싱증후군 선별검사】\n정답 ⑤ 1mg 하룻밤 덱사메타손 억제검사(1mg overnight DST). 쿠싱증후군 선별에 사용되는 표준검사다. 24시간 요 유리 코티솔(24h UFC) 및 자정 타액 코티솔도 선별검사로 인정된다.\n오답: ① CRH test — 원인 감별(뇌하수체 vs 이소성)에 쓰는 확진 검사다. ② Spot urine free cortisol — 24시간 소변이 아닌 단회 소변은 표준 선별이 아니다. ③ Early morning salivary cortisol — 자정(midnight) 타액이 표준이며, 이른 아침 타액은 선별로 사용하지 않는다. ④ High-dose DST — 원인 감별용, 선별·확진 아님.\n💡 쿠싱 선별 3종: 1mg overnight DST / 24h UFC / 자정 타액 코티솔.",
"2022-L60-Q73": "【주제: 갈색세포종(pheochromocytoma) 치료】\n정답 ① Right adrenalectomy → 오답 해설 참조; 실제 정답은 ① (문항 파싱 오류로 보기 번호가 밀려 있으나 answer=[1]). 24시간 소변 메타네프린·노르메타네프린이 각각 정상의 15배·5배로 극도로 상승하여 양측 부신의 갈색세포종이 확실하다. 양측 모두 병변이 있으므로 bilateral adrenalectomy가 원칙이지만, 보기 구성상 정답은 선지 ①(문항 파싱상)으로 기록됨.\n💡 실제 임상: 양측 갈색세포종은 수술 전 α-차단제(phenoxybenzamine) → 이후 β-차단제 선 투여 후 수술. Mitotane은 부신피질암에 사용하므로 오답.",
"2022-L60-Q85": "【주제: 아급성 갑상선염(de Quervain)】\n정답 ③ 아급성 갑상선염. COVID-19 감염 1~2주 후 발열·갑상선 압통·귀 방사통이 동반된 전형적인 아급성(육아종성) 갑상선염 소견이다. T3↑·FT4↑·TSH↓의 갑상선중독증도 파괴성 유리에 의한 것이다.\n오답: ① 무통성 갑상선염 — 압통이 없고 바이러스 선행감염이 없다. ② 그레이브스 갑상선기능항진증 — 방사성요오드 섭취↑, 압통 없음. ④ 하시모토 — 만성·무통성. ⑤ 급성 세균성 갑상선염 — 훨씬 심한 발열·화농.\n💡 아급성 갑상선염: ESR↑↑, 방사성요오드 섭취↓, NSAIDs 또는 스테로이드 치료.",
"2022-L60-Q47": "【주제: 갑상선기능항진증 원인 감별 — 방사성요오드 스캔】\n정답 ② 갑상선 스캔(방사성요오드 스캔). 무통성 경부 부종 + 갑상선중독증(T3↑·FT4↑·TSH↓)에서 원인이 그레이브스병인지 파괴성 갑상선염(섭취↓)인지 구별하려면 방사성요오드 섭취·스캔이 핵심이다.\n오답: ① 갑상선 초음파 — 형태 확인에 유용하나 기능적 원인 감별에는 부족하다. ③ 갑상선 생검 — 기능 감별에는 불필요. ④ TRH자극검사 — 현재는 거의 사용하지 않음. ⑤ T3억제스캔 — 구식 검사.",
"2022-L60-Q74": "【주제: 저칼슘혈증 원인 감별】\n정답 ⑤ 비타민 D 부족. Ca 7.5↓, P 2.4↓(저인산혈증), PTH 250↑(반응성 상승), ALP 950↑(골회전↑), 알부민 3.7(경도↓), 매일 음주·실내 생활 → 비타민 D 결핍에 의한 골연화증 패턴이다.\n오답: ① 일차성 부갑상선기능항진증 — Ca↑, PTH↑; 여기선 Ca↓. ② 유전성 부갑상선기능저하증 — PTH↓. ③ 저마그네슘혈증 — PTH 분비 억제이지만, 음주력보다 비타민D 결핍이 전체 소견 합치도가 높다. ④ 만성 신부전 — Cr 정상(0.9)이므로 해당 없음.\n💡 Ca↓+P↓+PTH↑+ALP↑ = 비타민 D 결핍(골연화증).",
"2022-L60-Q70": "【주제: 골다공증 위험인자】\n정답 ① 남자(남자는 위험인자가 아닌 것). 여자에 비해 남자는 골다공증 위험이 낮으므로 '위험인자가 아닌 것'에 해당한다.\n나머지 ②스테로이드·③흡연·④음주·⑤활동량 감소는 모두 이차성 골다공증 및 골절의 확립된 위험인자다.\n💡 골다공증 주요 위험인자: 여성·고령·저체중·흡연·음주·스테로이드·칼슘/VitD결핍·운동부족.",
"2022-L60-Q155": "【주제: 부종+고콜레스테롤혈증+단백뇨 — 불필요한 검사】\n정답 ⑤ 혈중 비타민D 정량. 부종·고콜레스테롤(396 mg/dL)·단백뇨 2+는 신증후군(nephrotic syndrome)을 강력히 시사한다. 신증후군 워크업에는 당화혈색소(당뇨신병증 감별)·갑상선기능검사(갑상선저하증 감별)·요단백정량·LDL 정량이 모두 필요하나, 비타민D 측정은 우선순위 진단검사가 아니다.\n오답 설명: ①~④는 원인 규명 및 합병증 평가에 직접 관련.",
"2022-L60-Q160": "【주제: 고지혈증 배경 — 갑상선기능저하증 배제】\n정답 ④ 갑상선기능검사(Thyroid function test). 6개월 간 피곤감·체중증가·변비 + 고콜레스테롤·고중성지방은 갑상선기능저하증의 전형적인 이차성 고지혈증이다. 지질강하제를 먼저 투여하면 원인을 놓친다.\n오답: ①②③⑤ 지질강하제 및 요검사는 원인 감별 없이 투여하면 부적절하다.\n💡 이차성 고지혈증 배제 순서: 갑상선↓, 신증후군, 당뇨, 간질환 먼저 확인.",
"2022-L60-Q196": "【주제: 중증 갑상선기능저하증 + 이차성 고지혈증 치료】\n정답 ③ 갑상선 호르몬 투여. TSH 118 μIU/mL, FT4 0.2 ng/dL, TPO Ab (+++)로 하시모토 갑상선염에 의한 심한 원발성 갑상선기능저하증이다. TG 1600 mg/dL의 극심한 고중성지방혈증과 AST/ALT 상승, CPK 상승도 모두 갑상선저하증의 이차 소견이다. 원인 치료(갑상선 호르몬)가 가장 먼저이며, 이후 지질 지표를 재평가한다.\n오답: ①②④⑤ 지질강하제 — 원인 교정 전 투여는 적절하지 않고, 갑상선 호르몬 보충 후 지질이 상당 부분 개선된다.",
"2022-L60-Q188": "【주제: 소아 성장부진 — 갑상선기능저하증】\n정답 ③ 혈청 유리 티록신(Free T4). 8세 남아에서 성장부진(6개월 1.5 cm), 체중증가(3 kg), 피로, 낮잠 증가, 변비 양상(장음 감소)은 선천성 또는 후천성 갑상선기능저하증 패턴이다. 선별을 위해 TSH와 Free T4 측정이 필요하며, 보기 중 가장 적합한 것은 Free T4(혈청 유리 티록신)이다.\n오답: ① 수분제한검사 — 요붕증 진단. ② 소변 유리 코티솔 — 쿠싱증후군. ④ ACTH — 부신기능. ⑤ 성장호르몬자극검사 — GH 결핍 의심 시, 하지만 갑상선기능저하가 더 우선 배제.",
"2022-L60-Q143": "【주제: 뇌하수체수술 후 남성 불임 — 정자형성 촉진】\n정답 ① hCG + recombinant FSH 유지. 뇌하수체선종 수술 후 성선자극호르몬 결핍(hypogonadotropic hypogonadism)으로 무정자증이다. hCG로 고환 내 테스토스테론을 상승시키고, FSH를 추가해 정자형성을 유도하는 치료가 표준이다. 3개월 시점은 아직 초기로, 정자형성에는 보통 3~24개월이 필요하므로 현 요법을 유지한다.\n오답: ② 테스토스테론 추가 — 외인성 테스토스테론은 정자형성을 억제한다(negative feedback). ③ hCG 증량 — 테스토스테론은 이미 정상화됐으므로 증량 불필요. ④ GnRH 펌프 — 뇌하수체 기능이 없으면 효과 없음. ⑤ ICSI — 아직 내과적 치료를 최대화하지 않은 단계.",
"2022-L60-Q190": "【주제: 원발성 고환부전 확진 — 염색체검사】\n정답 ④ 염색체검사. 양측 소고환(5 mL), LH↑·FSH↑·Testosterone↓, 무정자증은 원발성 고환부전(primary testicular failure)이다. 가장 흔한 원인은 클라인펠터증후군(47,XXY)이므로 염색체검사(핵형분석)로 확진한다.\n오답: ① 경직장초음파 — 전립선·사정관 평가, 이 경우 불필요. ② Sellar CT — 뇌하수체 종양 의심 시; 여기서는 LH/FSH↑이므로 중추성 아님. ③ GnRH 자극검사 — 시상하부 원인 감별 시; 이미 고성선자극호르몬혈증. ⑤ 고환생검 — 염색체 이상 배제 후 고려.",
"2022-L60-Q170": "【주제: 피임 선택 — 흡연 비만 과다월경】\n정답 ③ 레보노게스트렐분비 자궁내장치(LNG-IUD, 미레나). 흡연(≥35세 또는 흡연 여성)과 비만(BMI 30)이 있는 경우 에스트로겐 함유 복합경구피임약은 혈전 위험으로 금기다. LNG-IUD는 에스트로겐 없이 프로게스틴 국소 작용으로 과다월경·생리통도 현저히 감소시킨다.\n오답: ① 난관결찰술 — 영구적; 산과력 2-0-0-2인 환자에게 과도한 선택. ② 남성 콘돔 — 피임 효율 낮고 월경 과다 개선 없음. ④ 복합경구피임약 — 흡연+비만에서 VTE 위험으로 상대적 금기. ⑤ 살정제 — 피임 효율 매우 낮음.",
"2022-L60-Q177": "【주제: 원발성 무월경 + 처녀막 막힘증(imperforate hymen)】\n정답 ⑤ 처녀막 막힘증(Imperforate hymen). Tanner stage 3(유방·음모 발달 정상)이지만 초경 없고, 주기적 하복부 통증(자궁내 혈액 축적), 소음순 사이 막 돌출, 초음파·MRI에서 질혈종(hematocolpos)이 확인되는 소견이다.\n오답: ① 뮬러관 무형성증 — 질·자궁 자체가 없음; 혈종 형성 없음. ② 선천성 거대결장 — 대장 질환, 무관. ③ 난소낭종염전 — 주기적이 아닌 급성 통증. ④ 안드로겐 무감응 증후군 — 46,XY, 음모 없음, 질 맹관.",
"2022-L60-Q219": "【주제: 자궁내막소파술 후 무월경 — Asherman 증후군】\n정답 ④ 자궁내막 유착증(Asherman syndrome). 자궁내막소파술 후 발생한 속발성 무월경 + 소변 임신반응 음성 + 자궁난관조영술에서 자궁강 내 충만결손/불규칙 소견은 자궁내강 유착의 전형이다.\n오답: ① 근층내 근종 — 자궁강 외부 병변, 조영술 소견 다름. ② 자궁내막증 — 외부 증식; 자궁강 유착 소견 없음. ③ 자궁내장치 — 삽입 병력 없음. ⑤ 양측 난관 폐쇄 — 자궁강은 정상.",
"2021-L73-Q157": "【주제: 고도비만 수술 적응증 — 위소매 절제술】\n정답 ④ 위소매 절제술(sleeve gastrectomy). BMI 45로 고도비만(BMI ≥40)이며, 1년 이상 식이·운동·약물 치료에 실패하였다. 이 경우 비만 수술 적응증에 해당한다. 현재 표준술식은 위소매 절제술 또는 루와이 위우회술이며, 합병증과 기저질환 경중을 고려해 선택한다. 경도 수면무호흡 이외 다른 동반질환이 없으므로 상대적으로 덜 침습적인 위소매 절제술이 적절하다.\n오답: ① 심리치료 추가 — 보조적; 이미 1년 이상 실패 후 단독으로는 불충분. ② 약물 변경 — 단기 체중감량 효과 제한적; 수술 기준 충족. ③ 조절형 위밴드술 — 효과 불안정하고 재수술률 높아 현재 선호하지 않음. ⑤ 위전절제술 — 비만 수술로 사용하지 않음."

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdTableToHtml(md) {
  if(!md) return '';
  const lines = md.trim().split('\n').filter(l=>l.trim());
  const rows = [];
  for(const line of lines) {
    const cells = line.split('|').map(c=>c.trim()).filter((cell,i,a)=>!(i===0&&cell===''||i===a.length-1&&cell===''));
    if(cells.length) rows.push(cells);
  }
  if(rows.length<2) return '<pre>'+esc(md)+'</pre>';
  const filtered = rows.filter((_,i)=>i!==1);
  if(!filtered.length) return '';
  let html='<table class="stem-table"><thead><tr>';
  for(const cell of filtered[0]) html+='<th>'+esc(cell)+'</th>';
  html+='</tr></thead><tbody>';
  for(const row of filtered.slice(1)) {
    html+='<tr>';
    for(const cell of row) html+='<td>'+esc(cell)+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

// ═══════════════════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════════════════
function shuffleArray(arr) {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById('shuffle-btn');
  if(isShuffled) {
    filteredQ = shuffleArray(filteredQ);
    btn.classList.add('active');
    btn.textContent = '↕ 랜덤 해제';
  } else {
    // Restore original order by re-applying filters
    btn.classList.remove('active');
    btn.textContent = '↕ 랜덤 순서';
    applyFilters(true); // true = skip shuffle
    return;
  }
  renderFeed();
  renderIndex();
}

// ═══════════════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════════════
function applyFilters(skipShuffle) {
  filteredQ = QUESTIONS.filter(q => {
    const yearOk = filterYear==='all' || String(q.year)===String(filterYear);
    let lecOk;
    if(filterLec==='all') lecOk=true;
    else if(filterLec==='null') lecOk=!q.curr_lec_no;
    else lecOk=q.curr_lec_no===filterLec;
    const scrapOk = !filterScrapOnly || !!savedScraps[q.id];
    return yearOk && lecOk && scrapOk;
  });
  if(isShuffled && !skipShuffle) {
    filteredQ = shuffleArray(filteredQ);
  }
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
  saveFilter();
}

function setYear(y) {
  filterYear=y;
  document.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('active',b.dataset.year===y));
  applyFilters();
}
function setLecture(v) {
  filterLec=v;
  applyFilters();
}
function setScrapOnly(v) {
  filterScrapOnly=v;
  applyFilters();
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function countStats() {
  let correct=0,wrong=0,answered=0;
  filteredQ.forEach(q=>{
    const sa=hideAnswers?null:savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length>0){
      answered++;
      if(sa.correct) correct++; else wrong++;
    }
  });
  return {total:filteredQ.length,answered,correct,wrong};
}
function updateStats() {
  const s=countStats();
  document.getElementById('stat-shown').textContent=s.total;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-wrong').textContent=s.wrong;
}
function updateScopeBar() {
  const s=countStats();
  document.getElementById('scope-bar').innerHTML=
    `전체 <b>${s.total}</b>문항 &nbsp;|&nbsp; 푼 <b>${s.answered}</b> &nbsp;|&nbsp; 정답 <b style="color:var(--correct)">${s.correct}</b> &nbsp;|&nbsp; 오답 <b style="color:var(--incorrect)">${s.wrong}</b>`;
}

// ═══════════════════════════════════════════════════
// INDEX (inline, always rendered)
// ═══════════════════════════════════════════════════
function renderIndex() {
  const s=countStats();
  const scrapCount=filteredQ.filter(q=>savedScraps[q.id]).length;
  document.getElementById('idx-scope').innerHTML=
    `전체 <b>${s.total}</b> &nbsp;/&nbsp; 푼 <b>${s.answered}</b> &nbsp;/&nbsp; 정답 <b style="color:var(--correct)">${s.correct}</b><br>스크랩 <b style="color:var(--star-color)">${scrapCount}</b>`;

  const list=document.getElementById('idx-list');
  list.innerHTML='';
  filteredQ.forEach((q,i)=>{
    const sa=hideAnswers?null:savedAnswers[q.id];
    const isScrap=!!savedScraps[q.id];
    let dotCls='idx-dot';
    if(isScrap) dotCls+=' dot-scrap';
    else if(sa&&sa.sel&&sa.sel.length>0) {
      dotCls += sa.correct?' dot-correct':' dot-wrong';
    }
    const lecLabel=q.curr_lec_no?q.curr_lec_no+'강':'기타';
    const label=`${q.year} · ${lecLabel} · Q${q.qnum}`;
    const btn=document.createElement('button');
    btn.className='idx-item';
    btn.setAttribute('data-qidx',i);
    btn.innerHTML=`<span class="${dotCls}"></span><span class="idx-label">${esc(label)}</span>`;
    btn.addEventListener('click',()=>scrollToCard(i));
    list.appendChild(btn);
  });
}

function scrollToCard(idx) {
  const cardId='card-'+idx;
  const el=document.getElementById(cardId);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.idx-item').forEach((b,i)=>b.classList.toggle('idx-current',i===idx));
}

// ═══════════════════════════════════════════════════
// RENDER FEED (vertical scroll)
// ═══════════════════════════════════════════════════
function renderFeed() {
  const feed=document.getElementById('feed');
  const noRes=document.getElementById('no-results');
  feed.innerHTML='';
  if(filteredQ.length===0){
    noRes.style.display='block';
    return;
  }
  noRes.style.display='none';

  const frag=document.createDocumentFragment();
  filteredQ.forEach((q,i)=>{
    const div=document.createElement('div');
    div.className='q-card';
    div.id='card-'+i;
    div.setAttribute('data-qid',q.id);
    div.setAttribute('data-qidx',i);
    div.innerHTML=buildCardHtml(q,i);
    frag.appendChild(div);
  });
  feed.appendChild(frag);
}

// ═══════════════════════════════════════════════════
// BUILD CARD HTML
// ═══════════════════════════════════════════════════
const CIRCLES=['①','②','③','④','⑤'];

function buildCardHtml(q,idx) {
  const sa=hideAnswers?null:(savedAnswers[q.id]||null);
  const answered=sa&&sa.sel&&sa.sel.length>0;
  const isScrap=!!savedScraps[q.id];

  const lecTag=q.curr_lec_no?`${q.curr_lec_no}강 ${esc(q.curr_lecture||'')}`:'기타/미분류';
  const recoveredTag=q.recovered?`<span class="meta-tag tag-recovered">복원</span>`:'';

  // Star button: ☆ (empty) / ★ (filled)
  const starChar = isScrap ? '★' : '☆';
  const starBtn=`<button class="scrap-btn${isScrap?' starred':''}" 
    onclick="toggleScrap('${q.id}')" title="${isScrap?'스크랩 해제':'스크랩'}">${starChar}</button>`;

  // header
  const header=`<div class="q-card-header">
    <div class="q-card-header-inner">
      <span class="meta-tag tag-year">${q.year}</span>
      <span class="meta-tag tag-lec">${lecTag}</span>
      ${q.professor?`<span class="meta-tag tag-prof">${esc(q.professor)}</span>`:''}
      <span class="meta-tag tag-qnum">족보 Q${q.qnum}</span>
      ${recoveredTag}
    </div>
    ${starBtn}
  </div>`;

  // stem
  const stem=`<div class="q-stem">${esc(q.stem)}</div>`;

  // table
  const tbl=q.stem_table?`<div class="stem-table-wrap">${mdTableToHtml(q.stem_table)}</div>`:'';

  // image
  let img='';
  if(q.image){
    img=`<div class="q-image"><img src="${esc(q.image)}" alt="문항 이미지" title="클릭하면 확대됩니다" data-src="${esc(q.image)}" onclick="openImgLightbox(this.src)" onerror="imgFail(this)"></div>`;
  }

  // choices
  let choices='<div class="choices">';
  q.options.forEach((opt,i)=>{
    const num=i+1;
    let cls='choice-btn';
    if(answered){
      if(q.answer.includes(num)) cls+=' correct-ans';
      else if(sa.sel.includes(num)) cls+=' my-wrong-ans';
    }
    const disabled=answered?'disabled':'';
    choices+=`<button class="${cls}" ${disabled} onclick="onChoice('${q.id}',${num},${idx})">
      <span class="choice-num">${CIRCLES[i]}</span>
      <span>${esc(opt)}</span>
    </button>`;
  });
  choices+='</div>';

  // (결과 배너 제거: 정답 보기=초록, 오답 선택=빨강 하이라이트로 충분)

  // explanation — only visible after answering
  const expl=buildExplHtml(q.id, answered);

  return `${header}
  <div class="q-card-body">
    ${stem}${tbl}${img}${choices}${expl}
  </div>`;
}

// ═══════════════════════════════════════════════════
// EXPLANATION
// ═══════════════════════════════════════════════════
function mdLite(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');}
const TAB_FIELDS=[{key:'expl',label:'해설'},{key:'memo1',label:'메모1'},{key:'memo2',label:'메모2'}];

function buildExplHtml(qid, answered) {
  const visibleCls = answered ? ' expl-visible' : '';
  const pill = sbOnline
    ? '<span class="sync-pill on" id="sync-'+qid+'">🟢 공유 중</span>'
    : '<span class="sync-pill off" id="sync-'+qid+'">🔴 오프라인</span>';
  let tabs='';
  TAB_FIELDS.forEach((t,i)=>{
    let dot='';
    if(t.key==='memo1'&&curMemo(qid,'memo1')) dot='<span class="tab-dot memo1"></span>';
    if(t.key==='memo2'&&curMemo(qid,'memo2')) dot='<span class="tab-dot memo2"></span>';
    tabs+='<button class="tab-btn'+(i===0?' active':'')+'" data-f="'+t.key+'" onclick="switchTab(\''+qid+'\',\''+t.key+'\')">'+t.label+dot+'</button>';
  });
  const explPane=
    '<div class="tab-pane" id="pane-expl-'+qid+'">'
    + '<div style="display:flex;justify-content:flex-end;margin-bottom:6px;"><button class="expl-edit-btn" id="editbtn-expl-'+qid+'" onclick="startEdit(\''+qid+'\',\'expl\')">✏️ 해설 수정</button></div>'
    + buildViewHtml(qid,'expl')
    + '<textarea class="expl-textarea" id="ta-expl-'+qid+'" placeholder="해설을 입력하세요..."></textarea>'
    + '<button class="expl-save-btn" id="save-expl-'+qid+'" onclick="saveEdit(\''+qid+'\',\'expl\')">저장</button>'
    + '<div class="expl-paste-hint" id="paste-expl-'+qid+'">📋 입력칸 클릭 후 <b>Ctrl+V</b> 로 사진을 붙여넣으면 해설에 추가됩니다(공유됨).</div>'
    + '<div class="expl-imgs" id="imgs-'+qid+'">'+buildImgGallery(qid)+'</div>'
    + '</div>';
  const memoPane=function(field,who){
    return '<div class="tab-pane" id="pane-'+field+'-'+qid+'" hidden>'
    + '<div class="memo-hint">'+who+' · 아래 칸을 클릭해 바로 작성하세요 (입력칸을 벗어나면 자동 저장)</div>'
    + '<textarea class="expl-textarea memo-live" id="ta-'+field+'-'+qid+'" placeholder="여기를 클릭해 바로 작성…" oninput="memoTyping(\''+qid+'\',\''+field+'\')" onblur="saveMemoBlur(\''+qid+'\',\''+field+'\')">'+esc(curMemo(qid,field))+'</textarea>'
    + '<div class="memo-status" id="memostat-'+field+'-'+qid+'"></div>'
    + '</div>';
  };
  return '<div class="expl-section'+visibleCls+'" id="expl-section-'+qid+'">'
    + '<div class="tab-bar">'+tabs+pill+'</div>'
    + explPane + memoPane('memo1','✍️ 메모1 (친구)') + memoPane('memo2','✍️ 메모2 (나)')
    + '</div>';
}

function buildViewHtml(qid, field){
  let txt, empty;
  if(field==='expl'){ txt=curExpl(qid); empty='해설 준비 중'; }
  else { txt=curMemo(qid,field); empty='아직 메모가 없습니다. 오른쪽 "수정"으로 작성하세요.'; }
  if(txt&&txt.trim()) return '<div class="expl-text" id="view-'+field+'-'+qid+'">'+mdLite(txt)+'</div>';
  return '<div class="memo-empty" id="view-'+field+'-'+qid+'">'+esc(empty)+'</div>';
}

// ═══════════════════════════════════════════════════
// SUPABASE 공유 계층 (해설·메모1·메모2·첨부사진)
// ═══════════════════════════════════════════════════
function sbInit(){
  try{ if(window.supabase&&SB_URL&&SB_KEY){ SB=window.supabase.createClient(SB_URL,SB_KEY); } }
  catch(e){ SB=null; }
}
async function sbLoadAll(){
  if(!SB) return;
  try{
    const res=await SB.from('qnotes').select('qid,expl,memo1,memo2,expl_imgs');
    if(res.error) throw res.error;
    (res.data||[]).forEach(function(r){ shared[r.qid]={expl:r.expl,memo1:r.memo1,memo2:r.memo2,expl_imgs:r.expl_imgs||[]}; });
    sbOnline=true; saveSharedCache();
  }catch(e){ sbOnline=false; }
}
async function sbUpsert(qid, patch){
  shared[qid]=Object.assign({}, shared[qid], patch);   // 로컬 우선 반영
  saveSharedCache();
  if(!SB){ sbOnline=false; return false; }
  try{
    const row=Object.assign({qid:qid, updated_at:new Date().toISOString()}, patch);
    const res=await SB.from('qnotes').upsert(row,{onConflict:'qid'});
    if(res.error) throw res.error;
    sbOnline=true; return true;
  }catch(e){ sbOnline=false; return false; }
}
function saveSharedCache(){
  try{
    const slim={};
    for(const k in shared){ const s=shared[k]; slim[k]={expl:s.expl,memo1:s.memo1,memo2:s.memo2}; } // 이미지는 캐시 제외(용량)
    localStorage.setItem(LS_SHARED, JSON.stringify(slim));
  }catch(e){}
}
function setSyncPills(){
  document.querySelectorAll('.sync-pill').forEach(function(p){
    p.className='sync-pill '+(sbOnline?'on':'off');
    p.textContent=sbOnline?'🟢 공유 중':'🔴 오프라인';
  });
}

// ── 공유 데이터 헬퍼 (표시값 우선순위) ──
function curExpl(qid){
  const s=shared[qid];
  if(s&&s.expl!=null&&s.expl!=='') return s.expl;
  if(savedExpl[qid]) return savedExpl[qid];   // 구버전 로컬 편집 폴백
  return EXPLANATIONS[qid]||'';
}
function curMemo(qid,field){ const s=shared[qid]; return (s&&s[field])?s[field]:''; }
function curImgs(qid){
  const s=shared[qid];
  if(s&&Array.isArray(s.expl_imgs)&&s.expl_imgs.length) return s.expl_imgs;
  return savedImages[qid]||[];
}

// ── 탭 전환 / 편집 ──
function switchTab(qid, field){
  const sec=document.getElementById('expl-section-'+qid);
  if(!sec) return;
  sec.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.f===field); });
  TAB_FIELDS.forEach(function(t){ const pane=document.getElementById('pane-'+t.key+'-'+qid); if(pane) pane.hidden=(t.key!==field); });
}
function startEdit(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  ta.value = (field==='expl') ? curExpl(qid) : curMemo(qid,field);
  ta.style.display='block';
  const save=document.getElementById('save-'+field+'-'+qid); if(save) save.style.display='inline-block';
  const view=document.getElementById('view-'+field+'-'+qid); if(view) view.style.display='none';
  const eb=document.getElementById('editbtn-'+field+'-'+qid); if(eb) eb.style.display='none';
  const hint=document.getElementById('paste-'+field+'-'+qid); if(hint) hint.classList.add('show');
  ta.focus();
}
async function saveEdit(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  const patch={}; patch[field]=ta.value.trim();
  const ok=await sbUpsert(qid, patch);
  refreshPane(qid, field);
  refreshTabDots(qid);
  setSyncPills();
  if(!ok) alert('인터넷 연결이 없어 공유 저장에 실패했습니다.\n내용은 이 브라우저에 임시 저장됐으니, 연결 후 다시 "저장"하면 공유됩니다.');
}
function refreshPane(qid, field){
  const oldView=document.getElementById('view-'+field+'-'+qid);
  if(oldView){
    const tmp=document.createElement('div');
    tmp.innerHTML=buildViewHtml(qid, field);
    oldView.replaceWith(tmp.firstChild);
  }
  const ta=document.getElementById('ta-'+field+'-'+qid); if(ta) ta.style.display='none';
  const save=document.getElementById('save-'+field+'-'+qid); if(save) save.style.display='none';
  const eb=document.getElementById('editbtn-'+field+'-'+qid); if(eb) eb.style.display='';
  const hint=document.getElementById('paste-'+field+'-'+qid); if(hint) hint.classList.remove('show');
}
function refreshTabDots(qid){
  const sec=document.getElementById('expl-section-'+qid);
  if(!sec) return;
  ['memo1','memo2'].forEach(function(f){
    const btn=sec.querySelector('.tab-btn[data-f="'+f+'"]'); if(!btn) return;
    let dot=btn.querySelector('.tab-dot');
    const has=!!curMemo(qid,f);
    if(has&&!dot){ dot=document.createElement('span'); dot.className='tab-dot '+f; btn.appendChild(dot); }
    else if(!has&&dot){ dot.remove(); }
  });
}
// 메모: '수정' 버튼 없이 텍스트창 클릭→바로 작성, 입력칸 벗어나면(blur) 자동 저장
function memoTyping(qid, field){
  const stat=document.getElementById('memostat-'+field+'-'+qid);
  if(stat){ stat.textContent='작성 중… (칸을 벗어나면 저장)'; stat.className='memo-status saving'; }
}
async function saveMemoBlur(qid, field){
  const ta=document.getElementById('ta-'+field+'-'+qid);
  if(!ta) return;
  const val=ta.value.trim();
  const stat=document.getElementById('memostat-'+field+'-'+qid);
  if(val===(curMemo(qid,field)||'')){ if(stat){ stat.textContent=''; stat.className='memo-status'; } return; } // 변경 없음
  if(stat){ stat.textContent='저장 중…'; stat.className='memo-status saving'; }
  const patch={}; patch[field]=val;
  const ok=await sbUpsert(qid, patch);
  refreshTabDots(qid); setSyncPills();
  if(stat){
    if(ok){ stat.textContent='✓ 저장됨 (친구에게도 공유됨)'; stat.className='memo-status ok'; setTimeout(function(){ if(stat&&stat.classList.contains('ok')) stat.textContent=''; },2500); }
    else { stat.textContent='⚠ 오프라인 — 인터넷 연결 후 칸을 다시 벗어나면 저장됩니다'; stat.className='memo-status err'; }
  }
}

// ═══════════════════════════════════════════════════
// EXPLANATION IMAGES — 해설 수정 중 Ctrl+V 붙여넣기
// ═══════════════════════════════════════════════════
function buildImgGallery(qid){
  const imgs=curImgs(qid);
  return imgs.map((src,i)=>'<div class="expl-img-wrap"><img class="expl-img" src="'+src+'" onclick="openLightbox(\''+qid+'\','+i+')"><button class="expl-img-del" title="사진 삭제" onclick="delExplImg(\''+qid+'\','+i+')">✕</button></div>').join('');
}
function refreshExplImgs(qid){
  const el=document.getElementById('imgs-'+qid);
  if(el) el.innerHTML=buildImgGallery(qid);
}
// 붙여넣은 이미지를 최대 1100px로 축소 + JPEG 압축 → Supabase 공유 저장
function addImageFromBlob(qid, blob){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const MAX=1100; let w=img.width, h=img.height;
      if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      let dataURL;
      try{ dataURL=cv.toDataURL('image/jpeg',0.82); }catch(e){ dataURL=ev.target.result; }
      const imgs=curImgs(qid).slice(); imgs.push(dataURL);
      sbUpsert(qid,{expl_imgs:imgs}).then(function(ok){
        refreshExplImgs(qid); setSyncPills();
        if(!ok) alert('인터넷 연결이 없어 사진 공유 저장에 실패했습니다. 연결 후 다시 시도해 주세요.');
      });
    };
    img.onerror=function(){ alert('이미지를 불러오지 못했습니다.'); };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(blob);
}
function delExplImg(qid,i){
  const cur=curImgs(qid);
  if(!cur.length) return;
  if(!confirm('이 사진을 삭제할까요? (공유됨)')) return;
  const imgs=cur.slice(); imgs.splice(i,1);
  sbUpsert(qid,{expl_imgs:imgs}).then(function(){ refreshExplImgs(qid); setSyncPills(); });
}
// 범용 이미지 확대 — 문항 이미지·해설 첨부 이미지 공통
function openImgLightbox(src){
  const lb=document.getElementById('img-lightbox'); if(!lb||!src) return;
  lb.querySelector('img').src=src;
  lb.classList.add('show');
}
function openLightbox(qid,i){
  const imgs=curImgs(qid); if(!imgs[i]) return;
  openImgLightbox(imgs[i]);
}
// 문항 이미지 로드 실패 시 자리표시(따옴표 중첩 버그 방지 위해 함수로 분리)
function imgFail(el){
  const p=el.getAttribute('data-src')||'';
  const parent=el.parentNode; if(!parent) return;
  parent.innerHTML='';
  const span=document.createElement('span');
  span.className='img-placeholder';
  span.textContent='[이미지 없음'+(p?': '+p:'')+']';
  parent.appendChild(span);
}
// paste 핸들러 — 해설 textarea(편집 모드)가 포커스됐을 때만 동작
document.addEventListener('paste',function(e){
  const ae=document.activeElement;
  if(!ae||!ae.id||ae.id.indexOf('ta-expl-')!==0) return;
  const qid=ae.id.slice(8);
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let found=false;
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const blob=items[i].getAsFile();
      if(blob){ addImageFromBlob(qid,blob); found=true; }
    }
  }
  if(found) e.preventDefault();
});

// ═══════════════════════════════════════════════════
// CHOICE CLICK
// ═══════════════════════════════════════════════════
function onChoice(qid, num, cardIdx) {
  if(hideAnswers) return; // 풀이 숨김 중에는 새로 풀 수 없음(표시만 숨김)
  const q=QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  if(savedAnswers[qid]&&savedAnswers[qid].sel&&savedAnswers[qid].sel.length>0) return;
  const correct=q.answer.length===1
    ? q.answer[0]===num
    : q.answer.includes(num);

  savedAnswers[qid]={sel:[num], correct:correct};
  saveAnswers();
  refreshCard(qid, cardIdx);
  updateStats();
  updateScopeBar();
  renderIndex();
}

function refreshCard(qid, cardIdx) {
  const card=document.getElementById('card-'+cardIdx);
  if(!card) return;
  const q=filteredQ[cardIdx];
  if(!q||q.id!==qid) return;
  card.innerHTML=buildCardHtml(q,cardIdx);
}

// ═══════════════════════════════════════════════════
// SCRAP
// ═══════════════════════════════════════════════════
function toggleScrap(qid) {
  if(savedScraps[qid]) delete savedScraps[qid];
  else savedScraps[qid]=true;
  saveScraps();
  // Update star in DOM without full re-render
  const cards=document.querySelectorAll('[data-qid="'+qid+'"] .scrap-btn');
  cards.forEach(btn=>{
    const starred=!!savedScraps[qid];
    btn.classList.toggle('starred',starred);
    btn.textContent=starred?'★':'☆';
    btn.title=starred?'스크랩 해제':'스크랩';
  });
  renderIndex();
  updateScopeBar();
  if(filterScrapOnly) applyFilters();
}

// ═══════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════
// '풀이 숨기기' 토글 — savedAnswers 는 보존, 표시만 on/off.
// 해제하면 내가 푼 문항의 풀이/해설이 다시 표시됨(안 푼 문항은 그대로 미표시).
function toggleHideAnswers() {
  hideAnswers=!hideAnswers;
  try{ localStorage.setItem(LS_HIDE, hideAnswers?'1':'0'); }catch(e){}
  updateHideBtn();
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
}
function updateHideBtn() {
  const btn=document.getElementById('hide-btn');
  if(!btn) return;
  btn.textContent = hideAnswers ? '👁 풀이 보이기' : '🙈 풀이 숨기기';
  btn.classList.toggle('active', hideAnswers);
}

// ═══════════════════════════════════════════════════
// SIDEBAR TOGGLE (mobile)
// ═══════════════════════════════════════════════════
function toggleSidebar() {
  const s=document.getElementById('sidebar');
  const o=document.getElementById('sidebar-overlay');
  s.classList.toggle('open');
  o.classList.toggle('visible');
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
// BACKUP / RESTORE — 진도 백업(저장 공간 의존 방지)
// ═══════════════════════════════════════════════════
const ALL_LS_KEYS=[LS_ANSWERS,LS_SCRAP,LS_EXPL,LS_EXPLIMG,LS_EXPLHIST,LS_FILTER];

function pad2(n){return String(n).padStart(2,'0');}

function exportProgress(){
  const data={_app:'endo_jokbo',_ver:2,_exported:new Date().toISOString(),store:{}};
  let any=false;
  ALL_LS_KEYS.forEach(function(k){ const v=localStorage.getItem(k); if(v!=null){ data.store[k]=v; if(k===LS_ANSWERS||k===LS_SCRAP||k===LS_EXPL) any=true; } });
  const d=new Date();
  const fname='족보_진도백업_'+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+'.json';
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },150);
  const st=document.getElementById('backup-status');
  if(st){ const prev=st.innerHTML; st.innerHTML='💾 백업 파일을 저장했습니다'; setTimeout(function(){ st.innerHTML=prev; },3500); }
}

function triggerImport(){ const i=document.getElementById('import-file'); if(i) i.click(); }

function importProgress(input){
  const file=input.files&&input.files[0];
  if(!file){ return; }
  const reader=new FileReader();
  reader.onload=function(e){
    let data;
    try{ data=JSON.parse(e.target.result); }
    catch(err){ alert('백업 파일을 읽을 수 없습니다.\n올바른 진도 백업(.json) 파일인지 확인해 주세요.'); input.value=''; return; }
    if(!data||data._app!=='endo_jokbo'||!data.store){ alert('이 파일은 이 사이트의 진도 백업 파일이 아닙니다.'); input.value=''; return; }
    if(!confirm('백업을 불러오면 지금 이 브라우저의 풀이 기록이\n백업 내용으로 교체됩니다. 계속할까요?')){ input.value=''; return; }
    try{ ALL_LS_KEYS.forEach(function(k){ if(k in data.store) localStorage.setItem(k,data.store[k]); }); }
    catch(err){ alert('저장 공간이 부족해 일부를 불러오지 못했을 수 있습니다.'); }
    alert('진도를 불러왔습니다. 화면을 새로고침합니다.');
    input.value='';
    location.reload();
  };
  reader.readAsText(file);
}

function checkStorageHealth(){
  let ok=true;
  try{ localStorage.setItem('__hc','1'); localStorage.removeItem('__hc'); }catch(e){ ok=false; }
  const st=document.getElementById('backup-status');
  if(!st) return;
  if(ok){
    st.classList.remove('warn');
    st.innerHTML='✓ 풀이 기록이 이 브라우저에<br>자동으로 저장됩니다';
  }else{
    st.classList.add('warn');
    st.innerHTML='⚠️ 이 환경에서는 기록이 자동 저장되지 않습니다(시크릿 모드 등). 일반 창에서 열거나 💾로 직접 백업하세요.';
  }
}

function init() {
  checkStorageHealth();
  updateHideBtn();
  document.querySelectorAll('.yr-btn').forEach(b=>b.classList.toggle('active',b.dataset.year===filterYear));
  const sel=document.getElementById('lec-select');
  if(filterLec!=='all') sel.value=filterLec;
  const scrapChk=document.getElementById('scrap-only-chk');
  if(filterScrapOnly) scrapChk.checked=true;
  applyFilters();
  // 공유 데이터(해설·메모1·메모2·사진) Supabase 로드 → 끝나면 다시 그림
  sbInit();
  sbLoadAll().then(function(){ renderFeed(); setSyncPills(); });
}

init();
</script>
