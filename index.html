num":95,"jokbo_lec_no":33,"lecture":"무기질 대사 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"63세 남성이 만성 B형 간염으로 치료 중이며, 1년 반 전부터 시작된 하지 위약 및 보행 시 통증으로 내원하였다. 복용 중인 약물은 Tenofovir disoproxil fumarate (TDF), amlodipine이다.\n혈중 칼슘/인 8.8(8.5-10.","stem_table":null,"options":["Calcium citrate","Estrogen + Progesterone","Calcitriol","Romosozumab","수술을 받았으므로 약물치료는 필요없다 (TDF의 다른 항바이러스제로의 변경)"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q95"},{"id":"2025-L34-Q20","year":2025,"qnum":20,"jokbo_lec_no":34,"lecture":"부갑상선 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"64세 남자가 일차 부갑상선기능항진증으로 최소 침습 부갑상선절제술을 시행받았다. 환자는 수술 후 칼슘 500 mg를 하루 3회 복용하도록 교육받았다. 수술 후 환자의 검사 결과가 아래와 같았고 환자의 신기능은 정상이었다. 가장 적절한 조치는?","stem_table":null,"options":["칼슘 용량의 증량","부갑상선스캔","비타민 D 투여","갑상선호르몬 투여","재수술"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q20"},{"id":"2025-L34-Q47","year":2025,"qnum":47,"jokbo_lec_no":34,"lecture":"부갑상선 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"47세 여자가 의식 혼탁으로 응급실에 왔다. 환자는 제2형 당뇨병과 고혈압, 폐의 유육종증을 앓고 있었다.\n혈중 칼슘/인 15.1/4.5 mg/dL, 혈중 요소질소/크레아티닌 24/1.0 mg/dL, 부갑상선호르몬 7 pg/mL (10-6","stem_table":null,"options":["과도한 골교체 (bone tumover)","칼슘 요배설의 장애","PTH 유사 체액성 인자의 증가","1alpha-hydroxylase 활성도의 증가","칼슘 수용체의 비활성화 변이"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q47"},{"id":"2025-L35-Q24","year":2025,"qnum":24,"jokbo_lec_no":35,"lecture":"대사성 골질환 - 골다공증의 진단 및 치료, 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"73세 여자 환자가 1달 전부터 시작된 좌측 대퇴골 통증을 주소로 내원하였다. 환자는 골다공증으로 7년 전부터 zoledronate를 3년, 이후 alendronate를 4년간 투여받아왔다고 한다. 과거력상 3년 전 유방암으로 좌측 유방절제술 후 Tamoxifen을 복용 중이었다. 환자는 임플란트 시술을 위해 발치 후 그림과 같은 상태를 보이고 있다.\n칼슘 8.9 mg/dL (8.5-10.","stem_table":null,"options":["Alendronate 중단","Denosumab 병용","방사선 치료","항암 화학요법","부신피질호르몬 투여"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q24_p22_jaw.png","note":null,"id_simple":"2025-Q24"},{"id":"2025-L35-Q32","year":2025,"qnum":32,"jokbo_lec_no":35,"lecture":"대사성 골질환 - 골다공증의 진단 및 치료, 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"68세 여자 환자가 내원 1일 전 넘어지면서 발생한 요통을 주소로 내원하였다. 평소 류마티스 관절염을 앓아오던 환자는 스테로이드제제와 고혈압에 대해 칼슘채널 차단제를 복용해 왔으며 10년 전에는 우측 손목 골절을 경험한 적이 있다고 한다. 환자의 모친은 고관절 골절로 낙상 후 사망하였다고 한다. 환자는 음주나 흡연은 하지 않는다고 한다. 환자는 157cm, 64kg 이었으며 요추 측면촬영 상 L2에 압박골절이 관찰되었고 골밀도는 요추 (L1-","stem_table":null,"options":["류마티스관절염","스테로이드 복용","과체중","손목 골절력","모친 골절력"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q32"},{"id":"2025-L35-Q35","year":2025,"qnum":35,"jokbo_lec_no":35,"lecture":"대사성 골질환 - 골다공증의 진단 및 치료, 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"64세 여자가 우측 장골에 통증과 열감이 있어 내원하였다. 과거력상 악성 종양을 포함하여 주요 질환의 병력은 없었다. 환자는 경미한 두통 이외에 다른 특이 증상은 없었다.\n혈중 칼슘 9.0 mg/dL (8.5-10.","stem_table":null,"options":["Estrogen","Raloxifene","Teriparatide","Active vitamin D3","Zoledronate"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q35_p23.png","note":null,"id_simple":"2025-Q35"},{"id":"2025-L35-Q38","year":2025,"qnum":38,"jokbo_lec_no":35,"lecture":"대사성 골질환 - 골다공증의 진단 및 치료, 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"62세 여자 환자가 내원 2일 전 이삿짐을 옮기다가 발생한 요통을 주소로 내원하였다. 환자에서 시행한 단순 요추 방사선 촬영과 골밀도 검사는 다음과 같았다.\n이 환자에서 가장 적절한 치료는?","stem_table":null,"options":["치료가 필요없다","칼슘+비타민 D","비스포스포네이트 + 칼슘 + 비타민 D","성장호르몬 + 칼슘 + 비타민 D","부신피질호르몬 + 칼슘 + 비타민 D"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q38_p21.png","note":null,"id_simple":"2025-Q38"},{"id":"2025-L35-Q77","year":2025,"qnum":77,"jokbo_lec_no":35,"lecture":"대사성 골질환 - 골다공증의 진단 및 치료, 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"72세 여자 환자가 최근 발생한 우측 고관절 골절을 주소로 내원하여 고관절 전치환술 (total hip replacement arthroplasty)을 시행받고 내과로 협진의뢰되었다.\n과거력상 자궁적출술을 받은 적은 없으며 심혈관계 질환 등을 포함한 특이병력은 없었다.\n척추 X-ray 촬영 결과 흉추 11, 12번과 요추 1, 2, 3번의 압박골절이 동반되어 있었고 골밀도 검사상 T-score가 L1-4에서 -4.5, 좌측 Femur neck -3.9, Total hip -3.8 이었다. 25(OH)vitamin D3 18 ng/mL (30-100), 부갑상선호르몬 37 pg/mL (10-6","stem_table":null,"options":["Calcium citrate","Estrogen + Progesterone","Calcitriol","Romosozumab","수술을 받았으므로 약물치료는 필요없다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q77"},{"id":"2025-L36-Q59","year":2025,"qnum":59,"jokbo_lec_no":36,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"1개월 남아가 전신 경련을 주소로 응급실을 방문하였다. 환아는 만삭정상질식분만으로 출생하였고 주산기 문제는 없었으며 모유 수유 중이었다. 환아의 경련은 응급실 도착시 멈춘 상태였고 검사 소견은 다음과 같았다.\n가장 먼저 시행해야할 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| Ca | 5.6 mg/dL | 8.8-10.8 |\n| P | 8.5 mg/dL | 3.8-6.5 |\n| iCa | 0.62 mmol/L | 1.05-1.35 |\n| Alkaline phosphatase | 1650 IU/L | 145-420 |","options":["뇌파검사","흉선 유무 확인","저인분유 경구 투여","Calcitriol 정맥 투여","혈액 vitamin D, PTH, Mg 및 소변 칼슘 등 측정"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q59"},{"id":"2025-L36-Q98","year":2025,"qnum":98,"jokbo_lec_no":36,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"다음은 비타민D결핍구루병(VDR)과 X연관저인산염혈구루병(XLH)의 검사 소견이다. 감소하는 것은?","stem_table":null,"options":["(가)","(나)","(다)","(라)","(마)"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q98_p23.png","note":null,"id_simple":"2025-Q98"},{"id":"2025-L37-Q7","year":2025,"qnum":7,"jokbo_lec_no":37,"lecture":"부갑상선질환의 병리","professor":"김영아","curr_lec_no":"34","curr_lecture":"부갑상선질환의 병리","stem":"다음 중 부갑상샘암을 진단하기 위한 조건이 아닌 것은?","stem_table":null,"options":["Vascular invasion","Perineural space invasion","Thyroid gland invasion","Lung metastasis","Atypical bizarre nuclei"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q7"},{"id":"2025-L37-Q71","year":2025,"qnum":71,"jokbo_lec_no":37,"lecture":"부갑상선질환의 병리","professor":"김영아","curr_lec_no":"34","curr_lecture":"부갑상선질환의 병리","stem":"다음 중 부갑상선질환의 병리소견에 대한 설명으로 옳은 것은?","stem_table":null,"options":["부갑상샘이 여러 개 커져 있으면 부갑상샘종 (parathyroid adenoma)의 가능성이 높다.","Primary hyperparathyroidism의 가장 흔한 원인은 parathyroid hyperplasia이다.","부갑상샘은 조직학적으로 chief cell 혹은 oxyphil cell 그리고 stromal fat으로 이루어져 있고, 여기서 발생한 adenoma는 chief cell 혹은 oxyphil cell 단독으로 이루어진다.","Parathyroid adenoma는 MEN과 관련된 familial form이 95% 이상을 차지하고, sporadic form은 드물게 발생한다.","Atypical parathyroid tumor는 조직학적으로 parathyroid carcinoma와의 감별이 필요한 현미경소견을 보인다."],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q71"},{"id":"2025-L38-Q10","year":2025,"qnum":10,"jokbo_lec_no":38,"lecture":"부갑상선/골질환의 영상소견","professor":"윤태진/채지원","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"다음 중 부갑상선 선종을 시사하는 영상 검사 소견은?","stem_table":null,"options":["초음파상 고에코성 결절","초음파상 결절 내부의 혈류 증가","초음파상 갑상선과의 경계가 불분명한 결절","초음파상 갑상선 내부를 관통하는 feeding vessel","CT상 지연된 조영증강 패턴"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q10"},{"id":"2025-L38-Q18","year":2025,"qnum":18,"jokbo_lec_no":38,"lecture":"부갑상선/골질환의 영상소견","professor":"윤태진/채지원","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"척추 수술병력이 있는 60세 여자 환자의 골밀도 검사 결과이다. L-spine 의 T-score 로 가장 적절한 것을 고르시오.","stem_table":"| 결과 해석 | |\n|---|---|\n| L-spine T-score는 수술 인공물로 인해 위음성 가능성이 있으므로 주의 | |","options":["-1.8","-1.9","-2.0","-2.1","-2.4"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q18_p23.png","note":null,"id_simple":"2025-Q18"},{"id":"2025-L38-Q67","year":2025,"qnum":67,"jokbo_lec_no":38,"lecture":"부갑상선/골질환의 영상소견","professor":"윤태진/채지원","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"다음 영상의학적 검사 방식 중 부갑상선 질환의 평가에 있어 modality of choice인 것은?","stem_table":null,"options":["X-ray","Postcontrast CT","Postcontrast CT angiogram","MRI","US"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q67"},{"id":"2025-L38-Q79","year":2025,"qnum":79,"jokbo_lec_no":38,"lecture":"부갑상선/골질환의 영상소견","professor":"윤태진/채지원","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"80세 여자 환자가 며칠 전부터 시작된 허리 통증으로 방문하였다. 내원하여 촬영한 요추 x-ray에서 관찰되는 소견에 대한 설명으로 맞는 것은?","stem_table":null,"options":["골음영은 정상이다.","Rugger-Jersey spine 소견이 보인다.","악성 골절로 의심되는 척추 골절이 있다.","골음영 감소의 소견이 보이므로 골다공증일 가능성이 있다.","척추측만에 의하여 척추골절이 있는 것처럼 보이나 실제로는 골절이 없다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q79_p24.png","note":null,"id_simple":"2025-Q79"},{"id":"2025-L38-Q87","year":2025,"qnum":87,"jokbo_lec_no":38,"lecture":"부갑상선/골질환의 영상소견","professor":"윤태진/채지원","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"골다공증의 영상소견이 아닌 것은?","stem_table":null,"options":["cortical thickening","vertebral fracture","decreased bone density","sacral insufficiency fracture","decreased amount of trabeculae"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q87"},{"id":"2025-L39-Q3","year":2025,"qnum":3,"jokbo_lec_no":39,"lecture":"부갑상선질환의 핵의학 검사 및 치료/외과적 치료","professor":"천기정/채영준","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음 중 부갑상종 진단에 이용하는 방사성의약품이 아닌 것은?","stem_table":null,"options":["TI-201 chloride","TC-99m MIBI","Tc-99m MDP","F-18 fluorocholine","C-11 choline"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q3"},{"id":"2025-L39-Q40","year":2025,"qnum":40,"jokbo_lec_no":39,"lecture":"부갑상선질환의 핵의학 검사 및 치료/외과적 치료","professor":"천기정/채영준","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"신부전으로 혈액투석을 10년간 받아오던 50세 남자가 지속되는 골통증으로 호소하여 부갑상수술을 고려하고 있다. 혈액검사 결과이다. 수술 후 발생할 수 있는 가장 흔한 증상은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| PTH | 1840 pg/mL | 15-65 |\n| Ca | 7.8 mg/dL | 8.8-10.5 |\n| P | 5.2 mg/dL | 2.5-4.5 |\n| Na | 140 mmol/L | 135-145 |\n| K | 3.3 mmol/L | 3.5-5.5 |","options":["출혈","손발저림","쉰목소리","호흡곤란","고음발성장애"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q40"},{"id":"2025-L39-Q42","year":2025,"qnum":42,"jokbo_lec_no":39,"lecture":"부갑상선질환의 핵의학 검사 및 치료/외과적 치료","professor":"천기정/채영준","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음 중 일차성 부갑상선기능항진증이 의심되는 소견은?","stem_table":"| 초음파 소견 | |\n|---|---|\n| Thyroid gland | Normal size and echogenecity of both thyroid glands |\n| Right | No focal lesion |\n| Left | upper posterior, 1.2x1.3x1.0cm, hypoechoic nodule r/o Parathyroid adenoma vs hyperplasia |","options":["가","나","다","라","마"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q42_p25.png","note":null,"id_simple":"2025-Q42"},{"id":"2025-L39-Q44","year":2025,"qnum":44,"jokbo_lec_no":39,"lecture":"부갑상선질환의 핵의학 검사 및 치료/외과적 치료","professor":"천기정/채영준","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"20세 여성이 손과 입 주위의 저림 증상을 주소로 응급실에 내원하였다. 환자는 최근 갑상선절제술을 받은 병력이 있으며, 수술 후 특별한 약물은 복용하지 않고 있었다. 활력 징후는 안정적이고, 신경학적 검사에서 입 주변을 가볍게 두드릴 때 근육이 수축하는 Chvostek 징후가 확인되었다.\n혈중 칼슘/인 6.3/5.5 mg/dL, 혈중 요소질소/크레아티닌 10/0.8 mg/dL, 부갑상선호르몬 <5 pg/mL (10-6","stem_table":null,"options":["칼슘 경구 투여","단순 비타민 D 경구 투여","티아지드 투여","인산 결합제 투여","재조합 부갑상선호르몬 투여"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q44"},{"id":"2025-L39-Q86","year":2025,"qnum":86,"jokbo_lec_no":39,"lecture":"부갑상선질환의 핵의학 검사 및 치료/외과적 치료","professor":"천기정/채영준","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"골다공증 외 평소 건강한 62세 여자가 인근 의원에서 시행한 검진 초음파에서 갑상선 결절이 의심된다고 들었다. 추가로 시행한 혈액검사, 초음파 영상 및 판독 소견, 핵의학검사 영상 결과이다. 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| PTH | 105 pg/mL | 15-65 |\n| Ca | 11.3 mg/dL | 8.8-10.5 |\n| P | 5.5 mg/dL | 2.5-4.5 |\n| Na | 140 mmol/L | 135-145 |\n| K | 3.7 mmol/L | 3.5-5.5 |","options":["6개월 후 혈액 검사 재검","left upper focused parathyroidectomy","right lower focused parathyroidectomy","total parathyroidectomy with auto-transplantation","bilateral neck exploration"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q86_p25.png","note":null,"id_simple":"2025-Q86"},{"id":"2025-L40-Q2","year":2025,"qnum":2,"jokbo_lec_no":40,"lecture":"포도당 대사, 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"식후 2시간 후 체내에서 일어나고 있는 에너지 대사작용으로 가장 가능성이 가장 높은 것은?","stem_table":null,"options":["혈중 글루카곤 레벨이 증가되어 있다.","간세포에서 ketone body의 합성이 증가되어 있다.","지방세포에서 triacylglycerol의 합성이 증가되어 있다.","근육세포에서 fatty acid의 분해가 증가되어 있다.","brain에서 ketone body의 사용이 활성화되어 있다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q2"},{"id":"2025-L40-Q33","year":2025,"qnum":33,"jokbo_lec_no":40,"lecture":"포도당 대사, 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"철수는 일본여행 중 대지진에 의해 건물잔해에 매몰된 지 4주 만에 극적으로 구출되었다. 구출 당시 철수의 brain의 대사상태에 대해 가장 옳은 설명은?","stem_table":null,"options":["철수의 brain은 간이 제공하는 glucose를 주에너지원으로 사용하고 있다.","철수의 brain은 지방조직에서 제공하는 fatty acid를 주에너지원으로 사용하고 있다.","철수의 brain은 간이 제공하는 ketone body를 주에너지원으로 사용하고 있다.","철수의 brain이 사용하는 glucose는 근육의 glycogen이 분해된 산물이다.","철수의 근육은 철수의 brain에 glucose를 제공하기 위해 지속적으로 단백질을 분해하고 있다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q33"},{"id":"2025-L40-Q75","year":2025,"qnum":75,"jokbo_lec_no":40,"lecture":"포도당 대사, 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"50세 남성인 김철수 씨는 수년간 진행되어 온 비만으로 병원에 내원하여 혈액검사를 받은 결과, 공복혈당치와 당화혈색소 수치가 정상범위를 크게 상위하여 제2형 당뇨로 진단받았다. 김철수 씨의 대사 상황에 대해 가장 가능성이 높은 설명은?","stem_table":null,"options":["간세포에서의 triacylglycerol 합성이 증가되어 있다.","지방세포로의 fatty acid 유입이 증가되어 있다.","지방세포로의 glucose 유입이 증가되어 있다.","지방세포의 adiponectin 분비가 증가되어 있다.","혈중 leptin level이 감소되어 있다."],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q75"},{"id":"2025-L40-Q93","year":2025,"qnum":93,"jokbo_lec_no":40,"lecture":"포도당 대사, 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"42세의 남성이 응급실에 실려 왔다. 이 남자는 고속도로 터널 공사 현장이 무너져 내리면서 갇혀 지낸 지 8일 만에 구조된 상태였으며, 그동안 물 외에는 섭취한 음식이 없이 버텨왔다고 하였다. 다음 중 이 환자의 혈액에서 정상인보다 현저히 높은 농도로 측정될 가능성이 있는 분자는?\n다음 보기 중 선택지가 아래 화학구조로 표시되어 있다.\n(선택지","stem_table":null,"options":["포도당 (glucose)","발린 (valine)","β-hydroxybutyrate (케톤체)","류신 (leucine)","ATP"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q93_p26_a_glucose.png","note":"선지가 화학구조 이미지로 제시됨 (img_2025/Q93_p26_[a-e].png); 각 이미지의 분자명으로 대체 기재","id_simple":"2025-Q93"},{"id":"2025-L41-Q23","year":2025,"qnum":23,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"19세 남자가 다뇨, 다갈, 체중 감소를 주소로 내원하였다. 증상은 3주 전부터 시작되었으며, 최근 들어 피곤함이 심해지고 시야가 흐려졌다고 한다. 평소 건강했으며 과거력 및 가족력에서 특이사항은 없다. 환자는 마른 체형이며, BMI는 19.2 kg/m2이다. 혈압은 108/72 mmHg, 맥박은 102회/분이다.\n이 질환의 역학적 및 유전적 특성에 대한 설명으로 맞지 않는 것은?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈당 | 468 mg/dL | |\n| HbA1c | 11.8% | |\n| C-펩타이드 | 0.1 ng/mL | 0.8-3.5 ng/mL |\n| Anti-GAD 항체 | 양성 | |\n| TSH | 6.2 mIU/L | 0.4-4.1 |\n| Free T4 | 0.98 ng/dL | 0.93-2.13 |\n| 케톤(소변) | 양성 | |","options":["상염색체 우성으로 유전된다.","대부분의 환자들은 가족력이 없다.","가족 내 상대 위험도(λs)는 약 10 정도이다.","HLA 유전자가 유전적 감수성에 큰 영향을 준다.","북유럽에 비해 우리나라에서는 낮은 발병률을 보인다."],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q23"},{"id":"2025-L41-Q45","year":2025,"qnum":45,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"52세 남자가 최근 체중이 증가하고, 식후에 졸리고 피곤하다고 병원에 왔다. 환자는 10년 전부터 고혈압으로 치료 중이며, 아버지가 60대 초반에 당뇨병 진단을 받은 병력이 있다. 신체 검진 결과 키: 172 cm, 체중: 94 kg (BMI 31.8 kg/m","stem_table":"| 검사 | 결과 |\n|---|---|\n| 공복 혈당 | 146 mg/dL |\n| 2시간 OGTT 혈당 | 232 mg/dL |\n| HbA1c | 8.2% |\n| 공복 인슐린 | 증가 |\n| C-펩타이드 | 3.8 ng/mL |\n| AST/ALT | 48/52 IU/L |\n| HDL | 37 mg/dL |\n| 중성지방 | 242 mg/dL |","options":["인크레틴 효과가 증가한다","간에서 포도당신생합성이 억제된다","알파세포 글루카곤 분비가 감소한다","근육에서 인슐린수용체 신호는 증가한다","베타세포 기능이 인슐린 저항성을 극복하지 못한다"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q45"},{"id":"2025-L41-Q78","year":2025,"qnum":78,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음 중 당뇨병의 진단 기준에 합당한 것은?","stem_table":null,"options":["HbA1c 6.2%","식후 1시간째 자가혈당 측정결과 220 mg/dL","8시간 이상 금식 후 Fasting Plasma Glucose 110 mg/dL","75g 경구당부하검사 2시간째 Plasma Glucose 180 mg/dL","전형적인 고혈당의 증상이 있으면서 Random Plasma Glucose 280 mg/dL"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q78","reparsed":true},{"id":"2025-L42-Q51","year":2025,"qnum":51,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"47세 남자가 검진 상 당뇨병으로 진단되어 내원하였다. 검사 결과와 안저소견 [사진]은 다음과 같았다. 치료는?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈색소 | 15.4 g/dL | |\n| 백혈구 | 8,500/mm2 | |\n| 혈소판 | 200,000/mm2 | |\n| AST | 20 U/L | |\n| ALT | 23 U/L | |\n| BUN/Cr | 21.0/0.9 mg/dL | |\n| Na+/K+ | 142/4.1 mEq/L | |\n| 공복포도당 | 143 mg/dL | |\n| 당화혈색소 | 7.6% | |\n| 소변 알부민, 포도당 | 음성 | |","options":["아스피린 복용","철저한 혈당 조절","Anti-VEGF therapy","범망막광응고술 (Panretinal Photocoagulation)","nonsteroidal mineralocorticoid receptor antaginist (Finerenone)"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q51_p27.png","note":null,"id_simple":"2025-Q51"},{"id":"2025-L42-Q58","year":2025,"qnum":58,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"65세 남자가 6개월 전부터 다리가 아파서 왔다. 환자는 10년 전 당뇨병으로 진단받고 경구혈당강하제로 치료 중이다. 키 172cm, 체중 65Kg, 혈압은 140/90 mmHg 였다. 혈액 검사상 공복혈당 156 mg/dL, HbA1c 8.7%였다. 흡연자였고, 음주력은 없었다. 50m 정도 걸으면 오른쪽 종아리가 아프고 2개월 전부터 점점 심해졌다. 발목상완혈압비는 오른쪽 0.61 / 왼쪽 0.80 이었다. 진단은?","stem_table":null,"options":["단일신경병증","말초동맥질환","원위대칭다발신경병증","자율신경병증","척추관협착증"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q58"},{"id":"2025-L42-Q64","year":2025,"qnum":64,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"65세 여자가 발이 붓는다고 왔다. 환자는 20년 전 당뇨병으로 진단받고 메트포르민, 안지오텐신전환효소억제제와 스타틴을 복용 중이다. 혈압은 120/70 mmHg, 검사결과는 다음과 같다. 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈색소 | 12.9 g/dL | |\n| 총단백질/알부민 | 6.9/4.5 g/dL | |\n| 공복혈장포도당 | 115 mg/dL | |\n| 당화혈색소 | 6.5% | |\n| 총콜레스테롤 | 141 mg/dL | |\n| 중성지방 | 113 mg/dL | |\n| HDL-C | 59 mg/dL | |\n| BUN/Cr | 15/1.58 mg/dL | |\n| eGFR | 44.2 ml/min/1.73m2 | |\n| 소변 알부민/크레아티닌비 | 2200 mg/g | |","options":["아스피린","Fenofibrate","단백질 섭취 제한","안지오텐신수용체 차단제","소듐포도당운반수송체-2 억제제(SGLT-2 inhibitor)"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q64"},{"id":"2025-L42-Q80","year":2025,"qnum":80,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"65세 남자가 3달 전부터 시작된 발의 통증으로 내원하였다. 환자는 10년 전 당뇨병으로 진단받고 경구혈당강하제로 치료 중이다. 키 172cm, 체중 65Kg, 혈압은 130/80 mmHg 였다. 혈액 검사상 공복혈당 156 mg/dL, HbA1c 8.7%였다. 흡연자였고, 음주력은 없었다. 양발이 시리고 아픈 통증이 있었고, 휴식 시나 야간에 악화되었다. 모노필라멘트검사상 오른발 10개 중 5개, 왼발 10개 중 4개를 인지하였다. 발목상완혈압비는 1.13 이었다. 진단은?","stem_table":null,"options":["단일신경병증","말초동맥질환","원위대칭다발신경병증","자율신경병증","척추관협착증"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q80"},{"id":"2025-L42-Q81","year":2025,"qnum":81,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"당뇨병은 우리 몸의 여러 장기를 침범하는 대표적인 만성질환의 하나이다. 특히 2형 당뇨병 환자는 초기부터 합병증이 문제시되는 경우가 많은 데 당뇨병 합병증 관리에 있어서 맞는 설명은?","stem_table":null,"options":["당뇨병 환자는 LDL-콜레스테롤 보다는 중성지방이 높으므로, Fibrate 계열 약제를 우선적으로 사용한다.","당뇨병이 아닌 사람에 비해 당뇨병 환자는 HDL-콜레스테롤이 상승되어 있다.","망막합병증은 당뇨병 초기에는 잘 오지 않는다.","신장합병증은 다른 미세혈관 합병증인 신경합병증 및 망막합병증과 같이 동반되는 경우가 많다.","신장합병증을 예방하거나, 진행을 늦추기 위해서는 혈당 조절에만 신경 쓰면 되고 혈압에는 크게 영향받지 않는다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q81"},{"id":"2025-L42-Q94","year":2025,"qnum":94,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"당뇨병은 우리 몸의 여러 장기를 침범하는 대표적인 만성질환의 하나이다. 이에 대한 설명으로 맞는 것은?","stem_table":null,"options":["이상지혈증 중 LDL콜레스테롤이 중요하며, 심혈관질환 예방을 위해서는 160 mg/dL 이하로 조절하는 것이 추천된다.","망막합병증은 혈당 조절 정도보다는 고지혈증 조절에 더 영향을 많이 받는다.","신경합병증은 혈관 합병증과는 무관하게 발생한다.","신장합병증은 신사구체 여과율을 중점적으로 봐야 하며, 단백뇨와는 직접적인 관련성은 적다.","대혈관 합병증 중, 우리나라를 포함한 아시아인은 뇌졸중 발생이 높은 편이어서 이 부분도 주의 깊게 봐야 한다."],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q94","reparsed":true},{"id":"2025-L43-Q74","year":2025,"qnum":74,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"80세 남자가 말이 어눌해지고 가족을 알아보지 못하여 응급실로 실려왔다. 10년 전 뇌경색이 있어 고혈압약, 고지혈증약, 아스피린 등을 복용 중이었으나 병원에 잘 가지 않았다. 최근 1개월 간 기운이 약해져서 주로 집에서 누워 지내고 섭식이 감소하면서 체중이 줄은 것을 제외하면 특별한 특이 증상을 호소하지는 않았다. 과호흡이나 과일향 호흡은 관찰되지 않았다.\n혈압 100/50 mmHg, 맥박 120회/분, 호흡수 및 체온 정상, 혈당측정기: 측정불가(high)\n이 환자에게 혈액검사를 위한 채혈 후 가장 먼저 해야 할 일은?","stem_table":null,"options":["인슐린 정주","생리식염수 정주","칼륨 투여","brain MRI 촬영","포도당 용액 정주"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q74"},{"id":"2025-L43-Q85","year":2025,"qnum":85,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"당뇨병성 케톤산증의 발병기전으로 가장 합당한 것은?","stem_table":null,"options":["소변 오스몰 감소","발열","구토 복통","인슐린/글루카곤 비율 감소","저혈당"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q85"},{"id":"2025-L43-Q97","year":2025,"qnum":97,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"인슐린 결핍으로 인한 체내 변화로 옳은 것은?","stem_table":null,"options":["혈중 아미노산 감소","혈중 포도당 감소","케톤 생성 증가","케톤 제거 증가","단백 합성 증가"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q97"},{"id":"2025-L44-Q5","year":2025,"qnum":5,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학 (정재용), 당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중에서 약리학적 기전이 나머지 약물과 가장 다른 약물은?","stem_table":null,"options":["Liraglutide","Nateglinide","Pioglitazone","Glimepiride","Sitagliptin"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q5"},{"id":"2025-L44-Q14","year":2025,"qnum":14,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학 (정재용), 당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 당뇨병 치료제에 대한 설명으로 가장 옳은 내용은?","stem_table":null,"options":["Meglitinide는 저혈당을 유발하지 않는다.","Metformin과 DPP-4 억제제의 체중에 대한 영향이 다르다.","SGLT2 억제제는 CKD-EPI stage 4 환자에서 사용될 수 있다.","Glargine, Degludec 등 long acting 인슐린 제제는 정맥으로 지속적 투입용법으로 사용한다.","Teplizumab은 제1형 당뇨병 발병 시 치료제로 사용된다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q14"},{"id":"2025-L44-Q17","year":2025,"qnum":17,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학 (정재용), 당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"당뇨병은 만성 질환으로 지속적인 관리가 중요하다. 최근 연구결과에 근거할 때 당뇨병을 관리하는 방법으로 가장 적절한 것은?","stem_table":null,"options":["원칙적으로 생활습관 개선 보다는 약물 치료를 우선적으로 고려한다.","당뇨병의 경과에 대한 이해와 이를 위한 교육은 초기보다는 당뇨병이 어느 정도 진행된 다음에 하는 것이 더 효과적이다.","저혈당이 오더라도 혈당 조절을 철저히 하는 것이 어느 시점에서나 합병증 예방에 도움이 된다.","혈당뿐만 아니라 혈압 및 지질 수치를 통합적으로 관리하도록 한다.","기대 여명이 얼마 남지 않았더라도, 철저한 혈당 조절이 사망률 감소에 매우 중요하다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q17"},{"id":"2025-L44-Q34","year":2025,"qnum":34,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학 (정재용), 당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중 체중에 대한 영향이 나머지 약물들과 다른 약물은?","stem_table":null,"options":["Glipizide","Glargine","Repaglinide","Empagliflozin","Lobeglitazone"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q34"},{"id":"2025-L44-Q91","year":2025,"qnum":91,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학 (정재용), 당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"62세 남자가 체중 감소로 왔다. 환자는 2년 전부터 심부전으로 안지오텐신수용체차단제와 베타차단제를 복용 중이다. 키 171 cm, 체중 80Kg, 혈압 130/82 mmHg, 맥박 72회/분이다.\n치료는?","stem_table":"| 검사 | 결과 |\n|---|---|\n| 공복혈장포도당 | 170 mg/dL |\n| 당화혈색소 | 7.5% |\n| BUN/Cr | 22/1.1 mg/dL |\n| C-peptide | 2.6 ng/dL (0.8~3.5) |","options":["인슐린","설포닐유레아","싸이아졸리딘다이온","다이펩타이드분해효소-4 억제제 (DPP-4 inhibitor)","소듐포도당운반수송체-2 억제제(SGLT-2 inhibitor)"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q91"},{"id":"2025-L45-Q36","year":2025,"qnum":36,"jokbo_lec_no":45,"lecture":"임신성/노인 당뇨병","professor":"임수","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"다음 중 임신 중 고혈당이 산모와 태아에게 미치는 영향에 대한 설명으로 맞는 것은?","stem_table":null,"options":["선천성 기형의 발생 가능성은 높아지나, 유산의 위험성은 증가하지 않는다.","고인슐린혈증으로 태아의 성장에 장애가 된다.","임신성 당뇨병 산모의 자녀는 향후 비만의 위험이 증가하나, 당뇨병으로 이어지지는 않는다.","선천성 기형은 주로 심혈관계, 신경계, 골격계에 잘 발생하며, 다발성, 중증의 특성을 가지고 있어 치명적일 수 있다.","태아가 미숙아가 될 가능성이 있어, 가능하면 40주까지 임신기간을 다 채우고 출산하도록 한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q36"},{"id":"2025-L45-Q56","year":2025,"qnum":56,"jokbo_lec_no":45,"lecture":"임신성/노인 당뇨병","professor":"임수","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"노인의 당뇨병은 비특이적 증상이 흔하고, 근력 감소가 흔히 동반된다. 이러한 근감소증의 진단을 위해 일반적으로 근육량 측정을 하게 되는데 다음 중 근육량 감소를 진단하기 위해 가장 추천되는 검사 방법은?","stem_table":null,"options":["Stair climb power test","Dual X-ray Energy Absorptiometry","MRI","Thyroid function test","Computed tomography"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q56"},{"id":"2025-L45-Q73","year":2025,"qnum":73,"jokbo_lec_no":45,"lecture":"임신성/노인 당뇨병","professor":"임수","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"다음 중 임신성 당뇨병과 관련되어 맞는 설명은?","stem_table":null,"options":["임신 말기에는 인슐린에 민감성이 임신 전에 비하여 약 3배 증가한다.","임신성 당뇨병의 진단은 24주에 50g 경구 당부하 검사 후 혈당이 높은 경우 100g 당부하 검사를 하되 공복은 95g/dl 이상, 1시간은 180 mg/dl 이상, 2시간은 155 mg/dl 이상, 3시간에는 140 mg/dl 이상이면 진단할 수 있다.","임신성 당뇨병의 치료는 경구 당뇨병 약제를 우선적으로 사용한다.","임신성 당뇨병 산모는 출산 후에 혈당이 더욱 악화된다.","산모의 혈당은 태반을 통과하지 못하나, 인슐린은 통과하여 태아가 거대아가 될 수 있다."],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q73"},{"id":"2025-L46-Q37","year":2025,"qnum":37,"jokbo_lec_no":46,"lecture":"저혈당증","professor":"윤지완","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"30세 남자가 의식을 잃고 응급실에 왔다. 당시 혈중 glucose 30 mg/dL였다. 18세에 1형 당뇨병을 진단받고, 현재 인슐린 다회주사요법으로 혈당조절 중이다. 아래 저혈당에 대한 체내 보호 기전 중, 이 환자에서 의식소실이 발생한 가장 중요한 원인(제대로 작용하지 못해 문제가 된 것)은?","stem_table":null,"options":["내인성 인슐린 분비 감소/억제","글루카곤 분비 증가","에피네프린 분비 증가","코르티솔 분비 증가","성장호르몬 분비 증가"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q37"},{"id":"2025-L46-Q68","year":2025,"qnum":68,"jokbo_lec_no":46,"lecture":"저혈당증","professor":"윤지완","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"60세 남자가 의식 소실로 구급차를 타고 응급실에 내원하였다. 환자는 당뇨병에 대해 인슐린 다회주사 치료를 받고 있었으며, 의식 소실 전 손, 발 떨림, 식은땀, 어지러움 등의 증상을 호소하였다. 구급차에서 측정한 혈당 42 mg/dL, 응급실에 도착하여 시행한 혈액검사에서 혈장 glucose 50 mg/dL였다. 본 환자에서 발생한 증상의 원인으로서 저혈당 진단을 위한 필요조건은?","stem_table":null,"options":["HbA1c 측정","72시간 공복 검사","Mixed meal test","당류 섭취 혹은 투약 이후 혈당 상승","현재 상태에서 C-peptide, insulin 측정"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q68"},{"id":"2025-L46-Q92","year":2025,"qnum":92,"jokbo_lec_no":46,"lecture":"저혈당증","professor":"윤지완","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"22세 여자가 의식을 잃고 응급실에 왔다. 시행한 혈액검사는 다음과 같다.\n가장 가능성 높은 저혈당의 원인은?","stem_table":"| 검사 | 결과 |\n|---|---|\n| plasma glucose | 35 mg/dL |\n| plasma insulin | 15.2 μU/mL |\n| plasma c-peptide | 0.2 ng/mL |\n| Insulin Ab | 음성 |\n| Insulin receptor Ab | 음성 |","options":["외인성 인슐린 주사","인슐린종","Diazoxide 복용","인슐린자가면역 증후군","덤핑증후군"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q92"},{"id":"2025-L47-Q54","year":2025,"qnum":54,"jokbo_lec_no":47,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"저밀도 콜레스테롤 (low density lipoprotein, LDL) 수용체는 저밀도콜레스테롤의 대사에 가장 중요하다. 수용체-LDL 복합체를 리소좀 (Lysosome)에서 분해되도록 유도하여 저밀도 콜레스테롤 수용체 재활용을 현저하게 방해하는 물질로 최근 이에 대한 억제제(inhibitor)가 저밀도 콜레스테롤을 낮추는 중요한 치료제로 사용되고 있는 것은 무엇인가?","stem_table":null,"options":["PCSK9","Apolipoprotein A","Apolipoprotein CII","Hormone sensitive lipase","Cholesterylester Transfer Protein (CETP)"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q54"},{"id":"2025-L47-Q57","year":2025,"qnum":57,"jokbo_lec_no":47,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"23세의 여성이 건강검진을 위해 검진 전날 저녁 6시 이후로 물 외에는 섭취하지 않은 상태이다. 검진 당일 아침 공복 상태에서, 해당 검진자에게 에너지원이 되는 지질(lipid)을 간으로부터 혈류로 운반하는 주된 지단백질에서 발견되지 않는 아포지질단백질 (apolipoprotein)은?","stem_table":null,"options":["Apo B-48","Apo B-100","Apo C-II","ApoE","위 네 가지 모두 발견된다"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q57"},{"id":"2025-L47-Q82","year":2025,"qnum":82,"jokbo_lec_no":47,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"다음 중 그 혈중 농도가 죽상경화증(atherosclerosis) 위험도와 음의 상관관계를 보이는 지단백질은?","stem_table":null,"options":["Chylomicron","Very low density lipoprotein","Low density lipoprotein","Intermediate density lipoprotein","High density lipoprotein"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q82"},{"id":"2025-L48-Q46","year":2025,"qnum":46,"jokbo_lec_no":48,"lecture":"이상지질혈증의 종류","professor":"문준호","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"58세 여성환자가 내원했다. 가족력상 고콜레스테롤혈증이 있었으며, 현재 TG 110 mg/dL, LDL 175mg/dL (정상, < 100 mg/dL). 그리고 PCSK9 단백질의 과발현이 확인되었다. 해당 기전에 가장 부합하는 설명은?","stem_table":null,"options":["LDLR 수용체 유전자 발현 억제","LDLR 수용체 재활용 억제","ApoB-100 합성 증가","HDL 생산 억제","VLDL 합성 및 수송 증가"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q46"},{"id":"2025-L48-Q66","year":2025,"qnum":66,"jokbo_lec_no":48,"lecture":"이상지질혈증의 종류","professor":"문준호","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"24세 남자가 심한 복통으로 응급실에 왔다. 검사 결과 급성췌장염으로 수액 및 약물 치료를 시작하며 시행한 혈액 검사상 중성지방 (triacylglyceride) 이 2000 mg/dl (정상 150 mg/dl 이하) 으로 측정되었고, amylase/lipase가 정상의 10배 이상 상승되었다. 담도 및 췌장관에 돌 이나 종양 등의 특이 소견은 발견되지 않았다. 환자는 음주력은 부인하였다. 과거력상 수 년 전에도 복통이 있었고 중성지방이 높다는 소견을 들었으나, 이후 특별한 약물 치료를 시행하지 않았다. 이 환자에서 이상이 있을 것으로 예상되는 것은?","stem_table":null,"options":["PCSK9","Apolipoprotein B","Apolipoprotein A","Apolipoprotein CII/CIII","Cholesteryl Ester Transfer Protein (CETP)"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q66"},{"id":"2025-L48-Q88","year":2025,"qnum":88,"jokbo_lec_no":48,"lecture":"이상지질혈증의 종류","professor":"문준호","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"46세 여자로 3년 전 당뇨병을 진단받고 약물 치료 중이다. 당화혈색소 7.5%, 갑상선 호르몬 검사 및 신장기능, 간기능 검사는 정상이었다. 최근 이상지질혈증도 약물 투여가 필요한 수치라고 듣고 스타틴 약물 처방을 받았다. 대표적인 이차성 이상지질혈증의 하나인 이 환자에서 나타나는 이상지질혈증의 형태인 것은?","stem_table":null,"options":["Apo-A1 지단백의 증가","고밀도콜레스테롤 상승","small-dense LDL의 증가","지방조직에서 지방분해 (lipolysis) 감소","장에서 생성된 카일로마이크론 생성의 감소"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q88"},{"id":"2025-L49-Q49","year":2025,"qnum":49,"jokbo_lec_no":49,"lecture":"이상지질혈증의 치료, 약물 기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"오메가3지방산 혹은 fibrate의 타겟이며 lipoprotein lipase를 조절하는 등의 기전을 통해 중성지방을 낮추는 것으로 알려진 핵수용체는?","stem_table":null,"options":["Peroxisome Proliferator-Activated Receptor (PPAR) alpha","Liver X receptor (LXR)","Peroxisome Proliferator-Activated Receptor (PPAR) gamma","Famesoid X Receptor (FXR)","Retinoid X Receptor (RXR)"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q49"},{"id":"2025-L49-Q50","year":2025,"qnum":50,"jokbo_lec_no":49,"lecture":"이상지질혈증의 치료, 약물 기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"62세 여성환자가 고지혈증으로 고용량 statin 치료 중 CK 수치가 2,000 IU/L (정상, 55~170 IU/L)로 상승하였고, 근육통을 호소하였다. 이에 대한, 치료 대안으로 적절한 것은?","stem_table":null,"options":["Statin 치료를 계속 유지","Niacin 약제를 추가","PCSK9 억제제로 전환","Fibrate 병용 투여","Statin 용량을 증가시킨 후 관찰"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q50"},{"id":"2025-L49-Q69","year":2025,"qnum":69,"jokbo_lec_no":49,"lecture":"이상지질혈증의 치료, 약물 기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"40세 여성환자가 중성 지방 (TG) 850 mg/dL (정상, < 150 mg/dL)로 입원하였다. 환자는 복통을 호소하며 췌장염 과거력이 있었다. 다음 중 가장 우선적으로 고려할 치료 약물은?","stem_table":null,"options":["Atorvastatin","Ezetimibe","Fenofibrate","PCSK9 inhibitor","Colestipol"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q69"},{"id":"2025-L50-Q8","year":2025,"qnum":8,"jokbo_lec_no":50,"lecture":"이상지질혈증의 치료","professor":"문준호","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"이전 특이병력 없던 50세 남자가 건강검진 상 고지혈증 의심소견으로 내원하였다.\n흡연 (-) 음주(-)\n173cm, 62kg, BMI 20.7 kg/m2\n혈압 120/78\nHbA1c 5.3%\nTotal cholesterol 250 mg/dL\nTriglyceride 100 mg/dL\nHDL cholesterol 36 mg/dL\n가장 적절한 치료는?","stem_table":null,"options":["statin","ezetimibe","niacin","fibrate","경과관찰"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q8"},{"id":"2025-L50-Q9","year":2025,"qnum":9,"jokbo_lec_no":50,"lecture":"이상지질혈증의 치료","professor":"문준호","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"40세 여자 환자가 고지혈증을 진단받고 내원하였다.\n163cm, 72kg, BMI 27 kg/m2\n혈압 130/88\nHbA1c 5.5%\nTotal cholesterol 237 mg/dL\nTriglyceride 520 mg/dL\nHDL cholesterol 40 mg/dL\nLDL cholesterol 93 mg/dL\n가장 적절한 치료는?","stem_table":null,"options":["statin","ezetimibe","niacin","fibrate","PCSK9 inhibitor"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q9"},{"id":"2025-L51-Q12","year":2025,"qnum":12,"jokbo_lec_no":51,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"비만인이 체중을 빼려고 노력해도 잘 빠지지 않고 원래 체중을 유지하려는 현상을 설명하는 이론은?","stem_table":null,"options":["hedonic eating model","glycemic index theory","set point theory","energy balance model","carbohydrate-insulin model"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q12"},{"id":"2025-L51-Q61","year":2025,"qnum":61,"jokbo_lec_no":51,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"Leptin과 ghrelin 등의 말초에서 분비된 호르몬이 식욕의 항상성을 조절하는 뇌 부위는?","stem_table":null,"options":["Hippocampus","Amygdala","Cerebellum","Hypothalamus","Prefrontal cortex"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q61"},{"id":"2025-L51-Q84","year":2025,"qnum":84,"jokbo_lec_no":51,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"다음은 유전적 비만을 열거한 것이다. 유전학적으로 나머지와 성격이 다른 하나는?","stem_table":null,"options":["Leptin receptor mutation","Prader-Willi syndrome","Prohormone convertase-1 mutation","Proopiomelanocortin mutation","Melanocortin 4 receptor mutation"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q84"},{"id":"2025-L52-Q52","year":2025,"qnum":52,"jokbo_lec_no":52,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"고도비만 환자에서 비만대사수술의 장기적인 효과에 대한 설명으로 옳은 것은?","stem_table":null,"options":["5% 정도의 체중 감량을 유도한다.","사망률과 심혈관질환 발생률을 낮춘다.","체질량지수 25-30 kg/m2인 모든 환자가 대상이 된다.","당뇨병 환자의 혈당 조절에는 효과가 없다.","수술 관련 단기적 합병증은 있으나 장기적 합병증은 없다."],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q52"},{"id":"2025-L52-Q70","year":2025,"qnum":70,"jokbo_lec_no":52,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"임상시험을 통해 비교하였을 때 1년간 가장 체중 감량 효과가 컸던 다이어트는?","stem_table":null,"options":["Ornish diet (low fat, high fiber)","LEARN program (low fat, calorie-restricted)","Ketogenic diet (<20~50 g CHO/day)","Zone diet (40:30:30 macronutrient balance)","Traditional Korean diet"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q70"},{"id":"2025-L52-Q76","year":2025,"qnum":76,"jokbo_lec_no":52,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"38세 여자가 배변 관련 문제로 왔다. 환자는 2주 전 인근 의원에서 체중 감량제를 처방받았는데, 악취가 나는 기름기 성분이 항문을 통해 자주 배출된다고 하였다. 환자가 복용하였을 것으로 가장 의심이 되는 약제는?","stem_table":null,"options":["naltrexone/bupropion","phentermine/topiramate","semaglutide","orlistat","acarbose"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q76"},{"id":"2025-L53-Q31","year":2025,"qnum":31,"jokbo_lec_no":53,"lecture":"소아청소년 당뇨병","professor":"김재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"13세 여아가 체중이 증가하여 병원에 왔다. 다음, 다뇨 증상은 없었다. 체질량지수는 28.2 kg/m2 (≥ 95 백분위수)였다. 목에 흑색가시세포증이 있었고 복부에 자색 선조가 관찰되었다. 검사 결과이다. 가장 적절한 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 공복혈당 | 155 mg/dL | |\n| 당화혈색소 | 7.5% | |\n| 혈중 C-펩타이드 | 3.4 ng/mL | 0.8-3.5 ng/mL |\n| 소변 케톤 | 음성 | |","options":["관찰","메트포르민","장시간 작용 인슐린","인슐린 다회 주사요법","글루카콘유사 펩티드 수용체 작용제"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q31"},{"id":"2025-L53-Q62","year":2025,"qnum":62,"jokbo_lec_no":53,"lecture":"소아청소년 당뇨병","professor":"김재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"11세 남아가 전신 쇠약과 구토, 체중 감소가 있어 병원에 왔다. 1개월 전부터 물을 많이 마시고 소변량이 증가하였다. 체중은 1개월 동안 5 kg 줄었다. 환자의 키는 155cm (50백분위), 체중은 66kg (95백분위)였고, 목과 겨드랑이에 흑색극세포증이 관찰되었다. 혈압은 130/70 mm Hg, 호흡 21회/분, 맥박 140회/분, 체온 37.1°C이었다.\n진단은?","stem_table":"| 검사 | 결과 |\n|---|---|\n| Na+ | 133 mEq/L |\n| K+ | 3.2 mEq/L |\n| 포도당 | 596 mg/dL |\n| 정맥혈 pH | 7.08 |\n| HCO3- | 10 mEq/L |\n| 소변 포도당 | 3+ |\n| 소변 케톤 | 3+ |\n| IA-2 항체 | 43 U/mL (참고치 <1.0) |","options":["2형 당뇨병","1기 1형 당뇨병","2기 1형 당뇨병","3기 1형 당뇨병","유전성 당뇨병"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q62"},{"id":"2025-L53-Q83","year":2025,"qnum":83,"jokbo_lec_no":53,"lecture":"소아청소년 당뇨병","professor":"김재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"10세 남아가 계속 자려고만 하여 병원에 왔다. 2주 전부터 물을 많이 마시고 소변량이 증가하였다. 체중은 2주 동안 4 kg 줄었다. 4시간 전부터는 구토를 하여 아무것도 먹지 못하고 소변도 보지 못하였다. 혈압은 95/50 mm Hg, 호흡 30회/분, 맥박 105회/분, 체온 37.2°C이었다.\n초기 치료는?","stem_table":"| 검사 | 결과 |\n|---|---|\n| Na+ | 133 mEq/L |\n| K+ | 3.2 mEq/L |\n| 포도당 | 660 mg/dL |\n| 정맥혈 pH | 7.01 |\n| HCO3- | 3 mEq/L |\n| 소변 포도당 | 4+ |\n| 소변 케톤 | 3+ |","options":["만니톨 정맥 주사","3% 식염수 정맥 주사","0.9% 식염수 정맥 주사","초속효성 인슐린 정맥 주사","장기작용 인슐린 피하 주사"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q83"},{"id":"2025-L54-Q27","year":2025,"qnum":27,"jokbo_lec_no":54,"lecture":"소아청소년 비만, 저혈당","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"3세 여아가 의식이 없어 병원에 왔다. 아침에 깨워도 일어나지 않으며, 식은땀을 흘리고 있었다. 키는 96cm (56백분위수), 체중 12kg (5백분위수), 체질량지수는 13.0 kg/m(3백분위수 미만)였다. 1일 전 가족들과 물놀이를 다녀와서 평소보다 저녁을 적게 먹고 잠이 들었다고 한다. 발달은 정상이고 과거 질병이나 외상 병력은 없다. 응급실에서 10% 포도당 수액 투여 후 의식이 회복되었다.\n적절한 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈당 | 35 mg/dL | |\n| 인슐린 | 1 mIU/L | 4-16 |\n| 소변 케톤 | 3+ | |","options":["케톤식","옥수수전분","고탄수화물식","다이아조사이드 경구 투여","옥트레오타이드 피하 주사"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q27"},{"id":"2025-L54-Q65","year":2025,"qnum":65,"jokbo_lec_no":54,"lecture":"소아청소년 비만, 저혈당","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"14세 여아가 체중이 늘어 병원에 왔다. 골연령은 역연령과 동일하였다. 월경은 규칙적이었고 골연령은 역연령과 동일하였다. 머리 손상이나 발달지연은 없었다. 성장곡선은 그림과 같다. 진단은?\n(환자의 BMI: [판독불가])","stem_table":"| 백분위수 | 85백분위수 | 95백분위수 | 99백분위수 |\n|---|---|---|---|\n| 체질량지수 | 22.0 | 23.1 | 24.8 |","options":["단순 비만","쿠싱 증후군","시상하부성 비만","프라더-윌리 증후군","선천성 뇌하수체 저하증"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q65"},{"id":"2025-L54-Q90","year":2025,"qnum":90,"jokbo_lec_no":54,"lecture":"소아청소년 비만, 저혈당","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"10세 여아가 체중이 많아서 병원에 왔다. 키는 140 cm, 체중 49kg이었다. 진단은?\n(환자 BMI = 49/(1.40^","stem_table":"| 백분위수 | 85백분위수 | 95백분위수 | 99백분위수 |\n|---|---|---|---|\n| 체질량지수 | 22.0 | 23.1 | 24.8 |","options":["정상","과체중","1단계 비만","2단계 비만","3단계 비만"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q90"},{"id":"2025-L55-Q4","year":2025,"qnum":4,"jokbo_lec_no":55,"lecture":"여성호르몬 분비/조절 기전","professor":"서창석","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"다음중 시상하부-뇌하수체-난소 축 (H-P-O axis) 조절과 관련된 설명 중 맞는 것은?","stem_table":null,"options":["시상하부-전방 뇌하수체는 직접적으로 신경이 연결되어 (direct neuronal connection) 있다.","GnRH는 지속적으로 분비되어야 (continuous secretion) FSH/LH를 자극한다.","Kisspeptin 뉴론은 GnRH 뉴론과 시냅스를 형성하여 GnRH의 분비를 자극한다.","Neurokinen B (NKB)는 kisspeptin을 억제, Dynorphin은 kisspeptin을 자극한다.","GnRH는 20개의 아미노산으로 구성되어 있다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q4"},{"id":"2025-L55-Q6","year":2025,"qnum":6,"jokbo_lec_no":55,"lecture":"여성호르몬 분비/조절 기전","professor":"서창석","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"다음 그림은 월경주기에 따른 호르몬의 변화를 나타내고 있다. 다음 빈칸 \"A\"에 해당하는 호르몬은?","stem_table":null,"options":["Estradiol","Progesterone","17-OH-progesterone","FSH","LH"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q6_p32_menstrual.png","note":null,"id_simple":"2025-Q6"},{"id":"2025-L55-Q89","year":2025,"qnum":89,"jokbo_lec_no":55,"lecture":"여성호르몬 분비/조절 기전","professor":"서창석","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"다음 중 난소의 해부학적 구조 및 스테로이드 합성에 대한 설명 중 맞는 것은?","stem_table":null,"options":["난소 내 일차난포(primary follicle)부터 FSH에 의존 (FSH dependent)하여 발달한다.","임신 제2분기에 난자는 meiosis I diplotene stage에 정지한 상태로 있다가 정자와 수정되면 1st polar body가 extrusion 되면서 meiosis I이 완결된다.","성인 여성의 배란 전 난소에서 합성된 Testosterone은 5α-reductase에 의하여 더욱 강력한 DHT(dihydrotestosterone)으로 변형된다.","여성의 난소는 21-hydroxylase, 11β-hydroxylase가 없어서 glucocorticoid, mineralocorticoid를 생산하지 못한다.","E2 (Estradiol)은 FSH 분비를 자극하고, Inhibin B는 FSH 분비를 억제한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q89"},{"id":"2025-L56-Q26","year":2025,"qnum":26,"jokbo_lec_no":56,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"21세 대학생 여성이 최근 7개월간 지속되는 무월경으로 병원에 내원하였다. 환자는 이전에는 규칙적인 월경이 있었다고 하며, 환자는 최근 육상대회 준비를 하며, 하루 6시간 이상 고강도 훈련을 지속하며, 식사량을 제한하고 있다고 하였다. 성관계 경험은 없다고 하였고, 활력징후는 정상이며, 체질량지수 (Body Mass Index, BMI)는 17kg/m2이다. 이차성징 평가 시 유방 및 음모 발달은 Tanner stage 5였다.\n골반 초음파 상 우측 난소의 난포 개수는 5개, 좌측 난소의 난포 개수는 10개이다. 이 환자에게 우선적으로 시행할 수 있는 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| FSH | 2.1 mIU/mL | 1-14 |\n| LH | 1.4 mIU/mL | 1-24 |\n| Estradiol | 25 pg/mL | 53-191 |\n| TSH | 2.5 mIU/L | 0.3-4.0 |\n| Prolactin | 2.2 ng/mL | 3~20 |\n| Total Testosterone | 0.25 ng/mL | 0-0.62 |\n| hCG | <0.01 mIU/mL | |","options":["도파민 작용제 투여","체중 증가","경구피임약 투여","GnRH agonist 투여","자궁내 장치 삽입"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q26"},{"id":"2025-L56-Q43","year":2025,"qnum":43,"jokbo_lec_no":56,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"32세 여성이 최근 월경이 없어 내원하였다. 마지막 월경은 1년 전이었으며 이후 월경은 없었고, 그 전까지는 비교적 규칙적이었다고 한다. 약 2년 전부터 스트레스를 심하게 받았고 이로 인한 우울증으로 정신건강의학과를 다니고 있으며 우울증약을 복용중이라고 한다. 무기력감을 호소하였으며 양측 유두에서 분비물이 나온다고 하였다.\n이후 시행해야 할 검사는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| FSH | 6.0 mIU/ml | 5-20 |\n| LH | 5.2 mIU/mL | 5-20 |\n| 에스트라디올 | 44 pg/mL | 20-400 |\n| TSH | 2.5 mIU/L | 0.34-4.25 |\n| 프로락틴 | 110 ng/mL | 1.9-25 |","options":["뇌하수체 MRI","정신건강의학과 상의 하에 복용약물 중단 후 프로락틴 재검사","유리 티록신 (free T4)","유리 테스토스테론 (free testosterone)","17- 수산화프로게스테론 (17-OHP)"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q43"},{"id":"2025-L56-Q60","year":2025,"qnum":60,"jokbo_lec_no":56,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"17세 여아가 초경이 시작되지 않아 내원하였다. 환자는 마지막으로 3개월 전 성관계를 가졌다고 하며 피임약은 복용하지 않는다. 골반 통증은 없다고 하며, 신체 검사에서는 유방 및 음모 발달 정상적이지만 내진 시 자궁이 만져지지 않는다. 골반 초음파에서도 자궁이 보이지 않는다.\n가장 적절한 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 핵형검사 | 46, XX | |\n| FSH | 10.7 mIU/mL | 1-14 |\n| LH | 5.5 mIU/mL | 1-24 |\n| Estradiol | 70 pg/mL | 53-191 |\n| TSH | 2.5 mIU/L | 0.3-4.0 |\n| Prolactin | 4.3 ng/mL | 3-20 |\n| Total Testosterone | 0.25 ng/mL | 0-0.62 |","options":["안드로겐 무반응 증후군","뮐러관 무발생","칼만 증후군","터너 증후군","초기 난소 부전"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q60"},{"id":"2025-L57-Q21","year":2025,"qnum":21,"jokbo_lec_no":57,"lecture":"미성년내분비학","professor":"한지연","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"5세 여아가 비정상 질출혈로 왔다. 진찰을 위해 가장 먼저 취해야 할 기본적 자세는?","stem_table":null,"options":["Frog leg position","Knee chest position","Fowler's position","Reverse trendelenburg position","Right lateral recumbent position"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q21_p33.png","note":null,"id_simple":"2025-Q21"},{"id":"2025-L57-Q22","year":2025,"qnum":22,"jokbo_lec_no":57,"lecture":"미성년내분비학","professor":"한지연","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"3세 여아가 질이 잘 보이지 않아 내원하였다. 환자의 이학적 검진에서 아래와 같은 소견을 보였다. 환아의 부모가 치료를 원하는 경우 시행해볼 수 있는 치료 방법은?","stem_table":null,"options":["topical emollient","estrogen cream","metronidazole ointment","medroxyprogesterone acetate","corticosteroid"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q22_p33.png","note":null,"id_simple":"2025-Q22"},{"id":"2025-L57-Q28","year":2025,"qnum":28,"jokbo_lec_no":57,"lecture":"미성년내분비학","professor":"한지연","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"5살 아이가 외음부 외상으로 방문하였다. 아이의 병력 청취와 진찰 시 지켜야 할 사항으로 옳은 것은?","stem_table":null,"options":["아이와 라포 (rapport) 형성을 위해 관심 있어하는 주제로 질문을 한다.","진료실 환경은 진료 결과에 영향을 주지 않는다.","모든 질문은 보호자에게만 한다.","간호인력의 역할은 진료 환경과 관련없으며, 중요하지 않다.","성인과 동일한 진료 방법으로 진료한다."],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q28"},{"id":"2025-L58-Q15","year":2025,"qnum":15,"jokbo_lec_no":58,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제 처방에 관한 WHO 가이드라인에서 category 1 (사용가능) 또는 category 2 (위험보다는 이득이 더 많음) 에 속하는 경우는?","stem_table":null,"options":["현재 유방암","중증 간경화","35세 이상의 흡연자","aura가 있는 migraine","혈전 위험 요인이 없는 산욕기 5주차"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q15"},{"id":"2025-L58-Q25","year":2025,"qnum":25,"jokbo_lec_no":58,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"30세 미혼 여자가 성관계 후 사후응급피임제 처방을 원하여 병원에 왔다. 성관계시 콘돔 착용 없이 질내 사정이 이루어졌으며 병원 도착은 성관계 후 82시간이 지난 시점이었다. 적절한 처방은?","stem_table":null,"options":["dienogest 2 mg","levonorgestrel 1.5 mg","ulipristal acetate 30 mg","cyproterone acetate 2 mg","medroxyprogesterone 10 mg"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q25"},{"id":"2025-L58-Q96","year":2025,"qnum":96,"jokbo_lec_no":58,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"다음 암 중에서 복합경구피임제 장기 복용시 그 발생 위험도가 감소하는 조합으로 맞는 것은?\n가. 자궁내막암\n나. 자궁경부암\n다. 난소암\n라. 유방암","stem_table":null,"options":["가, 나, 다","가. 다","나, 라","라","가, 나, 다, 라"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q96"},{"id":"2025-L59-Q13","year":2025,"qnum":13,"jokbo_lec_no":59,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"35세 여성이 결혼 후 임신이 되지 않아 내원하였다. 월경주기는 40-50일 간격으로 불규칙하였으며 몇 달간 월경이 없던 적이 있었다고 한다. 마지막 월경은 두 달 전이라고 한다. 키는 165cm, 체중은 57kg이다. 신체검진과 부인과 검진에서 이상소견은 없었으며 부인과 초음파 검사는 정상이었다.\n임신을 위한 치료 시 일차적으로 선택해야 할 약제는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| FSH | 5.1 mIU/ml | 5-20 |\n| LH | 10.2 mIU/mL | 5-20 |\n| 에스트라디올 | 52 pg/mL | 20-400 |\n| TSH | 2.7 mIU/L | 0.34-4.25 |\n| 프로락틴 | 10 ng/mL | 1.9-25 |\n| 총테스토스테론 | 120 ng/dL | 20-80 |","options":["항안드로겐 제재 (spironolactone)","방향화효소 억제제 (letrozole)","클로미펜 (clomiphene citrate)","인슐린 저항성 개선제 (metformin)","생식샘자극호르몬제재 (recombinant FSH)"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q13"},{"id":"2025-L59-Q30","year":2025,"qnum":30,"jokbo_lec_no":59,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"23세 여성이 월경이 최근 들어 월경이 불규칙해져서 내원하였다. 초경 이후 원경주기는 35-40일 정도로 길었으며 최근 6개월간 월경이 한 번 있었다고 한다. 신체검진에서 심한 여드름이 관찰되었다. 신장 160cm, 체중은 85kg, 허리둘레 82cm이었으며, 골반초음파검사에서 양쪽 난소는 각각 아래와 같았다.\n난소의 난포 성장 단계에서 황체형성호르몬에 의해 합성되어 위 증상들이 나타나게 하는 호르몬은 무엇인가?","stem_table":null,"options":["에스트로겐","프로게스테론","테스토스테론","인히빈","인슐린"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q30_p34.png","note":null,"id_simple":"2025-Q30"},{"id":"2025-L59-Q55","year":2025,"qnum":55,"jokbo_lec_no":59,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"양극성 장애로 치료 중인 34세 여성이 최근 5개월간 무월경을 주소로 내원하였다. 이전에는 월경주기가 30일~60일로 불규칙했으며, 체질량지수 (Body Mass Index, BMI) 는 22kg/m2이다. 신체검사상 특이소견은 없고, 골반 초음파에서도 자궁, 난소의 해부학적 이상은 관찰되지 않는다. 환자는 현재 기분안정제인 Lithium과 비정형 항정신병제인 Olanzapine을 복용 중이다.\n다음으로 시행해야 할 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| TSH | 1.8 mIU/L | 0.34~4.25 |\n| Prolactin | 386 ng/mL | 1.9~25 |\n| FSH | 4.2 mIU/mL | 3.0~20 |\n| Estradiol | 24 pg/mL | 20~145 |\n| hCG | <0.01 mIU/mL | |","options":["Brain MRI","Abdominal CT","Lithium 혈중 수치 측정","갑상선 초음파","소변 임신 검사 재검"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q55"},{"id":"2025-L60-Q16","year":2025,"qnum":16,"jokbo_lec_no":60,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"폐경 여성에서 선택적 에스트로겐 수용체 조절제인 Raloxifene의 작용은?","stem_table":null,"options":["안면홍조가 대표적인 부작용이다.","유방암 발생 위험을 증가시킨다.","비척추골절의 예방에 효과가 있다.","자궁내막암의 위험이 증가된다.","중단하더라도 골밀도는 장기간 유지된다."],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q16"},{"id":"2025-L60-Q41","year":2025,"qnum":41,"jokbo_lec_no":60,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"다음 중 폐경 이행기 초기 단계에서 일어나는 내분비학적 변화로 적절한 것은?","stem_table":null,"options":["혈중 FSH의 상승","혈중 inhibin A의 증가","혈중 TSH의 저하","혈중 LH의 감소","혈중 Testosterone의 상승"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q41"},{"id":"2025-L60-Q53","year":2025,"qnum":53,"jokbo_lec_no":60,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"50세 여성이 안면홍조, 수면 장애로 내원하였다. 이전 산과력 2-0-0-2 이며, 자궁내막증으로 왼쪽 난소 및 자궁절제술을 시행받은 병력이 있었다. 기타 특이 병력은 없고, 혈액검사 결과는 다음과 같다. 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| TSH | 2.3 mIU/L | 0.34~4.25 |\n| Prolactin | 3.5 ng/mL | 1.9~25 |\n| FSH | 65 mIU/mL | 3.0~20 |\n| Estradiol | 10 pg/mL | 20~145 |","options":["에스트로겐 (Estrogen) 단독 요법","프로게스테론 (Progesterone) 단독 요법","아나스트로졸 (Anastrozole) 단독 요법","브로모크립틴 (Bromocriptine) 치료","에스트로겐-프로게스테론 (Estrogen-Progesterone) 병합요법"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q53","reparsed":true},{"id":"2023-L1-Q30","year":2023,"qnum":30,"jokbo_lec_no":1,"lecture":"대사와 내분비학 개관","professor":"박영주","curr_lec_no":"01","curr_lecture":"대사와 내분비학 개관","stem":"뇌하수체-표적기관 축의 생리적 조절을 받는 뇌하수체 호르몬과 표적기관 호르몬의 쌍으로 옳은 것은?","stem_table":null,"options":["CRH – cortisol","GH – somatostatin","Prolactin – estrogen","LH – testosterone","TRH – TSH"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q30"},{"id":"2023-L1-Q46","year":2023,"qnum":46,"jokbo_lec_no":1,"lecture":"대사와 내분비학 개관","professor":"박영주","curr_lec_no":"01","curr_lecture":"대사와 내분비학 개관","stem":"다음 호르몬 검사 결과를 해석하시오.\nTSH 2.1 mI/L (정상 0.4-4.","stem_table":null,"options":["무증상 갑상선기능저하증","뇌하수체기능저하증","비갑상선질환","갑상선호르몬저항성 증후군","일차성 갑상선기능저하증"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q46"},{"id":"2023-L2-Q25","year":2023,"qnum":25,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 양성되먹임 조절(positive feedback regulation)에 해당하는 것을 고르시오.","stem_table":null,"options":["Glucose에 의한 insulin 분비 조절","자율신경계에 의한 cortisol 분비 조절","혈중 칼슘 농도에 의한 parathyroid hormone (PTH) 분비 조절","Estrogen에 의한 luteinizing hormone (LH) 분비 증가","Cortisol에 의한 corticotropin releasing hormone (CRH) 분비 조절"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q25"},{"id":"2023-L2-Q37","year":2023,"qnum":37,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 erythropoietin (EPO) 수용체의 세포내 신호전달에 관련된 신호경로로 적절한 것을 고르시오.","stem_table":null,"options":["Adenylyl cyclase - cAMP","Ras - Raf - MEK - MAPK","JAK - STAT","SMAD2/3","PI3K - Akt"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q37"},{"id":"2023-L2-Q41","year":2023,"qnum":41,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 스테로이드 호르몬 수용체에 대한 설명으로 적절한 것을 고르시오.","stem_table":null,"options":["Estrogen 수용체는 heterodimer로 작용한다.","Androgen 수용체는 핵에서 androgen과 결합한다.","스테로이드 호르몬의 호르몬 결합부위는 주로 DNA-binding domain이다.","비타민 D 수용체는 retinoid A 수용체와 dimer를 이룬다.","Thyroid 수용체는 호르몬이 없는 경우 억제단백질과 결합하고 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q41"},{"id":"2023-L2-Q48","year":2023,"qnum":48,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 호르몬의 작용과 관련하여 올바르게 기술된 것을 고르시오.","stem_table":null,"options":["Vasopressin은 세포의 성장을 조절하는 호르몬이다.","Cortisol은 새로운 유전자의 발현을 통해 작용한다.","Mineralocorticoid는 세포막 수용체를 통해 혈장의 Na+ 농도를 조절한다.","Insulin은 혈액 내 glucose 농도가 낮을 때 작용한다.","태아발생기에는 성호르몬의 작용이 거의 나타나지 않는다."],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q48"},{"id":"2023-L2-Q50","year":2023,"qnum":50,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 호르몬 가운데 아미노산 유도체에 해당하는 것을 고르시오.","stem_table":null,"options":["Thyroid hormone","Gonadotropin-releasing hormone (GnRH)","Luteinizing hormone (LH)","Parathyroid hormone (PTH)","Retinoids"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q50"},{"id":"2023-L2-Q63","year":2023,"qnum":63,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"호르몬의 운반 및 제거와 관련하여 올바르게 기술된 것을 고르시오.","stem_table":null,"options":["호르몬 결합 단백질에 결합되어 있는 호르몬이 활성을 나타내는 호르몬이다.","호르몬 결합 단백질은 주로 적혈구에서 생성된다.","호르몬 결합 단백질에 결합한 호르몬의 반감기는 free form에 비하여 짧다.","단백질이나 펩타이드 형태의 호르몬의 반감기는 주로 수 분(minute) 내외이다.","호르몬 결합 단백질의 합성이 감소하면 활성을 나타내는 호르몬이 감소한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q63"},{"id":"2023-L3-Q5","year":2023,"qnum":5,"jokbo_lec_no":3,"lecture":"내분비대사질환의 요인, 진단","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"검진에서 다음과 같은 이상으로 내원하였다.\nTSH 2.1 mIU/L (정상 0.4-4.","stem_table":null,"options":["혈중 free T3","TRH 자극 검사","혈중 total T4","뇌하수체 MRI","혈중 결합단백"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q5"},{"id":"2023-L3-Q70","year":2023,"qnum":70,"jokbo_lec_no":3,"lecture":"내분비대사질환의 요인, 진단","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"내분비질환으로 새로 진단받은 다음의 환자 중, 유전성 질환을 감별하기 위하여 알려진 특정 표적 유전자 검사가 필요한 경우는?\n(연령 – 성별 – 진단명 – 동일 질환력이 있는 가족 순 , 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"60세 여자 환자에서 시행한 다음 호르몬 검사 결과에서 결핍된 뇌하수체 호르몬은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 T4 | 1.01 ng/dL | 0.8~1.7 |\n| 갑상선자극호르몬 | 3.2 mIU/L | 0.34~4.25 |\n| 코티졸 | 13.21 μg/dL | 5~25 |\n| 부신피질자극호르몬 | 22.9 pg/mL | 6~76 |\n| 프로락틴 | 12 ng/mL | 2.5~17.0 |\n| 여포자극호르몬 | 3 mIU/mL | 1~9 |\n| 황체형성호르몬 | 10 mIU/mL | 2~12 |\n| 에스트로겐 | 30 pg/mL | 30~120 |\n| 인슐린유사성장인자-1 | 120 ng/mL | 94~269 |","options":["프로락틴","성장호르몬","성선자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q68"},{"id":"2023-L4-Q80","year":2023,"qnum":80,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체 호르몬 중에서 말초기관에서 표적호르몬을 만들지 않고 직접 표적기관에 작용하는 호르몬은?","stem_table":null,"options":["유즙분비호르몬","황체형성호르몬","여포자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q80"},{"id":"2023-L4-Q90","year":2023,"qnum":90,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"29세 여자가 3개월 전부터 시작된 심한 갈증으로 내원하였다. 소변을 자주 보고 밤에도 1-2시간 간격으로 소변을 봤다. 혈압은 112/72 mmHg였고 체중은 52kg였다.\n이에 시행한 수분제한검사 결과는 다음과 같았다.\n이 환자에서 가장 가능성이 높은 진단은?","stem_table":"| 혈액 검사 | |\n|-----------|--|\n| 공복포도당 | 84 mg/dL |\n| 크레아티닌 | 0.8 mg/dL |\n| Na+/K+/Cl- | 145/4.0/102 meq/L |","options":["일차다음증","정상반응","중추성 요붕증","신성 요붕증","SIADH"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q90_p45_graph.png","note":null,"id_simple":"2023-Q90"},{"id":"2023-L5-Q33","year":2023,"qnum":33,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"김정희","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"산후 출혈에 의해 나타나는 뇌하수체기능저하증으로 출산 후 수유가 불가능하거나 무월경으로 발현하는 경우도 있으나, 수년에 걸쳐서 서서히 뇌하수체 호르몬 결핍이 나타나기도 하는 질환은?","stem_table":null,"options":["뇌수종","Kallmann 증후군","Sheehan 증후군","정중파열증후군","시상하부성 성선기능저하증"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q33"},{"id":"2023-L5-Q60","year":2023,"qnum":60,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"김정희","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"시상하부-뇌하수체 표적호르몬 분비를 평가하는 dynamic test이다. 일차 기관의 반응을 평가하는 검사는?","stem_table":null,"options":["insulin-induced hypoglycemia test","GnRH stimulation test","Rapid ACTH stimulation test","TRH stimulation test","Glucose tolerance test"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q60"},{"id":"2023-L6-Q27","year":2023,"qnum":27,"jokbo_lec_no":6,"lecture":"소아뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"8세 남아가 키가 자라지 않아서 병원에 왔다. 임신 나이 38주, 2.9kg으로 출생하였고 과거력상 특이소견 없었다. 두통, 구토는 없었고, 밤에 자다 깨서 소변을 본다고 한다. 현재 키는 121cm, 체중 28kg이다 (성장곡선 참조). 진찰상 양측 고환은 2cc, 음모는 성성숙도 1단계이고 뼈나이 6세이다. 아빠키 175cm, 엄마키 160cm, 엄마초경 나이는 고1이다.\n가장 적절한 설명은?","stem_table":null,"options":["우선적으로 뇌 MRI를 시행한다.","야간뇨가 있으므로 수분제한검사를 시행한다.","엄마 초경 연령으로 보아 체질성 성장지연 가능성이 높다.","시상하부-뇌하수체-부신 축을 확인하기 위한 ACTH 자극검사를 시행한다.","성장기 성장호르몬 결핍증은 인슐린유발저혈당 검사 1가지로 진단 가능하다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q27"},{"id":"2023-L6-Q34","year":2023,"qnum":34,"jokbo_lec_no":6,"lecture":"소아뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"26개월 남아가 쳐져서 병원에 왔다. 임신나이 39주, 2.1kg으로 출생하였고 신생아 황달로 광선치료를 받았다. 좌측 잠복고환으로 수술 받은 과거력이 있다. 모유 수유하였고 아이가 잘 먹지 않아서 이유식 진행이 잘 되지 않았다고 한다. 내원 2일 전 발열로 인후염이 있다고 들었고 내원 1일 전 보채면서 잘 먹지 못하였다. 마지막 소변 기저귀는 8시간 전에 갈았다고 한다. 키는 78cm (<3백분위수), 체중 11kg (<3백분위수)이다. 교환은 1cc 크기로 양측에 만져졌고, 음모와 음경은 성성숙도 1단계, 뼈나이는 18개월이다.\n가장 적절한 설명은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| Glucose | 47 mg/dL |\n| 소변 케톤 | 양성 |\n| Na | 129 mmol/L |\n| K | 3.6 mmol/L |\n| Creatinine | 0.8 mg/dL |\n| Cortisol | 7.5 ng/dL |\n| ACTH | 5 pg/mL (참고치 <70) |\n| 유리 T4 | 0.9 pg/dL (참고치 0.8-20) |\n| 갑상샘 자극호르몬 | 2.4 uIU/L (참고치 0.5-6.5) |","options":["저신장의 원인은 부당경량아 출생아로 따라잡기 성장을 못해서이다.","뇌하수체 종양 가능성이 높으므로 뇌 MRI를 시행한다.","잠복고환 수술을 하였으므로 이차성징 발현은 정상적일 것이다.","일차성 부신저하증인지 확인하기 위한 ACTH 자극검사를 시행한다.","성장호르몬 자극검사를 시행한다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q34"},{"id":"2023-L6-Q71","year":2023,"qnum":71,"jokbo_lec_no":6,"lecture":"소아뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"5세 남아가 키가 작아서 병원에 왔다. 임신 나이 40주, 3.3kg으로 출생하였다. 신생아기 황달로 광선치료 받았고, 갑상샘저하증으로 진단되어 갑상샘호르몬을 보충하고 있다. 내원 2년 전 (3세) 장염으로 잘 먹지 못하고 경련으로 응급실에 갔는데 저혈당이라고 들었다. 현재 키는 98cm, 체중 15kg이다 (성장곡선). 아빠키 175cm, 엄마키 155cm, 엄마초경 나이는 중3이다.\n가장 가능성이 높은 진단은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| Glucose | 85 mg/dL |\n| Na | 139 mmol/L |\n| K | 4.0 mmol/L |\n| Creatinine | 0.8 mg/dL |\n| 유리 T4 | 0.9 mg/dL (참고치 0.8~2.0) |\n| 갑상샘 자극호르몬 | 0.9 uIU/L (참고치 0.5-6.5) |\n| Clonidine 자극검사 | peak GH 3.9 ng/mL |\n| L-dopa 자극검사 | peak GH 27 ng/mL |","options":["추적 관찰한다.","카베르골린을 투약한다.","감마나이프를 시행한다.","경구피임제를 투약한다.","접형동경유 샘종절제술(Transsphenoidal surgery)을 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q71"},{"id":"2023-L7-Q6","year":2023,"qnum":6,"jokbo_lec_no":7,"lecture":"뇌하수체 전엽질환","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"42세 여자가 3개월 전부터 발생한 시력 저하 소견으로 내원하였다. 시력 검사상 좌측 0.6, 우측 1.0으로 감소되어 있었고, 시야 검사상 좌안 시야 장애 소견이 보였다. 이에 시행한 뇌하수체 자기공명영상과 호르몬 검사 결과는 하기와 같았다. 이 환자에서 다음으로 시행할 가장 적절한 처치는?","stem_table":null,"options":["경과 관찰","하추체정맥채혈","경구당부하검사","하룻밤 덱사메타손억제검사","급속 부신피질자극호르몬 자극 검사"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q6_p50_MRI.png","note":null,"id_simple":"2023-Q6"},{"id":"2023-L7-Q23","year":2023,"qnum":23,"jokbo_lec_no":7,"lecture":"뇌하수체 전엽질환","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"35세 남자가 두통으로 시행한 자기공명영상에서 발견된 뇌하수체 종괴로 내원하였다. 시야장애는 호소하지 않았으나 최근 반지와 신발이 잘 맞지 않았고 땀이 많이 난다고 하였다. 아침 8시 공복시에 시행한 호르몬 검사 결과는 다음과 같았다. 상기 환자에서 다음으로 시행할 검사로 가장 적절한 것은?","stem_table":null,"options":["경과 관찰","하추체정맥채혈","경구당부하검사","하룻밤 덱사메타손억제검사","급속 부신피질자극호르몬 자극 검사"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q23_p46_MRI.png","note":null,"id_simple":"2023-Q23"},{"id":"2023-L7-Q76","year":2023,"qnum":76,"jokbo_lec_no":7,"lecture":"뇌하수체 전엽질환","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"50세 남자가 1개월 전부터 시야가 좁아져서 내원하였다. 혈압 128/88 mmHg, 맥박 96회/분, 호흡 20회/분, 체온 36.9도였다. 시야검사에서 양귀쪽반맹(bitemporal hemianopsia)이 관찰되었다. 이에 시행한 혈액 검사 결과와 뇌하수체 자기공명 영상촬영 결과는 다음과 같았다. 다음 검사 결과에 근거한 일차 치료는?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|-----------|------|--------|\n| 혈액요소질소 | 17 mg/dL | |\n| 크레아티닌 | 10 mg/dL | |\n| 포도당 | 85 mg/dL | |\n| Na+/K+/Cl- | 136/4.5/98 meq/L | |\n| 유리 T4 | 0.81 mg/dL | 0.8-1.7 |\n| 갑상선자극호르몬 | 2.9 mIU/L | 0.34~4.25 |\n| 코르티졸 | 6.2 ug/dL | 5~25 |\n| 부신피질자극호르몬 | 7.9 pg/mL | 6~76 |\n| 프로락틴 | 764 ng/mL | 2.5~17.0 |\n| 여포자극호르몬 | 0.8 mIU/mL | 1-9 |\n| 황체형성호르몬 | 0.5 mIU/mL | 2~12 |\n| 테스토스테론 | 150 mg/dL | 270-1070 |\n| 인슐린유사성장인자-1 | 120 ng/mL | 94~284 |","options":["남성호르몬","카베르골린","방사선치료","소마토스타틴유사제","접형동경유샘종절제술(Transsphenoidal surgery)"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q76"},{"id":"2023-L8-Q11","year":2023,"qnum":11,"jokbo_lec_no":8,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"32세 여자가 2주 전부터 시작된 심한 전신 위약감을 주소로 응급실에 왔다. 4주 전 폐결핵을 진단받고 결핵약 복용을 시작했다. 방문 시 혈압 82/46 mmHg, 맥박 110/min, 체온 37.4°C였다. 혈액 검사상 혈액요소질소 28.0 mg/dL, 크레아티닌 0.7 mg/dL, 혈청 나트륨 122 mEq/L, 칼륨 5.0 mEq/L, Cl 98 mEq/L, 혈중 glucose 82 mg/dL였다. 2년 전 부신 양측절제술 후 지속적으로 prednisolone 5mg/day, fludrocortisone 0.1 mg/day 복용 중인 것 외에 특별한 과거력은 없었다.\n이 환자에게 필요한 처치를 1개 고르시오.","stem_table":null,"options":["3% saline 정주","고용량 hydrocortisone 정맥 주사","급속 ACTH 자극검사","Cosyntropin 투약","Insulin tolerance test"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q11"},{"id":"2023-L8-Q26","year":2023,"qnum":26,"jokbo_lec_no":8,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"다음은 부신의 단면 모식도이다. A-D중 aldosterone synthase (CYP11B","stem_table":null,"options":["A","B","C","D","A & B"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q26_p47.png","note":null,"id_simple":"2023-Q26"},{"id":"2023-L8-Q29","year":2023,"qnum":29,"jokbo_lec_no":8,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"다음은 부신기능저하증을 유발할 수 있는 원인 질환이다. Mineralocorticoid의 보충이 필요한 경우를 한 개 고르시오.","stem_table":null,"options":["Addison's disease","Autoimmune hypophysitis","Craniopharyngioma","Iatrogenic adrenal insufficiency","Pituitary apoplexy"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q29"},{"id":"2023-L9-Q20","year":2023,"qnum":20,"jokbo_lec_no":9,"lecture":"부신 피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 쿠싱증후군의 선별검사 및 확진에 사용되는 검사는?","stem_table":null,"options":["Plasma ACTH","Random plasma cortisol","Rapid ACTH stimulation test","Low-dose dexamethasone suppression test","High-dose dexamethasone suppression test"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q20"},{"id":"2023-L9-Q40","year":2023,"qnum":40,"jokbo_lec_no":9,"lecture":"부신 피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 쿠싱증후군에 비교적 특이적인 임상증상에 해당하는 것은?","stem_table":null,"options":["Obesity","Moon Face","Easy Bruising","Hyperglycemia","Hypercholesterolemia"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q40"},{"id":"2023-L9-Q45","year":2023,"qnum":45,"jokbo_lec_no":9,"lecture":"부신 피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"43세 여자가 체중 증가로 병원에 왔다. 1년 전부터 복부 비만, 월경 감소, 얼굴이 커지는 증상이 있었으며 피부는 쉽게 멍이 들었다고 한다. 검사 결과는 다음과 같다. 치료는?","stem_table":"| 검사 | 결과 |\n|------|------|\n| 1mg overnight dexamethasone suppression test: cortisol | 12.8 μg/dL |\n| 24HU free cortisol | 708 μg (정상 80-120 μg/day) |\n| Midnight plasma cortisol | 8 μg/dL |\n| Plasma ACTH | 4 pg/ml |","options":["Ketoconazole","Gamma knife radiation","Bilateral adrenalectomy","Transsphenoidal resection","Laparoscopic adrenalectomy"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q44_p52.png","note":null,"id_simple":"2023-Q45"},{"id":"2023-L10-Q15","year":2023,"qnum":15,"jokbo_lec_no":10,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"다음 중 일차성 알도스테론증 진단검사에 대한 기술로 맞는 것은?","stem_table":null,"options":["저칼륨혈증을 교정한 후 선별검사를 시행해야 한다.","선별검사 결과 해석 시 aldosterone 농도는 고려할 필요가 없다.","선별검사 시 spironolactone은 2주간 중단한 후 선별검사를 시행한다.","가장 흔하게 사용되는 확진검사는 경구나트륨부하검사이다.","확진검사는 체액량 감소에 대한 알도스테론 반응을 확인한다."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q15"},{"id":"2023-L10-Q85","year":2023,"qnum":85,"jokbo_lec_no":10,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"고혈압으로 치료 중인 55세 남자가 복부 CT에서 우연히 아래와 같은 종괴가 관찰되어 검사를 시행하였다. 일차성 알도스테론증이 의심되었고, 환자가 수술을 원하여 부신정맥채혈을 시행하였다. 부신정맥채혈 결과가 아래와 같았을 때 다음 조치는?","stem_table":"| | Left | Right | IVC |\n|-|------|-------|-----|\n| Plasma aldosterone (ng/dL) | 384 | 218 | 92 |\n| Plasma cortisol (ug/dL) | 120 | 72 | 35 |","options":["우측 부신절제술","좌측 부신절제술","소듐 채널 차단제","부신정맥채혈 재시행","미네랄로코르티코이드 수용체 길항제"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q85_p48_CT1.png","note":null,"id_simple":"2023-Q85"},{"id":"2023-L11-Q10","year":2023,"qnum":10,"jokbo_lec_no":11,"lecture":"다발성 내분비 질환","professor":"문재훈","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다음 중 각 다발성 내분비 종양에서 발생할 수 있는 종양에 대해서 이를 선별하는 검사가 알맞게 짝지어진 것은?","stem_table":null,"options":["Insulinoma – glucose, gastrin","Parathyroid adenoma – free T4, TSH","Medullary thyroid carcinoma – PTH, neck SONO","Pituitary adenoma – LH, FSH, estradiol or testosterone","Pheochromocytoma – plasma or 24hour urine metanephrine"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q10"},{"id":"2023-L11-Q22","year":2023,"qnum":22,"jokbo_lec_no":11,"lecture":"다발성 내분비 질환","professor":"문재훈","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다발성 내분비 종양 type 2 (multiple endocrine neoplasia type","stem_table":null,"options":["MENIN","MYC","RET","EGFR","RB1"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q22"},{"id":"2023-L11-Q59","year":2023,"qnum":59,"jokbo_lec_no":11,"lecture":"다발성 내분비 질환","professor":"문재훈","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다음 중 다발성 내분비 종양 type 1 (multiple endocrine neoplasia type","stem_table":null,"options":["부갑상선종양에 의한 부갑상선기능항진증과 췌장의 인슐린 분비종양이 동시에 진단된 26세 남자 환자","갑상선수질암이 진단된 37세 여성의 자녀 중 14세 여아","갑상선유두암으로 수술 후 갑상선수질암이 병리조직에서 같이 발견된 48세 여자 환자","양측성 크롬진화세포종 (bilateral pheochromocytoma)가 진단된 24세 여자 환자","부갑상선종양이 있으나 혈중 부갑상선호르몬 농도 및 칼슘 농도가 정상인 42세 여자 환자"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q59"},{"id":"2023-L12-Q28","year":2023,"qnum":28,"jokbo_lec_no":12,"lecture":"소아부신질환","professor":"이영아","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"생후 16일 남아가 구토와 쳐짐으로 병원에 왔다. 임신나이 38주, 2.7kg으로 출생하였다. 분유 수유 중 자주 게워내는 모습을 보였는데 내원 1일 전 저녁부터 구토로 잘 먹지 못하였다. 마지막 소변 기저귀는 8시간 전에 갈았고, 내원 당시 체중은 2.5kg이다. 구강점막은 말라 있었고, 유두와 음낭에 착색이 확인되었다. 음경길이는 3.5cm이고 양쪽 고환은 만져지지 않았다 (사진).\n검사결과이다. 가장 적절한 조치는?","stem_table":null,"options":["10% 포도당이 들어있는 생리식염수를 천천히 주입한다.","즉시 신속하게 하이드로코티손, 플루드로코티손을 경구로 투여한다.","선천성 부신 저형성증에 대한 유전자 검사를 시행한다.","염색체 검사와 복부 초음파 검사를 시행한다.","저혈당이 있으므로 인슐린 주사는 투여하지 않는다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q28_p49.png","note":null,"id_simple":"2023-Q28"},{"id":"2023-L12-Q81","year":2023,"qnum":81,"jokbo_lec_no":12,"lecture":"소아부신질환","professor":"이영아","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"10일 된 남아가 신생아선별검사 17-OH progesterone (17-OHP) 수치가 높아서 왔다.\n다음 중 옳은 설명은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| Glucose | 90 mg/dL |\n| Na | 136 mmol/L |\n| K | 5.4 mmol/L |\n| Creatinine | 0.6 mg/dL |\n| ACTH | 250 pg/mL (참고치 <70) |\n| 17-OH-progesterone | 90 ng/mL |","options":["혈당, 전해질이 정상범위이므로 17OHP 재검하여 1주 후 결과를 확인한다.","하이드로코티손, 플루드로코티손, NaCl 약제를 지속적으로 보충한다.","안드로겐 부족으로 인해 생식샘 저하증과 불임 위험이 높다.","성장속도, 뼈나이, 호르몬 검사를 추적하면서 부신호르몬 용량을 조절한다.","감염으로 발열이 있으면 하이드로코티손을 평소의 2배의 용량으로 보충한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q81"},{"id":"2023-L13-Q17","year":2023,"qnum":17,"jokbo_lec_no":13,"lecture":"뇌하수체, 부신, 다발성내분비종양의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"다음 중 갈색세포종/부신경절종과 연관된 유전자가 아닌 것은?","stem_table":null,"options":["AIRE","NF1","RET","SDH","VHL"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q17"},{"id":"2023-L13-Q55","year":2023,"qnum":55,"jokbo_lec_no":13,"lecture":"뇌하수체, 부신, 다발성내분비종양의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"23세 남자 환자가 두통 및 시야 결손을 호소하여 시행한 brain MRI에서 왼쪽 아래와 같은 소견을 보였으며 이를 수술한 검체의 병리 소견이 오른쪽 아래와 같았다. 이 병변에 대한 설명 중 옳은 것은?","stem_table":null,"options":["비기능성 종양은 주로 mass effect를 일으키므로 발견이 기능성에 비해 빠르다.","T-PIT 면역 염색에 양성인 경우 ACTH 분비 종양을 의심해야 한다.","이 종양은 posterior pituitary gland에서 기원한다.","PIT-1, SF-1, T-PIT에 모두 음성인 경우는 존재하지 않는다.","조직학적 소견 상 reticulin network이 유지되는 것이 특징적이다."],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q55"},{"id":"2023-L13-Q58","year":2023,"qnum":58,"jokbo_lec_no":13,"lecture":"뇌하수체, 부신, 다발성내분비종양의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"43세 여자가 두통, 사지 허약감 및 고혈압을 주소로 내원하였다. 신체검사상 moon face 및 central obesity가 관찰되었고 혈액 검사상 혈장 glucose 270mg/dL (정상 70-110mg/dL), 혈장 및 소변 cortisol이 증가되어 있는 것이 발견되었다. Aldosterone level은 정상이었다. 이 환자가 가지고 있을 병리학적 소견으로 가장 가능성이 높은 것은?","stem_table":null,"options":["뇌하수체의 비기능성 (non-functioning) 선종","터키안 상방 (suprasellar area)의 두개인두종 (craniopharyngioma)","부신수질의 종양성 병변","부신피질 (adrenal cortex)의 zona glomerulosa 부분의 세포 증식","부신피질 (adrenal cortex)의 zona fasciculata 부분의 세포 증식"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q58"},{"id":"2023-L13-Q69","year":2023,"qnum":69,"jokbo_lec_no":13,"lecture":"뇌하수체, 부신, 다발성내분비종양의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"25세 남자 환자가 발작적인 심계항진과 두통, 발한을 주소로 방문하였다. 환자는 고혈압이 있었으며 변동이 심하였다. 복부 전산화 단층 촬영 소견상 양쪽 부신에 각각 지름 3, 4cm의 종괴가 발견되었다. 아래는 수술로 떼어낸 한쪽 부신 병변의 육안 소견 및 현미경 소견이다. 이 병변에 대한 보기 중 가장 적합한 내용은?","stem_table":null,"options":["24시간 소변에서 cortisol 검출이 특징적이다.","종양의 크기 및 현미경적 소견상 악성의 가능성은 없다.","뇌하수체 선종의 호르몬 분비에 의한 자극이 주요 원인 중 하나이다.","Enterochromaffin 세포들이 acetylcholine을 주로 분비하게 된다.","갑상선 등 다른 기관에 종양이 있는지 검사해야 한다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q69_p49.png","note":null,"id_simple":"2023-Q69"},{"id":"2023-L14-Q51","year":2023,"qnum":51,"jokbo_lec_no":14,"lecture":"뇌하수체, 부신의 영상","professor":"최승홍/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"31세 여성이 유즙과다를 주소로 내원하였다. 혈중 prolactin level이 190 mg/ml (정상: 0-25 ng/ml)였다. 환자는 MRI를 시행하였고, 조영 증강 후 T1 강조영상은 다음과 같았다. 이 병변에서 예상되는 가장 흔한 dynamic contrast MRI 소견은?","stem_table":null,"options":["No enhancement","slight enhancement","strong enhancement","Early enhancement","Delayed enhancement"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q51"},{"id":"2023-L14-Q72","year":2023,"qnum":72,"jokbo_lec_no":14,"lecture":"뇌하수체, 부신의 영상","professor":"최승홍/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"다음은 정상인의 T1 강조영상이다. 화살표가 가리키는 구조물과 관련이 있는 호르몬은?","stem_table":null,"options":["ADH","LH","ACTH","Prolactin","Growth hormone"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q72_p50.png","note":null,"id_simple":"2023-Q72"},{"id":"2023-L14-Q86","year":2023,"qnum":86,"jokbo_lec_no":14,"lecture":"뇌하수체, 부신의 영상","professor":"최승홍/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"CT와 MRI이다. 좌측 부신의 병변에 대해 가장 가능성이 높은 진단은?","stem_table":null,"options":["adrenal abscess","adrenal adenoma","adrenal metastasis","adrenal cortical carcinoma","adrenal pheochromocytoma"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q86_p50.png","note":null,"id_simple":"2023-Q86"},{"id":"2023-L15-Q16","year":2023,"qnum":16,"jokbo_lec_no":15,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"췌장 신경내분비종양으로 췌장미부 절제술을 받고 2년 뒤 지속되는 설사로 인해 시행한 Ga-68 DOTATOC PET/CT 영상이다. 다음으로 시행할 것은?","stem_table":null,"options":["도뇨관 삽입","경피적 신루설치술","I-131 MIBG 치료","Lu-177 DOTATATE 치료","외부 방사선 치료"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q16_p50.png","note":null,"id_simple":"2023-Q16"},{"id":"2023-L15-Q24","year":2023,"qnum":24,"jokbo_lec_no":15,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양 핵의학 치료로 사용하는 분자 표적은?","stem_table":null,"options":["glucose transporter 1","somatostatin receptor","dopamine transporter","sodium iodine symporter","prostate specific membrane antigen"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q24"},{"id":"2023-L15-Q31","year":2023,"qnum":31,"jokbo_lec_no":15,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양의 핵의학 진단에 사용하는 핵의학 검사는?","stem_table":null,"options":["I-123 스캔","I-131 스캔","Tc-99m 스캔","I-123 MIBG 스캔","Lu-177 DOTATATE PET/CT"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q31"},{"id":"2023-L15-Q65","year":2023,"qnum":65,"jokbo_lec_no":15,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"12세 남아가 최근 키가 체중에 비해 증가하지 않아 병원에 왔다. 임신 나이 40주, 출생 체중 5,000g으로 출생하였다. 혈압 142/91 mmHg, 맥박 83회/분, 호흡 21회/분, 체온 36.9°C이다. 키 152cm (50백분위수), 체중 58kg (90백분위수), 체질량지수 (95백분위수)이다. 얼굴은 통통하며, 복부는 뚱뚱하며, 줄 모양으로 튼 피부들이 복부 여러 곳에서 보였으며, 복부 둘레에 비해 팔다리가 가늘다. 고환은 3 mL, 음모는 없다. 간과 지라는 만져지지 않는다. 성장곡선이다. 검사결과는 다음과 같다.\n조치는?","stem_table":"| 혈액 | 결과 |\n|------|------|\n| 공복포도당 | 99 mg/dL |\n| 칼슘 | 9.2 mg/dL |\n| 인 | 46 mg/dL |\n| AST | 18 U/L |\n| ALT | 52 U/L |\n| 당화혈색소 | 5.8% |\n| 유리 T4 | 1.02 mg/dL (참고치 0.8~1.7) |\n| 뼈나이 | 11세 |","options":["검사없이 조치","혈장 레닌활성 알도스테론","인슐린 투여 후 성장호르몬 농도 측정","24시간 소변 유리 코티솔","24시간 소변 유리 메타네프린"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q65"},{"id":"2023-L16-Q7","year":2023,"qnum":7,"jokbo_lec_no":16,"lecture":"성장장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키와 체중이 작아 병원에 왔다. 임신 나이 36주에 출생체중 2,000g (임신나이 기준 3백분위수 미만)로 출생하였다. 출생 후 황달은 없었으며, 이제까지 두부손상, 저혈당, 경련, 만성 설사는 없었다. 1세 때 체중 7kg이었다. 발달은 정상이고, 아이는 키 작은 것에 대해 예민하게 반응한다. 아버지 키는 174cm, 어머니는 키가 161cm로 초경을 중1 때 하였다. 뼈나이는 6세이다. 성장곡선이다.\n가장 가능성이 높은 진단은?","stem_table":null,"options":["부당경량아","가족성저신장","체질성장 지연","갑상샘저하증","성장호르몬결핍증"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q7_p52.png","note":null,"id_simple":"2023-Q7"},{"id":"2023-L16-Q38","year":2023,"qnum":38,"jokbo_lec_no":16,"lecture":"성장장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"12세 남아가 최근 키가 체중에 비해 증가하지 않아 병원에 왔다. 임신 나이 40주, 출생 체중 5,000g으로 출생하였다. 혈압 142/91 mmHg, 맥박 83회/분, 호흡 21회/분, 체온 36.9°C이다. 키 152cm (50백분위수), 체중 58kg (90백분위수), 체질량지수 (95백분위수)이다.","stem_table":null,"options":["선천성 부신과형성증 21-수산화효소결핍증 염분소실형이다.","중추성 성조숙증 가능성이 있으므로 GnRH 자극검사를 시행한다.","부신 호르몬을 보충하면 고환 크기가 사춘기 이전으로 줄어든다.","뇌 MRI 검사가 필요하다.","말초성 성조숙증이다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q38_p51.png","note":null,"id_simple":"2023-Q38"},{"id":"2023-L16-Q44","year":2023,"qnum":44,"jokbo_lec_no":16,"lecture":"성장장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"8세 남아가 키와 체중이 작아 병원에 왔다. 임신 나이 38주에 출생체중 3,300g (임신나이 기준 10백분위수 이상)로 출생하였다. 출생 후 황달은 없었으며, 이제까지 두부손상, 저혈당, 경련, 만성 설사는 없었다. 1세 때 체중 10kg이었다. 발달은 정상이고, 아이는 키 작은 것에 대해 예민하게 반응한다. 아버지 키는 170cm로 고등학교 때 많이 컸으며, 어머니는 키가 160cm로 초경을 중1 때 하였다. 뼈나이는 6세이다.\n가장 가능성이 높은 진단은?","stem_table":null,"options":["부당경량아","가족성저신장","체질성장지연","갑상샘저하증","성장호르몬결핍증"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q44_p52.png","note":null,"id_simple":"2023-Q44"},{"id":"2023-L17-Q1","year":2023,"qnum":1,"jokbo_lec_no":17,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"7세 남아가 음모가 나서 병원에 왔다. 임신 나이 37주, 2.3kg으로 출생하였고, 내원 당시 아이의 키는 130cm, 체중은 3xkg이다. (과거 기록은 성장곡선 참조). 진찰상 양측 고환 5cc, 음모와 음경 성성숙도 3단계이고 뼈나이는 9세이다. 아빠 키 170cm, 엄마키 160cm이고, 엄마초경나이는 초등 5학년이다. 과거력상 다른 병력이나 수술력은 없었다.\n옳은 설명은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| Glucose | 80 mg/dL |\n| Na | 140 mmol/L |\n| K | 5.3 mmol/L |\n| Creatinine | 0.8 mg/dL |\n| 17-OH-progesterone | 120 ng/mL |","options":["고환초음파","성장호르몬 농도","테스토스테론 농도","황체화호르몬 농도","생식샘자극호르몬방출호르몬자극검사"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q1"},{"id":"2023-L17-Q9","year":2023,"qnum":9,"jokbo_lec_no":17,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"7세 남아가 여드름과 수염이 3개월 전부터 생겨 병원에 왔다. 임신 나이 40주, 출생 체중 3,300g으로 출생하였다. 고환은 좌우 각각 5mL, 음모는 성성숙도 II기이다. 뼈나이는 9세다. 성장곡선이다.\n검사는?","stem_table":null,"options":["고환초음파","성장호르몬 농도","테스토스테론 농도","황체화호르몬 농도","생식샘자극호르몬방출호르몬자극검사"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q9_p51.png","note":null,"id_simple":"2023-Q9"},{"id":"2023-L17-Q88","year":2023,"qnum":88,"jokbo_lec_no":17,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"7세 여아가 우측 흉부에서 1개월 전부터 덩어리가 만져져 병원에 왔다. 덩어리는 직경 3cm 원형으로, 만지면 아파한다. 유두는 덩어리 정중앙에 위치해 있다. 좌측에서는 덩어리가 만져지지 않는다. 주위 피부의 변색은 없었다. 키는 현재 70백분위로서 1년 전에는 50백분위였다. 음모는 없었다.\n진단은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| 생식샘자극호르몬방출호르몬 투여 후 황체화호르몬 최고농도 | 8 mIU/mL |\n| 뼈나이 | 7세 |","options":["생리적 유방","가성성조숙증","진성성조숙증","맥큔-알브라이트 증후군","21-수산화효소결핍에 의한 선천부신과형성증"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q88"},{"id":"2023-L18-Q4","year":2023,"qnum":4,"jokbo_lec_no":18,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"정상적인 성분화 과정은 유전적인 성결정 및 성선의 성결정 과정으로 구분할 수 있다. 또한 이러한 성결정 기준에는 형태학적 기준과 정신적 기준이 포함된다. 다음은 정상적인 성결정 과정에 대한 설명이다. 맞는 것은?","stem_table":null,"options":["고환형성은 X염색체내 SRY의 존재에 의해 결정된다.","여성의 성선으로 발달하려면 에스트로젠의 역할이 중요하다.","성발달 과정의 첫 번째 단계는 성선(gonadal sex)의 결정이다.","성결정은 외생식기의 모양에 따라 확정한다.","성결정 과정에서 환자의 성정체성 및 성역할에 대한 확인이 필요하다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q4"},{"id":"2023-L18-Q18","year":2023,"qnum":18,"jokbo_lec_no":18,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환이 의심되는 모호한 외성기를 가지고 있는 환자에서는 무엇보다 정확한 진단이 중요하다. 다음 내용 중 틀린 것은?","stem_table":null,"options":["음낭 및 음순부위에서 성선유무를 확인하는 것이 중요하다.","X염색체 및 SRY의 유무를 확인하는 염색체 검사를 조기에 시행해야 한다.","초음파 또는 MRI 등을 시행하여 여성 내부생식기 유무를 확인해야 한다.","감별진단을 위해서 생식기관조영술 (genitography)을 시행하는 것이 중요하다.","혈장에서 17-OH progesterone을 측정하여 CAH 여부를 확인한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q18"},{"id":"2023-L18-Q56","year":2023,"qnum":56,"jokbo_lec_no":18,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환에서는 생식선에서의 종양발생 위험이 높아 필요시 생식선의 예방적 적출술을 시행해야 한다. 다음 중 생식선의 예방적 적출술이 반드시 필요한 질환은?","stem_table":null,"options":["46XX testicular DSD (XX male)에서의 양측 고환","46XY complete gonadal dysgenesis에서 양측 흔적 성선","46XY ovotesticular DSD에서 남성으로 성결정한 음낭 내 고환","45XO/46XX Turner syndrome에서 양측 흔적성선","46XY 5 alpha-reductase deficiency에서 음낭내 고환"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q56"},{"id":"2023-L19-Q12","year":2023,"qnum":12,"jokbo_lec_no":19,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"16세 남자가 양쪽 유방이 커서 병원에 왔다. 양측 유방은 만지면 아파하였으며, 피부에 변색은 없었다. 키 178cm, 체중 68kg로, 키에 비해 팔다리가 길었다. 음경은 성숙도 2기였고, 고환은 양쪽 모두 1cm 크기로 작고 단단하게 만져졌다. 열은 없으며 맥박과 호흡수는 정상이었다. 황달은 없으며, 간과 비장은 만져지지 않았다.\n검사는?","stem_table":null,"options":["염
