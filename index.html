"2025-L30-Q85": "【정답 2】갑상선전절제술 + 중앙림프절절제술 후 PTH 5 pg/mL(저하), Ca 8.0(저하), ionized Ca 0.75(저하) → 부갑상선 기능저하 → 저칼슘혈증. 저칼슘혈증의 대표 신체 소견은 Trousseau's sign(혈압계 커프 팽창 시 손목 경련 유발)이다. ①Bancroft's sign: 신장 외상과 관련된 소견. ③Chadwick sign: 임신 시 자궁경부 청색증. ④Traube's sign: 비장 비대 타진 소견. ⑤Kussmaul's sign: 심낭염/심낭압전 시 흡기 시 경정맥압 상승. 💡 갑상선 수술 후 저칼슘혈증 → Trousseau's sign(잠재성 강직); Chvostek sign(뺨 두드리면 안면 근육 경련)도 함께 알 것.",
"2023-L35-Q165": "【정답 4】갑상선전절제술 + 중앙림프절절제술 후 PTH 5 pg/mL, Ca 8.0 mg/dL, ionized Ca 0.75 mmol/L → 부갑상선 기능저하증으로 인한 저칼슘혈증이 원인. 치료는 칼슘 보충(정맥 또는 경구) + 활성형 비타민 D(calcitriol) 투여이다. ①calcitonin: 고칼슘혈증 치료제이며 저칼슘 치료에 사용하지 않음. ②생리식염수: 저칼슘 치료 효과 없음. ③봉투 재호흡: 과호흡으로 인한 호흡성 알칼리증(이온화 Ca 감소) 유발 시 적용; 본 증례는 수술 후 진성 저칼슘. ⑤O2 투여: 호흡부전이 아닌 저칼슘혈증에는 무효. 💡 수술 후 부갑상선 기능저하 → Ca + 활성 비타민 D 즉시 보충.",
"2023-L36-Q92": "【정답 3】고령(70세), 20년 전 결절이 갑자기 커짐, 7×5cm 주변 침윤, 병리 이미지(다형성 이형성 세포, 방추형 세포)는 갑상선 미분화암(ATC)의 전형. ATC 발생에 p53 mutation이 핵심 역할을 한다. ①오류: ATC는 변이가 매우 많다(TP53, BRAF, RAS, TERT promoter 등). ②오류: ATC의 중앙 생존기간은 6개월 미만으로 예후가 극히 불량하다. ④오류: TERT promoter 변이는 ATC 발생에 중요한 역할을 한다. ⑤오류: ATC는 면역조직화학·전자현미경에서 상피세포 분화의 흔적(cytokeratin 양성 등)을 찾을 수 있다. 💡 ATC: TP53 + TERT promoter mutation + 극불량 예후.",
"2023-L36-Q162": "【정답 2】경계 좋은 1.5×1cm 고형 결절, 병리 이미지(피막으로 둘러싸인 미세 여포성 패턴, 인셋: 피막 침습 소견)는 갑상선 여포암(FTC)이다. FTC에서 가장 흔한 변이는 RAS mutation과 PAX8-PPARγ translocation이다. ①오류: FTC의 진단은 피막 침습 여부가 핵심; 피막이 매우 중요하다. ③오류: 혈관 침습 여부도 FTC 진단과 예후 분류의 핵심 기준이다. ④오류: BRAF V600E 변이는 PTC의 특징. ⑤오류: FTC는 혈행성 전이(폐, 뼈)가 특징이며 림프절 전이는 드물다. 💡 FTC = RAS/PAX8-PPARγ + 피막·혈관 침습으로 진단, 림프절 전이 드물고 혈행성 전이.",
"2023-L36-Q177": "【정답 4】35세 여성, 2×1cm 경계 불명확 침윤성 종괴, 병리 이미지(유두상 구조, 핵 밀집)는 갑상선 유두암(PTC). '적합하지 않은 것' 선택 문제. PTC는 림프절 전이가 흔하나 혈행성 전이는 드물다. 혈행성 전이(폐·뼈)는 여포암(FTC)의 특징이므로 ④가 틀린 설명. ①옳음: nuclear groove, pseudoinclusion은 PTC 핵 특징. ②옳음: PTC는 갑상선 여포세포 기원. ③옳음: BRAF V600E가 PTC에서 가장 흔한 변이(~60%). ⑤옳음: tall cell·columnar cell variant는 더 공격적인 PTC 아형. 💡 PTC의 전이 경로: 림프절(주) / 혈행성(드묾) ↔ FTC: 혈행성(주).",
"2023-L37-Q106": "【정답 4】6세 여아, 목덩이, 신생아기 황달, 변비, 언어 발달 지연, TSH 12.5 mIU/L(↑), 유리 T4 1.1(정상 하한), 초음파: 갑상선 제위치 없음. 갑상선 스캔 이미지(목 상부에 갑상선 조직 uptake)는 딴곳 갑상선(ectopic thyroid)을 시사하며, 이것이 목덩이의 원인. 유일한 갑상선 조직이므로 제거 불가; 대신 레보티록신 치료를 시작해야 한다(TSH 상승, 지연 발달). ①오류: 과염소산방출검사는 합성장애 진단에 사용; 현 소견은 이소성 갑상선. ②오류: 딴곳 갑상선은 유일한 갑상선 조직일 수 있어 제거하면 안 된다. ③오류: 합성장애 의심 시 청력검사(Pendred 증후군 감별)를 시행하나, 이 환자는 갑상선 스캔에서 이소성 갑상선 확인됨. ⑤오류: 비만이 원인이 아니라 이소성 갑상선으로 인한 갑상선저하증. 💡 이소성 갑상선 = 제거 금지 + 레보티록신 치료.",
"2023-L37-Q120": "【정답 2】미숙아(35주, 1.3kg), 신생아기부터 레보티록신 치료, 1세 초음파: 정상 위치 갑상선 확인, 3세에 현재 TSH 9.4(↑), 유리 T4 0.9(정상 하한), 발달 정상. 미숙아에서 일시적 갑상선저하증은 생후 수개월 내 자연 회복되는 경우가 있으나, 이 환자는 3세까지 지속적 TSH 상승을 보여 영구적 선천성 갑상선저하증으로 레보티록신 치료를 지속해야 한다. ①오류: 미숙아 일시적 저하증이라면 이미 3세에 정상화되었을 것. ③오류: TSH 9.4로 여전히 갑상선저하증 상태에서 중단은 부적절. ④오류: 중추성이면 TSH가 낮거나 정상이어야 함. ⑤오류: 선천성 갑상선형성부전은 갑상선 조직이 없거나 매우 작음; 초음파에서 정상 크기 갑상선 확인됨. 💡 3세에도 TSH 지속 상승 → 레보티록신 치료 지속; 중단 시도는 정상 기능 회복 확인 후.",
"2023-L37-Q189": "【정답 4】미숙아, 신생아기 TSH 상승으로 레보티록신 시작, 36개월 초음파 정상으로 중단, 이후 7개월(생후 43개월?)에 TSH 7.5(↑), 유리 T4 1.3(정상), 99mTc 스캔 이미지(갑상선 정상 위치에 uptake), 과염소산방출검사 양성(25% 이상 감소). 과염소산방출검사 양성 = 요오드 유기화 장애(organification defect) 확인. 청력장애도 있음. 이 조합(유기화 장애 + 청력 장애)은 Pendred 증후군이다. ①오류: 유리 T4 정상이고 TSH 경도 상승이므로 즉각 레보티록신 재시작보다 진단 확립이 선행; 합성장애에서는 지속 치료 필요. ②오류: 갑상선형성부전은 갑상선 스캔에서 정상 uptake 확인됨으로 배제. ③오류: 미숙아 일시적 저하증은 이미 수년 경과. ⑤오류: 과염소산방출검사 '양성(25% 이상 감소)'이 유기화 장애를 의미; 정상이 아님. 💡 과염소산방출검사 양성 + 감각신경성 난청 = Pendred 증후군(SLC26A4 변이).",
"2023-L39-Q133": "【복수정답 2, 4】35세 환자(좌측 사진: 여포성 종양 피막 내 여포 패턴)와 50세 환자(우측 사진: 유두상 구조 + 핵 소견)를 비교. 좌=FTC(여포성 종양), 우=PTC(유두암). 옳지 않은 것: ②FTC와 FTA(여포선종)는 세침흡인검사로 감별이 불가하다(피막·혈관 침습은 조직검사로만 확인). ④PTC에서 가장 흔한 분자 이상은 BRAF V600E mutation이며, PAX8-PPARγ는 FTC의 변이다. ①옳음: FTC 진단에 피막·혈관 침습 현미경 확인이 핵심. ③옳음(우=PTC): PTC 엽절제 후 반대편에 병변 가능성으로 전절제를 고려하거나 추가 절제가 필요할 수 있음. ⑤옳음: PTC(우 질환)는 WHO 분류에서 크게 classic/follicular variant/other variants로 분류됨. 💡 FTC ↔ PTC: 세침흡인으로 감별 불가(FTC는 피막침습 확인 필요); PTC 가장 흔한 변이 = BRAF V600E.",
"2023-L39-Q137": "【정답 2】23세 여성, 양측 갑상선 악성 종괴, 전절제술. 병리 이미지(우측: 화살표가 가리키는 분홍색 무정형 물질). 임상 맥락(젊은 나이, 양측성, 부갑상선/부신 동반 가능)과 이미지상 amyloid 침착 → 갑상선 수질암(MTC) + MEN2 가능성. 옳지 않은 것: ②MTC에서 RET 점돌연변이(germline 또는 somatic)가 주된 원인이며, RAS mutation은 sporadic MTC 일부에서 보고되나 Familial/sporadic 모두에서 '흔하다'는 설명은 틀리다. ①옳음: MTC 환자에서 MEN2에 의해 부갑상선·부신(갈색세포종) 동반 가능. ③옳음: 우측 화살표 물질 = amyloid(아밀로이드). ④옳음: MTC는 calcitonin, CEA 면역염색 양성. ⑤옳음: MTC 기원세포 = parafollicular C cell. 💡 MTC: RET mutation + calcitonin + amyloid + MEN2 연관.",
"2022-L20-Q6": "【정답 1】41세 여성, 2.5cm 갑상선 결절, 세침흡인 Bethesda VI(악성, PTC). 갑상선 절제술이 적응증이다. ②적극적 감시: 1cm 미만 저위험 미세 PTC에만 해당; 2.5cm Bethesda VI는 수술 대상. ③TSH 억제요법: 수술 후 보조요법으로 사용, 수술 대체 불가. ④고주파절제술: 양성 결절 대안; 악성에 대한 표준 치료 아님. ⑤에탄올 주입술: 낭성 양성 결절 처치; 악성에 부적합. 💡 Bethesda VI(악성) + 2.5cm → 갑상선 절제술 시행.",
"2022-L20-Q120": "【정답 5】30세 여성, 2.1cm 좌엽 결절, 세침흡인 follicular neoplasm(Bethesda IV), 갑상선기능 정상, 마크로 석회화. Bethesda IV(follicular neoplasm)는 세침흡인으로 악성·양성 감별 불가 → 수술적 확인 필요. 단독 결절에는 갑상선 엽절제술(lobectomy)이 초기 수술 선택이다. ①갑상선 스캔: 기능성 결절 배제에 사용하나 follicular neoplasm의 추가 진단 가치 제한적; 확진이 필요하면 수술 우선. ②Thyroglobulin: 수술 후 추적 마커, 진단 전 단계에서 의미 없음. ③FNAC 재검: Bethesda IV는 재검보다 수술이 권고됨. ④전절제술: 단일 결절에서 처음부터 전절제 권고는 과함; 엽절제 후 악성 확인 시 완성 전절제 고려. 💡 Bethesda IV = follicular neoplasm → 엽절제술로 확진.",
"2022-L21-Q79": "【정답 1】고령(70세), 오래된 결절이 급격히 커짐, 7×5cm 주변 침윤, 쉰 목소리. 병리 이미지(다형성 방추형·거대 이형성 세포, 괴사)는 ATC. p53 mutation이 ATC 발생에 핵심 역할을 한다. ②오류: ATC 중앙 생존기간 ~6개월, 10년 생존율 극히 낮음. ③오류: ATC는 유전자 변이가 매우 풍부(TP53, TERT, BRAF, RAS 등). ④오류: TERT promoter mutation은 ATC에서 자주 발견됨. ⑤오류: ATC는 면역조직화학에서 cytokeratin 양성 등 상피 분화 흔적이 일부 확인된다. 💡 ATC = p53/TP53 mutation이 역분화의 핵심 드라이버.",
"2022-L22-Q9": "【정답 3】생후 20일 여아, 황달, 오빠 선천성 갑상선저하증 있음, TSH 45(↑), 유리 T4 0.83(정상 하한). 갑상선 초음파: 정상 위치·크기. 갑상선 스캔 이미지(갑상선 위치 정상, uptake 있으나 뼈 이미지와 함께 보임 — 주어진 이미지가 X-ray처럼 보이지만 맥락상 갑상선 스캔): 갑상선 제위치에 있고 크기 정상. TSH 매우 높고 갑상선 정상 위치·크기 → 합성장애(dyshormonogenesis)가 가장 합당. 형제에서 동일 질환 → 유전성 합성장애 지지. ①호르몬 저항성: 유리 T4 정상이어야 함. ②모체 TSH receptor blocking Ab: 일시적 저하증, 대개 수개월 내 회복. ④시상하부-뇌하수체 이상: TSH가 낮거나 정상이어야 함. ⑤TBG 결핍: 총 T4 낮지만 유리 T4 정상, TSH 정상. 💡 유전성 갑상선 합성장애: 가족력 + 갑상선 정상 위치·크기 + TSH 매우 높음.",
"2022-L22-Q46": "【정답 3】생후 2주 여아, 황달, 변비, 모유수유 중. 어머니 Graves 병(갑상선 전절제 후 레보티록신 복용, 임신 중 기능 정상). 갑상선 초음파: 제위치에 없음. TSH 130(매우 높음), 유리 T4 0.8(정상 하한). 갑상선이 제위치에 없음 = 갑상선이형성(발달 이상). TSH 130으로 매우 높고 유리 T4 경계 수준 → 즉시 레보티록신 치료 시작이 필요하다. ①갑상선 스캔: 이소성 갑상선 확인에 유용하나 치료 지연 없이 스캔과 병행 가능; 그러나 TSH 130에서는 우선 치료 시작이 원칙. ②TSH receptor blocking Ab: 어머니 Graves 병 후 절제 상태로 Ab 생성 가능성 낮음; 긴급 치료가 먼저. ④TBG 검사: TBG 결핍은 TSH 정상. 💡 갑상선 이형성 + TSH 130 + 증상 → 즉각 레보티록신 시작(진단 검사와 동시 진행 가능).",
"2022-L24-Q1": "【정답 3】42세 여성, 갑상선 우엽 절제술. 병리 이미지(피막이 있고, 여포 패턴, 피막 부분 침습 소견)는 minimally invasive follicular carcinoma(MIFC)이다. 피막이 있고 피막 침습이 일부 있는 여포암 = MIFC. ①오류: 피막의 '유무'보다 피막 '침습 여부'와 혈관 '침습 여부'가 진단에 핵심. ②오류: FTC와 여포선종은 세침흡인으로 감별 불가. ④오류: RET/PTC rearrangement는 PTC의 특징; FTC의 흔한 변이는 RAS, PAX8-PPARγ. ⑤오류: nuclear crowding·groove는 PTC의 핵 소견. 💡 MIFC = 피막 침습(±혈관 침습 없음); 혈관 침습 추가 시 widely invasive FTC로 예후 달라짐.",
"2022-L24-Q29": "【정답 5】40세 여성, 1.5×1cm 경계 좋은 고형 결절, 엽절제술. 병리 이미지(피막 내 종양세포가 혈관으로 침습하는 소견)는 FTC이다. 'FTC에서 림프절 전이를 잘해 주의 필요'는 옳지 않다. FTC는 혈행성 전이가 특징이며, 림프절 전이는 드물다. ①옳음: 피막 존재가 여포성 종양 진단에 기본. ②옳음: RAS, PAX8-PPARγ이 FTC의 흔한 변이. ③옳음: 피막 + 혈관 침습이 진단 핵심. ④옳음: TERT promoter 변이 시 더 공격적 임상 경과. 💡 FTC: 혈행성 전이(폐·뼈) ↔ PTC: 림프절 전이.",
"2022-L24-Q44": "【정답 2】83세 남성, 목 종괴 + 목소리 쉬는 증상, 갑상선 절제술. 병리 이미지(시트상·소도성 배열, 이형성 세포, 괴사, 혈관 침습 소견 없음의 대형 sheet pattern)는 갑상선 미분화암(ATC)의 조직 패턴이다. ATC는 빠른 성장, 매우 나쁜 예후로 중앙 생존기간 약 6개월이다. ①오류: 목소리 쉬는 것은 반회후두신경(recurrent laryngeal nerve) 침범으로 종양과 직접 관련됨. ③오류: calcitonin+chromogranin 양성은 MTC. ④오류: 혈관 침윤+amyloid 침착은 MTC의 특징. ⑤오류: BRAF mutation 가장 흔한 것은 PTC; ATC는 TP53 등 복합 변이. 💡 ATC: 극불량 예후 + 반회후두신경 침범(목 쉼) + TP53/BRAF/TERT 복합 변이.",
"2022-L24-Q55": "【정답 2】35세 여성, 2×1cm 침윤성 경계 불명확 종괴, 전절제. 병리 이미지(고배율: 핵 밀집·중첩·nuclear groove·pseudoinclusion 소견의 유두상 세포)는 PTC. '옳지 않은 것': PTC는 혈행성 전이가 드물다. 혈행성 전이(폐·뼈)는 FTC의 특징. ①옳음: nuclear groove, pseudoinclusion = PTC 핵 특징. ③오류이자 답: 'BRAF 유전자 변이가 PTC에서 독점적'이 아니라 가장 흔한 것; 하지만 여기서 '옳지 않은 것'은 ②번(혈행성 전이). ④옳음: PTC는 갑상선 여포세포 기원. ⑤옳음: tall cell variant, columnar cell variant는 공격적 PTC 아형. 💡 PTC = BRAF V600E + 림프절 전이; 혈행성 전이는 드묾.",
"2021-L32-Q77": "【정답 3】갑상선 세침흡인검사(FNAC)에 관한 설명. 검사의 목적은 기능성 또는 염증성 질환과 수술이 필요한 종양성 질환을 구별하는 것이다. ①오류: FNAC는 core needle biopsy(CNB)보다 indeterminate category(AUS/FLUS) 빈도가 더 높다. ②오류: FNAC는 간단·빠르고 경제적이며 심한 출혈 등 합병증은 드물다. ④오류: Bethesda IV(follicular neoplasm)의 악성도는 약 25~30%이며, 60~75%는 아니다. ⑤오류: Bethesda I(부적절 검체) 비율은 약 2~15%로 5%를 초과할 수 있다. 💡 FNAC 목적: 수술 필요 종양 vs. 비수술적 질환 감별.",
"2021-L32-Q78": "【정답 3】세침흡인 이미지(낮은 배율, 콜로이드 풍부한 배경에 갑상선 여포 세포 소수 = Bethesda II Benign 소견)는 양성 결절(낭성 결절이나 콜로이드 결절)에 해당한다. Benign category의 악성도는 0~3%이므로 추가 분자검사 없이 추적 관찰이 가능하다. ①오류: 양성 소견이므로 추가 molecular testing 불필요. ②오류: risk of malignancy 0~3%(Benign category), 10~30% 아님. ④오류: Benign 소견에 재검은 불필요(초음파 위험도 낮으면). ⑤오류: TSH-binding inhibitor immunoglobulin(TRAb)은 Graves 병 원인; 이 결절 소견과 무관. 💡 Bethesda II(Benign): 콜로이드 풍부·세포 희소 → 악성도 0~3%, 경과 관찰.",
"2021-L32-Q80": "【정답 1】45세 남성, 4.0×3.0cm 경계 좋은 종괴, 세침흡인 이미지(여포성 패턴, Bethesda IV follicular neoplasm). 이 경우 수술 후 FTC로 확인된 상황에서 FTC와 가장 관련 깊은 유전자 변이는 PAX8-PPARγ translocation이다. ②RET/PTC: PTC의 변이. ③BRAF V600E: PTC의 가장 흔한 변이. ④TP53: ATC. ⑤CTNNB1: poorly differentiated carcinoma. 💡 FTC 변이: RAS mutation(가장 흔함) + PAX8-PPARγ translocation(특이적).",
"2021-L32-Q82": "【정답 4】37세 여성, 다발성 종괴, Bethesda VI, 전절제술. 병리 이미지(유두상 구조, 핵 소견, psammoma bodies)는 PTC. PTC는 다발성으로 나타나는 경우가 18~87%로 흔하다. ①오류: PTC는 젊은 나이일수록 예후가 좋다(소아·청소년에서도 예후 양호). ②오류: psammoma body는 PTC에서 매우 특징적이며 진단에 도움이 된다. ③오류: PTC의 전이는 주로 림프절; 혈행성은 드묾(FTC 특징). ⑤오류: PTC 진단은 유두상 구조보다 특징적 핵 소견(groove, pseudoinclusion)이 더 중요하다. 💡 PTC 다발성(multifocal) = 18~87%; psammoma body는 PTC 특징 소견.",
"2021-L32-Q110": "【정답 3】갑상선암 중 기원세포가 다른 암. 유두암·여포암·미분화암·휘틀(Hürthle)세포암은 모두 갑상선 여포세포(follicular cell) 기원이다. 수질암(Medullary carcinoma)은 갑상선 방여포세포(parafollicular C cell, 칼시토닌 분비) 기원으로 다르다. 💡 갑상선암 기원: 여포세포 = PTC, FTC, ATC, Hürthle cell / C cell = MTC.",
"2021-L35-Q7": "【정답 1】45세 여성, 양엽 결절: 우엽 0.6cm, 좌엽 1.5cm, 정상 갑상선기능. 초음파 이미지(우: 단순 낭성/안전한 결절, 좌: 고형 결절)를 보면 우엽은 0.6cm로 세침흡인 기준 미달(1cm 미만은 고위험 초음파 소견 없으면 관찰), 좌엽 1.5cm은 세침흡인 대상이나 추가 정보 없이 바로 경과 관찰로 결정. 단, ATA 가이드라인상 고위험 소견 없는 1~1.5cm은 6~12개월 관찰 후 성장 시 FNAC 시행 가능. 이 문제의 보기에 '좌측 FNAC'가 있어 경과 관찰을 답으로 택한 것이 의문이지만, 초음파 소견 기준 정상기능 + 경계 좋은 결절에서 우선 경과 관찰을 선택한 것으로 해석. 💡 갑상선 결절 FNAC 시행 기준: 1cm 이상 + 고위험 초음파 소견 또는 1.5cm 이상(중간 위험). 선생님 강의 방침 우선 확인 권장.",
"2021-L35-Q8": "【정답 2】54세 여성, 갑자기 발생한 목 통증 + 덩이, 정상 갑상선기능. 초음파 이미지(낭성 또는 혼합성 결절)는 갑상선 낭종 내 출혈(intracystic hemorrhage)이나 급성 염증성 낭종 가능. 진단과 치료 목적으로 미세침흡인이 가장 적절하다. ①경과 관찰: 급성 증상(통증, 갑자기 커짐)에서 부적절. ③CNB: 낭성 병변에는 FNAC가 우선. ④고주파 절제술: 악성 배제 전 부적절. ⑤엽절제술: 진단 확립 전 수술은 과도. 💡 갑자기 커지는 갑상선 낭성 종괴 + 통증 → FNAC로 출혈성 낭종 확인·흡인.",
"2021-L36-Q79": "【정답 3】갑상선암 설명 중 옳은 것. 2017년 개정 WHO 분류에서 minimally invasive follicular carcinoma(MIFC)는 피막 침습만 있고 혈관 침습이 없는 경우로 정의한다(최소 침습성 여포암). ①오류: PTC는 한국에서 갑상선암의 약 90% 이상 차지(80%로 기술하면 과소). ②오류: Follicular adenoma에서 FTC로 진행 가능성이 있다(adenoma→carcinoma sequence 존재). ④오류: Poorly differentiated carcinoma는 PTC·FTC 모두에서 발생 가능; ATC도 마찬가지. ⑤오류: ATC는 면역조직화학에서 cytokeratin 등 상피 분화 흔적 일부 존재. 💡 MIFC 정의: 피막 침습(O) + 혈관 침습(X) = 예후 매우 좋음.",
"2021-L36-Q92": "【정답 1】21세 여성, 다발성 갑상선 종괴, 전절제. 초음파 이미지(경계 불명확, 낭성 변화가 없는 고형 결절)는 PTC. '옳지 않은 것': PTC에서 피막의 유무는 진단 기준이 아니다(PTC는 피막 없이도 발생 가능). ②오류: PTC와 여포선종 감별은 세침흡인으로 가능(PTC는 핵 소견으로 진단, FTA/FTC는 감별 불가). 사실 PTC는 세침흡인으로 진단 가능, 여포암은 불가. ③옳음: Psammoma bodies는 PTC에서 흔한 소견. ④옳음: RET/PTC rearrangement가 PTC의 흔한 변이(BRAF 다음으로 또는 방사선 조사 후 PTC에서 주된 변이). ⑤옳음: 핵 crowding, overlapping, nuclear groove = PTC 핵 소견. 💡 PTC 진단: 피막 불필요(PTC는 비피막성 종양); 핵 소견 + BRAF/RET/PTC 변이.",
"2021-L39-Q37": "【정답 4】생후 14일 신생아, 황달, 모유수유, 체중 유지. 유리 T4 0.69(낮음), 갑상선기능 이상. 신생아 황달 + 저유리T4 = 선천성 갑상선저하증 가능성. 즉각 레보티록신 투여가 신경발달 보호를 위해 필요하다. ①TBG 검사: TBG 결핍이면 유리 T4 정상; 진단 지연 원인. ②갑상선 스캔: 원인 감별에 유용하나 치료 지연 불가. ③모유 중단: 모유는 갑상선저하증 원인 아님. ⑤추적 관찰: 증상 있는 신생아 저하증에서 치료 지연 금기. 💡 신생아 갑상선저하증 → 즉각 레보티록신 시작(조기 치료가 지능 발달에 필수).",
"2021-L39-Q40": "【정답 1】이란성 쌍생아 둘째 남아(37주, 1.8kg), 신생아선별 총 T4 낮음, 유리 T4 1.0(정상), TSH 미기재(정상 추정). 첫째 여아는 정상. 미숙아 남아에서 총 T4 낮지만 유리 T4 정상 = TBG(티록신결합글로불린) 결핍 가능성 → TBG 검사가 우선. 고환 한쪽만 촉지(잠복고환)도 있어 감별 필요. ①TBG 검사: 총 T4 낮고 유리 T4 정상 = TBG 결핍 감별. ②잠복고환 수술: 갑상선 문제와 별개이며 즉각 수술 불필요. ③모유 중단: 불필요. ④레보티록신: 유리 T4 정상이므로 즉각 투여 불필요. ⑤쌍생아 첫째 검사: 이미 정상으로 확인됨. 💡 총 T4 낮고 유리 T4 정상 → TBG 결핍 감별을 위해 TBG 검사.",
"2021-L39-Q41": "【정답 5】37개월 남아, 신생아기 선천성 갑상선저하증 진단, 레보티록신 치료 후 36개월에 정상 초음파로 중단 시도. 1개월 후 검사: 세부 결과 미기재. 'pendred 증후군 가능성이 높다'는 설명이 핵심. 갑상선 유기화 장애(과염소산방출검사 양성) + 청력장애 = Pendred 증후군. ①오류: 정상 초음파라도 TSH가 여전히 상승이면 보상성 저하증. ②오류: 경미한 갑상선 형성부전에서 투약 중단 후 TSH 상승 시 재시작 필요. ③오류: 요오드 제한은 갑상선암 RAI 전처치; 갑상선저하증 치료 아님. ④오류: 유기화 장애는 레보티록신 투여가 맞으나 '청력장애 동반 시 Pendred 증후군'이 더 정확한 설명. 💡 갑상선 합성장애 + 감각신경성 난청 = Pendred 증후군(SLC26A4 변이).",
"2021-L40-Q86": "【정답 1】32세 여성, 갑상선 우엽 절제술. 병리 이미지(상: 유두상 분지 구조, 핵 밀집; 하: 유두상 구조 + nuclear groove)는 PTC. 'PTC에서 피막의 유무가 진단에 중요하다'는 옳지 않은 설명이지만 여기서는 정답으로 채점됨 — 즉 이 질문은 '옳은 것'을 고르는 것이 아니라 이미지에 맞는 질환(PTC)에서 피막 유무 진단 의미를 묻는 맥락. 단, PTC에서는 피막이 없어도 핵 소견으로 진단 가능하므로 피막의 '유무'보다 핵 소견이 핵심. ②오류: PTC는 세침흡인으로 핵 소견 확인하여 악성 진단 가능. ③오류: Psammoma body는 PTC에서 흔함. ④오류: RET/PTC rearrangement는 PTC 변이 중 하나지만 BRAF V600E가 더 흔함. ⑤옳음: nuclear crowding, overlapping, groove = PTC 소견. 💡 본 문항 의도: PTC 병리 이미지 식별 + PTC 특징 복습. 피막 유무보다 핵 소견이 PTC 진단의 핵심.",
"2021-L40-Q89": "【정답 2】38세 여성, 갑상선 좌엽 종괴 절제. 병리 이미지(상: 유두상 구조 + 핵 소견; 하: 유두상 구조 + 피막 침습 소견)는 PTC(유두상 구조 + 핵 특징). PTC에서 가장 흔한 유전자 변이는 BRAF V600E mutation이다. ①RAS mutation: PTC 여포성 변이, FTC에서 더 흔함. ③PAX8-PPARγ: FTC 특이적. ④TP53: ATC. ⑤CTNNB1: poorly differentiated carcinoma/ATC. 💡 PTC 가장 흔한 변이: BRAF V600E(~60%); 방사선 연관 PTC는 RET/PTC rearrangement.",
"2025-L31-Q27": "【정답 4】5세 여아, 목덩이, 신생아기 황달·광선치료, 변비, 언어 발달 지연, TSH 11 mIU/L(↑), 유리 T4 1.1(정상 하한), 초음파: 갑상선 제위치에 없음. 99mTc 스캔(이소성 uptake). 임상 소견 = 이소성 갑상선(ectopic thyroid)이 목덩이 원인이며, 이것이 환자의 유일한 갑상선 조직. TSH 상승 + 발달 지연 → 갑상선저하증 상태이므로 레보티록신 치료를 시작해야 한다. ①오류: 갑상선설관 낭종 가능성을 위한 초음파보다, 스캔에서 이미 이소성 갑상선 확인됨. ②오류: 유일한 갑상선 조직인 이소성 갑상선을 제거하면 갑상선 기능 완전 소실. ③오류: 합성장애가 아닌 이소성 갑상선 소견(스캔에 uptake 있음). ⑤오류: 비만이 갑상선저하증의 원인이 아니라 갑상선저하증이 비만·발달 지연의 원인. 💡 이소성 갑상선 = 제거 금지, 레보티록신 치료로 TSH 정상화.",
"2025-L31-Q40": "【정답 3】Graves 병으로 methimazole 복용 중인 임산부에서 출생한 신생아. 이미지(임산부 목 사진 + 갑상선 스캔의 이소성 uptake). 신생아 갑상선기능항진증의 원인은 모체의 혈중 TSH 수용체 항체(TRAb, TSH receptor stimulating antibody)가 태반을 통과해 태아·신생아에게 전달되어 갑상선을 자극하기 때문이다. ①오류: 모체의 T3는 태반 통과가 매우 제한적. ②오류: methimazole도 태반 통과하나 이것이 신생아 항진증을 유발하지는 않고 오히려 태아 저하증을 유발할 수 있음. ④오류: TPO 항체는 갑상선 자극 기능이 없음. ⑤오류: 태아 뇌하수체-갑상선 축 미성숙은 저하증 원인; 항진증과 무관. 💡 신생아 갑상선기능항진증 = 모체 TRAb 태반 이행이 원인; 모체 Graves 병 산모에서 주의 필요.",
"2025-L31-Q70": "【정답 5】생후 15일 여아, 황달, TSH 약간 높음(선별검사), 유리 T4 1.4(정상), 갑상선 초음파 정상. 오빠는 선천성 갑상선저하증 진단 후 3세에 중단하고 8세까지 정상 유지(일시적 저하증 패턴). 이 여아는 유리 T4 정상, TSH 경도 상승 → 일시적 저하증(transient hypothyroidism) 가능성이 높고 즉각 치료보다 생후 4주 이내 갑상선 기능검사 추적 관찰이 적절하다. ①레보티록신: 유리 T4 정상이고 일시적 저하증 가능성에서 즉각 시작은 과도. ②갑상선 스캔: 확정 진단 전 스캔보다 추적 관찰로 저절로 회복 여부 확인이 우선. ③TBG 검사: TSH 상승 있으므로 TBG 결핍 가능성 낮음. ④TSH receptor blocking Ab: 모체 Graves 병 병력 없어 우선순위 낮음. 💡 신생아 경도 TSH 상승 + 유리 T4 정상 + 가족력(형제 일시적) → 4주 이내 추적 재검으로 자연 회복 확인.",
"2025-L31-Q75": "【정답 2】신생아기부터 레보티록신 복용, 3세에 4주간 중단 후 유리 T4 0.70(낮음), TSH 80(매우 높음), 초음파 갑상선 정상 위치·크기. 갑상선이 정상 위치에 정상 크기로 있으면서 레보티록신 중단 시 즉시 TSH 상승+유리 T4 저하 → 갑상선 호르몬 합성장애(dyshormonogenesis). 갑상선형성부전은 초음파에서 갑상선 조직이 없거나 매우 작음. ①갑상선 무형성: 초음파에서 갑상선 정상 크기 있으므로 배제. ③모체 TSH receptor blocking Ab: 일시적이며 6~12개월 내 사라짐; 3세까지 지속 저하증은 설명 불가. ④중추성 저하증: TSH가 낮거나 정상이어야 함; TSH 80으로 매우 높으므로 배제. ⑤딴곳 갑상선: 초음파에서 제위치 정상 갑상선 확인됨. 💡 정상 위치·크기 갑상선 + 치료 중단 시 즉각 TSH 대폭 상승 = 합성장애; PAX8·NKX2-1·DUOX2 등 유전자 변이.",
"2025-L40-Q2": "정답 ③ 지방세포에서 triacylglycerol 합성 증가. 식후 2시간은 흡수기(absorptive state)로 인슐린 분비가 증가하고 글루카곤은 감소한다. 인슐린은 지방세포에서 LPL 활성 및 de novo lipogenesis를 촉진하여 triacylglycerol 합성이 늘어난다. ①글루카곤은 공복 시 증가하므로 오답, ②ketone body 합성은 공복(인슐린 저하) 시 증가하므로 오답, ④지방산 분해(β-oxidation)도 공복 때 활성화, ⑤뇌의 ketone body 이용은 수 주간 극심한 공복 적응 시.",
"2025-L40-Q33": "정답 ③ 뇌가 간의 ketone body를 주에너지원으로 사용. 4주 이상 완전 단식(complete starvation) 상태에서는 포도당 공급이 극도로 제한되고, 뇌가 ketone body(β-hydroxybutyrate, acetoacetate)를 주된 에너지원으로 적응 사용한다. ①뇌가 glucose를 주로 사용하는 것은 정상·단기 공복 상태, ②뇌는 지방산(fatty acid)을 혈뇌장벽 통과 제한으로 직접 사용하지 못함, ④근육 glycogen은 혈당 유지에 기여 못함(근육에 glucose-6-phosphatase 없음), ⑤4주 장기 공복에서 근육 단백질 분해는 초반보다 감소(적응).",
"2025-L40-Q75": "정답 ① 간세포에서 triacylglycerol 합성 증가. 비만·제2형 당뇨 환자는 인슐린 저항성 하에서도 간의 de novo lipogenesis(지방 신합성)는 오히려 항진되어 간내 triacylglycerol 합성 및 VLDL 분비가 증가한다(NAFLD 기전). ②③지방세포로의 fatty acid·glucose 유입은 인슐린 저항성으로 오히려 감소, ④adiponectin은 비만·당뇨에서 감소(항염증·인슐린 감수성 호르몬), ⑤비만·인슐린 저항성에서 leptin은 증가(leptin 저항성 상태).",
"2025-L40-Q93": "정답 ③ β-hydroxybutyrate(케톤체). 8일간 물만 마신 극심한 공복 상태로, 지방 분해(lipolysis)가 극대화되어 간의 ketogenesis가 활성화되고 혈중 케톤체(β-hydroxybutyrate)가 현저히 상승한다. 포도당(①)은 오히려 저하, 아미노산(발린 ②, 류신 ④)은 근육 단백질 분해로 증가할 수 있으나 케톤체가 가장 현저히 상승하는 분자, ATP(⑤)는 세포 내 에너지 화폐로 혈중 측정 부적절. 💡 장기 공복 → 혈중 ketone body 현저 상승이 핵심.",
"2025-L41-Q23": "정답 ① 상염색체 우성으로 유전된다는 설명이 틀림. 제시된 환자는 젊은 나이, 마른 체형, C-펩타이드 저하, Anti-GAD 항체 양성 → 제1형 당뇨병(T1DM). T1DM은 복합유전(polygenic) 질환으로 단순 상염색체 우성(AD) 유전이 아님. ②대부분 가족력 없음(산발성) — 맞음, ③형제 간 위험도(λs)~10 — 맞음, ④HLA(DR3/DR4)가 유전 감수성 50% 이상 기여 — 맞음, ⑤북유럽에 비해 아시아(한국)에서 발병률이 낮음 — 맞음.",
"2025-L41-Q45": "정답 ⑤ 베타세포 기능이 인슐린 저항성을 극복하지 못함. 비만·인슐린 저항성이 있는 제2형 당뇨 환자는 초기에 베타세포가 보상적으로 인슐린을 과분비하지만, 결국 베타세포 기능 부전이 발생하여 인슐린 저항성을 보상 못 하게 되면 고혈당이 나타난다. ①인크레틴 효과(GLP-1·GIP 반응)는 T2DM에서 오히려 감소, ②간의 포도당신생합성은 인슐린 저항성으로 억제 안 됨(증가), ③알파세포 글루카곤 분비는 T2DM에서 오히려 증가, ④근육 인슐린수용체 신호는 감소(저항성).",
"2025-L41-Q78": "정답 ⑤ 전형적 고혈당 증상 + 무작위 혈당 ≥ 200 mg/dL. 당뇨병 진단 기준: (a) 공복혈당 ≥ 126 mg/dL, (b) 75g OGTT 2시간 혈당 ≥ 200 mg/dL, (c) HbA1c ≥ 6.5%, (d) 증상 + 무작위 혈당 ≥ 200 mg/dL — (d)만 1회 검사로 즉시 진단 가능. ①HbA1c 6.2% < 6.5%(당뇨 전단계), ②식후 1시간 혈당은 진단 기준에 해당 없음, ③공복혈당 110 mg/dL < 126(공복혈당장애), ④OGTT 2시간 180 mg/dL < 200(내당능 장애).",
"2025-L42-Q51": "정답 ② 철저한 혈당 조절. 이미지(안저사진): 배경 당뇨망막병증(background diabetic retinopathy) 소견으로, 미세동맥류·점상 출혈 등만 있는 비증식성 초기 단계로 보인다. 당화혈색소 7.6%로 조절 가능 범위이며, 소변 알부민 음성으로 심한 합병증 없음. 이 단계에서는 혈당 철저 조절이 일차 치료. ③Anti-VEGF·④범망막광응고는 증식성 당뇨망막병증이나 황반부종에 적응, ①아스피린은 심혈관 예방 목적, ⑤Finerenone은 당뇨콩팥병에 적응.",
"2025-L42-Q58": "정답 ② 말초동맥질환(PAD). 핵심 단서: 보행 시 종아리 통증(intermittent claudication, 간헐파행), 발목상완혈압비(ABI) 0.61(정상 ≥0.9, <0.9 = PAD). ABI < 0.9이면 PAD 진단. ①단일신경병증은 특정 신경 영역의 감각·운동 이상, ③원위대칭다발신경병증은 양발 저림·통증으로 보행 시 악화 않음, ④자율신경병증은 기립성 저혈압·위마비 등, ⑤척추관협착증도 간헐파행 유사하나 ABI 정상. 💡 ABI < 0.9 → PAD.",
"2025-L42-Q64": "정답 ⑤ SGLT-2 inhibitor(소듐포도당공동수송체-2 억제제). 이 환자는 20년 당뇨 + eGFR 44.2(stage 3b) + 소변 알부민/크레아티닌비 2200 mg/g(현성 당뇨콩팥병) + 혈당·LDL 잘 조절 중. SGLT-2 억제제는 당뇨콩팥병(DKD)에서 사구체내압 감소, 신장 보호 효과 입증(CREDENCE·DAPA-CKD 연구). ④안지오텐신수용체 차단제는 이미 ACE 억제제 복용 중으로 중복(병용 금기), ③단백질 섭취 제한은 보조 조치, ②Fenofibrate는 지질 조절이나 LDL 이미 양호, ①아스피린은 심혈관 예방.",
"2025-L42-Q80": "정답 ③ 원위대칭다발신경병증(DSPN). 핵심 단서: 양발 대칭성 시림·통증, 휴식·야간 악화, 모노필라멘트 감각 저하, ABI 1.13(정상 → 말초동맥질환 아님). 당뇨병성 원위대칭다발신경병증의 전형: 양발 대칭, 야간 악화, 감각 저하. ②말초동맥질환은 ABI < 0.9이어야 하고 보행 시 악화(간헐파행)가 특징, ①단일신경병증은 비대칭·단일 신경 영역, ④자율신경병증은 발한이상·기립성 저혈압, ⑤척추관협착증은 ABI 정상이나 보행 시 악화.",
"2025-L42-Q81": "정답 ④ 신장합병증은 신경·망막 합병증과 동반이 많음. 당뇨병 미세혈관 합병증(신장·망막·신경)은 동일 기전(고혈당 지속)으로 발생하므로 한 합병증이 있으면 다른 합병증 동반 가능성이 높다. ①LDL 콜레스테롤이 1차 목표(fibrate 우선 사용 아님), ②HDL은 당뇨에서 감소(오답), ③망막합병증은 당뇨 초기에도 발생 가능(1~2년 내), ⑤신장합병증 예방에는 혈당 조절뿐 아니라 혈압 조절(RAAS 차단)도 필수.",
"2025-L42-Q94": "정답 ⑤ 아시아인(한국 포함)은 뇌졸중 발생이 높아 주의 필요. 대혈관 합병증에서 서구는 관상동맥질환이 우세하나, 동아시아·한국인은 뇌졸중 발생 비율이 상대적으로 높아 이 부분도 중요하게 관리해야 한다. ①LDL 목표 <70 mg/dL(심혈관 고위험군)이며 160은 너무 느슨함, ②망막합병증은 혈당 조절이 가장 중요(지질 조절보다 우선), ③신경합병증도 혈관 기전 포함, ④신장합병증은 단백뇨(알부민뇨)와 직접 관련.",
"2023-L40-Q122": "정답 ④ A 억제, B 억제, C 억제. 인슐린은 동화(anabolic) 호르몬으로 에너지 저장을 촉진한다: glycogen 분해(glycogenolysis) 억제(A=억제), 지방 분해(lipolysis) 억제(B=억제), ketogenesis 억제(C=억제). 인슐린은 당신생(gluconeogenesis)도 억제한다. 인슐린의 모든 작용이 이화(catabolism) 억제 방향임을 기억. 💡 인슐린 = 저장 호르몬 → 분해 경로 모두 억제.",
"2023-L40-Q140": "정답 ③ 뇌(brain)가 ketone body를 주에너지원으로 사용. 5주 단식은 장기 완전 공복으로, 뇌가 ketone body(β-hydroxybutyrate·acetoacetate)에 적응하여 사용. ①근육은 이 단계에서 주로 fatty acid·ketone body 사용(glycogen은 수일 내 소진), ②근육 단백질 분해는 초기보다 장기에서 오히려 감소(적응, 단백질 보존), ④간세포는 포도당이 아닌 fatty acid·ketone body 사용, ⑤lipolysis는 장기 공복에서 지속 증가(에너지원 공급).",
"2023-L40-Q150": "정답 ④ 혈중 adiponectin level 감소. 비만·제2형 당뇨에서 지방세포 비대로 adiponectin 분비가 감소한다. Adiponectin은 인슐린 감수성 증진, 항염증 역할을 하므로 감소 시 인슐린 저항성 악화. ①③지방세포에서의 TG 합성과 glucose 유입은 인슐린 저항성으로 오히려 감소, ②fatty acid 유입도 감소(LPL 활성 저하), ⑤혈중 TG는 인슐린 저항성·VLDL 과분비로 증가(감소 아님).",
"2023-L41-Q105": "정답 ① 내인성 인슐린 분비 감소/억제. 이 환자는 1형 당뇨병으로 베타세포가 자가면역으로 파괴되어 내인성 인슐린이 거의 없다. 저혈당 시 정상 방어 기전 첫 단계는 '내인성 인슐린 분비 감소'인데, 1형 당뇨에서는 이 기전 자체가 없어 저혈당 방어가 즉각적으로 작동하지 못한다. ②③④⑤글루카곤·에피네프린·코르티솔·성장호르몬은 counter-regulatory hormones로 1형에서도 분비는 가능하나, 특히 장기 1형에서 glucagon 분비도 저하되는 경향 있으나 이 문제의 '가장 중요한 원인'은 내인성 인슐린 부재.",
"2023-L41-Q163": "정답 ② 1형 당뇨병(Type 1 DM). 58세지만 단기간 체중 10kg 감소, 다뇨, C-펩타이드 <0.1(베타세포 거의 없음), GAD65 Ab 양성 → 자가면역성 베타세포 파괴 → 1형 당뇨병. 성인 발병 1형 당뇨(LADA 아님 — LADA는 서서히 진행하며 초기 인슐린 불필요, GAD Ab 양성이지만 C-펩타이드가 완전 소실은 아님). ①GCK-MODY는 경미한 공복혈당 상승, ③2형은 C-펩타이드 정상·증가, ④췌장염 관련은 병력 필요, ⑤미토콘드리아 당뇨는 모계 유전·난청.",
"2023-L41-Q166": "정답 ⑤ 전형적 고혈당 증상 + 식후 혈당 350 mg/dL(≥200). 당뇨병 진단 기준 중 '전형적 증상(다음, 다뇨, 체중 감소) + 무작위 혈장 포도당 ≥ 200 mg/dL'는 1회 검사만으로 즉시 진단 가능. 나머지는 모두 2회 반복 확인 필요: ①HbA1c 6.5% — 증상 없으면 반복 확인 필요, ②공복혈당 126 mg/dL — 반복 확인 필요, ③식후 1시간 혈당은 진단 기준 아님, ④OGTT 2시간 210 mg/dL ≥200이나 무증상이면 반복 필요.",
"2023-L41-Q174": "정답 ④ 효소에 의해 촉매되어 나타나는 현상이다 — 틀림. 당화혈색소(HbA1c)는 포도당이 헤모글로빈 베타사슬에 비효소적(non-enzymatic) 당화반응(glycation, Maillard 반응)으로 결합하는 것이다. ①HbA1c 가장 널리 사용 — 맞음, ②진단 기준(≥6.5%) — 맞음, ③90일(~2~3개월) 평균 혈당 반영 — 맞음, ⑤포도당과 혈색소의 비가역 결합 — 맞음. 💡 HbA1c = 비효소적 당화반응.",
"2023-L42-Q97": "정답 ⑤ Advanced glycosylation end products(AGE) pathway. 지문에서 Methylglyoxal, Glyoxal, 3-deoxyglucosone은 AGE 전구체(reactive carbonyl species)로, 이들이 단백질에 결합하여 AGE를 형성하고 산화스트레스·염증 유전자 발현을 통해 세포 손상을 초래한다. ①Polyol pathway: 포도당→솔비톨(aldose reductase), ②Hexosamine pathway: 프럭토스-6-인산→UDP-GlcNAc, ③PKC pathway: DAG→PKC 활성화, ④Renin-angiotensin: 혈압 조절 관련.",
"2023-L42-Q154": "정답 ⑤ spot urine microalbumin, spot urine creatinine(알부민/크레아티닌 비), 사구체여과율(GFR). 당뇨콩팥병 스크리닝의 표준: 소변 알부민/크레아티닌비(UACR, 현장 spot 소변 충분) + 혈청 크레아티닌으로 계산한 eGFR. 24시간 소변은 불편하여 스크리닝에 비실용적. 콩팥 생검(kidney biopsy)은 스크리닝 아닌 진단 확인 목적. 💡 스크리닝 = UACR + eGFR(혈청 Cr 기반).",
"2023-L42-Q158": "정답 ② Anti-VEGF. 지문에 합병증 소견 이미지가 제시되었으나 이미지 파일이 직접 첨부되지 않아 임상 맥락으로 추론: 당뇨망막병증 합병증 관련 치료 선택. Anti-VEGF(베바시주맙, 라니비주맙 등)는 당뇨황반부종(diabetic macular edema) 및 증식성 당뇨망막병증에 우선 적용. ①ACE 억제제는 당뇨콩팥병, ③Pregabalin은 당뇨신경병증 통증, ④SGLT2 억제제는 당뇨콩팥병·심부전, ⑤Mineralocorticoid 수용체 길항제(Finerenone)는 당뇨콩팥병.",
"2023-L42-Q179": "정답 ② 오른쪽이 더 불편하다 — 당뇨신경병증에 잘 부합하지 않음. 당뇨병성 원위대칭다발신경병증(DSPN)의 특징은 양측 '대칭성' 분포. 한쪽이 현저히 더 심한 비대칭 증상은 DSPN의 전형적 소견이 아니며, 단일신경병증이나 말초동맥질환 등 다른 원인을 시사한다. ①양발 대칭 — DSPN 전형, ③가만히 있을 때·야간 악화 — DSPN 전형, ④운동 시 호전 — DSPN 전형(PAD는 운동 시 악화), ⑤30년 당뇨 — 충분한 유병 기간.",
"2023-L42-Q185": "정답 ③ DCCT(Diabetes Control and Complications Trial). 지문 특징: 1441명 1형 당뇨, 인슐린펌프·다회주사 vs 하루 1-2회 주사, HbA1c ~7% 유지 집중군에서 망막·신장·심혈관 합병증 유의하게 감소, 조기 혈당 조절 이점 입증 → DCCT. ①VADT: 2형 당뇨 군인 대상, ②UKPDS: 2형 당뇨 신규 진단 대상, ④ACCORD: 2형 당뇨 심혈관 고위험군(집중 혈당 조절 사망률 증가 우려), ⑤ADVANCE: 2형 당뇨 심혈관·신장 연구.",
"2022-L33-Q129": "정답 ③ 케톤 생성(ketogenesis) 증가. 인슐린 결핍 시 지방 분해(lipolysis) 증가 → 간에 fatty acid 공급 증가 → β-oxidation 및 ketogenesis 항진 → 혈중 ketone body 상승. ①lipolysis는 증가(감소 아님), ②말초 포도당 흡수(GLUT4 매개)는 감소, ④포도당 생성(gluconeogenesis)은 증가, ⑤glycogen 합성은 감소(인슐린이 glycogen synthase 활성화하므로 결핍 시 감소).",
"2022-L33-Q139": "정답 ② 지방세포 숫자가 정상인에 비해 크게 증가. 비만에서는 지방세포 수 증가(hyperplasia) 및 크기 증가(hypertrophy)가 모두 나타난다. 특히 지방세포 수 증가는 정상인 대비 현저하다. ①근육세포로의 glucose 유입은 인슐린 저항성으로 감소, ③AMPK 활성은 에너지 결핍 시 증가(비만·인슐린 저항성에서 오히려 저하), ④adiponectin은 감소, ⑤지방조직 내 염증세포(대식세포 등)는 증가.",
"2022-L33-Q215": "정답 ② 저장된 glycogen의 분해가 활발히 일어남 — 가장 가능성 낮음. 일주일 단식 후에는 간 glycogen이 이미 24~48시간 내에 고갈된다. 따라서 7일째에는 glycogen 분해가 더 이상 활발히 일어날 수 없다. ①간은 fatty acid를 주에너지원으로 사용 — 맞음, ③근육 유래 아미노산으로 gluconeogenesis — 맞음, ④fatty acid → ketone body 생합성 — 맞음, ⑤지방세포 glycerol → gluconeogenesis — 맞음.",
"2022-L34-Q128": "정답 ③ 비비만형이 많다. MODY(Maturity Onset Diabetes of the Young)는 췌장 베타세포 단일유전자 변이로 발생하며, 인슐린 저항성이 주 기전인 제2형 당뇨와 달리 비비만형이 대부분이다. ①여러 세대에 걸친 당뇨는 맞으나 '모계 유전'은 미토콘드리아 당뇨에 해당, ②MODY 발병은 25세 이전(청소년·청년)이 특징, ④대사증후군은 제2형 당뇨에 동반되며 MODY에선 드묾, ⑤갑상선염·기능항진은 제1형 당뇨(자가면역)에 동반.",
"2022-L34-Q144": "정답 ④ 가족성 고콜레스테롤혈증(FH). FH는 LDL 수용체 이상으로 고 LDL혈증·조기 심혈관질환을 유발하나, 인슐린 저항성·대사증후군과는 직접 관련 없어 제2형 당뇨 발병 위험 증가와 거리가 멀다. ①공복혈당장애(IFG)·②대사증후군·③다낭성 난소증후군(PCOS)·⑤저출생 체중은 모두 인슐린 저항성 및 T2DM 위험 요소.",
"2022-L34-Q203": "정답 ② 소아청소년기 호발, 70~80대 발병도 가능. 제1형 당뇨병은 소아청소년기에 가장 많이 발병하지만, 실제로 전 연령대에서 발병 가능하며 성인 후기(70~80대)에도 발생한다(LADA 포함). ①동아시아인은 T1DM 발병률이 서구(북유럽)보다 낮음, ③발병과 진단 사이 시간차보다 '베타세포 소실 기간이 수년'이라는 표현이 맞으나 진단 지연 3-5년은 T2DM 얘기에 가까움, ④HLA 연관은 맞으나 T1DM은 T2DM보다 가족력이 낮음(sporadic), ⑤T1DM은 베타세포 파괴로 인슐린 절대 결핍이 원인(인슐린저항성 아님).",
"2022-L34-Q212": "정답 ② 2형 당뇨병. 가계도 분석: 3세대에 걸쳐 다수 발병, 발병 연령 40~60대, 남녀 모두 발병, 상염색체 우성 패턴과 유사하지만 발병 연령이 중년 이후 → 제2형 당뇨병(다유전자 유전, 가족 집적 뚜렷). ①1형: 젊은 나이·HLA 연관, ③LADA: 성인 발병·서서히 진행, ④MODY: 상염색체 우성이나 25세 이전 발병, 비비만형, ⑤미토콘드리아: 모계 유전(어머니→자녀 전부), 난청 동반. 가계도에서 양부모 모두 발병 포함, 발병 연령 40대 이후 → T2DM.",
"2022-L35-Q151": "정답 ④ DCCT/EDIC. 그래프는 혈당 조절 상태(Normal, Poor, Good, P→G, G→P 등)에 따른 망막의 미세동맥류 및 모세혈관 수를 비교하는 실험 결과로 추정된다. 혈당을 poor에서 good으로 전환(P→G) 시 합병증이 감소하는 경향을 보여 '혈당 조절이 합병증에 미치는 영향(metabolic memory·legacy effect)'을 확인한 임상 연구는 DCCT/EDIC. ①ACCORD: 2형 당뇨 심혈관, ②ADVANCE: 2형 당뇨, ③VADT: 군인 대상 2형, ⑤EMPA-REG: 심혈관·신장 결과 연구.",
"2022-L35-Q171": "정답 ③ Glycemic control(혈당 조절). 안저사진: 당뇨황반부종 또는 심한 비증식성/증식성 당뇨망막병증 소견이 보이나, 환자가 혈압 100/50 mmHg(저혈압), 빠른맥(120회/분), 혈당 측정불가(High — 심한 고혈당) 상태. 생명 위협적 고혈당 상태이므로 채혈 후 가장 먼저 해야 할 일은 혈당 조절(인슐린 투여 등). ①Anti-VEGF·④범망막광응고·⑤유리체절제술은 망막 처치로 즉각 생명 위협 해결 안 됨, ②코르티코스테로이드는 혈당을 더 올림.",
"2022-L35-Q176": "정답 ⑤ 10g monofilament test. 발 시림(차갑고 저린)·통증이 가만히 있을 때 심하고 걸으면 오히려 호전 → 당뇨신경병증(DSPN) 패턴. Bedside에서 가능한 간단한 검사는 10g 모노필라멘트 검사(감각신경 손상 확인). ④ABI(발목상완혈압비)는 말초동맥질환 검사인데 보행 시 호전되므로 PAD 가능성 낮음, ③EMG는 bedside 검사 아님, ①Jolly test는 중증근무력증 검사, ②Head-up tilt는 자율신경병증 기립성 저혈압 검사.",
"2022-L35-Q186": "정답 ④ Pregabalin. 환자 특징: 30년 당뇨, 양발 대칭 이상감각·찌르는 통증, 안정·야간 악화, 걷거나 운동 시 완화 → 당뇨병성 원위대칭다발신경병증(DSPN)의 전형적 통증성 신경병증. 1차 치료: Pregabalin(Ca 채널 α2δ 리간드) 또는 duloxetine, tricyclic antidepressants. ③신경전도검사(NCS)는 확인 검사이나 이미 임상 진단 충분하므로 치료가 우선, ①Brain MRI·②④⑤Spine 영상은 척추 원인 감별 시 사용.",
"2021-L54-Q129": "정답 ③ 케톤 생성 증가. (2022-L33-Q129와 동일 문항) 인슐린 결핍 → lipolysis 증가 → 간으로 fatty acid 과잉 공급 → ketogenesis 항진 → 혈중 ketone body 상승. ①lipolysis 증가(감소 아님), ②말초 glucose 흡수 감소, ④포도당 생성(gluconeogenesis) 증가, ⑤glycogen 합성 감소.",
"2021-L54-Q140": "정답 ② 인슐린(insulin). 혈당 저하 시 포도당 항상성 유지를 위해 counter-regulatory hormones(성장호르몬·에피네프린·코르티솔·글루카곤)은 증가하는 반면, 췌장 베타세포에서는 인슐린 분비가 감소한다. 인슐린은 혈당을 낮추는 방향으로 작용하므로 혈당 저하 시 억제되어야 한다. ①글루카곤은 알파세포에서 분비·증가, ③④⑤oxyntomodulin·GLP-1·PYY는 장 유래 호르몬으로 혈당 저하 방어와 직접 관련 없음.",
"2021-L54-Q199": "정답 ③ 간세포에서 ketone body 합성 증가 — 가장 가능성 낮음(오답지). 식후 2시간은 흡수기로 인슐린 분비 증가 → ketogenesis 억제됨. Ketone body 합성은 공복·인슐린 결핍 상태에서 증가한다. ①간의 glycogen 합성 증가 — 맞음(식후 인슐린 작용), ②간의 TG 합성 증가 — 맞음(de novo lipogenesis), ④잉여 아미노산→TG 전환 — 맞음, ⑤pentose phosphate pathway 활성화(NADPH 생성, 지방산 합성에 필요) — 맞음.",
"2021-L54-Q200": "정답 ① 근육세포는 주로 fatty acid를 에너지원으로 사용. 4주 단식에서는 지방 분해(lipolysis)가 최대화되어 혈중 free fatty acid가 높아지고, 근육은 fatty acid·ketone body를 주로 사용한다. ②근육 단백질 분해는 장기 공복에서 감소(초기보다 줄어 protein sparing), ③뇌는 4주 단식에서 ketone body를 주로 사용(glucose 아님), ④간세포는 fatty acid를 에너지원으로 사용(glucose 아님), ⑤lipolysis는 증가(감소 아님). 💡 4주 단식: 근육=FA, 뇌=ketone body.",
"2021-L54-Q204": "정답 ⑤ 혈중 triacylglycerol 양이 증가. 비만·제2형 당뇨에서 인슐린 저항성 → 간의 VLDL 과분비·지방 분해 증가로 혈중 TG 상승(이상지질혈증의 특징). ①지방세포에서 TG 합성은 인슐린 저항성으로 오히려 감소, ②fatty acid 유입 감소(LPL 활성 저하), ③glucose 유입 감소(GLUT4 매개 인슐린 저항성), ④adiponectin 분비는 감소(증가 아님).",
"2021-L55-Q123": "정답 ③ C — 보상적 인슐린 과분비. 그래프(1형 당뇨 자연경과): A=유전적 감수성 시기, B=환경 유발 인자(바이러스 등) + 자가항체 출현, C=임상 증상 발현 전 베타세포 소실 진행(자가항체 양성, 서서히 감소), D=임상 발현(Clinical onset), E=C-펩타이드 소실 완성. C 단계는 베타세포가 소실 중인 시기이므로 '보상적 과분비'가 아니라 베타세포 기능 저하가 나타나는 시기. A=HLA DR3/DR4 — 맞음, B=바이러스 — 맞음, D=GAD 항체 양성(이미 B 이후부터) — 맞음(단 B가 더 적절하나 D도 가능), E=HbA1c 10% — 맞음(임상 발현 후).",
"2021-L55-Q124": "정답 ② B 지점. 그래프: x축=인슐린 감수성(높을수록 오른쪽), y축=인슐린 분비능. 초록 곡선=정상 보상 곡선. 5년 전 A지점(정상 범위, 인슐린 감수성 높고 분비능 적당). 이 남자는 5년간 체중 10kg 증가(인슐린 저항성 증가), 현재 공복혈당 98(정상)·OGTT 2시간 130(정상이나 증가 경향) → 당뇨 전단계(내당능 정상~경계). 인슐린 감수성 감소 + 보상적 인슐린 분비 증가(정상 곡선 위로 상승)한 B 지점에 해당. C는 더 심한 저항성+분비 보상, D·E는 베타세포 고갈.",
"2021-L56-Q125": "정답 ① 대사증후군이 잘 동반한다 — MODY에 적절하지 않음. MODY(Maturity Onset Diabetes of the Young)는 단일유전자(베타세포 기능 관련) 변이로 발생하며 인슐린 저항성이 기전이 아니므로 대사증후군을 잘 동반하지 않는다(비비만형). ②25세 이전 발병·1형 오진 — 맞음, ③여러 세대 당뇨 — 맞음(상염색체 우성), ④베타세포 기능장애가 주 병인 — 맞음, ⑤단일유전자 이상 — 맞음.",
"2021-L56-Q126": "정답 ⑤ 고혈당의 정도와 노출기간은 미세혈관 합병증 발생에 비례하지 않는다 — 틀림. 실제로는 고혈당의 심각도와 지속기간이 미세혈관 합병증 발생에 정비례한다(DCCT 연구 등으로 입증). ①미세혈관 합병증은 당뇨병에 특이적 — 맞음, ②당뇨망막병증 = 성인 실명 가장 흔한 원인 — 맞음, ③당뇨콩팥병 = 신대체요법(투석) 가장 흔한 원인 — 맞음, ④HbA1c 1% 감소 → 미세혈관 합병증 37% 감소(UKPDS) — 맞음.",
"2021-L56-Q127": "정답 ② 고혈당 외에도 인슐린 저항성이 대혈관 합병증 병태생리에 중요. 당뇨 대혈관 합병증(죽상동맥경화)은 고혈당뿐 아니라 인슐린 저항성, 이상지질혈증, 고혈압 등 복합 요인이 관여한다. ①대혈관 합병증은 당뇨 특이적 아님(일반 심혈관질환과 공유), ③당뇨에서 관상동맥질환은 다혈관 침범이 특징, ④당뇨에서는 LDL보다 TG 증가·HDL 감소 패턴이 특징적, ⑤증상 없는 정기 심혈관 검사 — 실제로는 증상·위험도 평가에 따라 결정(routine asymptomatic screening 권고 아님).",
"2021-L56-Q128": "정답 ⑤ 소변 알부민/크레아티닌 비(UACR) + 사구체여과율(eGFR). (2023-L42-Q154와 동일 핵심) 당뇨콩팥병 스크리닝 표준: UACR(spot 소변 microalbumin/creatinine) + eGFR(혈청 creatinine 기반). 콩팥초음파는 구조 평가, 콩팥생검은 스크리닝이 아닌 확인 진단. 💡 DKD 스크리닝 = UACR + eGFR, 매년 시행.",
"2025-L43-Q74": "【정답: ②생리식염수 정주】 과호흡·과일향 호흡 없음, 혈압 저하(100/50)+빈맥(120)+초고혈당(측정불가)은 고삼투성 고혈당 상태(HHS)에 합당하며, HHS의 핵심 병태는 심각한 탈수이므로 즉각 생리식염수로 수액 소생이 최우선이다. ①인슐린 정주는 수액으로 혈역학을 안정시킨 후 시작하며, 수액 없이 인슐린만 투여하면 혈장량이 더 감소해 쇼크를 악화시킬 수 있다. ③칼륨은 초기 고칼륨혈증일 수 있어 검사 확인 전 투여 금지. ④brain MRI는 HHS에 의한 신경증상 가능성이 높으므로 혈역학 안정 후 고려. ⑤포도당 용액은 이미 초고혈당인 환자에 절대 금기.",
"2025-L43-Q85": "【정답: ④인슐린/글루카곤 비율 감소】 DKA의 핵심 발병기전은 인슐린 절대/상대 부족과 글루카곤 상대 과잉으로, 인슐린:글루카곤 비율이 감소하면 지방분해 항진→유리지방산 증가→케토제네시스 증가→케톤산증이 유발된다. ①소변 오스몰은 오히려 증가. ②발열은 촉발 요인일 수 있으나 발병기전 자체가 아님. ③구토·복통은 DKA의 증상(결과)이지 발병기전이 아님. ⑤저혈당은 DKA와 반대로 고혈당이 특징.",
"2025-L43-Q97": "【정답: ③케톤 생성 증가】 인슐린 결핍 시 지방조직의 lipolysis 억제 해제로 유리지방산(FFA)이 간으로 대거 유입되고, 글루카곤 상승이 CPT-1 활성화를 촉진하여 미토콘드리아 내 β-산화·케토제네시스가 항진된다. ①혈중 아미노산은 단백 이화 증가로 오히려 증가. ②혈중 포도당은 당신생 증가·말초 이용 감소로 증가. ④케톤 제거는 감소(말초 이용 저하). ⑤단백 합성은 감소(이화 우세).",
"2025-L44-Q5": "【정답: ③Pioglitazone】 나머지 4가지(Liraglutide=GLP-1 RA, Nateglinide=Meglitinide계 인슐린 분비 촉진제, Glimepiride=SU계, Sitagliptin=DPP-4 억제제)는 모두 인슐린 분비를 직접 또는 간접으로 촉진하는 인크레틴/분비 촉진 계열이지만, Pioglitazone은 PPAR-γ 핵수용체 작용제로 인슐린 감수성을 개선하는 인슐린 감작제(sensitizer)이다. 기전이 췌장 β세포 자극이 아닌 핵 전사인자 활성이라는 점에서 근본적으로 다르다.",
"2025-L44-Q14": "【정답: ③SGLT2 억제제는 CKD-EPI stage 4 환자에서 사용될 수 있다】 최신 가이드라인에서 SGLT2 억제제(특히 empagliflozin, dapagliflozin)는 eGFR ≥20(stage 4 하한)까지 심신 보호 목적으로 사용 가능하다; 혈당 강하 효과는 감소해도 심부전·신장 보호 이득은 유지된다. ①Meglitinide(repaglinide 등)는 SU와 동일 경로(KATP channel)를 통해 인슐린 분비를 촉진하므로 저혈당 위험이 있음. ②Metformin과 DPP-4 억제제 모두 체중 중립적이어서 차이 없음. ④Long-acting 인슐린(Glargine, Degludec)은 정맥투여 불가—응급 시 Regular/속효형만 정맥 사용. ⑤Teplizumab은 제1형 당뇨병 발병을 지연(예방)하는 약이지 발병 후 치료제가 아님.",
"2025-L44-Q17": "【정답: ④혈당뿐만 아니라 혈압 및 지질 수치를 통합적으로 관리】 당뇨병 관리의 현대적 패러다임은 혈당 단독 관리가 아닌 심혈관 위험 인자(혈압·지질·체중 등) 통합 관리로, 이것이 대혈관·미세혈관 합병증 예방에 가장 근거가 탄탄하다. ①생활습관 개선이 약물보다 먼저이며, 동시에 시작도 권장. ②교육은 진단 초기부터 시작하는 것이 가장 효과적. ③저혈당이 동반되면 사망·심혈관 위험 증가—저혈당 없는 범위에서 조절해야 함. ⑤기대여명이 짧은 고령·말기 환자는 엄격한 혈당 조절의 이득이 없거나 오히려 해롭다.",
"2025-L44-Q34": "【정답: ④Empagliflozin】 Glipizide(SU), Glargine(인슐린), Repaglinide(Meglitinide), Lobeglitazone(TZD)은 모두 체중 증가 또는 중립 약물이나, Empagliflozin(SGLT2 억제제)는 소변으로 당 배출을 통해 체중 감소 효과를 나타내어 나머지와 반대 방향을 가진다. 💡 SGLT2 억제제와 GLP-1 RA는 당뇨병 약제 중 체중 감소 효과가 있는 대표적 계열.",
"2025-L44-Q91": "【정답: ⑤SGLT2 억제제】 심부전이 동반된 당뇨병 환자에서 SGLT2 억제제(empagliflozin, dapagliflozin)는 심부전 입원 감소·신장 보호·혈당 조절·체중 감소를 동시에 제공하며, eGFR 정상(Cr 1.1, 추정 eGFR ~60대)이므로 사용 가능하다. ①인슐린: 심부전엔 금기가 없으나 체중 증가·저혈당 위험. ②SU: 저혈당 위험, 체중 증가, 심혈관 이득 없음. ③TZD(싸이아졸리딘다이온): 심부전 환자에 금기(수분 저류 악화). ④DPP-4 억제제: saxagliptin은 심부전 입원 증가 보고 있어 심부전 동반 시 주의; 체중 중립.",
"2023-L43-Q157": "【정답: ①혈중 유리지방산 증가】 인슐린 결핍 시 지방조직의 hormone-sensitive lipase 억제가 해제되어 중성지방 → 유리지방산(FFA) + 글리세롤로 분해가 증가하고, 혈중 FFA가 증가한다. ②혈중 아미노산: 단백 이화 증가로 오히려 증가. ③케톤 생성: 증가(FFA의 간 β-산화↑). ④혈중 포도당: 당신생↑·말초 이용↓로 증가. ⑤단백 합성: 감소(이화 우세).",
"2023-L43-Q170": "【정답: ②생리식염수 정주】 2025-L43-Q74와 동일 임상 증례(HHS). 초고혈당+탈수+혈역학 불안정(저혈압+빈맥)이므로 채혈 직후 즉각 생리식염수 수액 소생이 최우선. 인슐린 투여 전 반드시 수액으로 혈장 용적부터 회복해야 한다.",
"2023-L43-Q175": "【정답: ①저혈압】 DKA에서 인슐린 결핍 → 고혈당 → 삼투압 이뇨 → 심한 탈수 → 저혈압(수축기혈압 감소)이 나타난다. ②서맥이 아닌 빈맥이 특징(탈수에 대한 보상). ③저체온이 아닌 정상체온 또는 촉발 감염에 의한 발열. ④호흡수 감소가 아닌 Kussmaul 호흡(보상성 과호흡). ⑤저혈당이 아닌 고혈당.",
"2023-L43-Q176": "【정답: ⑤즉시 만니톨 정주】 DKA 치료 중 갑작스러운 두통·시야 장애는 뇌부종(cerebral edema)을 강력히 시사하며, 소아 DKA에서 수액·인슐린 투여 중 발생하는 가장 위험한 합병증이다. 뇌부종이 의심되면 영상 확인을 기다리지 말고 즉각 만니톨(0.5–1 g/kg IV) 또는 3% NaCl을 투여해야 한다—지연이 뇌허혈·사망으로 이어짐. ①항생제: 뇌수막염 감별도 필요하나 즉시 해야 할 일은 뇌압 감소. ②중탄산염 주입: DKA에서 pH 6.9 미만 외 금기(오히려 뇌부종 악화 가능). ③인슐린 감량: 뇌부종 처치 후 고려. ④영상 확인 후 수액 조절: 영상 기다리는 동안 뇌 손상이 진행되므로 임상 진단 즉시 치료가 원칙. 💡 소아 DKA 뇌부종: 만니톨 즉시 투여 = 생사를 가르는 결정.",
"2023-L44-Q111": "【정답: ③생활습관 개선은 한계가 있으므로 초기부터 약제를 바로 사용하는 것이 좋다(→ 틀린 것)】 당뇨병 관리에서 생활습관 개선(식이·운동·체중 감소)은 기본이며 초기부터 적극 권고한다; 약제와 병행하거나, 경미한 경우 생활습관만으로 먼저 시도할 수 있다. ①통합적·개인 맞춤 관리: 옳음. ②과체중 시 체중 감소 이득: 옳음. ④혈압·지질 통합 관리: 옳음. ⑤저혈당 없는 범위에서 혈당 안정: 옳음.",
"2023-L44-Q113": "【정답: ④SGLT2 억제제】 72세 당뇨병+관상동맥질환(CABG 과거력)+NT-proBNP 상승(심부전 가능성)+단백뇨+eGFR 48. SGLT2 억제제는 기존 심혈관질환(ASCVD) 및 심부전 동반 당뇨병에서 심혈관 사망·심부전 입원 감소, 신장 보호 효과가 RCT로 입증되었고 eGFR 48에서 사용 가능하다. ①CCB: 혈압 조절제로 당뇨병 심혈관 이득 약제가 아님. ②ezetimibe: statin+ezetimibe 조합 가능하나, LDL 이미 낮아(Total cholesterol 103) 추가 이득 제한적. ③GLP-1 RA: ASCVD 이득 있으나, 심부전+단백뇨 조합에서는 SGLT2가 더 우선. ⑤TZD(Thiazolidinedione): 심부전·수분 저류 악화 → 금기.",
"2023-L44-Q114": "【정답: ⑤SGLT2 억제제—혈당 강하+체중 감소】 SGLT2 억제제는 신장 근위세뇨관에서 포도당 재흡수를 차단하여 소변으로 당을 배출, 혈당 강하와 체중 감소를 동시에 제공한다. ①SU: ATP-K channel 차단으로 인슐린 분비 촉진—혈당 강하 효과 좋으나 저혈당 위험 있음(낮다는 것이 틀림). ②Metformin: 저혈당 드물고 혈당 강하 효과 좋음(적다는 것이 틀림). ③TZD: 체중 감소가 아닌 체중 증가. ④GLP-1 유사체: 식후 인슐린 분비 촉진·위 배출 지연 기전이며, '장에서 당분해 지연'은 alpha-glucosidase 억제제 설명.",
"2023-L44-Q121": "【정답: ⑤Metformin은 신장에서 유기양이온 수송체(OCT)에 의해 배출된다】 Metformin은 신장 근위세뇨관의 OCT2(Organic Cation Transporter 2)를 통해 분비된다; 양이온이 맞고 음이온(OAT)이 아니다. ①Teplizumab은 제1형 당뇨병 발병 지연(고위험군 예방)이며, 제2형이 아님. ②SU와 Meglitinide는 작용기전 동일(KATP channel 폐쇄)하고 결합부위만 다름. ③SGLT2 억제제는 신기능 저하 시 혈당 강하 효과 감소(소변 당 배출 감소). ④Long-acting 인슐린은 정맥투여 불가(pH·등장성 다름—결정화·색전 위험).",
"2023-L44-Q138": "【정답: ⑤췌장 기능 유지+인슐린 저항성 심한 경우 인슐린 우선(→ 틀린 것)】 인슐린 저항성이 주된 문제이고 베타세포 기능이 유지되는 경우에는 인슐린 감작제(Metformin, TZD) 등 경구제가 적절하며, 인슐린을 우선 사용할 필요는 없다. 인슐린 치료 적응증: ①임신성 당뇨병+고혈당 ②HbA1c ≥9%의 극심한 고혈당 증상 ③DKA 등 급성 대사성 합병증 ④신·간 기능 이상으로 경구제 불가. ⑤번이 적응증이 아닌 경우.",
"2023-L44-Q143": "【정답: ④Empagliflozin】 2025-L44-Q34와 동일 개념. Glipizide(SU, 체중증가), Repaglinide(Meglitinide, 체중증가), Glibenclamide(SU, 체중증가), Lobeglitazone(TZD, 체중증가)은 체중 증가군이고, Empagliflozin(SGLT2 억제제)만 체중 감소를 유발한다.",
"2023-L44-Q173": "【정답: ②Pioglitazone】 2025-L44-Q5 동일 개념. Liraglutide(GLP-1 RA), Repaglinide(Meglitinide), Glimepiride(SU), Sitagliptin(DPP-4i)는 모두 인슐린 분비 촉진 또는 인크레틴 기전이나, Pioglitazone은 PPAR-γ 활성화를 통한 인슐린 감작제로 기전이 근본적으로 다르다.",
"2022-L36-Q137": "【정답: ②생리식염수 정주】 2025-L43-Q74/2023-L43-Q170과 동일 증례 반복 출제. HHS 환자에서 혈역학 불안정(저혈압+빈맥) 해소를 위해 수액 소생이 인슐린보다 반드시 선행되어야 한다. 케톤산증 징후(과호흡, 과일향) 없으므로 HHS 진단이 우선.",
"2022-L36-Q162": "【정답: ③동맥혈 pH 감소】 DKA의 정의 자체가 케톤산증이므로 동맥혈 pH는 감소(산증)한다. ①혈중 인: 초기엔 정상~증가(인슐린 결핍으로 세포 내 인 방출), 치료 후 저하. ②혈중 칼륨: 초기 정상~증가(산혈증으로 세포 외 이동), 인슐린 치료 후 급격히 감소. ④백혈구: 스트레스 반응·감염 동반으로 증가(감소 아님). ⑤lipase: 동반 췌장염 시 증가 가능.",
"2022-L36-Q173": "【정답: ③생리식염수 정주】 수축기 혈압 106, 맥박 110, 혈당 550, ABGA pH 7.42(정상). Kussmaul 호흡이나 과일향 언급 없고 pH 정상이므로 DKA보다 HHS 또는 심한 고혈당+탈수에 가깝다. 혈역학 불안정+탈수가 우선 문제이므로 생리식염수 정주가 첫 조치. ②포도당 용액: 고혈당에 절대 금기. ④인슐린 피하주사: 응급 상황에서 정맥 투여가 원칙이며 수액 후 시작. ①칼슘+칼륨: 초기 검사 확인 전 임의 투여 금지. ⑤글루카곤: 저혈당 치료제.",
"2022-L37-Q154": "【정답: ①Metformin】 Liraglutide(GLP-1 RA), Repaglinide(Meglitinide), Glimepiride(SU), Gemigliptin(DPP-4i)는 모두 인슐린 분비 촉진 계열이나, Metformin은 AMPK 활성화를 통한 간의 당신생 억제 및 말초 인슐린 감수성 개선을 하는 인슐린 감작제로, 기전이 근본적으로 다르다.",
"2022-L37-Q164": "【정답: ①설폰요소제—혈당 강하 좋고 저혈당 위험 있음】 SU는 ATP-K channel을 닫아 인슐린 분비를 촉진하므로 혈당 강하 효과가 좋고, 혈당과 무관하게 분비를 촉진하기 때문에 저혈당 위험이 있다(선택지는 저혈당 위험이 있다는 내용이 정확히 기술됨). ②Metformin: 혈당 강하 효과 좋음(적다는 것이 틀림). ③alpha-glucosidase 억제제: 탄수화물 분해 지연—탄수화물 섭취 많은 동양인에게 유리(지방 섭취 많은 서양인이 틀림). ④TZD: 골절 위험 증가, 골다공증 악화(도움이 아님). ⑤SGLT2 억제제: 체중 감소 효과 있음(도움 안 된다가 틀림).",
"2022-L37-Q165": "【정답: ④Pioglitazone】 TZD(Thiazolidinedione)는 지방세포 분화 촉진·지방조직 재배분을 통해 인슐린 감수성을 개선하나, 동시에 체중 증가(수분 저류+지방 증가)를 유발한다. Acarbose(체중 중립), Exenatide(체중 감소), Metformin(체중 중립), Empagliflozin(체중 감소)은 체중 증가가 없거나 감소 효과를 가진다.",
"2022-L38-Q167": "【정답: ③저혈당이 오더라도 혈당을 최대한 낮추는 것이 어느 시점에서나 도움이 된다(→ 틀린 것)】 저혈당은 심혈관 사건, 사망 위험을 증가시키므로 저혈당이 오는 수준까지의 혈당 강하는 위험하다. 특히 고령·심혈관질환 동반 환자에서는 엄격한 혈당 조절의 이득보다 저혈당 위험이 더 크다. ①생활습관 개선이 기본: 옳음. ②과체중 시 체중 감소 이득: 옳음. ④통합 관리: 옳음. ⑤교육 선행: 옳음.",
"2022-L38-Q205": "【정답: ①제1형 당뇨병에 insulin 이외 약물 없다 + ③SGLT2 억제제는 신기능 저하 환자에서 혈당배출 작용 감소】 ①Teplizumab이 2022년 FDA 승인을 받아 제1형 당뇨병 고위험군에서 발병을 지연시키는 약물로 등장했으나, 출제 시점(2022년 초)에 따라 'insulin 이외 없다'는 내용이 정답으로 채택되었을 수 있음(복수 정답이므로 맥락 반영). ③SGLT2 억제제의 당 배출은 사구체 여과량에 비례하므로 eGFR 감소 시 혈당 강하 효과가 감소한다(신장 보호 효과는 별개로 유지). 오답 이유: ②SU와 Meglitinide는 동일 KATP channel 기전. ④Long-acting 인슐린 정맥투여 불가. ⑤Metformin은 OCT2(양이온 수송체)로 배출—음이온(OAT)이 아님.",
"2022-L38-Q217": "【정답: ③인슐린 저항성이 심한 경우 인슐린 우선(→ 적응증 아님)】 인슐린 저항성이 주된 병태이고 베타세포 기능이 보존된 경우에는 경구 감작제(Metformin, TZD)가 우선이며, 인슐린을 선제적으로 사용할 적응증이 아니다. 인슐린 적응증: ①DKA 등 급성 합병증 ②경구제 1차·2차 실패 ④심한 고혈당 증상 ⑤신·간 기능 이상으로 경구제 불가.",
"2021-L57-Q130": "【정답: ③동맥혈 pH 감소】 2022-L36-Q162와 동일. DKA 초기 소견은 케톤산 축적으로 인한 대사성 산증(pH 감소)이 핵심이다. ①혈중 인은 초기 정상~증가. ②혈중 칼륨은 초기 정상~증가(산혈증·인슐린 결핍으로 세포 외 이동). ④백혈구는 스트레스/감염으로 증가. ⑤lipase는 동반 췌장염 시 증가.",
"2021-L57-Q131": "【정답: ②생리식염수 정주】 반복 출제 동일 증례. HHS의 핵심 치료는 수액 소생이며, 혈역학 불안정 상태에서 채혈 직후 즉시 생리식염수를 투여한다.",
"2021-L58-Q133": "【정답: ①pioglitazone】 repaglinide(Meglitinide), glimepride(SU), gemigliptin(DPP-4i), liraglutide(GLP-1 RA)는 모두 인슐린 분비 촉진 또는 인크레틴 계열이나, pioglitazone은 PPAR-γ 활성화를 통한 인슐린 감작제로 기전이 전혀 다르다.",
"2021-L58-Q134": "【정답: ⑤empaglifozin(SGLT2 억제제)】 acarbose(α-glucosidase 억제제)는 복부팽만·설사, exenatide/liraglutide(GLP-1 RA)는 오심·구토, metformin은 소화장애가 주요 부작용이다. SGLT2 억제제는 소변 당 배출 기전이므로 소화기 부작용이 상대적으로 드물다. 💡 SGLT2 억제제 특이 부작용: 요로·성기 감염, 당뇨병성 케톤산증.",
"2021-L59-Q132": "【정답: ③Lispro–Glargine】 식전 속효형(식사 후 혈당 조절) + 자기 전 기저 인슐린(야간·기저 혈당 조절) 레짐이 필요하다. Lispro는 속효성(rapid-acting) 인슐린 유사체—식전 투여에 적합. Glargine은 지속형(long-acting) 인슐린 유사체—1일 1회 투여로 기저 혈당 유지. ①aspirin은 인슐린이 아님. ②gluisine–Lispro: 둘 다 속효형이어서 기저 커버 없음. ④determir–gluisine: 기저와 속효형의 순서가 역전. ⑤Degludec–Regular: Regular는 식전에, Degludec은 기저로 순서가 역전되어 있음.",
"2021-L59-Q198": "【정답: ③SGLT2 억제제(Sodium glucose co-transporter inhibitor)】 심부전+당뇨병+만성신장질환(eGFR 59+단백뇨)+망막병증이 동반된 경우, SGLT2 억제제는 심부전 입원 감소·신장 보호·혈당 조절을 동시에 제공하며 eGFR 59에서 사용 가능하다. ①DPP-4i: 심혈관·신장 이득 제한적; saxagliptin은 심부전 입원 증가 경향. ②인슐린: 저혈당·체중 증가 위험. ④SU: 심혈관 이득 없음, 저혈당 위험. ⑤TZD: 심부전 금기(수분 저류).",
"2021-L59-Q201": "【정답: ③증식성 망막병증이 있는 당뇨병 환자】 증식성 망막병증(proliferative diabetic retinopathy)은 망막 신생혈관이 취약하여 고강도 저항성 운동 시 안압 상승·복압 증가로 유리체 출혈이나 망막 박리를 유발할 수 있다. 따라서 레이저 치료 완료 전 고강도 운동을 피해야 한다. ①운동 안 하던 환자: 점진적 시작 권고이지 금기 아님. ②근육량 적은 환자: 저항 운동 오히려 권장. ④인슐린 사용 환자: 운동 전후 혈당 모니터링 필요하나 금기 아님. ⑤경한 심부전: 중강도 유산소 운동 권장, 저항 운동도 경증에선 가능.",
"2021-L59-Q203": "【정답: ③154 mg/dL】 HbA1c와 평균 혈당 환산: eAG(mg/dL) = 28.7 × HbA1c(%) − 46.7. HbA1c 7%: 28.7 × 7 − 46.7 = 200.9 − 46.7 = 154.2 mg/dL. 또는 약식으로 HbA1c 7% ≈ 평균 혈당 154 mg/dL(공인 환산표). 💡 암기: HbA1c 6%→126, 7%→154, 8%→183, 9%→212 mg/dL(약 28~29씩 증가).",
"2023-L44-Q115": "【정답: ①설폰요소제—ATP-K channel 차단, 인슐린 분비↑, 혈당 강하 효과 좋음 + ④GLP-1 유사체—탄수화물 섭취 많은 동양인 혈당 조절에 도움】 ①SU는 ATP-K channel에 결합해 인슐린 분비를 촉진, 혈당 강하 효과 좋고 저혈당 위험도 있음(선택지는 '효과 좋고 위험성도 낮다'가 아니라 '효과 좋고 저혈당 위험성 있다'는 뜻으로 해석 시 정답—원문 그대로 읽으면 '위험성도 낮다'는 오류이나 복수정답 AK 기준 1번 포함). ④GLP-1 RA는 혈당 의존적 인슐린 분비 촉진+위 배출 지연으로 식후 혈당 조절에 강점—탄수화물 비중 높은 동양인 식이에 유리. 오답 이유: ②Metformin 혈당 강하 효과 적다—틀림(효과 좋음). ③TZD 체중 감소—틀림(체중 증가). ④(맥락상 alpha-glucosidase가 '장에서 당분해 지연'이고 GLP-1 RA는 위 배출 지연이 더 정확하나, AK 정답에 포함). ⑤SGLT2 억제제 체중 감소+혈당 강하—맞지만 AK 불포함. 💡 복수정답 문항: AK 공식 정답 1, 4.",
"2025-L45-Q36": "【정답 4】임신 중 고혈당으로 인한 선천성 기형은 심혈관계·신경계·골격계에 다발성·중증으로 발생하며 치명적일 수 있다. ①유산 위험도 증가하므로 오답. ②태아 고인슐린혈증은 거대아를 유발하므로 성장 '장애'가 아님. ③임신성 당뇨병 산모의 자녀는 향후 비만뿐 아니라 2형 당뇨병 위험도 증가. ⑤거대아·태반 이상 등으로 조기분만 위험이 있어 40주 대기 원칙은 잘못됨.",
"2025-L45-Q56": "【정답 2】근감소증(sarcopenia) 진단 시 근육량 측정의 표준 방법은 DXA(Dual-energy X-ray Absorptiometry)다. CT/MRI도 근육량 측정에 사용 가능하나 일상 임상 권고 검사는 DXA. ①계단 오르기 검사는 근기능(근력·수행능력) 평가. ④갑상선기능검사는 근감소증 감별에 포함될 수 있으나 근육량 측정 도구가 아님. 💡 EWGSOP2 기준: 근육량(DXA/BIA) + 근력(악력) + 신체 수행능력 3요소.",
"2025-L45-Q73": "【정답 2】임신성 당뇨병 진단에 100g OGTT를 사용할 때 Carpenter-Coustan 기준: 공복 95 mg/dL, 1시간 180 mg/dL, 2시간 155 mg/dL, 3시간 140 mg/dL — 2항목 이상 충족 시 진단. ①임신 후반기에는 인슐린 저항성이 약 3배 증가(민감성 감소). ③임신 중 1차 치료는 인슐린이며 경구혈당강하제는 원칙적으로 2차. ④출산 후 혈당은 대부분 정상화됨. ⑤산모 혈당(포도당)은 태반을 통과하지만 인슐린은 통과 못 함 → 태아가 자체적으로 고인슐린혈증을 일으켜 거대아 발생.",
"2023-L46-Q96": "【정답 5】노인증후군은 복합 원인에 의해 발생하고 단일 장기 질환으로 구분되지 않는다. 치료 원칙은 '원인에 맞는 치료만' 이 아니라 기능 회복·삶의 질 향상을 위한 포괄적 접근(Comprehensive Geriatric Assessment)이 핵심이므로 ⑤가 틀림. 💡 노인증후군에는 인지장애, 다약제, 우울증, 요실금, 낙상, 통증 등이 포함되며, 진단적 검사를 최대한 시행하는 단순 원인-치료 접근은 적절하지 않다.",
"2023-L46-Q148": "【정답 5】임신성 당뇨병은 산모의 향후 2형 당뇨병 위험을 증가시킨다(생애 내 약 50% 발생). 따라서 '감소'라는 ⑤가 틀림. 나머지 ①~④는 실제 임신성 당뇨병 합병증: 거대아(LGA), 제왕절개 증가, 신생아 저혈당, 자녀 비만 위험 증가 — 모두 맞음.",
"2023-L46-Q167": "【정답 5】임신 후반기에는 hPL(human placental lactogen), 코르티솔, 프로게스테론 등의 작용으로 인슐린 저항성이 임신 전 대비 약 3배 증가한다. ①지방 분해는 증가(lipolysis ↑). ②인슐린 분비능은 보상적으로 증가. ③공복혈당보다 식후혈당 상승이 더 특징적. ④hPL은 임신 후반기로 갈수록 증가.",
"2022-L40-Q130": "【정답 4】신생아 당뇨병(neonatal diabetes)은 임신성 당뇨병의 주산기 합병증이 아니다. 신생아 당뇨병은 KCNJ11, ABCC8 등 유전자 변이에 의한 독립적 질환. 임신성 당뇨병의 실제 주산기 합병증: 거대아(①), 제왕절개(②), 분만 손상(③, 견갑난산 등), 신생아 호흡곤란증(⑤, 태아 폐 성숙 지연). 신생아 저혈당도 흔한 합병증.",
"2022-L40-Q159": "【정답 5】노인에서는 골밀도가 정상이더라도 근감소증·균형 장애·보행 이상 등으로 낙상 위험이 높아 골절 위험이 증가한다. ①우울증 선별 검사는 권장됨. ②다약제(polypharmacy) 5개 이상은 위험 신호로 최소화가 원칙(6개 이상 복합 권장 × ). ③혈당 목표는 환자 상태(인지기능, 기대여명 등)에 따라 개별화 — 전원 6.5% 미만 X. ④인지장애 선별은 중증이 아닌 초기부터 정기 시행 권장.",
"2022-L40-Q172": "【정답 1】임신성 당뇨병에서 생활습관 조절 후에도 공복혈당 ≥105 mg/dL 또는 식후 2시간 혈당 ≥120 mg/dL(기관에 따라 약간 다름)이 지속되면 인슐린을 추가한다. 임신 중 경구혈당강하제(메트포르민, 설폰요소제 등)는 태반 통과·태아 안전성 문제로 권고 안 함(②③). GLP-1 유사체·SGLT2 억제제(④⑤)는 임신 중 금기.",
"2021-L61-Q135": "【정답 5】IADPSG(International Association of Diabetes and Pregnancy Study Groups) 기준은 HAPO 연구를 기반으로 임신 성적(주산기 합병증)에 직접 근거하여 설정된 임신성 당뇨병 진단기준이다. 나머지 기준(WHO, NDDG, O'Sullivan, Carpenter-Coustan)은 산모의 향후 당뇨병 발생 위험을 중심으로 설정된 것이 주요 차이점. 💡 IADPSG: 75g OGTT — 공복 92, 1시간 180, 2시간 153 mg/dL (1개 이상 충족).",
"2021-L61-Q136": "【정답 3】이미지의 혈당 측정치: 공복 92 mg/dL, 아침 식후 2시간 142 mg/dL, 점심 식후 2시간 132 mg/dL. 임신성 당뇨병 혈당 목표: 공복 <95, 식후 1시간 <140, 식후 2시간 <120 mg/dL. 식후 2시간 혈당이 목표(120) 초과 — 식사·운동으로 조절 실패 → 인슐린 추가 적응증. ②칼로리 감량은 임신 중 적절한 영양 공급을 위해 과도한 제한은 부적절. ④경구혈당강하제는 임신 중 원칙적으로 비권고.",
"2021-L61-Q137": "【정답 1】임신 전에 이미 당뇨병이 있었던 환자(pregestational diabetes)로, 임신 14주 + 공복혈당 146 mg/dL + HbA1c 6.9% = 기존 당뇨병이 임신 중 확인된 것. 임신 중 기존 당뇨병에는 인슐린 요법 + 당뇨병 교육이 즉시 필요. ②③경구당부하검사는 이미 당뇨병이 확인된 상태에서 불필요. 임신성 당뇨병 선별 검사(50g)는 통상 24~28주에 시행하나 이미 당뇨병 진단 상태.",
"2021-L62-Q138": "【정답 4】노인에서 당뇨병 발생 위험을 증가시키는 가장 중요한 생리적 원인은 근육량 감소(sarcopenia)다. 근육은 주요 포도당 처리 기관으로, 근육량이 줄면 인슐린 저항성이 증가하여 2형 당뇨병 위험이 높아진다. ①식습관 변화·③운동 부족도 관련 있으나 노인 특이적 주요 원인으로는 근감소증이 핵심. ②자가면역은 1형 당뇨병 기전. ⑤TSH 증가(갑상선기능저하)는 대사를 낮추나 주된 원인이 아님.",
"2021-L62-Q139": "【정답 3】당뇨병 관리 지침에서 노인에 대해 초기 및 매년 정기 평가가 가장 강조되는 노인증후군은 인지기능장애(cognitive impairment)다. 저혈당 인식 불능, 자가관리 능력 저하 등 당뇨병 관리에 직접 영향을 미치기 때문. 다약제, 우울증, 낙상도 평가 대상이나 우선순위로는 인지기능장애가 핵심. ⑤만성콩팥병은 노인증후군이 아닌 당뇨병 합병증으로 분류됨.",
"2025-L46-Q37": "【정답 1】1형 당뇨병 환자에서 저혈당 발생 시 첫 번째 방어 기전은 '내인성 인슐린 분비 억제'인데, 1형 당뇨병은 베타세포 자가면역 파괴로 내인성 인슐린이 없어 이 기전이 작동하지 않는다. 이것이 저혈당에 가장 취약한 근본 원인. ②글루카곤 증가는 저혈당 초기 2차 방어지만 1형 당뇨에서도 장기 이환 시 손상됨. ③에피네프린은 그다음 방어선으로, 저혈당 무감각증(hypoglycemia unawareness) 발생 시 이 기전도 저하됨. 의식소실 자체는 포도당 30 mg/dL의 뇌 글루코스 결핍 결과.",
"2025-L46-Q68": "【정답 4】Whipple's triad(휘플 삼박자) 중 '포도당 투여 혹은 음식 섭취 후 혈당 상승 및 증상 호전'이 저혈당 진단의 필요조건이다. 이미 혈당 42/50 mg/dL + 저혈당 증상이 확인되었으므로, Whipple triad를 완성하기 위한 마지막 요건이 ④. ①HbA1c는 만성 혈당 지표로 저혈당 원인 진단에 쓰이지 않음. ②72시간 공복 검사는 원인 불명 저혈당 감별에 사용. ③Mixed meal test는 식후 저혈당(반응성) 감별. ⑤C-peptide/insulin은 원인 규명에 필요하나 진단의 '필요조건'은 아님.",
"2025-L46-Q92": "【정답 1】혈당 35 mg/dL + 인슐린 15.2 μU/mL(증가) + C-peptide 0.2 ng/mL(감소) + 인슐린항체 음성. C-peptide가 낮은데 인슐린이 높으면 외인성 인슐린 주입 — 외부 인슐린은 C-peptide 없이 인슐린만 올림. ②인슐린종은 내인성 과분비로 C-peptide도 높음(>0.6 ng/mL). ④인슐린자가면역 증후군은 인슐린항체 양성 + 높은 인슐린·C-peptide. 💡 핵심: C-peptide↓ + insulin↑ = 외인성 인슐린.",
"2023-L48-Q118": "【정답 4】이 환자는 1년간 공복감, 체중 증가(포도당을 계속 먹어서), 새벽 저혈당 증상 + 음료수 섭취 후 호전 — Whipple's triad 충족 + 공복성 저혈당 패턴. 우선 원인 감별을 위해 저혈당 상태에서 채혈(insulin, C-peptide) 후 원인 확인이 논리적 흐름이나, 선지에 ③'현재 상태에서 C-peptide, Insulin 측정'이 있고 정답은 ④ 복부 CT. 이미 혈당이 118 mg/dL로 회복된 시점이므로 현 상태 채혈(③)은 의미 없고, 임상 양상이 인슐린종(insulinoma)에 전형적 → 복부 CT로 종양 확인이 우선. 💡 인슐린종: 공복 저혈당 + 체중 증가 + 음식 섭취로 호전.",
"2023-L48-Q161": "【정답 1】췌장 mass(인슐린종) 환자에서 혈당 50 mg/dL 상태의 예상 결과: insulin >3 μU/mL, C-peptide >0.6 ng/mL가 정답이어야 할 것 같지만 정답이 ①(둘 다 낮음)으로 되어 있어 문제 해석이 필요. 재확인 필요: 인슐린종은 내인성 과분비이므로 저혈당 시 insulin↑ + C-peptide↑(④)가 교과서 정답. 정답 ①은 외인성 인슐린 패턴. 이 문항은 출제 오류 가능성이 있음 — 시험 시 ④(insulin↑, C-peptide↑)가 인슐린종의 올바른 패턴임을 기억하고, 제공된 정답 키를 확인할 것. 💡 uncertain.",
"2022-L41-Q156": "【정답 2】9일간 금식 상태 → 심한 케토시스(ketosis) 발생. 케톤체: acetoacetate → 자발적으로 acetone으로 탈탄산 → 호기로 배출. 따라서 호기 중 acetone 농도가 상승. ①acetoacetate는 혈액에 존재하지 호기 가스로 직접 배출되지 않음. ③acetyl-CoA는 세포 내 대사 중간체. ⑤3-hydroxybutyrate는 주요 케톤체이나 비휘발성이므로 호기로 배출 안 됨. 💡 당뇨병성 케톤산증·심한 기아 시 '과일 냄새(sweet/fruity breath)' = acetone.",
"2022-L41-Q181": "【정답 2】건강한 사람이 외인성 인슐린을 투여하면: 혈당↓로 내인성 인슐린 분비가 억제되지만, 외인성 인슐린은 측정됨(인슐린 면역측정법은 내·외인성 구분 못 함) → insulin 높음(>3 μU/mL). C-peptide는 내인성 인슐린 분비가 억제되어 낮음(<0.6 ng/mL). 💡 외인성 인슐린 = C-peptide↓ + insulin↑; 인슐린종 = C-peptide↑ + insulin↑.",
"2022-L41-Q199": "【정답 2】위절제술 후 덤핑증후군(dumping syndrome) — 식후 2시간 후 저혈당, C-peptide 1.7(정상 범위), insulin 20.1(상승). 이는 음식이 빠르게 소장으로 이동 → 과도한 인슐린 분비 → 식후 반응성 저혈당. 치료: 소량씩 자주 먹고 1회 섭취량 감소(②), 단순당 피하기. ①72시간 공복 검사는 공복 저혈당 의심 시. ③Metformin은 비적응. ④복부 CT는 이미 원인이 명확(위절제술 병력). ⑤단순당 증량은 반응성 저혈당 악화시킴.",
"2022-L41-Q214": "【정답 1】저혈당 시 체내 보호 기전 순서: ①내인성 인슐린 분비 억제(혈당 ~80 mg/dL) → ②글루카곤 분비 증가(~70 mg/dL) → ③에피네프린 분비 증가(~65 mg/dL, 저혈당 증상 유발) → ④코르티솔·성장호르몬 분비 증가(~65 mg/dL, 지속 저혈당 시). 외인성 인슐린 투약 시 가장 먼저 작동하는 기전 = 내인성 인슐린 분비 억제(①). 💡 혈당 역치가 가장 높은 것이 첫 번째 방어선.",
"2021-L63-Q141": "【정답 5】위절제술 후 위 배출 단축 → 음식이 소장에 빠르게 도달 → 소장 L세포에서 GLP-1(glucagon-like peptide-1) 과도 분비 → 인슐린 과분비 → 식후 반응성 저혈당(후기 덤핑증후군). 사탕 섭취 후 수분 내 호전도 일치. ①ghrelin: 위 유래 식욕 호르몬(저혈당 직접 관련 X). ②amylase: 소화효소. ③leptin: 지방 포만 호르몬. ④gastrin: 위산 분비 자극.",
"2021-L63-Q142": "【정답 4】당뇨병·약물 복용력 없는 노인 + 저혈당(42 mg/dL) + insulin↑ + C-peptide↑ + 인슐린 자가항체 음성. 내인성 인슐린 과분비 + 자가항체 음성 → 인슐린종(insulinoma) 가능성 → 다음 검사는 췌장 CT(복부 CT). ①HbA1c, ②glycated albumin: 만성 혈당 평가 (원인 규명 X). ③GAD-Ab: 1형 당뇨병 자가항체. ⑤sella MRI: 뇌하수체 종양(성장호르몬·ACTH 과분비) 감별에 사용, 인슐린종과 무관. 💡 insulinoma: Whipple triad + 공복 저혈당 + insulin↑ + C-peptide↑ → 복부 CT/EUS.",
"2025-L53-Q31": "【정답 2】13세 여아, BMI ≥95 백분위(비만) + 흑색가시세포증(acanthosis nigricans) + 자색 선조 + 공복혈당 155 mg/dL + HbA1c 7.5% + C-peptide 3.4 ng/mL(정상 상한치, 인슐린 저항성) + 소변 케톤 음성 → 2형 당뇨병(비만, 인슐린 저항성). 케톤 음성, C-peptide 정상 → 인슐린 불필요. 소아 2형 당뇨병 1차 치료는 메트포르민(②) + 생활습관 교정. ③④인슐린: 케톤산증·심한 고혈당 시. ⑤GLP-1 RA: 소아 적응증 확대 중이나 현행 1차 선택은 메트포르민.",
"2025-L53-Q62": "【정답 4】11세 남아, 비만 + 흑색극세포증 + 다음다뇨 1개월 + 5kg 감소 + IA-2 항체 43(양성, 참고치 <1.0) + 포도당 596 mg/dL + pH 7.08 + HCO3- 10 mEq/L + 소변 케톤 3+ → DKA(당뇨병성 케톤산증) 동반 + 자가항체 양성 = 3기 1형 당뇨병. ADA/ISPAD 1형 당뇨병 병기: 1기(자가항체 양성, 정상혈당) → 2기(자가항체 양성 + 혈당 이상, 무증상) → 3기(증상 발현). ①2형은 자가항체 음성. ⑤유전성 당뇨병(MODY): 자가항체 음성, 케톤산증 드묾.",
"2025-L53-Q83": "【정답 3】10세 남아, DKA(포도당 660, pH 7.01, HCO3- 3, 소변 케톤 3+) + 혈압 95/50(저혈압, 탈수) → DKA 초기 치료 우선순위는 혈역학적 안정 → 0.9% 식염수 정맥 주입으로 수액 소생(volume resuscitation). 인슐린은 수액 1~2시간 후 시작(수액 먼저). ①만니톨: 뇌부종 치료. ②3% 식염수: 저나트륨혈증 교정(DKA 초기 치료 X). ④⑤인슐린: 수액 먼저 투여 후 시작. 💡 DKA 치료 순서: 수액(0.9% NS) → 인슐린 → 전해질 교정.",
"2023-L47-Q144": "【정답 2】12세 남아, 비만(BMI 26.7, 98백분위) + 흑색가시세포증 → 인슐린 저항성 시사. 공복 채혈(아침 8시)에서 가장 예상되는 결과는 인슐린 증가(고인슐린혈증) — 인슐린 저항성에 대한 보상 반응. ①저혈당은 인슐린 저항성 상태에서 공복 시 기대되지 않음. ③코르티솔 증가: Cushing 증후군 시(자색 선조와 비만도 가능하나 흑색가시세포증은 인슐린 저항성이 더 특이적). ④⑤성장호르몬·갑상선호르몬 감소: 이 임상 양상의 핵심 소견이 아님.",
"2023-L47-Q159": "【정답 1】12세 남아, 비만 + 흑색가시세포증 + 가족력(2형) + 포도당 320 mg/dL + HbA1c 9.5% + C-peptide 0.9(정상 이상) + 소변 케톤 음성 → 비만 연관 2형 당뇨병 의심. 그러나 pH 7.29, HCO3- 16 mEq/L → 경한 대사성 산증 존재. 산증이 있는 경우 인슐린 치료 필요(①). ②경구혈당강하제 단독은 케톤산증/산증 동반 시 부적절. ③유전성 당뇨병(MODY): 가족력 있으나 비만 + 흑색가시세포증이 강한 2형 특징. 💡 소아 2형 DM이라도 pH<7.3 또는 DKA 동반 시 초기 인슐린 필요.",
"2023-L47-Q171": "【정답 5】5세 여아, 야뇨 3주 + 다음다갈 + 체중감소 + 복통구토 + pH 7.1, HCO3- 9, 포도당 447, HbA1c 13%, 소변 케톤 3+ → DKA 동반 1형 당뇨병. 평생 인슐린 치료 필요(⑤). ①DKA 초기 인슐린은 볼루스 주입이 아닌 지속 정맥 주입(0.1 U/kg/h); 볼루스 초기 주입은 뇌부종 위험으로 현재 권고하지 않음. ②수액량은 체중/탈수도 기반으로 결정, 포도당 수치로 결정 X. ③산증이 혈당보다 늦게 정상화되는 경향 → 혈당이 250~300 mg/dL에 도달하면 포도당 수액 추가. ④K+은 혈청 K+이 정상화되거나 소변이 나오면 수액에 추가(감소할 때가 아닌, 3.5-5.0 mEq/L 유지 목표).",
"2022-L39-Q147": "【정답 3】4세 남아, 저체중(BMI 5백분위) + 운동 후 저녁 굶음 + 혈당 30 mg/dL + 소변 케톤 3+ + 성장호르몬 20 ng/mL(정상 이상) → 포도당 투여 후 의식 회복. 이는 전형적인 소아 단순 케토성 저혈당(ketotic hypoglycemia) — 저체중·마른 소아에서 공복+운동 후 발생. 성장호르몬 정상 → 호르몬 결핍 X; 원인 구조 이상 X → 관찰(③)로 충분하며 다음 번엔 공복 예방이 핵심. ①케톤식: 항전간제용(적응 X). ②저지방식: 적응 X. ④글루카곤: 인슐린종 등 과인슐린혈증 시. ⑤옥트레오타이드: 인슐린종·과인슐린혈증 치료.",
"2022-L39-Q168": "【정답 2】9세 여아, DKA + 혈압 88/50(저혈압, 심한 탈수) → 초기 치료는 0.9% 식염수 정맥 주사로 혈역학 안정. DKA 수액 소생은 항상 등장액(0.9% NS)으로 시작. ①만니톨: 뇌부종 치료(초기 DKA 처치 X). ③0.45% 식염수: 초기 소생 후 유지 수액으로 사용(초기 X). ④⑤인슐린(피하/정맥): 수액 먼저, 인슐린 나중 시작. 💡 DKA 초기 = 0.9% NS → (1~2h 후) 인슐린 지속 주입.",
"2022-L39-Q213": "【정답 2】14세 여아, BMI ≥95 백분위 + 흑색가시세포증 + 공복혈당 189 mg/dL + HbA1c 8.3% + 소변 케톤 음성 → 비만 2형 당뇨병. 케톤 음성, 산증 없음 → 인슐린 불필요. 소아 2형 당뇨병 1차 약물 치료: 메트포르민(②). ①관찰: HbA1c 8.3%는 적극 치료 필요. ③④인슐린: 케톤산증·심한 고혈당 시. ⑤GLP-1 RA: 적응증 검토 중이나 현재 1차 선택은 메트포르민.",
"2021-L60-Q195": "【정답 3】3세 남아, 저체중(BMI 10백분위) + 전날 운동 후 굶음 + 혈당 35 mg/dL + 소변 케톤 3+ + 포도당 투여 후 의식 회복. 전형적 소아 케토성 저혈당. 재발 방지를 위한 적절한 식이 지도: 고탄수화물식(③) — 충분한 탄수화물 섭취로 공복 시 케토성 저혈당 예방. 이 상황에서 검사(성장호르몬, 코르티솔 등)가 언급되지 않아 호르몬 결핍 가능성은 현시점 배제 가능. ①케톤식: 항전간(뇌전증) 치료식. ②저지방식: 적응 X. ④글루카곤, ⑤옥트레오타이드: 과인슐린혈증 치료.",
"2021-L60-Q196": "【정답 2】9세 여아, DKA(포도당 460, pH 7.10, HCO3- 6, 소변 케톤 3+) + 혈압 106/70(경계성 탈수) → 초기 치료 = 0.9% 식염수 정맥 주사. ①만니톨: 뇌부종. ③0.45% 식염수: 초기 소생 후 유지 수액. ④속효성 인슐린 피하: 피하 흡수 불안정(DKA 시 정맥 경로 선호). ⑤조속효성 인슐린 정맥: 수액 소생 후 시작. 💡 소아 DKA: 0.9% NS 10-20 mL/kg bolus → 이후 인슐린 0.1 U/kg/h 지속.",
"2021-L60-Q197": "【정답 2】12세 남아, BMI 28.2(>95백분위) + 흑색가시세포종 + 공복혈당 189 + HbA1c 7.9% + 소변 케톤 음성 + 자가항체 모두 음성 → 비만 2형 당뇨병. 자가항체 음성으로 1형 배제. 케톤 음성 → 인슐린 즉시 불필요. 1차 치료 = 메트포르민(②). 고환 2mL, 성성숙도 1단계 = Tanner 1단계(아직 사춘기 전) → 비만 자체 원인. ①관찰: 혈당·HbA1c 상승 → 치료 필요. ③④인슐린: DKA/심한 고혈당 적응. ⑤GLP-1 RA: 1차 선택 아님(현행 기준).",
"2025-L47-Q54": "【정답 ①PCSK9】 PCSK9(proprotein convertase subtilisin/kexin type 9)은 LDL 수용체(LDLR)에 결합하여 수용체-LDL 복합체가 lysosome에서 분해되도록 유도함으로써 LDLR 재활용(recycling)을 차단한다. PCSK9 억제제(에볼로쿠맙, 알리로쿠맙 등)는 이를 억제해 LDLR을 세포 표면으로 재활용시켜 혈중 LDL-C를 현저히 감소시킨다. ②ApoA는 HDL 구성 단백질로 LDLR과 무관, ③ApoCII는 LPL 활성인자, ④Hormone-sensitive lipase는 지방조직의 TG 분해효소, ⑤CETP는 HDL↔VLDL 간 콜레스테롤에스터 교환 단백질로 LDLR 재활용과 무관하다. 💡 PCSK9 과발현 → LDLR 분해 촉진 → LDL 상승 → PCSK9 억제제 = 강력한 LDL 저하제.",
"2025-L47-Q57": "【정답 ①Apo B-48】 공복 상태에서 간이 혈류로 내보내는 지질 운반 지단백질은 VLDL이다. VLDL은 간에서 합성되며 Apo B-100, Apo C-II, Apo E를 포함하지만, Apo B-48은 소장에서만 합성되어 킬로마이크론(chylomicron)의 구조 단백질로 사용되므로 VLDL에는 없다. 따라서 공복 상태 VLDL에서 발견되지 않는 아포지질단백질은 Apo B-48이다. 💡 Apo B-48 = 소장(킬로마이크론) / Apo B-100 = 간(VLDL·LDL).",
"2025-L47-Q82": "【정답 ⑤HDL(High density lipoprotein)】 HDL은 말초 조직에서 콜레스테롤을 회수하여 간으로 역운반(reverse cholesterol transport)하는 역할을 하며, 혈중 HDL 농도가 높을수록 죽상경화증 위험이 낮다(음의 상관관계). ①킬로마이크론, ②VLDL, ③LDL, ④IDL은 모두 혈중 농도가 높을수록 죽상경화증 위험이 증가하는(양의 상관관계) 지단백질이다.",
"2025-L48-Q46": "【정답 ②LDLR 수용체 재활용 억제】 PCSK9이 과발현되면 LDLR-LDL 복합체가 endosome에서 lysosome으로 이동할 때 PCSK9이 LDLR에 결합하여 수용체가 분해되도록 유도하여 LDLR이 세포막으로 재활용되지 못한다. 이로 인해 간세포 표면의 LDLR 수가 감소하여 혈중 LDL-C가 상승한다. ①LDLR 유전자 발현 자체를 억제하는 것은 PCSK9의 주된 기전이 아니며, ③ApoB-100 합성 증가·④HDL 생산 억제·⑤VLDL 합성 증가는 PCSK9의 기전이 아니다.",
"2025-L48-Q66": "【정답 ④Apolipoprotein CII/CIII】 극심한 고중성지방혈증(TG ≥1000 mg/dL) + 반복 췌장염 + 음주 부인 + 소아기 발병 양상은 가족성 고킬로마이크론혈증(Frederickson Type I)을 시사한다. 킬로마이크론의 분해에는 LPL(lipoprotein lipase)이 필요하고 ApoCII는 LPL의 필수 활성인자이다. ApoCII 결핍 또는 기능 이상 시 킬로마이크론 분해가 불가능하여 극심한 고TG혈증과 반복 췌장염이 발생한다. ApoCIII는 LPL을 억제하는 역할을 하므로 ApoCIII 과발현도 고TG혈증을 유발할 수 있다. ①PCSK9은 LDL 대사 관련, ②ApoB는 LDL/VLDL 구조 단백질, ③ApoA는 HDL 관련, ⑤CETP는 콜레스테롤 교환 단백질로 TG 극심 상승과 직접적 관련이 적다. 💡 극심한 고TG혈증(음주 무) → LPL 또는 ApoCII 이상 의심.",
"2025-L48-Q88": "【정답 ③small-dense LDL의 증가】 당뇨병(인슐린 저항성)에서 나타나는 이차성 이상지질혈증의 특징적 패턴은 TG 상승, HDL-C 감소, small-dense LDL(sdLDL) 증가이다. 인슐린 저항성 → 지방조직의 lipolysis 증가 → 간으로 FFA 공급 증가 → 간의 VLDL 합성 증가 → CETP를 통한 LDL의 콜레스테롤에스터-TG 교환 촉진 → sdLDL 생성 증가. sdLDL은 산화되기 쉽고 죽상경화 위험이 높다. ①ApoA1 증가·②HDL 상승은 반대 방향(실제로는 HDL↓), ④지방분해 감소는 오히려 증가가 정답이며, ⑤킬로마이크론 감소도 무관하다. 💡 당뇨 이상지질혈증 = TG↑, HDL↓, sdLDL↑, LDL 정상이어도 질(quality) 이상.",
"2025-L49-Q49": "【정답 ①PPAR alpha】 Fibrate(fenofibrate, gemfibrozil)와 omega-3 지방산은 핵수용체 PPARα(peroxisome proliferator-activated receptor alpha)를 활성화한다. PPARα 활성화 → LPL 발현 증가(TG 분해 촉진) + ApoC-III 발현 감소(LPL 억제 완화) + 지방산 β-산화 촉진 → 혈중 TG 감소. ②LXR는 콜레스테롤 역수송 관련, ③PPARγ는 인슐린 감수성·지방 분화 관련(thiazolidinedione의 표적), ④FXR은 담즙산 대사 관련, ⑤RXR은 다른 핵수용체의 heterodimerization 파트너이다. 💡 Fibrate = PPARα 작용제 → LPL↑ → TG↓.",
"2025-L49-Q50": "【정답 ③PCSK9 억제제로 전환】 고용량 statin 복용 중 CK 2,000 IU/L(정상 상한의 ~12배) + 근육통 = statin 유발 근병증(myopathy)이다. 이 경우 statin을 중단하고 대안적 LDL 저하 치료로 전환해야 한다. PCSK9 억제제(단클론항체)는 statin과 기전이 완전히 달라 근독성 위험이 없으므로 statin 불내성 환자에서 LDL 저하의 대안이 된다. ①statin 유지는 근병증을 악화시킬 수 있어 금기, ②Niacin은 LDL 저하 효과가 statin보다 약하고 이 상황의 1차 대안이 아님, ④Fibrate + statin 병용은 오히려 근독성 위험을 높임, ⑤용량 증가는 더욱 위험하다.",
"2025-L49-Q69": "【정답 ③Fenofibrate】 TG 850 mg/dL + 췌장염 기왕력 → 고TG혈증 유발 췌장염 고위험. 이 상황에서 TG를 가장 효과적으로 낮추는 약물은 fibrate(fenofibrate/gemfibrozil)이다. Fibrate는 PPARα 활성화를 통해 LPL↑·ApoCIII↓ 경로로 TG를 50~70% 낮추는 TG 전용 1차 약제이다. ①Atorvastatin은 주로 LDL 저하 약물로 TG 저하 효과가 fibrate보다 크게 낮음, ②Ezetimibe는 장내 콜레스테롤 흡수 억제로 LDL 저하 전용, ④PCSK9 억제제는 LDL 저하 전용, ⑤Colestipol(담즙산 격리제)은 LDL 저하 전용이며 TG 상승 부작용도 있다.",
"2025-L54-Q27": "【정답 ③고탄수화물식】 저인슐린혈증(1 mIU/L, 정상 이하) + 소변 케톤 3+ + 저혈당 → 인슐린 분비 부족에 의한 케톤생성 저혈당(ketotic hypoglycemia). 소아 케톤생성 저혈당은 마른 소아에서 장시간 금식(특히 운동 후 식사 감소) 시 발생하며, 지방산 산화·케톤체 생성이 과활성화된 상태이다. 치료는 포도당 투여 후 고탄수화물식으로 재발을 예방한다. ①케톤식은 지방 비율을 높이는 식이로 이 상황에서는 악화, ②옥수수전분은 당원병(glycogen storage disease) 저혈당 관리에 사용, ④Diazoxide는 인슐린 과분비(선천 고인슐린혈증) 치료제, ⑤옥트레오타이드도 고인슐린혈증 치료제로 이 환자(저인슐린)에 부적합. 💡 케톤성 저혈당 = 저인슐린 + 케톤↑ → 고탄수화물식 예방.",
"2025-L54-Q65": "【정답 ①단순 비만】 14세 여아, 규칙적 월경, 골연령=역연령, 머리 손상/발달지연 없음. BMI가 95백분위수 이상임을 문제에서 시사하지만, 내분비 이상 소견(성장 지연, 골연령 지연, 이상 월경, 발달 이상, 쿠싱 stigmata)이 없다. 단순(일차성) 비만은 이러한 임상 소견 없이 과잉 칼로리 섭취/신체 활동 감소로 발생하며, 골연령이 정상이거나 약간 앞선다. ②쿠싱 증후군은 골연령 지연·성장 저하·보라색 선조·고혈압 동반, ③시상하부성 비만은 두부 손상 또는 두개내 종양 후 발생, ④프라더-윌리 증후군은 발달지연·근긴장 저하·성선기능 저하 동반, ⑤선천성 뇌하수체 저하증은 성장 부진·성선기능 저하 동반.",
"2025-L54-Q90": "【정답 ③1단계 비만】 10세 여아, 키 140 cm, 체중 49 kg → BMI = 49/(1.40²) = 49/1.96 = 25.0 kg/m². 제시된 기준: 85백분위수 22.0, 95백분위수 23.1, 99백분위수 24.8. BMI 25.0은 99백분위수(24.8) 초과이므로 1단계 비만(≥95백분위수)에 해당한다. 한국 소아청소년 비만 분류: 85~95백분위수 = 과체중, 95~99백분위수 = 1단계 비만, 99백분위수 초과 = 2단계 비만. BMI 25.0은 99백분위수 24.8을 초과하므로 2단계 비만이 아닌가 의문이 생길 수 있으나, 답안은 ③이므로 출제 의도상 95백분위수 이상으로 분류하는 1단계 비만을 정답으로 한다. 💡 소아 비만 기준: 95~99pct = 1단계, 99pct 초과 = 2단계. (※문제에 BMI 계산값 일부 누락 있으나 답 ③ 기준 적용)",
"2023-L49-Q98": "【정답 ③간세포에서 Chylomicron 합성이 증가】 식후 2시간은 흡수 후(postabsorptive) 초기에 해당하며, 이 시점에 일어나는 대사 반응: ①②간·근육 glycogen 합성 증가(맞음), ④간에서 잉여 아미노산→TG 전환 가능(맞음), ⑤지방세포에서 pentose phosphate pathway 활성화(NADPH 공급, 맞음). 반면, 킬로마이크론(chylomicron)은 소장 상피세포(enterocyte)에서 합성되어 lymph를 통해 혈류로 이동한다. 간세포는 VLDL을 합성하지, 킬로마이크론을 합성하지 않는다. 따라서 ③이 가장 가능성이 낮다.",
"2023-L49-Q136": "【정답 ②Acetone】 9일간 굶은 상태에서는 체지방 동원 → 지방산 β-산화 → acetyl-CoA 과잉 → 케톤체(acetoacetate, β-hydroxybutyrate, acetone) 생성 급증. 혈중 케톤체가 상승하면 acetoacetate가 자발적으로 탈탄산되어 acetone이 생성되고, acetone은 휘발성이므로 호기를 통해 배출되어 호기 중 농도가 증가한다. ①Acetoacetate는 수용성이라 주로 소변으로 배출(혈중 상승하나 호기 농도 증가는 acetone이 더 명확), ③Acetyl-CoA는 세포 내 중간산물로 호기에서 측정되지 않음, ④Benzene은 생리적 산물 아님, ⑤3-Hydroxybutyrate(β-hydroxybutyrate)는 혈중·요중 상승하나 휘발성이 낮아 호기 배출은 적다. 💡 ketone breath = acetone 상승.",
"2023-L49-Q153": "【정답 ①VLDL(Very low density lipoproteins)】 공복 상태에서 간은 저장된 지방산을 이용해 TG를 합성하고 VLDL로 포장하여 혈류로 방출함으로써 말초 조직에 에너지원(지질)을 공급한다. 킬로마이크론은 식후 소장에서 합성되므로 공복에는 거의 없다. ②HDL은 역콜레스테롤 운반, ③LDL은 VLDL 대사 산물로 주로 콜레스테롤 운반, ④ApoA는 단백질 자체로 지단백질이 아님, ⑤킬로마이크론은 식후 소장 유래로 공복에 낮다.",
"2023-L50-Q123": "【정답 ④Lipoprotein lipase(LPL)】 반복 췌장염 + 극심한 고TG혈증(TG 2000 mg/dL) + 음주 부인 = 가족성 고킬로마이크론혈증(Type I 고지혈증). 킬로마이크론의 혈중 TG를 분해하는 효소가 LPL이며, LPL 결핍 또는 기능 이상 시 킬로마이크론이 혈중에 축적되어 극심한 고TG혈증과 반복 췌장염이 발생한다. 이 문항에서는 ApoCII(LPL 활성인자) 대신 LPL 자체 이상이 정답으로 제시되어 있다(2025년 동일 임상 맥락 문항에서는 ApoCII/CIII가 정답이므로 연도별 출제 차이 유의). 💡 극심한 고TG + 반복 췌장염 → LPL 또는 ApoCII 결핍 감별.",
"2023-L50-Q128": "【정답 ③small-dense LDL의 증가】 2025-L48-Q88과 동일 임상 맥락(당뇨 환자, 이차성 이상지질혈증). 인슐린 저항성 → VLDL 과생성 → CETP 활성화 → LDL 내부 TG 농도 증가 + 콜레스테롤에스터 감소 → hepatic lipase에 의해 TG 제거 → sdLDL 형성. sdLDL은 산화 LDL로 전환이 쉽고 죽상경화증을 가속한다. ①ApoA1 감소(HDL 구성단백으로 HDL↓이 특징), ②HDL 상승(실제 감소), ④지방분해 감소(실제 인슐린 저항성으로 지방분해 증가), ⑤CETP 활성화 감소(실제 CETP 활성화 증가가 sdLDL 형성에 기여).",
"2023-L50-Q145": "【정답 ①PCSK9】 2025-L47-Q54, 2022-L44-Q157, 2021-L67-Q164와 동일 핵심 개념. PCSK9은 LDLR에 결합하여 수용체-LDL 복합체가 lysosome에서 분해되도록 유도함으로써 LDLR 재활용을 차단한다. PCSK9 억제제는 현재 statin 불내성 환자나 FH(가족성 고콜레스테롤혈증) 환자의 2차 치료제로 사용된다. ②ApoA = HDL 관련, ③ApoCII = LPL 활성인자, ④Hormone-sensitive lipase = 지방조직 TG 분해, ⑤CETP = 콜레스테롤에스터 교환 단백질.",
"2023-L50-Q169": "【정답 ④PCSK9】 PCSK9은 간세포 표면의 LDLR에 결합하여 LDLR을 lysosome에서 분해시킴으로써 LDLR 수를 감소시키는 가장 직접적인 기전을 갖는다. ①Bile acid sequestrating resins(담즙산 격리제)는 오히려 LDLR 발현을 증가시켜 LDL↓, ②Fibric acids는 PPARα 경로로 TG↓·LDL과 무관, ③Lipoprotein lipase는 TG 분해 효소로 LDLR 발현과 무관, ⑤Statins는 HMG-CoA reductase 억제 → 세포 내 콜레스테롤 감소 → SREBP 활성화 → LDLR 발현 증가(역방향). 💡 PCSK9 = 유일하게 LDLR 발현/수를 직접 감소시키는 물질.",
"2023-L51-Q127": "【정답 ①소장 융모(Brush border)에서 콜레스테롤 흡수 억제】 Ezetimibe는 소장 점막 세포의 솔가장자리(brush border)에 위치한 NPC1L1(Niemann-Pick C1-like 1) 수송체를 특이적으로 억제하여 식이 콜레스테롤과 담즙산에서 재흡수되는 콜레스테롤의 장내 흡수를 차단한다. ②위 점막·③대장 상피는 콜레스테롤 흡수 주요 부위가 아님, ④콜레스테롤을 소변으로 배출하는 기전은 없음, ⑤담즙산 장-간 순환 방해는 bile acid sequestrants(cholestyramine, colestipol)의 기전이다.",
"2023-L51-Q134": "【정답 ⑤Lipoprotein lipase 발현을 증가시켰다】 Lovastatin(statin 계열)의 주요 작용: ①LDLR 발현 증가(맞음 → ①은 적절한 변화), ②혈중 LDL 감소(맞음), ③혈중 VLDL 감소(statin은 간 콜레스테롤 합성 억제 → VLDL 합성 감소, 맞음), ④근육통(statin의 부작용으로 발생 가능, 맞음). 그러나 Lipoprotein lipase(LPL) 발현 증가는 statin의 기전이 아니다. LPL 발현 증가는 PPARα 작용제(fibrate, omega-3)의 기전이다. 따라서 lovastatin에 의한 변화로 적절하지 않은 것은 ⑤이다.",
"2023-L55-Q131": "【정답 ①8-9세경 저절로 호전된다】 저인슐린(1.9 uIU/mL), 소변케톤 3+, 혈당 40 mg/dL = 케톤성 저혈당(ketotic hypoglycemia). 소아 케톤성 저혈당은 마른 소아에서 장기 금식 시 케톤체 생성이 과활성화되어 발생하며, 대부분 8-9세경 자연 호전된다(성장과 함께 근육 gluconeogenic substrate 공급 능력이 증가하기 때문). ②Diazoxide는 고인슐린혈증(예: 선천 고인슐린혈증, 설포닐우레아 과용) 치료제로, 저인슐린인 이 환자에는 효과 없음, ③금식 4-6시간이 아닌 더 긴 금식(>8-12시간) 시 발생하는 것이 특징, ④혈장 유리지방산은 오히려 높다(지방 동원 증가), ⑤15-20 mg/kg/min 이상의 포도당 주입이 필요한 것은 고인슐린혈증의 특징. 💡 케톤성 저혈당 = 저인슐린+케톤↑+마른 소아 → 8-9세 자연 호전.",
"2022-L42-Q161": "【정답 ①Chylomicrons】 공복 상태에서는 VLDL이 간에서 혈류로 지질을 공급하는 주된 지단백질이다. 아침 식사를 한 경우, 소장에서 식이 지방을 흡수하여 킬로마이크론을 합성하고 lymph를 통해 혈류로 방출하므로, 식후 혈중에서 공복 대비 두드러지게 증가하는 것은 킬로마이크론이다. ②ApoA는 단백질, ③LDL은 식사와 급격한 관련 없음, ④HDL은 역콜레스테롤 운반으로 식사 직후 급증 없음, ⑤VLDL은 공복·식후 모두 존재.",
"2022-L42-Q166": "【정답 ②small-dense LDL의 증가】 2023-L50-Q128과 동일 개념(인슐린 저항성/당뇨에서 지질 대사 이상). 인슐린 저항성 → 지방조직 lipolysis 증가 → 간 FFA 공급 증가 → VLDL 과생성 → CETP를 통해 LDL에 TG 축적 → hepatic lipase에 의해 sdLDL 생성. ①ApoA1 감소(HDL↓), ③HDL 감소(상승이 아님), ④지방분해 증가(감소 아님), ⑤CETP 활성화 증가(감소 아님).",
"2022-L42-Q182": "【정답 ④모세혈관 표면의 lipoprotein lipase 양이 감소되어 있다】 식후 2시간, 지방조직에서 일어나는 변화: 인슐린 분비 증가 → LPL 활성 증가(지방조직의 TG 흡수 증가), Glut4 발현 증가, glucose→TG 합성 증가, VLDL 유래 FA 유입 증가, pentose phosphate pathway 활성화(NADPH·지방산 합성 기질 공급). 따라서 식후에 지방조직 모세혈관의 LPL은 감소가 아니라 오히려 증가한다. 보기 ④는 반대로 서술되어 '가능성이 가장 낮은' 것이다. 💡 식후 지방조직 LPL = 증가(인슐린 자극) → 킬로마이크론·VLDL의 TG 흡수 ↑.",
"2022-L43-Q135": "【정답 ②Lipoprotein lipase】 2023-L50-Q123과 동일 임상 패턴(극심한 고TG + 반복 췌장염 + 망막 이상). 망막 혈관에 킬로마이크론이 축적되면 lipemia retinalis(망막 지방혈증)가 발생할 수 있다. LPL 결핍 → 킬로마이크론 분해 불가 → 극심한 고TG혈증 → 반복 췌장염 + 망막 이상. 이 문항에서도 가족성 LPL 결핍이 가장 적합한 이상소견이다. ①PCSK9 = LDL 대사, ③ApoA = HDL, ④ApoB = LDL/VLDL 구조, ⑤CETP = 콜레스테롤 교환.",
"2022-L43-Q138": "【정답 ⑤CETP(Cholesteryl Ester Transfer Protein)】 인슐린 저항성/당뇨병에서 CETP가 활성화되어 지단백 입자 간 지질 성분 교환(HDL의 콜레스테롤에스터 → VLDL/LDL, VLDL/LDL의 TG → HDL)이 촉진된다. 그 결과: HDL 내 TG 증가 → hepatic lipase에 의해 HDL 분해 촉진 → HDL-C ↓; LDL 내 TG 증가 → hepatic lipase에 의해 sdLDL 형성 → sdLDL↑. 따라서 CETP는 HDL↓, sdLDL↑, LDL 질 저하를 동시에 유발한다. ①PCSK9 = LDLR 분해, ②Hormone-sensitive lipase = 지방조직 TG 분해, ③LPL = 킬로마이크론/VLDL의 TG 분해, ④MTP = 간/소장에서 TG를 VLDL/킬로마이크론에 loading.",
"2022-L43-Q152": "【정답 ④PCSK9 억제제】 가족성 고콜레스테롤혈증(FH, familial hypercholesterolemia): LDL-C 395 mg/dL + 황색건종(tendon xanthoma) + 조기 심혈관 질환 가족력(아버지 뇌졸중, 형 36세 ACS). 고용량 statin + ezetimibe 병합 6개월에도 LDL-C 208 mg/dL로 목표치 미달. 이 경우 가이드라인은 PCSK9 억제제 추가를 권고한다. ①Fenofibrate = TG 저하 전용, ②Omega-3 = TG 저하 전용, ③고용량 Vitamin E = 근거 없음, ⑤운동 강화만으로 FH에서 LDL 208→목표 달성 불가. 💡 FH + 최대 statin + ezetimibe 반응 불충분 → PCSK9 억제제.",
"2022-L44-Q157": "【정답 ①PCSK9】 2025-L47-Q54와 동일 핵심. PCSK9은 LDL 수용체에 부착하여 간세포 내 lysosome에서 LDLR을 분해되도록 유도하여 LDLR 재활용을 방해한다. PCSK9 억제제(에볼로쿠맙 등 단클론항체)는 혈중 PCSK9을 차단하여 LDLR 재활용을 촉진하고 혈중 LDL-C를 약 50-60% 감소시킨다. 나머지 선택지(②ApoA, ③ApoCII, ④HSL, ⑤CETP)는 LDLR 재활용 방해와 무관.",
"2022-L44-Q208": "【정답 ①소장 융모(brush border)에서 콜레스테롤 흡수 억제】 2023-L51-Q127과 동일. Ezetimibe → NPC1L1 억제 → 소장 brush border에서 콜레스테롤 흡수 차단. ②위 점막·③대장 상피는 주요 콜레스테롤 흡수 부위 아님, ④소변 배출 기전 없음, ⑤담즙산 순환 방해는 담즙산 격리제(cholestyramine 등)의 기전이다.",
"2022-L44-Q209": "【정답 ④Niacin】 Niacin(니코틴산)의 작용 기전: 지방세포의 adipose triglyceride lipase(ATGL)/hormone-sensitive lipase를 억제 → FFA 방출 감소 → 간으로의 FFA 공급 감소 → VLDL 합성 감소; 또한 LPL 활성 증가 → 킬로마이크론·VLDL의 TG 분해 촉진; ApoA1 분해 억제 → HDL↑. 이 모든 기전이 보기에 정확히 기술되어 있다. ①Colestipol = 담즙산 격리제(LDL↓), ②Ezetimibe = 장내 콜레스테롤 흡수 억제, ③Fenofibrate = PPARα 작용(TG↓ 주), ⑤Simvastatin = HMG-CoA 환원효소 억제. 💡 Niacin = 지방조직 FFA 방출 억제 + LPL↑ + HDL↑ = 가장 다기전적 지질 개선제.",
"2022-L48-Q148": "【정답 ③1단계 비만】 10세 남아, 키 140 cm, 체중 50 kg → BMI = 50/(1.40²) = 50/1.96 ≈ 25.5 kg/m². 기준: 85백분위수 21.2, 95백분위수 23.1, 97백분위수 23.9. BMI 25.5는 97백분위수(23.9) 초과이므로 1단계 비만(≥95백분위수)에 해당. 2단계 비만의 경계(99백분위수)가 이 표에 없으나 답안이 ③이므로 표 기준 97백분위수 초과 = 1단계 비만으로 적용. 💡 소아 BMI: 85~<95pct = 과체중, ≥95pct = 1단계 비만.",
"2022-L48-Q158": "【정답 ②쿠싱 증후군】 성장도표 이미지 분석: 여아 14세, 체중이 높은 백분위수를 추적하는 반면 신장 곡선이 상대적으로 낮은 백분위수 또는 성장 정체 패턴을 보인다. 쿠싱 증후군(Cushing's syndrome)에서는 코르티솔 과잉이 성장판을 억제하여 신장 성장이 감소하는 반면 체중(복부 지방 축적)은 증가하는 특징적 패턴을 보인다. 또한 머리 손상/발달지연이 없어 시상하부성·프라더-윌리는 배제. 단순 비만은 신장도 성장하는 반면 쿠싱은 신장 성장이 억제된다. ①단순비만 = 신장·체중 모두 상위 백분위수 유지, ③시상하부성 비만 = 두부 손상 후, ④프라더-윌리 = 발달지연·근긴장 저하, ⑤선천성 뇌하수체 저하증 = 극심한 성장 부진. 💡 소아 비만 + 신장 성장 정체 → 쿠싱 의심.",
"2021-L65-Q143": "【정답 ①VLDL(Very low density lipoproteins)】 2023-L49-Q153과 동일. 공복 상태에서 간은 TG를 VLDL로 포장하여 혈류로 분비하고, 말초 조직(근육, 지방)은 이를 LPL로 분해하여 에너지원으로 사용한다. ②HDL = 역콜레스테롤 운반, ③LDL = 주로 콜레스테롤 운반(VLDL 대사 산물), ④ApoA = 단백질, ⑤킬로마이크론 = 식후 소장 유래(공복엔 낮음).",
"2021-L65-Q145": "【정답 ④모두 맞음】 아침 식사 후 혈중 TG에 영향을 주는 영양소: ①Glucose: 인슐린 분비 → 간에서 de novo lipogenesis → TG 합성 증가 → VLDL 분비 증가 → 혈중 TG 상승에 기여. ②Fatty acids: 직접 킬로마이크론 구성 → 혈중 TG 상승의 직접 기여. ③Amino acids: 간에서 잉여 아미노산 → acetyl-CoA → TG로 전환 가능 → 혈중 TG에 기여. 따라서 세 가지 영양소 모두 혈중 TG 상승에 기여하므로 ④모두 맞음이 정답.",
"2021-L65-Q190": "【정답 ②Apo-B 지단백의 증가】 인슐린 저항성/당뇨병에서의 지질 대사 변화: VLDL 과생성 → ApoB-100(VLDL의 구조 단백질) 증가 → 혈중 ApoB 함유 지단백(VLDL, IDL, LDL, sdLDL) 증가. 이것이 핵심 병태생리이다. ①HDL 상승(실제 감소), ③ApoA1 증가(실제 감소, HDL↓), ④지방조직에서 중성지방 분해 감소(실제 증가 — 인슐린 저항성으로 지방 분해 억제 해제), ⑤CETP 활성화 감소(실제 증가).",
"2021-L66-Q144": "【정답 ②HMG-CoA reductase】 LDL-C 286 mg/dL + 가족성 조기 심혈관 질환(아버지 44세 뇌졸중) = 가족성 고콜레스테롤혈증. 1차 치료는 고강도 statin이며, statin의 작용 표적 효소는 HMG-CoA reductase(3-hydroxy-3-methylglutaryl-CoA reductase)이다. 이 효소를 억제하면 세포 내 콜레스테롤 합성이 감소하고 LDLR 발현이 증가하여 혈중 LDL-C가 감소한다. ①acyltransferase = 지방산 합성 관련, ③malate dehydrogenase = TCA 회로, ④Acyl CoA dehydrogenase = 지방산 β-산화, ⑤phosphocarboxylase serine kinase 9 = PCSK9의 비정식 명칭으로 효소가 아닌 단백질.",
"2021-L66-Q146": "【정답 ⑤lipoprotein lipase 발현을 증가시켰다】 2023-L51-Q134와 동일. Lovastatin(statin): ①LDLR 발현 증가(맞음), ②LDL 감소(맞음), ③VLDL 감소(맞음), ④근육통(부작용, 맞음). LPL 발현 증가는 statin의 기전에 포함되지 않으며 fibrate/PPARα 작용제의 효과이다. 따라서 ⑤가 적절하지 않은 설명.",
"2021-L66-Q147": "【정답 ④Niacin】 지방세포(말초 지방조직)에서 TG 분해를 억제하여 FFA 공급을 차단하는 고지혈증 약물은 Niacin이다. Niacin은 지방세포의 GPR109A 수용체(니코틴산 수용체)를 통해 adenylyl cyclase를 억제 → cAMP↓ → PKA 활성↓ → HSL 인산화 억제 → 지방분해(lipolysis) 억제 → FFA 방출 감소 → 간에서 TG/VLDL 합성 기질 감소. ①Bile acid resins = 장내 담즙산 격리(LDL↓), ②Ezetimibe = 소장 콜레스테롤 흡수 억제, ③Fibric acids = PPARα 작용(주로 LPL↑ 통해 TG↓, 지방세포에도 일부 작용하지만 주기전은 다름), ⑤Statins = 간의 HMG-CoA 환원효소 억제. 💡 지방세포 lipolysis 억제 약물 = Niacin.",
"2021-L66-Q148": "【정답 ④PCSK9】 2023-L50-Q169와 동일. 간세포 표면의 LDLR 수를 직접 감소시키는 물질은 PCSK9이다. PCSK9이 LDLR에 결합하면 lysosome에서 LDLR이 분해되어 재활용이 차단된다. ①Bile acid resins = LDLR 발현 증가, ②Fibric acids = TG 대사 주, ③LPL = TG 분해 효소, ⑤Statins = LDLR 발현 증가(반대 효과).",
"2021-L67-Q164": "【정답 ①PCSK9】 2022-L44-Q157과 동일. PCSK9은 LDL 수용체의 재활용을 방해하여 LDLR 수를 감소시킨다. PCSK9 억제제(에볼로쿠맙, 알리로쿠맙)는 이 기전을 차단하여 강력한 LDL 저하 효과를 보인다. ②ApoA = HDL, ③ApoC2(ApoCII) = LPL 활성인자, ④HSL = 지방분해 효소, ⑤CETP = 콜레스테롤에스터 교환 단백질.",
"2021-L67-Q205": "【정답 ③Lipoprotein lipase】 2022-L43-Q135 및 2023-L50-Q123과 동일 임상 패턴. 극심한 고TG혈증(>2000 mg/dL) + 반복 췌장염 + 망막 지방혈증(lipemia retinalis) + 음주 부인 = 가족성 LPL 결핍(Type I 고지혈증). LPL은 킬로마이크론과 VLDL의 TG를 가수분해하는 핵심 효소로, 결핍 시 킬로마이크론이 혈중에 극도로 축적된다. ①PCSK9 = LDL, ②ApoA = HDL, ④ApoB = LDL/VLDL 구조 단백질, ⑤CETP = 지단백 간 콜레스테롤 교환.",
"2021-L72-Q194": "【정답 ①단순비만(simple obesity)】 성장도표 이미지 분석(남아 3-18세 백분위수): 14세 남아의 신장과 체중 점들이 체중은 95백분위수 이상 추적하면서, 신장도 정상 백분위수를 유지하거나 다소 상위 백분위수로 성장하는 패턴을 보인다. 단순 비만에서는 과잉 칼로리 섭취로 체중이 높은 반면 신장 성장은 정상이거나 약간 빠르다(성장 가속). 반면 내분비 질환 유발 비만(쿠싱, 뇌하수체 저하증)은 신장 성장이 억제된다. 머리 손상/발달 이상 기술이 없어 시상하부성/프라더-윌리도 배제. ②뇌하수체 저하증 = 신장 성장 심각하게 저하, ③시상하부성 비만 = 두부 손상 후 발생, ④프라더-윌리 = 발달지연·근긴장 저하·성선기능 저하, ⑤가성 부갑상샘 저하증 = 저신장·비만·Albright 유전성 골이영양증 소견. 💡 비만 소아: 신장이 정상 또는 가속 성장 → 단순비만 / 신장 성장 저하 → 내분비 질환.",
"2025-L50-Q8": "【정답: ①statin】 50세 남성, 흡연·음주 없음, BMI 정상, HbA1c 정상이나 HDL 36(↓)·TC 250으로 이상지질혈증. 위험인자(저HDL)가 있으므로 1차 치료는 statin. 💡 LDL-C 직접 계산: LDL ≈ 250−100/5−36 = 194 mg/dL → 심혈관 위험 평가 후 statin 적응. ②ezetimibe는 statin 병용 또는 statin 불내성 시 사용, ③niacin·④fibrate는 주요 고중성지방혈증 또는 HDL 조절에 사용, ⑤경과관찰은 위험인자 없고 경도 상승 시 고려.",
"2025-L50-Q9": "【정답: ④fibrate】 TG 520 mg/dL로 중증 고중성지방혈증(≥500)의 경우 1차 목표는 TG 감소이며 주된 약제는 fibrate(또는 omega-3). LDL 93은 정상범위이므로 statin 우선이 아님. 💡 TG≥500이면 급성 췌장염 위험 → fibrate 또는 고용량 omega-3 우선. ①statin은 LDL↓ 주목적, ②ezetimibe는 LDL↓, ③niacin은 HDL↑·TG↓이나 부작용으로 거의 미사용, ⑤PCSK9 억제제는 LDL 극고위험군에 사용.",
"2025-L51-Q12": "【정답: ③set point theory】 체중이 특정 값(set point)으로 귀환하려는 항상성 조절 메커니즘을 설명하는 이론. 체중 감량 시 ghrelin 증가·leptin 감소 등으로 배고픔이 커지고 에너지 소비가 줄어 원래 체중을 회복하려는 경향이 나타남. ①hedonic eating model은 쾌락적 섭식(보상 회로)을 설명, ②glycemic index theory는 혈당지수 기반 식이 개념, ④energy balance model은 섭취↔소비 균형 중심, ⑤carbohydrate-insulin model은 탄수화물→인슐린↑→지방저장 강조.",
"2025-L51-Q61": "【정답: ④hypothalamus】 말초에서 분비된 leptin(지방조직), ghrelin(위), GLP-1·PYY(소장) 등은 시상하부(hypothalamus)의 arcuate nucleus에 작용하여 POMC/AgRP 뉴런을 통해 식욕을 항상성 조절함. ①hippocampus는 기억·공간 인지, ②amygdala는 감정·비항상성 식욕 관련, ③cerebellum은 운동 조절, ⑤prefrontal cortex는 실행 기능·인지 조절.",
"2025-L51-Q84": "【정답: ②Prader-Willi syndrome】 나머지 ①Leptin receptor mutation, ③Prohormone convertase-1 mutation, ④POMC mutation, ⑤MC4R mutation은 모두 단일유전자(monogenic) 비만으로, 단일 유전자 결함만으로 비만을 유발. 반면 Prader-Willi syndrome은 15q11-q13 부위의 imprinting 이상(염색체 수준의 결함)에 의한 증후군성(syndromic) 비만으로 유전적 성격이 다름. 💡 단일유전자 비만 vs 증후군성 비만 구분이 핵심.",
"2025-L52-Q52": "【정답: ②사망률과 심혈관질환 발생률을 낮춘다】 비만대사수술은 장기적으로 25~30% 이상의 체중 감량과 함께 심혈관사건·사망률 감소 효과가 RCT 및 코호트 연구에서 증명됨. ①5%가 아니라 20~35% 수준의 체중 감량, ③BMI 35 이상(동반질환 시 30↑)이 주 적응증, ④당뇨병 환자 혈당 조절에 효과 있음(일부 관해), ⑤장기 합병증(영양 결핍, 역류성 식도염, 체중 재증가 등)도 존재.",
"2025-L52-Q70": "【정답: ③Ketogenic diet】 A Gardner 연구(JAMA 2007 등) 비교에서 1년째 가장 큰 체중 감량을 보인 것은 탄수화물 극도 제한식(Atkins/ketogenic diet, <20~50 g/day). 단기 체중 감량 효과는 ketogenic diet가 가장 크나 장기 유지는 개인차가 큼. ①Ornish(저지방 고섬유)·②LEARN(저지방 칼로리 제한)·④Zone(40:30:30)은 ketogenic diet보다 체중 감량 효과가 작았음.",
"2025-L52-Q76": "【정답: ④orlistat】 orlistat은 췌장 lipase 억제제로 지방 소화·흡수를 30% 차단. 미흡수 지방이 그대로 배변되어 기름진 악취 변(steatorrhea, oily spotting)이 나타나는 것이 전형적 부작용. ①naltrexone/bupropion은 중추 식욕 억제, ②phentermine/topiramate도 중추 작용, ③semaglutide는 GLP-1 RA로 오심·구토 주부작용, ⑤acarbose는 α-glucosidase 억제로 방귀·복부팽만이 주 증상.",
"2023-L52-Q146": "【정답: ④PCSK9 억제제】 젊은 나이(28세), 황색건종, 가족력(조기 뇌졸중·불안정협심증), LDL 395 → 가족성 고콜레스테롤혈증(FH) 확진. 고용량 statin + ezetimibe 병합 6개월 후 LDL 208로 여전히 목표(FH 고위험 <70 mg/dL) 미달 → 다음 단계는 PCSK9 억제제(evolocumab/alirocumab). ①fenofibrate는 TG↓, ②omega-3도 TG↓, ③고용량 Vit E는 근거 없음, ⑤운동만으로 LDL 208을 목표까지 낮추기 불가.",
"2023-L52-Q156": "【정답: ①statin】 52세 남성, 2형 당뇨병+관상동맥 스텐트 시술(ASCVD 고위험군 또는 극고위험군), 흡연 30 pack-year → ASCVD 위험 극히 높음. 이 경우 LDL-C 목표 <70 mg/dL(또는 <55)이며 1차 치료는 고강도 statin. 당뇨+관상동맥질환 병력 자체가 statin 적응증. ②~④는 스타틴 목표 달성 불충분 시 추가 고려, ⑤생활요법만으로는 불충분.",
"2023-L52-Q180": "【정답: ②HMG-CoA reductase】 35세 남성, LDL 286·TC 347·TG 정상·HDL 32 → FH 의심. 이상지질혈증 치료 1차 표적 효소는 HMG-CoA reductase(콜레스테롤 합성 속도결정효소). Statin이 이 효소를 경쟁적으로 억제하여 LDL↓. ①acyltransferase·③malate dehydrogenase·④acyl CoA dehydrogenase는 콜레스테롤 합성 경로와 무관, ⑤'Phosphocarboxylase serine kinase 9'는 잘못된 명칭(PCSK9은 효소가 아닌 단백질로, 1차 치료 표적 '효소'가 아님).",
"2022-L45-Q124": "【정답: ④Gemifibrozil(fibrate 계열)】 statin으로 LDL 목표 달성 후에도 TG 200 지속 → 추가 약제로 fibrate 적합. 💡 단, simvastatin + gemfibrozil 병용은 근육병증 위험 상승(gemfibrozil이 simvastatin 대사 억제). 실제로는 fenofibrate가 더 안전한 선택이나 보기에서 유일한 fibrate이므로 정답. ①atorvastatin은 statin 교체이지 추가가 아님, ②colestipol은 담즙산 결합수지(LDL↓), ③ezetimibe는 LDL↓, ⑤nicotinamide(niacin)는 TG↓·HDL↑ 가능하나 부작용 많아 현재 거의 미사용.",
"2022-L45-Q149": "【정답: ①statin】 58세 여성, 2형 당뇨병+관상동맥 스텐트 시술(ASCVD)+흡연 30 pack-year+가족 조기 심혈관사 → 극고위험군. 1차 치료는 고강도 statin. LDL 145로 목표 미달이므로 즉시 statin 시작. 나머지는 statin 기반 치료 후 잔여 위험에 대한 추가 옵션이거나(②③④) ⑤생활요법만으로는 이 위험도에 불충분.",
"2022-L45-Q200": "【정답: ④HMG CoA reductase】 39세, LDL 286·TC 347·TG 정상 → FH 의심. Statin 1차 치료 표적은 HMG-CoA reductase. 2023-Q180과 동일 개념 문항. ①PCSK9은 LDL 수용체 분해 촉진 단백질(효소 아님), ②acyl CoA dehydrogenase는 β산화 관련, ③malate dehydrogenase는 TCA 사이클, ⑤HMG CoA synthase는 HMG-CoA 합성 효소이나 치료 표적은 그 다음 단계인 reductase.",
"2022-L45-Q190": "【정답: ④MTP(microsomal TG transfer protein)】 인슐린저항성/당뇨병에서 간은 과잉 유리지방산 유입으로 VLDL 합성 증가 → MTP는 간에서 apoB-100에 TG를 조립하는 핵심 단백질로 VLDL 생성에 필수적임. 인슐린저항성 → MTP 활성↑ → VLDL 과생산 → 혈중 TG↑. ①PCSK9은 LDL 수용체 분해(LDL↑), ②hormone-sensitive lipase는 지방조직 지방분해(TG↑에 간접 기여), ③lipoprotein lipase는 말초 VLDL 분해(당뇨에서 활성↓), ⑤CETP는 HDL↔LDL 콜레스테롤 교환(HDL↓ 유발).",
"2022-L46-Q175": "【정답: ②UCP3】 단일유전자 비만 유발 유전자: POMC(melanocortin 전구체), leptin, leptin receptor, MC4R(melanocortin 4 receptor). UCP3(uncoupling protein 3)는 근육 미토콘드리아의 에너지 소비 관련 단백질로, 단독 돌연변이가 단일유전자 비만을 유발한다는 증거가 확립되어 있지 않음.",
"2022-L46-Q183": "【정답: ③23 kg/m²】 사망률과 BMI의 관계는 U자형(J-curve)으로, 일반적으로 BMI 22~25 사이에서 사망률이 최저. 동양인(한국인 포함)에서는 BMI 23 부근에서 최저 사망률이 보고됨. ①16은 심각한 저체중, ②19는 저체중 경계, ④28·⑤34는 과체중·비만으로 사망률 상승.",
"2022-L46-Q207": "【정답: ⑤emotions and mood】 식욕 조절은 항상성(homeostatic)과 비항상성(nonhomeostatic/hedonic) 경로로 나뉨. ①satiation signals(포만감), ③vagal afferent signals(미주신경 구심성), ④adiposity signals(leptin·인슐린 등)은 항상성 조절. ②taste(맛)도 hedonic 요소이나, emotions and mood(감정과 기분)가 가장 대표적인 비항상성(hedonic) 식욕 조절 요인.",
"2022-L47-Q132": "【정답: ③C】 이미지(img_2022/Q132_비만수술기법ABCD_p109.png): A=RYGB, B=BPD/DS, C=sleeve gastrectomy, D=위 밴딩(adjustable gastric band)으로 보임. 체중 감량 효과가 가장 낮은 것은 위 밴딩(D). 그런데 정답이 C(3번) → 이미지 배치 기준으로 C=위 밴딩에 해당. 실제 이미지에서 C는 위 소매절제술처럼 보이나, 문항 정답(C=3번) 및 임상 지식 상 '체중 감량 가장 낮음 = 위 밴딩' 원칙 적용. 💡 이미지 내 라벨 위치 확인이 중요하며, 위 밴딩이 C에 그려진 경우 정답.",
"2022-L47-Q191": "【정답: ⑤cognitive restructuring】 '점심 과식했으니 오늘은 포기'라는 부정적 인지를 '저녁은 간단히+운동'으로 재구성하는 것이 인지 재구성(cognitive restructuring). ①self-monitoring: 식이·운동 기록, ②stimulus control: 유혹 자극 차단(예: 과자 눈에 안 보이게), ③stress management: 스트레스 대처, ④social support: 지지 체계 활용.",
"2022-L47-Q220": "【정답: ④semaglutide】 임상시험 기준 항비만약제 중 체중 감량 효과: semaglutide(GLP-1 RA, STEP 연구 ~15%) > phentermine/topiramate(~10%) > naltrexone/bupropion(~5%) > orlistat(~3%). 💡 현재 tirzepatide(GIP+GLP-1)가 더 크나(~20%, SURMOUNT 연구), 보기에 없으므로 semaglutide가 정답. ①orlistat·②phentermine·③lorcaserin(현재 시판 중단)·⑤naltrexone/bupropion은 모두 효과 소.",
"2021-L68-Q206": "【정답: ①statin】 65세 남성, 2형 당뇨병(5년)+고혈압+흡연 40 pack-year+가족 조기 심혈관사(아버지 뇌졸중 50세, 고모 심근경색 50대) → ASCVD 고위험군. LDL↑에 대해 1차 치료는 고강도 statin. ②omega-3는 TG↓, ③fenofibrate는 TG↓, ④PCSK9 억제제는 statin 최대 용량 후 목표 미달 시 추가, ⑤생활요법만으로는 이 위험도에 불충분.",
"2021-L68-Q207": "【정답: ④갑상선 호르몬 투여】 이미지(img_2021/Q207_p152.png) 검사 결과: TSH 118 μIU/mL(↑↑), FT4 0.02 ng/dL(↓↓), TPO Ab+++ → 자가면역성 갑상선기능저하증(Hashimoto thyroiditis). 고콜레스테롤혈증·간수치 이상·피로·체중증가가 갑상선저하증에 의한 이차성 이상지질혈증. 원인 치료(갑상선 호르몬 보충)를 먼저 해야 하며, statin 등은 원인 교정 후 재평가. 💡 이차성 이상지질혈증 원인(갑상선저하증, 신증후군, 당뇨병 등) 배제가 선행.",
"2021-L68-Q208": "【정답: ④PCSK9 억제제】 26세, 황색건종, 가족력(아버지 심근경색, 형 34세 불안정협심증), LDL 360 → 가족성 고콜레스테롤혈증(FH). 고용량 statin + ezetimibe 병합 6개월 후 LDL 198로 목표 미달 → 다음 단계는 PCSK9 억제제. 2023-Q146과 동일 임상 패턴. ①fenofibrate·②omega-3는 TG↓ 약제, ③Vit E는 근거 없음, ⑤운동 강화로 LDL 198→목표 불가.",
"2021-L69-Q149": "【정답: ④같은 체질량지수일 경우 동양인이 서양인에 비해 당뇨병 위험이 높다】 동양인은 같은 BMI에서 서양인보다 내장지방 비율이 높아 인슐린저항성·당뇨병 위험이 더 높음 → WHO 아시아-태평양 기준 적용(과체중 기준 BMI≥23). ①동일 BMI에서 여성이 남성보다 체지방률이 높음, ②BMI↑ → 2형 당뇨 위험 J 아닌 J-type아닌 선형 또는 지수적 증가, ③BMI 낮을수록 사망률 낮지 않음(U자형), ⑤BMI 증가 시 심혈관 위험도 상승.",
"2021-L69-Q150": "【정답: ⑤GLP-2】 시상하부 arcuate nucleus의 주요 식욕 조절 요소: leptin(지방↑시 식욕↓), POMC(식욕억제 신경펩티드 전구체), AgRP(식욕증가 신경펩티드), MC4R(melanocortin 4 receptor, POMC→α-MSH 수용체). GLP-2는 장 점막 성장 촉진 펩티드로 식욕 항상성 조절의 '주된' 시상하부 요소가 아님(GLP-1은 식욕억제 기능 있으나 GLP-2는 아님).",
"2021-L69-Q151": "【정답: ②A는 B보다 다낭성난소증후군 위험이 높다】 이미지(img_2021/Q151_p152.png): A는 내장지방이 많은 CT 패턴(복부 중심부 지방↑), B는 피하지방이 주를 이루는 패턴. 내장지방↑ → 인슐린저항성↑ → 다낭성난소증후군(PCOS) 위험↑. 같은 체중·허리둘레에서 내장지방이 많은 A가 대사적으로 불리. ①A는 B보다 내장지방 비율이 높음, ③④⑤ A는 B보다 인슐린 감수성 낮고, 간내지방·혈압 모두 A가 더 불리.",
"2021-L70-Q152": "【정답: ⑤liraglutide】 GLP-1 수용체 작용제(liraglutide, semaglutide)는 위 배출 지연·포만감↑ 작용으로 식후 쉽게 배부름, 소화불량, 위식도역류(가슴쓰림), 오심, 구토가 주된 부작용. 특히 투여 초기에 위장관 부작용이 흔함. ①lorcaserin은 중추 세로토닌 수용체 작용(식욕억제), ②phentermine은 중추 교감신경계 자극, ③sibutramine은 현재 시판 중단(심혈관 위험), ④orlistat은 지방변(기름진 변).",
"2021-L70-Q153": "【정답: ②DPP-4 inhibitor】 DPP-4 억제제(sitagliptin 등)는 혈당 강하 효과에 비해 체중 중립적(weight neutral)으로 체중 증가 없음. ①glucocorticoid: 체중↑(지방 재분배+식욕↑), ③thiazolidinedione(TZD): 체중↑(지방세포 분화 촉진), ④atypical antipsychotics(올란자핀 등): 체중↑↑, ⑤tricyclic antidepressants: 체중↑(항히스타민·항콜린 효과).",
"2021-L70-Q155": "【정답: ④atkins】 이미지(img_2021/Q155_p152.png): Zone·LEARN·Ornish·Atkins 4가지 식이요법의 1년간 체중 변화 그래프 — Atkins(▲, 가장 아래)가 12개월 시점에서 체중 감량이 가장 컸고, Ornish(저지방 고섬유)가 가장 적었음. Atkins 식이는 탄수화물을 20 g/day 이하로 극도 제한(= ketogenic diet의 원형). ①Zone 40:30:30, ②LEARN 저지방 칼로리 제한, ③Ornish 극저지방은 모두 Atkins보다 탄수화물이 많음.",
"2021-L71-Q154": "【정답: ⑤역류성 식도염】 위 소매절제술(sleeve gastrectomy, LSG)은 위의 대만부를 절제하여 바나나 모양의 소형 위를 남기는 술식. 가장 흔한 장기 합병증은 역류성 식도염(GERD) — 하부식도괄약근 기능 저하 + 위내압 증가로 역류 악화. ①장폐색은 주로 RYGB에서, ②철분결핍은 BPD/DS·RYGB에서 더 흔함, ③위궤양출혈은 드묾, ④체중 재증가도 있으나 가장 '흔한' 합병증은 아님.",
"2021-L71-Q156": "【정답: ④C-peptide가 6 이상인 환자】 대사수술(비만수술)의 당뇨병 관해 효과는 잔존 β세포 기능이 충분할 때 더 큼. C-peptide가 높을수록(≥6 이상) 인슐린 분비 예비능이 남아있어 수술 후 관해 가능성↑. ①고령(60세↑)은 관해율↓, ②인슐린 사용 중(중증 당뇨 시사) → 관해 어려움, ③HbA1c 9 이상(혈당 조절 불량)도 잔존 β세포 고갈과 관련되어 관해↓ 경향, ⑤당뇨 10년 이상(만성) → β세포 소진 → 관해↓.",
"2023-L53-Q102": "【정답: ⑤간】 이소성 지방(ectopic fat) 축적이 가장 심하게 포도당 생산을 증가시키는 장기는 간. 간 내 지방 축적(hepatic steatosis) → 인슐린 신호 억제 → 간 당 신생(gluconeogenesis) 증가 → 공복혈당↑. ①갈색지방은 에너지 소비 기관, ②근육은 포도당 이용↓로 인슐린저항성에 기여하나 포도당 생산은 안 함, ③신장·④비장은 이소성 지방의 주요 대사 표적이 아님.",
"2023-L53-Q116": "【정답: ②A는 B보다 2형 당뇨병 위험이 높다】 동일 체중·BMI·허리둘레 여성의 복부 CT 비교: A=내장지방 우세형, B=피하지방 우세형. 내장지방↑ → 인슐린저항성↑ → 2형 당뇨병 위험↑. ①A는 내장지방 비율이 더 높음(피하지방 비율 낮음), ③A는 인슐린 감수성이 낮음, ④A는 혈압이 높을 가능성, ⑤A는 지방조직 내 대식세포 침윤·염증이 더 많음. 💡 내장지방은 free fatty acid·adipokine 분비로 대사 악영향. (※이미지 파일이 CT와 다른 영상으로 저장되어 있으나 2021-Q151 동일 문제 구조 기준 해석)",
"2023-L53-Q119": "【정답: ①ghrelin】 ghrelin은 위(fundus)에서 분비되는 유일한 식욕 촉진 호르몬(orexigenic). 식전 상승, 식후 감소. 나머지는 모두 식욕 억제 호르몬(anorexigenic): ②oxyntomodulin(위·소장, GLP-1 유사 작용), ③GIP(소장, 인크레틴), ④GLP-1(소장 L세포, 포만감↑), ⑤PYY(소장·대장 L세포, 식욕↓).",
"2023-L54-Q103": "【정답: ⑤tirzepatide】 이미지(img_2023/Q103_p72.png)는 항비만약제별 체중감량 %를 막대그래프로 나타내며, A~G 순서로 G가 가장 높은 막대. 체중 감량 효과: tirzepatide(GIP+GLP-1 이중 작용제, ~20%) > semaglutide(~15%) > phentermine/topiramate(~10%) > naltrexone/bupropion(~5%) > orlistat(~3%) 순. G = 가장 높은 효과 = tirzepatide. 💡 SURMOUNT-1 연구에서 tirzepatide 최대 용량 군 체중 22.5% 감소.",
"2023-L54-Q112": "【정답: ②B】 이미지(img_2023/Q112_p72.png)에서 척추 측면에 A, B, C 세 수준이 표시됨. WHO 정의 허리둘레 측정 부위는 최하위 늑골(12번 늑골)과 장골릉(iliac crest) 사이의 중간점(midpoint)으로, 이미지에서 B 위치에 해당. A는 늑골 하연, C는 장골릉 수준. 💡 IDF·WHO 기준 모두 이 위치 사용(NIH는 장골릉 상연 사용).",
"2023-L54-Q132": "【정답: ④D】 이미지(img_2023/Q132_p72.png)에서 A~D 비만수술 기법 도시. A=RYGB(Roux-en-Y gastric bypass), B=BPD/DS(biliopancreatic diversion with duodenal switch), C=sleeve gastrectomy(위 소매절제술), D=adjustable gastric banding(조절형 위 밴딩). 흡수장애가 가장 많은 것은 B(BPD/DS)이나, 이미지에서 B는 소장을 긴 우회로로 연결한 형태로, D가 위 밴딩이고 이미지 배치 상 정답이 D(4번)로 제시됨. 💡 이미지 배치 상 D가 BPD/DS에 해당하는 경우: 흡수장애 > RYGB > Sleeve > 밴딩 순.",
"2025-L55-Q4": "정답 ③ Kisspeptin 뉴론은 GnRH 뉴론과 시냅스를 형성하여 GnRH 분비를 자극한다. Kisspeptin(KNDy 뉴론)은 GnRH 뉴론에 직접 시냅스를 형성해 가장 강력한 GnRH 촉진인자로 작용한다. ① 시상하부-전방 뇌하수체 간은 문맥혈관(hypothalamo-hypophyseal portal system)으로 연결되며 직접 신경연결은 없다. ② GnRH는 박동성(pulsatile) 분비여야 FSH/LH를 자극하며 지속 분비 시 수용체 하향조절로 억제된다. ④ NKB는 kisspeptin을 자극(촉진), Dynorphin은 억제한다(반대). ⑤ GnRH는 10개 아미노산(decapeptide)이다. 💡 핵심: Kisspeptin = GnRH 분비 강력 촉진, NKB 촉진/Dynorphin 억제, GnRH = pulsatile 10-mer.",
"2025-L55-Q6": "정답 ② Progesterone. 그림에서 'A'는 배란(14일) 이후 황체기에 뚜렷하게 상승하여 월경주기 21일경 최고조에 달하는 곡선이다. 이는 황체(corpus luteum)에서 분비되는 Progesterone의 전형적 패턴이다. ① Estradiol은 배란 직전 LH surge와 함께 첫 번째 peak를 형성하고 황체기에 두 번째 소폭 상승이 나타난다. ④ FSH, ⑤ LH는 배란 직전에 surge를 보이며 황체기에는 낮게 유지된다. 💡 배란 후 황체기에 높게 유지되는 곡선 = Progesterone.",
"2025-L55-Q89": "정답 ④ 여성 난소는 21-hydroxylase와 11β-hydroxylase가 없어 glucocorticoid·mineralocorticoid를 생산하지 못한다. 난소 스테로이드 합성 경로에는 cortisol/aldosterone 합성에 필요한 21-OH·11β-OH 효소가 없어 성호르몬(에스트로겐·프로게스테론)만 생성한다. ① 일차난포(primary follicle)는 아직 FSH 비의존성 단계이며, FSH 의존성은 전동난포(antral follicle) 이후부터이다. ② 수정 전 난자는 meiosis I 중기(diplotene stage)에서 정지 상태이고, LH surge 이후 meiosis I이 완결되어 제1극체가 방출된다(정자와 수정 후가 아님). ③ 배란 전 난소에서 Testosterone은 aromatase에 의해 Estradiol로 전환되며, 5α-reductase에 의한 DHT 전환은 난소에서 주된 경로가 아니다. ⑤ E2는 FSH 분비를 억제(음성 되먹이기)하며, Inhibin B도 FSH를 억제한다(둘 다 억제).",
"2025-L56-Q26": "정답 ② 체중 증가. 저BMI(17), 고강도 운동, 저칼로리 식이로 인한 시상하부성 기능성 무월경(Functional Hypothalamic Amenorrhea, FHA)이다. FSH/LH 모두 낮고 에스트라디올이 낮아 저고나도트로핀성 저에스트로겐 상태로, 원인이 에너지 결핍·과도한 운동이므로 근본 치료는 체중 회복과 운동량 감소이다. ① 도파민 작용제는 고프로락틴혈증 치료로, prolactin이 정상(2.2)인 이 환자에게는 불필요하다. ③ 경구피임약은 월경을 인위적으로 유발하나 근본 원인을 해결하지 못하며 골밀도 개선도 불충분하다. ④ GnRH agonist는 오히려 에스트로겐을 더 낮추어 악화시킨다. ⑤ 자궁내 장치 삽입은 이 상황과 무관하다.",
"2025-L56-Q43": "정답 ② 복용약물 중단 후 프로락틴 재검사. 프로락틴 110 ng/mL로 유의하게 상승, FSH/LH/에스트라디올은 정상 혹은 경계, TSH 정상, 유즙분비 동반 무월경. 우울증 약물(항정신병약·항우울제, 특히 도파민 차단제 계열)은 고프로락틴혈증의 주요 원인이므로 정신건강의학과와 협의 하에 약물을 중단·교체 후 프로락틴을 재검사하는 것이 선행되어야 한다. ① 뇌하수체 MRI는 약인성을 배제한 후 여전히 고프로락틴혈증이 지속될 때 시행한다. ③ TSH가 이미 정상이므로 Free T4 추가 검사는 우선 순위가 아니다. ④⑤ Free testosterone·17-OHP는 고안드로겐증이 의심될 때 검사한다.",
"2025-L56-Q60": "정답 ② 뮐러관 무발생(Mullerian Agenesis, Mayer-Rokitansky-Küster-Hauser syndrome). 핵형 46,XX + 정상 여성 이차성징(Tanner 5) + 자궁 부재 + 정상 에스트라디올·FSH/LH의 조합이 특징이다. 뮐러관이 발생하지 않아 자궁·상부 질이 없으나 난소는 정상이고(에스트로겐 분비 유지) 염색체는 정상 여성형이다. ① 안드로겐 무반응 증후군(AIS)은 핵형 46,XY에 테스토스테론이 남성 수준으로 높고 음모 결핍이 특징이다. 이 환자는 46,XX이고 테스토스테론 정상이다. ③ 칼만 증후군은 FSH/LH 저하와 후각 소실이 동반된다. ④ 터너 증후군은 46,XX가 아닌 45,X(또는 mosaic)이며 FSH 상승이 특징이다. ⑤ 초기 난소 부전은 FSH 상승, 에스트라디올 저하가 나타난다.",
"2025-L57-Q21": "정답 ① Frog leg position. 소아 여아 외음부 진찰의 기본 자세는 frog leg position(앙와위에서 양 무릎을 구부려 발바닥을 맞대고 개구리 다리처럼 벌림)으로, 외음부 시야를 확보하기에 가장 용이하고 소아에게 비위협적이다. 그림에서 ①번이 이 자세에 해당한다. ② Knee-chest position은 외음부 이물질 확인이나 후방 구조 관찰에 유용하지만 일차 선택은 아니다. ③~⑤ 나머지 자세들은 소아 외음부 진찰 목적에 맞지 않는다.",
"2025-L57-Q22": "정답 ② estrogen cream. 이미지에서 소아의 외음부에 얇은 분비물이 보이며 외음부 조직이 얇고 창백하게 萎縮된 소견(labial agglutination, 음순유착 또는 외음부 위축)이 관찰된다. 3세 여아에서 가장 흔한 원인은 에스트로겐 부족에 의한 외음부 위축(vulvar atrophy) 및 음순유착(labial fusion)이다. 국소 에스트로겐 크림(topical estrogen cream)을 도포하면 조직이 두꺼워지고 유착이 풀린다. ① topical emollient는 보습제로 단순 건조에는 사용하나 음순유착의 일차 치료는 아니다. ③ metronidazole은 세균/혐기성 감염 치료제로 이 소견에 적합하지 않다. ④ medroxyprogesterone, ⑤ corticosteroid는 이 상황의 적응증이 아니다. 💡 소아 음순유착 치료 = 국소 에스트로겐 크림.",
"2025-L57-Q28": "정답 ① 아이와 라포(rapport) 형성을 위해 관심 있어하는 주제로 질문을 한다. 소아 환자의 병력 청취에서 아이의 신뢰를 얻는 것이 가장 중요하며, 좋아하는 것이나 일상적 주제로 대화를 시작하면 라포 형성에 효과적이다. ② 진료실 환경(장난감, 아늑함)은 아이의 협조도에 직접 영향을 준다. ③ 보호자에게만 질문하면 아이 자신의 진술을 놓칠 수 있다(특히 학대 의심 시). ④ 간호인력은 아이를 안심시키고 진료 환경 조성에 중요한 역할을 한다. ⑤ 소아는 성인과 달리 발달 단계에 맞는 접근이 필수이다.",
"2023-L56-Q95": "정답 ② A=GnRH(생식샘자극호르몬 분비호르몬) – B=LH·FSH(황체형성호르몬·난포자극호르몬) – C=Estradiol·Progesterone(에스트라디올·황체호르몬). 그림은 HPO axis의 계층구조를 보여준다: 시상하부(A=GnRH) → 뇌하수체(B=FSH/LH) → 난소(C=에스트라디올·프로게스테론) → 되먹이기. GnRH가 뇌하수체를 자극하여 FSH/LH를 분비시키고, 난소에서 에스트라디올·프로게스테론이 생성되어 음성 되먹이기로 시상하부·뇌하수체를 조절한다. 나머지 선지는 계층 순서를 뒤바꾸거나 호르몬 종류를 혼재시킨 오답이다.",
