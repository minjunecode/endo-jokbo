으로 사용하는 것이 권장된다.","모든 환자에서 당화혈색소는 6.5% 미만을 목표로 한다.","인지 장애 선별 검사는 중증 증상이 있을 경우만 시행한다.","골밀도가 정상이어도 낙상으로 인한 골절의 위험이 증가한다."],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q159"},{"id":"2022-L40-Q172","year":2022,"qnum":172,"jokbo_lec_no":40,"lecture":"임신성/노인당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"36세 여성이 임신 중 처음 진단된 고혈당으로 병원에 왔다. 임신 26주에 시행한 75g 당부하 검사 결과 공복 혈당 112 mg/dL, 1시간 혈당 190 mg/dL, 2시간당 혈당 174 mg/dL였다. 임신성 당뇨병에 대한 교육 후 생활 습관을 철저히 조절하였음에도 불구하고 공복혈당이 지속적으로 110 mg/dL 이상, 식후 혈당이 150 mg/dL 이상이었다. 가장 우선적으로 고려할 치료는?","stem_table":null,"options":["인슐린","메트포르민","설폰요소제","GLP1 유사체","SGLT2 억제제"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q172"},{"id":"2022-L41-Q156","year":2022,"qnum":156,"jokbo_lec_no":41,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"42세 남성이 응급실에 실려왔다. 이 남자는 고속도로 터널 공사 현장이 무너져내리면서 갇혀 지낸 지 9일 만에 구조된 상태였으며, 그동안 물 외에는 섭취한 음식이 없이 버텨왔다고 하였다. 다음 중 정상인에 비해 이 환자의 호기가스(expiratory gas)에서의 농도가 높을 가능성이 가장 높은 분자는?","stem_table":null,"options":["Acetoacetate","Acetone","Acetyl CoA","Benzene","3-Hydroxybutyrate"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q156"},{"id":"2022-L41-Q181","year":2022,"qnum":181,"jokbo_lec_no":41,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"당뇨병이 전혀 없는 건강한 사람이 실수로 인슐린을 투약했다. 위 상황에서 저혈당이 발생했다. 혈당 50mg/dL인 상태에서 채혈했을 때, 혈중 c-peptide, insulin 농도를 고르시오.","stem_table":null,"options":["plasma insulin < 3uU/mL, plasma c-peptide <0.6ng/mL","plasma insulin > 3uU/mL, plasma c-peptide <0.6ng/mL","plasma insulin < 3uU/mL, plasma c-peptide >0.6ng/mL","plasma insulin > 3uU/mL, plasma c-peptide >0.6ng/mL","plasma c-peptide <0.6ng/mL이며 plasma insulin은 예측할 수 없다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q181","reparsed":true},{"id":"2022-L41-Q199","year":2022,"qnum":199,"jokbo_lec_no":41,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"52세 남자가 두근거림과 심한 어지러움으로 왔다. 응급실에 도착하여 시행한 혈액 검사에서 glucose 42mg/dL, c-peptide 1.7 ng.mL, insulin 20.1 μ U/mL였다. 2년 전 위암으로 위절제술을 시행한 병력 외 당뇨병 등 만성 질환은 없었다. 1년 전부터 식사량도 수술 전 만큼 회복하였고, 식후 2시간 정도 경과 되었을 때 간헐적으로 식은땀, 무기력, 어지러움을 경험하는 것 외 전신 상태는 양호하다고 하였다. 이 환자에게 가장 우선적으로 시행해 볼 처치로 적절한 것을 고르시오.","stem_table":null,"options":["72시간 공복 검사","1회 섭취 음식량의 감량","Metformin 투약","복부 CT","단순당 섭취 증량"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q199"},{"id":"2022-L41-Q214","year":2022,"qnum":214,"jokbo_lec_no":41,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"당뇨병이 전혀 없는 건강한 사람이 실수로 인슐린을 투약했다. 가장 먼저 발생하는 변화를 고르시오.","stem_table":null,"options":["내인성 인슐린 분비 감소/억제","글루카곤 분비 증가","에피네프린 분비 증가","코르티솔 분비 증가","성장호르몬 분비 증가"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q214"},{"id":"2022-L42-Q161","year":2022,"qnum":161,"jokbo_lec_no":42,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"34세 여자가 건강검진을 위해 검진 전날 저녁 6시 이후로 물 외에는 경구 섭취하지 않은 상태에서, 검진 당일 실수로 아침 식사를 섭취하였다. 해당 검진자가 당일 아침식사를 하지 않았을 경우에 비해 아침식사를 한 이후 혈액 내에 두드러지게 증가하는 지단백질 형태는?","stem_table":null,"options":["Chylomicrons","Apolipoprotein A","Low density lipoproteins","High density lipoproteins","Very low density lipoproteins"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q161"},{"id":"2022-L42-Q166","year":2022,"qnum":166,"jokbo_lec_no":42,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"인슐린저항성, 당뇨병이 있는 환자에서 지질단백 대사는 특징적인 양상을 보인다. 말초 조직과 간에서의 인슐린저항성에 의한 지질단백 대사의 변화 중 옳은 것은?","stem_table":null,"options":["Apo-A1 지단백의 증가","small-dense LDL의 증가","고밀도콜레스테롤 상승","지방조직에서 지방분해(lipolysis) 감소","Cholesteryl Ester Transfer protein (CETP) 활성화 감소"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q166"},{"id":"2022-L42-Q182","year":2022,"qnum":182,"jokbo_lec_no":42,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"영희는 점심에 배달음식으로 배부르게 식사를 하였다. 식후 2시간후 영희의 지방조직(adipose tissue)에서 일어나고 있는 에너지대사작용으로 가장 가능성이 낮은 것은?","stem_table":null,"options":["Glucose로부터 triacylglycerol 생합성이 증가되고 있다.","간(liver)로부터 유래된 VLDL을 통해 유입되는 fatty acid가 증가되어 있다.","세포표면의 Glut4 발현이 증가되어 있다.","모세혈관 표면의 lipoprotein lipase 양이 감소되어 있다.","Pentose phosphate pathway가 활성화되어 있다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q182"},{"id":"2022-L43-Q135","year":2022,"qnum":135,"jokbo_lec_no":43,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"27세 남자가 심한 복통으로 응급실에 왔다. 검사 결과 급성췌장염으로 수액 및 약물 치료를 시작하며 시행한 혈액 검사상 중성지방(triglyceride)이 2300mg/dl(정상 150mg/dl 이하)으로 측정되었고, amylase/lipase가 정상의 10배 이상 상승되었다. 담도 및 췌장관에 돌이나 종양 등의 특이 소견은 발견되지 않았다. 환자는 음주력은 부인하였다. 과거력상 3년 전에 갑작스러운 시력 장애로 망막에 이상이 있어 치료를 받았으며, 그 당시에도 중성지방이 높다는 소견을 들었으나, 이후 특별한 약물 치료를 시행하지 않았다. 환자에게 예상되는 이상소견으로 가장 적합한 것은?","stem_table":null,"options":["PCSK9","Lipoprotein lipase","Apolipoprotein A","Apolipoprotein B","Cholesteryl Ester Transfer Protein (CETP)"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q135"},{"id":"2022-L43-Q138","year":2022,"qnum":138,"jokbo_lec_no":43,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"42세 여자가 당뇨병으로 5년 전 진단받고, metformin과 DPP4 inhibitor로 치료 중이다. 시행한 검사에서 T. Cholesterol/Triglyceride/HDL-C/LDL-C 230/190/35/102 mg/dL로 측정되었다. 인슐린 저항성, 당뇨병이 동반된 환자에서 지질단백의 내부의 지질 성분 교환을 촉진하며 HDL-C의 분해를 촉진하고, LDL-C의 생성 및 small dense LDL-C의 생성을 촉진하게 되는 물질은 무엇인가?","stem_table":null,"options":["PCSK9","Hormone sensitive lipase","Lipoprotein lipase","MTP(microsomal TG transfer protein)","Cholesteryl Ester Transfer Protein (CETP)"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q138"},{"id":"2022-L43-Q152","year":2022,"qnum":152,"jokbo_lec_no":43,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"28세 남자가 발목 주위 아킬레스건이 두꺼워 운동할 때마다 불편하여 정형외과에 내원하였다. 이전 병원에 내원하여 검사한 병력은 없었고, 아버지가 뇌졸중으로 사망하였고, 형이 36세에 불안정성 협심증으로 스텐트 시술을 시행하였다. 신체검진과 X-ray 소견상 황색건종(tendon xanthoma)가 발견되어 혈액검사를 시행하였고, 결과는 다음과 같다.\n- T.cholesterol / TG / HDL-C / LDL-Cholesterol: 450 / 80 / 40 / 395 mg/dl\n이 환자에서 고용량의 스타틴과 에제티미브 병합 치료를 6개월간 시행하였으나 LDL-cholesterol의 수치는 208mg/dl이었다. 고지혈증 치료 가이드라인을 고려하여 다음에 시행할 치료로 가장 맞는 것은?","stem_table":null,"options":["Fenofibrate","Omega-3 Fatty acid","고용량 Vitamin E","PCSK9 억제제","고강도의 운동 강화 치료"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q152"},{"id":"2022-L44-Q157","year":2022,"qnum":157,"jokbo_lec_no":44,"lecture":"이상지질혈증의 치료약물기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"저밀도 콜레스테롤(low density lipoprotein)의 대사에 중요하며 저밀도 콜레스테롤 수용체에 부착되어 간 세포내에서 쉽게 lysosome 내의 분해를 유도하여, 저밀도콜레스테롤 수용체의 재활용을 방해하는 물질로 최근 이에 대한 억제제(inhibitor)가 치료에 사용되고 있는 물질은 무엇인가?","stem_table":null,"options":["PCSK9","Apolipoprotein A","Apolipoprotien CII","Hormone sensitive lipase","Cholesterylester Transfer Protein (CETP)"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q157"},{"id":"2022-L44-Q208","year":2022,"qnum":208,"jokbo_lec_no":44,"lecture":"이상지질혈증의 치료약물기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"다음 중 Ezetimibe 약물의 고지혈증 치료기전으로 가장 적절한 것은?","stem_table":null,"options":["소장 융모(brush border)에서 콜레스테롤 흡수를 억제함.","위 점막 상피세포에서 콜레스테롤 대사를 촉진함.","대장 상피세포에서 콜레스테롤 대사를 억제함.","콜레스테롤과 결합해서 소변으로 배출을 증가시킴.","담즙산의 장-간 순환을 방해해서 콜레스테롤 대사를 억제함."],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q208"},{"id":"2022-L44-Q209","year":2022,"qnum":209,"jokbo_lec_no":44,"lecture":"이상지질혈증의 치료약물기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"다음의 약물 중 지방세포에서 TG의 분해를 억제하여 free fatty acids의 생성을 억제하는 효과가 크고, LPL 효소의 활성을 증가시키며, 이를 통해 Chylomicron, VLDL의 대사를 촉진하고, apoA-1 단백질 분해를 억제하는 효과가 있는 약물로 가장 적절한 것은?","stem_table":null,"options":["Colestipol","Ezetimibe","Fenofibrate","Niacin","Simvastatin"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q209"},{"id":"2022-L45-Q124","year":2022,"qnum":124,"jokbo_lec_no":45,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"45세의 남자가 건강검진에서 LDL cholesterol 180mg/dL (참고치, <100mg/dL), triglycerides 210mg/dL 결과를 받았다. 환자는 이후 simvastatin 40mg을 처방받아 복용하여, LDL cholesterol을 100mg/dL로 낮추었으나, triglycerides가 여전히 200mg/dL로 높은 상태를 유지하고 있다. 이에 다른 약물을 추가 투여하기로 결정하였다. 추가 약제로 가장 적절한 것은?","stem_table":null,"options":["Atorvastatin","Colestipol","Ezetimibe","Gemifibrozil","Nicotinamide"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q124"},{"id":"2022-L45-Q149","year":2022,"qnum":149,"jokbo_lec_no":45,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"58세 여자로 7년 전에 2형 당뇨병으로 진단받고, 경구약물치료 중이었고, 3년 전 불안정성 협심증이 있어 관상동맥 스텐트 시술을 받았고 고혈압약물, 항혈소판제를 복용 중이다. 가족력상 아버지가 40대에 뇌졸중으로 사망하였고, 언니도 50대에 심근경색으로 사망하였다. 흡연력이 있고 30 pack/year였다. 키 163cm, 몸무게 63kg으로 혈액 지질검사 수치는 다음과 같다.\n- T. chol / TG / HDL / LDL = 220 / 170 / 38 / 145 mg/dL\n이 환자의 위험도를 고려한 1차 치료제로 가장 맞는 것은?","stem_table":null,"options":["Statin","Omega-3 fatty acid","Fenofibrate","PCSK9 억제제","약물 치료 없이 생활운동 요법만 시행"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q149"},{"id":"2022-L45-Q200","year":2022,"qnum":200,"jokbo_lec_no":45,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"39세의 남자가 건강검진에서 우연히 발견된 혈액 검사 이상 소견으로 내원하였다. 가족력으로는 아버지가 44세에 뇌졸중이 발생한 바 있다. 재검한 공복 혈액검사 소견은 다음과 같다. 이 환자에서 일차 치료의 표적이 될 수 있는 효소는?\n- Total cholesterol 347 mg/dL (참고치 150-200 mg/dL)\n- High-density lipoprotein cholesterol: 32 mg/dL (참고치 40-80 mg/dL)\n- Triacylglycerol: 140 mg/dL (참고치 0-150 mg/dL)\n- Low-density lipoprotein cholesterol: 286 mg/dL (참고치 0-100 mg/dL)","stem_table":null,"options":["Phosphocarboxylase serine kinase 9","Acyl CoA dehydrogenase","Malate dehydrogenase","HMG CoA reductase","HMG CoA synthase"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q200"},{"id":"2022-L45-Q190","year":2022,"qnum":190,"jokbo_lec_no":45,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"인슐린저항성, 당뇨병이 있는 환자에서 지질단백 대사는 특징적인 양상을 보인다. 말초 조직과 간에서의 인슐린저항성에 의한 지질단백 대사의 변화 중 옳은 것은?","stem_table":null,"options":["PCSK9","Hormone sensitive lipase","Lipoprotein lipase","MTP(microsomal TG transfer protein)","Cholesteryl Ester Transfer Protein (CETP)"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q190"},{"id":"2022-L46-Q175","year":2022,"qnum":175,"jokbo_lec_no":46,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"단일 유전자 돌연변이에 의한 비만을 일으키는 유전자가 아닌 것은?","stem_table":null,"options":["POMC","UCP3","Leptin","Leptin receptor","MC4R"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q175"},{"id":"2022-L46-Q183","year":2022,"qnum":183,"jokbo_lec_no":46,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"다음 중 일반적으로 사망률이 가장 낮은 것으로 알려진 체질량지수는? (단위, kg/m","stem_table":null,"options":["16","19","23","28","34"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q183"},{"id":"2022-L46-Q207","year":2022,"qnum":207,"jokbo_lec_no":46,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"식욕 조절 인자 중 비항상성 조절과 관련 있는 것 (nonhomeostatic factor)은?","stem_table":null,"options":["satiation signals","taste","vegal afferent signals","adiposity signals","emotions and mood"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q207"},{"id":"2022-L47-Q132","year":2022,"qnum":132,"jokbo_lec_no":47,"lecture":"비만의 치료(내,외과적)","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"다음 비만 수술 기법 중 체중 감량 효과가 가장 낮은 것은?","stem_table":null,"options":["A","B","C","D","체중 감량 효과는 모두 비슷"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q132ABCDp109_64e2a3c9.png","note":null,"id_simple":"2022-Q132"},{"id":"2022-L47-Q191","year":2022,"qnum":191,"jokbo_lec_no":47,"lecture":"비만의 치료(내,외과적)","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"\"철저한 식단관리를 하던 중 피치 못하게 점심에 과식을 한 경우, 오늘은 안 되겠다고 포기하여 저녁에도 과식을 해 버리지 말고, 저녁은 간단히 먹고 운동을 하도록 하십시오.\" 위와 같은 대화는 행동치료 기법 중 어디에 속하는가?","stem_table":null,"options":["self-monitoring","stimulus control","stress management","social support","cognitive restructuring"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q191"},{"id":"2022-L47-Q220","year":2022,"qnum":220,"jokbo_lec_no":47,"lecture":"비만의 치료(내,외과적)","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"다음 약제 중 체중 감량 효과가 가장 큰 것은?","stem_table":null,"options":["orlistat","phentermine","locaserin","semaglutide","naltrexone/bupropion"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q220"},{"id":"2022-L48-Q148","year":2022,"qnum":148,"jokbo_lec_no":48,"lecture":"소아청소년 비만","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"10세 남아가 체중이 많이 나가 병원에 왔다. 키는 140cm, 체중 50kg였다. 진단은?","stem_table":"| 백분위수 | 85백분위수 | 95백분위수 | 97백분위수 |\n|--|--|--|--|\n| 체질량지수 (kg/m2) | 21.2 | 23.1 | 23.9 |","options":["정상","과체중","1단계 비만","2단계 비만","3단계 비만"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q148"},{"id":"2022-L48-Q158","year":2022,"qnum":158,"jokbo_lec_no":48,"lecture":"소아청소년 비만","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"14세 여아가 체중이 많이 나가 병원에 왔다. 머리 손상이나 발달지연은 없었다.\n가능한 진단은?","stem_table":null,"options":["단순 비만","쿠싱 증후군","시상하부성 비만","프라더-윌리 증후군","선천성 뇌하수체 저하증"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q158p109_cec4fd9b.png","note":null,"id_simple":"2022-Q158"},{"id":"2022-L49-Q140","year":2022,"qnum":140,"jokbo_lec_no":49,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"73세 남자가 기운이 없고 자주 넘어진다고 한다. 근감소증이 의심될 때, 첫 번째 시행할 평가 방법은?","stem_table":null,"options":["Handgrip strength","DXA","Gait speed","SPPB","TUG"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q140"},{"id":"2022-L49-Q194","year":2022,"qnum":194,"jokbo_lec_no":49,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"노인에서 근력 및 근육량을 잘 유지하기 위해서 적절한 단백질 섭취가 중요하다. 다음 아미노산 중 근육 합성을 촉진하는 것은?","stem_table":null,"options":["leucine","glutamine","proline","alanine","tryptophan"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q194"},{"id":"2022-L49-Q197","year":2022,"qnum":197,"jokbo_lec_no":49,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"노화에 따른 Andropause는 다음 중 어떤 호르몬의 변화와 관계가 있는가?","stem_table":null,"options":["성장호르몬","테스토스테론","멜라토닌","에스트라디올","코티솔"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q197"},{"id":"2022-L50-Q134","year":2022,"qnum":134,"jokbo_lec_no":50,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"12세 남아가 키가 작고 체중이 많이 나가 병원에 왔다. 어렸을 때부터 계속 작고 체중이 많이 나가는 편이었다. 출생시 난산이었으며, 신생아기에 경련으로 병원에 입원했던 적이 있으나 발달 지연은 없었다. 키는 134cm(<3 백분위수), 체질량지수 25.2kg/m2 (>95 백분위수)였고, 고환은 양쪽 모두 2mL, 음경은 성성숙도 1단계였다.\n가장 가능성이 높은 진단은?","stem_table":null,"options":["단순 비만","쿠싱 증후군","뇌하수체 저하증","시상하부성 비만","프라더-윌리 증후군"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q134p110_07115838.png","note":null,"id_simple":"2022-Q134"},{"id":"2022-L50-Q184","year":2022,"qnum":184,"jokbo_lec_no":50,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키가 많이 자라 병원에 왔다. 임신 나이 40주, 출생체중 3,000 g로 출생하였다. 최근 2년 동안 야외활동이 적어지면서 체중이 급격하게 늘었다. 키 152cm (50백분위수), 체중 58 kg (90백분위수), 체질량지수(95백분위수)이다. 고환은 1mL, 음모는 없다. 간과 지라는 만져지지 않는다. 검사결과는 다음과 같다. 조치는?\n- 혈액: 공복포도당 94mg/dL, 칼슘 9.7 mg/dL, 인 4.7 mg/dL\n- 아스파르테이트아미노전달효소 18 U/L, 알라닌아미노전달효소 57 U/L\n- 당화혈색소 5.8%, 유리 T4 1.02 ng/dL (참고치 0.8~1.7)\n- 뼈나이: 7세","stem_table":null,"options":["검사없이 조치","뇌자기공명영상촬영","고용량 덱사메타손 억제검사","밤사이 1mg 덱사메타손 억제검사","경구당부하 후 성장호르몬농도 측정"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q184p110_58b80d09.png","note":null,"id_simple":"2022-Q184"},{"id":"2022-L50-Q195","year":2022,"qnum":195,"jokbo_lec_no":50,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키와 체중이 작아 병원에 왔다. 임신 나이 38주에 출생체중 2.900g (임신나이 기준 10백분위수 이상)로 출생하였다. 출생 후 황달은 없었으며, 이제까지 두부손상, 저혈당, 경련, 만성 설사는 없었다. 1세 때 체중 7 kg이었다. 발달은 정상이고, 아이는 키 작은 것에 대해 예민하게 반응한다. 아버지 키는 164cm, 어머니는 키가 154cm로 초경을 중1 때 하였다. 뼈나이는 6세이다.\n진단은?","stem_table":null,"options":["부당경량아","가족성저신장","체질성장지연","갑상샘저하증","성장호르몬 결핍증"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q195p110_15c2c6ce.png","note":null,"id_simple":"2022-Q195"},{"id":"2022-L50-Q210","year":2022,"qnum":210,"jokbo_lec_no":50,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"8세 여아가 키가 잘 자라지 않아서 병원에 왔다. 임신 나이 38주에 출생체중 2,910 g로 출생하였으며, 신생아선별검사는 정상이었다. 유방은 만져지지 않았다. 두통이나 구토, 복시는 없다. 갑상선기능검사와 염색체 검사는 정상이다.\n확진을 위한 검사는?","stem_table":null,"options":["경구당부하검사","클로니딘 자극검사","인슐린유사성장인자-1","아침 9시 코티솔과 부신겉질자극호르몬","생식샘자극호르몬방출호르몬자극검사"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q210p111_9e0a6804.png","note":null,"id_simple":"2022-Q210"},{"id":"2022-L50-Q216","year":2022,"qnum":216,"jokbo_lec_no":50,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"8세 여아가 키가 작아 병원에 왔다. 키는 117.5cm, 체중 20kg였다. 임신나이 40주에 출생체중 2.5kg 부당경량아로, 질식분만으로 출생하였으며, 황달이 첫 1주일 동안 있었다. 유방은 만져지지 않으며 음모도 없다. 아버지 키는 173cm로 중학교 3학년 때 3백분위수였으며, 이후 키가 증가하였다. 어머니 키는 156cm이다.\n가장 가능한 진단은?","stem_table":null,"options":["터너증후군","갑상샘저하증","가족성저신장","체질성성장지연","뇌하수체저하증"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q216p111_e2176464.png","note":null,"id_simple":"2022-Q216"},{"id":"2022-L51-Q141","year":2022,"qnum":141,"jokbo_lec_no":51,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"9세 남아가 여드름과 수염이 6개월 전부터 생겨 병원에 왔다. 임신 나이 38주, 출생체중 3,100g로 출생하였다. 현재 키와 체중은 139.3cm(50백분위수), 체중 35.9kg(50백분위수)로, 5세에서 8세까지는 키와 체중이 30백분위수를 유지하고 있었다. 양측 고환은 6mL, 음모는 성성숙도 II기이다. 뼈나이는 10세다. 검사는?","stem_table":null,"options":["고환초음파","테스토스테론 농도","인슐린유사성장인자-I 농도","17-수산화프로게스테론 농도","생식샘자극호르몬방출호르몬자극검사"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q141"},{"id":"2022-L51-Q192","year":2022,"qnum":192,"jokbo_lec_no":51,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"5세 여아가 우측 흉부에서 1개월 전부터 덩어리가 만져져 병원에 왔다. 덩어리는 직경 3cm 원형으로, 만지면 아파한다. 유두는 덩어리 정 중앙에 위치해 있다. 좌측에서는 덩어리가 만져지지 않는다. 주위 피부 변색은 없었다. 키는 현재 70 백분위로 1년 전에는 50백분위였다. 음모는 없었다.\n- 생식샘자극 호르몬방출호르몬 투여 후 황체화호르몬 최고농도 8 mlU/mL, 뼈나이 7세","stem_table":null,"options":["생리적 유방","진성성조숙증","조기유방발육증","맥큔-알브라이트 증후군","21 수산화효소결핍에 의한 선천부신과형성"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q192"},{"id":"2022-L51-Q201","year":2022,"qnum":201,"jokbo_lec_no":51,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"12개월 남아가 흉부에서 유방덩어리가 만져져 병원에 왔다. 덩어리는 직경 3cm 원형으로, 만지면 아파했다. 주위 피부의 변색은 없었다. 유방덩어리는 최근 크기 변화가 없다. 키와 체중은 50백분위수이며, 음경과 음모는 성성숙도 1기다. Cafe-au-lait 반점은 없다. 검사는?","stem_table":null,"options":["검사없이 관찰","염색체핵형검사","유방 흡인 조직 검사","17-히드록시프로게스테론","생식샘자극호르몬방출호르몬자극검사"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q201"},{"id":"2022-L51-Q204","year":2022,"qnum":204,"jokbo_lec_no":51,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"5세 여아가 2개월 전부터 음모가 보여 병원에 왔다. 3개월 전부터 여드름이 생겼다. 음모는 약간 보이나, 유방발달은 관찰되지 않는다. 음핵은 커져있지 않다. 최근 한약이나 영양제를 복용한 적은 없다. 뼈나이는 7세이다. 검사결과는 다음과 같다. 치료는?\n- 혈액: 인슐린유사성장인자-I 226 ng/ml (참고치, 200-400)\n- 아침 9시 17-히드록시프로게스테론 28 ng/mL (참고치, <","stem_table":null,"options":["성장호르몬","케토코나졸","히드로코르티손","생식샘자극호르몬방출호르몬 유사체","양측 부신제거"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q204p112_d7a91ba0.png","note":null,"id_simple":"2022-Q204"},{"id":"2022-L52-Q189","year":2022,"qnum":189,"jokbo_lec_no":52,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환이 의심되는 모호한 외성기를 가지고 있는 환자에서는 무엇보다 정확한 진단이 중요하다. 다음 내용 중 틀린 것은?","stem_table":null,"options":["음낭 및 음순부위에서 성선유무를 확인하는 것이 중요하다.","X염색체 및 SRY의 유무를 확인하는 염색체검사를 조기에 시행해야 한다.","초음파 또는 MRI 등을 시행하여 여성 내부생식기 유무를 확인해야 한다.","감별진단을 위해서 생식기관조영술 (genitography)을 시행하는 것이 중요하다.","혈장에서 17-OH progesterone을 측정하여 선천부신과증식 (congenital adrenal hyperplasia) 여부를 확인한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q189"},{"id":"2022-L52-Q193","year":2022,"qnum":193,"jokbo_lec_no":52,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환에서는 생식선에서의 종양발생 위험이 높아 필요시 생식선의 예방적 적출술을 시행해야 한다. 다음 중 생식선의 예방적 적출술이 반드시 필요한 질환은?","stem_table":null,"options":["46XX testicular disorders or sex development (DSD) (XX male)에서의 양측고환","46XY complete gonadal dysgenesis에서 양측 흔적성선","46XY ovotesticular DSD에서 남성으로 성결정한 음낭내 고환","45XO/46XX Turner syndrome에서 양측 흔적성선","46XY 5 alpha-reductase deficiency에서 음낭내 고환"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q193"},{"id":"2022-L53-Q126","year":2022,"qnum":126,"jokbo_lec_no":53,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"이차생식샘저하증(hypogonadotropic hypogonadism)에 대한 설명 중 맞는 것은?","stem_table":null,"options":["고환자체의 문제로 발생한다.","생체되먹임 기전에 의하여 생식샘자극호르몬(LH, FSH)이 증가한다.","Klinefelter 증후군과 같이 염색체 이상이 원인이다.","GnRH 또는 gonadotropin을 투여하면 자연임신도 가능하다.","테스토스테론을 직접 투여하는 것이 임신 성공에 효과적이다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q126"},{"id":"2022-L53-Q127","year":2022,"qnum":127,"jokbo_lec_no":53,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"정자형성 과정에서 시상하부-뇌하수체-고환 축의 호르몬 조절에 대한 설명이다. 틀린 것은?","stem_table":null,"options":["FSH는 남성의 사춘기에 정자형성 과정이 시작되는 데 필수적인 호르몬이다.","정상적인 정자생산을 위해서는 일정 수준의 고환 내 테스토스테론(Testosterone)이 필수적이다.","남성 성인에서 FSH의 주된 역할은 양적으로 정상적인 수준의 정자형성을 유지시키는 것이다.","테스토스테론(Testosterone)은 인히빈(Inhibin)과 함께 되먹임기전을 통해 뇌하수체에서 FSH 생성을 직접 억제한다.","FSH의 주 표적기관은 고환의 세정관 내에 존재하는 세르툴리세포(Sertoli cell)이며, 세포막에 존재하는 수용체와 결합한 뒤 다양한 세포신호전달체계를 거쳐 정자형성과정에 필요한 여러 단백질의 합성을 촉진한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q127"},{"id":"2022-L53-Q131","year":2022,"qnum":131,"jokbo_lec_no":53,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"남성호르몬 보충요법으로 기대할 수 있는 효과가 아닌 것은?","stem_table":null,"options":["성욕과 성활성도의 호전","골밀도 증가","수면무호흡증의 호전","근육량과 근력의 향상","이차성징의 유도"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q131"},{"id":"2022-L53-Q185","year":2022,"qnum":185,"jokbo_lec_no":53,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"정상적인 성분화 과정은 유전적인 성결정 및 성선의 성결정 과정으로 구분할 수 있다. 또한 이러한 성결정 기준에는 형태학적 기준과 정신적 기준이 포함된다. 정상 성의 결정과정에 대한 다음 설명 중 틀린 것은 무엇인가?","stem_table":null,"options":["고환은 Y염색체 SRY의 존재에 의해 결정된다.","여성의 성선으로 발달하려면 AMH의 역할이 중요하다.","성결정의 형태학적 기준에서 첫 번째는 염색체 성이 무엇이냐이다.","성결정은 외생식기의 모양에 따라 확정한다.","성결정의 정신적 기준에서 환자의 성주체성 및 성역할에 대한 확인이 필요하다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q185"},{"id":"2022-L54-Q145","year":2022,"qnum":145,"jokbo_lec_no":54,"lecture":"여성호르몬 분비/조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"뇌하수체와 난소에서의 호르몬 분비는 여성의 생리주기에 따라서 변화하며 되먹이기 기전에 의해서 조절된다. 다음은 여성의 생리주기에 따른 호르몬의 변화를 나타내는 그림이다. A-D 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A. 난포자극호르몬 – B. 황체형성호르몬 – C. 황체호르몬 – D. 에스트라디올","A. 난포자극호르몬 – B. 황체형성호르몬 – C. 에스트라디올 – D. 황체호르몬","A. 난포자극호르몬 – B. 에스트라디올 – C. 황체형성호르몬 – D. 황체호르몬","A. 에스트라디올 – B. 난포자극호르몬 – C. 황체호르몬 – D. 황체형성호르몬","A. 에스트라디올 – B. 난포자극호르몬 – C. 황체형성호르몬 – D. 황체호르몬"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q145p113_753f7159.png","note":null,"id_simple":"2022-Q145"},{"id":"2022-L54-Q146","year":2022,"qnum":146,"jokbo_lec_no":54,"lecture":"여성호르몬 분비/조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"여성 호르몬의 분비와 조절에 있어서 시상하부-뇌하수체-난소 축 (HPO axis)은 여성의 생리 주기에 따라 변화하며 되먹이기 기전에 의해 조절되는 등 긴밀한 관계를 맺고 있다. A-C 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A. 에스트라디올 – B. 난포자극호르몬, 황체호르몬 – C. 황체형성호르몬, 생식샘자극호르몬 분비호르몬","A. 생식샘자극호르몬 분비호르몬 – B. 황체형성호르몬, 난포자극호르몬 – C. 에스트라디올, 황체호르몬","A. 난포자극호르몬 – B. 에스트라디올, 황체호르몬 – C. 황체형성호르몬, 생식샘자극호르몬 분비호르몬","A. 황체호르몬 – B. 생식샘자극호르몬 분비호르몬, 난포자극호르몬 – C. 황체형성호르몬, 에스트라디올","A. 생식샘자극호르몬 분비호르몬 – B. 난포자극호르몬, 황체호르몬 – C. 황체형성호르몬, 에스트라디올"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q146HPOp113_81bbe769.png","note":null,"id_simple":"2022-Q146"},{"id":"2022-L54-Q180","year":2022,"qnum":180,"jokbo_lec_no":54,"lecture":"여성호르몬 분비/조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"난소의 에스트로겐의 생성을 위해서는 난포막세포 (Theca cell)와 과립막세포(granulosa cell)가 모두 존재하여야 하며 또한 생식샘자극호르몬등이 필요하다. A~D 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A. 과립막세포 – B. 난포자극호르몬 – C. 난포막세포 – D. 황체형성호르몬","A. 과립막세포 – B. 황체형성호르몬 – C. 난포막세포 – D. 난포자극호르몬","A. 과립막세포 – B. 난포자극호르몬 – C. 난포막세포 – D. 황체형성호르몬","A. 난포막세포 – B. 난포자극호르몬 – C. 과립막세포 – D. 황체형성호르몬","A. 난포막세포 – B. 황체형성호르몬 – C. 과립막세포 – D. 난포자극호르몬"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q180p114_e4a51ca3.png","note":"중복 선지 존재","id_simple":"2022-Q180"},{"id":"2022-L55-Q136","year":2022,"qnum":136,"jokbo_lec_no":55,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"16세 여자가 이차성 무월경으로 왔다. 최근 1년간 체중을 20kg 감량하였고, 10kg 감량하였을 때부터 무월경이 시작되었다. progesterone challenge test상 출혈이 없었고, estrogen-progesterone challenge test상 출혈을 보였다.\n- LH 0.5 mIU/ml (정상치: follicular 0.6-6.","stem_table":null,"options":["Gonadotropin","Clomiphene citrate","GnRH agonist depot","Estrogen-progesterone therapy","Transsphenoidal surgery"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q136"},{"id":"2022-L55-Q142","year":2022,"qnum":142,"jokbo_lec_no":55,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"35세 산과력 1-0-0-1인 기혼여성이 향후 임신 계획이 있으나 6개월간 무월경이 지속됨을 주소로 내원하였다. 유즙분비 이외에 현재 시야결손이나 두통 등의 증상을 호소하는 것은 없다. 이전 월경은 규칙적이었으며, 최근 특별한 약물 복용력 및 수술력은 없다. 골반진찰 및 골반초음파 검사는 정상이었다. 시행한 소변 및 혈액 검사 결과는 아래와 같다. 치료는?\n- 요임신반응 검사: 음성\n- 갑상샘자극호르몬: 2.6uIU/mL (참고치 0.34~4.2","stem_table":null,"options":["생식샘자극호르몬분비호르몬작용체","클로미펜","브로모크립틴","갑상샘호르몬","프로제스테론"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q142"},{"id":"2022-L55-Q178","year":2022,"qnum":178,"jokbo_lec_no":55,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"16세 여자가 일차성 무월경을 주소로 내원하였다. 환자는 발달과정에 특이 사항은 없었다. 신체검사에서 신장 161cm, 체중 50kg, 유방은 Tanner stage IV, 치모는 Tanner stage IV였다. 골반 진찰에서 외음부 형태는 정상이었으나, 질이 짧은 맹관 (blind pouch)의 형태를 보였다. 주기적 골반 통증이나 후각 장애는 없었으며 골반초음파 검사에서 자궁은 관찰되지 않았다. 핵형 분석은 46,XX였다. 진단은?","stem_table":null,"options":["다낭성 난소증후군 (Polycystic ovary syndrome)","터너 증후군 (Turner Syndrome)","처녀막 막힘증 (Imperforate hymen)","안드로겐 무감응 증후군 (Androgen insensitivity syndrome)","뮬러관 무발생증 (Mullerian Agenesis)"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q178"},{"id":"2022-L55-Q187","year":2022,"qnum":187,"jokbo_lec_no":55,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"22세 산과력 0-0-0-0인 미혼여성이 1년간 월경이 없어서 병원에 왔다. 키 167cm, 체중은 41kg이다. 철저하고 엄격한 식사 조절과 운동으로 지난 1년 동안 17kg을 감량하였다. 이전 월경은 규칙적이었으며, 최근 특별한 약물 복용력 및 수술력은 없다. 골반초음파 검사에서 자궁과 난소는 정상이다. 프로제스테론 쇠퇴출혈은 없고 에스트로젠-프로제스테론 쇠퇴출혈은 있다.\n- 난포자극호르몬 1.0mlU/mL (참고치, 5-20)\n- 황체형성호르몬 1.5mlU/mL (참고치, 5-20)\n- 에스트라디올 12mlU/mL (참고치, 20-400)\n- 갑상샘자극호르몬 2.5mlU/mL (참고치, 0.34-4.2","stem_table":null,"options":["안드로겐무감응","조기난소기능상실","시상하부기능이상","다낭성난소","아셔만증후군"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q187"},{"id":"2022-L55-Q206","year":2022,"qnum":206,"jokbo_lec_no":55,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"32세 여성이 최근 월경이 없어 내원하였다. 마지막 월경은 1년 전이었으며 이후 월경은 없었고, 그 전까지는 비교적 규칙적이었다고 한다. 약 2년 전부터 스트레스를 심하게 받았고 이로 인한 우울증으로 정신건강의학과를 다니고 있으며 우울증약을 복용중이다. 무기력감을 호소하였으며 양측 유두에서 분비물이 나온다고 하였다.\n- 난포자극호르몬 (FSH): 6.0mIU/ml (참고치 5-20)\n- 황체형성호르몬 (LH): 5.2mIU/ml (참고치 5-20)\n- 에스트라디올 (estradiol): 44pg/ml (참고치 20-400)\n- 갑상샘자극호르몬 (TSH): 2.5mIU/ml (참고치 0.34-4.2","stem_table":null,"options":["뇌하수체 MRI","복용약물 중단 후 프로락틴 재검사","유리 티록신 (free T4)","유리 테스토스테론 (free testosterone)","17-수산화프로게스테론 (17-OHP)"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q206"},{"id":"2022-L56-Q123","year":2022,"qnum":123,"jokbo_lec_no":56,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"14세 여아가 초경이 없어 내원하였다. 최근 몇 달간 회음부 압박감과 통증이 주기적으로 발생하였다. 신체진찰에서 질입구에 돌출된 말랑말랑한 종괴가 확인되었고 발살바 조작(Valsalva maneuver)시 더욱 돌출되었다. 치료는?","stem_table":null,"options":["십자절개술(Cruciate incision)","도수정복(Manual reduction)","요관 스텐트 삽입술(Ureteral stent insertion)","페서리(Pessary)","질 폐쇄술(Colpocleisis)"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q123p115_413506f3.png","note":null,"id_simple":"2022-Q123"},{"id":"2022-L56-Q125","year":2022,"qnum":125,"jokbo_lec_no":56,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"5세 여아가 비정상 질출혈로 왔다. 진찰을 위해 취해야 할 가장 이상적인 자세는?","stem_table":null,"options":["Supine position","Frog leg position","Fowler's position","High fowler's position","Trendelenburg position"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q125"},{"id":"2022-L56-Q218","year":2022,"qnum":218,"jokbo_lec_no":56,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"3세 여아가 질이 잘 보이지 않아 내원하였다. 환자의 이학적 검진에서 아래와 같은 소견을 보였다. 환아의 부모가 치료를 원하는 경우 시행해 볼 수 있는 치료는?","stem_table":null,"options":["topical emollient","estrogen cream","metronidazole ointment","medroxyprogesterone acetate","clomiphene"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q218"},{"id":"2022-L57-Q133","year":2022,"qnum":133,"jokbo_lec_no":57,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제와 레보노게스트렐함유-자궁내장치의 공통된 '피임 외 부가적 이점'으로 보기 힘든 것은?","stem_table":null,"options":["골반염 예방","월경통 호전","월경과다 호전","류마티스관절염 감소","자궁내막증 수술 후 약물 치료"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q133"},{"id":"2022-L57-Q153","year":2022,"qnum":153,"jokbo_lec_no":57,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제의 복용을 잊었을 때의 대처법은 가능한 한 빨리 빠진 날 만큼 복용하고 이후 가능한 일찍 복용하는 것이다. 이때 7일간 추가 피임이 필요한 경우는?\n가. Ethinyl estradiol 30ug 함유 제제를 1-2일 안 먹을 때\n나. Ethinyl estradiol 30ug 함유 제제를 3일 이상 안 먹을 때\n다. Ethinyl estradiol 20ug 함유 제제를 1-2일 안 먹을 때\n라. Ethinyl estradiol 20ug 함유 제제를 2일 이상 안 먹을 때","stem_table":null,"options":["가,다","가,라","나,다","나,라","가,나,다,라"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q153"},{"id":"2022-L57-Q202","year":2022,"qnum":202,"jokbo_lec_no":57,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제 처방에 관한 WHO 가이드라인에서 category 4에 속하는 경우는?","stem_table":null,"options":["경증 간경화증","유방암 가족력","중증 혈소판감소증","aura가 없는 migraine","산후 6주 미만의 수유부"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q202"},{"id":"2022-L58-Q150","year":2022,"qnum":150,"jokbo_lec_no":58,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"35세 여성이 결혼 후 임신이 되지 않아 내원하였다. 월경주기는 40-50일 간격으로 불규칙하였으며 몇 달간 월경이 없던 적이 있었다고 한다. 마지막 월경은 두달 전이라고 한다. 키는 165cm, 체중은 57kg이다. 신체검진과 부인과 검진에서 이상소견은 없었으며 부인과 초음파 검사는 정상이었다.\n- 난포자극호르몬 5.1 mIU/mL (참고치 5~20)\n- 황체형성호르몬 10.2 mIU/mL (참고치 5~20)\n- 에스트라디올: 52pg/mL (참고치 20~400)\n- 갑상샘자극호르몬: 2.7IU/mL (참고치, 0.34~4.2","stem_table":null,"options":["항안드로겐 제제 (spironolactone)","방향화효소 억제제 (letrozole)","주기적 프로게스토겐 (cyclic progestogen)","인슐린 저항성 개선제 (metformin)","생식샘자극호르몬제제 (recombinant FSH)"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q150"},{"id":"2022-L58-Q163","year":2022,"qnum":163,"jokbo_lec_no":58,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"산과력 0-0-0-0인 22세 여성이 8개월째 월경이 없어 병원을 방문하였다. 이 여성은 초경 때부터 1년에 3-4회 정도의 월경주기를 보이다가 최근 약 10kg 가량 체중이 늘면서 월경이 없는 상태이다. 현재 키는 159cm, 체중은 72kg이다. 이학적 검사 상 진한 성모가 인중, 하복부, 넓적다리, 가슴에서 관찰되었으며 등과 얼굴에는 여드름이 관찰되었다.\n- 난포자극호르몬 5.1mIU/mL (참고치, 5-20)\n- 황체형성호르몬 9.8mIU/mL (참고치, 5-20)\n- 에스트라디올 69pg/mL (참고치, 20-400)\n- 갑상샘자극호르몬 2.6mIU/mL (참고치, 0.34-4.2","stem_table":null,"options":["골다공증","부신증식증","자궁근종","자궁내막암","갑상샘기능항진증"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q163p115_1449c6c1.png","note":null,"id_simple":"2022-Q163"},{"id":"2022-L58-Q174","year":2022,"qnum":174,"jokbo_lec_no":58,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"23세 여성이 월경이 최근에 불규칙해져서 내원하였다. 초경이후 월경주기는 35-49일 정도로 길었으며 최근 6개월간 월경이 한번 있었다고 한다. 신체검진에서 심한 여드름이 관찰되었다. 신장 160cm, 체중은 85kg, 허리둘레 82cm이었으며, 골반초음파검사에서 양쪽 난소는 각각 아래와 같았다.\n난소의 난포 성장 단계에서 황체형성호르몬에 의해 합성되어 위 증상들이 나타나게 하는 호르몬은 무엇인가?","stem_table":null,"options":["에스트로겐","프로게스테론","인히빈","인슐린","안드로겐"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q174p116_010eba2c.png","note":null,"id_simple":"2022-Q174"},{"id":"2022-L59-Q169","year":2022,"qnum":169,"jokbo_lec_no":59,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"산과력 2-0-1-2인 만 51세 여성이 5개월간 지속된 얼굴이 붉어지는 증상 및 식은땀 때문에 수면장애를 호소하여 내원하였다. 5년 전 자궁선근증으로 자궁적출술을 받았고, 내진 상 특이소견은 없었다. 진단을 위해 시행할 검사는?","stem_table":null,"options":["혈중 프로락틴","혈중 테스토스테론","혈중 프로게스테론","혈중 황체형성호르몬","혈중 난포자극호르몬"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q169"},{"id":"2022-L59-Q179","year":2022,"qnum":179,"jokbo_lec_no":59,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"52세 산과력 1-0-0-1 인 여자가 1년 전부터 월경이 없어지고, 안면 홍조 및 수면장애를 호소하며 내원하였다. 4년 전 자궁내막증으로 왼쪽 난소 및 자궁절제술을 시행받았다. 이외 다른 병력은 없다. 혈액검사 결과는 다음과 같다. 치료는?\n- TSH 2.0 IU/mL (참고치 0.34~4.2","stem_table":null,"options":["에스트로겐 (Estrogen)","프로게스테론 (Progesterone)","레트로졸 (Letrozole)","카베르골린 (Cabergoline)","에스트로겐-프로게스테론 (Estrogen-Progesterone)"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q179"},{"id":"2022-L59-Q198","year":2022,"qnum":198,"jokbo_lec_no":59,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"50세 산과력 2인 여자가 최근 낮동안 10여 차례 반복적으로 발생하는 상반신 발한 및 수면 장애, 집중력 저하, 빈뇨감 등을 주소로 내원하였다. 최종 월경은 1년 전이었으며 그 전에는 거의 매달 규칙적이던 월경이 약 45세 이후부터는 2-6개월 간격으로 불규칙하게 있어왔다고 하였다. 체질량 지수(BMI)는 25kg/m2이었으며 혈압은 126/78 mmHg, 현재 특별히 복용 중인 약물은 없다고 하였다. 이 여성에게 폐경호르몬요법을 시작하고자할 때 해당사항으로 거리가 먼 것은?","stem_table":null,"options":["폐경호르몬요법은 혈관운동증상 완화를 위한 가장 효과적인 치료법이다.","대사증후군 위험 요소가 있는 비만 여성에서는 경피 투여가 선호된다.","골밀도 감소 예방을 위해 칼슘, 비타민 D 섭취를 강조한다.","유방암 병력, 활동성 혈전색전증, 간질환 등이 동반된 경우 에스트로겐 단독요법을 시행한다.","자궁이 있는 여성이므로 에스트로겐 프로게스틴 병합요법을 선택한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q198"},{"id":"2022-L59-Q211","year":2022,"qnum":211,"jokbo_lec_no":59,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"여성건강주도연구 (Women's Health Initiative) 연구 결과 에스트로겐 단독 요법을 시행할 때 위험도가 감소하는 질환은?","stem_table":null,"options":["직장암","대장암","폐색전증","고관절 골절","뇌졸중"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q211"},{"id":"2022-L60-Q78","year":2022,"qnum":78,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"30세 여자 환자가 6개월 전부터 시작된 월경불순으로 내원하였다. 비슷한 시기부터 유즙도 나오기 시작하였다고 한다. 현재 복용하는 약물은 없었다. 본 환자의 뇌하수체 호르몬 검사 및 뇌하수체 MRI 검사 결과는 아래와 같다. 본 환자의 치료로 가장 적절한 것은?\n- LH 1 (1-10) mIU/mL, FSH 0.8 (1-9) mIU/mL, Estradiol 25 (30-400) pg/mL\n- Free T4 1.5 (0.8-1.8) ng/dL, TSH 3.5 (0.4-4.1) uIU/mL\n- Prolactin 451 (3-25) ng/mL\n- GH 1.2 ng/mL, IGF-1 220 (70-250) ng/mL\n- ACTH 31 (0-60) pg/mL, Cortisol 15.1 μg/dL","stem_table":null,"options":["즉각적인 치료 없이 추적 관찰","소마토스타틴 수용체 작용체 (somatostatin receptor ligand)","도파민 작용제 (dopamine agonist)","방사선치료","경접형골동수술 (transsphenoidal surgery)"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q78MRICBL1p117_d06e19be.png","note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q78","reparsed":true},{"id":"2022-L60-Q23","year":2022,"qnum":23,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"45세 여자가 얼굴 외형 변화와 손가락, 발가락이 굵어짐을 주소로 내원하였다. 턱과 이마가 돌출되고 손가락과 발가락이 굵어져서 과거에 맞던 신발이나 반지가 더 이상 맞지 않는다고 하였다. 가장 의심되는 질환으로 처음으로 시행해야 할 선별검사는?","stem_table":null,"options":["코티졸","성장호르몬","유즙분비호르몬","갑상선자극호르몬","인슐린유사성장인자-1"],"answer":[5],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q23"},{"id":"2022-L60-Q104","year":2022,"qnum":104,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"40세 남자가 내원 당일 오전부터 갑작스럽게 발생한 두통으로 응급실에 내원하였다. 오심과 구토를 동반하였으며, 과거력상 2년전 비기능성 뇌하수체 선종으로 진단받았고 시신경 압박 등 동반증상이 없어서 정기적으로 MRI 촬영하면서 추적 관찰 중이었다고 한다. 이외에 다른 동반 질환은 없었고, 복용하는 약제도 없었다. 응급실 내원시 혈압은 80/50 mmHg, 맥박은 120회였으며 발열은 없었고 혈당은 52 mg/dL이었다.\n검사 결과 (참고치):\n- GH 1.2 ng/mL (0.1-1.","stem_table":null,"options":["5% 포도당 생리식염수","성장호르몬","갑상선호르몬","남성호르몬","항생제"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q104MRICBL1p117_4c6b699a.png","note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q104"},{"id":"2022-L60-Q101","year":2022,"qnum":101,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"38세 여자 환자가 복부 초음파에서 우측 부신의 종괴가 발견되어 내원하였다. 환자는 10년 전 고혈압, 다낭성난소증후군을 진단받았으며, 6년 전 심부정맥혈전증으로 약물치료하였고, 이후 5년 전에는 좌측 대퇴골두 무혈성 괴사로 수술을 받은 과거력이 있었다. 최근 3개월 간 9kg 가량의 체중 증가가 있었고, 불규칙한 월경, 복부 둘레 증가 및 다리 부종을 동반하였다. 다음 중 쿠싱증후군 선별 및 확진을 위해 시행할 수 있는 검사는?","stem_table":null,"options":["CRH test","Spot urine free cortisol","Early morning salivary cortisol","High dose dexamethasone suppression test","1mg overnight dexamethasone suppression test"],"answer":[5],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q101"},{"id":"2022-L60-Q73","year":2022,"qnum":73,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"양측 부신 종괴로 방문한 39세 남자의 혈액/소변 검사 결과와 CT 검사결과이다.\n- 24시간 소변: VMA 32(0-8) mg/day, metanephrine 6224 (0-400) μg/day, normetanephrine 3972 (0-800) μg/day, epinephrine 571 (0-27) μg/day, norepinephrine 624 μg/day, dopamine 184 μg/day\n- Aldosterone 12 (5-41) ng/dL\n- 1mg overnight dexamethasone suppression test: cortisol 1.2 μg/dL\n\n가장 적합한 치료는?","stem_table":null,"options":["mitotane","ketoconazole","Right adrenalectomy","Left adrenalectomy","Bilateral adrenalectomy"],"answer":[1],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q73","reparsed":true},{"id":"2022-L60-Q85","year":2022,"qnum":85,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"37세 여자가 한 달 전 발열, 인후통 증상으로 COVID-19 진단하여 1주일 자가격리하면서 해열제, 진통제 복용 후 회복되었다. 피로감, 목소리 변화 증상이 약간 남아 있었으나 일상생활에는 지장이 없는 정도로 지내던 중, 2주 전부터 다시 열이 나고 목 앞쪽이 부으면서 통증 및 압통이 발생하였다. 통증은 침을 삼킬 때 더 심해졌으며 오른쪽 귀로 뻗치는 양상을 보였으나, COVID-19 감염 시의 인후통과는 다른 양상이었다. 또한 2주 간 약 3kg의 체중감소가 있었으며, 가슴 두근거림, 손 떨림, 불면증 증상을 호소하였다. 신체 검진에서 우측 갑상선이 단단하게 만져졌고 압통이 심했다.\n- T3 290 ng/dL (80-200), FT4 3.52 ng/dL (0.8-1.9), TSH < 0.05 mIU/mL (0.4-4.","stem_table":null,"options":["무통성 갑상선염","갑상선기능항진증","아급성 갑상선염","하시모토 갑상선염","급성 갑상선염"],"answer":[3],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q85"},{"id":"2022-L60-Q47","year":2022,"qnum":47,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"38세 여자 환자가 목의 부종으로 내원하였다. 평소 건강하던 환자는 내원 2주 전부터 운동시 호흡곤란과 손 떨림의 증상이 있었고, 내원 1주전 목의 부종이 관찰되었다. 부종 부위에 피부 발적은 없었으며, 압통은 동반하지 않았다. 혈액 검사 소견이 아래와 같을 때 정확한 진단을 위해 필요한 검사는?\n- V/S: 138/86 mmHg – 98회/분 – 14회/분 – 37.5°C\n- T3 290 ng/dL (80-200)\n- FT4 3.52 ng/dL (0.8-1.9)\n- TSH < 0.05 mIU/mL (0.4-4.1)\n- ESR 16mm/hr (0-20)","stem_table":null,"options":["갑상선 초음파","갑상선 스캔","갑상선 생검","TRH자극 검사","T3 억제 스캔"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q47CBL6p118_94a34a98.png","note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q47","reparsed":true},{"id":"2022-L60-Q74","year":2022,"qnum":74,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"56세 남자가 요통과 간기능검사 이상 소견으로 왔다. 환자는 매일 음주하였고 최근 걸을 때마다 요통이 심해졌다고 하였다.\n- 칼슘 7.5 mg/dL (참고치 8.8-10.5)\n- 인 2.4 mg/dL (참고치 2.5-4.5)\n- 요소질소/크레아티닌 18/0.9 mg/dL\n- 총 콜레스테롤 85 mg/dL, 총 단백질/알부민 5.9/3.7 g/dL\n- 알칼리 인산분해효소 950 U/L (참고치 30-115)\n- 아스파르테이트 아미노전달효소/알라닌 아미노전달효소 37/38 IU/L (참고치 <40)\n- 부갑상선호르몬 250 pg/mL (참고치 10-65)\n- 외부 흉추-요추 단순 X선 촬영에서 요추 1번 압박골절 관찰\n\n이 환자에서 가능한 저칼슘혈증의 원인은?","stem_table":null,"options":["일차성 부갑상선기능항진증","유전성 부갑상선기능저하증 (Hereditary hypoparathyroidism)","마그네슘 부족 (Hypomagnesemia)","만성 신부전","비타민 D 부족"],"answer":[5],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q74","reparsed":true},{"id":"2022-L60-Q70","year":2022,"qnum":70,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"58세 남자가 골량 감소로 내분비대사내과로 의뢰되었다. 환자는 1년 전부터 크론병으로 고용량 스테로이드 치료를 받은 적이 있으며 현재 매일 prednisolone 7.5 mg 복용 중이었다. 평소 담배를 하루 1갑 피웠고, 매일 소주 1병을 마셨다. 최근에는 허리 통증이 있어 거의 외출을 하지 않고 집 안에 있었다. 이 환자에게 골다공증 및 골절의 위험인자가 아닌 것은?","stem_table":null,"options":["남자","스테로이드 치료","흡연","음주","활동량 감소"],"answer":[1],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q70"},{"id":"2022-L60-Q155","year":2022,"qnum":155,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"24세 여자가 다리가 붓는 증상으로 병원에 내원하였다. 이전 특이 병력 없던 환자로 1개월 전부터 전신 부종과 체중증가가 함께 발생하였다. 혈색소 12g/dL, 총콜레스테롤 396mg/dL, 소변 단백 2+, 심전도 정상소견이었다. 이 환자에서 필요한 검사로 거리가 먼 것은?","stem_table":null,"options":["당화혈색소","갑상선기능검사","요단백정량","LDL 콜레스테롤 정량","혈중 비타민D 정량"],"answer":[5],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q155"},{"id":"2022-L60-Q160","year":2022,"qnum":160,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"54세 여자가 외부 검사 상 고지혈증 진단받고 치료 위해 내원하였다. 환자는 6개월 전부터 피곤감, 체중 증가, 변비 등 발생하였고, 신체검사 상 이상소견이 발견되었다. 검사 결과가 다음과 같다. 다음 조치는?\n- Total cholesterol 254mg/dL, TG 223mg/dL, HDL-cholesterol 45mg/dL, Glucose 84mg/dL\n- AST/ALT 18/19 IU/L, BUN/Cr 24/0.8 mg/dL","stem_table":null,"options":["Statin","Ezetimibe","Fibrate","Thyroid function test","Urinalysis"],"answer":[4],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q160"},{"id":"2022-L60-Q196","year":2022,"qnum":196,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"38세 여자가 심한 피곤감으로 시행한 검사에서 간수치 및 콜레스테롤 수치 이상으로 내원하였다. 이전 특이병력은 없었으며, 2달 전부터 일상적인 업무에도 심한 피곤감을 느꼈으며, 6달동안 7kg의 체중 증가가 있었고, 목 부위의 나비모양의 증대 소견이 관찰되었다. 키 165cm, 몸무게 71.5kg. 혈액 검사 소견은 다음과 같다. 가장 먼저 시행되어야 할 치료는 무엇인가?\n- TSH 118 (0.3~4 μIU/mL), FT4 0.2 (0.8~1.8 ng/dL), CPK 400 (<178 IU/L), TPO Ab+++\n- T.cholesterol 300, Triacylglyceride 1600, HDL cholestrol 40, LDL cholesterol 200mg/dl\n- SGOT/SGPT: 190/224 IUmL, γGT: 100 (<60 IU/mL)","stem_table":null,"options":["Fenofibrate","High intensity statin","갑상선 호르몬 투여","Omega-3 fatty acid","Statin과 exetimibe 병용투여"],"answer":[3],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q196"},{"id":"2022-L60-Q188","year":2022,"qnum":188,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"8세 남아가 키가 또래에 비해 잘 자라지 않아 병원에 왔다. 임신 나이 38주에 출생체중 2,910 g로 출생하였다. 최근 6개월 동안 키가 1.5cm 컸고, 체중은 3kg 증가하였다. 3개월 전부터 피곤해하며 낮잠을 자는 날들이 많아졌다. 배는 튀어 나와 보였으나, 간과 지라는 만져지지 않고, 복부 청진에서 장음은 줄어들어 있다. 진단을 위한 검사는?","stem_table":null,"options":["수분제한검사","소변 유리 코티솔","혈청 유리 티록신","혈청 부신겉질자극호르몬","성장호르몬자극검사"],"answer":[3],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q188"},{"id":"2022-L60-Q143","year":2022,"qnum":143,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"29세 남자가 결혼 후 임신을 원하여 방문하였다. 환자는 7년 전 뇌하수체 선종제거술을 시행 받았고, 이후 부신피질호르몬, 갑상선 호르몬, 테스토스테론 제제를 복용해 왔다. 테스토스테론을 중지하고 주 3회 2000 IU의 hCG (human chorionic gonadotropin)을 3개월간 근육주사 하였다. 테스토스테론치는 정상화 되었으나 계속 무정자증을 보여 주 3회 75 IU recombinant FSH를 추가하였다. 이후 3개월째 무정자증이다. 적절한 대책은?","stem_table":null,"options":["주 3회 2000 IU의 hCG, 75 IU recombinant FSH 유지","테스토스테론 제제를 추가 투여","hCG의 용량을 3000 IU로 증량 투여","GnRH pulsatile infusion pump로 교체","고환에서 정자추출 후 ICSI (intracytoplasmic sperm injection)"],"answer":[1],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q143"},{"id":"2022-L60-Q190","year":2022,"qnum":190,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"27세 남성이 불임과 성욕감퇴로 병원을 방문하였다. 신장은 178cm, 체중은 68 kg이었으며, 혈압과 맥박수, 호흡 등은 모두 정상이었다. 과거력상 특이사항은 없었다. 신체검사에서 양측 고환이 모두 5ml였다. 혈액검사에서 LH는 19 mlU/mL (1-10 mlU/mL), FSH 38 mlU/mL (1-9 mlU/mL), testosterone 150 ng/dL (300-1,000 ng/dL)였다. 처음 정액검사에서 정액양은 2ml, 정자는 관찰되지 않았다. 반복 시행한 정액검사에서도 이전검사와 유사하였으며, 정자는 관찰되지 않았다. 확진을 위해 다음으로 시행할 검사는?","stem_table":null,"options":["경직장초음파검사","컴퓨터단층촬영 (sellar CT)","GnRH (gonadotropin releasing hormone) 자극 검사","염색체검사","고환생검"],"answer":[4],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q190"},{"id":"2022-L60-Q170","year":2022,"qnum":170,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"산과력 2-0-0-2인 여자가 피임 상담을 위해 병원에 왔다. 월경주기는 28일로 규칙적이었으나 생리양이 많으며, 생리통이 심해서 진통제로 조절이 안되고 있다. 체질량지수는 30kg/m2이었고, 하루 담배 10개피 정도의 흡연을 하고 있다. 골반 초음파검사는 정상이다. 가장 적합한 피임 방법은?","stem_table":null,"options":["난관결찰술","남성 콘돔","레보노게스트렐분비 자궁내장치","복합경구피임약","살정제"],"answer":[3],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q170"},{"id":"2022-L60-Q177","year":2022,"qnum":177,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"15세 여자가 초경이 없고 주기적으로 하복부 통증이 반복되어 내원하였다. 신체진찰상 신장 160cm, 체중 50kg, 유방과 음모는 Tanner stage 3였다. 외음부 검진 상 소음순 사이로 막이 돌출되어 있었고, 골반 초음파 및 자기공명영상 소견은 아래와 같았다.\n진단은?","stem_table":null,"options":["뮬러관 무형성증 (Mullerian agenesis)","선천성 거대결장 (Congenital megacolon)","난소낭종염전 (Ovarian cyst torsion)","안드로겐 무감응 증후군 (Androgen insensitivity syndrome)","처녀막 막힘증 (Imperforate hymen)"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q177MRICBL12p119_aab05376.png","note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q177"},{"id":"2022-L60-Q219","year":2022,"qnum":219,"jokbo_lec_no":60,"lecture":"CBL","professor":"","curr_lec_no":"CBL","curr_lecture":"CBL/통합문제","stem":"38세 여성이 6개월 전 임신 6주 4일에 계류유산으로 자궁내막소파술 시행 후 월경이 없어 내원하였다. 소변 임신 반응은 음성이었으며, 다른 내과적 질환은 없었다. 자궁난관조영술은 다음과 같았다. 진단은?","stem_table":null,"options":["근층내 자궁근종(Intramural myoma uteri)","자궁내막증 (Endometriosis)","자궁내 장치 (Intrauterine device)","자궁내막 유착증 (Asherman syndrome)","양측 나팔관 폐쇄 (Bilateral tubal obstruction)"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q219CBL14p119_e221a61a.png","note":"2026 커리큘럼 미매칭 (족보강의#60)","id_simple":"2022-Q219","reparsed":true},{"id":"2021-L2-Q9","year":2021,"qnum":9,"jokbo_lec_no":2,"lecture":"호르몬과 호르몬 작용기전","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음의 호르몬 가운데 세포막을 통과하여 핵 수용체(nuclear receptor)와 결합하여 작용하는 것을 고르시오.","stem_table":null,"options":["Dopamine","Gonadotropin-releasing hormone(GnRH)","Lutenizing hormone (LH)","Thyroid hormone","Somatostatin"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q9"},{"id":"2021-L2-Q10","year":2021,"qnum":10,"jokbo_lec_no":2,"lecture":"호르몬과 호르몬 작용기전","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"호르몬의 합성과 관련하여 올바르게 기술된 것을 고르시오.","stem_table":null,"options":["스테로이드 호르몬은 하나의 유전자로부터 전사(transcription) 및 번역(translation) 과정을 거쳐 합성된다.","펩타이드 호르몬의 signal peptide는 펩타이드가 endoplasmic reticulum으로 이동하도록 도와주며, mature form의 호르몬에서도 발견된다.","Estrogen 호르몬은 corticosterone을 전구체로 하여 합성된다.","스테로이드 호르몬의 분비는 secretary granule을 통해 이루어진다.","Progesterone은 testosterone의 합성을 위해 필요한 물질이다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q10"},{"id":"2021-L2-Q11","year":2021,"qnum":11,"jokbo_lec_no":2,"lecture":"호르몬과 호르몬 작용기전","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 펩타이드 호르몬과 해당 호르몬 수용체의 신호전달 과정에 작용하는 물질이 적절하게 연결된 것을 고르시오.","stem_table":null,"options":["Prolactin - STAT","Insulin - Smad","Glucagon - Ras","Growth hormone - cAMP","Bone morphogenic protein - diacylglycerol"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q11"},{"id":"2021-L2-Q12","year":2021,"qnum":12,"jokbo_lec_no":2,"lecture":"호르몬과 호르몬 작용기전","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 스테로이드 호르몬 수용체에 대한 설명으로 적절한 것을 고르시오.","stem_table":null,"options":["Estrogen receptor는 nucleus에서 estrogen과 결합한다.","Vitamin D receptor는 retinoid X receptor와 dimer를 이룬다.","Thyroid hormone receptor는 homodimer를 형성한다.","Orphan nuclear receptor 가운데에는 결합하는 호르몬이 알려진 경우도 있다.","Retinoid A receptor는 dimer를 형성하지 않는다."],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q12"},{"id":"2021-L2-Q13","year":2021,"qnum":13,"jokbo_lec_no":2,"lecture":"호르몬과 호르몬 작용기전","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 스테로이드 호르몬 수용체의 구조에 대한 설명으로 적절한 것을 고르시오.","stem_table":null,"options":["스테로이드 호르몬 수용체는 transmembrane domain을 가지고 있다.","DNA binding domain의 아미노산 서열은 모든 스테로이드 호르몬 수용체에서 동일하다.","Nuclear localization signal (NLS)은 주로 variable region에 속한다.","Zinc finger domain은 ligand 결합에 중요하다.","Ligand binding domain은 수용체의 dimer 형성에 관여한다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q13"},{"id":"2021-L3-Q2","year":2021,"qnum":2,"jokbo_lec_no":3,"lecture":"내분비 대사질환의 분류와 진단","professor":"박경수","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"다음 중 호르몬의 분비 감소에 의한 대사질환은?","stem_table":null,"options":["고지혈증","신성고혈압","1형 당뇨병","근감소성 비만","허혈성 심질환"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q2"},{"id":"2021-L3-Q15","year":2021,"qnum":15,"jokbo_lec_no":3,"lecture":"내분비 대사질환의 분류와 진단","professor":"박경수","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"다음 중 증상 혹은 진찰소견 조합과 의심되는 내분비질환의 조합으로 가장 적절하지 못한 것은?","stem_table":null,"options":["쇠약, 피로, 손금, 입안 점막의 과다색소침착 - 부신기능부전","유루증, 무월경, 두통 - 뇌하수체선종","월상안, 중심성 비만, 줄무늬 피부, 자색반 - 쿠싱증후군","체중감소, 식욕부진, 음모와 겨드랑이털 소실 - 갑상선기능저하증","체중감소, 식욕증가, 떨림, 두근거림, 감정불안정 - 갑상선기능항진증"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q15"},{"id":"2021-L3-Q16","year":2021,"qnum":16,"jokbo_lec_no":3,"lecture":"내분비 대사질환의 분류와 진단","professor":"박경수","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"호르몬 수치를 해석할 때 호르몬축의 되먹이기 기전을 반드시 고려해야한다. 다음 표에서 B에 해당하는 경우는?","stem_table":null,"options":["hypopituitarism","Graves disease","Cushing disease","diabetes insipidus","primary adrenal insufficiency"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q16_p127.png","note":null,"id_simple":"2021-Q16"},{"id":"2021-L4-Q3","year":2021,"qnum":3,"jokbo_lec_no":4,"lecture":"내분비 대사질환의 요인","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"다음 중 약제에 의해 발생할 수 있는 질환은?","stem_table":null,"options":["Rifampin (항결핵제) - 갑상선염","Tacrolimus (면역억제제) - 2형 당뇨병","Amiodarone (항부정맥제) - 그레이브스병","Ketoconazole (항진균제) - 부신성 쿠싱증후군","Glucocorticoid (스테로이드) - ACTH 의존성 쿠싱증후군"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q3"},{"id":"2021-L4-Q4","year":2021,"qnum":4,"jokbo_lec_no":4,"lecture":"내분비 대사질환의 요인","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"다음 내분비질환의 요인 중, 아래와 같은 기전을 통하여 호르몬 이상을 유발하는 것은?\n- 호르몬 전구물질 생성 변화\n- 호르몬 결합단백량 변화\n- 내분비기관의 혈류 변화\n- 호르몬의 대사 변화\n- 호르몬의 조직 섭취/저항성 변화","stem_table":null,"options":["약제","환경인자","유전성요인","자가면역성요인","비내분비성 질환"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q4"},{"id":"2021-L4-Q17","year":2021,"qnum":17,"jokbo_lec_no":4,"lecture":"내분비 대사질환의 요인","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"다음 중 내분비질환과 호르몬의 기능 이상, 발생요인에 따른 분류가 잘못 짝지어진 것은?","stem_table":null,"options":["Hashimoto thyroiditis – hormone underproduction - autoimmune","Primary adrenal insufficiency – altered tissue response - hemorrhage","Type 1 diabetes mellitus – hormone underproduction - autoimmune","Graves disease – hormone overproduction - autoimmune","Primary hyperparathyroidism – hormone overproduction – neoplastic growth"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q17"},{"id":"2021-L5-Q1","year":2021,"qnum":1,"jokbo_lec_no":5,"lecture":"시상하부, 뇌하수체의 생리","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"44세 여자이다. 시력이 저하되고, 심하게 기운이 없어 내원하였다. 이 환자의 병변에 의해 영향을 받을 가능성이 가장 낮은 호르몬은?","stem_table":null,"options":["Cortisol","Prolactin","Thyroxin","Epinephrine","Progesterone"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q1"},{"id":"2021-L5-Q14","year":2021,"qnum":14,"jokbo_lec_no":5,"lecture":"시상하부, 뇌하수체의 생리","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"다음 중 음성되먹임 조절(negative feedback regulation)에 해당하는 것을 고르시오.","stem_table":null,"options":["Estrogen에 의한 lutenizing hormone (LH) 분비 증가","Glucose에 의한 insulin의 분비 조절","Cortisol에 의한 corticotropin releasing hormone (CRH) 분비 조절","자율신경계에 의한 cortisol 분비 조절","혈중 칼슘 농도에 의한 parathyroid hormone (PTH) 분비 조절"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q14"},{"id":"2021-L5-Q18","year":2021,"qnum":18,"jokbo_lec_no":5,"lecture":"시상하부, 뇌하수체의 생리","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체 호르몬은 대부분 시상하부에서 분비되는 방출호르몬에 의해 자극을 받아서 분비된다. 뇌하수체 호르몬 중 시상하부 방출호르몬에 의해 자극을 받지 않는 호르몬은?","stem_table":null,"options":["프로락틴","성장호르몬","성선자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q18"},{"id":"2021-L5-Q19","year":2021,"qnum":19,"jokbo_lec_no":5,"lecture":"시상하부, 뇌하수체의 생리","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"우리 몸 호르몬들은 일정한 리듬에 맞추어 주기적으로 분비된다. 다음 호르몬 중에서 분비되는 주기가 가장 긴 호르몬은?","stem_table":null,"options":["성장호르몬","에스트라디올","갑상선자극호르몬","부신피질자극호르몬","성선자극호르몬방출호르몬"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q19"},{"id":"2021-L6-Q21","year":2021,"qnum":21,"jokbo_lec_no":6,"lecture":"뇌하수체 후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"29세 여자가 3개월 전부터 시작된 심한 갈증으로 내원하였다. 소변을 자주 보고 밤에도 1~2시간 간격으로 소변을 봤다. 혈압은 112/72 mmHg 였고 체중은 52kg 였다. 검사 결과는 다음과 같다.\n혈액검사: 공복혈당 84 mg/dL, 크레아티닌 0.8 mg/dL, Na⁺/K⁺/Cl⁻ 145/4.0/102 mEq/L\n24시간 소변검사: 양 6,200mL, 비중 1.003, 삼투질 농도 112 mOsmol/kg H₂O\n이에 시행한 수분제한검사 결과는 다음과 같았다. 치료는?","stem_table":null,"options":["리튬","수분제한","염분제한","티아지드","데스모프레신"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q21_p128.png","note":null,"id_simple":"2021-Q21"},{"id":"2021-L6-Q22","year":2021,"qnum":22,"jokbo_lec_no":6,"lecture":"뇌하수체 후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"폐암으로 항암치료 중인 64세 남자 환자가 3개월 전부터 오심, 구토를 반복적으로 하다가 쇠약감이 악화되어 내원하였다. 부종이나 체위성 저혈압은 관찰되지 않았다. 혈액검사 결과는 다음과 같았다. 적절한 치료는?\n소변검사: Na⁺ 36 mEq/L, 삼투질농도 380 mOsmol/kg H₂O","stem_table":"| 혈액검사 | |\n|---------|--|\n| Na⁺ | 131 mEq/L |\n| 삼투질농도 | 270 mOsm/kg H₂O |\n| BUN/Cr | 10/0.4 mg/dL |\n| 유리 T4 | 0.99 ng/dL (참고치 0.8~1.7) |\n| 갑상선자극호르몬 | 2.9 mIU/L (참고치 0.34~4.25) |\n| 코티졸 | 2.2 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 12.9 pg/mL (참고치 6~76) |\n| 급속부신피질자극호르몬자극검사 후 코티졸 | 5.6 μg/dL |","options":["염분제한","Tolvaptan","3% NaCl 주입","갑상선호르몬 투약","당질 글루코코르티코이드 투약"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q22"},{"id":"2021-L6-Q29","year":2021,"qnum":29,"jokbo_lec_no":6,"lecture":"뇌하수체 후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"다음은 정상인의 T1 강조영상이다. 화살표가 가르키는 고신호 강도 구조물과 관련이 있는 호르몬은?","stem_table":null,"options":["ADH","LH","ACTH","Prolactin","Growth hormone"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q29_p129.png","note":null,"id_simple":"2021-Q29"},{"id":"2021-L7-Q20","year":2021,"qnum":20,"jokbo_lec_no":7,"lecture":"뇌하수체 기능부전","professor":"안창호","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"다음 뇌하수체 호르몬 중에서 기저호르몬 검사로는 정확한 평가가 어렵고 호르몬 분비 자극 검사가 필요한 호르몬은?","stem_table":null,"options":["LH","FSH","Prolactin","GH","TSH"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q20"},{"id":"2021-L7-Q23","year":2021,"qnum":23,"jokbo_lec_no":7,"lecture":"뇌하수체 기능부전","professor":"안창호","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"45세 남자 환자가 뇌하수체 선종에 대한 수술 후 범뇌하수체 기능부전이 발생하였다. 환자는 두 명의 자녀가 있고 추가적인 자녀 계획은 없다. 이 환자에서 호르몬 보충 요법을 위해 투약해야 할 호르몬 약제와 용량 조절의 목표가 적절히 짝지어진 것은?","stem_table":null,"options":["Levothyroxine – free T4 수치를 정상 범위 안에서 절반의 위쪽으로 유지한다.","Testosterone – LH, FSH 수치를 정상으로 유지한다.","Recominant Growth Hormone – GH 수치를 정상으로 유지한다.","Hydrocortisone – 아침 기저 Cortisol 수치를 5 μg/dl 이상으로 유지한다.","Gonadotropin – Testosterone 수치를 정상으로 유지한다."],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q23","reparsed":true},{"id":"2021-L7-Q101","year":2021,"qnum":101,"jokbo_lec_no":7,"lecture":"뇌하수체 기능부전","professor":"안창호","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"52세 남자가 일주일 전부터 시작된 심한 전신 위약감, 메스꺼움을 주소로 응급실에 왔다. 2주 전 폐결핵을 진단받고 결핵약 복용을 시작했다. 방문 시 혈압 92/50 mmHg, 맥박 110/min, 체온 37.4℃였다. 혈액 검사 상 혈액요소질소 8.0 mg/dL, 크레아티닌 0.7 mg/dL, 혈청 나트륨 122 mEq/L, 칼륨 5.0 mEq/L, Cl 98 mEq/L, 혈중 glucose 82 mg/dL였다. 2년 전 부신 양측절제술 후 지속적으로 prednisolone 5mg/day, fludrocortisone 0.1mg/day 복용 중인 것 외에 특별한 과거력은 없었다. 이 환자에게 필요한 조치는?","stem_table":null,"options":["결핵약 중단","고용량 hydrocortisone 정맥 주사","Fludrocortisone 증량","급속 ACTH 자극검사","Sellar MRI"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q101"},{"id":"2021-L8-Q24","year":2021,"qnum":24,"jokbo_lec_no":8,"lecture":"뇌하수체 전엽 질환 분류와 진단","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"42세 여자 환자가 무월경과 전신쇠약감을 주소로 내원하였다. 환자는 10년전 둘째아이 출산 당시 다량의 출혈이 발생하여 수혈을 받은 적이 있다고 하였다. 출산 후 젖분비가 없어 수유를 못했고 이후로 무월경이 지속되었다고 한다. 산후 뇌하수체경색을 의심하여 뇌하수체 기저호르몬 검사를 시행하였다. 결과는 아래와 같다. 다음으로 본 환자의 뇌하수체 기능을 평가하기 위해 추가로 시행해볼 수 있는 검사는?","stem_table":"| 검사 | 결과 |\n|------|------|\n| LH | 0.9 (1-10) mIU/mL |\n| FSH | 1.2 (1-9) mIU/mL |\n| Estradiol | 14 pg/mL |\n| free T4 | 0.71 (0.8-1.8) ng/dl |\n| TSH | 2.5 (0.4-4.1) uIU/mL |\n| Prolactin | 18 (3-25) ng/mL |\n| GH | 0.2 ng/mL |\n| IGF-1 | 65 (75-250) ng/mL |\n| ACTH | 31 (0-60) pg/mL |\n| Cortisol | 6.9 ug/dL |","options":["GnRH stimulation test","Rapid ACTH stimulation test","Oral glucose tolerance test","Sella MRI","Dexamethasone suppression test"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q24"},{"id":"2021-L8-Q26","year":2021,"qnum":26,"jokbo_lec_no":8,"lecture":"뇌하수체 전엽 질환 분류와 진단","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"35세 남자가 새로 진단된 당뇨병으로 내원하였다. 이 환자에서 시행한 다음 검사 결과를 바탕으로 확진을 위해 다음으로 시행할 검사는?","stem_table":"| 혈액검사 | |\n|---------|--|\n| 유리 T4 | 1.4 ng/dL (참고치 0.8~1.7) |\n| 갑상선자극호르몬 | 2.1 mUIU/L (참고치 0.34~4.25) |\n| 코티졸 | 12.4 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 12 pg/mL (참고치 6~76) |\n| 성장호르몬 | 4.5 ng/mL (참고치 0~0.17) |\n| 인슐린유사성장인자-I | 610 ng/mL (참고치 114~492) |","options":["생리식염수 부하검사","급속 부신피질호르몬 자극 검사","하룻밤 덱사메타손 억제 검사","경구당부하검사 후 코르티솔 측정","경구당부하검사 후 성장호르몬 측정"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q26"},{"id":"2021-L8-Q27","year":2021,"qnum":27,"jokbo_lec_no":8,"lecture":"뇌하수체 전엽 질환 분류와 진단","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"상기 환자가 접형동경유샘종절제술을 시행받은 지 3개월 후 시행한 검사 결과가 다음과 같았다. 검사 결과를 바탕으로 할 때 가장 적절한 조치는?\nSella MRI: No definite remnant tumor","stem_table":"| 혈액검사 | |\n|---------|--|\n| 코티졸 | 10.4 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 22 pg/mL (참고치 6~76) |\n| 성장호르몬 | 3.5 ng/mL (참고치 0~0.17) |\n| 인슐린유사성장인자-I | 532 ng/mL (참고치 114~492) |","options":["케토코나졸","소마토스타틴유사체","재수술","방사선치료","경과 관찰"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q27"},{"id":"2021-L9-Q30","year":2021,"qnum":30,"jokbo_lec_no":9,"lecture":"뇌하수체의 영상소견","professor":"최승홍","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"31세 여성이 유즙과다를 주소로 내원하였다. 혈중 prolactin level이 190 ng/ml (정상:0-25 ng/ml)였다. 환자는 MRI를 시행하였고, 조영 증강 후 T1 강조영상은 다음과 같았다. 이 병변의 감별진단을 위한 가장 적절한 영상 검사 방법은?","stem_table":null,"options":["T2WI","non-contrast T1WI","FDG PET scan","dynamic contrast enhancement MRI","contrast enhancement CT"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q30_p130.png","note":null,"id_simple":"2021-Q30"},{"id":"2021-L10-Q33","year":2021,"qnum":33,"jokbo_lec_no":10,"lecture":"뇌하수체의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"39세 남자 환자가 두통을 주소로 내원하여 시행한 뇌 MRI상 suprasellar mass가 관찰되어 수술을 시행하였다. 검체의 현미경적 소견은 아래와 같다. 다음 중 옳은 기술은?","stem_table":"| 혈액검사 | |\n|---------|--|\n| 코티졸 | 15.2 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 32.9 pg/mL (참고치 6~76) |\n| 프로락틴 | 32 ng/mL (참고치 2.5~17.0) |\n| 여포자극호르몬 | 1.8 mIU/mL (참고치 1~9) |\n| 황체형성호르몬 | 3.4 mIU/mL (참고치 2~12) |\n| 에스트로겐 | 34 pg/mL (참고치 30~120) |\n| 인슐린유사성장인자-I | 220ng/mL (참고치 54~436) |","options":["HRAS의 변이가 있을 가능성이 높다.","뇌하수체 전엽에서 생겨서 터키안 상방으로 침윤하는 특성을 갖고 있다.","BRAF 변이를 타겟으로 하는 inhibitor에 반응할 가능성이 높다.","MEN-2A type에 자주 동반된다.","G protein 신호경로의 활성화에 의해서 일어난다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q33_p130.png","note":null,"id_simple":"2021-Q33"},{"id":"2021-L10-Q34","year":2021,"qnum":34,"jokbo_lec_no":10,"lecture":"뇌하수체의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"51세 여자가 두통 및 서서히 진행하는 visual field defect를 주소로 내원하였다. 혈액 검사상 혈장 prolactin이 90ng/mL (정상, <14ng/mL)이었고 수술 전 MRI(좌), 수술 후 병리검사(우) 소견이다. 가장 옳은 설명은?","stem_table":null,"options":["뇌하수체의 염증성 병변일 가능성이 높다.","뇌하수체의 비기능성 (non-functioning) 선종일 가능성은 없다.","DICER1 유전자 변이를 가지고 있을 가능성이 높다.","감별진단을 위해 수술 검체에서 prolactin에 대한 면역화학염색을 시행하는 것이 필요하다.","터키안 상방 (suprasellar area)의 두개인두종 (craniopharyngioma)일 가능성이 있다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q34_p130.png","note":null,"id_simple":"2021-Q34"},{"id":"2021-L11-Q28","year":2021,"qnum":28,"jokbo_lec_no":11,"lecture":"뇌하수체 전엽질환의 내과적 치료","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"42세 여자가 건강검진상 우연히 발견된 뇌하수체 선종으로 내원하였다. 호르몬 검사와 뇌하수체 자기공명 영상은 다음과 같았다. 시력 저하나 시야 장애는 호소하지 않았고 월경은 규칙적이고 유즙 분비 소견은 없었으며 최근 복용하는 약제는 없었다. 상기 환자에서 다음으로 시행할 적절한 조치는?","stem_table":"| 혈액검사 | |\n|---------|--|\n| 유리 T4 | 0.91 ng/dL (참고치 0.8~1.7) |\n| 갑상선자극호르몬 | 2.9 mIU/L (참고치 0.34~4.25) |\n| 코티졸 | 15.2 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 32.9 pg/mL (참고치 6~76) |\n| 프로락틴 | 32 ng/mL (참고치 2.5~17.0) |\n| 여포자극호르몬 | 1.8 mIU/mL (참고치 1~9) |\n| 황체형성호르몬 | 3.4 mIU/mL (참고치 2~12) |\n| 에스트로겐 | 34 pg/mL (참고치 30~120) |\n| 인슐린유사성장인자-I | 220ng/mL (참고치 54~436) |","options":["추적관찰","카베르골린","감마나이프","경구피임제","접형동경유샘종절제술[31~32번 이어지는 문항]"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q28"},{"id":"2021-L11-Q31","year":2021,"qnum":31,"jokbo_lec_no":11,"lecture":"뇌하수체 전엽질환의 내과적 치료","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"50세 남자가 1개월 전부터 잘 안 보인다고 내원하였다. 이전에 건강하였으며 현재 복용하는 약제는 없었다. 이에 시행한 시야 검사 및 뇌 MRI 소견은 다음과 같았다. 상기환자의 진단은?","stem_table":"| 혈액검사 | |\n|---------|--|\n| 유리 T4 | 1.4 ng/dL (참고치 0.8~1.7) |\n| 갑상선자극호르몬 | 2.1 mIU/L (참고치 0.34~4.25) |\n| 코티졸 | 12.4 μg/dL (참고치 5~25) |\n| 부신피질자극호르몬 | 12 pg/mL (참고치 6~76) |\n| 성장호르몬 | 4.5 ng/mL (참고치 0~0.17) |\n| 인슐린유사성장인자-I | 210ng/mL (참고치 54~436) |\n| 프로락틴 | 392 ng/mL (참고치 2.5~17.0) |\n| 여포자극호르몬 | 1.8 mIU/mL (참고치 1~9) |\n| 황체형성호르몬 | 1.4 mIU/mL (참고치 2~12) |\n| 테스토스테론 | 115 ng/mL (참고치 300~900) |","options":["쿠싱병","말단거대증","프로락틴분비종","TSH 분비선종","비기능성 뇌하수체선종"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q31_p128.png","note":null,"id_simple":"2021-Q31"},{"id":"2021-L11-Q32","year":2021,"qnum":32,"jokbo_lec_no":11,"lecture":"뇌하수체 전엽질환의 내과적 치료","professor":"김정희","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"상기 환자에서의 적절한 치료 지침은?","stem_table":null,"options":["경과관찰","도파민효능제","소마토스타틴 유사체","감마나이프","접형동경유샘종절제술"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q32"},{"id":"2021-L12-Q35","year":2021,"qnum":35,"jokbo_lec_no":12,"lecture":"뇌하수체 전엽질환의 수술적 치료","professor":"김용휘","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"수술적 치료가 필요한 경우는?","stem_table":null,"options":["정상 시력의 라츠케씨 낭종","외모의 변화를 자각하지 못하는 말단비대증","무월경으로 발견된 프로락틴분비종","시력 및 호르몬 장애가 없는 2cm 크기의 비기능성 뇌하수체 선종","배아세포종에 대한 방사선 및 항암 치료 후 추적 중 발견된 비기능성 뇌하수체 종양"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q35"},{"id":"2021-L12-Q36","year":2021,"qnum":36,"jokbo_lec_no":12,"lecture":"뇌하수체 전엽질환의 수술적 치료","professor":"김용휘","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"뇌하수체에서 발생하는 질환의 수술에 대한 옳은 설명은?","stem_table":null,"options":["대부분 개두술로 접근하여 수술한다.","시신경과 뇌하수체 줄기는 안장막에 의해 경계 지어진다.","뇌하수체 선종 수술 시 뇌척수액 유출이 대부분 동반된다.","뇌하수체 선종 수술 시 시신경을 수술 시야에서 직접 확인할 수 있다.","뇌하수체 줄기에 발생한 병변도 뇌하수체 줄기를 보존하며 제거할 수 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q36"},{"id":"2021-L13-Q38","year":2021,"qnum":38,"jokbo_lec_no":13,"lecture":"소아 뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"5세 여아가 키가 작아서 병원에 왔다. 임신나이 38주에 2.2kg으로 주산기적 문제없이 출생하였고 운동 및 언어발달은 정상이었다. 돌 경 체중은 9kg 이었다. 신생아 황달로 5일간 광선치료를 받았고, 생후 2세경 저혈당으로 포도당 수액치료를 받은 적이 있었다. 이마가 튀어나와 보이고, 콧잔등이 낮으며 양 볼이 통통해 보였다. 아빠키 165cm, 엄마키 155cm 이다. 과거 성장기록 및 검사결과는 다음과 같다.\n유리 T4 1.0 ng/dL (정상치 0.7~1.","stem_table":null,"options":["인슐린 유발 저혈당 검사, 1가지 검사로 소아청소년기 결핍증 진단 가능하다.","두통, 구토, 복시, 다뇨/야뇨 등 있는지 확인 필요하다.","부당경량아로 따라잡기 성장을 못하였다.","뇌하수체 선종이 가장 흔한 원인이다.","성장호르몬 보충이 우선이므로 추가 영상검사 결과보고 전에 시작 가능하다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q38_p132.png","note":null,"id_simple":"2021-Q38"},{"id":"2021-L13-Q39","year":2021,"qnum":39,"jokbo_lec_no":13,"lecture":"소아 뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"8세 남아가 키가 잘 자라지 않아서 병원에 왔다. 임신나이 39주에 2.9kg으로 주산기적 문제없이 출생하였고, 운동 및 언어발달은 정상이었다. 생후 5세경 뇌 측두엽 수모세포종으로 수술받았고, 항암치료 및 뇌척추 방사선 치료 받았다. 아빠키 175cm, 엄마키 160cm 이다. 진찰상 고환 2cc, 음모는 성성숙도 1단계였다. 과거 성장기록 및 검사결과는 다음과 같다. 가장 옳은 설명은?","stem_table":null,"options":["단독 (isolated) 성장호르몬 결핍증이다.","요붕증 배제 위한 수분제한검사 필요하다.","아직 이차성징이 없으므로 생식샘 자극호르몬 자극검사 필요하다.","성인키 도달한 후에 성장호르몬 결핍증에 대한 재평가 필요하다.","중추성 갑상선 저하증 발생할 수 있으므로 레보티록신을 투여한다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q39_p132.png","note":null,"id_simple":"2021-Q39"},{"id":"2021-L14-Q42","year":2021,"qnum":42,"jokbo_lec_no":14,"lecture":"부신의 생리","professor":"윤지완","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"다음은 부신 구조의 모식도이다. 부신의 각 층에서 분비되는 호르몬을 알맞게 연결한 것은? (zona glomerulosa-zona fasciculata-zona reticularis-zona medulla 순)","stem_table":null,"options":["cortisol-aldosterone-DHEA-norepinephrine","cortisol-DHEA-aldosterone-norepinephrine","aldosterone-cortisol-DHEA-norepinephrine","aldosterone-DHEA-norepinephrine-cortisol","DHEA-cortisol-norepinhphrine-aldosterone"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q42_p132.png","note":null,"id_simple":"2021-Q42"},{"id":"2021-L14-Q44","year":2021,"qnum":44,"jokbo_lec_no":14,"lecture":"부신의 생리","professor":"윤지완","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"그림에서 (ㄱ)에 들어가는 호르몬으로 맞는 것은?","stem_table":null,"options":["cortisol","ACTH","DHEA","aldosterone","epinephrine"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q44_p132.png","note":null,"id_simple":"2021-Q44"},{"id":"2021-L15-Q43","year":2021,"qnum":43,"jokbo_lec_no":15,"lecture":"부신피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 코티솔 과잉분비에 의해 발생할 수 있는 증상이 아닌 것은?","stem_table":null,"options":["두통","고혈압","고혈당","녹내장","골다공증"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q43"},{"id":"2021-L15-Q45","year":2021,"qnum":45,"jokbo_lec_no":15,"lecture":"부신피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 가장 흔한 내인성 쿠싱 증후군의 원인은?","stem_table":null,"options":["Adrenocortical adenoma","Adrenocortical carcinoma","Cushing's disease","Ectopic ACTH syndrome","Macronodular adrenal hyperplasia"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q45"},{"id":"2021-L15-Q46","year":2021,"qnum":46,"jokbo_lec_no":15,"lecture":"부신피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 쿠싱증후군의 선별 및 진단에 사용되는 검사법이 아닌 것은?","stem_table":null,"options":["1mg overnight dexamethasone suppression test","24 hour urine free cortisol","Low dose dexamethasone suppression test","Midnight plasma cortisol","Rapid ACT stimulation test"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q46"},{"id":"2021-L15-Q48","year":2021,"qnum":48,"jokbo_lec_no":15,"lecture":"부신피질 질환","professor":"곽수헌","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"37세 여자가 체중증가, 월경 감소, 쉽게 멍들고 얼굴이 커지는 증상으로 병원에 왔다. 쿠싱증후군 의심하여 시행한 검사 결과이다.\n1mg overnight dexamethasone test: cortisol 12.8 μg/dL (정상: <1.8μg/dL)\n24HU free cortisol (3회반복): 708 μg (정상: 80~120 μg/day)\nPlasma ACTH 65 pg/ml (5pg/ml 미만이면 억제)\n감별진단에 도움이 되는 검사가 아닌 것은?","stem_table":null,"options":["Adrenal CT","CRH test","High dose dexamethasone suppression test","Inferior petrosal sinus sampling","Sella MRI"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q48"},{"id":"2021-L16-Q47","year":2021,"qnum":47,"jokbo_lec_no":16,"lecture":"내분비 고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"일차성 알도스테론증을 의심하여 선별검사로 plasma renin activity와 serum aldosterone concentration을 측정하려고 한다. 반드시 중단해야하는 고혈압 약제는?","stem_table":null,"options":["alpha blocker","beta blocker","calcium channel blocker","angiotensin receptor blocker","mineralocorticoid receptor antagonist"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q47"},{"id":"2021-L16-Q49","year":2021,"qnum":49,"jokbo_lec_no":16,"lecture":"내분비 고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"27세 남자가 6개월 전부터 시작된 두통과 간헐적 발한 증가 및 심계 항진으로 병원에 왔다. 발한 증가 및 심계 항진 증상은 갑자기 시작되어 수분정도 지속되었다. 혈압 170/120 mmHg, 맥박 104회/분, 호흡 22회/분 체온 36.8℃ 였다. 이 환자를 진단하는데 가장 민감도(sensitivity)가 높은 생화학 검사는?","stem_table":null,"options":["24h urine VMA","24h urine catecholamines","24h total metanephrines","Plasma catecholamines","Plasma free metanephrines"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q49"},{"id":"2021-L16-Q50","year":2021,"qnum":50,"jokbo_lec_no":16,"lecture":"내분비 고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"48세 남자가 3종류의 고혈압 약제 투여에도 불구하고 혈압 조절이 안되어 병원에 왔다. 혈액 검사 결과 serum Na⁺ 140mEq/L, K⁺ 3.2mEq/L 였고, plasma renin activity 0.87 (1-2.","stem_table":null,"options":["right aldosterone producing adenoma","left aldosterone producing adenoma","idiopathic hyperaldoteronism","glucocorticoid remediable aldosteronism","phochromocytoma"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q50_p133.png","note":null,"id_simple":"2021-Q50"},{"id":"2021-L16-Q71","year":2021,"qnum":71,"jokbo_lec_no":16,"lecture":"내분비 고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"33세 남자가 심계항진과 두통을 주소로 내원하였다. 혈압이 180/120 mmHg, 맥박이 100회/분, 호흡수 18회/분, 체온은 37℃이다. 최근 약물 복용력은 없었고, 특별한 과거력 및 가족력은 없었다. 검사 결과 및 복부 전산화단층촬영은 다음과 같다. 수술전 처치로 사용해야할 약물은?\n24시간 소변 검사:\nDopamine 300.0 ug/d (참고치 65-400 ug/d)\nNorepinephrine 1000.0 ug/d (참고치 15-80 ug/d)\nEpinephrine 50.1 ug/d (참고치 0-20 ug/d)\nMetanephrine 624.0 ug/d (참고치 52-341 ug/d)\nNormetanephrine 5000.7 (88-444 ug/d)","stem_table":"| 혈액검사 | |\n|---------|--|\n| 유리 T4 | 1.4 ng/dL (참고치 0.8-1.7) |\n| 갑상샘자극호르몬 | 0.2 mIU/L (참고치 0.34-4.25) |\n| 포도당 | 80 mg/dL |\n| Metanephrine | 5000 pg/mL (참고치 90-930 pg/mL) |\n| normetanephrine | 18000 pg/mL (참고치 100-2300 pg/mL) |","options":["prazocin","atenolol","salbutamol","L-dopa","dexamethasone"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q71_p133.png","note":null,"id_simple":"2021-Q71"},{"id":"2021-L17-Q102","year":2021,"qnum":102,"jokbo_lec_no":17,"lecture":"부신기능 저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"다음은 부신피질기능저하증에서 사용하는 치료제이다. 일차성 부신피질기능저하증에서만 보충이 필요한 호르몬은?","stem_table":null,"options":["Mineralocorticoid","Glucocorticoid","Catecholamine","Estrogen","Dehydroepiandrosterone"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q102"},{"id":"2021-L18-Q51","year":2021,"qnum":51,"jokbo_lec_no":18,"lecture":"소아의 부신질환","professor":"이성용","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"다음은 태아기부터 연령에 따른 부신의 크기(질량)을 보여주는 그림이다. 각 번호는 조직학적으로 구분되는 부신의 부위를 표시하고 있다. 그림의 ②에서 주로 생성되는 호르몬은?","stem_table":null,"options":["ACTH","DHEA","cortisol","aldosterone","norepinephrine"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q51_p134.png","note":null,"id_simple":"2021-Q51","reparsed":true},{"id":"2021-L18-Q52","year":2021,"qnum":52,"jokbo_lec_no":18,"lecture":"소아의 부신질환","professor":"이성용","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"다음은 신생아의 외부성기 사진과 검사 소견이다. 이 환아에 대한 설명으로 옳은 것은?","stem_table":null,"options":["초기 치료는 포도당이 포함된 생리식염수로 탈수를 교정한다.","남아이므로 급성기 치료 이후 특별한 치료가 필요하지 않다.","신생아는 NaCl을 경구로 보충해주는 것이 좋다.","음낭의 피부 색소 침착을 보인다.","음경과 고환이 커져 있다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q52_p134.png","note":null,"id_simple":"2021-Q52"},{"id":"2021-L19-Q55","year":2021,"qnum":55,"jokbo_lec_no":19,"lecture":"다발성 내분비 질환의 분류와 MEN1의 진단","professor":"조선욱","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"34세 여자가 갑자기 발생한 허리 통증을 주소로 내원하였다. 2년 전부터 요로 결석이 반복되는 증상이 있었으며, 내원하여 확인한 X-ray와 골밀도 검사상 골다공증 및 요추 L1에 압박골절이 있었다. 환자는 5년전 심한 재발성 위궤양과 설사로 1년 이상 고생하였고, 위 종양을 제거한 후 다소 호전된 병력이 있었다. 가족력에서 오빠, 남동생 모두 위에 종양이 있었고, 아버지는 췌장의 종양과 요로결석증이 있었다. 다음 환자에서 시행할 유전자 검사는?\n백혈구 4,500 (다핵구 63%), Hb 13.6 g/dL (12-16), K⁺ 4.3 meq/L (3.5-5.","stem_table":null,"options":["MEN1","RET","NF1","VHL","BRAF"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q55"},{"id":"2021-L19-Q63","year":2021,"qnum":63,"jokbo_lec_no":19,"lecture":"다발성 내분비 질환의 분류와 MEN1의 진단","professor":"조선욱","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"42세 남자가 2년 전부터 지속되는 간헐적 의식 저하를 주소로 내원하였다. 아침에 일어나서 정신이 몽롱하고 말을 이해하지 못하는 증상이 간헐적으로 있었다. 증상은 주로 아침을 먹지 않은 날 발생하였고, 식사 후 호전되는 양상을 보였다. 내원 당시 현저한 의식 저하로 보호자와 함께 응급실을 방문하였다. 방문하여 시행한 혈액검사, 복부 CT 및 부갑상선(Tc-99m-MIBI) 스캔 소견은 아래와 같다. 가족력에서 형, 누나 모두 위에 종양이 있었고, 아버지는 흉선암과 요로결석증이 있었다. 이 환자에서 가장 가능한 진단은?\n백혈구 4,500 (다핵구 63%), Hb 13.6 g/dL (12-16), K⁺ 4.3 meq/L (3.5-5.","stem_table":null,"options":["MEN1","MENIIA","MENIIB","Neurofibromatosis type 1","von Hippel-Lindau 병"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q93a_p143.png","note":null,"id_simple":"2021-Q63"},{"id":"2021-L20-Q53","year":2021,"qnum":53,"jokbo_lec_no":20,"lecture":"MENII","professor":"이규언","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다음 중 다발성 내분비 종양 제2형에 특징적으로 발현하는 임상 특징은 무엇인가?","stem_table":null,"options":["갑상선유두암 (papillary thyroid cancer)","갈색세포종 (pheochromocytoma)","갑상선항진증 (hyperthyroidism)","알도스테론분비선종 (aldosterone producing adenoma)","쿠싱병 (Cushing's disease)"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q53"},{"id":"2021-L20-Q54","year":2021,"qnum":54,"jokbo_lec_no":20,"lecture":"MENII","professor":"이규언","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"건강검진에서 고칼슘혈증이 발견된 56세 여자 환자이다. 특별한 증상은 없었고 경부초음파검사와 혈액검사 소견이 다음과 같다. 다음으로 시행할 검사는?","stem_table":null,"options":["소변 24시간 Metanephrine 검사","소변 24시간 Cortisol 검사","소변 24시간 Prolactin 검사","소변 24시간 Albumin 검사","소변 24시간 Immunoglobulin 검사"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q54_p135.png","note":null,"id_simple":"2021-Q54"},{"id":"2021-L21-Q56","year":2021,"qnum":56,"jokbo_lec_no":21,"lecture":"부신의 영상검사","professor":"황성일","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"건강검진에서 시행한 조영 전 CT에서 우연히 보이는 부신종괴가 있을 때, 우선적인 조치는?","stem_table":null,"options":["초음파","조직검사","조영증강 CT","과거영상과 비교","Chemical Shift MRI"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q56"},{"id":"2021-L21-Q57","year":2021,"qnum":57,"jokbo_lec_no":21,"lecture":"부신의 영상검사","professor":"황성일","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"다음 영상 소견 중 부신선종의 영상진단에 가장 도움되는 소견은?","stem_table":null,"options":["흔한 낭성 변화","흔한 내부 출혈","Chemical shift MRI 상 신호강도 유지","조영 증강 CT 상 높은 Washout Rate","조영 전 CT 상 30 이상의 CT number"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q57"},{"id":"2021-L22-Q58","year":2021,"qnum":58,"jokbo_lec_no":22,"lecture":"부신, 신경내분비 종양의 핵의학 진단","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양 핵의학 영상검사의 원리에 해당하는 분자표적은?","stem_table":null,"options":["norepinephrine transporter","sodium iodide symporter","dopamine transporter","dopamine receptor","deiodinase"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q58"},{"id":"2021-L22-Q59","year":2021,"qnum":59,"jokbo_lec_no":22,"lecture":"부신, 신경내분비 종양의 핵의학 진단","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"소마토스타틴수용체가 과발현되어 Ga-68 DOTATOC PET/CT로 진단 가능한 종양이 아닌 것은?","stem_table":null,"options":["췌장선암","뇌수막종","인슐린종","부신경절종","갈색세포종"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q59"},{"id":"2021-L23-Q62","year":2021,"qnum":62,"jokbo_lec_no":23,"lecture":"부신질환의 외과적 치료","professor":"김수진","curr_lec_no":"17","curr_lecture":"부신질환의 외과적 치료","stem":"좌측 부신과 연결된 혈관 중 일반적으로 가장 크기가 크며 갈색세포종 수술 시 가장 먼저 결찰해야하는 혈관은 무엇인가?","stem_table":null,"options":["좌측신동맥 (left renal artery)","좌측신정맥 (left renal vein)","좌측부신동맥 (left adrenal artery)","좌측부신정맥 (left adrenal vein)","좌측아래가로막정맥 (left inferior phrenic vein)"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q62"},{"id":"2021-L24-Q60","year":2021,"qnum":60,"jokbo_lec_no":24,"lecture":"부신, 신경내분비 종양의 핵의학 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"감마선과 베타선을 동시에 방출하여 진단과 동시에 치료를 할 수 있는 핵의학 테라그노스틱스용 방사성의약품은?","stem_table":null,"options":["F-18 FDG","F-18 FDOPA","I-123 MIBG","Ga-68 DOTATOC","Lu-177 DOTATATE"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q60"},{"id":"2021-L24-Q61","year":2021,"qnum":61,"jokbo_lec_no":24,"lecture":"부신, 신경내분비 종양의 핵의학 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"그림과 같이 동일한 분자 표적을 이용하여 핵의학 진단(I-123 MIBG)과 치료(I-131 MIBG)를 할 수 있는 암종은?","stem_table":null,"options":["갑상선 유두암","갑상선 여포암","갑상선 미분화암","갈색세포종","간세포암"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q61_p136.png","note":null,"id_simple":"2021-Q61"},{"id":"2021-L24-Q75","year":2021,"qnum":75,"jokbo_lec_no":24,"lecture":"부신, 신경내분비 종양의 핵의학 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음은 소마토스타틴 수용체 영상을 이용하여 진단동반치료(theragnostics) 개념을 설명하는 모식도이다. 해당하는 방사성 동위원소 표적 치료 전략에 적합할 수 있는 질환은?","stem_table":null,"options":["갑상선 유두상세포암","갑상선 여포상세포암","갑상선 미분화암","삽상선 수질세포암","갑상선 림프종"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q75_p136.png","note":null,"id_simple":"2021-Q75"},{"id":"2021-L25-Q64","year":2021,"qnum":64,"jokbo_lec_no":25,"lecture":"부신 질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"43세 여자가 두통, 사지 허약감 및 고혈압을 주소로 내원하였다. 신체검사상 moon face 및 central obesity가 관찰되었고 혈액 검사상 혈장 glucose 270mg/dL (정상 70-110mg/dL), 혈장 및 소변 cortisol이 증가되어 있는 것이 발견되었다. Aldosterone level은 정상이었다. 이 환자가 가지고 있을 병리학적
