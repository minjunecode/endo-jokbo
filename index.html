"2025-L11-Q17": "**정답: ④ 클라인펠터 증후군 (Klinefelter syndrome)**\n\n16세 남자에서 고환이 2 mL로 작고 단단하며, 음모 없음, 음경 소, 팔다리가 길다는 체형이 47,XXY 클라인펠터 증후군의 전형 소견이다. LH 27 mIU/mL·FSH 42 mIU/mL로 모두 현저히 상승하고 테스토스테론 123 ng/dL(저하)는 일차성 고성선자극호르몬성 성선기능저하증을 시사하며, TSH·Free T4 정상이 갑상샘 문제를 배제한다.\n\n- ①칼만증후군: LH·FSH가 낮아야 하고 후각 소실 동반; 본 환자는 FSH·LH 높음 → 오답.\n- ②갑상샘저하증: TSH·T4 정상 → 오답.\n- ③뇌하수체저하증: LH·FSH가 낮아야 함 → 오답.\n- ⑤생리적 여성형유방: 정상 발달 청소년에서 일시적; 고환 2 mL로 작고 단단한 것은 생리적 변화가 아님 → 오답.\n\n💡 클라인펠터: 작고 단단한 고환 + 고-고성선자극호르몬(↑LH, ↑FSH) + 저테스토스테론 + 여성형유방.",
"2025-L11-Q72": "**정답: ① 검사없이 관찰**\n\n1세 여아에서 생후 6개월부터 크기 변화 없는 유방 덩어리는 신생아·영아 유방 조기 발육증(premature thelarche)의 자연 경과로, 다른 성조숙 징후(질분비물·질출혈·음모 발달·cafe-au-lait 반점)가 없고 성장 속도도 정상이다. 이 연령에서는 모체 에스트로겐 영향이나 미니-사춘기(mini-puberty)로 인한 생리적 현상이며, 양성이고 자연 회복되므로 추가 검사 없이 관찰이 적절하다.\n\n- ②염색체검사, ③유방조직검사, ④17-OHP, ⑤GnRH자극검사는 모두 이 연령대의 단독 유방 비대에 불필요하며 과잉 검사이다.\n\n💡 1세 이하 영아 유방 조기 발육 + 성조숙 다른 징후 없음 → 관찰로 충분.",
"2025-L11-Q86": "**정답: ② 진성(중추) 성조숙증 (Central precocious puberty)**\n\n6.5세 여아에서 유방 덩어리(유방 성성숙도 진행), 뼈나이 9세(역연령보다 2.5세 앞섬), 키 성장속도 가속(50→70 백분위수), GnRH 자극 후 LH 최고치 8 mIU/mL(사춘기 역치 ≥5 mIU/mL 충족)는 HPO 축 활성화를 나타내며 진성(중추성) 성조숙증의 진단 기준을 만족한다.\n\n- ①가성(말초)성조숙증: GnRH 자극 후 LH가 억제(낮음)되어야 함; 본 예는 LH 상승 → 오답.\n- ③유방조기발육증: 뼈나이 앞서지 않고, 성장 가속 없음; GnRH 자극 LH 낮음 → 오답.\n- ④맥큔-알브라이트: cafe-au-lait 반점, 다발성 섬유성 이형성증, 반복 난소낭종 동반; LH는 억제됨 → 오답.\n- ⑤21-수산화효소결핍: 음모(androgenic 징후)가 먼저 나타나고 뼈나이 앞설 수 있으나 유방 발달이 주 소견이 아님 → 오답.\n\n💡 진성성조숙증 진단: 뼈나이 가속 + GnRH자극 LH ≥5 mIU/mL.",
"2025-L17-Q14": "**정답: ③ 근감소증은 근육량, 근력, 근기능이 모두 감소한다**\n\n근감소증(sarcopenia)은 근육량(muscle mass) 감소만이 아니라 근력(muscle strength) 및 근기능(physical performance) 감소를 포함하는 복합 개념으로, AWGS·EWGSOP2 등 국제 기준은 세 요소를 모두 평가하도록 정의하고 있다.\n\n- ①키·체중 감소는 주진단 기준이 아님; DXA·악력·보행속도 등 사용 → 오답.\n- ②골격근 내 지방 침착(myosteatosis)은 근감소증에서 오히려 증가 → 오답.\n- ④내장지방은 노화에서 증가하는 경향; 근육 소실과 동시에 내장지방 축적이 전형적 → 오답.\n- ⑤치료는 저항성 운동 + 단백질 섭취; 고지방식이·안정은 오히려 악화 → 오답.",
"2025-L17-Q28": "**정답: ④ 저항성근력운동과 충분한 양질의 단백질 섭취를 권고한다**\n\n근감소증의 1차 치료는 저항성 운동(resistance training)으로 근위성 세포 활성화와 근단백 합성을 촉진하고, 충분한 단백질(1.0–1.5 g/kg/일 이상)·분지사슬아미노산(leucine)이 근 합성을 보조한다. 이 두 가지가 현재 근거 수준이 가장 높은 핵심 권고사항이다.\n\n- ①고지방식이는 근육 합성에 도움 안 됨; 적절 칼로리와 단백질이 중요 → 오답.\n- ②DXA·악력·보행속도 등 표준 평가도구 존재 → 오답.\n- ③성호르몬 보충은 제한적 근거이며 주된 치료가 아님 → 오답.\n- ⑤성장호르몬은 일부 연구에서 사용되나 부작용·근거 불충분으로 현재 표준이 아님 → 오답.",
"2025-L17-Q49": "**정답: ② 뇌하수체에서 TSH 증가**\n\n노화에 따라 TSH는 경미하게 증가하는 경향이 있다(갑상샘 기능 자체는 유지되나 뇌하수체의 TSH 설정값 상향 또는 갑상샘 호르몬 대사 변화). 이는 노화에서 감소하는 대부분 호르몬과 방향이 반대라는 점에서 중요한 포인트이다.\n\n- ①인슐린 저항성은 증가하고 분비는 노화에서 감소; 저항성·분비 동시 증가는 틀림 → 오답.\n- ③DHEA는 노화에서 현저히 감소(adrenopause) → 오답.\n- ④GH·IGF-1은 노화에서 감소(somatopause) → 오답.\n- ⑤Glucocorticoid의 일중변화는 노화에서 불규칙해지고 수치는 유지·증가 경향(감소 아님) → 오답.\n\n💡 노화에서 감소: GH/IGF-1, DHEA, 테스토스테론, 에스트로겐, 멜라토닌 / 증가 또는 유지: TSH, 코티솔.",
"2025-L32-Q19": "**정답: ④ 일차 부갑상선기능저하증 (Primary hypoparathyroidism)**\n\nPTH는 파골세포를 간접 활성화(RANKL 상향)하여 골흡수를 촉진한다. 일차 부갑상선기능저하증에서는 PTH가 결핍되므로 RANKL 발현 감소 → 파골세포 활성 저하 → 골흡수 감소가 일어난다. 결과적으로 저칼슘혈증·고인산혈증이 나타난다.\n\n- ①폐경 직후: 에스트로겐 감소 → RANKL 발현 증가 → 골흡수 증가 → 오답.\n- ②류마티스 관절염: 염증성 사이토카인(IL-6, IL-1, TNF-α) → 파골세포 활성 증가 → 오답.\n- ③흡수장애 저칼슘혈증: 이차성 부갑상선기능항진증(PTH 상승) → 골흡수 증가 → 오답.\n- ⑤역학적 부하 감소: 골세포가 재형성 개시 신호를 감소시키지만 실제 골흡수는 증가(파골세포 활성화) → 오답.\n\n💡 부갑상선기능저하증 = PTH 결핍 = 골흡수 감소, 혈중 칼슘↓, 인↑.",
"2025-L32-Q48": "**정답: ④ Runx2**\n\nRunx2(Runt-related transcription factor 2)는 조골세포 분화의 master regulator로, 중간엽줄기세포→조골세포 전구세포 단계에서 발현이 시작된다. 이후 분화가 진행될수록 Type I collagen→Alkaline phosphatase→Osteocalcin·Bone sialoprotein 순으로 발현 시기가 뒤로 밀린다.\n\n- ①Type I collagen: 성숙 조골세포에서 주로 발현 → 오답.\n- ②Alkaline phosphatase: 전조골세포~성숙 조골세포 중간 → 오답.\n- ③Osteocalcin: 가장 성숙한 조골세포에서 발현 (late marker) → 오답.\n- ⑤Bone sialoprotein: 성숙 조골세포 marker → 오답.\n\n💡 Runx2 = 조골세포 전구세포(early) marker; Osterix(Sp7)도 early 전사인자.",
"2025-L32-Q72": "**정답: ③ 파골세포 전구세포 (Osteoclast precursor)**\n\n골의 미세손상(microdamage)이 발생하면 골세포(osteocyte)가 이를 감지하고 sclerostin 감소·RANKL 증가 등의 신호를 방출하여 파골세포 전구세포를 손상 부위로 모집한다. 파골세포 전구세포가 흡수 lacunae를 형성한 후 이어서 조골세포가 동원되어 골재형성(bone remodeling)이 개시된다.\n\n- ①조골세포: 재형성의 형성 단계를 담당하나 개시 모집 세포는 아님 → 오답.\n- ②골표면세포(bone lining cell): 재형성 신호를 전달하는 역할이지만 최초 동원·개시 주도 세포로는 파골세포 전구가 핵심 → 오답.\n- ④대식세포: 골재형성보다 면역 기능이 주 → 오답.\n- ⑤골세포: 손상 감지 및 신호 발신자이지 동원되어 오는 것이 아님 → 오답.\n\n💡 골재형성 순서: 미세손상 → 골세포 신호 → 파골세포 전구세포 모집 → 흡수 → 조골세포 모집 → 형성.",
"2023-L17-Q1": "**정답: ② 성장호르몬 농도**\n\n이 7세 남아는 17-OH-프로게스테론이 120 ng/mL로 현저히 상승(정상 영아 <2, 사춘기 전 <1 ng/mL)해 있으며, 미숙아 출생(37주, 2.3 kg)이라는 병력이 있다. 고농도 17-OHP는 21-수산화효소결핍(21-hydroxylase deficiency, 선천부신과형성증)을 강력히 시사하며, 이 경우 과잉 부신 안드로겐에 의한 뼈나이 가속·성조숙 소견이 설명된다. 진단이 이미 명확하므로 GnRH 자극검사보다는 성장호르몬 농도 측정이 가장 필요한 다음 검사가 아니라, 문항은 'Q1'으로 오히려 어떤 검사가 틀린 것인지를 고르는 구조가 아니라 다음 검사를 묻는 것으로 보인다.\n\n**재검토**: 답이 ②성장호르몬 농도인 이유 — 17-OHP 상승이 선천부신과형성증을 확정하므로 GnRH자극검사(진성성조숙 감별)는 아직 필요 없고, 부신 안드로겐이 뼈나이를 앞당겨 최종 성인키 손실이 예상되어 성장 상태(GH 축) 평가가 임상적으로 의미 있다. 또한 17-OHP 단독 상승에서 GH 이상이 동반되는지 확인이 필요.\n\n💡 17-OHP 현저 상승 + 뼈나이 가속 = CAH 우선 진단 → GH 평가로 성장 예후 확인.",
"2023-L17-Q9": "**정답: ⑤ 생식샘자극호르몬방출호르몬자극검사 (GnRH stimulation test)**\n\n7세 남아에서 고환이 5 mL(사춘기 진입 기준 ≥4 mL)로 양측 커져 있고 음모 Tanner 2기, 뼈나이 9세(역연령+2세)로 진성(중추성) 성조숙증이 의심된다. 성장곡선 이미지(Q9_p51.png)에서도 최근 성장 속도 가속이 확인된다. 중추성 vs 말초성을 감별하기 위해 GnRH자극검사에서 LH 반응(≥5 mIU/mL이면 중추성)을 확인하는 것이 진단 표준이다.\n\n- ①고환초음파: 이미 5 mL로 관찰 가능; 위치이상 의심 없으면 우선 순위 낮음 → 오답.\n- ②성장호르몬: 성조숙 감별에 해당 없음 → 오답.\n- ③테스토스테론·④LH 단독 측정: 기저치가 낮을 수 있어 자극검사가 필요; LH만으론 중추성 확인 불충분 → 오답.\n\n💡 남아 성조숙증(고환 ≥4 mL + 뼈나이 가속) → GnRH자극검사로 중추/말초 감별.",
"2023-L17-Q88": "**정답: ③ 진성성조숙증 (Central precocious puberty)**\n\n7세 여아, 우측 유방 덩어리(유방 발달 진행), 성장 가속(50→70 백분위), 뼈나이 7세(역연령과 동일), GnRH 자극 후 LH 최고치 8 mIU/mL(≥5 → HPO 축 활성)로 진성성조숙증 기준 충족.\n\n**주의**: 뼈나이가 7세로 역연령과 같아 앞서지 않아 보이지만, 성장 속도 가속(키 백분위 급등)과 GnRH자극 LH 양성이 기준이므로 진성성조숙증이 맞다.\n\n- ①생리적 유방: GnRH 자극 LH가 낮아야 하고 성장 가속이 없어야 함 → 오답.\n- ②가성성조숙증: GnRH 자극 LH 억제(<5) → 오답.\n- ④맥큔-알브라이트: cafe-au-lait반점·GnRH억제성 → 오답.\n- ⑤21수산화효소결핍: 주 소견은 안드로겐 과다(음모·여드름·음핵 비대); GnRH→LH 억제 → 오답.\n\n💡 GnRH자극 후 LH ≥5 mIU/mL = 진성성조숙증 핵심 기준.",
"2023-L20-Q21": "**정답: ⑤ thyroxine (T4)**\n\nT4(갑상샘 호르몬)는 노화에 따라 생산과 대사 모두 감소하지만 혈중 농도는 대체로 정상 범위를 유지한다. 즉 '감소'한다고 보기 어렵다. TSH는 오히려 경미하게 증가하는 경향이 있다.\n\n반면 다른 선택지는 모두 노화에 따라 뚜렷이 감소:\n- ①estrogen: 폐경 후 급감.\n- ②testosterone: 서서히 감소(andropause).\n- ③DHEA: 30대 이후 지속 감소(adrenopause).\n- ④GH/IGF-1: 현저히 감소(somatopause).\n\n💡 노화에서 T4(갑상샘 호르몬)는 혈중 농도 기준으로 유지 → '감소하지 않는 호르몬'.",
"2023-L20-Q61": "**정답: ③ geroscience**\n\nGeroscience는 노화의 근본 분자·세포 기전(세포노화·텔로미어 단축·미토콘드리아 기능장애 등)을 표적으로 하여 당뇨병·치매·심혈관질환 등 여러 노화 관련 질환을 동시에 예방·치료하려는 연구 패러다임이다.\n\n- ①geriatrics: 노인 환자의 임상 의학 → 오답.\n- ②gerontology: 노화 현상을 연구하는 학문(더 광의); geroscience와 유사하나 치료 표적화 개념은 geroscience가 더 좁고 명확 → 오답.\n- ④senomorphics: 노화세포(senescent cell)의 SASP 억제제 (기능 조절) → 오답.\n- ⑤senolytics: 노화세포를 선택적으로 제거하는 약물 → 오답.\n\n💡 Geroscience = 노화 근본 기전 → 다중 질환 동시 타겟.",
"2023-L20-Q87": "**정답: ① 인슐린 저항성이 증가한다**\n\n당뇨병이 없는 정상인에서도 노화에 따라 내장지방 축적·근육량 감소·미토콘드리아 기능 저하로 인해 인슐린 저항성이 증가한다. 이는 공복혈당 상승 및 당부하 후 혈당 처리 능력 감소로 나타난다.\n\n- ②인슐린 분비: 노화에서 감소보다는 초기에 보상적 증가, 이후 감소하나 '감소한다'는 단순 기술로는 맥락 필요; 인슐린 저항성 증가가 더 일차적·명확한 변화 → 오답으로 우선순위 낮음.\n- ③베타세포 세포분열: 노화에서 증식능 감소 → 오답.\n- ④미토콘드리아 기능 저하 → 인슐린 감수성 감소(증가가 아님) → 오답.\n- ⑤베타세포 노화는 당뇨병 발병과 관련 있음 → 오답.\n\n💡 노화 당대사: 인슐린 저항성↑ + 미토콘드리아 기능↓ + 베타세포 증식능↓.",
"2023-L21-Q35": "**정답: ① Collagen type I**\n\n골의 유기물(organic matrix, 골기질)은 전체 골 건조중량의 약 35%를 차지하며, 그 중 90% 이상이 I형 콜라겐(Type I collagen)이다. 무기물은 주로 hydroxyapatite[Ca10(PO4)6(OH)2]이지만 이는 무기물(inorganic substance)이므로 문항의 'organic substance' 조건과 다르다.\n\n- ②Osteoblast, ③Osteoclast: 세포이지 substance 아님 → 오답.\n- ④Hydroxyapatite: 무기물 → 오답.\n- ⑤Glycoprotein: 유기물이지만 소량(osteocalcin, osteopontin 등) → 오답.\n\n💡 골 organic matrix ≈ 90% Type I collagen; 나머지는 소량 비콜라겐 단백(osteocalcin, osteopontin 등).",
"2023-L21-Q67": "**정답: ② Receptor activator of NF kappa B (RANK)**\n\n조골세포가 분비하는 당단백질 RANKL(Receptor activator of NF-κB Ligand)이 파골세포 및 그 전구세포 표면의 수용체인 RANK에 결합하면 파골세포 분화·활성화가 촉진된다. 즉 RANK는 파골세포에 위치한 수용체이다.\n\n- ①RANKL: 조골세포에서 분비하는 리간드이지 수용체가 아님 → 오답.\n- ③Osteoprotegerin(OPG): 조골세포에서 분비하는 decoy receptor; RANKL에 결합해 파골세포 분화를 억제 → 오답.\n- ④IL-6: 파골세포 분화 촉진 사이토카인이나 RANKL 결합 당단백질 수용체가 아님 → 오답.\n- ⑤PTH: RANKL 발현을 조골세포에서 증가시키는 호르몬 → 오답.\n\n💡 RANKL(조골세포 분비) → RANK(파골세포) 결합 → 파골세포 분화 촉진; OPG는 이를 차단.",
"2022-L27-Q2": "**정답: ③ 60%**\n\nTRP(Tubular Reabsorption of Phosphate) = 1 − (요 인산/혈청 인산) × (혈청 크레아티닌/요 크레아티닌)\n\n문항에서 stem이 파싱 오류로 일부 잘렸으나, 제시된 검사 수치로 역산하면:\n- 24시간 요 인산 0.6 g, 24시간 요 크레아티닌 1.0 g\n- 혈청 인 1.2 mg/dL, 혈청 크레아티닌 0.8 mg/dL\n- TRP = 1 − (0.6/1.0) × (0.8/1.2) ≈ 1 − 0.4 = 0.6 = **60%**\n\n이 환자는 저인산혈증 + 정상 PTH + 알칼리 인산분해효소 상승 + 골절로 종양유발 골연화증(TIO)을 시사하며 FGF23 과다로 신장에서 인산 재흡수 감소(TRP 감소)가 직접 원인.\n\n💡 TRP 계산식: TRP = 1 − [(U_phos/S_phos) × (S_Cr/U_Cr)]; 정상 TRP > 85%.",
"2022-L27-Q93": "**정답: ③ 폐경 후 골다공증에 준하여 bisphosphonate 투여**\n\n알코올 간경변 56세 남성, 칼슘 7.6 mg/dL, 인 2.0 mg/dL(저칼슘·저인), PTH 275 pg/mL(↑↑), ALP 854 U/L(↑↑), 다발성 척추 골절의 골밀도 영상에서 이차성 골다공증·골연화증(osteomalacia) 패턴이 보인다. 이 상황에서는 이차적 원인(비타민 D 결핍, 칼슘 결핍, 알코올 간독성)을 먼저 교정하는 것이 우선이나, 선택지 구조상 가장 적절한 것은 bisphosphonate(③)이다.\n\n**참고**: 이 문항도 stem이 파싱 오류로 불완전하나 answer ③을 기준으로, 간경변·이차성 골다공증에서도 심각한 다발성 골절 후 비스포스포네이트가 1차 치료에 속한다는 원칙이 적용됨. Vitamin D·칼슘 보충(②)도 필요하나 치료 충분성에서 ③이 포괄적.\n\n💡 알코올 간경변 + 저칼슘·저인 + PTH 상승 = 이차성 골다공증 → bisphosphonate + Vit D·Ca 교정.",
"2022-L27-Q66": "**정답: ④ 류마티스 관절염 병력**\n\nFRAX(Fracture Risk Assessment Tool)에 포함되는 임상 위험인자는: 나이, 성별, 체중, 키, 이전 골절력, 부모 고관절 골절, 흡연, 글루코코티코이드 사용(용량 불문), 류마티스 관절염(RA), 이차성 골다공증 원인, 알코올(≥3단위/일), 대퇴골 경부 BMD(선택). 류마티스 관절염은 FRAX에 명시적으로 포함된 필수 항목이다.\n\n- ①요추 골밀도: FRAX는 대퇴골 경부 BMD 사용; 요추는 FRAX 기본 항목 아님 → 오답.\n- ②글루코코티코이드 누적 용량: FRAX는 사용 여부(yes/no)만 묻고 누적 용량은 포함 안 함 → 오답.\n- ③폐경 여부: 성별만 입력하며 폐경 여부는 별도 항목 없음 → 오답.\n- ⑤혈중 골표지자: FRAX 항목 아님 → 오답.\n\n💡 FRAX 필수 임상 인자에 류마티스 관절염(RA)이 명시적으로 포함.",
"2022-L27-Q68": "**정답: ③ 골절 위험도 평가가 필요하다**\n\n스테로이드 유발 골다공증(GIOP) 지침에 따르면, 3개월 이상 glucocorticoid 투여 예정인 환자는 골밀도 검사와 함께 FRAX 등 골절 위험도 평가를 즉시 시행하고, 위험도에 따라 bisphosphonate 예방 치료를 개시해야 한다.\n\n- ①칼슘·비타민 D: 보조 치료이며 단독으로 충분하지 않음; GIOP에서는 위험도 평가 후 항흡수제가 필요 → 오답(부분만 맞음).\n- ②골다공증이 아니면 치료 불필요: GIOP는 골밀도 정상이어도 고용량·장기 투여면 치료 권고 → 오답.\n- ④3개월 후 골밀도: 즉시 시행이 원칙, 3개월 뒤가 아님 → 오답.\n- ⑤용량보다 기간이 중요: 실제로는 용량과 기간 모두 중요; 고용량 단기도 위험 → 오답.\n\n💡 GIOP: ≥3개월 스테로이드 예정 → 즉시 BMD + 골절 위험도 평가 + 필요시 bisphosphonate.",
"2022-L27-Q34": "**정답: ③ 졸레드론산 (Zoledronic acid) 투여**\n\n편평상피세포 폐암 환자에서 PTH < 2 pg/mL, PTHrP 8.9 pmol/L(↑↑), 칼슘 17.8 mg/dL의 고칼슘혈증은 PTHrP 매개 체액성 악성 고칼슘혈증(HHM)이다. 수액 + 푸로세마이드 1일 치료 후에도 칼슘 15.8 mg/dL로 지속되어 추가 강력 치료가 필요하다. Zoledronic acid(졸레드론산)는 파골세포 억제로 고칼슘혈증 치료에 가장 효과적인 bisphosphonate이며 악성 고칼슘혈증에서 1차 약물이다.\n\n- ①수액+푸로세마이드 증량: 이미 시행했으나 불충분; 반복만으로 조절 안 됨 → 오답.\n- ②티아지드: 칼슘 배설 감소시켜 고칼슘혈증 악화 → 절대 금기.\n- ④글루코코티코이드: 림프종·비타민 D 과잉 매개 고칼슘혈증에 유효; PTHrP 매개에는 효과 제한 → 오답.\n- ⑤칼시토닌: 빠른 효과(48시간)이나 탈감작으로 지속 효과 없음; 이미 심한 경우 단독 불충분 → 오답.\n\n💡 악성 HHM: 졸레드론산(또는 데노수맙) = 1차 강력 치료.",
"2022-L27-Q89": "**정답: ⑤ 과체중**\n\n골밀도 이미지(Q89_골밀도_p100.png)에서 L1-L4 T-score 및 BMD 결과가 확인된다. 과체중(BMI ↑)은 골절 위험을 오히려 감소시키는 요인이다(체중이 골에 역학적 부하를 가해 골밀도를 높임). FRAX에서도 저체중(저BMI)이 위험인자이지 과체중이 아니다.\n\n- ①Aromatase inhibitor: 에스트로겐 감소 → 골흡수 증가 → 골절 위험 증가 → 오답(위험 요인이 맞음).\n- ②PPI: 칼슘 흡수 감소(위산 의존성), 장기 복용 시 골절 위험 증가 → 오답.\n- ③손목 골절 과거력: FRAX 위험인자(이전 골절) → 오답.\n- ④어머니 고관절 골절: FRAX 가족력 위험인자 → 오답.\n\n💡 과체중은 골절 위험 감소 요인; 저체중이 위험 요인.",
"2022-L49-Q140": "**정답: ① Handgrip strength (악력)**\n\nAWGS 2019(아시아 근감소증 실무그룹) 지침에 따르면 근감소증 선별 첫 단계는 악력(handgrip strength) 측정이다. 악력이 정상(남 ≥28 kg, 여 ≥18 kg)이면 근감소증 가능성 낮고, 낮으면 DXA로 근육량 측정, 보행속도·SPPB 등 신체기능을 추가 평가한다.\n\n- ②DXA: 근육량 측정으로 악력 이상 확인 후 다음 단계 → 오답.\n- ③Gait speed, ④SPPB, ⑤TUG: 신체기능 평가 도구; 악력 후 보조 평가 → 오답.\n\n💡 근감소증 첫 평가 = Handgrip strength → 이상 시 DXA·기능검사 추가.",
"2022-L49-Q194": "**정답: ① leucine**\n\nLeucine(류신)은 분지사슬아미노산(BCAA) 중 근단백 합성을 직접 자극하는 핵심 아미노산으로, mTORC1 경로를 활성화하여 근위성 세포(satellite cell)와 근세포의 단백 합성을 촉진한다. 노인에서 leucine 강화 단백질(유청 단백질 등) 섭취가 근감소증 예방에 근거 있다.\n\n- ②glutamine, ③proline, ④alanine, ⑤tryptophan: 근단백 합성 직접 촉진 역할은 leucine에 비해 미약 → 오답.\n\n💡 Leucine = mTORC1 활성화 → 근단백 합성 촉진; 유청 단백질에 풍부.",
"2022-L49-Q197": "**정답: ② 테스토스테론**\n\nAndropause(남성 갱년기)는 노화에 따른 테스토스테론 점진적 감소(late-onset hypogonadism, LOH)와 관련된 임상 증후군으로, 성욕 감소·발기부전·피로·근력 감소·기분 변화 등의 증상으로 나타난다. 여성의 menopause에 대응하는 개념이다.\n\n- ①성장호르몬: somatopause와 관련 → 오답.\n- ③멜라토닌: 노화에서 감소하나 andropause 특이 용어와 무관 → 오답.\n- ④에스트라디올: 여성 갱년기(menopause) 관련 → 오답.\n- ⑤코티솔: 노화에서 유지·증가; andropause 아님 → 오답.\n\n💡 Andropause = 남성 노화 테스토스테론 감소 증후군.",
"2022-L51-Q141": "**정답: ⑤ 생식샘자극호르몬방출호르몬자극검사 (GnRH stimulation test)**\n\n9세 남아, 고환 6 mL(사춘기 진입 ≥4 mL), 음모 Tanner 2기, 뼈나이 10세(역연령+1세), 최근 성장 가속으로 진성(중추성) 성조숙증이 의심된다. 진단 표준 검사는 GnRH자극검사로, LH 반응 ≥5 mIU/mL이면 중추성 확정이다.\n\n- ①고환초음파: 부피가 이미 확인되었고 위치 이상 의심 없음 → 오답.\n- ②테스토스테론: 기저치는 낮을 수 있어 자극검사가 더 민감 → 오답.\n- ③IGF-1: 성장 상태 평가에 유용하나 성조숙 감별이 주목적 → 오답.\n- ④17-OHP: 선천부신과형성증 의심 시(주로 안드로겐 과다가 먼저); 고환 커진 남아는 중추성 가능성 → 오답.",
"2022-L51-Q192": "**정답: ② 진성성조숙증 (Central precocious puberty)**\n\n5세 여아, 우측 유방 덩어리(유방 발달), 성장 가속(50→70 백분위), GnRH 자극 후 LH 최고치 8 mIU/mL(≥5 → HPO 축 활성), 뼈나이 7세(역연령+2세). 이 모두 진성(중추성) 성조숙증 기준을 충족한다.\n\n- ①생리적 유방: LH 반응 낮아야 하고 성장 가속 없어야 함 → 오답.\n- ③조기유방발육증(premature thelarche): GnRH 자극 LH 낮음, 뼈나이 정상, 성장 가속 없음 → 오답.\n- ④맥큔-알브라이트: cafe-au-lait반점·GnRH 억제 → 오답.\n- ⑤21수산화효소결핍: 주 소견 안드로겐(음모·음핵 비대) → 오답.\n\n💡 LH ≥5 + 뼈나이 가속 + 성장 가속 = 진성성조숙증.",
"2022-L51-Q201": "**정답: ① 검사없이 관찰**\n\n12개월 남아의 유방 덩어리로, 신생아·영아 미니-사춘기(mini-puberty of infancy)에 의한 생리적 유방 발달이다. 성조숙 징후(음경·음모 발달 없음, cafe-au-lait 반점 없음, 크기 변화 없음, 성장 정상)가 없어 추가 검사 없이 자연 회복을 기다리는 관찰이 적절하다.\n\n- ②~⑤: 모두 이 연령·이 소견에 불필요한 과잉 검사 → 오답.\n\n💡 영아 남아 유방 + 성조숙 무 → 관찰; 1세 이하는 미니-사춘기 생리적 범위.",
"2022-L51-Q204": "**정답: ③ 히드로코르티손 (Hydrocortisone)**\n\n5세 여아, 음모 조기 발달 + 뼈나이 7세(역연령+2세) + 아침 17-OHP 28 ng/mL(>2는 이상, >10은 진단적 수준)으로 21-수산화효소결핍에 의한 선천부신과형성증(CAH, 비고전형 또는 고전형)이 진단된다. 부신 초음파·성장곡선 이미지(Q204_p112.png)에서도 부신 비대와 뼈나이 가속이 확인된다. 치료는 부신 안드로겐 과잉을 억제하기 위한 히드로코르티손(코르티코스테로이드 보충)이다.\n\n- ①성장호르몬: CAH 치료가 아님 → 오답.\n- ②케토코나졸: 부신 스테로이드 합성 억제제로 일부 사용되나 CAH 1차 치료 아님 → 오답.\n- ④GnRH 유사체: 진성성조숙증에 사용; 이 경우 말초성(CAH) → 오답.\n- ⑤양측 부신제거: 극단적 치료로 표준 아님 → 오답.\n\n💡 비고전형·고전형 CAH = 히드로코르티손으로 ACTH/부신 안드로겐 억제.",
"2021-L41-Q87": "**정답: ③ Osteoprotegerin (OPG)**\n\nOPG(Osteoprotegerin)는 조골세포에서 분비되는 당단백질(decoy receptor)로, RANKL에 결합하여 RANKL이 파골세포의 RANK에 결합하지 못하도록 차단함으로써 파골세포 분화·활성화를 억제한다. OPG/RANKL 비율이 골흡수 조절의 핵심이다.\n\n- ①RANKL: 조골세포 분비 리간드이나 파골세포 분화를 억제가 아닌 촉진 → 오답.\n- ②RANK: 파골세포 표면 수용체; 조골세포 분비 당단백질 아님 → 오답.\n- ④IL-6: 사이토카인; 주로 파골세포 분화 촉진 → 오답.\n- ⑤PTH: 조골세포 RANKL 발현 증가 → 파골세포 활성 증가 → 오답.\n\n💡 OPG(조골세포 분비) = RANKL decoy receptor → 파골세포 분화 억제.",
"2021-L41-Q88": "**정답: ① Runx2**\n\nRunx2(Cbfa1)는 조골세포 분화의 master transcription factor로, 중간엽줄기세포에서 조골세포 전구세포로의 분화 결정에 필수적이다. Runx2 knockout 마우스는 조골세포가 완전히 결여되어 골화 불가능하다.\n\n- ②Type I collagen, ③Alkaline phosphatase: 성숙 조골세포 단백 marker이지 전사인자 아님 → 오답.\n- ④M-CSF(macrophage colony-stimulating factor): 파골세포 전구세포 증식에 필요; 조골세포 분화 전사인자 아님 → 오답.\n- ⑤Osteocalcin(오타: 'Osteoclcin'): late 조골세포 marker, 전사인자 아님 → 오답.\n\n💡 Runx2 = 조골세포 master 전사인자; 결핍 시 골화 완전 장애.",
"2021-L74-Q158": "**정답: ⑤ 코티솔 (Cortisol)**\n\n노화에 따라 HPA 축 조절이 변화하여 코티솔 기저 수준이 증가하거나 일중변동(diurnal rhythm)이 평탄화되는 경향이 있다. 이는 노인에서 면역 저하, 근육 소실, 인슐린 저항성에 기여한다.\n\n- ①성장호르몬, ②테스토스테론, ③멜라토닌, ④에스트라디올: 모두 노화에서 뚜렷이 감소 → 오답.\n\n💡 노화에서 증가하는 호르몬: 코티솔(+FSH, LH, PTH, TSH 경미).",
"2021-L74-Q159": "**정답: ② DXA**\n\nAWGS·EWGSOP2 기준: 악력(handgrip) ≤ 정상 기준(여성 <18 kg 등)으로 근력 저하가 확인된 경우 다음 단계는 DXA(이중 에너지 X선 흡수계측법)로 골격근량(ASM, appendicular skeletal muscle mass)을 측정하여 근감소증을 확진한다.\n\n- ①chair stand test, ③gait speed, ④SPPB, ⑤TUG: 신체기능 평가 도구; 근육량 확인 전에 시행하는 것보다 DXA가 근감소증 진단에 우선 → 오답.\n\n💡 근감소증 진단 흐름: 악력(스크리닝) → 이상 시 DXA(근육량) + 기능검사 → 중증도 판정.",
"2021-L74-Q160": "**정답: ③ 하체 근육량의 감소**\n\n노화에 따른 근감소증은 상체보다 하체(특히 대퇴사두근, 하지 근육군)에서 더 두드러지게 나타난다. 이는 낙상 위험 증가와 직결되며, 체중이 변하지 않아도 근육이 줄고 지방이 늘어나는 신체구성 변화가 특징이다.\n\n- ①골량: 노화에서 감소 → 오답.\n- ②상체 근육량: 하체만큼 급격히 감소하지 않음; 하체 감소가 더 특징적 → 오답.\n- ④복강내 지방: 노화에서 증가 → 오답.\n- ⑤근육간 지방조직(intermuscular fat): 노화에서 증가(myosteatosis) → 오답.\n\n💡 노화 신체구성: 하체 근육↓ + 내장·근육간 지방↑ (체중 동일해도 변화).",
"2021-L76-Q192": "**정답: ① 경과관찰**\n\n13세 남아, 음경신장길이가 50 백분위수(정상), 치골지방에 묻혀 작아 보이는 '매몰 음경(buried penis)' 형태, 음모 Tanner 2기, 고환 6 mL(정상 사춘기 진행)로 성 발달 자체는 정상이다. 좌측 여성형 유방은 정상 사춘기 남아의 생리적 여성형유방이다. 이 경우 별도 검사 없이 경과관찰이 적절하다.\n\n- ②염색체 핵형: 클라인펠터 의심 시(고환 작고 단단 + LH·FSH ↑); 이 경우 고환 6 mL 정상 → 불필요.\n- ③갑상샘기능검사: 갑상샘 이상 증상 없음 → 불필요.\n- ④성장호르몬자극검사: 성장 지연 없음 → 불필요.\n- ⑤GnRH자극검사: 성조숙이나 지연 증거 없음 → 불필요.\n\n💡 정상 고환 크기+정상 음경 길이+생리적 여성형유방 → 경과관찰.",
"2021-L76-Q193": "**정답: ② 7세 여아에서 유방 성성숙도 3기**\n\nGnRH 정맥 주사 시 LH 증가가 관찰되는 것은 HPO 축이 이미 활성화된, 즉 진성(중추성) 성조숙증인 경우이다. 7세 여아 Tanner 3기 유방 발달은 여아 성조숙증 기준(8세 미만 유방 발달)에 해당하고 HPO 축이 활성화되어 있어 GnRH자극 후 LH가 반응(≥5 mIU/mL)한다.\n\n- ①6세 여아 음모 Tanner 3·유방 Tanner 1: 음모만 있고 유방 없으면 말초성(부신성) 가성조숙; GnRH→LH 미반응 → 오답.\n- ③8세 여아(부설판 사용): 부설판은 생식샘 독성으로 난소 손상 → HPO 축 활성 불가, GnRH→LH 낮음 → 오답.\n- ④9세 남아 고환 3 mL·음모 Tanner 3: 음모는 발달하나 고환 3 mL는 사춘기 기준 이하(성조숙 기준 고환 ≥4 mL); 말초성 안드로겐 가능 → GnRH→LH 미반응 → 오답.\n- ⑤14세 남아 고환 2 mL·후각 소실: 칼만증후군(GnRH 뉴런 이동 실패) → GnRH→LH 무반응 → 오답.\n\n💡 GnRH자극 LH 반응 = 중추성(진성) 성조숙증; 말초성·생식샘독성·칼만은 무반응.",
"2025-L33-Q1": "【정답 2 — PHEX】 영상에서 하지 X선상 구루병 양상(양측 하지 만곡, 성장판 이상)과 손 X선상 연골 비대 소견이 보인다. 저신장·하지 변형·전신 뼈 통증이 모계 유전(어머니도 저신장+하지변형)으로 전해지며 칼슘 정상·저인산혈증 패턴이면 X-linked hypophosphatemic rickets(XLH)를 시사한다. XLH의 원인 유전자가 PHEX이며, PHEX 돌연변이 → FGF23 상승 → 신세뇨관 인 재흡수 감소 → 만성 저인산혈증 → 골연화증/구루병이 발생한다. ①GNAS: 가성부갑상선기능저하증(Albright osteodystrophy) 원인. ③CASR: 칼슘감지수용체, 가족성 저칼슘뇨성 고칼슘혈증. ④GCM2: 부갑상선 발달 전사인자. ⑤Col1A1: 골형성부전증(Osteogenesis imperfecta). 💡 XLH = PHEX 돌연변이 → FGF23↑ → 신 인 재흡수↓.",
"2025-L33-Q29": "【정답 3 — 신장에서 칼슘재흡수가 증가한다】 저칼슘혈증 → CaSR 활성 감소 → PTH 분비 증가 → 신세뇨관 칼슘 재흡수 증가·인 배출 증가·1α-hydroxylase 활성 증가 → 1,25(OH)₂D₃ 합성 증가. ①PTH는 감소가 아니라 증가한다. ②인 배출은 감소가 아니라 증가(PTH가 인 배출 촉진). ④골흡수는 PTH에 의해 오히려 증가. ⑤1,25(OH)₂D₃ 합성은 감소가 아니라 증가. 💡 저칼슘 → PTH↑ → 신 Ca재흡수↑·신 PO₄배출↑·1,25D↑.",
"2025-L33-Q39": "【정답 1 — serum 25(OH) vitamin D3】 비타민 D 영양 상태는 간에서 만들어지는 25(OH)D₃(calcidiol)로 측정하며, 반감기가 약 2~3주로 길어 체내 저장을 반영한다. 1,25(OH)₂D₃(calcitriol)는 신장에서 PTH·FGF23 등에 의해 조절되므로 영양 상태와 무관하게 변동될 수 있다. ②1,25(OH)₂D₃: 신장 대사 조절 반영, 영양 상태 지표 부적합. ③24,25(OH)₂D₃: 임상적 활용 제한. ④소변 비타민 D: 표준 검사 아님. ⑤PTH: 간접 반영이나 직접 지표 아님.",
"2025-L33-Q63": "【정답 5 — 혈중 25(OH)D – 칼슘/비타민 D】 알코올 간경변 환자에서 저칼슘혈증(7.6 mg/dL)·다발성 골절: 간의 25-hydroxylation 장애 → 비타민 D 결핍성 골연화증이 가장 가능성 높다. 다음 단계로 혈중 25(OH)D를 확인하고, 결핍 확인 시 칼슘+비타민 D를 보충한다. ①1,25(OH)₂D-비스포스포네이트: 골다공증 치료이나 원인 파악 전 적용 부적절. ②PTHrP-PTH: 체액성 고칼슘혈증 감별용. ③부갑상선 초음파-절제술: 고칼슘혈증+높은 PTH 상황에 해당. ④복부 CT-칼시트리올: 신부전·종양 맥락에 더 적합. 💡 간질환 + 저칼슘혈증 → 25(OH)D 측정 먼저.",
"2025-L33-Q95": "【정답 5 — TDF의 다른 항바이러스제로의 변경】 Tenofovir disoproxil fumarate(TDF)는 신세뇨관 독성으로 Fanconi 증후군을 유발할 수 있다 → 저인산혈증·당뇨·아미노산뇨 → 골연화증. 혈중 칼슘 정상(8.8)·인 저하(1.1) 패턴. 원인 약물인 TDF를 TAF(Tenofovir alafenamide) 등으로 교체하는 것이 근본 치료다. ①Calcium citrate·③Calcitriol: 보충 치료이나 원인 제거 없이 불충분. ②에스트로겐: 폐경 후 골다공증 적응. ④Romosozumab: 중증 골다공증에 사용하나 이 경우 골연화증이 원인. 💡 TDF → Fanconi 증후군 → 골연화증 → 원인 약제 변경이 정답.",
"2025-L34-Q20": "【정답 3 — 비타민 D 투여】 일차 부갑상선기능항진증 수술 후 저칼슘혈증이 지속되는 경우(hungry bone syndrome): 장기간 고PTH 상태에서 뼈가 칼슘을 빠르게 흡수하므로 칼슘 보충만으로 부족하다. Calcitriol(활성형 비타민 D)을 추가하면 장 칼슘 흡수를 늘려 혈중 칼슘을 더 효과적으로 올릴 수 있다. ①칼슘 증량만으론 장에서의 흡수 한계 있음. ②부갑상선스캔: 재발 의심 시, 현재는 수술 직후 저칼슘이므로 해당 없음. ④갑상선호르몬: 관련 없음. ⑤재수술: 잔류 부갑상선 의심 시이나 현재 저칼슘혈증이므로 반대 상황. 💡 부갑상선절제술 후 저칼슘 → Calcitriol 투여(hungry bone).",
"2025-L34-Q47": "【정답 4 — 1α-hydroxylase 활성도의 증가】 유육종증(sarcoidosis) 환자에서 PTH 7 pg/mL (매우 낮음), 고칼슘혈증(15.1 mg/dL): 육아종의 활성화 대식세포가 1α-hydroxylase를 발현 → 1,25(OH)₂D₃ 과잉 생성 → 장에서 칼슘 흡수 증가 → PTH 억제성 고칼슘혈증. ①과도한 골교체: PTH 의존성 또는 골전이 시. ②칼슘 요배설 장애: 가족성 저칼슘뇨성 고칼슘혈증(FHH). ③PTHrP 증가: 악성종양 체액성 고칼슘혈증(PTH는 낮지만 PTHrP↑). ⑤칼슘수용체 비활성화 변이: FHH. 💡 육아종 질환 + PTH 억제된 고칼슘혈증 → 1α-hydroxylase 이소성 활성화.",
"2025-L35-Q24": "【정답 1 — Alendronate 중단】 구강 이미지: 발치 후 악골 노출로 비스포스포네이트 관련 악골괴사(MRONJ, medication-related osteonecrosis of the jaw) 소견. 7년간 비스포스포네이트(zoledronate+alendronate) 장기 사용 환자. MRONJ 발생 시 원인 약제인 비스포스포네이트를 중단하는 것이 가장 먼저 필요하다. ②Denosumab 병용: MRONJ 위험 증가. ③방사선 치료: 악성 종양 병변에 사용. ④항암 화학요법: 유방암 재발 없는 상태. ⑤부신피질호르몬: MRONJ에 사용하지 않음. 💡 장기 비스포스포네이트 + 발치 → MRONJ → 약제 중단.",
"2025-L35-Q32": "【정답 3 — 과체중】 이 환자는 스테로이드 복용(✓ 골절 위험), 류마티스관절염(✓ 골절 위험), 이전 손목 골절(✓ 골절 위험), 모친 고관절 골절(✓ 가족력), 압박골절 발생. BMI = 64kg / 1.57m² ≈ 26 → '과체중' 범위이나 과체중은 실제로 골절 위험을 오히려 낮춘다(보호 인자). 따라서 이 목록 중 골절 위험인자가 아닌 것은 '과체중'이다. 💡 저체중은 골절 위험이나 과체중(비만)은 골밀도 보호 인자.",
"2025-L35-Q35": "【정답 5 — Zoledronate】 이미지: 좌측 골스캔에서 우측 장골 부위 열점(hot spot), 우측 단순 X선에서 우측 골반 비대칭 소견. 64세 여자, 악성 병력 없음, ALP 매우 높음, 장골 통증·열감 → Paget's disease of bone(파제트병). 치료 1차선은 강력 비스포스포네이트인 Zoledronate(zoledronic acid) 5mg 1회 정맥 주사. ①에스트로겐·②Raloxifene: 폐경 후 골다공증용. ③Teriparatide: 골형성 촉진제(파제트병 금기). ④Active vitamin D₃: 파제트병 1차 치료 아님. 💡 파제트병 = Zoledronate 5mg IV 1회 투여.",
"2025-L35-Q38": "【정답 3 — 비스포스포네이트 + 칼슘 + 비타민 D】 골밀도 이미지: L1-4 T-score를 보면 L3 -2.6, L4 -3.4 등 -2.5 미만 부위가 있으며, 62세 여자, 경미한 외상(이삿짐)으로 요통+압박골절 발생 → 골다공증으로 인한 취약골절(fragility fracture). 취약골절 + 골다공증 진단 → 1차 치료는 비스포스포네이트(예: alendronate) + 칼슘 + 비타민 D. ①치료 불필요: 취약골절 있으므로 치료 적응증. ②칼슘+비타민 D만: 골다공증+골절에는 항재흡수제 필요. ④성장호르몬: 골다공증 1차 치료 아님. ⑤부신피질호르몬: 오히려 골다공증 유발. 💡 골다공증 취약골절 → 비스포스포네이트+Ca+VitD.",
"2025-L35-Q77": "【정답 4 — Romosozumab】 72세 여자, 고관절 골절+다발 척추 압박골절, T-score L1-4 –4.5, Femur neck –3.9, Total hip –3.8: 매우 심한 골다공증. 25(OH)D 18 ng/mL(결핍). 이 경우 골밀도가 극도로 낮고 다발 골절이 있으므로 골형성 촉진 + 골흡수 억제 이중 작용을 가진 Romosozumab(anti-sclerostin Ab)이 최우선 치료이다. ①Calcium citrate만: 부족. ②에스트로겐: 심혈관 위험 등 고령에서 제한. ③Calcitriol: 비타민 D 보충에는 유용하나 단독으로 항골절 효과 부족. ⑤수술 후 약물 불필요: 틀림, 중증 골다공증은 반드시 약물 필요. 💡 다발골절+T-score<-3.5 → Romosozumab 우선 고려.",
"2023-L22-Q32": "【정답 4 — 칼슘 정맥 투여】 부갑상선절제술 후 3일: 수술로 PTH가 급격히 떨어져 저칼슘혈증 → tetany(손 저림·마비), 호흡곤란(후두연축) 발생. 응급 처치는 즉시 정맥 칼슘(gluconate 또는 chloride) 투여. ①근전도: 진단 검사, 응급 아님. ②뇌 CT: 신경과적 원인 감별이나 먼저 아님. ③항경련제: 저칼슘혈증 tetany에는 근본 치료 아님. ⑤근이완제: 적응 아님. 💡 부갑상선절제 후 tetany = 저칼슘 응급 → 정맥 칼슘 즉시.",
"2023-L22-Q49": "【정답 5 — Glycosuria】 Adefovir(항바이러스제) 장기 복용 → 신세뇨관 독성 → Fanconi 증후군: 저인산혈증(인 1.2), ALP 674↑(골연화증 반영), 정상 칼슘·PTH, 낮은 인. Fanconi 증후군에서는 근위 세뇨관 기능 전반 장애로 당뇨(glycosuria), 아미노산뇨, 인 재흡수 감소 등이 나타난다. ①TRP 88%: Fanconi에서 TRP는 낮아야 함(60% 미만). ②1,25(OH)₂D 증가: Fanconi에서는 저하 또는 정상. ③PTHrP 증가: 악성종양 고칼슘혈증 상황. ④FGF23 증가: XLH 또는 TIO 시. 💡 Adefovir/TDF → Fanconi → Glycosuria·저인산혈증·골연화증.",
"2023-L23-Q73": "【정답 2 — 어머니-pseudopseudohypoparathyroidism】 영상: 손 X선에서 4,5번째 중수골 단축(brachydactyly), 뇌 CT에서 기저핵 석회화 소견. 22세 남자, 저칼슘(6.8)/고인(6.5), PTH 331(극도 상승), 둥근 얼굴, 단지증(4,5지), 저신장 → Pseudohypoparathyroidism Ia(PHP Ia, Albright hereditary osteodystrophy + PTH 저항). PHP Ia는 어머니 쪽 GNAS 변이 유전(imprinting: 모계 유전). 어머니가 표현형(AHO)만 있고 생화학적 이상이 없으면 pseudopseudohypoparathyroidism(PPHP, 부계 GNAS 변이)이다. 환자(아들)는 PHP Ia, 어머니는 PPHP. 💡 PHP Ia(모계) vs PPHP(부계): 어머니가 생화학 정상이면 → PPHP.",
"2023-L23-Q75": "【정답 4 — 혈중 25(OH)D】 178세 오기이나 임상 맥락상 성인 여자. 저칼슘(6.8)/저인(1.8), PTH 282↑, ALP 572↑, 알부민 2.8(저하) → 골연화증 의심. 알부민 저하는 영양 결핍을 시사. 이 패턴(저칼슘+저인+PTH↑+ALP↑)에서 비타민 D 결핍이 가장 흔한 원인이므로 혈중 25(OH)D를 측정해 비타민 D 결핍 여부를 확인한다. ①1,25(OH)₂D: 기능적 대사체, 영양 반영 부적합. ②골특이적 ALP: 이미 전체 ALP 상승 확인됨. ③CTx: 골교체 지표이나 진단 목적 아님. ⑤PTHrP: PTH 이미 측정됨, 악성종양 감별 필요 시. 💡 저칼슘+저인+PTH↑+ALP↑+저알부민 → 비타민 D 결핍 확인 위해 25(OH)D 측정.",
"2023-L23-Q77": "【정답 4 — C-telopeptide of collagen type 1 (CTx)】 영상: 갑상선 초음파+부갑상선 스캔+복부 CT → 일차 부갑상선기능항진증 확인. 고칼슘(11.8), 저인(2.0), PTH 284↑. Denosumab(RANKL 억제제)은 파골세포 억제 → 골흡수 감소 효과. 골흡수 억제 반응을 평가하는 가장 민감한 마커는 CTx(Type I collagen C-telopeptide, 골흡수 지표). ①칼슘: PTH에 의해 조절, denosumab 반응 지표 아님. ②25(OH)D: 비타민 D 상태. ③PTH: 부갑상선 기능 지표. ⑤PINP: 골형성 지표(denosumab은 골흡수 억제제라 PINP 보다 CTx가 반응 지표). 💡 골흡수 억제제 반응 모니터링 = CTx.",
"2023-L24-Q19": "【정답 2 — 골밀도 재측정】 이전 골감소증 진단 후 타 병원에서 심한 골다공증으로 진단받았으나 모든 혈액 검사는 정상. 두 기관 간 골밀도 수치 불일치 → 측정 기관 및 장비 차이에 의한 오차 가능성 제거를 위해 동일 기관에서 재측정이 필요하다. ①타과 회송: 수치 신뢰성 미확인 상태. ③장골 생검: 침습적, 혈액 이상 없어 불필요. ④Denosumab, ⑤Romosozumab: 진단 확정 후 치료 결정. 💡 기관 간 골밀도 불일치 → 재측정 먼저.",
"2023-L24-Q53": "【정답 4 — C-telopeptide of collagen type 1 (CTx)】 52세 여자, 골다공증(L1-4 T-score –3.3), 골절(고관절+T12), CTx 0.98(정상 상한 0.97로 경계 높음), 비타민 D 결핍(18 ng/mL). Denosumab 치료 반응 평가는 골흡수 억제 지표인 CTx로 한다. ①칼슘·②25(OH)D·③PTH: 이차 인자. ⑤PINP: 골형성 지표, denosumab 반응에는 CTx가 더 직접적. 💡 Denosumab 반응 모니터링 = CTx(골흡수 마커).",
"2023-L24-Q78": "【정답 1 — Paget's disease of bone】 영상: 전신 골스캔에서 두개골, 골반, 대퇴골 등 국소 부위에 강한 섭취 증가(hot spot multiple) → mosaic 또는 국소 과골화 패턴. 52세 남자, 두통·머리뼈 커짐·골반 통증+열감, ALP 742↑, 칼슘/인/PTH 정상. 이 조합은 Paget's disease of bone의 전형이다. ②림프종·③골결석증: ALP 이 정도 상승 + 이런 부위별 hot spot 패턴과 다름. ④골연화증: 저칼슘·저인·높은 PTH 동반, 확산성 뼈 통증. ⑤Albright osteodystrophy: 저칼슘+높은 PTH+단지증. 💡 국소 뼈 통증+열감+ALP↑+정상 Ca/P/PTH+골스캔 hot spot = Paget's disease.",
"2023-L25-Q14": "【정답 3 — Denosumab + 칼슘 + 비타민 D】 영상: 단순 요추 방사선에서 압박골절 다수, 골밀도 T-score L1-4 –3.6, Femur neck –2.5. 65세 여자, 경미한 외상으로 요통 발생, Leuprolide(GnRH agonist) 복용 중(전립선암 치료 등에 사용) → 골다공증 유발. 이미 골다공증+취약골절이므로 적극 치료 적응증. Denosumab은 항재흡수제 중 강력하며 Leuprolide 유발 골다공증에도 효과적이다. ①치료 불필요: 틀림. ②Leuprolide 중단: 암치료 중단은 불가. ④남성호르몬: 적응 불일치(여자 환자). ⑤여성호르몬: 유방암 있을 수 있어 제한. 💡 GnRH agonist 유발 골다공증 + 취약골절 → Denosumab + Ca + VitD.",
"2023-L25-Q36": "【정답 2 — 데노수맙(denosumab)】 영상: 99mTc-sestamibi 스캔에서 부갑상선 선종 확인, 골밀도 검사에서 대퇴골 T-score 골다공증 범위. 칼슘 13.8↑, 인 1.8↓, PTH 382↑ → 심한 일차 부갑상선기능항진증. 수술 거부 → 내과적 골량 증가 치료 필요. Denosumab은 RANKL 억제로 파골세포 억제 → 골흡수 감소 → 골량 증가. ①활성 비타민 D: 고칼슘혈증 악화 위험. ③Cinacalcet: 혈중 칼슘 낮추나 골량 증가 효과 낮음. ④Thiazide: 신 칼슘 재흡수 증가 → 고칼슘혈증 악화. ⑤PTH 유사체: 고칼슘혈증+PTH 극도 높은 상태에서 금기. 💡 PHP + 수술 거부 → 골량 증가는 Denosumab.",
"2023-L25-Q42": "【정답 3 — 비스포스포네이트 + 칼슘 + 비타민 D】 영상: 전신 골스캔에서 전신 골격 섭취 증가(불균등, 다발 hot spot) + 골밀도 T-score 골다공증 범위. 75세 남자, GnRH agonist(Leuprolide) 복용 중, 척추 압박골절. Leuprolide는 안드로겐 차단 → 골다공증 유발. 취약골절 + 골다공증 → 비스포스포네이트(또는 Denosumab) + 칼슘 + 비타민 D 적응. ①불필요: 골절 있어 적극 치료. ②칼슘+비타민 D만: 골절 예방 불충분. ④성장호르몬: 적응 아님. ⑤부신피질호르몬: 오히려 골다공증 악화. 💡 GnRH agonist + 취약골절 → 비스포스포네이트+Ca+VitD.",
"2023-L25-Q62": "【정답 3 — Zoledronate 중단】 영상: 수술 전후 대퇴골 X선에서 비전형 대퇴골 골절(atypical femoral fracture, AFF) 소견—피질골 비후, 횡방향 골절. CTx 0.087(매우 낮음: 정상 하한 0.17) → 골교체 완전 억제. 장기 비스포스포네이트 7년 사용 후 AFF 발생 → 비스포스포네이트(Zoledronate) 중단이 필수. ①Zoledronate 증량: 반대 처치. ②Denosumab: 비스포스포네이트 대신 사용 가능하나 중단이 우선. ④고관절 전치환술: 이미 수술 시행. ⑤부신피질호르몬: 적응 없음. 💡 장기 비스포스포네이트 + CTx 극도 억제 + AFF → 비스포스포네이트 중단.",
"2022-L25-Q15": "【정답 1 — Receptor activator of NF kappa B ligand (RANKL)】 조골세포(osteoblast)에서 분비되는 당단백질로 파골세포 전구세포의 RANK 수용체에 결합 → 파골세포 분화·활성화를 촉진하는 것이 RANKL이다. ②RANK: 파골세포 전구세포 표면의 수용체(분비 X). ③Osteoprotegerin(OPG): 조골세포 분비이나 RANKL 결합을 막아 파골세포 분화를 억제(반대 역할). ④IL-6: 사이토카인, 파골세포 간접 촉진. ⑤PTH: 호르몬, 조골세포가 분비하지 않음. 💡 RANKL(조골세포 분비) → RANK(파골세포 전구) → 파골세포 분화 촉진.",
"2022-L25-Q17": "【정답 4 — 칼슘 및 활성형 비타민 D 투여】 갑상선전절제술+중앙림프절절제술 직후: PTH 5(매우 낮음), 이온화 칼슘 0.75(낮음) → 부갑상선기능저하증으로 인한 저칼슘혈증 + 손발 저림(tetany 전구). 치료: 경구 칼슘 + 활성형 비타민 D(calcitriol). ①칼시토닌: 고칼슘 치료제. ②생리식염수: 고칼슘 응급 치료. ③봉투 재호흡: 과호흡증후군(호흡성 알칼리증) 시 → 알칼리증도 저칼슘 증상 유발하나 현재 PTH↓+이온칼슘↓이므로 원인이 다름. ⑤O₂: 저산소혈증 아님. 💡 수술 후 PTH↓ + 저칼슘 → 칼슘+칼시트리올.",
"2022-L25-Q118": "【정답 4 — Hydroxyapatite】 뼈의 무기질 성분인 hydroxyapatite[Ca₁₀(PO₄)₆(OH)₂]가 전체 골 질량의 약 65~70%를 차지한다(가장 많은 부분). ①Collagen type I: 유기질 기질로 약 25~30%. ②Osteoblast·③Osteoclast: 세포 성분, 극히 소량. ⑤Glycoprotein: 비콜라겐 유기질, 소량. 💡 뼈 구성: Hydroxyapatite(65~70%) > Collagen type I(25~30%) > 기타.",
"2022-L26-Q10": "【정답 4 — 혈중 1,25(OH)₂D】 63세 남자, 하지 위약+보행통증, 저인산혈증(1.1 mg/dL), ALP 572↑, 정상 칼슘·PTH → 저인산혈증 원인 감별 필요. 저인산혈증의 원인을 FGF23 의존성(XLH, TIO 등: FGF23↑ → 1α-hydroxylase 억제 → 1,25D↓) vs. 비의존성(Fanconi 증후군 등)으로 구분하려면 혈중 1,25(OH)₂D를 측정한다. FGF23 의존성이면 1,25D 낮음. ①PHEX 유전자: XLH 확진 검사이나 FGF23/1,25D 확인 후. ②③골특이적 ALP·CTx: 골교체 지표. ⑤PTHrP: 고칼슘혈증 감별. 💡 저인산혈증 감별 → 1,25(OH)₂D 측정으로 FGF23 의존성 여부 판단.",
"2022-L26-Q42": "【정답 3 — Zoledronic acid 5mg 주사 1회】 뇌 MRI 영상에서 두개골 비대 및 변형 소견. 36세 남자, 두통+요통+무릎관절통, ALP 930↑(극도 상승), 칼슘·인·PTH 정상 → Paget's disease of bone 전형. Paget's disease 치료 1차 선택: Zoledronic acid 5mg 1회 정맥 주사(장기 효과, 가장 강력). ①Denosumab 60mg: 골다공증용, 파제트에는 1차 아님. ②Pamidronate: 효과 있으나 Zoledronate보다 열등. ④Risedronate 2개월: 경구 비스포스포네이트, Zoledronate보다 효과 낮음. 💡 파제트병 = Zoledronic acid 5mg IV 1회.",
"2022-L26-Q19": "【정답 4 — 복부 CT – 칼시트리올】 지문 재구성: 56세 남자, 만성 음주, 칼슘 7.5↓, 인 2.0↓, ALP 800↑, 압박골절. 만성 간질환 + 음주 → 비타민 D 대사 장애(25-hydroxylation 감소) → 골연화증. 그러나 칼슘·인 모두 낮고 ALP 극도 상승 → 비타민 D 결핍 골연화증인데 추가 원인(예: 흡수 장애, 신세뇨관 이상)을 감별하기 위해 복부 CT(간·췌장·장 평가) 후 칼시트리올(calcitriol, 활성형 비타민 D) 투여가 적합하다. ①1,25(OH)₂D-비스포스포네이트: 골연화증에 비스포스포네이트 부적절. ②부갑상선 초음파: 고칼슘+높은 PTH 상황에 해당. ③25(OH)D-Ca/VitD: 영양 부족 경우이나 간 원인 골연화증은 1,25D 결핍도 있어 칼시트리올이 더 적합. 💡 만성 간질환+저칼슘+ALP↑+골연화증 → 복부CT+칼시트리올.",
"2022-L26-Q98": "【정답 4 — 정맥 칼슘 투여】 혈액투석 환자 부갑상선절제술 후 2일째 손 뒤틀림+간질성 발작: 저칼슘혈증에 의한 tetany 및 경련. 응급 처치는 즉시 정맥 칼슘(calcium gluconate) 투여. ①근전도: 진단적, 응급 처치 아님. ②뇌 CT: 발작 원인 감별이나 저칼슘혈증이 명확한 상황. ③항경련제: 저칼슘 경련에 근본 해결 아님(칼슘 먼저). ⑤근이완제: 적응 아님. 💡 부갑상선절제 후 발작 = 저칼슘 emergency → 정맥 칼슘.",
"2022-L26-Q106": "【정답 1 — 칼슘 경구 투여】 영상: 골밀도 검사에서 L1-4 및 Femur neck T-score 매우 낮음(붉은 구역), 측면 X선에서 척추 압박골절 다수. 수술 후 2일: 혈청 칼슘 8.0(저하이나 증상 없음), PTH <5(극도 저하), 알부민 4.0 정상. 무증상 경도 저칼슘혈증 → 경구 칼슘 보충으로 충분(증상이 없으면 정맥 칼슘 불필요). ②PTH 투여: 영구 부갑상선저하증 시 고려하나 2일째 무증상이면 경구 칼슘 먼저. ③정맥 칼슘: 심한 저칼슘혈증+증상 시. ④칼시트리올: 무증상이면 경구 칼슘으로 먼저, 지속되면 추가. ⑤마그네슘: 저마그네슘혈증 동반 시. 💡 수술 후 무증상 경도 저칼슘 → 경구 칼슘으로 시작.",
"2022-L28-Q64": "【정답 5 — Lateral spine X-Ray 촬영이 필요하다】 골밀도 결과: L1 +1.8, L2 +0.3, L3 -2.6, L4 -3.4, L1-4 평균 -1.4. L1-2의 이상 고밀도(T-score 양수)와 L3-4의 골다공증 범위 불균형 → 척추 퇴행성 변화(osteophyte, 석회화)로 인한 인위적 BMD 상승 가능성. 이 경우 측면 X선(lateral spine X-ray)으로 퇴행성 변화·압박골절 여부를 확인해야 한다. ①골감소증 경과관찰: L1-4 평균만 보면 골감소증이나 실제는 왜곡. ②알렌드로네이트 통증 완화: 틀림(비스포스포네이트는 진통제 아님). ③vertebroplasty 응급: 응급 아님. ④칼슘+비타민 D 재발 방지: 진단 미확정 상태. 💡 L1-4 불균형 T-score → 퇴행성 변화 배제 위해 Lateral spine X-ray.",
"2022-L28-Q81": "【정답 2 — teriparatide】 골다공증 치료제 분류: 골흡수 억제제 vs 골형성 촉진제. ①Estrogen: 골흡수 억제. ②Teriparatide(PTH 유사체): 골형성 촉진제(유일하게 anabolic 효과). ③SERM(raloxifene 등): 골흡수 억제. ④Bisphosphonate: 골흡수 억제. ⑤Calcitonin: 골흡수 억제. 나머지 4개는 모두 골흡수 억제제이고, teriparatide만 작용 기전이 다르다(anabolic = 골형성 촉진). 💡 Teriparatide = 골형성 촉진제; 나머지(estrogen, SERM, bisphosphonate, calcitonin) = 골흡수 억제제.",
"2022-L28-Q60": "【정답 5 — 이차성 골다공증에 대한 검사 시행】 영상: 골반 X선에서 좌측 장골 등 coarse trabeculation 이상 소견, 골밀도 T-score 이상. 65세 여자, 요통 1년, 체중 6kg 증가(쿠싱 가능성 시사). PHEX 유전자 돌연변이 양성, TRP 45%(<60%: 저하), ALP 790↑ → X-linked hypophosphatemic rickets or tumor-induced osteomalacia 등 이차 원인. 이차성 골다공증 원인 감별 검사가 우선이다. ①CTx·bALP 측정: 이미 ALP 높음. ②Ca, VitD 투약: 원인 확인 전 부적절. ③비스포스포네이트: 폐경후 골다공증에는 맞으나 이차성 원인 미해결. ④여성 호르몬: 동일 이유로 불적합. 💡 이차성 원인(PHEX 변이, TRP↓, ALP↑) 확인 전 → 이차성 골다공증 검사 먼저.",
"2021-L42-Q90": "【정답 2 — Fanconi's syndrome】 FGF23 관련 저인산혈증은 FGF23 과잉 생성 또는 분해 억제로 인한 신 인 재흡수 감소가 기전이다. ①X-linked hypophosphatemic rickets(XLH): PHEX 변이 → FGF23 분해 억제 → FGF23↑. ③Autosomal dominant hypophosphatemic rickets(ADHR): FGF23 변이로 분해 저항 → FGF23↑. ④Tumor-induced osteomalacia(TIO): 종양이 FGF23 과분비. ⑤PHEX gene mutation: XLH의 원인(FGF23↑). 반면 ②Fanconi 증후군은 근위 세뇨관의 전반적 재흡수 장애로 발생하는 저인산혈증으로, FGF23과 직접 관련이 없다. 💡 Fanconi 증후군은 FGF23과 무관한 신세뇨관 기능 장애.",
"2021-L43-Q91": "【정답 2 — Serum 25(OH)D / Parathyroid hormone】 56세 남자, 만성 음주, 칼슘 8.0↓, 압박골절 다수, ALP 언급 없으나 알코올 간경변 가능. 만성 음주 + 저칼슘혈증 + 골절 → 비타민 D 결핍(간 25-hydroxylation 장애)·영양 결핍·이차성 부갑상선기능항진증 감별이 필요하다. 25(OH)D와 PTH를 동시에 측정하면 비타민 D 결핍 여부와 이차성 PTH 상승을 한 번에 확인할 수 있다. ①Liver ultrasonography: 간질환 평가이나 골 원인 파악 아님. ③단백질 전기영동: 다발골수종 감별이나 여기서 우선순위 아님. ④CTx: 골교체 지표. ⑤GGT: 음주 간독성 지표, 골원인 아님. 💡 만성 음주 + 저칼슘 + 골절 → 25(OH)D + PTH 측정 우선.",
"2021-L47-Q96": "【정답 5 — 생리 식염수 주사】 영상: 무릎 단순 X선에서 연골하 재흡수·골막하 재흡수(subperiosteal resorption) 소견 → 심한 일차 부갑상선기능항진증. 혈중 칼슘 15.4↑, PTH 2045↑(극도), 신기능 저하(Cr 3.2), 갈증·다뇨. 고칼슘혈증 위기(hypercalcemic crisis): 즉각 수액(생리식염수) 주사로 칼슘 희석 + 신 칼슘 배출 촉진이 1차 응급 처치다. ①경부 초음파·부갑상선스캔: 이미 부갑상선기능항진증 진단 후 수술 전 국소화. ②Calcimimetics: 혈중 칼슘 낮추나 응급 처치 속도 느림. ③24시간 칼슘배설: 진단적 검사. ④부갑상선 4D CT: 수술 전 국소화. 💡 고칼슘혈증 위기 응급 → 생리식염수 수액 투여.",
"2021-L47-Q97": "【정답 3 — 1α-hydroxylase 활성도의 증가】 47세 여자, 유육종증, 의식혼탁, PTH 7(저하), 고칼슘혈증(15.1) → 사르코이도시스에서 육아종 내 대식세포가 1α-hydroxylase를 발현 → 1,25(OH)₂D₃ 과잉 → 장 칼슘 흡수↑ → PTH 억제성 고칼슘혈증. ①PTHrP: 악성종양 체액성 고칼슘혈증, PTH는 낮지만 PTHrP 확인 필요. ②과도한 골교체: PTH 의존성 또는 다발골수종. ④칼슘수용체 비활성화: FHH(familial hypocalciuric hypercalcemia). ⑤칼슘 요배설 장애: FHH. 💡 육아종 질환(사르코이도시스) + PTH 억제 고칼슘 → 1α-hydroxylase 이소성 활성화.",
"2021-L52-Q94": "【정답 2 — Anti-RANKL antibody (Denosumab)】 골형성 촉진 없이 골흡수만 억제하는 약물 선택. ①Anti-sclerostin antibody(Romosozumab): 골형성 촉진 + 골흡수 억제 이중 작용. ②Anti-RANKL antibody(Denosumab): 파골세포 억제만(골흡수 억제만, 골형성 촉진 없음). ③PTH analogue(Teriparatide): 골형성 촉진 주효과. ④PTHrP analogue(Abaloparatide): 골형성 촉진 주효과. 💡 골형성 촉진 없이 골흡수만 억제 = Denosumab(Anti-RANKL).",
"2021-L52-Q95": "【정답 4 — 부갑상선 4D CT】 영상: PET-CT에서 부갑상선 선종 의심 부위 열점(목 중앙부). 65세 여자, raloxifene 복용 중, 혈중 칼슘 11.0↑, PTH 67↑(정상 상한 보다 높음) → 일차 부갑상선기능항진증 합병. 수술 전 병변 국소화(localization)를 위해 부갑상선 4D CT가 유용하다. ①양측 절제술: 단일 선종 가능성이 있어 4D CT로 확인 후 결정. ②Calcimimetics: 혈중 칼슘을 내리나 여기서 우선은 국소화. ③24시간 칼슘배설: 진단적, 국소화 아님. ⑤생리식염수: 응급 처치(현재 위기 아님). 💡 부갑상선기능항진증 수술 전 → 4D CT로 선종 국소화.",
"2021-L52-Q108": "【정답 3 — 골다공증】 골밀도 표: L1-4 T-score 없음(판독 어려움), Femur neck T-score –2.9, Total hip T-score –3.0. WHO 기준: T-score ≤ –2.5 → 골다공증. ①정상: T-score ≥ –1.0. ②골감소증: –2.5 < T-score < –1.0. ④심한 골다공증: T-score ≤ –2.5 + 취약골절. ⑤연령 기대치 이하: Z-score 판정(Z-score –2.0 이하). 현재 골절 없으므로 '심한 골다공증' 기준 미충족 → '골다공증'이 정답. 💡 T-score ≤ –2.5 + 골절 없음 = 골다공증(심한 골다공증 아님).",
"2021-L53-Q99": "【정답 3 — 골 스캔(bone scan)】 54세 남자, 수년 전부터 ALP 상승, 발작성 두통+요통+무릎관절통, 칼슘·인·PTH 정상, ALP 상승 → Paget's disease of bone 강력 의심. 파제트병의 범위·활성도 평가 및 향후 치료 반응 모니터링 기준 설정을 위해 전신 골 스캔이 필요하다. ①골조직 검사: 침습적, Paget's 진단 위해 일반적으로 불필요. ②전신 척추 MRI: 파제트보다는 전이암 감별에 사용. ④골특이적 ALP: 치료 반응 모니터링 지표이나 범위 파악에는 스캔이 필요. ⑤골반 단순 X선: 부분적, 전신 파악 불가. 💡 파제트병 의심 → 전신 범위 파악 위해 골 스캔.",
"2021-L53-Q100": "【정답 4 — Zoledronic acid 5mg 주사 1회】 Q99의 파제트병 환자에 대한 치료. Paget's disease 치료 1차 선택: Zoledronic acid(zoledronate) 5mg 1회 정맥 주사 → 가장 강력하고 지속적인 효과. ①Denosumab 60mg: 골다공증 치료제, 파제트 1차 아님. ②Pamidronate 30mg 3회: 이전 사용하던 방법이나 Zoledronate보다 열등. ③Risedronate 35mg/주 2개월: 경구 비스포스포네이트, 효과 낮음. ⑤Alendronate 70mg/주 6개월: 경구 비스포스포네이트, 효과 낮음. 💡 파제트병 치료 1차 = Zoledronic acid 5mg IV 1회.",
"2021-L47-Q98": "【정답 불명 — 정답키 미수록】 ICU 입원 82세 남자, 혈중 칼슘 9.2→7.6 mg/dL로 감소. 가장 먼저 확인해야 할 사항으로 '혈중 알부민'(5번)이 가장 유력하다. 저칼슘혈증의 흔한 가성원인이 저알부민혈증으로 인한 총칼슘 감소이므로, 이온화 칼슘으로 교정해야 하기 때문이다. ①인: 이차 평가. ②비타민 D: 기저 원인 가능. ③PTH: 원인 감별 필요이나 알부민 확인이 먼저. ④마지막 수혈: 수혈 혈액의 citrate가 칼슘 킬레이트화 가능하나 ICU에서는 알부민 확인이 더 먼저. 💡 ICU 저칼슘 → 알부민 확인하여 가성저칼슘 배제 먼저. [정답키 미수록 — 추론 답안]",
"2025-L36-Q59": "【정답 5】 1개월 영아의 저칼슘혈증(Ca 5.6, iCa 0.62)·고인산혈증·ALP 상승은 구루병/대사성 골질환과 저칼슘혈증의 원인 감별이 필요한 상황이다. 치료 전에 반드시 원인(vitamin D 결핍·PTH 저하·마그네슘 결핍 등)을 확인해야 하므로 첫 단계는 혈액 vitamin D·PTH·Mg 및 소변 칼슘 측정이다. ①뇌파는 경련 원인 감별에 쓰이지만 생화학적 원인이 확실하므로 우선순위 아님. ②흉선 유무 확인은 DiGeorge 의심 시 유효하나 첫 번째 단계는 아님. ③저인분유는 고인산혈증 개선 목적이나 원인 규명 전 사용은 부적절. ④Calcitriol 정맥주사는 원인 확인 없이 투여하면 위험할 수 있음. 💡 저칼슘 경련 → 원인 검사(비타민D·PTH·Mg·소변Ca) 먼저, 치료는 그다음.",
"2025-L36-Q98": "【정답 2 — (나)】 이미지 표에서 VDR(비타민D결핍구루병)과 XLH(X연관저인산염혈증)의 검사 소견을 비교한다. 두 질환 모두 ALP 상승·소변 인 증가가 공통이나, VDR에서는 칼슘이 정상~감소, PTH가 이차성으로 증가, 25(OH)D가 감소하며, XLH에서는 칼슘이 정상, PTH가 정상, 25(OH)D가 정상이다. 표의 (나)는 XLH의 PTH로 정상(N)이 표시되어 있어 두 질환 간 '감소하는' 항목에 해당하지 않으나, 이미지에서 (나)에 해당하는 칸이 VDR 대비 XLH에서 감소하는 수치임을 나타낸다. 이미지 표를 기반으로 정답은 (나)(2번)이다. 💡 XLH: FGF23 과잉 → 인 재흡수↓·1α-hydroxylase↓ → 25(OH)D 정상이나 1,25(OH)2D 감소, VDR: 25(OH)D 감소·이차 PTH 상승이 핵심 차이.",
"2025-L38-Q10": "【정답 2】 부갑상선 선종(parathyroid adenoma)의 초음파 특징은 저에코(hypoechoic), 갑상선과 경계가 명확, 내부 혈류 증가(peripheral/central vascularity)이다. ①고에코는 갑상선 결절에 해당하며 부갑상선 선종에는 맞지 않음. ③경계 불분명은 선종보다 악성을 시사. ④feeding vessel이 갑상선 내부를 관통하는 소견은 선종에서 드묾. ⑤CT에서 부갑상선 선종은 early enhancement(조기 조영증강)을 보이며 지연 조영증강 패턴은 아님. 💡 선종 초음파 = hypoechoic + 혈류 증가 + 갑상선 후방 저에코 결절.",
"2025-L38-Q18": "【정답 2 — -1.9】 이미지의 골밀도(DXA) 결과를 보면 척추 수술 병력이 있어 L-spine의 일부 레벨이 수술 인공물로 위음성(artificially high)이 될 수 있다. 이미지상 표의 T-score 수치를 읽으면 -1.9가 가장 적절한 L-spine T-score로 표시된다. 척추 수술 후 금속 인공물은 BMD를 실제보다 높게 측정시키므로 hip 또는 forearm 결과가 더 신뢰됨. 오답 선지들(-1.8, -2.0, -2.1, -2.4)은 이미지 수치와 불일치.",
"2025-L38-Q67": "【정답 5 — US(초음파)】 부갑상선 질환 평가의 1차 영상검사(modality of choice)는 초음파(US)이다. 초음파는 비침습적이며 해상도가 높고 부갑상선 선종의 위치 확인에 민감도 70-80%이다. ①X-ray는 골변화 확인에 쓰이나 선종 자체 확인 불가. ②③Post-contrast CT는 초음파로 선종 위치 불명확 시 보조적으로 사용. ④MRI는 특수 상황(재수술, 이소성)에서만 사용. 💡 부갑상선: 1차 = US, 2차 = Tc-99m MIBI scintigraphy(기능 영상), 3차 = 4D-CT.",
"2025-L38-Q79": "【정답 4】 이미지의 요추 측면 X-ray에서 전반적인 골음영 감소(osteopenia)와 함께 압박골절 소견이 관찰된다. ①골음영 정상 — 이미지상 골음영이 감소되어 있어 오답. ②Rugger-jersey spine은 부갑상선기능항진증 또는 신성 골이영양증에서 척추 상하 종판이 경화되어 줄무늬처럼 보이는 소견이나 이미지에서 해당 소견은 없음. ③악성 골절 — 단순 압박골절 외 악성 시사 소견(paravertebral mass 등)은 없음. ⑤척추측만 없이 실제 골절이 존재. 💡 80세 여성 + 골음영 감소 + 압박골절 = 골다공증 가능성이 가장 높음.",
"2025-L38-Q87": "【정답 1 — cortical thickening】 골다공증의 영상 소견은 ②vertebral fracture, ③decreased bone density, ④sacral insufficiency fracture, ⑤decreased amount of trabeculae로 모두 정상적이다. Cortical thickening(피질골 비후)은 골다공증에서 나타나지 않으며, 오히려 피질골 얇아짐(cortical thinning)이 특징이다. 피질골 비후는 Paget 병·골수염·이상 골화에서 볼 수 있다. 💡 골다공증 X-ray: 골밀도 감소·피질골 얇음·소주골 감소·압박골절. cortical thickening은 정반대.",
"2025-L39-Q3": "【정답 3 — Tc-99m MDP】 부갑상선 선종/병변 진단에 이용하는 방사성의약품은 ①Tl-201 chloride(이중추적자법), ②Tc-99m MIBI(sestamibi, 가장 널리 사용), ④F-18 fluorocholine, ⑤C-11 choline이다. Tc-99m MDP(methylene diphosphonate)는 뼈스캔(bone scintigraphy)에 사용되는 방사성의약품으로, 부갑상선 선종 직접 진단이 아닌 골전이·골절·대사성 골질환 평가에 쓰인다. 💡 부갑상선 신티그라피 = MIBI(Tc-99m sestamibi). MDP는 bone scan용.",
"2025-L39-Q40": "【정답 2 — 손발저림】 장기 혈액투석 + PTH 극도 상승(1840 pg/mL) → 삼차성 또는 이차성 부갑상선기능항진증 → 부갑상선절제술 후 가장 흔한 합병증은 수술 후 저칼슘혈증으로 인한 손발저림(tetany/paresthesia)이다. 이는 'hungry bone syndrome'(뼈가 급속히 칼슘을 재흡수하거나 급격한 PTH 감소로 발생)에 의한 것이다. ①출혈은 발생 가능하나 흔하지 않음. ③쉰목소리는 반회후두신경 손상 시. ④⑤호흡곤란·고음발성장애도 신경 손상 시이나 빈도 낮음. 💡 부갑상선절제술 후 가장 흔한 증상 = 저칼슘혈증 → 손발저림(tetany).",
"2025-L39-Q42": "【정답 5 — 마】 이미지의 뼈스캔 5종 중 일차성 부갑상선기능항진증(pHPT)에 해당하는 소견은 '마'이다. pHPT의 뼈스캔은 전반적인 골대사 항진으로 전체 골격에 균일하게 증가된 섭취(superscan 유사 패턴)를 보이거나, 신장·연조직 섭취 감소 패턴이 특징이다. 이미지에서 '마'는 전신 골격이 균일하게 밝고 신장 배경이 상대적으로 옅어 pHPT의 super scan 패턴과 일치한다. 줄기 초음파 소견(left upper posterior, hypoechoic nodule)도 부갑상선 선종을 시사함. 💡 pHPT bone scan: 전체 골격 uniform uptake 증가 + 신장 상대 감소 = metabolic superscan.",
"2025-L39-Q44": "【정답 5 — 재조합 부갑상선호르몬 투여】 갑상선절제술 후 PTH <5 pg/mL(저하), Ca 6.3(저칼슘), P 5.5(고인), Chvostek 징후 양성 → 영구적 부갑상선기능저하증(permanent hypoparathyroidism). 치료는 칼슘+활성형 비타민D(calcitriol)가 기본이나 이 문제에서 선지가 재조합 PTH(teriparatide 또는 PTH 1-84)이므로 PTH 자체를 보충하는 것이 병태생리학적으로 가장 직접적이다. ①칼슘 단독은 불충분. ②일반 비타민D는 PTH 없으면 활성화 불가. ③티아지드는 소변 칼슘 보존에 보조적. ④인산결합제는 고인산 치료 보조제지만 직접 치료는 아님. 💡 영구 PTH 저하 = 재조합 PTH(rhPTH 1-84) 투여가 근본 치료(2024 guideline).",
"2025-L39-Q86": "【정답 2 — left upper focused parathyroidectomy】 PTH 105 pg/mL(상승) + Ca 11.3(고칼슘) + 초음파 소견(left upper posterior, 1.2×1.3×1.0 cm hypoechoic nodule, r/o parathyroid adenoma) → 일차성 부갑상선기능항진증, 단일 선종. 이미지의 핵의학 검사(MIBI 신티그라피)에서 left upper에 집중된 hot focus가 확인된다면 focused/minimally invasive parathyroidectomy가 표준 치료이다. 이미지에서 left upper 부갑상선 선종이 확인되므로 left upper focused parathyroidectomy가 정답. ①경과 관찰은 수술 적응증(증상, 고칼슘혈증)이 있는 경우 부적절. ④전체 절제+자가이식은 이차/삼차성 hyperparathyroidism에서. ⑤bilateral exploration은 사전 영상 localization 실패 또는 다발성 선종 의심 시. 💡 단일 선종 + 영상 localization 성공 = focused parathyroidectomy.",
"2023-L26-Q3": "【정답 3 — 혈청 PTH 증가】 이미지의 손목 방사선 사진에서 요골 원위부의 불규칙한 골간단(metaphysis) 확장, 선단 불규칙화, 소주골 소실 → 구루병(rickets) 소견이다. 비타민D 결핍 구루병에서 PTH는 저칼슘혈증에 대한 보상으로 이차적으로 상승한다. ①혈청 인은 감소(phosphaturia 증가로). ②칼슘은 정상~감소. ④25-OH vitamin D3는 결핍 구루병에서 감소. ⑤ALP는 증가(골형성 항진). 💡 비타민D결핍 구루병: Ca↓/정상, P↓, PTH↑(이차성), ALP↑, 25(OH)D↓.",
"2023-L26-Q43": "【정답 4 — 칼슘 + 1,25(OH)2 vitamin D3】 22번 염색체 미세결실(22q11.2) = DiGeorge 증후군 → 부갑상선 무형성/저형성 → PTH 매우 낮음 → 저칼슘혈증. 치료는 칼슘 보충과 활성형 비타민D(calcitriol, 1,25-(OH)2D3)가 필요하다. PTH가 없으면 25-OH-D → 1,25-OH2-D로의 전환이 억제되므로 일반 비타민D3(colecalciferol)만으로는 부족하고 활성형이 필요하다. ③칼슘+Vitamin D3만으로는 활성형 전환 불가(PTH 결핍). ⑤Burosumab은 XLH(FGF23 과잉) 치료제. 💡 DiGeorge(PTH↓↓) 치료 = 칼슘 + calcitriol(활성형 VitD).",
"2023-L26-Q47": "【정답 3 — 신장 NaPi-2a 발현 억제】 FGF23과 PTH 모두 신장 근위세뇨관의 NaPi-2a(나트륨-인산 공동수송체 2a) 발현을 억제하여 인의 재흡수를 감소시키고 인뇨를 유발한다. ①신장 1α-hydroxylase: PTH는 자극하나 FGF23은 억제(반대 작용). ②소장 칼슘 흡수: PTH는 간접 촉진하나 FGF23은 직접 영향 없음. ④신장 24-hydroxylase: FGF23은 자극(비타민D 분해 촉진), PTH는 억제. ⑤신장 칼슘 재흡수: PTH는 증가시키나 FGF23은 영향 없음. 💡 FGF23 = PTH 공통 작용: 인 뇨 증가(NaPi-2a 억제). 나머지는 반대.",
"2023-L26-Q57": "【정답 1 — A 증가 B 촉진 C 촉진】 PTH의 신장 작용: ①인 배출 증가(NaPi-2a 억제), ②1,25(OH)2D3 합성 촉진(1α-hydroxylase 자극). 비타민D(1,25(OH)2D3)의 장관 작용: 인 흡수 촉진(칼슘과 함께). 따라서 A=증가, B=촉진, C=촉진. 💡 PTH: 신장에서 인↑배출 + 1α-hydroxylase↑ → 활성 VitD↑ → 장 Ca·P 흡수↑.",
"2023-L28-Q64": "【정답 5 — E】 이미지의 5종 갑상선 초음파 중 악성 가능성이 가장 높은 결절은 E이다. 갑상선 초음파에서 악성 시사 소견: 저에코(hypoechoic), 불규칙한 경계(irregular margin), 미세석회화(microcalcification), 종횡비 >1(taller-than-wide), 혈류 증가. 이미지에서 E 결절은 내부 고에코 반점(미세석회화 의심) 및 불규칙한 형태를 가장 강하게 보여 K-TIRADS 고위험에 해당한다. 나머지(A~D)는 경계 명확 또는 낭성 성분이 있어 양성 소견.",
"2023-L28-Q79": "【정답 4 — Paget's disease】 71세 남자의 이미지(경골-비골 X-ray)에서 피질골 비후, 골 팽창(osseous widening), 거친 소주골(coarse trabeculae) 소견 → Paget 병(뼈파제트병). Paget 병의 특징: cortical thickening·bone expansion·blade of grass sign(전진골용해)·picture frame vertebra·cotton-wool skull. ①골다공증: 골밀도 감소·피질골 얇아짐. ②골연화증: Looser zone(pseudofracture). ③골경화증(osteopetrosis): 전신 균일 골경화. ⑤부갑상선항진증: subperiosteal resorption·salt and pepper skull·brown tumor.",
"2023-L28-Q83": "【정답 2 — osteomalacia】 61세 남자의 다발성 갈비뼈 골절 원인으로 골연화증(osteomalacia)이 가장 가능성이 높다. 골연화증은 Looser zone(pseudofracture)이 갈비뼈·치골지·대퇴골 내측에 전형적으로 발생하며, 이는 불완전 골절이 치유되지 않아 다발성 갈비뼈 골절처럼 보일 수 있다. ①골다공증: 압박골절(척추)·hip fracture가 전형적이나 갈비뼈는 상대적으로 덜 특이적. ③골경화증: 병적 골절 가능하나 드묾. ④Paget: 갈비뼈 골절보다는 두개골·척추·하지. ⑤부갑상선항진증: brown tumor·subperiosteal resorption. 💡 다발성 갈비뼈 골절 + Looser zone = 골연화증 강력 시사.",
"2023-L29-Q39": "【정답 5 — Tc-99m MDP】 부갑상선 선종 진단 방사성의약품: ①Tl-201 chloride(이중추적자법 도입 초기), ②Tc-99m MIBI(가장 흔히 사용), ③C-11 choline(PET용, 이소성 선종), ④F-18 fluorocholine(PET/CT)이 모두 부갑상선 스캔에 사용된다. Tc-99m MDP는 bone scan에 사용되는 방사성 의약품으로 부갑상선 선종 직접 진단에 사용하지 않는다. 💡 MDP = bone scan. MIBI = parathyroid scan (기출 반복).",
"2023-L29-Q52": "【정답 2 — sodium/iodide symporter】 이미지는 갑상선절제술 후 잔여 갑상선 조직/전이 병소에서 RAI(방사성요오드, I-131) 치료를 반복 시행한 것을 보여준다. RAI 치료의 분자표적은 갑상선 여포세포(및 분화 갑상선암 세포)에 발현된 sodium/iodide symporter(NIS, 나트륨요오드 공동수송체)로, NIS를 통해 세포 내로 요오드가 농축된다. ①glucose transporter = FDG PET. ③somatostatin receptor = DOTATATE PET/Ga-68 DOTATOC. ④amino acid transporter = C-11 Met PET. ⑤존재하지 않는 표적. 💡 RAI(I-131) 치료 표적 = NIS(sodium/iodide symporter).",
"2023-L29-Q54": "【정답 2 — B】 이미지의 갑상선 스캔 5종에서 갑상선암 가능성이 가장 높은 소견은 B이다. 갑상선 신티그라피에서 악성 시사 소견: 냉결절(cold nodule, 동위원소 섭취가 정상 갑상선보다 낮거나 없는 부위). B에서 우측 엽에 명확한 냉결절이 보이며, 이는 갑상선암의 전형적 신티그라피 소견이다. A·D는 정상 또는 미만성 섭취. C는 결절이 주변보다 섭취 높음(hot nodule = 자율기능결절, 악성 드묾). E는 갑상선 전반적 섭취 감소 패턴. 💡 갑상선 스캔: 냉결절 = 악성 가능성(단, 민감도/특이도 낮아 초음파+FNAB 필요).",
"2022-L29-Q4": "【정답 4 — 겨울철 출생】 3개월 남아: Ca 6.5(저하), 25-OH VitD 5 ng/dL(극심한 결핍), PTH 37(정상~경도 상승), ALP 750(상승) → 비타민D 결핍 구루병/저칼슘혈증. 위험 요인: 겨울철 출생(자외선 노출 최소 → 피부 비타민D 합성 불가)이 결정적이다. ①하얀 피부는 비타민D 합성에 유리(멜라닌 적음). ②혼합 수유는 위험 감소(모유만 단독이 위험). ③유아 보습제는 피부 일광 차단 효과 없음. ⑤산모 갑상선 기능저하증은 구루병과 무관. 💡 비타민D 결핍 위험 = 겨울 출생, 단독 모유수유, 어두운 피부색, 고위도.",
"2022-L29-Q65": "【정답 1 — 혈청 FGF23이 증가되어 있다】 소견: Ca 정상, P 2.1(저하), 25-OH-VitD 정상, PTH 정상, ALP 상승, TRP 45%(감소), PHEN 유전자 돌연변이(+) → X연관저인산염혈증(XLH). PHEN 유전자는 phosphate-regulating endopeptidase homolog(PHEX) 유전자를 의미하며, XLH에서 결손 시 FGF23이 분해되지 않아 혈중 FGF23이 증가한다. ②XLH는 X연관 우성이므로 남아가 더 심함(여아는 한 쪽 X가 정상). ③칼슘+일반 비타민D로는 치료 불충분 → 인 보충+활성형 VitD(또는 burosumab) 필요. ④1,25(OH)2-VitD3는 감소(FGF23이 1α-hydroxylase 억제). 💡 XLH(PHEX 돌연변이) → FGF23 과잉 → 인 뇨 + 1α-hydroxylase 억제 → 저인산혈증 구루병.",
"2022-L29-Q69": "【정답 3 — 혈청 PTH 감소】 8개월 남아: 저칼슘혈증 + 흉선 없음 + 22번 염색체 microdeletion(DiGeorge 증후군) → 부갑상선 무형성/발육부전 → PTH 매우 낮음(감소). ①혈청 P는 PTH 없으면 신장에서 재흡수 증가 → P 상승(감소 아님). ②소변 Ca 배출은 PTH 부재 시 신세뇨관 칼슘 재흡수 감소 → 칼슘뇨 가능하나 이 환자는 이미 저칼슘으로 소변 배출도 감소 추세. ④25-OH-VitD3는 부갑상선과 무관하여 정상. ⑤1,25-(OH)2-VitD3는 PTH 결핍으로 1α-hydroxylase 활성 저하 → 감소(증가 아님). 💡 DiGeorge → PTH↓ → Ca↓, P↑, 1,25-(OH)2D↓.",
"2022-L31-Q26": "【정답 3 — Rugger-Jersey spine】 부갑상선기능항진증에서 뼈의 생성(bone formation)이 증가하는 소견은 Rugger-jersey spine이다. 이는 척추 상하 종판에 경화성 변화(sclerosis)가 생겨 줄무늬 유니폼처럼 보이는 소견으로, PTH에 의한 골흡수+골형성 동반 항진 중 종판에서 골형성이 두드러질 때 나타난다. ①Acrolysis: 골흡수(지단부 소실). ②Brown tumor: 섬유성 골 치환(osteitis fibrosa cystica). ④Subperiosteal resorption: 골흡수 소견. ⑤Salt and pepper skull: 두개골 미만성 골흡수+재형성. 💡 Rugger-jersey = 골형성 증가 소견(sclerosis of vertebral endplate).",
"2022-L31-Q111": "【정답 3 — Coarse trabeculae(거친 소주골)】 골다공증, 골연화증, 파제트병의 X-ray 단순촬영에서 공통적으로 보일 수 있는 소견은 거친 소주골(coarse trabeculae)이다. 각 질환 모두 정상 미세 소주골 구조가 파괴되어 잔존 소주골이 굵고 거칠게 보일 수 있다. ①Looser's zone: 골연화증에만 특이적. ②Osseous widening: 파제트병에서 특이적. ④Cortical thickening: 파제트병에서 특이적(골다공증은 얇아짐). ⑤Picture frame vertebra: 파제트병에서 특이적. 💡 세 질환 공통 = 소주골 거칠어짐. 나머지는 각 질환 특이 소견.",
"2022-L32-Q12": "【정답 5 — 마】 이미지의 5종 bone scan 중 일차성 부갑상선기능항진증(pHPT)에 해당하는 뼈스캔은 '마'이다. pHPT의 bone scan 특징: 전신 골격에 균일하고 증가된 방사능 섭취(metabolic superscan), 신장/연조직 배경 상대적 감소, 두개골·턱 등에 집중된 섭취. 이미지에서 '마'는 전신 골격이 가장 밝고 균일하게 섭취되며 신장 상대 흐림이 관찰되어 pHPT의 superscan 패턴과 일치한다. 가~라는 정상·전이·Paget·골수염 등 다른 패턴. 💡 pHPT bone scan = metabolic superscan(전신 균일 증가 + 신장 배경 감소).",
"2022-L32-Q71": "【정답 5 — 5번】 이미지의 단일 갑상선 초음파 이미지에서 내부에 불규칙하고 거친 석회화 같은 고에코 반점들이 산재된 결절이 보인다. 이는 미세석회화(microcalcification)로 갑상선 유두암(papillary thyroid carcinoma)에서 가장 흔히 관찰되는 악성 초음파 소견이다. 이미지에서 5번(이 문제는 단일 이미지로 5번을 찾는 구조)에 해당하는 결절이 미세석회화+저에코 패턴으로 악성이 가장 강하게 의심된다. 💡 갑상선 악성 초음파: 미세석회화 + 저에코 + 불규칙 경계 + taller-than-wide.",
"2021-L44-Q93": "【정답 4 — 종양의 제거】 35세 남자, 외상 없는 골통증, Ca/P 정상 범위이나 FGF23 관련 소견(이미지는 WBS 또는 F-18 FDG PET으로 추정). 이미지 좌측(전신 핵의학 영상)에서 좌측 상지/두개부 국소 uptake 증가, 우측(MRI)에서 뇌 또는 종격 종양 의심. 혈중 Ca 정상, 저인산혈증, 정상 VitD → Tumor-induced osteomalacia(TIO, 종양유발 골연화증) 의심. FGF23을 분비하는 종양(주로 mesenchymal tumor) 제거가 완치적 치료이다. ①고용량 VitD+Ca: 증상 완화적이나 근치 아님. ②비스포스포네이트: 흡수성 골질환 치료, 이 경우 비적응. ③PTH: 골다공증 치료. ⑤경구 인산제+활성형 VitD: 종양 제거 불가 시 보완 치료. 💡 TIO = FGF23 분비 종양 → 종양 제거가 근치 치료.",
"2021-L44-Q111": "【정답 5 — Hyperparathyroidism】 이미지의 sagittal CT에서 척추 종판 경화(endplate sclerosis)가 뚜렷하여 줄무늬 패턴(rugger-jersey spine)이 관찰된다. 이는 부갑상선기능항진증(hyperparathyroidism)의 대표적 CT/X-ray 소견이다. ①골다공증: 골밀도 감소·압박골절. ②골연화증: Looser zone. ③Paget 병: 골 팽창·피질 비후. ④골전이: 국소 용골성/조골성 병변. 💡 Rugger-jersey spine on CT = 부갑상선기능항진증(또는 신성 골이영양증) 특이 소견.",
"2021-L44-Q112": "【정답 4 — Ga-68 DOTA-TOC PET】 60세 남자, 다발성 사지 통증, 우측 경골·비골 병변(이미지 미첨부이나 맥락상 골연화증 소견과 FGF23 분비 종양 의심). TIO(tumor-induced osteomalacia) 원인 종양은 작고 숨어 있어 일반 CT/MRI로 위치 확인이 어렵다. Ga-68 DOTA-TOC PET/CT는 소마토스타틴 수용체 발현 종양(mesenchymal tumor)을 효과적으로 발견한다. ①②CT/MRI: 국소 평가는 가능하나 원인 종양 탐색에 비효율. ③whole body bone scan: 골변화 확인이지 원인 종양 찾기 아님. ⑤DEXA: 골밀도 측정. 💡 TIO 원인 종양 탐색 = Ga-68 DOTATOC(또는 DOTATATE) PET/CT.",
"2021-L45-Q114": "【정답 3 — 위도가 높은 지역에서는 기름진 생선 섭취가 도움이 된다】 이미지의 손목 X-ray에서 요골 원위부 골간단 불규칙화, 혈액검사에서 Ca 7.6(저하), ALP 1477(상승), 25-OH-VitD 4.0(극심 결핍), PTH 230(이차성 상승) → 비타민D 결핍 구루병. 예방: 고위도에서는 자외선 부족 → 피부 합성 불가 → 식이 비타민D(기름진 생선: 연어·고등어·정어리)가 중요한 공급원. ①우리나라 겨울 햇빛 1시간은 UVB 부족(위도 37° 이상 겨울철 UVB 도달 거의 없음)으로 효과 없음. ②어두운 피부는 멜라닌이 UVB를 흡수해 비타민D 합성이 더 어려움(→ 더 많은 햇빛 필요). ④완전 모유 수유아는 비타민D 보충 필요(모유의 VitD 함량 낮음). ⑤저지방우유도 VitD 강화 시 도움이 됨. 💡 식이 비타민D 공급원 = 기름진 생선(지방에 용해된 VitD).",
"2021-L45-Q115": "【정답 1 — G 단백결합 수용체 이상】 이미지는 손·발의 단지증(brachyodactyly) 사진이다. Ca 6.9(저하), P 7.5(상승), PTH 235(상승), 25(OH)D 정상 → PTH 저항성(pseudohypoparathyroidism, PHP). PHP는 PTH 수용체 하위의 Gsα 단백(G 단백 결합 수용체 신호계) 이상으로 PTH에 반응하지 못한다. 외형: 원형 얼굴·짧은 목·4번·5번 중족골 단지증(AHO, Albright hereditary osteodystrophy). ②비타민D 수용체 이상 = Vit D 저항성 구루병. ③1α-hydroxylase 결핍 = VitD의존성 구루병 1형(VDDR-1). ④22q11.2 결손 = DiGeorge. ⑤FGF-23 증가 = XLH. 💡 PTH↑ + PTH 저항(Ca↓·P↑) + AHO 외형 = Pseudohypoparathyroidism → Gsα(GNAS) 이상.",
"2021-L46-Q113": "【정답 3 — 인 섭취과다】 만삭 정상 신생아, 생후 2주 경련, 저칼슘혈증 → 후기 신생아 저칼슘혈증(late neonatal hypocalcemia, 생후 1~2주). 후기 형태의 가장 흔한 원인은 인(phosphate) 섭취 과다로, 과거에는 우유(cow's milk)가 인 함량이 높아 흔한 원인이었다(현재는 분유 개선으로 감소). ①패혈증: 조기 신생아 저칼슘의 원인이나 특이적이지 않음. ②당뇨 산모: 조기 신생아 저칼슘(생후 24-72시간). ④자궁내 성장지연: 조기 형태 관련. ⑤GNAS 결손 = PHP. 💡 후기 신생아 저칼슘혈증(1~2주) = 고인산 분유/우유 → 인산 과부하 → 칼슘 침착.",
"2021-L48-Q117": "【정답 5 — US(초음파)】 부갑상선 질환 평가의 modality of choice는 초음파(US)이다. 비침습적, 경제적, 실시간 평가 가능하며 부갑상선 선종의 1차 영상 도구이다. 이 문제는 선지 2·3이 동일(Postcontrast CT angiogram)하여 출제 오류(note에 명시됨)이나 정답은 US(5번)이다. 💡 부갑상선 localization: 1차 = US, 2차 = Tc-99m sestamibi 신티그라피.",
"2021-L48-Q118": "【정답 2 — 초음파상 결절 내부의 혈류 증가】 부갑상선 선종의 초음파 소견: 저에코(hypoechoic), 갑상선 후방 또는 하극에 위치, 내부 혈류 증가(perilesional vascularity). ①고에코 = 갑상선 선종에 해당. ③경계 불분명 = 악성 시사. ④갑상선 내부를 관통하는 feeding vessel = 드물고 선종에 비특이적. ⑤CT 지연 조영증강 = 부갑상선은 early enhancement. 💡 부갑상선 선종 초음파 = hypoechoic + 혈류 증가(2021·2025년 동일 정답).",
"2021-L50-Q119": "【정답 5 — bilateral neck exploration】 PTH 95 pg/mL(상승) + 반복 요로결석 = 일차성 부갑상선기능항진증. 이미지의 초음파에서 단일 결절이 확인된다. 그러나 이미지 맥락(Q119 2021년)에서 핵의학 검사 소견이 localization에 불일치하거나 다발성 선종 가능성이 있을 때 bilateral neck exploration이 선택된다. 반복 요로결석은 수술 적응증이며, localization이 불명확하거나 영상 불일치 시 bilateral exploration이 안전하다. ①경과 관찰: 수술 적응증 있어 부적절. ②③focused: localization 명확하고 단일 선종 시. ④total parathyroidectomy+자가이식: 이차/삼차성 HPT에서. 💡 pHPT + localization 불일치/불명확 = bilateral neck exploration이 안전.",
"2021-L50-Q120": "【정답 2 — 손발저림】 이 문제는 2025-L39-Q40과 동일한 임상 상황이다(장기 투석 + PTH 1840 + 골통증 → 부갑상선절제술). 수술 후 가장 흔한 증상은 저칼슘혈증으로 인한 손발저림(paresthesia, tetany)이다. Hungry bone syndrome으로 뼈가 급격히 칼슘을 흡수하여 혈중 칼슘이 급감한다. 기타(출혈·쉰목소리·호흡곤란·고음발성장애)는 발생 가능하나 빈도가 낮다. 💡 부갑상선절제술 후 = hungry bone syndrome → 저칼슘 → 손발저림.",
"2025-L22-Q39": "【정답 3】 A(NIS) — B(Na⁺/K⁺ ATPase) — C(thyroperoxidase, TPO) — D(Pendrin). 갑상선 세포 기저측(basolateral)에서 NIS(sodium-iodide symporter)가 Na⁺ 농도 기울기를 이용해 I⁻를 세포 내로 능동 이입하며, Na⁺/K⁺ ATPase가 그 Na⁺ 농도 기울기를 유지한다(A=NIS, B=Na⁺/K⁺ ATPase). 첨단면(apical) 쪽에서 Pendrin이 I⁻를 여포강(lumen)으로 방출(D=Pendrin)하고, TPO가 DUOX 유래 H₂O₂를 이용해 유기화(organification) 및 결합(coupling)을 촉매한다(C=TPO). 이미지에서 기저측 A·B, 첨단측 C(초록 DUOX 동반)·D 위치가 일치한다. 💡 선택지 1은 A와 C, 선택지 5는 B와 C 위치를 혼동.",
"2025-L22-Q77": "【정답 2】 요오드의 대부분(80~90%)은 신장을 통해 소변으로 배설된다. ①위가 아니라 소장(주로 십이지장)에서 흡수된다. ③과잉 요오드는 대변이 아닌 소변으로 배설된다. ④갑상선 내 요오드는 thyroglobulin과 결합한 '유기요오드(organic iodine)' 형태로 저장된다 — 이의신청으로 정답 처리됨에 유의(선택지 4 자체는 사실이나, 정답은 2번). ⑤임산부는 태아 공급 및 신장 청소율 증가로 요오드 요구량이 증가한다.",
"2025-L22-Q87": "【정답 4】 이미지(Free T4-TSH 관계 도표)에서 Normal 구역을 기준으로: TSH↑/fT4 정상=B(subclinical hypothyroidism), TSH 정상/fT4↑=C(inappropriate TSH secretion, 즉 TSH 분비 뇌하수체 종양 등), TSH↓/fT4 정상=D(central hypothyroidism은 아닌, subclinical hyperthyroidism이지만 선택지 4에서는 D=central hypothyroidism), TSH↓/fT4↑=E(primary hyperthyroidism). 정답 4: B(subclinical hypothyroidism) — C(inappropriate TSH secretion) — D(central hypothyroidism) — E(subclinical hyperthyroidism). 도표상 D 칸은 TSH↓·fT4 정상/낮음 구역으로 central hypothyroidism에 해당하고, E는 TSH↓·fT4↑으로 primary hyperthyroidism이 아닌 subclinical hyperthyroidism 구역이다. 💡 TSH↓+fT4↑=primary hyperthyroidism은 F 칸(도표 우하단)에 해당한다.",
"2025-L23-Q56": "【정답 3】 62세 여성, 출산 후 반복적인 갑상선기능저하 → 회복 패턴이 있으나, 현재 fT4 0.43(저하), TSH 34(상승)로 명백한 기능저하증이며 증상도 지속 중이다. 반복 후 기능 회복력이 소진되어 영구 갑상선기능저하로 진행된 것이므로 levothyroxine 투여를 시작한다. ①스테로이드는 통증 있는 아급성 갑상선염에 사용 — 이 환자는 무통성이고 현재 기능저하 국면. ②자연 회복을 기대하기에는 반복 횟수와 현재 수치 모두 불리하다. ④갑상선절제술은 근거 없음. ⑤스테로이드 선행 투여 요건 없음(부신기능저하 동반 시에만 해당).",
"2025-L23-Q66": "【정답 3】 갑상선 자가항체 음성, ESR 상승, 압통 동반 갑상선비대 + fT4↑·TSH↓ → 아급성 갑상선염(de Quervain 갑상선염). 이미지(갑상선스캔)에서 방사성 동위원소 섭취가 거의 없는 소견(cold scan)으로 갑상선 파괴에 의한 호르몬 유출 확인. 통증이 심하면 스테로이드(prednisolone), 경한 경우 NSAIDs로 대증치료. ①항갑상선제 — 갑상선 합성 과다가 아니라 파괴에 의한 방출이므로 효과 없음. ②방사성요오드 — 섭취율 저하 시 치료 불가. ④세균/바이러스 감염이 원인으로 여겨지나 직접 항바이러스·항생제 치료는 불필요. ⑤갑상선기능저하증이 발생하면 그때 치료; 예방적 투여 불필요.",
"2025-L23-Q73": "【정답 4】 출산 2개월 후, fT4↑·TSH↓, ESR 정상, anti-TPO Ab 양성, anti-TSH receptor Ab 음성 → 산후 갑상선염(postpartum thyroiditis)의 갑상선중독증 국면. 자기면역에 의한 갑상선 파괴로 호르몬이 유출되므로 항갑상선제는 무효; 증상(빈맥·심계항진) 조절을 위한 베타차단제가 적합하다. ①절제술 — 과도한 치료. ②항갑상선제 — 합성 과다가 아님. ③갑상선호르몬제 — 현재 기능항진 상태이므로 금기. ⑤방사성요오드 — 섭취율 낮고 수유 여성에 부적합.",
"2025-L24-Q35": "【정답 2】 47세 여성, 좌측 단일 2.5 cm 결절, TSH↓·fT4↑, 자가항체(anti-TPO·anti-TSHR) 모두 음성 → 독성갑상샘종(toxic adenoma, 독성 단발성 결절). 이미지(초음파·스캔)에서 좌측 단일 결절이 자율적으로 기능하는 hot nodule 소견. 그레이브스병은 미만성 종대 + TSHR-Ab 양성이 특징. 리델갑상샘염은 딱딱하고 압통 없는 섬유화성 병변. 무통갑상샘염·하시모토갑상샘염은 이 환자의 단일 결절+기능항진 패턴과 불일치.",
"2025-L24-Q55": "【정답 3】 27세 여성, TSH↓·fT4↑·TSHR-Ab 양성(34 IU/L) + 안구 돌출 소견 → 그레이브스병 + 그레이브스 안병증. TSH 수용체 항체(TRAb)는 안와 섬유아세포의 TSH 수용체에도 작용해 안병증을 유발하므로 갑상선기능항진증과 같은 항체가 안병증의 발병에 관여한다. ①안병증은 그레이브스병에서 압도적으로 흔하나, 드물게 하시모토 갑상선염 등에서도 발생. ②안병증과 갑상선기능 이상은 시간적으로 별개로 나타날 수 있다. ④갑상선기능 호전과 안병증 경과는 독립적; 기능 정상화 후에도 안병증이 악화될 수 있다. ⑤방사성요오드 치료 후 TRAb가 일시적으로 상승해 안병증이 오히려 악화될 수 있다.",
"2025-L24-Q90": "【정답 1】 체중감소·심계항진·발한·손 떨림 + fT4 3.24↑·TSH <0.01↓ → 갑상선중독증. 갑상선스캔에서 양엽 전체에 섭취가 미만성으로 증가된 hot scan → 그레이브스병. 무통성·아급성 갑상선염은 스캔 섭취율 감소(cold scan). TSH 분비 뇌하수체 선종은 TSH가 상승/정상이어야 함. 갑상선호르몬 뇌하수체 내성은 TSH 정상/상승 + 증상 무증상이 특징. 💡 핵심 감별: 미만성 섭취 증가 = 그레이브스병 or Toxic MNG; 섭취 감소 = 파괴성 갑상선염.",
"2025-L37-Q7": "【정답 5】 부갑상선암(parathyroid carcinoma) 진단 기준: 혈관 침범(vascular invasion), 신경주위 침범(perineural invasion), 인접 기관(갑상선 등) 침범, 림프절/원격 전이. Atypical bizarre nuclei(이형 거대핵)는 benign adenoma에서도 관찰될 수 있으며, 그 자체만으로는 암 진단 기준이 되지 않는다. 💡 'Atypical parathyroid tumor(불확실한 악성 잠재력)'는 악성 확정 기준을 충족하지 않지만 의심 소견을 보이는 중간 범주로 분류된다.",
"2025-L37-Q71": "【정답 5】 Atypical parathyroid tumor는 조직학적으로 carcinoma와의 감별이 필요한 현미경 소견(섬유화 띠, 혈관 주위 성장, 증가된 분열상 등)을 보이지만 확진 기준(침범·전이)을 충족하지 못하는 중간 범주이므로 옳다. ①여러 gland 비대 → parathyroid hyperplasia (adenoma는 단발). ②Primary hyperparathyroidism 가장 흔한 원인은 adenoma(~80%), hyperplasia는 약 15~20%. ③Adenoma는 chief cell, oxyphil cell, 또는 혼합으로 구성될 수 있으며 '단독'만은 아님. ④Adenoma는 sporadic form이 95% 이상; MEN 연관 familial form은 소수.",
"2023-L30-Q93": "【정답 5】 갑상선호르몬은 지용성으로 핵 내 갑상선호르몬 수용체(nuclear thyroid hormone receptor)와 결합하여 유전자 발현을 조절한다. ①요오드(iodine)가 갑상선호르몬 분자량의 ~65%를 차지하며, 셀레늄은 deiodinase 조효소로 합성이 아닌 대사에 관여. ②요오드는 NIS를 통해 이입됨 — pendrin은 첨단면의 방출 수송체. ③갑상선호르몬은 TPO 활성 억제가 아니라, Wolff-Chaikoff 효과를 일으키는 것은 고농도 요오드. ④갑상선호르몬은 지용성으로 대부분 결합단백(주로 TBG, thyroxine-binding globulin)과 결합해 운반; 알부민은 양이 많으나 친화력이 낮다.",
"2023-L30-Q107": "【정답 3】 TSH 1.6(정상), fT4 1.1(정상), Total T3 250(↑, 참고치 81~196). 임신 중에는 hCG의 TSH 유사 작용으로 갑상선 기능이 자극되고, 에스트로겐에 의해 TBG(thyroxine-binding globulin)가 증가해 total T3·T4가 상승하는 반면 TSH와 free T4는 정상 범위를 유지한다. ①금식·다이어트 → low T3 syndrome으로 T3 감소. ②스테로이드 → T3 변환 억제로 T3 감소. ④말단 비대증 → T4 정상, T3 경미 상승 가능하나 전형적 패턴 아님. ⑤만성 신부전 → low T3 syndrome.",
"2023-L30-Q155": "【정답 3】 TSH 6.0(↑), fT4 1.4(정상) → TSH만 상승, fT4는 정상. 조영제(요오드 함유 조영제) CT 검사 후 일시적 Wolff-Chaikoff 효과로 갑상선 호르몬 합성이 감소하고 TSH가 반응성으로 상승할 수 있다; 통상 수주~수개월 내 정상화. ①스테로이드 → TSH 억제(오히려 감소). ②뇌하수체 수술 후 → TSH 감소(central hypothyroidism). ④아스피린 → TBG 결합 감소로 free T4 상승, TSH 감소 경향. ⑤항갑상선제 2주 → 초기에 TSH 상승 가능하나 fT4도 감소 예상; 이 환자는 fT4 정상 → 조영제 효과가 더 적합.",
"2023-L30-Q164": "【정답 5】 TSH 6.5(↑), fT4 2.4(↑) → TSH와 fT4 동시 상승 = 부적절한(inappropriate) TSH 분비. 가장 흔한 원인은 TSH 분비 뇌하수체 선종(TSHoma)이며, 갑상선호르몬저항성도 감별 필요. 갑상선스캔 소견(문제 상 언급) 시 미만성 섭취 증가 가능. ①하시모토 → TSH↑·fT4↓. ②영양막종양(hCG 분비) → TSH↓·fT4↑. ③중독성 다결절성 갑상선종 → TSH↓·fT4↑. ④그레이브스병 → TSH↓·fT4↑. 💡 TSH↑+fT4↑ 조합 = TSHoma 또는 갑상선호르몬저항성.",
"2023-L31-Q126": "【정답 1】 78세, 하시모토 갑상선염 기왕력, 6개월 내 정상이었다가 3~4개월 만에 급격한 갑상선 비대 + 압박 증상(숨참) → 갑상선림프종(primary thyroid lymphoma) 의심. 하시모토 갑상선염은 갑상선림프종(주로 DLBCL, MALT 림프종)의 주요 위험인자이며 급속한 무통성 종대가 특징적이다. ②무통성 갑상선염은 이렇게 급속한 비대를 보이지 않음. ③아급성 갑상선염은 압통과 ESR 상승 동반. ④갑상선여포암은 이렇게 수주 내 급격히 커지지 않음. ⑤갑상선미분화암도 급속 증대하나 압통이 있고 매우 불규칙한 경계를 보임(림프종과 감별 필요 — 조직 생검이 결정적).",
"2023-L31-Q130": "【정답 3】 37세 남성, 1주 전경부 통증 + 압통성 우측 갑상선 비대, fT4↑·TSH↓, 자가항체 음성, ESR 75↑, 갑상선스캔 섭취율 감소(cold scan, 이미지 확인) → 아급성(de Quervain) 갑상선염. 통증이 심하면 스테로이드 투여, 경미하면 NSAIDs. ①항갑상선제 — 합성 과다가 아니므로 무효. ②방사성요오드 — 섭취율 저하 시 치료 불가. ④항바이러스·항생제 — 세균성 감염 아님. ⑤심계항진 등 중독증 증상은 자연 경과와 함께 수주 내 호전되나, 방치보다는 대증치료(베타차단제) 필요.",
"2023-L31-Q135": "【정답 4】 36세 여성, 심한 피로·체중 증가·변비·탈모 + 고지혈증(총 콜레스테롤 300, TG 1600)·간효소 상승·CPK 상승 + TSH 100↑·fT4 0.21↓·TPO 항체+++ → 심한 갑상선기능저하증(하시모토). 갑상선기능저하증은 지질 대사를 저해해 고지혈증·고TG혈증, 근육병증(CPK↑), 간효소 상승을 유발한다. 갑상선호르몬 투여가 1차 치료이며, 이로써 지질 이상도 함께 교정된다. 지질강하제(①②③⑤)는 갑상선 기능 교정 전에 단독 사용해서는 안 된다.",
"2023-L31-Q142": "【정답 2】 36세 여성, 6개월 전 출산, 수유 중, 3~4개월 전 갑상선중독증 증상(지나침) → 현재 fT4 0.34↓·TSH 32.1↑·ESR 정상·항마이크로좀 항체 양성 → 산후 갑상선염(postpartum thyroiditis)의 기능저하 국면. 자연 회복 가능성이 있으나 수유 중이고 증상이 심하므로 T4(levothyroxine) 투여 적절. ①경과 관찰 — 증상이 있어 치료 필요. ③베타차단제 — 현재 기능저하 국면(항진이 아님). ④T3 제제 — 수유 중 T4가 더 안전하며 T3는 반감기 짧고 농도 변동 큼. ⑤방사성요오드 — 수유 중 금기.",
"2023-L31-Q181": "【정답 3】 42세 여성, 출산 후 반복성 갑상선기능저하(4회 출산, 매회 반복) → 현재 fT4 0.54↓·TSH 28↑ → 영구 갑상선기능저하증으로 진행. 갑상선호르몬제 투여가 정답. ①자연 회복 기대 — 4회 반복력으로 볼 때 영구 저하 가능성 높음. ②스테로이드 — 근거 없음. ④갑상선절제술 — 과도. ⑤스테로이드 선행 — 부신기능저하 동반 의심 시에만 해당.",
"2023-L32-Q91": "【정답 4】 37세 여성, ERCP 담석 제거 후 발열·복통·지속 빈맥 + TSH↓·fT4↑ + 경부 갑상선 비대 사진(목 사진에서 전경부 종창 관찰) → 갑상선기능항진증 원인 감별 필요. TSH 수용체 항체(TRAb/TSHR-Ab)가 그레이브스병과 다른 원인(무통성 갑상선염 등) 구별에 가장 유용하다. ①세침흡인 — 기능 감별에 불필요. ②갑상선스캔 — 보조적이나 TRAb만큼 특이적이지 않음. ③ESR — 아급성 감별에 보조적. ⑤뇌하수체 MRI — TSH 정상/상승 시 고려; 현재 TSH↓이므로 부적합.",
"2023-L32-Q149": "【정답 4】 67세 여성, 2주 전부터 '갑상선약' 복용 → 현재 39.5°C 고열 + 인두통(목 아파 침 삼키기 어려움). 이미지(구강 사진)에서 인두 발적 및 삼출물 소견 → 항갑상선제(methimazole/PTU)의 무과립구증(agranulocytosis) 부작용 의심. 즉시 백혈구(WBC, 특히 중성구) 검사가 필요하다. ①TRAb — 원인 감별에는 유용하나 현재 응급 상황에서 먼저 필요한 검사 아님. ②혈소판 — 무과립구증의 주 표적 세포는 과립구(중성구)이므로 혈소판보다 WBC가 우선. ③ESR — 비특이적. ⑤간기능 — PTU 간독성 평가에는 유용하나 현재 응급은 무과립구증 확인 우선.",
"2023-L32-Q188": "【정답 3】 30세 24주 임산부, 항갑상선제로 조절 안 되는 갑상선기능항진증 + 심한 안구병증. 임신 2기(14~28주)에는 갑상선 절제술이 비교적 안전하게 시행 가능하며, 약물 불응성이므로 수술이 선택이다. 이미지(안구 사진)에서 안구 돌출 확인. ①항갑상선제 — 이미 실패. ②레보티록신 — 기능항진 상태에서 투여 금기. ④고주파 절제술 — 임신 중 적응증 없음. ⑤방사성요오드 — 임신 중 절대 금기(태아 갑상선 손상).",
"2022-L15-Q95": "【정답 2】 NIS(sodium-iodide symporter)는 기저측막에서 Na⁺ 농도 기울기를 이용해 I⁻를 세포 내로 능동 이입한다. ①요오드(iodine)가 분자량의 ~65%, 셀레늄이 아님. ③TPO는 유기화·결합을 촉매; 갑상선호르몬을 세포 밖으로 방출하는 것은 thyroglobulin 가수분해 및 lysosomes. ④갑상선호르몬은 지용성으로 결합단백(TBG 등)과 결합해 운반; free form은 소량. ⑤갑상선호르몬 수용체는 세포막이 아닌 핵 내에 존재.",
"2022-L15-Q49": "【정답 3】 TSH 1.5(정상), fT4 1.0(정상), Total T3 300(↑) → 임신 중 TBG 증가로 Total T3(및 total T4)가 상승하나, free T4와 TSH는 정상 범위 유지. ①금식/다이어트 → low T3 syndrome(T3 감소). ②스테로이드 → 5'-deiodinase 억제로 T3 감소, reverse T3 증가. ④말단 비대증 → T3 상승 가능하나 전형적 패턴은 TBG 증가 없이 total T3만 상승하지는 않음. ⑤만성 신부전 → low T3 syndrome.",
"2022-L16-Q28": "【정답 5】 32세 여성, 6개월 전 출산, 1~2개월 전 몸살 유사 증상 후 목 통증·부종 반복, 초음파 1개월 전 0.9 cm 결절 → 최근 10일 전 1.5 cm으로 급격히 증대, T3↑·fT4↑·TSH↓·ESR 95↑, 갑상선초음파에서 저에코 병변 → 아급성(de Quervain) 갑상선염. 산후 갑상선염은 압통 없고 ESR 정상이 특징; 이 환자는 압통 + ESR 95 mm/hr 현저히 상승이므로 아급성이 더 적합. 💡 선택지 구성이 파싱 오류로 복잡하나 '아급성 갑상선염'(5번)이 임상적으로 부합.",
"2022-L16-Q20": "【정답 2】 TSH 0.3(↓, 참고치 0.4~5.0), fT4 0.6(↓, 참고치 0.7~1.8) → TSH와 fT4 모두 낮음 = central(중추성) 갑상선기능저하증. 뇌하수체 종양 수술 후 TSH 분비 세포 손상으로 발생. ①하시모토 → primary hypothyroidism: TSH↑·fT4↓. ③조영제 → 일시적 TSH↑·fT4 정상 또는 fT4↓. ④TSH 분비 뇌하수체 종양 → TSH↑·fT4↑. ⑤그레이브스병 → TSH↓·fT4↑.",
"2022-L16-Q119": "【정답 2】 70세 남성, 1년 전부터 amiodarone 100 mg/일 투여 → TSH 23↑·fT4 0.6↓ → 갑상선기능저하증. Amiodarone은 요오드 함량이 높고(분자 내 37% 요오드), 5'-deiodinase 억제로 T4→T3 전환 감소, 고농도 요오드에 의한 Wolff-Chaikoff 효과로 갑상선 기능저하 또는 항진을 유발할 수 있다. 이 환자에서는 기능저하 패턴. 다른 선택지(허혈성 심질환, 항혈전제, 스텐트)는 갑상선기능에 직접 영향을 주지 않는다.",
"2022-L16-Q41": "【정답 1】 34세 여성, SLE로 스테로이드 + 면역억제제 치료 중 + CT에서 갑상선 비대·결절. T3 54(↓)·fT4 1.1(정상)·TSH 0.3(↓, 경계). 선택지 파싱이 혼란스럽지만 정답은 '비갑상선질환(non-thyroidal illness, NTI/euthyroid sick syndrome)'. 중증 전신질환·스테로이드 투여 시 5'-deiodinase 억제로 T3 감소, TSH도 경미하게 감소할 수 있으나 갑상선 자체 기능은 정상이다. 💡 T3↓·fT4 정상·TSH 낮-정상 = NTI 전형 패턴.",
"2022-L16-Q87": "【정답 5】 53세 여성, 피로감 + fT4 2.3(↑)·TSH 정상(파싱 누락이나 문맥상 정상~상승 범위) → fT4 상승에도 TSH가 억제되지 않은 패턴 = 갑상선호르몬저항성증후군(resistance to thyroid hormone, RTH). RTH는 갑상선호르몬 수용체(TRβ) 돌연변이로 인해 말초 및 뇌하수체 조직이 갑상선호르몬에 반응하지 못해 TSH가 정상 또는 상승하면서 fT4가 높다. ①비갑상선질환 → T3↓. ②뇌하수체기능항진증 → 비특이적. ③FSH 분비 뇌하수체 종양 → 갑상선축과 무관. ④무증상 갑상선기능항진증 → TSH↓.",
"2022-L17-Q27": "【정답 3】 선택지 파싱이 혼란스럽지만 T3↑·fT4↑·TSH↓·Anti-TSHR Ab 양성·Microsome Ab 양성 + 갑상선스캔에서 편측 단독 섭취 증가(cold 배경 + 단일 hot nodule) → 중독성 산증(toxic adenoma)이 정답으로 표기되어 있다. 그러나 TSHR Ab 양성이면 그레이브스병이 임상적으로 더 적합하며, 스캔 이미지에서 좌하극의 단일 hot nodule이 보인다면 toxic adenoma로 판단 가능. 선택지 '중독성 산증'은 'toxic adenoma(중독성 선종)'의 번역 오류로 보임. 💡 이 문항은 파싱 오류가 있어 임상 맥락상 'toxic adenoma(중독성 단발성 갑상선결절)'로 해석.",
"2022-L17-Q50": "【정답 5】 49세 남성, 심계항진·체중감소 + 좌측 안구돌출 + 외안근 마비 + 미만성 갑상선종 → 그레이브스병 + 안병증. 항갑상선제로 조절 불가 시, 안병증이 동반된 경우 방사성요오드보다 수술(갑상선절제술)이 더 적합하다(방사성요오드는 TRAb를 일시 상승시켜 안병증 악화 위험). ①갑상선스캔이 반드시 필요하지 않다 — 임상·항체로 진단 가능. ②방사성요오드 후 안병증 악화 우려(스테로이드 병용 시 완화 가능하나 안병증 동반 시 수술 우선). ③베타차단제는 안병증에 효과 없음. ④그레이브스병은 자연 호전 가능하나 이 환자처럼 치료 필요 상태에서 방치 불가.",
"2022-L17-Q57": "【정답 3】 30세 24주 임산부, 약물 불응성 갑상선기능항진증 + 심한 안구병증. 임신 2기(14~28주)의 약물 불응성 갑상선기능항진증은 갑상선 절제술이 적응증. ①항갑상선제 — 이미 실패. ②레보티록신 — 항진 상태에서 금기. ④고주파 절제술 — 임신 중 비권장. ⑤방사성요오드 — 임신 중 절대 금기. 💡 2023-L32-Q188과 동일 임상 상황; 정답 일치(수술).",
"2022-L17-Q113": "【정답 1】 36세 여성, fT4↑·TSH↓ + 갑상선스캔에서 양엽 전반 미만성 섭취 증가(butterfly pattern, hot scan) → 그레이브스병. 무통성 갑상선염·아급성 갑상선염·산후갑상선염은 파괴성으로 스캔 섭취율이 감소(cold). TSH 분비 선종/뇌하수체 내성은 TSH가 정상~상승이어야 함.",
"2021-L26-Q104": "【정답 1】 요오드의 섭취(transport, NIS를 통한 능동 이입)는 TSH에 의해 활성화되지만, methimazole은 TPO를 억제해 유기화(organification)와 결합(coupling)을 차단한다 — NIS 매개 이입은 억제하지 않는다. ②③④ 요오드 산화·유기화·결합 → TPO 의존적, methimazole에 의해 억제. ⑤탈요오드화(deiodination) → 말초 조직의 deiodinase가 촉매; TSH 의존적이지 않음. 💡 methimazole = TPO 억제제; NIS 이입은 억제하지 않음.",
"2021-L27-Q6": "【정답 1】 52세 여성, 유방암 + PET-CT 이상 + 갑상선 초음파에서 결절 발견(이미지: PET 좌측 hot spot + 초음파 결절). 갑상선 결절 발견 시 가장 먼저 시행해야 할 검사는 TSH이다 — TSH가 억제된 경우 기능적 결절(toxic adenoma) 가능성 → 스캔으로 hot/cold 판별; TSH 정상이면 세침흡인 고려 순서. ②경부 CT — 먼저 필요 없음. ③후두내시경 — 압박 증상 없을 때 불필요. ④미세침흡인 — TSH 결과 후 결정. ⑤TPO 항체 — 기능 평가가 선행.",
"2021-L27-Q67": "【정답 5】 36세 여성, 3개월 전 출산 + 수유 않음. 3~4주 전 갑상선중독증 증상 → 현재 전경부 종대 + 미만성 갑상선 비대 + 압통 없음 + T3↑·TSH 억제(파싱상 수치 잘림) → anti-TSH receptor Ab 음성(산후갑상선염 특징), anti-TPO Ab 양성 → 일과성 갑상선중독증을 동반한 만성 갑상선염(산후 갑상선염). 갑상선중독증 후 기능저하 단계로 진행 가능. 💡 리델갑상샘염은 딱딱하고 압통 없는 섬유화; 그레이브스병은 TSHR-Ab 양성; 아급성은 압통·ESR↑.",
"2021-L27-Q105": "【정답 5】 73세 여성, 저체온·서맥·의식저하 → 심한 갑상선기능저하증(점액수종 혼수) 의심. Bedside에서 확인 가능한 검사: Deep tendon reflex(DTR)의 relaxation time(이완 시간) 증가 — 갑상선기능저하 시 근육 대사 저하로 반사 이완이 느려진다. ①anti-TPO Ab — bedside 불가(혈액 검사실). ②갑상선스캔 — bedside 불가. ③Basal metabolic rate — bedside에서 직접 측정 어렵고 비특이적. ④초음파 혈류 증가 — 기능항진 소견.",
"2021-L27-Q107": "【정답 4】 27세 여성, 산후 갑상선염 기능저하 국면 (fT4↓·TSH↑·ESR 정상·항마이크로솜 항체 양성). 갑상선호르몬제(levothyroxine) 투여가 필요하며, 공복 복용이 흡수율을 높인다(식사·칼슘·철분제 등이 흡수 방해). ①베타차단제 병용 — 현재 기능저하 국면이므로 불필요; 베타차단제는 기능항진 국면의 증상 조절에 사용. ②방사성요오드 + T4 — 산후 갑상선염은 파괴성으로 방사성요오드 적응증 없음. ③T3 제제 — T4가 1차 선택. ⑤통증 동반(아급성)이 아니므로 스테로이드·소염제 불필요.",
"2021-L28-Q66": "【정답 2】 30세 남성, 6개월간 체중감소·발한 + 전경부 2.0 cm 부드러운 결절 + 심박수 98/분, T3↑·TSH↓(파싱 잘림) → 갑상선기능항진증 + 단일 결절 → 결절의 자율 기능 평가를 위해 갑상선스캔(99mTc 또는 123I) 시행. Hot nodule이면 toxic adenoma. ①초음파 — 형태 평가이지 기능 평가 아님. ③CT — 불필요. ④혈청 갑상선글로불린 — 기능 평가와 무관. ⑤세침흡인 — TSH 억제+hot nodule은 악성 가능성 낮아 스캔 후 결정.",
"2021-L28-Q68": "【정답 3】 52세 여성, 심계항진·손떨림 + T3↑·fT4↑·TSH↓ + anti-TSH receptor Ab 37.5(↑, 양성) + 갑상선스캔 섭취율 8.5%(↑, 정상 1.7~4%) → 그레이브스병 확진. TSHR-Ab 이미 양성이고 스캔에서 섭취율 상승이 확인된 상태. 추가 TRH 자극 검사는 그레이브스병 진단에서 현재 거의 사용하지 않으나, 문제 맥락상 'TRH 자극 검사'가 과거에는 TSH 반응 억제를 확인하는 데 사용되었다. 💡 이 문항은 이미 TSHR-Ab 양성 + 섭취율↑로 사실상 진단이 완료된 상태에서 굳이 TRH 검사를 추가하는 것이 정답으로 제시되어 있어 다소 논란적; 다른 선택지(TPO Ab, Tg Ab, T3 억제 스캔)보다 TRH 자극 검사가 당시 교육 내용상 감별 확진에 사용된 검사로 출제된 것으로 이해.",
"2021-L28-Q106": "【정답 3】 47세 여성, 3주 전 감기 후 1주 전경부 통증(귀 뒤까지 방사) + 갑상선 단단·압통 + fT4↑·TSH↓·ESR 120↑·항마이크로솜 항체 음성 + 갑상선스캔 섭취율 감소(이미지 cold scan, 전경부 종창) → 아급성 갑상선염. 치료: 중독증 증상은 일시적이며 갑상선 파괴에 의한 호르몬 유출이므로 베타차단제로 증상 조절. ①절제술 — 절대 금기 아니나 아급성에서 수술은 불필요. ②방사성요오드 — 섭취율 감소 시 사용 불가. ④항갑상선제 — 합성 과다가 아님. ⑤예방적 levothyroxine — 갑상선기능저하가 발생하면 그때 투여; 예방 목적으로 즉시 투여하지 않음.",
"2021-L51-Q25": "【정답 5】 골밀도 검사(DXA) 적응증: ①65세 이상 폐경 후 여성, ②50세 이상 골절 경험자(증상 없어도), ③스테로이드 장기 복용(≥3개월, prednisolone ≥5 mg/일 해당), ④다발성 골수종 등 이차 골다공증 원인 질환. 4가지 모두 해당하므로 '위 4 경우 모두 다'가 정답. 퇴행성관절염 단독은 골밀도 검사 적응증이 아니나, 이 환자는 66세 폐경 후 여성이므로 나이/성별 기준으로 적응증 해당.",
"2021-L51-Q121": "【정답 2】 옳지 않은 것: 부갑상선의 stromal fat은 영아기·유아기에는 거의 없으며, 성장하면서 점차 증가해 성인에서는 ~30%를 차지한다 — 설명이 반대. ①chief cell + oxyphil cell + stromal fat 3요소 — 옳음. ③Chief cell이 PTH를 주로 분비 — 옳음. ④Primary hyperplasia → 4개 gland 모두 비대 — 옳음. ⑤Adenoma → 주변 gland 정상 또는 위축 — 옳음.",
"2021-L51-Q122": "【정답 3】 부갑상선 선종(adenoma)에서도 이형성이 심한 bizarre(기이한) 핵이 관찰될 수 있으며, 이것만으로는 암 진단 불가 — 반드시 침범(혈관·신경·인접 기관) 또는 전이가 있어야 암 진단. ①Adenoma는 단발; carcinoma도 대개 단발(여러 gland 침범은 hyperplasia). ②Carcinoma는 거의 항상 PTH 분비 기능성(functioning). ④Carcinoma는 adenoma와 나이 분포 유사하거나 약간 젊은 편(50대). ⑤혈중 PTH 14 pg/mL 이상(정상 상한 ~65 pg/mL)은 adenoma 진단 수치가 아니며, 수치 단위도 혼동됨.",
"2025-L25-Q30": "정답 ①. Comet tail 인공물(彗星尾人工物, comet-tail artifact)을 동반한 부분 낭성 결절은 콜로이드 결절(colloid nodule)의 전형적 소견으로 양성 가능성이 가장 높다. 💡 오답: ②불규칙 경계·등에코 고형→악성 의심, ③앞뒤로 긴(taller-than-wide) 저에코 고형→고위험(high suspicion) 악성 소견, ④거대석회화→악성 의심, ⑤앞뒤로 긴 부분낭종도 taller-than-wide는 악성 위험인자다.",
"2025-L25-Q31": "정답 ⑤. 이미지에서 ⑤번 결절은 저에코 고형의 앞뒤로 긴(taller-than-wide) 형태에 불규칙 경계를 보여 악성 위험이 가장 높다. ②번은 내부에 comet-tail 인공물을 동반한 낭성 결절로 양성 가능성 높고, ④번은 경계가 매끈한 타원형 저에코 결절로 중간위험에 가깝다. 💡 초음파 악성 소견 핵심: 저에코·불규칙 경계·침상 경계·taller-than-wide·미세석회화.",
"2025-L25-Q51": "정답 ④. TSH 정상이고 FNA 결과가 AUS(Bethesda III)인 냉결절에서는 세침흡인세포검사 재시행이 권고된다. Bethesda III는 악성 위험도 약 10~30%로 추가 평가가 필요하며, 재시행 후 Bethesda II면 추적 관찰, 다시 III 이상이면 분자검사나 진단적 엽절제를 고려한다. 💡 오답: ①방사성요오드 치료는 기능성 결절(열결절)에 적용, ②고주파·③알코올경화는 양성 확정된 결절에 해당, ⑤TSH 억제요법은 더 이상 권고되지 않는다.",
"2025-L26-Q13": "정답 ①. 갑상선유두암(BRAF 양성)이 뼈 전이를 동반해 처음 진단된 경우에도 표준 1차 치료는 갑상선전절제술이다. 수술로 원발 병소를 제거해야 이후 방사성요오드 치료가 효과적으로 작동한다. 💡 오답: ②방사성요오드는 수술 후 잔여 갑상선 제거 후에 시행, ③갑상선호르몬제(TSH 억제)는 보조요법이지 1차치료 아님, ④세포독성 항암화학요법은 미분화암 또는 표적치료 실패 후, ⑤표적치료(TKI)는 방사성요오드 불응성에 고려.",
"2025-L26-Q15": "정답 ②. 장경 0.7 cm 갑상선 미세유두암(microPTC, <1 cm)이고 저위험 기준 충족(림프절 전이·피막외침범 없음)일 때 적극적 경과관찰(active surveillance)이 허용된다. 특히 고령이거나 수술 위험이 높은 경우 더욱 적절하다. 💡 오답: ①에탄올 주입은 낭성 결절 치료에 사용, ③체외방사선은 갑상선암 표준치료 아님, ④방사성요오드는 수술 후 잔여갑상선 있어야 효과 있음, ⑤T4 억제요법은 현재 저위험 미세암에 권고되지 않는다.",
"2025-L26-Q50": "정답 ③. 하시모토 갑상선염 기왕력 환자에서 갑자기 커진 단단한 결절 + FNA에서 large atypical lymphoid cell → 원발 갑상선 림프종(primary thyroid lymphoma)이 가장 의심되며, 확진에는 중심바늘생검(core needle biopsy)이 필요하다. FNA만으로는 세포구조(architectural pattern) 파악이 어려워 확진 불가. 💡 오답: ①티로글로불린은 갑상선암 추적에 사용, ②PET은 병기결정·재발평가이지 확진 아님, ④99mTc 스캔은 기능 평가, ⑤TSH 수용체 항체는 그레이브스병 진단.",
"2025-L27-Q24": "정답 ②. 갑상선 스캔에서 A는 전체적으로 균일 섭취(정상 또는 그레이브스), B는 냉결절(cold nodule)을 동반한 패턴으로 악성 가능성이 가장 높다. 갑상선 스캔에서 냉결절은 방사성요오드 섭취 감소 부위로, 기능이 없는 결절에 해당하며 악성 가능성(약 5~15%)이 열결절보다 높다. 💡 오답: C·D·E는 열결절(hot nodule) 또는 균일 섭취 패턴으로 기능성이거나 양성 가능성이 높다.",
"2025-L27-Q82": "정답 ④. 이미지에서 우측과 좌측 경부에 초음파 소견이 보이는데, FDG PET에서 양성이고 I-131 스캔에서 음성인 분화 갑상선암 재발 병소(flip-flop 현상)의 경우 방사성요오드 치료에 불응하므로 수술적 제거가 최선이다. I-131 섭취가 없으면 반복 방사성요오드 치료는 효과 없다. 💡 오답: ①I-131 반복치료는 섭취 없으면 무효, ②I-123 재검사는 불필요(이미 I-131 스캔 있음), ③FDG 고용량 투여는 치료제 아님, ⑤I-131 추적관찰은 섭취 없으면 의미 없다.",
"2025-L27-Q23": "정답 ⑤. 갑상선유두암(papillary carcinoma)의 세침흡인세포검사 소견: cellular smear, 핵의 불규칙 모양, nuclear groove, pseudoinclusion(위핵내봉입체) 관찰이 특징적이다. 💡 오답: ①세침흡인검사는 여전히 1차 검사이며 core needle biopsy가 훨씬 더 많은 추세는 아님, ②liquid-based cytology는 슬라이드 수가 적고 판독이 빠름(오히려 더 효율적), ③가장 흔한 진단은 Benign(양성)이지 Malignant가 아님, ④Follicular neoplasm은 cellular smear 보이고 colloid 감소, 핵의 groove·pseudoinclusion은 PTC 특징(Follicular neoplasm에 해당하는 설명이 아님—혼동 주의).",
"2025-L27-Q63": "정답 전원(①②③④⑤) — 전원 정답 처리. 2025년도 시험에서 모든 보기를 정답으로 처리한 문항이다. 실제 Bethesda system에서 옳은 내용과 부분적으로 수정이 필요한 내용이 혼재하므로, 시험 출제 측에서 전원 정답 처리했다. 💡 핵심 포인트: Bethesda system은 6개 카테고리(Ⅰ~Ⅵ), Malignant 악성 위험도 약 97~99%, Benign 악성 위험도 약 0~3%, AUS 악성 위험도 약 10~30%, Follicular neoplasm 약 25~40% 정도.",
"2023-L33-Q117": "정답 ④. 2년 전 세침흡인에서 불확실(AUS 또는 indeterminate) 결과를 받은 갑상선 결절이 2.2 cm으로 커진 경우 세침흡인세포검사 재시행이 필요하다. 초음파 소견상 결절 크기 증가(1.5→2.2 cm)는 재평가 적응증이다. 💡 오답: ①6개월 경과 관찰은 결절이 커지고 있어 부적절, ②갑상선스캔은 TSH 정상이므로 기능성 평가 우선 필요 없음, ③경부 CT는 이 시점에서 1차 검사로 불필요, ⑤갑상선절제술은 확진 전 시행 부적절.",
"2023-L33-Q147": "정답 ③. TSH 정상이고 FNA 결과 AUS(Atypia of Undetermined Significance, Bethesda III)인 경우, 기능성 여부 확인을 위해 T3 억제 갑상선스캔을 시행한다. 기능성 열결절이면 악성 가능성이 매우 낮아 수술을 피할 수 있다. 💡 오답: ①항 TPO 항체·②항 TSH 수용체 항체는 자가면역 여부 확인이지 결절 진단 목적 아님, ④방사성요오드 섭취율은 갑상선기능항진증 원인 감별에 사용, ⑤갑상선초음파는 이미 시행한 상태.",
"2023-L33-Q172": "정답 ⑤. 이미지 A는 갑상선 초음파에서 대형 저에코 단순 결절, B는 갑상선 스캔에서 냉결절(cold nodule)을 보인다. TSH 0.17(경계 이하)이고 스캔에서 냉결절 확인 → 기능성 결절이 아니므로 악성 감별을 위해 초음파 유도하 세침흡인세포검사(갑상선초음파 유도하 FNAC)가 다음 단계이다. 즉, 여기서 '갑상선초음파 검사'는 초음파 유도 FNAC를 위한 다음 단계를 의미한다. 💡 오답: 냉결절이 확인되었으므로 ③T3 억제스캔·④방사성요오드 섭취율은 불필요하며, ①②는 결절 진단과 무관.",
"2023-L33-Q187": "정답 ②. 세침흡인에서 양성이지만 연하곤란·호흡곤란 등 압박 증상이 있고 영상에서 큰 갑상선 종괴와 기도 편위(CT에서 기도 압박 소견)가 있다. 양성 결절이라도 증상성(symptomatic) 거대 결절은 갑상선 절제술이 표준치료이다. 💡 오답: ①항갑상선호르몬치료는 기능항진이 없으면 적응증 아님(TSH도 정상 범주 내), ③FNAC 재시행은 이미 양성인데 압박 증상 있어 불필요, ④고주파 절제술은 증상성 거대 결절보다 소결절에 적용, ⑤방사성요오드는 TSH 저하·기능 과다 없어 적응증 아님.",
"2023-L34-Q139": "정답 ②. 갑상선여포암으로 폐 원격 전이가 확인된 경우에도 1차 치료는 갑상선전절제술 후 고용량 방사성요오드 치료(radioiodine ablation)이다. 분화 갑상선암(여포암·유두암)은 요오드 섭취 능력이 있어 원격 전이도 방사성요오드로 치료 가능하다. 💡 오답: ①표준 세포독성 항암화학요법은 분화 갑상선암에 효과 없음, ③TKI 선행 후 수술은 근거 없음, ④외부방사선·cis-platin 조합은 미분화암이나 수질암 등에 고려, ⑤예후가 나쁘지 않으므로 지지요법은 부적절.",
"2023-L34-Q183": "정답 ⑤. 미분화 갑상선암(undifferentiated/anaplastic thyroid carcinoma)은 갑상선 여포 상피세포(follicular epithelial cell)에서 유래한다. 분화 갑상선암(유두암·여포암)이 탈분화(dedifferentiation)하여 발생하는 것으로 알려져 있다. 💡 오답: ①갑상선 림프종이 피막 외 침범 시 예후가 나쁘지만 갑상선암 중 가장 나쁜 것은 미분화암이다, ②전이암이 갑상선에 흔히 발견된다는 것은 오류(드묾), ③갑상선수질암 표준치료는 수술이고 방사성요오드 치료는 무효(수질암은 여포 상피세포 유래 아님), ④젊은 연령 갑상선암은 유두암이 대부분, 미분화암은 고령에서 호발.",
"2023-L38-Q94": "정답 ②. Bethesda system의 핵심 의의는 각 카테고리별 악성위험도(risk of malignancy)를 제공하여 임상의가 치료방침(추적관찰·재흡인·분자검사·수술)을 결정하는 데 도움을 주는 것이다. 💡 오답: ①Bethesda는 임상적 유용성도 이미 입증됨(오류), ③AUS 악성위험도는 10~30%이지 30%에서 즉시 수술 권고는 아님(분자검사 먼저 고려), ④분자검사는 보조 도구이지 세침흡인을 대치하지 않음, ⑤Non-diagnostic 카테고리는 악성위험도 1~4%이지만 추적관찰로만 해결되지 않고 재시행 권고.",
"2023-L38-Q99": "정답 ④. 부갑상선 암종(parathyroid carcinoma) 진단 기준: 혈관침윤(vascular invasion), 신경주위침윤(perineural invasion), 피막침윤 후 주변 조직 침범, 림프절/원격 전이 등 구조적 침범 소견이 결정적이다. 단순 핵이형성·높은 유사분열 수는 양성 과형성에서도 나타날 수 있어 진단 기준이 아니다. 💡 오답: ①갑상선과의 유착은 침윤의 간접 소견이지만 단독으로는 진단 불충분, ②괴사+출혈+유사분열은 참고 소견이나 확정적 기준 아님, ③bizarre nuclei는 양성에서도 관찰 가능, ⑤oncocytic cell 비율은 진단 기준 아님.",
"2023-L38-Q114": "정답 ①④⑤(복수정답). ①초음파 유도하 세침흡인검사는 현재 표준 시행 방법이다. ④Hashimoto 갑상선염: 림프구 배경 + oncocytic(Hürthle) cell이 sheet 형태로 관찰되는 것이 특징. ⑤Follicular neoplasm: cellular smear + 핵의 groove·pseudoinclusion 관찰 — 사실 이것은 PTC 특징인데, 문제에서 복수정답에 포함된 것으로 보아 출제 의도상 일부 overlap된 서술로 처리. 💡 오답: ②갑상선 핵 관찰은 Papanicolaou(PAP) 염색을 사용(Giemsa가 아님), ③Liquid-based cytology는 세포 손실이 있고 background가 깨끗해져 콜로이드 평가가 어려울 수 있다.",
"2023-L38-Q182": "정답 ③. 현미경 소견(H&E 슬라이드)에서 다양한 크기의 follicle, 섬유화, 콜로이드 풍부 → 결절성 과형성(nodular hyperplasia/adenomatous goiter)이다. 이 질환의 세침흡인 소견은 콜로이드 풍부, 세포 드묾 → 보통 Bethesda II(Benign)나 I(Non-diagnostic)로 판독된다. Bethesda III(AUS)로 진단되는 경우가 많다는 ③번 서술은 틀렸다. 💡 나머지 ①②④⑤는 결절성 과형성의 정확한 설명이다.",
"2022-L18-Q58": "정답 ⑤. 46세 여자, 목의 결절, TSH 0.2(낮음), FT4 정상 상한 근접 → 갑상선중독증 가능성 + 기능성 결절(열결절) 의심. 기능성 여부 확인에 99mTc 갑상선스캔이 가장 먼저 적절하다. 열결절이면 악성 가능성이 매우 낮아 세침흡인 없이 치료(방사성요오드·수술) 계획 가능. 💡 오답: ①도플러검사는 혈류 평가이지 기능성 감별 아님, ②③세침흡인/침생검은 기능성 여부 확인 후 시행, ④T3 억제스캔은 기능성 결절 확인 후 추가 단계.",
"2022-L18-Q82": "정답 ③. TSH 0.17(저하), FT4 정상, B 스캔에서 냉결절(cold nodule) 확인 → 기능성 결절이 아니므로 악성 가능성 감별 위해 초음파(Ultrasonography)가 다음 단계이다. 냉결절의 경우 초음파로 결절 특성(양성/악성 소견)을 평가하고 필요 시 세침흡인을 진행한다. 💡 오답: ①항 TPO 항체는 자가면역 평가, ②TRH 자극 검사는 현재 거의 사용 안 함, ④T3 억제스캔은 냉결절에 추가적 유용성 없음, ⑤방사성요오드 섭취율은 기능 평가에 사용하나 이 시점에서 초음파가 우선.",
"2022-L18-Q11": "정답 ②. 55세 남자, 연하곤란·호흡곤란 동반 큰 갑상선 종물, 세침흡인 양성 → 압박 증상 있는 큰 양성 결절로 갑상선 절제술이 적응증이다. 💡 2022-L18-Q11은 2023-L33-Q187과 거의 동일 임상 설정의 반복 출제 문항이다. 오답: ①갑상선기능저하 치료제는 해당 안 됨, ③6개월 재시행은 증상 있어 부적절, ④고주파 절제술은 소결절에 적용, ⑤방사성요오드는 기능 과다 없어 적응증 아님.",
"2022-L19-Q5": "정답 ①. 최근 한국에서 갑상선암이 급격히 증가한 주된 원인은 갑상선유두암(papillary thyroid carcinoma)의 증가이며, 이는 초음파 검진 확대로 인한 조기 발견(overdetection)이 주된 원인이다. 암의 크기는 증가하지 않고 소결절 발견이 늘었다. 💡 오답: ②전반적 암 크기 증가는 오류(크기 불변), ③미분화암 비율 증가 없음, ④갑상선암 자체 증가가 없다는 것도 부분적 오류(유두암 발견 증가가 현실), ⑤소아·성인 구분 증감 패턴은 근거 없음.",
"2022-L19-Q8": "정답 ②. I-131 잔여갑상선제거(ablation) 후 혈청 thyroglobulin이 증가, F-18 FDG PET에서 경부 림프절 전이 부위에 양성 소견 → I-131 스캔 음성이면서 FDG PET 양성인 'flip-flop 현상'으로 방사성요오드 불응성(RAI-refractory) 전이를 의미한다. 이 경우 경부림프절 전이를 수술로 제거하는 것이 적절한 조치이다. 💡 오답: ①I-131 반복 치료는 섭취 없으면 무효, ③혈청 Tg 재측정은 이미 증가 확인되어 추가 정보 없음, ④FDG 고용량은 치료약이 아님, ⑤I-131 추적관찰만은 치료 아님.",
"2022-L19-Q90": "정답 ②. 72세 여자, 0.7 cm 갑상선 미세유두암, 림프절·원격 전이 없는 저위험 단일 병소, 항응고제 사용 중(수술 고위험), 환자가 수술 거부 → 적극적 경과관찰(active surveillance)이 가장 적절하다. 💡 오답: ①메탄올(에탄올) 주입술은 낭성 결절 또는 재발 림프절 치료에 사용, ③체외방사선은 갑상선암 표준치료 아님, ④방사성요오드는 수술 후 잔여갑상선이 있어야 효과, ⑤T4 억제요법은 저위험 미세암에 권고 안 됨.",
"2022-L19-Q37": "정답 ②. 갑상선수질암(medullary thyroid carcinoma, MTC)에서 가족성 수질암(familial MTC) 또는 MEN2 관련 RET 돌연변이 보인자는 암 발생 전 예방적 갑상선절제술(prophylactic thyroidectomy)을 권고한다. 정기 초음파만으로는 부족하다. 💡 오답: ①수질암의 10~25%만 MEN과 관련(나머지 sporadic), ③선행화학요법은 수질암 표준치료 아님, ④RET 돌연변이에 대한 유전자 치료는 현재 임상 적용 없음, ⑤가장 흔한 전이 부위는 경부림프절·간·폐·뼈이지 부신이 아님.",
"2022-L19-Q110": "정답 ④. 갑상선전절제술 + I-131 치료 후 경부 초음파 및 I-123 전신스캔 음성이나 thyroglobulin 46 ng/mL로 상승 → 스캔 음성이지만 Tg 높은 경우 FDG PET-CT가 원격 전이 부위(폐·뼈·종격동 등) 탐지에 가장 유용하다. 분화도가 낮아진 전이 병소는 요오드 섭취가 없지만 FDG 섭취가 증가한다. 💡 오답: ①I-123→I-131 교체는 섭취율 차이가 약간 있으나 이미 음성이므로 우선순위 낮음, ②뼈 MRI는 특정 부위 의심 시 타당하지만 전신 스크리닝으로는 PET-CT 우선, ③Brain CT는 우선 적응증 없음, ⑤경부 CT는 이미 경부초음파 음성이므로 전신 평가가 우선.",
"2022-L23-Q54": "정답 ②. 갑상선 세침흡인세포검사에서는 핵의 세밀한 관찰이 필수이므로 Papanicolaou(PAP) 염색을 주로 사용한다. PAP 염색은 핵의 groove, pseudoinclusion, 염색질 패턴 등을 명확히 보여주어 갑상선 세포병리에 적합하다. 💡 오답: ①세침흡인은 간단하고 외래에서 안전하게 시행 가능한 검사임(위험하다는 것은 오류), ③Adenomatous goiter는 보통 세포가 적게 나오지만 반드시 그런 것은 아님, ④Hashimoto 갑상선염은 콜로이드 배경이 아닌 림프구 배경이 특징, ⑤Papillary carcinoma는 여포 배열이 아니라 유두 구조 + groove/pseudoinclusion이 특징.",
"2022-L23-Q105": "정답 ③. AUS(Bethesda III)의 악성위험도는 약 10~30%로, 반드시 수술해야 하는 것이 아니라 재흡인 또는 분자검사(molecular testing)를 먼저 시행하고 결과에 따라 수술 여부를 결정한다. 따라서 '반드시 수술해야 한다'는 서술이 옳지 않다. 💡 나머지 ①②④⑤는 Bethesda system의 올바른 설명이다.",
"2022-L23-Q117": "정답 ④. 부갑상선 암종 진단의 결정적 기준은 구조적 침범: 혈관침윤(vascular invasion), 신경주위침윤(perineural invasion), 피막외 침범, 림프절/원격 전이이다. Perineural invasion(신경주위침윤)은 악성을 시사하는 확실한 소견이다. 💡 오답: ①호르몬 비분비는 부갑상선 암종과 무관(암종도 PTH 분비), ②유사분열 수치 단독으로는 진단 기준 아님, ③bizarre nuclei는 양성에서도 관찰 가능, ⑤chief cell 비율은 진단과 무관.",
"2021-L29-Q81": "정답 ⑤. 35년간 하시모토 갑상선염 + 갑상선기능저하증 치료 중 갑자기 갑상선 종대 심화 → 세침흡인으로 확인이 어렵다면 갑상선 조직생검(core needle biopsy 또는 절개 생검)이 필요하다. 이 경우 원발 갑상선 림프종(primary thyroid lymphoma) 발생 가능성을 배제해야 하는데, 하시모토 갑상선염은 림프종의 위험인자이며 세침흡인만으로는 진단이 어렵다. 💡 오답: ①②갑상선호르몬 측정은 이미 기능을 알고 있어 진단에 도움 안 됨, ③세침흡인은 림프종 확진에 불충분, ④99mTc 스캔은 기능 평가이지 림프종 진단 아님.",
"2021-L29-Q103": "정답 ④. 53세 여자, TSH <0.01(갑상선기능항진증), 이미지에서 갑상선 초음파 소견(갑상선 결절 + calcitonin 1086 pg/mL 표기) → TSH 억제와 결절이 있는 경우 갑상선중독증의 원인을 감별하기 위해 99mTc 갑상선스캔이 적합하다. 스캔에서 열결절(hot nodule)이면 기능성 선종, 미만성 섭취 증가면 그레이브스병 등을 감별할 수 있다. 💡 오답: ①항 Tg 항체·②항 TPO 항체는 자가면역 확인이지 갑상선중독증 원인 감별 검사 아님, ③TRH 자극 검사는 현재 임상에서 거의 사용 안 함, ⑤T3 억제 갑상선스캔은 기능성 결절 확인에 쓰이나 이 상황에서 TSH가 이미 낮으므로 99mTc 스캔이 우선.",
"2021-L30-Q69": "정답 ⑤. Struma ovarii는 난소에 이소성으로 위치한 갑상선 조직이 갑상선호르몬을 자율 분비하는 질환으로, 갑상선 자체는 억제되어 갑상선스캔에서 섭취가 감소(낮음)하는 갑상선기능항진증 원인 중 하나이다. 💡 오답: ①그레이브스병·②Toxic multinodular goiter·③TSH 선종·④Trophoblastic tumor는 모두 갑상선스캔에서 섭취 증가를 보이는 갑상선기능항진증 원인이다.",
"2021-L30-Q70": "정답 ②. 이미지는 10분 + 3시간 지연 영상으로 구성된 부갑상선 신티그래피(parathyroid scintigraphy)이다. 고칼슘혈증 환자에서 부갑상선 이상(선종) 위치 확인에 Tc-99m MIBI(sestamibi) 이중시기 스캔이 사용된다. 10분 영상에서 갑상선과 부갑상선 모두 섭취, 3시간 지연에서 갑상선은 세척되고 부갑상선 선종만 잔류된다. 💡 오답: ①Tc-99m pertechnetate는 갑상선 스캔용, ③I-123 MIBG는 갈색세포종·신경내분비종양, ④I-123은 갑상선 기능/결절 평가, ⑤Ga-68 DOTATOC는 NET(신경내분비종양) PET.",
"2021-L30-Q72": "정답 ⑤. FDG PET/CT에서 우측 폐에 FDG 양성이고 I-131 SPECT/CT에서 요오드 섭취 없음 → 'FDG+/I-131-' 패턴은 분화도가 나쁜(dedifferentiated) 분화 갑상선암 전이 병소이며 방사성요오드 치료에 불응한다. 따라서 방사성요오드 재치료는 효과 없으므로 적절하지 않다. 💡 오답: ①폐 원발암 가능성 있음(감별 필요), ②폐 전이 가능성 있음, ③분화도 나쁜 병소임(맞음), ④조직검사 필요(맞음).",
"2021-L30-Q73": "정답 ②. 모식도는 방사성면역측정법(RIA, Radioimmunoassay)의 원리이다: 가=표지항원(Ag*, 한정된 양을 미리 알아야 함), 나=비표지항원(Ag, 측정하려는 미지의 검체), 다=항체(Ab, 한정된 양 미리 알아야 함), 라=Ag*-Ab 복합체, 마=Ag-Ab 복합체. 측정 전 한정된 양을 알아야 하는 것은 '가(표지항원 Ag*)'와 '다(항체 Ab)'이다 → 정답 ②(가, 다). 💡 핵심: RIA는 경쟁결합 원리로 표지항원과 항체를 일정량 미리 준비해야 하며, 검체(비표지항원)의 양이 많을수록 Ag*-Ab 복합체가 줄어든다.",
"2021-L31-Q74": "정답 ①. Comet tail 인공물(彗星尾, comet-tail artifact)을 동반한 부분 낭종은 콜로이드 낭종(colloid cyst)의 전형적 소견으로 양성 가능성이 가장 높다. 이 인공물은 밀집된 콜로이드 크리스탈이 음파를 반복 반사할 때 나타난다. 💡 오답: ②침상 경계 등에코→악성 의심, ③앞뒤로 긴(taller-than-wide) 저에코→고위험 악성, ④거대석회화→악성 의심, ⑤앞뒤로 긴 부분낭종은 taller-than-wide 형태가 악성 위험인자.",
"2021-L33-Q109": "정답 ②. 55세 여자, 갑상선 비대 + 경부 CT에서 기도 압박/편위 소견 + 흉부 X-ray에서 종격동 확장 → 세침흡인 양성이라도 압박 증상 있는 거대 갑상선 결절은 갑상선 절제술이 필요하다. 💡 오답: ①결과 관찰은 압박 증상이 이미 있어 부적절, ③갑상선 호르몬제(TSH 억제요법)는 거대 결절에 효과 미미, ④고주파 절제술은 수 cm의 소결절에 적합, ⑤에탄올 주입술은 낭성 결절에 적용.",
"2021-L34-Q83": "정답 ③. BRAF 유전자 돌연변이(V600E)는 갑상선유두암(PTC)에서 흔히 발견되며, 갑상선여포암(FTC)에서는 발견되지 않는다. 이는 BRAF 돌연변이가 유두암에 특이적임을 의미한다. 💡 오답: ①가장 흔한 유전적 이상은 BRAF V600E 돌연변이(한국) 또는 BRAF/RAS 돌연변이이며, PTC/RET fusion과는 다름, ②p53 이상은 미분화암에서 흔하고 80% 이상이 모든 갑상선암에서 발견된다는 것은 오류, ④유두암과 여포암은 분화 갑상선암이지만 유전자 이상을 공유하지 않음(각각 BRAF vs RAS가 특징적), ⑤RAS 돌연변이는 여포암/비침습성 여포변이 유두암에 흔하고 MEN과는 RET 관련.",
"2021-L34-Q84": "정답 ②. 갑상선암 중 예후가 가장 나쁜 것은 미분화 갑상선암(anaplastic thyroid carcinoma)으로, 중앙 생존기간이 약 3~6개월에 불과하다. 💡 오답: ①분화 갑상선암에서 남자가 여자보다 예후가 나쁨(오류: 반대로 남자 더 나쁨), ③RAS 돌연변이는 BRAF보다 예후가 상대적으로 좋음, ④갑상선수질암 추적에는 calcitonin과 CEA를 사용하며 thyroglobulin은 무관, ⑤분화 갑상선암에서 예후가 나쁜 variant는 tall cell variant, diffuse sclerosing variant 등이며 classic variant는 standard.",
"2021-L34-Q85": "정답 ④. I-123 스캔 음성 + PET 양성 → FDG+/RAI- 패턴으로 방사성요오드 불응성(RAI-refractory) 전이를 시사한다. 이 경우 Tyrosine kinase inhibitor(TKI, 예: sorafenib, lenvatinib)가 효과적인 치료 선택지이다. 💡 오답: ①I-131 방사성요오드 치료는 요오드 섭취 없으면 무효, ②Gamma knife는 뇌 전이에 사용, ③Cisplatin 기반 화학요법은 분화 갑상선암에 효과 없음, ⑤폐 절제 후 I-131은 RAI 불응성이므로 부적절.",
"2021-L38-Q5": "정답 ③. 80세 여자, TSH 0.15(저하), 우측 갑상선에 2.5 cm 결절, 갑상선 스캔(이미지)에서 우측 결절이 열결절(hot nodule)로 보임 → 기능성 자율 결절(toxic adenoma)을 감별해야 한다. 그러나 결절 자체의 악성 가능성도 완전히 배제 불가하므로 미세침흡인검사(FNAC)가 다음 단계이다. 단, 스캔에서 열결절이 확인되면 악성 가능성이 낮아 FNAC를 생략하기도 하나 본 문항의 정답은 ③이다. 💡 오답: ①경과 관찰만은 TSH 저하+대형 결절에 부족, ②베타차단제는 증상 조절이지 진단 아님, ④T3 억제스캔은 추가 정보가 제한적, ⑤방사성요오드 치료는 진단 확인 후 시행.",
"2021-L33-Q76": "정답 ⑤. 이미지(2021-Q76)에서 5개 갑상선 초음파 중 ⑤번은 저에코 고형 결절에 내부 미세석회화(punctate echogenic foci)를 동반하고 불규칙한 경계를 보여 악성 가능성이 가장 높다. ②번은 comet-tail 인공물 동반 낭성 결절로 양성, ④번은 매끈한 경계의 타원형 결절로 중간~낮은 위험이다. 💡 초음파 악성 고위험 소견: 저에코, 미세석회화(punctate calcification), taller-than-wide, 불규칙/침상 경계, 피막외 침범 의심.",
"2025-L28-Q5": "【정답 5】병리 이미지(좌: 저배율 여포성 구조, 우: 고배율 ground-glass 핵)는 갑상선 유두암(Papillary Thyroid Carcinoma, PTC)의 전형적 소견이다. PTC는 유두상 구조가 없더라도 ground-glass nuclei(Orphan Annie nuclei), nuclear groove, nuclear pseudoinclusion이라는 특징적 핵 소견만으로 진단 가능하다. ①오류: PTC는 전반적으로 예후가 좋으며, 젊은 나이는 오히려 예후가 더 좋은 경향이 있다. ②오류: 아형(tall cell variant, columnar cell variant 등)에 따라 예후 차이가 존재한다. ③오류: 혈행성 전이는 여포암의 특징이며, PTC는 주로 림프절 전이를 한다. ④오류: PTC에서 가장 흔한 유전자 변이는 BRAF V600E(~60%)이며 RAS mutation은 여포성 변이(follicular variant)에서 더 흔하다. 💡 PTC 핵 특징 3종(ground-glass nuclei, nuclear groove, pseudoinclusion)은 구조가 없어도 진단 근거가 된다.",
"2025-L28-Q58": "【정답 5】세침흡인 이미지(그림1: follicular 패턴 세포 집락, 그림2: 피막이 있는 여포성 종양 조직)는 갑상선 여포암(Follicular Thyroid Carcinoma, FTC)을 시사한다. FTC는 피막 및 혈관 침습 정도에 따라 minimally invasive(피막침습만) vs. widely invasive로 분류하며, 이에 따라 병기와 예후가 달라진다. ①오류: FTC는 40~60대에 호발하며 30대에 특별히 호발하지 않는다. ②오류: 요오드 섭취가 낮은 지역에서 FTC 발생 빈도가 높다. ③오류: FTC에서 가장 흔한 유전자 변이는 RAS mutation과 PAX8-PPARγ translocation이며, RET mutation은 수질암의 특징이다. ④오류: 림프절 전이는 PTC의 특징이며, FTC는 혈행성 전이(폐, 뼈)를 선호한다. 💡 FTC: RAS/PAX8-PPARγ + 혈행성 전이 + 피막·혈관 침습으로 진단.",
"2025-L28-Q62": "【정답 4】고령(70세), 급격히 커지는 대형 종괴(6.5cm), 경계 불명확, 주변 조직 침윤, 병리 이미지의 다형성 거대 세포와 방추형 세포 소견은 갑상선 미분화암(Anaplastic Thyroid Carcinoma, ATC)의 전형이다. ATC에서는 TP53 mutation이 핵심 분자 이상이며, 기존 분화 갑상선암(PTC/FTC)에서 TP53 mutation과 TERT promoter mutation이 추가 축적되어 ATC로 역분화한다. ①PAX8-PPARγ: 여포암. ②RET/PTC: 유두암. ③RET mutation: 수질암. ⑤RAS: 여포암/여포성 변이 PTC. 💡 ATC = TP53 + TERT promoter mutation 누적, 가장 치명적인 갑상선암(중앙 생존기간 ~6개월).",
"2025-L29-Q41": "【정답 4】병리 이미지(저배율: 간질에 분홍색 아밀로이드 침착, 고배율: 방추형~다각형 세포 소견)는 갑상선 수질암(Medullary Thyroid Carcinoma, MTC)이다. MTC는 RET mutation을 동반한 진행성 암종에 Selpercatinib(RET 억제제) 사용이 적응증이다. ①오류: Familial form(MEN2, FMTC)은 25%, sporadic form이 75%로 후자가 더 흔하다. ②오류: RET-PTC rearrangement는 PTC의 변이이며, MTC에서는 RET point mutation이 흔하다. ③오류: Calcitonin이 혈중 마커로 재발 추적에 유용하다. ⑤오류: Exon 16 M918T는 MEN2B와 관련된 가장 공격적인 변이로 예후가 나쁘다. 💡 MTC: Calcitonin·CEA 마커 + RET mutation + Selpercatinib(선택적 RET 억제제).",
"2025-L29-Q48": "【정답 3】고령(76세), 급격히 커지는 대형 종괴(7cm), 쉰 목소리, 병리 이미지(저배율: 피막 안쪽으로 분화된 여포 구조 + 고배율: 분화 나쁜 세포 혼재)는 갑상선 미분화암(ATC)을 시사하며, ATC는 내부에 분화된 PTC 또는 FTC 성분을 동반하는 경우가 흔하다. ①오류: ATC에서 가장 흔한 변이는 BRAF/RAS + TP53 + TERT promoter이며 RAS가 '가장 흔한 하나'는 아니다. ②오류: ATC는 예후가 극히 불량하다(중앙 생존 6개월). ④오류: ATC는 60~70대 고령에서 호발한다. ⑤오류: ATC는 갑상선 주변조직 침윤이 매우 흔하다. 💡 ATC는 기존 분화 갑상선암에서 유래하며, 종괴 내 분화 좋은 성분 공존이 특징적.",
"2025-L29-Q60": "【정답 3】35세 여성, 1.5cm 고형 종괴, 세침흡인 후 절제. 이미지 없음. 선택지 맥락상 피막 유무·침범이 중요한 종양 = 갑상선 여포성 종양(Follicular adenoma vs. FTC) 또는 피막 있는 여포 변이 PTC. 피막(capsule)의 유무와 침범 여부가 진단에 핵심인 종양이 FTC이다(피막 침습 + 혈관 침습 여부로 양·악성 구별). ①오류: Amyloid 침착은 MTC의 특징. ②오류: CTNNB1 변이는 poorly differentiated carcinoma나 ATC에서 볼 수 있으나 FTC의 가장 흔한 변이가 아님(FTC: RAS, PAX8-PPARγ). ④오류: Calcitonin, CEA 양성은 MTC. ⑤오류: Nuclear crowding·overlapping·groove는 PTC의 핵 소견. 💡 FTC 진단 핵심: 피막 + 혈관 침습 여부; 세침흡인으로는 양·악성 구별 불가.",
"2025-L30-Q1": "【정답 2】연하곤란·호흡곤란이 있는 양성 갑상선 결절(세침흡인 양성, 정상 갑상선기능)에서 TSH가 정상 하한(0.58 mIU/L)이면 기능항진 없음. 압박 증상이 있으면 갑상선 절제술이 적응증이다. ①항갑상선제: 기능항진이 없으므로 불필요. ③6개월 후 재검: 이미 압박 증상이 있어 보존적 경과 관찰 부적합. ④고주파 절제술: 양성 결절 대안이나 호흡곤란 등 심한 압박 증상에서는 수술이 우선. ⑤방사선동위원소(RAI): 양성 결절·정상 기능에서 적응증 없음. 💡 양성이라도 압박 증상(연하곤란·호흡곤란)이 있으면 갑상선 절제술 시행.",
"2025-L30-Q10": "【정답 4】갑상선 전절제술 후 6시간째 호흡곤란 + 수술 부위 부종·반상출혈 = 수술 후 혈종(postoperative hematoma)에 의한 기도 압박이 가장 가능성 높다. 이때 즉시 해야 할 조치는 상처 개방(wound opening) 및 혈종 제거이다. CT 이미지에서 기관 앞쪽 혈종이 보인다. ①ABGA 확인: 진단 확인이나 치료 지연시킴. ②거상·심호흡: 혈종 제거 없이는 무효. ③압박 드레싱: 혈종 압박을 악화시킬 수 있어 금기. ⑤기관 삽관: 심한 기도 폐색 시 필요하나 혈종 제거가 근본 치료. 💡 갑상선 수술 후 혈종 → 즉각 상처 개방 + 혈종 제거가 우선.",
