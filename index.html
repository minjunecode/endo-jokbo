"stem_table":null,"options":["Dopamine – small peptide","Gonadotropin-releasing hormone (GnRH) – large protein","Luteinizing hormone (LH) – steroid hormone","Thyroid hormone – amino acid derivative","Retinoids – large protein"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q43"},{"id":"2022-L2-Q63","year":2022,"qnum":63,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 펩타이드 호르몬 수용체의 종류와 하위 신호전달 과정에 작용하는 물질이 적절하게 연결된 것을 고르시오.","stem_table":null,"options":["Cytokine receptor – STAT","Tyrosine kinase receptor – Smad","G-protein coupled receptor – Ras","Nuclear receptor – cAMP","Serine kinase receptor – diacylgylcerol"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q63"},{"id":"2022-L2-Q108","year":2022,"qnum":108,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 양성되먹임 조절 (positive feedback regulation)에 해당하는 것을 고르시오.","stem_table":null,"options":["Estrogen에 의한 luteinizing hormone (LH) 분비 증가","Glucose에 의한 GH 분비 조절","Cortisol에 의한 corticotropin releasing hormone (CRH) 분비 조절","자율신경계에 의한 cortisol 분비 조절","혈중 칼슘 농도에 의한 parathyroid hormone (PTH) 분비 조절"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q108"},{"id":"2022-L2-Q72","year":2022,"qnum":72,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 스테로이드 호르몬 수용체의 작용에 대한 설명으로 적절한 것을 고르시오.","stem_table":null,"options":["스테로이드 호르몬 수용체는 DNA에 직접 결합하지 않는다.","Zinc-finger domain은 호르몬 결합에 작용한다.","Nuclear localization signal (NLS) 없이도 핵내에 존재할 수 있다.","스테로이드 호르몬의 C-terminal 부위에 variable region이 존재한다.","Hormone responsive element는 동일한 염기서열이 정방향 또는 역방향으로 반복되어 나타난다."],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q72"},{"id":"2022-L2-Q92","year":2022,"qnum":92,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 스테로이드 호르몬 수용체에 대한 설명으로 적절한 것을 고르시오.","stem_table":null,"options":["Progesterone receptor는 retinoid X receptor와 heterodimer를 이루어 작용한다.","Vitamin D receptor는 nucleus에서 vitamin D와 결합한다.","Orphan nuclear receptor는 주로 cytosol에 존재한다.","Retinoid X receptor는 dimer를 형성하지 않는다.","Thyroid hormone receptor는 homodimer를 형성한다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q92"},{"id":"2022-L3-Q31","year":2022,"qnum":31,"jokbo_lec_no":3,"lecture":"내분비대사질환의 요인, 진단","professor":"박영주","curr_lec_no":"04","curr_lecture":"내분비대사질환의 요인,진단","stem":"내분비질환으로 새로 진단받은 다음의 환자 중, 유전성 질환을 감별하기 위하여 알려진 특정 표적 유전자 검사가 필요한 경우는? (연령 – 성별 – 진단명 – 동일 질환력이 있는 가족 순으로 나열됨)","stem_table":null,"options":["65세 – 여자 – 골다공증 – 어머니, 언니","55세 – 여자 – 그레이브스 병 – 어머니, 언니","45세 – 남자 – 2형 당뇨병 – 아버지, 어머니","35세 – 남자 – 갑상선유두암 – 아버지, 누나","25세 – 여자 – 2형 당뇨병 – 어머니, 여동생"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q31"},{"id":"2022-L4-Q84","year":2022,"qnum":84,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체기능부전시 대부분 뇌하수체호르몬이 아닌 표적장기호르몬으로 보충한다. 표적장기호르몬 대신 반드시 뇌하수체호르몬을 직접 보충해야 하는 뇌하수체호르몬은?","stem_table":null,"options":["Prolactin","ACTH","TSH","FSH","GH"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q84"},{"id":"2022-L4-Q99","year":2022,"qnum":99,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"30세 여자 환자에서 뇌하수체선종이 발견되어 시행한 호르몬 검사 결과는 다음과 같다. 이 검사 결과만으로 결핍을 진단할 수 있는 뇌하수체 호르몬은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 0.65 ng/dL | 0.6-1.7 |\n| 갑상선자극호르몬 | 1.2 mIU/L | 0.34-4.25 |\n| 코티졸 | 5.2 μg/dL | 5-25 |\n| 부신피질자극호르몬 | 12.9 pg/mL | 6-75 |\n| 프로락틴 | 12 ng/mL | 2.5-17.0 |\n| 여포자극호르몬 | 8 mIU/mL | 1-9 |\n| 황체형성호르몬 | 4 mIU/mL | 2-12 |\n| 인슐린유사성장인자-1 | 30 ng/mL | 94-269 |","options":["프로락틴","성장호르몬","성선자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q99","reparsed":true},{"id":"2022-L4-Q22","year":2022,"qnum":22,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"시상하부와 뇌하수체를 연결하는 줄기(stalk)에 손상을 받을 때 분비가 오히려 증가하는 호르몬은?","stem_table":null,"options":["프로락틴","성장호르몬","갑상선자극호르몬","부신피질자극호르몬","여포자극호르몬"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q22"},{"id":"2022-L4-Q25","year":2022,"qnum":25,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"42세 여자가 건강검진상 우연히 발견된 뇌하수체 선종으로 내원하였다. 호르몬 검사와 뇌하수체 자기공명 영상은 다음과 같았다. 시력 저하나 시야 장애는 호소하지 않았고 월경은 규칙적이었고 유즙 분비 소견은 없었다. 현재 복용하고 있는 약제는 없었다. 상기 환자의 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 0.91 ng/dL | 0.8-1.7 |\n| 갑상선자극호르몬 | 2.9 mIU/L | 0.34-4.25 |\n| 코티졸 | 15.2 μg/dL | 5-25 |\n| 부신피질자극호르몬 | 32.9 pg/mL | 6-76 |\n| 프로락틴 | 32 ng/mL | 2.5-17.0 |\n| 여포자극호르몬 | 1.8 mIU/mL | 1-9 |\n| 황체형성호르몬 | 3.4 mIU/mL | 2-12 |\n| 에스트로겐 | 34 pg/mL | 30-120 |\n| 인슐린유사성장인자-1 | 220 ng/mL | 54-436 |","options":["프로락틴분비 뇌하수체 선종","비기능성 뇌하수체 선종","뇌하수체 쿠싱병","말단비대증","뇌하수체졸증"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q25MRIp83_a8b393f5.png","note":null,"id_simple":"2022-Q25","reparsed":true},{"id":"2022-L4-Q61","year":2022,"qnum":61,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"폐암으로 항암치료 중인 64세 남자 환자가 3개월 전부터 오심, 구토를 반복적으로 하다가 쇠약감이 악화되어 내원하였다. 부종이나 체위성 저혈압은 관찰되지 않았다. 혈액 검사 결과는 다음과 같았다. 적절한 치료는?","stem_table":"| 검사 | 결과 |\n|---|---|\n| Na+ | 131 mEq/L |\n| 삼투질 농도 | 270 mOsm/kg H2O |\n| BUN/Cr | 10/0.4 mg/dL |\n| 유리 T4 | 0.99 ng/dL (참고치 0.8-1.7) |\n| TSH | 2.9 mIU/L (0.34-4.25) |\n| Cortisol | 18.2 μg/dL (참고치 5-25) |\n| ACTH | 42.9 pg/mL (참고치 6-76) |\n| 소변 Na+ | 36 mEq/L |\n| 소변 삼투질 농도 | 380 mOsm/kg H2O |","options":["수분제한","데스모프레신","3% NaCl 주입","갑상선호르몬 투약","당질 글루코코르티코이드 투약"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q61","reparsed":true},{"id":"2022-L4-Q102","year":2022,"qnum":102,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체 호르몬은 대부분 시상하부에서 분비되는 방출호르몬에 의해 자극을 받아서 분비된다. 그 중 프로락틴은 평상시에는 주로 이것에 의해 분비가 억제된다. 이것은 무엇인가?","stem_table":null,"options":["성장호르몬","도파민","성선자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q102"},{"id":"2022-L4-Q56","year":2022,"qnum":56,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체-표적기관 축의 생리적 조절을 받는 뇌하수체 호르몬과 표적기관 호르몬의 쌍으로 옳은 것은?","stem_table":null,"options":["ACTH – norepinephrine","GH – insulin","Prolactin – estrogen","FSH – testosterone","TSH – calcitonin"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q56"},{"id":"2022-L4-Q76","year":2022,"qnum":76,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"35세 여자가 그레이브스병으로 진단 받고 항갑상선제(methimazole, 40 mg/day) 복용 2개월 경과 후 인후통과 발열(40°C)을 주소로 내원하였다. 혈액검사에서 백혈구수 (WBC) 200/μL, 호중구수 (ANC) 10/μL였다. 이 환자의 향후 치료에 대한 설명으로 옳은 것은?","stem_table":null,"options":["항갑상선제를 즉시 중단하되 회복하면 다시 동일 항갑선제를 투여할 수 있다.","대부분 일과성이므로 항갑상선제를 유지하고 예방적 항생제를 투여하며 경과관찰 한다.","보통 항갑상선제 투여 기간 및 용량에 비례하여 발생하므로 항갑상선제 감량하여 유지한다.","항갑상선제는 즉시 중단하고 회복된 후 방사성요오드 치료 또는 수술적 치료를 고려한다.","현재 항갑상선제(methimazole)를 중단하고, 백혈구 수치가 회복되면 propylthiouracil로 교체한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q76"},{"id":"2022-L4-Q77","year":2022,"qnum":77,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"다음 중 뇌하수체호르몬의 [생산 또는 분비]의 감소를 평가하는 방법은?","stem_table":null,"options":["경구 당부하 검사","식염수 부하 검사","급속 ACTH 자극 검사","인슐린 유발 저혈당 검사","Dexamethasone 억제 검사"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q77"},{"id":"2022-L4-Q94","year":2022,"qnum":94,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"김정희","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"29세 여자가 3개월 전부터 시작된 심한 갈증으로 내원하였다. 소변을 자주 보고 밤에도 1-2시간 간격으로 소변을 봤다. 혈압은 112/72 mmHg 였고 체중은 52kg 였다.\n혈액 검사:\n- 공복포도당 84 mg/dL, 크레아티닌 0.8 mg/dL\n- Na+/K+/Cl- 145/4.0/102 meq/L\n24시간 소변검사:\n- 양 6,200 mL, 비중 1.003, 삼투질농도 112 mOsmol/kg H2O\n수분제한검사 결과(그림):\n이 환자에서 가장 가능성이 높은 진단은?","stem_table":null,"options":["일차다음증","정상반응","중추성 요붕증","신성 요붕증","SIADH"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q94p83_44f0ba77.png","note":null,"id_simple":"2022-Q94"},{"id":"2022-L5-Q116","year":2022,"qnum":116,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"김정희","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"다음 병변과 관련이 높은 증상은?","stem_table":null,"options":["유즙 분비","말단 비대","요붕증","시야 결손","고혈압"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q116_p84.png","note":null,"id_simple":"2022-Q116"},{"id":"2022-L5-Q24","year":2022,"qnum":24,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"김정희","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"32세 여자가 2주 전부터 시작된 심한 전신 위약감을 주소로 응급실에 왔다. 4주 전 폐결핵을 진단받고 결핵약 복용을 시작했다. 방문 시 혈압 82/46mmHg, 맥박 110/min, 체온 37.4°C였다. 혈액 검사 상 혈액요소질소 28.0 mg/dL, 크레아티닌 0.7 mg/dL, 혈청 나트륨 122 mEq/L, 칼륨 5.0 mEq/L, Cl 98 mEq/L, 혈중 glucose 82 mg/dL였다. 2년 전 부신 양측 절제술 후 지속적으로 prednisolone 5 mg/day, fludrocortisone 0.1 mg/day 복용 중인 것 외에 특별한 과거력은 없었다.\n이 환자에게 필요한 처치를 1개 고르시오.","stem_table":null,"options":["고용량 hydrocortisone 정맥 주사","급속 ACTH 자극검사","Fludrocortisone 증량","Cosyntropin 투약","3% saline 정주"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q24"},{"id":"2022-L5-Q109","year":2022,"qnum":109,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"김정희","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"비기능성 뇌하수체 종양으로 추적 관찰 중이던 45세 남자가 갑자기 발생한 심한 두통, 시야 장애, 구역, 구토를 주소로 응급실을 내원하였다. 상기 환자에서 호르몬 검사를 위해 혈액 채취 후 가장 먼저 투약해야 할 호르몬은?","stem_table":null,"options":["Testosterone","Hydrocortisone","Levothyroxine","Desmopressin","Growth hormone"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q109"},{"id":"2022-L6-Q52","year":2022,"qnum":52,"jokbo_lec_no":6,"lecture":"뇌하수체전엽질환","professor":"안창호","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"50세 남자가 1개월 전부터 잘 안 보인다고 내원하였다. 이에 시행한 시야 검사 및 뇌 MRI 소견은 다음과 같았다. 증상의 원인이 되는 뇌신경은?","stem_table":null,"options":["2번 뇌신경","3번 뇌신경","4번 뇌신경","5번 뇌신경","6번 뇌신경"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q52p84_3c4ec20b.png","note":null,"id_simple":"2022-Q52"},{"id":"2022-L6-Q91","year":2022,"qnum":91,"jokbo_lec_no":6,"lecture":"뇌하수체전엽질환","professor":"안창호","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"뇌하수체선종에 대한 설명 중 옳은 것은?","stem_table":null,"options":["소아에서 성장호르몬 (growth hormone)을 분비하는 뇌하수체선종이 발생한 경우 말단비대증 (acromegaly)로 나타난다.","뇌하수체 선종을 분류하는데 있어 PIT-1, TPIT, SF-1과 같은 transcription factor 발현 양상을 아는 것이 중요하다.","비기능성 뇌하수체선종은 주로 mass effect를 일으키므로 발견이 기능성에 비해 빠르다.","기능성 선종 중에서는 ACTH를 과분비하여 Cushing disease를 일으키는 뇌하수체선종이 가장 흔하다.","조직학적 소견 상 reticulin network이 유지되는 것이 특징적이다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q91"},{"id":"2022-L6-Q115","year":2022,"qnum":115,"jokbo_lec_no":6,"lecture":"뇌하수체전엽질환","professor":"안창호","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"54세 남자 환자가 건강검진에서 우연히 발견된 뇌하수체 종양을 주소로 내원하였다. 뇌하수체 호르몬 검사와 뇌하수체 MRI, 시야검사 결과는 아래와 같았다. 본 환자에게 가장 적절한 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| LH | 0.9 mIU/mL | 1-10 |\n| FSH | 1.2 mIU/mL | 1-9 |\n| Testosterone | 1.2 ng/mL | 2.7-10 |\n| Free T4 | 0.6 ng/dL | 0.8-1.8 |\n| TSH | 3.1 μIU/mL | 0.4-4.1 |\n| Prolactin | 52 ng/mL | 3-25 |\n| GH | 0.2 ng/mL | - |\n| IGF-1 | 55 ng/mL | 70-250 |\n| ACTH | 31 pg/mL | 0-60 |\n| Cortisol | 2.7 μg/dL | - |\n| 뇌하수체 MRI | 뇌하수체 거대선종 (pituitary macroadenoma) | - |\n| 시야검사 | 양귀쪽반맹 (bitemporal hemianopsia) | - |","options":["즉각적인 치료 없이 추적 관찰","소마토스타틴 수용체 작용제 (somatostatin receptor ligand)","도파민 작용제 (dopamine agonist)","방사선치료","경접형골동수술 (transsphenoidal surgery)"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q115_sellarMRI_p84.png","note":null,"id_simple":"2022-Q115","reparsed":true},{"id":"2022-L6-Q59","year":2022,"qnum":59,"jokbo_lec_no":6,"lecture":"뇌하수체전엽질환","professor":"안창호","curr_lec_no":"07","curr_lecture":"뇌하수체전엽질환","stem":"45세 남자가 1년 전 말단거대증으로 진단되어 접형동경유섬종절제술을 받았다. 현재 이 환자의 검사 결과가 아래와 같을 때 적절한 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 1.4 ng/dL | 0.8-1.7 |\n| 갑상선자극호르몬 | 2.1 mIU/L | 0.34-4.25 |\n| 코티솔 | 12.4 µg/dL | 5-25 |\n| 부신피질자극호르몬 | 12 pg/mL | 6-76 |\n| 성장호르몬 | 2.5 ng/mL | 0-0.17 |\n| 인슐린유사성장인자-1 | 210 ng/mL | 114-492 |\n| 75g 포도당 억제 성장호르몬 | 0.3 ng/mL | - |\n| Sellar MRI | No definite remnant tumor | - |","options":["브로모크립틴","소마토스타틴유사체","재수술","방사선치료","경과 관찰"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q59","reparsed":true},{"id":"2022-L7-Q3","year":2022,"qnum":3,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"32세 여자가 불임으로 검사를 시행하였다.\n- TSH 1.75 IU/L (참고치 0.3-4.0)\n- ACTH 2.1 pg/mL\n- 24 hour urine cortisol 320 μg/day (참고치 80-120)\n- 1mg overnight dexamethasone suppression test 7.9 μg/dL\n상기 환자의 질환이 발생한 부신의 해부학적 구조는?","stem_table":null,"options":["Capsule","Medulla","Zona glomerulosa","Zona fasciculate","Zona reticularis"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q3p85_4552b92c.png","note":null,"id_simple":"2022-Q3"},{"id":"2022-L7-Q38","year":2022,"qnum":38,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"부신에서 분비되는 호르몬 중, 이차성 부신기능저하증에서 분비량이 보존되는 호르몬을 한 개 고르시오.","stem_table":null,"options":["Aldosterone","Androstendione","Cortisol","DHEA","DHEA-S"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q38"},{"id":"2022-L7-Q18","year":2022,"qnum":18,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"구보경","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"다음은 부신의 단면 모식도이다. A-D 중 염류코르티코이드를 생성하는 곳을 고르시오.","stem_table":null,"options":["A","B","C","D","A와 B"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q18ABCDp86_d028d00c.png","note":null,"id_simple":"2022-Q18"},{"id":"2022-L8-Q83","year":2022,"qnum":83,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"76세 여자 환자가 오심과 구토를 주소로 내원하였다. 평소 건강하던 환자는 2년 전부터 시작된 허리와 무릎의 통증으로 관절 주사를 수 차례 맞은 적이 있으나, 최근 3개월 사이에는 시행하지 않았다. 내원 1개월 전부터 기운 없음과 근력 저하가 시작되었고, 1주일 전부터는 오심과 구토 증상이 심해져서 내원하였다. 가장 적절한 치료는?\n- BP 90/60 mmHg, HR 80/min, 36.8℃\n- CBC 8400-10.8-342k\n- AST/ALT 18/14, BUN/Cr 36/16\n- E' 121-4.3-104\n- Serum osmolarity 268 mosmol/kg (280-29","stem_table":null,"options":["0.9% NaCl 정주","Glucocorticoid 투여","갑상선 호르몬 보충요법","베타차단제 투여","항갑상선제 투여"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q83"},{"id":"2022-L8-Q36","year":2022,"qnum":36,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"다음 중 쿠싱 증후군에서 나타나는 증상, 증후가 아닌 것은?","stem_table":null,"options":["부종","고혈압","골밀도증가","저칼륨혈증","동맥경화증"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q36"},{"id":"2022-L8-Q53","year":2022,"qnum":53,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"49세 여자가 복부 비만, 쉽게 멍이 드는 증상으로 내원하였다. 고혈압, 이상지질혈증, 당뇨병이 확인되었고, 신체검진에서 복부에 붉은 선조 및 다모증이 관찰되었다. 검사결과는 다음과 같다. 원인 질환을 감별하기 위해 다음으로 시행해야 할 검사는?\n- 24 hour urine cortisol 660 µg/day (참고치 80-120)\n- 1 mg overnight dexamethasone suppression test 7.9 µg/dL\n- Low dose dexamethasone suppression test 19 µg/dL","stem_table":null,"options":["ACTH","DHEA-S","morning plasma cortisol","plasma metanephrine","cortisol binding globulin"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q53"},{"id":"2022-L8-Q75","year":2022,"qnum":75,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"41세 여자가 건강검진에서 시행한 복부 전산화단층촬영 검사에서 이상소견으로 내원하였다. 출산력은 없었으며, 1년 전부터 무월경이 있었고, 복부 비만의 붉은 선조가 있었다. 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| Midnight salivary cortisol | 10 nmol/L | - |\n| 24 Hour urinary free cortisol | 290 μg/day | 80-120 |\n| Aldosterone | 22 ng/dL | 4-31 |\n| Plasma renin activity | 2.9 ng/mL/hr | 0.3-3.0 |\n| ACTH | 4.0 pg/mL | - |","options":["쿠싱병","갈색세포종","부신 쿠싱증후군","이소성 쿠싱증후군","일차성 알도스테론증"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q75CTp86_0cd6f481.png","note":null,"id_simple":"2022-Q75","reparsed":true},{"id":"2022-L8-Q86","year":2022,"qnum":86,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"쿠싱병과 이소성 ACTH 증후군을 감별하는 데에 가장 정확도가 높은 검사는?","stem_table":null,"options":["혈중 ACTH 농도","고용량 덱사메타존 억제 검사","24시간 소변 유리 코티솔","뇌하수체 MRI","아래바위정맥동굴 채혈술 (Inferior petrosal sinus sampling)"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q86"},{"id":"2022-L8-Q96","year":2022,"qnum":96,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"43세 여자가 두통, 사지 허약감 및 고혈압을 주소로 내원하였다. 신체검사상 moon face 및 central obesity가 관찰되었고 혈액 검사상 혈장 glucose 270mg/dL (정상 70-110 mg/dL), 혈장 및 소변 cortisol이 증가되어 있는 것이 발견되었다. Aldosterone level은 정상이었다. 이 환자가 가지고 있을 병리학적 소견으로 가장 가능성이 높은 것은?","stem_table":null,"options":["뇌하수체의 비기능성 (non-functioning) 선종","터키만 상방 (suprasellar area)의 두개인두종 (cranopharyngioma)","부신수질의 종양성 병변","부신피질 (adrenal cortex)의 zona glomerulosa 부분의 세포 증식","부신피질 (adrenal cortex)의 zona fasciculate 부분의 세포 증식"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q96"},{"id":"2022-L8-Q80","year":2022,"qnum":80,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"30세 남자가 척추 골절로 입원하였다. 이차성 골다공증의 원인질환을 감별하기 위해 아래 검사를 시행하였다. 가장 적절한 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| TSH | 1.2 mIU/L | 0.34-4.25 |\n| Testosterone | 5.125 ng/mL | 2.51-10.63 |\n| LH | 1.7 IU/L | 1.0-5.3 |\n| FSH | 5.0 IU/L | 1.3-8.1 |\n| 24 Hour urinary free cortisol | 324 μg/day | 80-120 |\n| 1mg overnight dexamethasone suppression test cortisol | 4.2 μg/dL | - |\n| ACTH | 2.3 pg/mL | - |\n| Adrenal CT | right adrenal adenoma, 3.2 cm | - |","options":["Mitotane","Etomidate","Metyrapone","Right adrenalectomy","Radio frequency ablation"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q80","reparsed":true},{"id":"2022-L9-Q48","year":2022,"qnum":48,"jokbo_lec_no":9,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"51세 남자가 발한, 두통, 잘 조절되지 않는 고혈압으로 내원하였다. 검사 결과는 다음과 같다. 적절한 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 소변 메타네프린 | 0.97 mg/day | 0.05-0.34 |\n| 소변 노르메타네프린 | 2.08 mg/dL | 0.09-0.44 |\n| 24 hour urine cortisol | 37 µg/day | 80-120 |\n| 1 mg overnight dexamethasone suppression test | 1.0 µg/dL | - |","options":["propranolol","furosemide","doxazocin","metyrosine","nicardipine"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q48CTp88_410dc904.png","note":null,"id_simple":"2022-Q48","reparsed":true},{"id":"2022-L9-Q88","year":2022,"qnum":88,"jokbo_lec_no":9,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"62세 남자환자가 조절되지 않는 고혈압으로 내원하였다. 검사를 위해 시행한 복부 전산화 단층 촬영 및 혈액 검사결과는 다음과 같다. 가장 적합한 치료방법은 무엇인가?\nSerum:\n- Metanephrine 1307 (참고 90-930 pg/mL)\n- Normetanephrine 5185 (참고 100-2300 pg/mL)\n24hr Urine:\n- Dopamine 312.6 (65-400 μg/day)\n- Norepinephrine 105.5 (15-80 μg/day)\n- Epinephrine 9.3 (0-20 μg/day)\n- Metanephrine 397.2 (52-341 μg/day)\n- Normetanephrine 1612.8 (88-444 μg/day)\n- VMA 3.9 (2-7 mg/day)\n- 1mg 덱사메타손 투여 후 혈청 코티솔 1.2 μg/dL\n- Plasma renin activity 0.28 (1-2.","stem_table":"|  | Aldosterone ng/dL | Cortisol μg/dL |\n|--|--|--|\n| 오른쪽 부신정맥 | 2640 | 160 |\n| 왼쪽 부신정맥 | 200 | 150 |\n| 하대정맥 | 120 | 40 |","options":["좌측 부신 절제술","우측 부신 절제술","양측 부신 절제술","Spironolactone 투여","ng/ml/hr- Serum aldosterone 21.4 (3-1"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q88CTp88_a534aaa9.png","note":null,"id_simple":"2022-Q88"},{"id":"2022-L9-Q103","year":2022,"qnum":103,"jokbo_lec_no":9,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"35세 여자가 두통과 심계항진을 주소로 병원에 왔다. 혈압 180/120 mmHg, 맥박 100회/분, 호흡수 18 회/분, 체온은 37°C이다. 최근 약물 복용력은 없었고, 특별한 과거력 및 가족력은 없었다. 내원 시 시행한 복부 CT와 혈액검사 결과는 아래와 같다. 일차적으로 사용하는 약제는?\n- 1mg 야간 덱사메타손억제검사: 코티솔 1.0 μg/dL\n- 24시간 소변: 메타네프린 35 μg (참고치, 30-350)\n다음으로 시행할 검사는?","stem_table":null,"options":["부신정맥채혈","부신 컴퓨터단층촬영","0.9% 식염수 부하검사","저용량 덱사메타손억제검사","급속 부신겉질자극호르몬자극검사"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q103"},{"id":"2022-L9-Q21","year":2022,"qnum":21,"jokbo_lec_no":9,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"27세 남자가 6개월 전부터 시작된 두통과 간헐적 발한 증가 및 심계 항진으로 병원에 왔다. 발한 증가 및 심계 항진 증상은 갑자기 시작되어 수분 정도 지속되었다. 혈압 170/120mmHg, 맥박 104회/분, 호흡 22회, 체온 36.8°C였다. 복부 전산화 단층 촬영 결과는 아래와 같았다. 이 환자에서 혈압조절을 위해 1차로 투여되어야 하는 약제는?","stem_table":null,"options":["Thiazide","Beta-blocker","Alpha-blocker","Potassium sparing diuretics","Angiotensin converting enzyme inhibitors"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q21"},{"id":"2022-L9-Q100","year":2022,"qnum":100,"jokbo_lec_no":9,"lecture":"내분비고혈압","professor":"윤지완","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"46세 남자가 1년 전부터 혈압이 높다고 병원에 왔다. 6개월 전부터 두통과 두근거림이 있다고 한다. 1년 전에 고혈압을 진단받고 3종류의 혈압약을 복용하고 있으나 혈압이 조절되지 않는다고 한다. 혈압 170/100 mmHg, 맥박 78 회/분, 호흡 20회/분, 체온 36.8°C이다. 검사 결과는 다음과 같다.","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈액요소질소 | 20 mg/dL | - |\n| 크레아티닌 | 0.9 mg/dL | - |\n| Na+/K+/Cl- | 140/3.5/101 meq/L | - |\n| 칼슘 | 8.5 mg/dL | 8.4-10.2 |\n| 갑상샘자극호르몬 | 2.9 mIU/L | 0.34-4.25 |\n| 유리 T4 | 1.31 ng/dL | 0.8-1.7 |\n| 알도스테론 | 17 ng/dL | 4-31 |\n| 혈장 레닌활성 | 0.12 ng/mL/hr | 0.3-3.0 |","options":["Pituitary adenoma","Pancreatic islet cell tumor","Pheochromocytoma","Adrenal adenoma","Parathyroid adenoma"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q100","reparsed":true},{"id":"2022-L10-Q14","year":2022,"qnum":14,"jokbo_lec_no":10,"lecture":"다발성내분비질환","professor":"안창호","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다발성 내분비 종양 type 2 (multiple endocrine neoplasia type 2)의 원인 유전자는?","stem_table":null,"options":["MENIN","RET","RB1","EGFR","MYC"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q14","reparsed":true},{"id":"2022-L10-Q62","year":2022,"qnum":62,"jokbo_lec_no":10,"lecture":"다발성내분비질환","professor":"안창호","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다음 중 각 다발성 내분비 종양에서 발생할 수 있는 종양에 대해서 이를 선별하는 검사가 알맞게 짝지어진 것은?","stem_table":null,"options":["Parathyroid hormone – free T4, TSH","Pheochromocytoma – plasma or 24 hour urine metanephrine","Pituitary adenoma – LH, FSH, estradiol or testosterone","Medullary thyroid carcinoma – PTH, neck SONO","Insulinoma – glucose, gastrin"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q62"},{"id":"2022-L10-Q114","year":2022,"qnum":114,"jokbo_lec_no":10,"lecture":"다발성내분비질환","professor":"안창호","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"48세 남자가 반복적인 요로 결석으로 비뇨기과 내원 후 내분비대사내과로 의뢰되었다. 검사 결과는 다음과 같았다. 이 환자에서 다음 단계에서 시행할 조치로 가장 적절한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈중 칼슘/인 | 10.8/2.0 mg/dL | - |\n| 혈중 요소질소/크레아티닌 | 14/0.9 mg/dL | - |\n| 부갑상선호르몬 | 124 pg/mL | 10-65 |\n| 25-hydroxyvitamin D | 23.8 ng/mL | - |\n| 갑상선 초음파와 복부 CT | 양측 부갑상선 종양과 췌장의 종양이 각각 관찰됨 | - |","options":["갑상선기능검사","비스포스포네이트 투여","일측 부갑상선 절제술","뇌하수체 호르몬 검사와 sellar MRI","RET 유전자 검사"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q114","reparsed":true},{"id":"2022-L10-Q122","year":2022,"qnum":122,"jokbo_lec_no":10,"lecture":"다발성내분비질환","professor":"안창호","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다발성 내분비 종양 type 1 (multiple endocrine neoplasia type 1)에서 가장 높은 빈도로 발생하는 종양은?","stem_table":null,"options":["Pituitary adenoma","Pancreatic islet cell tumor","Pheochromocytoma","Adrenal adenoma","Parathyroid adenoma"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q122","reparsed":true},{"id":"2022-L11-Q33","year":2022,"qnum":33,"jokbo_lec_no":11,"lecture":"소아 뇌하수체 부신 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"8세 남아가 키가 잘 자라지 않아서 병원에 왔다. 임신나이 40주, 출생체중 4,100g으로 주산기적 문제 없이 출생하였고, 운동, 언어발달은 정상이었다. 현재 키 121cm, 체중 28kg이었고 고환은 양쪽 모두 1cc로 만져졌고 음모는 없었다. 아버지 키는 180cm, 어머니 키는 157cm로 초경을 초6 때 하였다.\n성장호르몬 자극 검사:\n성장곡선(그림):\n가장 적절한 설명은?","stem_table":"| 성장호르몬 (ng/mL) | 0분 | 30분 | 60분 | 90분 | 120분 |\n|--|--|--|--|--|--|\n| Clonidine 투여 전후 | 0.52 | 2.45 | 2.51 | 3.05 | 1.34 |\n| Arginine 투여 전후 | 1.22 | 0.32 | 2.43 | 0.22 | 1.43 |","options":["ADH","LH","ACTH","TSH","Growth hormone"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q33p89_c2d50b63.png","note":null,"id_simple":"2022-Q33"},{"id":"2022-L11-Q51","year":2022,"qnum":51,"jokbo_lec_no":11,"lecture":"소아 뇌하수체 부신 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"생후 20일 남아가 신생아 선별검사 호르몬 수치 상승으로 병원에 왔다. 임신나이 37주 2,600g으로 출생하였다. 모유 수유하면서 잘 지내며 3,000g까지 증가하였는데, 내원 1일 전부터 구토하면서 잘 먹지 못해 2,800g으로 체중이 감소하였다. 구강점막은 말라있었고, 구강 점막, 유두, 음낭의 피부 착색이 확인되었다. 고환은 3cc로 양쪽에서 만져졌고 음경 크기는 정상이었다.\n- Glucose 45mg/dL\n- Na 129mmol/L – K 7.5 mmol/L – Cl 96 mmol/L\n- BUN 51 mg/dL, Creatinine 1.3 mg/dL\n- 17-OH-progesterone 725 ng/mL\n- ACTH 326 pg/mL\n- Plasma renin activity 24.7 ng/mL/hr\n- Cortisol 1.8 ng/dL\n적절한 설명은?","stem_table":null,"options":["포도당 생리식염수 수액 및 하이드로코티손 경구 투여를 즉시 시작한다.","염색체 검사를 시행한다.","하이드로코티손, 플루드로코티손, NaCl을 지속적으로 투여한다.","장기적으로 질병이 조절되지 않으면 안드로젠 과잉으로 인한 불임 위험이 있다.","선천성 부신 저형성증에 대한 유전자 검사를 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q51"},{"id":"2022-L11-Q97","year":2022,"qnum":97,"jokbo_lec_no":11,"lecture":"소아 뇌하수체 부신 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"5세 여아가 키가 작아서 병원에 왔다. 임신나이 40주, 출생체중 1,800g으로 출생하였고, 잘 먹지 못하여 신생아 중환자실에서 생후 3주 치료받고 퇴원 시 뇌 MRI 검사 결과 정상이었다. 이후 운동, 언어발달은 정상이었다. 현재 키 95cm, 체중 20kg이었고 아버지 키는 180cm, 어머니 키는 153cm로 초경을 중3 때 하였다. 가장 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 1.1 ng/dL | 0.8-2.0 |\n| 갑상선 자극호르몬 | 7.5 μIU/L | 0.5-6.5 |\n| 인슐린유사성장인자-1 | 190 ng/mL | - |\n| 염색체 검사 | 46.XX | - |\n\n성장호르몬 자극 검사:\n\n| 성장호르몬 (ng/mL) | 0분 | 30분 | 60분 | 90분 | 120분 |\n|---|---|---|---|---|---|\n| Clonidine 투여 전후 | 0.89 | 3.86 | 2.91 | 5.08 | 1.00 |\n| Arginine 투여 전후 | 1.93 | 0.48 | 2.59 | 0.49 | 1.55 |","options":["갑상선 기능 저하증으로 인한 성장장애이다.","인슐린유사성장인자-1 정상범위이므로 성장호르몬 자극검사를 다시 시행한다.","따라잡기 성장 못한 부당경량아로 성장호르몬 치료를 시작한다.","뇌 MRI 검사를 시행한다.","신생아가 뇌 MRI 정상이었으므로 성장호르몬 치료를 시작한다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q97p89_52fd5b88.png","note":null,"id_simple":"2022-Q97","reparsed":true},{"id":"2022-L11-Q107","year":2022,"qnum":107,"jokbo_lec_no":11,"lecture":"소아 뇌하수체 부신 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"37개월 남아가 병원에 왔다. 임신나이 32주에 출생체중 1,200g으로 출생하였다. 신생아 중환자실에서 뇌출혈 병력은 없었고, 갑상선 호르몬제 시작 당시 검사소견이다. 현재 37개월 키는 84 cm (3백분위수 미만), 체중은 15kg (50~75백분위수)이었고, 고환은 양쪽 모두 1cc로 만져졌고 음모는 없었고, 음경 크기는 적절하였다. 운동 및 언어 발달은 정상이었다. 아버지 키는 180 cm, 어머니 키는 152 cm로 초경을 중1 때 하였다. 가장 우선적인 조치는?","stem_table":"신생아기 갑상선 호르몬제 시작 당시:\n\n| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 0.6 ng/dL | 0.6-1.0 |\n| 갑상선 자극 호르몬 | 5.2 μIU/L | 0.5-6.5 |\n| 코티솔 | 16 μg/dL | 10-18 |\n| 갑상선 초음파 | 갑상선이 제 위치에 적절한 크기로 보임 | - |","options":["갑상선 호르몬제 중단 시도","성장호르몬 자극검사","부당경량아 성장호르몬 치료 시작","뇌 MRI 검사","선천성 갑상선저하증 유전자 패널 검사"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q107","reparsed":true},{"id":"2022-L12-Q30","year":2022,"qnum":30,"jokbo_lec_no":12,"lecture":"뇌하수체, 부신의 영상","professor":"최승홍/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"다음은 정상인의 T1 강조영상이다. 화살표가 가리키는 구조물과 관련이 있는 호르몬은?","stem_table":null,"options":["ADH","LH","ACTH","TSH","Growth hormone"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q30T1MRIp90_c15e6625.png","note":null,"id_simple":"2022-Q30"},{"id":"2022-L12-Q40","year":2022,"qnum":40,"jokbo_lec_no":12,"lecture":"뇌하수체, 부신의 영상","professor":"최승홍/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"비 조영증강 복부 CT이다. 가장 가능성이 높은 진단은?","stem_table":null,"options":["Adrenal adenoma","Adrenal metastasis","Adrenal calcification","Adrenal pheochromocytoma","Adrenal cortical carcinoma"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q40CTp90_47b87af5.png","note":null,"id_simple":"2022-Q40"},{"id":"2022-L13-Q35","year":2022,"qnum":35,"jokbo_lec_no":13,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양의 핵의학 진단에 사용하지 않는 핵의학 검사는?","stem_table":null,"options":["I-123 MIBG 스캔","F-18 FDOPA PET/CT","F-18 FDG PET/CT","Ga-68 PSMA PET/CT","Ga-68 DOTATOC PET/CT"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q35"},{"id":"2022-L13-Q67","year":2022,"qnum":67,"jokbo_lec_no":13,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양 핵의학 영상검사의 원리에 해당하는 분자 표적은?","stem_table":null,"options":["norepinephrine transporter","sodium iodide symporter","dopamine transporter","dopamine receptor","deiodinase"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q67"},{"id":"2022-L13-Q121","year":2022,"qnum":121,"jokbo_lec_no":13,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"양측 부신 종괴로 방문한 39세 남자의 혈액/소변 검사 결과와 CT 검사결과이다. 진단을 위해 다음으로 고려해야 하는 검사를 1개 고르시오.","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 24시간 소변 VMA | 32 mg/day | 0-8 |\n| 24시간 소변 metanephrine | 6224 μg/day | 0-400 |\n| 24시간 소변 normetanephrine | 3972 μg/day | 0-800 |\n| 24시간 소변 epinephrine | 571 μg/day | 0-27 |\n| 24시간 소변 norepinephrine | 624 μg/day | - |\n| 24시간 소변 dopamine | 184 μg/day | - |\n| Aldosterone | 12 ng/dL | 5-41 |\n| 1mg overnight dexamethasone suppression test | cortisol 1.2 μg/dL | - |","options":["ACTH 측정","Adrenal vein sampling","Fine needle aspiration","68Ga-DOTATE PET","High dose dexamethasone suppression test"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q121CTp91_0dd472cf.png","note":null,"id_simple":"2022-Q121","reparsed":true},{"id":"2022-L13-Q112","year":2022,"qnum":112,"jokbo_lec_no":13,"lecture":"부신, 내분비 종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"갈색세포종 환자에서 촬영한 I-123 MIBG 스캔과 Ga-68 DOTATOC PET/CT 영상이다. 이 환자에 적절한 핵의학 치료는?","stem_table":null,"options":["I-123 MIBG 치료","I-131 MIBG 치료","I-131 치료","Ga-68 DOTATOC 치료","Lu-177 DOTATAE 치료"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q112_MIBG_DOTATOC_p91.png","note":null,"id_simple":"2022-Q112"},{"id":"2022-L14-Q13","year":2022,"qnum":13,"jokbo_lec_no":14,"lecture":"뇌하수체, 부신, 다발성 내분비질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"45세 남자 환자가 발작적인 심계항진과 두통, 발한을 주소로 방문하였다. 환자는 고혈압이 있었으며 변동이 심하였다. 복부 전산화 단층 촬영 소견상 부신에 크기 4x3 cm의 종괴가 발견되었다. 이 병변에 대한 보기 중 가장 적합한 내용은?","stem_table":null,"options":["뇌하수체 선종의 호르몬 분비에 의한 자극이 주요 원인 중 하나이다.","종양의 크기 및 현미경적 소견상 악성의 가능성은 없다.","24시간 소변에서 cortisol 검출이 특징적이다.","Enterochromaffin 세포들이 serotonin을 주로 분비하게 된다.","RET, VHL, NF1, SDH 등이 원인 유전자들로 밝혀지고 있다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q13p91_a5ac2a16.png","note":null,"id_simple":"2022-Q13"},{"id":"2022-L14-Q32","year":2022,"qnum":32,"jokbo_lec_no":14,"lecture":"뇌하수체, 부신, 다발성 내분비질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"다음은 46세 여자환자의 부신종양의 현미경 소견이다. 이 질환에 대한 설명으로 옳지 않은 것은?","stem_table":null,"options":["절제된 종양을 potassium dichromate solution (i.e Zenker solution)에 고정하면 dark brown 색으로 변한다. 이것을 chromaffin reaction이라고 한다.","종양세포들은 작은 nests나 alveoli로 나뉘고 이를 zellballen pattern이라고 부른다.","종양을 이루는 세포들을 sustentacular cell이라고 한다.","Epinephrine 혹은 norepinephrine을 분비하여 고혈압을 유발한다.","세포 핵의 이형성(pleomorphism)과 높은 mitotic count는 양성종양에서도 나올 수 있다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q321p91_de4b47bf.png","note":null,"id_simple":"2022-Q32"},{"id":"2022-L15-Q95","year":2022,"qnum":95,"jokbo_lec_no":15,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"갑상선 호르몬 합성, 운반 대사 과정에 대한 설명으로 옳은 것은?","stem_table":null,"options":["셀레늄은 갑상선호르몬 합성의 기본 물질로 갑상선호르몬 분자량의 65%를 차지한다.","요오드는 혈액으로부터 갑상선세포 안으로 NIS(sodium iodide symporter)를 통해 능동적으로 운반된다.","TPO (thyroperoxidase)에 의해 갑상선호르몬이 갑상선세포 밖으로 방출된다.","갑상선호르몬은 수용성으로 대부분 결합단백 없이 유리호르몬(free hormone)의 형태로 운반된다.","갑상선호르몬은 세포막에 존재하는 갑상선호르몬 수용체와 결합하여 작용한다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q95"},{"id":"2022-L15-Q49","year":2022,"qnum":49,"jokbo_lec_no":15,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"30세 여자의 혈액검사 결과가 다음과 같았다.\n- TSH 1.5 (참고치 0.4-5.0 uIU/mL)\n- Free T4 1.0 (참고치 0.7-1.8 ng/dL)\n- Total T3 300 (참고치 81-196 ng/dL)\n아래 보기 중 어떤 상황일 가능성이 높은가?","stem_table":null,"options":["3개월 전부터 금식을 통한 다이어트 중","1개월 전 피부 문제로 스테로이드 복용 중","임신 중","말단 비대증 환자","만성 신부전"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q49"},{"id":"2022-L16-Q28","year":2022,"qnum":28,"jokbo_lec_no":16,"lecture":"갑상선기능저하증, 갑상선염","professor":"조선욱","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"32세 여자가 목이 붓고 아파서 왔다. 6개월 전 첫 아이를 출산하였다. 1-2개월 전 몸살 증상이 있다가 1개월 전 목이 붓고 아파서 인근 병원에서 검사 시행 후(초음파1) 2주 정도 소염진통제를 복용하였다. 당시 갑상선기능은 정상이었다. 이후 통증은 호전되었으나 투약 중단 후 다시 아프고 목이 더 부어서(초음파2) 의뢰되었다. 우측 목에 단단하고 누르면 통증이 있는 종괴가 만져졌다. 검사결과이다(혈액). 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| T3 | 230 ng/dL | 87-184 |\n| Free T4 | 2.1 ng/dL | 0.7-1.81 |\n| TSH | 0.01 mIU/L | 0.4-4.1 |\n| ESR | 95 mm/hr | 0-20 |","options":["갑상선암","급성 갑상선염","리엘 갑상선염","산후 갑상선염","아급성 갑상선염"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q28p93_9fcf0e42.png","note":null,"id_simple":"2022-Q28","reparsed":true},{"id":"2022-L16-Q20","year":2022,"qnum":20,"jokbo_lec_no":16,"lecture":"갑상선기능저하증, 갑상선염","professor":"조선욱","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"50세 여자가 혈액검사(갑상선기능검사) 결과가 다음과 같았다.\n- TSH 0.3 (참고치 0.4-5.0 uIU/mL)\n- Free T4 0.6 (참고치 0.7-1.8 ng/dL)\n아래 보기 중 어떤 상황일 가능성이 높은가?","stem_table":null,"options":["하시모토 갑상선염에 의한 갑상선기능저하증","뇌하수체 종양을 수술한 이후","조영제를 사용한 CT 검사 이후","TSH를 분비하는 뇌하수체 종양","그레이브스병에 의한 갑상선기능항진증"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q20"},{"id":"2022-L16-Q119","year":2022,"qnum":119,"jokbo_lec_no":16,"lecture":"갑상선기능저하증, 갑상선염","professor":"조선욱","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"70세 남자 환자 (172cm, 70kg)가 피로와 부종을 주소로 내원하였다. 환자는 3년전, 허혈성 심질환으로 관상동맥 스텐트 시술을 한 병력이 있으며 이후 항혈전제를 비롯한 약물 치료를 지속하고 있었다. 내원 1년전에는 부정맥이 발생하여 amiodarone 100 mg을 매일 투여하기 시작했다. 환자의 혈액 검사 결과는 아래와 같다.\n- BP 110.80 mmHg, HR 58/min, 36.6°C\n- TSH 23 (0.4-4.1 uUI/mL), Free T4 0.6 (0.7-1.8 ng/dL)\n환자의 병력에서 발병의 원인으로 가장 적합한 것은?","stem_table":null,"options":["허혈성 심질환","amiodarone의 투여","항혈전제의 투여","관상동맥 스텐트 시술","항혈전제의 사용"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q119"},{"id":"2022-L16-Q41","year":2022,"qnum":41,"jokbo_lec_no":16,"lecture":"갑상선기능저하증, 갑상선염","professor":"조선욱","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"34세 여자가 전신성 홍반루프스로 입원하여 면역억제제와 스테로이드 치료 중이다. CT 검사에서 갑상선의 전반적인 비대와 우측 갑상선에 갑상선결절이 발견되었다. 혈액검사 결과이다. 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| T3 | 54 ng/dL | 87-184 |\n| Free T4 | 1.1 ng/dL | 0.7-1.81 |\n| TSH | 0.3 mIU/L | 0.4-4.1 |","options":["비갑상선질환","갑상선 중독성 결절","무증상 갑상선기능항진증","무증상 갑상선기능저하증","중추성 갑상선기능저하증"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q41","reparsed":true},{"id":"2022-L16-Q87","year":2022,"qnum":87,"jokbo_lec_no":16,"lecture":"갑상선기능저하증, 갑상선염","professor":"조선욱","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"53세 여자가 피로감이 심하여 내원하였다. 검사 결과이다.\n- Free T4 2.3 ng/dL (0.7-1.8","stem_table":null,"options":["비갑상선질환","뇌하수체기능항진증","FSH 생성 뇌하수체종양","무증상 갑상선기능항진증","갑상선호르몬저항성증후군"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q87"},{"id":"2022-L17-Q27","year":2022,"qnum":27,"jokbo_lec_no":17,"lecture":"갑상선기능항진증","professor":"문재훈","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"37세 여자 환자가 2개월 전부터 지속된 가슴 두근거림을 주소로 내원하였다. 가슴 두근거림 외에 2개월 간 4kg의 체중 감소와 손 떨림도 동반되었다. 갑상선 검사 결과와 갑상선 스캔 결과이다. 적절한 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| T3 | 350 ng/dL | 87-184 |\n| free T4 | 2.5 ng/dL | 0.8-1.7 |\n| TSH | < 0.05 μIU/mL | 0.4-4.0 |\n| Anti-TSH receptor Ab | 2.0 IU/L | 1.8-6.0 |\n| Microsome Ab | 100 U/mL | <60 |","options":["그레이브스병","하시모토 갑상선염","중독성 산증","아급성 갑상선염","TSH 분비 뇌하수체 선종"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q27p93_199f6935.png","note":null,"id_simple":"2022-Q27","reparsed":true},{"id":"2022-L17-Q50","year":2022,"qnum":50,"jokbo_lec_no":17,"lecture":"갑상선기능항진증","professor":"문재훈","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"49세 남자가 심한 피로감과 전신 쇠약, 심계항진, 식욕증가, 2개월간 6kg의 체중감소를 주소로 내원하였다. 한달 전부터 가끔씩 복시가 발생하다가 최근 심해졌다고 한다. 신체 검진에서 혈압 130/80 mmHg로 정상이었으나, 맥박은 불규칙하고 분당 105회였다. 진찰 소견에서 좌측 안구가 돌출되어 있었으며 외안근 마비 소견을 보였다. 갑상선은 미만성 종대를 보였다.\n이 환자의 진단 및 치료에 대한 설명 중 옳은 것은?","stem_table":null,"options":["이 환자의 진단을 위해서는 갑상선스캔이 반드시 필요하다.","방사성요오드 치료 후 안병증의 신속한 호전을 기대할 수 있다.","갑상선중독증상의 호전을 위해 베타차단제를 투여하면 안병증도 같이 호전된다.","향후 갑상선기능은 저절로 정상을 회복할 것이므로 안병증에 대한 치료만 필요하다.","항갑상선제로 치료할 수 없는 경우라면 방사선요오드 치료보다는 수술이 더 적합하다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q50p93_5c13daf7.png","note":null,"id_simple":"2022-Q50"},{"id":"2022-L17-Q57","year":2022,"qnum":57,"jokbo_lec_no":17,"lecture":"갑상선기능항진증","professor":"문재훈","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"30세 24주 임산부가 약물로 조절되지 않는 갑상선 기능 항진증으로 내원하였다. 환자는 체중감소 및 빈맥의 소견을 보이고 있으며 심한 안구병증이 동반되었다. 갑상선 기능 검사결과이다. 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| T3 | 200 ng/dL | 87-184 |\n| Free T4 | 3.0 ng/dL | 0.70-1.80 |\n| TSH | 0.1 μIU/mL | 0.4-4.1 |","options":["항갑상선호르몬치료","레보티록신","갑상선 전절제","고주파 절제술","방사선 동위원소 치료"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q57","reparsed":true},{"id":"2022-L17-Q113","year":2022,"qnum":113,"jokbo_lec_no":17,"lecture":"갑상선기능항진증","professor":"문재훈","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"36세 여자 환자가 3개월간 5 kg의 체중감소, 심계 항진, 발한 및 손 떨림이 있어 내원하였다. 최근 1개월간은 묽은 변이 지속되었다고 한다. 갑상선기능검사 상 fT4 3.12 ng/dL (0.7~1.7 ng/dL), TSH <0.01 mIU/L (0.5~4.5 mIU/L)이었고 갑상선스캔 소견은 다음과 같았다.\n이 환자의 원인 질환으로 가장 가능성이 높은 질환은?","stem_table":null,"options":["그레이브스병","무통성갑상선염","아급성갑상선염","산후갑상선염","갑상선호르몬에 대한 뇌하수체 내성"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q113p94_d9a67555.png","note":null,"id_simple":"2022-Q113"},{"id":"2022-L18-Q58","year":2022,"qnum":58,"jokbo_lec_no":18,"lecture":"갑상선 결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"46세 여자가 우연히 목에 혹이 만져져 내원하였다. 신체검진 및 갑상선 기능 검사 결과는 다음과 같았다.\n- FT4: 1.76 ng/dL (0.85-1.86)\n- TSH: 0.2 uU/mL (0.4-4.1)\n\n감별 진단을 위해 가장 먼저 시행해야 하는 검사는?","stem_table":null,"options":["갑상선 도플러검사 (Doppler)","갑상선 미세침흡인세포검사 (FNAC)","갑상선 침생검(core needle biopsy)","T3 억제 갑상선스캔","99m Tc 갑상선스캔"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q58CTp94_0cd88f30.png","note":null,"id_simple":"2022-Q58","reparsed":true},{"id":"2022-L18-Q82","year":2022,"qnum":82,"jokbo_lec_no":18,"lecture":"갑상선 결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"41세 남자가 A)와 같은 소견으로 동네 병원에서 혈액검사 시행 결과 다음과 같았다.\n- TSH 0.17 (0.4-4.05 uIU/mL)\n- FT4 1.42 (0.8-1.9 ng/dL)\n기능성 결절 여부를 확인하기 위해 갑상선스캔을 시행하여 B)와 같은 결과를 얻었다.\n이 환자에서 결절의 진단을 위해 다음 단계로 시행하여야 할 검사를 한가지 고르시오.","stem_table":null,"options":["항 TPO 항체","TRH 자극 검사","Ultrasonography","T3 억제 갑상선스캔","방사성요오드 섭취율"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q82Bp94_2b7cefc5.png","note":null,"id_simple":"2022-Q82"},{"id":"2022-L18-Q11","year":2022,"qnum":11,"jokbo_lec_no":18,"lecture":"갑상선 결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"55세 남자 환자가 목의 종물이 커져서 내원하였다. 환자는 연하곤란, 호흡곤란이 있었으며 세침흡인검사상 양성으로 진단되었다. 갑상선 기능 검사 결과 및 영상 소견이다. 치료는?\n- T3 118 ng/dL(87-184)\n- Free T4 0.84ng/dL(0.70-1.80)\n- TSH 0.58uIU/mL(0.4-4.1)","stem_table":null,"options":["항갑상선호르몬치료","갑상선절제","6개월 뒤 세침흡인검사 재시행","고주파 절제술","방사선 동위원소 치료"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q11","reparsed":true},{"id":"2022-L19-Q5","year":2022,"qnum":5,"jokbo_lec_no":19,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"최근 갑상선암의 급격한 증가를 설명하는 것 중 옳은 것은?","stem_table":null,"options":["갑상선유두암의 급격한 증가가 원인이다.","초음파에 의한 발견이 주 원인이기는 하나 전반적인 암의 크기는 증가하였다.","갑상선암 전체에서 차지하는 비율은 적지만 미분화갑상선암도 증가하고 있다.","갑상선암 자체의 증가는 없거나 오히려 적다.","성인에서는 증가, 소아에서는 감소하는 추세이다."],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q5"},{"id":"2022-L19-Q8","year":2022,"qnum":8,"jokbo_lec_no":19,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선암으로 수술 후 방사성요오드(I-131)을 이용한 잔여갑상선 제거를 시행하였으나 혈청 티로글로불린(thyroglobulin)이 증가되어 시행한 F-18 FDG PET이다. 다음으로 해야 할 조치는?","stem_table":null,"options":["I-131을 투여하여 반복 치료한다.","경부림프절 전이를 수술로 제거한다.","혈청 티로글로불린을 다시 측정한다.","F-18 FDG를 고용량 투여 치료한다.","I-131 전신 스캔으로 추적 관찰한다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q8_WBS_FDG_p95.png","note":null,"id_simple":"2022-Q8","reparsed":true},{"id":"2022-L19-Q90","year":2022,"qnum":90,"jokbo_lec_no":19,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"72세 여자 환자가 갑상선 미세유두암을 진단 받고 내원하였다. 환자는 건강 검진에서 시행한 갑상선 초음파에서 정경이 0.7cm인 결절을 진단받았고(사진1), 이후 시행한 초음파 유도하 미세침 흡인 세포검사 결과 갑상선 미세 유두암(사진2)으로 진단되었다. 경부 신체 검진에서 만져지는 림프절은 없었고, 갑상선 초음파 소견상 갑상선 내부의 국소 단일 병변 외에 경부에 특이 소견 없었다. 환자는 내원 2년 전 협심증으로 관상동맥 스텐트 삽입술을 2회 시행하였으며, 내원 6개월 전 심방 세동과 뇌졸중의 병력이 있어 현재 항응고제를 사용하고 있다.\n\n환자가 수술적 치료를 원치 않는 경우 다음으로 선택할 수 있는 가장 적절한 치료법은?","stem_table":null,"options":["메탄올 주입술","적극적 경과 관찰","체외방사선치료","방사성 동위원소 치료","T4 억제 요법"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q90p95_56bc3f0e.png","note":null,"id_simple":"2022-Q90","reparsed":true},{"id":"2022-L19-Q37","year":2022,"qnum":37,"jokbo_lec_no":19,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선수질암에 대한 설명으로 가장 적절한 것은?","stem_table":null,"options":["90% 이상이 multiple endocrine neoplasia의 일환으로 발생한다.","가족성수질암의 경우 암유전자 돌연변이가 발견된 가족은 정기적인 초음파 검사보다는 대부분 예방적 갑상선절제술을 시행한다.","일반적으로 선행화학요법(neoadjuvant chemotherapy)이 필요하다.","RET 돌연변이가 있는 경우 유전자치료의 좋은 대상으로 잘 치료가 된다.","가장 흔한 전이 부위는 부신이다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q37"},{"id":"2022-L19-Q110","year":2022,"qnum":110,"jokbo_lec_no":19,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"8년 전 좌측 갑상선에 발생한 2.5cm의 갑상선 유두암에 대해 갑상선전절제술을 시행하였다. 당시 10개의 림프절 중 6개에서 유두암의 침범이 발견되어 I-131 50mCi의 방사성요오드로 치료를 받았고, 이후 시행한 전신스캔에서는 이상이 없었고, 당시 thyroglobulin은 0.5 ng/mL이었다. 이후 지방에 거주하는 관계로 외부병원에 다녔는데, 최근 갑상선호르몬을 사용하던 중에도 thyroglobulin이 증가하여 그 병원에서 경부초음파 검사 및 1-123 방사성요오드를 사용한 전신스캔을 시행하였다. 경부초음파 검사와 전신스캔에서는 이상이 없었으며, 당시 thyroglobulin은 46 ng/mL로 증가되어 있었다. 재발인지 확인하기 위해 다음 단계로 시행해야 할 가장 적절한 영상검사는?","stem_table":null,"options":["1-123 대신 1-131을 이용한 전신스캔을 시행한다.","뼈에 대한 MRI 검사를 시행한다.","Brain CT를 시행한다.","전신 PET-CT를 시행한다.","경부 CT를 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q110"},{"id":"2022-L20-Q6","year":2022,"qnum":6,"jokbo_lec_no":20,"lecture":"갑상선암의 수술적 치료","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"41세 여자환자가 건강검진에서 시행한 갑상선 초음파에서 갑상선 결절이 발견되어 내원하였다. 갑상선 결절은 장경의 길이가 2.5cm였다. 미세침흡인 세포검사를 시행하였고 결과는 아래와 같다. 가장 적절한 치료법은?\n- Pathologic report: Malignant, papillary thyroid carcinoma, Bethesda VI","stem_table":null,"options":["갑상선 절제술","적극적 감시","갑상선 호르몬제 복용을 통한 TSH 억제","고주파절제술","에탄올 주입술"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q6"},{"id":"2022-L20-Q120","year":2022,"qnum":120,"jokbo_lec_no":20,"lecture":"갑상선암의 수술적 치료","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"30세 여자가 만져지는 경부 종괴로 병원에 왔다. 특별한 과거력이나 복용 중인 약물은 없었다. 경부 압박감 및 경부 통증은 호소하지 않았다. 혈액검사 및 초음파 소견, 조직검사(core needle biopsy) 결과는 아래와 같다. 치료는?\n혈액검사:\n- Free T4 1.50 ng/dL (0.7-1.8)\n- TSH 2.50 μIU/L (0.4-5.0)\n초음파 소견: Lt. 2.1cm sized isoechoic nodule with macrocalcification\n미세침흡인세포검사: follicular neoplasm","stem_table":null,"options":["갑상선 스캔","혈청 Thyroglobulin 측정","미세침흡인세포검사(FNAC) 재검","갑상선 전절제술","갑상선 엽절제술"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q120"},{"id":"2022-L21-Q79","year":2022,"qnum":79,"jokbo_lec_no":21,"lecture":"갑상선 결절의 수술 병리 및 분자병리","professor":"원재경","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"70세 남자 환자가 전경부 (anterior neck) 종괴와 목소리가 쉬는 것을 주소로 내원하였다. 환자는 20년 전부터 목에 작은 종괴가 있었으나 최근 갑자기 커졌다고 하였다. 초음파 검사 상 갑상선에서 기원한 것으로 보이는 크기 7 x 5 cm의 커다란 종괴가 갑상선 주변 조직으로 침윤하는 것이 관찰되었다. 수술 검체에서 환자의 종괴는 다음과 같은 조직학적 소견을 보였다. 이 질환에 대한 설명으로 옳은 것은?","stem_table":null,"options":["이 질환의 발생에 p53 mutation이 중요한 역할을 한다.","크기는 커도 갑상선암이므로 90% 이상의 10년 생존율을 보인다.","역분화암으로 유전자의 변이는 갑상선 유두암보다 적다.","TERT promoter 변이는 이 질환의 발생에는 관계가 없다.","면역조직화학염색이나 전자현미경 검사에서 상피세포로의 분화의 증거를 전혀 찾을 수 없다."],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q79p96_58189730.png","note":null,"id_simple":"2022-Q79"},{"id":"2022-L22-Q9","year":2022,"qnum":9,"jokbo_lec_no":22,"lecture":"소아 갑상선 질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"생후 20일 여아가 황달로 병원에 왔다. 생후 30개월 오빠가 선천성 갑상선 저하증으로 약물치료 중이다. 신생아 선별검사에서 갑상선자극호르몬 수치가 약간 높다고 들었다. 아이의 대변 색깔은 황색이다.\n- 총 빌리루빈 15mg/dL\n- 유리 T4 0.83 ng/dL (참고치 0.8-2.0)\n- 갑상선 자극호르몬 45μIU/L (참고치 0.5-6.5)\n- 갑상선 초음파: 갑상선이 제 위치에 적절한 크기로 보임\n- 갑상선 스캔: 그림 참조\n\n가능한 진단은?","stem_table":null,"options":["갑상선 호르몬 저항성","모체의 TSH receptor blocking antibody","갑상선 호르몬 합성장애","시상하부-뇌하수체 이상","티록신 결합 단백 결핍"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q9p96_a8e579f9.png","note":null,"id_simple":"2022-Q9","reparsed":true},{"id":"2022-L22-Q46","year":2022,"qnum":46,"jokbo_lec_no":22,"lecture":"소아 갑상선 질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"생후 2주 여아가 신생아선별검사상 갑상선자극호르몬 수치가 높아 의뢰되었다. 출생체중 3.5kg 제왕절개분만으로 출생하였다. 완전 모유수유 중이며 황달과 변비가 있었다. 혀는 두껍지 않고 특별한 피부변화는 없었으며 진찰상 근긴장도는 정상이었다. 어머니는 8년 전 그레이브스병으로 수술 받은 이후 갑상선호르몬제를 투약 중이며 임신 기간 중 갑상선 기능은 정상범위로 유지되었다.\n아이의 검사결과:\n- 총 빌리루빈 15mg/dL\n- 유리 T4 0.8ng/dL (참고치 0.8~2.0)\n- 갑상선 자극호르몬 130 µIU/L (참고치 0.5~6.5)\n- 갑상선 초음파: 갑상선이 제 위치에 보이지 않음\n- 골반 X-ray: 그림 참조\n\n우선적인 조치는?","stem_table":null,"options":["갑상선 스캔 검사","TSH receptor blocking antibody 검사","레보티록신 시작","티록신 결합 단백 검사","코티솔 검사"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q46","reparsed":true},{"id":"2022-L23-Q54","year":2022,"qnum":54,"jokbo_lec_no":23,"lecture":"갑상선세침흡인, 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 미세침흡인세포검사(fine needle aspiration cytology)에 대한 설명으로 옳은 것은?","stem_table":null,"options":["간단하고 정확한 검사이나 시간이 오래 걸리고 위험하므로 수술이 꼭 필요한 경우에만 시행한다.","갑상선의 경우 핵을 잘 관찰해야 하므로 주로 Papanicolau (PAP) 염색을 시행한다.","Adenomatous goiter의 경우는 양성으로 항상 세포가 적게 흡인되므로 세포가 많이 흡인된 경우는 종양을 의미한다.","Hashimoto's thyroiditis의 경우에는 colloid 배경에 작거나 위축된 갑상선 여포세포가 하나씩 떨어져서, 혹은 납작한 sheet의 형태로 나온다.","Papillary carcinoma의 경우에는 주로 여포모양으로 배열된 세포군집이 나오고, 세포의 핵은 finely dispered chromatin을 보인다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q54"},{"id":"2022-L23-Q105","year":2022,"qnum":105,"jokbo_lec_no":23,"lecture":"갑상선세침흡인, 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 미세침흡인세포검사 판독에 있어서 Bethesda system이 갖는 의의로 옳지 않은 것은?","stem_table":null,"options":["표준화된 용어와 분류체계를 도입하여, 임상의에게 보다 정확한 정보를 제공한다.","각 분류별 악성위험도 (risk of malignancy)를 제공하여 치료방침을 결정하는데 도움을 준다.","Atypia of undetermined significance (AUS)의 경우는 악성위험도가 30%에 달하므로 반드시 수술을 해야 한다.","2017 Bethesda system에서는 molecular testing을 도입하여, Category III 혹은 IV의 경우 시행하는 것이 환자 management의 한 방법으로 제시된다.","Cystic fluid only는 non-diagnostic or unsatisfactory 카테고리에 속한다."],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q105"},{"id":"2022-L23-Q117","year":2022,"qnum":117,"jokbo_lec_no":23,"lecture":"갑상선세침흡인, 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"다음의 병리소견 중 부갑상선 암종으로 진단할 수 있는 소견은?","stem_table":null,"options":["호르몬을 분비하지 않는 non-functioning 종양이다.","종양의 내부에 출혈과 섬유화가 심하고 유사분열이 50 high power field당 5개 이상 관찰된다.","종양세포 핵의 모양이 크고 이형성이 심한 bizarre nuclei가 관찰된다.","종양세포의 perineural invasion이 관찰된다.","종양이 주로 chief cell로 이루어져 있다."],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q117"},{"id":"2022-L24-Q1","year":2022,"qnum":1,"jokbo_lec_no":24,"lecture":"병리학실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"42세 여자환자가 초음파에서 발견된 갑상선 우엽의 종괴를 주소로 내원하여, 세침흡입검사 후 갑상선 우엽 절제술을 시행받았다. 다음은 절제된 갑상선 종괴의 현미경 사진이다. 이 질환에 대한 설명으로 옳은 것은? (실제 시험에서 첫 사진은 강의록 사진보다 저배율)","stem_table":null,"options":["피막(Capsule)의 유무가 진단에 중요하다.","세침흡인검사로 악성과 양성을 감별할 수 있다.","진단은 minimally invasive follicular carcinoma이다.","가장 흔한 유전자 이상은 RET/PTC rearrangement이다.","종양세포 핵의 crowding, overlapping을 보이며 nuclear groove가 잘 보인다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q1p97_bf042386.png","note":null,"id_simple":"2022-Q1"},{"id":"2022-L24-Q29","year":2022,"qnum":29,"jokbo_lec_no":24,"lecture":"병리학실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"40세 여자 환자가 2년 전 발견된 갑상선 결절을 주소로 방문하였다. 초음파 검사상 갑상선 우엽에 크기 1.5 x 1cm의 주변과 경계가 좋은 고형성 종괴가 관찰되었다. 환자는 세침흡인검사 후 갑상선 엽 절제술을 시행받았다. 절제되어 온 검체에 대한 병리소견은 아래 사진과 같다. 이 병변에 대한 보기 중 적합하지 않은 내용은?","stem_table":null,"options":["피막의 존재 여부가 진단에 중요하다.","가장 흔한 변이로 RAS, PAXB-PPARγ 유전자 변이가 있다.","피막과 혈관에 대한 침윤 여부가 진단에 중요하다.","TERT promoter 변이가 있으면 더 공격적인 성향을 보인다.","림프절 전이를 잘하기 때문에 주의가 필요하다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q29p97_7ebcf475.png","note":null,"id_simple":"2022-Q29"},{"id":"2022-L24-Q44","year":2022,"qnum":44,"jokbo_lec_no":24,"lecture":"병리학실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"83세 남자 환자가 목에서 종괴가 만져지고 목이 쉬는 것을 주소로 내원하여 초음파에서 발견된 갑상선 좌엽의 종괴에 대해 갑상선 절제술을 시행 받았다. 다음은 절제된 갑상선 종괴의 현미경 사진이다. 이 종양에 대한 설명으로 옳은 것은?","stem_table":null,"options":["환자가 목이 쉬는 것은 종양과는 무관한 증상이다.","빠르게 자라고 예후가 매우 나빠 median survival이 약 6개월이다.","면역조직화학 염색을 하면 calcitonin과 chromogranin에 양성을 보인다.","혈관을 침윤하기도 하고, amyloid의 침착을 동반한다.","종양에서 가장 흔하게 관찰되는 유전자 이상은 BRAF mutation이다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q44p98_a129da9b.png","note":null,"id_simple":"2022-Q44"},{"id":"2022-L24-Q55","year":2022,"qnum":55,"jokbo_lec_no":24,"lecture":"병리학실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"35세 여자 환자가 건강검진상 발견된 갑상선 결절을 주소로 방문하였다. 초음파 검사상 갑상선 우엽에 크기 2x1 cm의 주변과 경계가 좋지 않은 침윤성 종괴가 관찰되었다. 환자는 세침흡인검사 후 갑상선 전절제술을 시행받았다. 절제되어 온 검체에 대한 병리소견은 아래 사진과 같다. 이 병변에 대한 보기 설명 중 적합하지 않은 내용은?","stem_table":null,"options":["중요한 핵의 특징으로 nuclear groove, pseudoinclusion 등이 있다.","혈행성 전이를 잘해서 폐, 뼈 등으로 전이가 종종 일어난다.","독점적인 유전자 변이로 BRAF 유전자 변이가 있다.","갑상선 여포세포에서 기원한 종양의 하나이다.","아형에 따라 더 공격적인 경향을 띠는 아형이 있는데 tall cell variant, columnar cell variant 등이 있다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q55p98_42d37294.png","note":null,"id_simple":"2022-Q55"},{"id":"2022-L25-Q15","year":2022,"qnum":15,"jokbo_lec_no":25,"lecture":"무기질 대사의 생리와 질환의 개관","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"다음 중 조골세포에서 분비되는 당단백질로서 파골세포의 분화를 촉진시킬 수 있는 것은?","stem_table":null,"options":["Receptor activator of NF kappa B ligand","Receptor activator of NF kappa B","Osteoprotegerin","Interleukin-6","Parathyroid hormone"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q15"},{"id":"2022-L25-Q17","year":2022,"qnum":17,"jokbo_lec_no":25,"lecture":"무기질 대사의 생리와 질환의 개관","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"45세 여자가 갑상선 유두암으로 갑상선전절제술 및 중앙림프절절제술을 시행 받았다. 수술직후 손과 발이 저린 증상이 있었다. 혈압 120/80, 맥박 80, 호흡수 35 회, 체온 37.2°C이었다.\n- PTH 5 pg/mL (15-65 pg/mL)\n- Ca 8.0 mg/dL (8.8 – 10.5 mg/dL)\n- ionized Ca 0.75 mmol/L (1.05-1.35 mmol/L)\n처치는?","stem_table":null,"options":["Calcitonin 투여","생리식염수 투여","봉투를 이용한 재호흡","칼슘 및 활성형 비타민 D 투여","O2 7L/min face mask 투여"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q17"},{"id":"2022-L25-Q118","year":2022,"qnum":118,"jokbo_lec_no":25,"lecture":"무기질 대사의 생리와 질환의 개관","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"다음 중 뼈의 가장 많은 부분을 차지하고 있는 구성 요소는?","stem_table":null,"options":["Collagen type I","Osteoblast","Osteoclast","Hydroxyapatite","Glycoprotein"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q118"},{"id":"2022-L26-Q10","year":2022,"qnum":10,"jokbo_lec_no":26,"lecture":"부갑상선질환과 칼슘대사 이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"63세 남자가 1년 반 전부터 시작된 하지 위약 및 보행시 통증으로 내원하였다.\n- 혈중 칼슘/인 8.8(8.5-10.5)/1.1 (2.5-4.5)mg/dL\n- 요소질소/크레아티닌 15/0.8 mg/dL\n- 부갑상선호르몬 22 pg/mL(10-65)\n- 25(OH)D 30.5 ng/mL\n- 알칼리 인산분해효소 572 U/L (30-115)\n- 아스파르테이트 아미노전달효소/알라닌 아미노전달효소 19/32 U/L\n- 알부민 4.3g/dL\n\n저인산혈증 원인을 감별하기 위해 추가로 시행할 수 있는 검사는?","stem_table":null,"options":["PHEX 유전자 검사","혈중 골특이적 알칼리 분해효소","혈중 Type I collagen C-telopeptide","혈중 1, 25(OH)2D","혈중 PTHrP"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q10","reparsed":true},{"id":"2022-L26-Q42","year":2022,"qnum":42,"jokbo_lec_no":26,"lecture":"부갑상선질환과 칼슘대사 이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"36세 남자가 수개월 전부터 시작된 두통을 주소로 내원하였다. 직장 검진에서 알칼리 인산분해효소가 증가되어 있다고 들었다고 한다. 뇌 MRI 소견은 아래와 같다. 두통 외에 간헐적 요통과 양측 무릎의 관절통이 있었다.\n- 혈중 칼슘/인: 10.3/3.4 mg/dL\n- 혈중 요소질소/크레아티닌 23/0.9 mg/dL\n- 부갑상선호르몬 20 pg/mL (10-65)\n- 알칼리 인산분해효소 930 U/L(30-115)\n\n이 질환의 치료로 가장 효과적인 것은?","stem_table":null,"options":["Denosumab 60mg 주사 1회","Pamidronate 30mg 주사, 1개월마다 3회","Zoledronic acid 5mg 주사 1회","Risedronate 35mg/주 경구, 2개월","Alendronate 70mg/주 경구, 6개월"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q93MRIp99_200d8700.png","note":null,"id_simple":"2022-Q42","reparsed":true},{"id":"2022-L26-Q19","year":2022,"qnum":19,"jokbo_lec_no":26,"lecture":"부갑상선질환과 칼슘대사 이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"56세 남자가 외부에서 시행한 간기능검사의 이상 소견으로 왔다. 매일 소주 1병 이상의 만성 음주력이 있었다. 복통이나 설사는 없었으며 보행시 허리 통증이 있어 외부에서 시행한 흉추-요추 단순 X선 촬영에서 요추 1번 압박골절이 관찰되었다.\n- 혈중 칼슘 7.5 mg/dL (8.5-10.5)\n- 인 2.0 mg/dL (2.5-4.5)\n- 혈액요소질소 10 mg/dL, 혈중 크레아티닌 0.7 mg/dL\n- 총 단백질/알부민 5.9/3.8 g/dL\n- 알칼리 인산분해효소 800 U/L (30-115)\n- 아스파르테이트 아미노전달효소/알라닌 아미노전달효소 37/38 U/L\n- 25(OH)D < 4ng/mL\n\n다음 단계에 시행되어야 할 가장 적절한 검사와 치료는?","stem_table":null,"options":["혈중 1,25(OH)2D – 비스포스포네이트","부갑상선 초음파 – 부갑상선절제술","혈중 25(OH)D – 칼슘/비타민 D","복부 CT – 칼시트리올","PTHrP – 부갑상선호르몬"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q19","reparsed":true},{"id":"2022-L26-Q98","year":2022,"qnum":98,"jokbo_lec_no":26,"lecture":"부갑상선질환과 칼슘대사 이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"신부전으로 혈액투석을 10년간 받아오던 50세 남자가 심한 골통증이 지속되어 부갑상절제술을 시행하고 수술 후 3일 째 퇴원했다. 퇴원 직후 손이 뒤틀리는 증상이 나타났으며 퇴원 2일 때 간질성 발작을 일으켜 응급실로 내원했다. 조치는?","stem_table":null,"options":["근전도 검사","뇌 CT 촬영","항경련제 투여","정맥 칼슘 투여","근이완제 투여"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q98"},{"id":"2022-L26-Q106","year":2022,"qnum":106,"jokbo_lec_no":26,"lecture":"부갑상선질환과 칼슘대사 이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"83세 여자가 젊을 때부터 고칼슘혈증이 있었으며 반복적인 신장결석으로 인해 10년전 쇄석술을 시행 받았다.\n- 혈중 칼슘/인 11.8/2.0 mg/dL\n- 혈중 요소질소/크레아티닌 23/1.0 mg/dL\n- 부갑상선호르몬 284 pg/mL (10-65)\n- 알칼리 인산분해효소 (ALP) 101 U/L\n- 25-hydroxyvitamin D 32.7 ng/mL\n\n최소 침습적 부갑상선절제술 시행 2일 후 혈청 칼슘 8.0 mg/dL, 인 3.6 mg/dL, 부갑상선호르몬 <5 pg/mL, 알부민 4.0 g/dL으로 측정되었으며 저림이나 이상 감각 등 특이 증상은 없었다.\n\n가장 적절한 치료는?","stem_table":null,"options":["칼슘 경구 투여","부갑상선호르몬 투여","칼슘 정맥 투여","칼시트리올 투여","마그네슘 투여"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q106XRp101_f9145e37.png","note":null,"id_simple":"2022-Q106","reparsed":true},{"id":"2022-L27-Q2","year":2022,"qnum":2,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"이전에 건강하던 29세 남자 환자가 상하지 근육통과 우측 고관절 통증을 주소로 내원하였다. 단순 엑스레이 검사에서 좌측 대퇴골 골두의 스트레스 골절과 치골의 골절이 의심되었다.\n- 혈중 칼슘/인 9.1(8.5-10.5)/1.2 (2.5-4.5)mg/dL\n- 혈액요소질소/크레아티닌 15/0.8 mg/dL\n- 부갑상선호르몬 48 pg/mL(10-65)\n- 25(OH)D 24.0 ng/mL\n- 알칼리 인산분해효소 241 U/L(30-115)\n- 아스파르테이트 아미노전달효소/알라닌 아미노전달효소 34/38 U/L\n- 알부민 4.2 g/dL\n- 24시간 요 인산 0.6 g, 24시간 요크레아티닌 1.0 g\n\n이 환자의 TRP(tubular reabsorption of phosphate)에 가장 가까운 것은?","stem_table":null,"options":["50%","55%","60%","65%","70%"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q2","reparsed":true},{"id":"2022-L27-Q93","year":2022,"qnum":93,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"알코올 간경변을 앓고 있는 56세 남자 환자가 허리 통증이 있어 시행한 단순 척추 영상에서 다발성 골절이 발견되어 내원하였다.\n- 혈중 칼슘 7.6 mg/dL (8.5-10.5)\n- 인 2.0 mg/dL (2.5-4.5)\n- 혈액요소질소 14 mg/dL, 혈중 크레아티닌 0.8 mg/dL\n- 부갑상선호르몬 275 pg/mL (10-65)\n- 총 단백질/알부민 6.0/3.7 g/dL\n- 알칼리 인산분해효소 854 U/L (30-115)\n- 아스파르테이트 아미노전달효소/알라닌 아미노전달효소 45/54 U/L\n- 혈압 150/86 mmHg\n- 혈중 칼슘/인 9.1 (8.5-10.5)/3.5 (2.5-4.5)mg/dL\n\n다음 단계에 시행되어야 할 가장 적절한 검사와 치료는?","stem_table":null,"options":["혈중 C-telopeptide 및 bone alkaline phosphatase 측정","Calcium, vitamin D 투약","폐경 후 골다공증에 준하여 bisphosphonate 투여","여성 호르몬제 투여","이차성 골다공증에 대한 검사 시행"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q93CTp99_4e55fc5b.png","note":null,"id_simple":"2022-Q93","reparsed":true},{"id":"2022-L27-Q66","year":2022,"qnum":66,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"다음 중 WHO Fracture Risk Assessment Tool (FRAX)에서 골절 위험도를 평가할 때 반드시 포함되는 항목은?","stem_table":null,"options":["요추 골밀도","글루코코티코이드 누적 용량","여자의 경우 폐경 여부","류마티스 관절염 병력","혈중 골표지자"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q66"},{"id":"2022-L27-Q68","year":2022,"qnum":68,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"69세 여자가 최근 polymyalgia rheumatica로 진단받고 첫 주에 Prednisolone 30mg를 시작하였고 이후 증상 호전으로 2주마다 10%씩 감량 중에 있었다. 향후 3개월 이상의 치료가 필요할 것으로 들었다. 이 환자의 골 건강에 대한 관리 중 올바른 설명은?","stem_table":null,"options":["칼슘과 비타민 D를 투여한다.","현재 골밀도 검사에서 골다공증이 아니면 치료가 필요 없다.","골절 위험도 평가가 필요하다.","앞으로 3개월 간 Prednisolone 치료 후에 골밀도 검사를 시행한다.","Prednisolone의 용량보다 투여 기간이 중요하다."],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q68"},{"id":"2022-L27-Q34","year":2022,"qnum":34,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"편평상피세포 폐암으로 치료 중인 68세 여자가 의식 혼탁과 탈수로 왔다. 검사 결과는 다음과 같았다.\n- 혈중 칼슘/인 17.8/1.9 mg/dL\n- 혈중 요소질소/크레아티닌 58/1.1 mg/dL\n- 부갑상선호르몬 < 2 pg/mL (10-65)\n- 부갑상선호르몬 관련 단백(PTHrP) 8.9 pmol/L (<1.3)\n- 25-hydroxyvitamin D 22 ng/mL\n\n하루 4L의 생리 식염수 주사와 푸로세마이드(furosemide) 투여 후 다음날 시행한 혈중 칼슘/인은 15.8/2.2 mg/dL였다. 환자는 지속적으로 섬망(delirium) 증상을 보였다.\n\n이 환자의 치료로 가장 적절한 것은?","stem_table":null,"options":["생리 식염수 투여 속도 증가 및 푸로세마이드 투여","생리 식염수 투여 속도 증가 및 티아지드 (thiazide) 투여","졸레드론산 (zoledronic acid) 투여","글루코코티코이드 (glucocorticoid)","칼시토닌 (calcitonin) 투여"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q34","reparsed":true},{"id":"2022-L27-Q89","year":2022,"qnum":89,"jokbo_lec_no":27,"lecture":"골의 구조와 대사, 대사성골질환","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"68세 여자가 건강검진상 골감소증 소견이 발견되어 내원하였다. 환자는 4년 전 유방암 수술 후 aromatase inhibitor를 투여받고 있었으며 약물 복용으로 인한 속쓰림으로 proton pump inhibitor를 병용하고 있었다. 3년 전 왼쪽 손목 골절 병력이 있고 환자의 친정 어머니는 고관절 골절을 경험하여 관절 치환술을 시행받았다. 환자는 키 156cm, 체중 62kg이었으며 혈압은 수축기/이완기 128/78 mmHg이었다.\n이 환자에서 골절의 위험을 증가시키는 요인으로 가능성이 적은 것은?","stem_table":null,"options":["Aromatase inhibitor 복용","Proton pump inhibitor 복용","손목 골절 과거력","어머니의 고관절 골절","과체중"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q89p100_7358b8ae.png","note":null,"id_simple":"2022-Q89"},{"id":"2022-L28-Q64","year":2022,"qnum":64,"jokbo_lec_no":28,"lecture":"대사성질환 - 골다공증","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"75세 여자환자가 2일 전 시작된 허리 통증을 주소로 내원하였다. 환자는 2일 전 무거운 짐을 들다가 허리가 삐끗함을 느꼈다고 한다. 내원하여 촬영한 골밀도 검사결과는 다음과 같다. 적절한 설명은?\nT-score:\n- L1 +1.8\n- L2 +0.3\n- L3 -2.6\n- L4 -3.4\n- L1-4 -1.4","stem_table":null,"options":["골감소증으로 경과관찰 하면 된다.","알렌드로네이트 투여가 통증을 완화시킬 수 있다.","응급상황이므로 vertebroplasty를 시행하여야 한다.","칼슘과 비타민 D 투여로 재발을 방지할 수 있다.","Lateral spine X-Ray 촬영이 필요하다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q64p99_85d34e7b.png","note":null,"id_simple":"2022-Q64"},{"id":"2022-L28-Q81","year":2022,"qnum":81,"jokbo_lec_no":28,"lecture":"대사성질환 - 골다공증","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"다음 골다공증 치료제 중 작용 기전이 다른 한 가지는?","stem_table":null,"options":["estrogen","teriparatide","SERM","bisphosphonate","calcitonin"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q81"},{"id":"2022-L28-Q60","year":2022,"qnum":60,"jokbo_lec_no":28,"lecture":"대사성질환 - 골다공증","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"65세 여자가 골밀도 검사 이상 소견으로 의뢰되었다. 1년 전부터 요통이 있었으며 최근 6개월 간 체중이 6kg 증가하였다.\n- 25-OH-vitamin D3 34ng/dL (20-50)\n- PTH 47 pg/mL (10-65)\n- ALP 790 IU/L(30-115)\n- TRP (tubular reabsorption of phosphate) 45% (>60%)\n- PHEN 유전자 돌연변이 (+)\n\n이 질환에 대한 설명으로 옳은 것은?","stem_table":null,"options":["혈청 FGF23이 증가되어 있다.","여자 환자의 증상이 더 심하다.","칼슘과 비타민 D로 치료할 수 있다.","1,25(OH)2-vitamin-D3는 증가되어 있다.","성장호르몬 치료는 도움이 되지 않는다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q60XRp100_23181bd5.png","note":null,"id_simple":"2022-Q60","reparsed":true},{"id":"2022-L29-Q4","year":2022,"qnum":4,"jokbo_lec_no":29,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"3개월 남아가 전신경련으로 응급실에 왔다. 환아는 만삭 정상 질식분만, 2.8kg로 출생하였고 주산기적 문제는 없었다. 검사 소견은 다음과 같다.\n- Ca 6.5 mg/dL (8.5-10.5)\n- P 4.5 mg/dL (2.5-4.5)\n- 25-OH vitamin D3 5 ng/dL (30-100)\n- PTH 37 pg/mL\n- ALP 750 IU/L(30-115)\n\n다음 중 이 질환을 유발한 요인으로 가능한 것은?","stem_table":null,"options":["하얀 피부","혼합 수유","유아 보습제","겨울철 출생","산모의 갑상선 기능저하증"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q4","reparsed":true},{"id":"2022-L29-Q65","year":2022,"qnum":65,"jokbo_lec_no":29,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"5세 남아가 하지 내반슬 변형, 저신장, 치아 발육 부진으로 내원하였다. 검사 소견은 다음과 같았다.\n- Ca 8.7 mg/dL (8.5-10.5)\n- P 2.1mg/dL (2.5-4.5)\n- 25-OH-vitamin D3 34ng/dL (20-50)\n- PTH 47 pg/mL (10-65)\n- ALP 790 IU/L(30-115)\n- TRP (tubular reabsorption of phosphate) 45% (>60%)\n- PHEN 유전자 돌연변이 (+)\n\n이 질환에 대한 설명으로 옳은 것은?","stem_table":null,"options":["혈청 FGF23이 증가되어 있다.","여자 환자의 증상이 더 심하다.","칼슘과 비타민 D로 치료할 수 있다.","1,25(OH)2-vitamin-D3는 증가되어 있다.","성장호르몬 치료는 도움이 되지 않는다."],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q65","reparsed":true},{"id":"2022-L29-Q69","year":2022,"qnum":69,"jokbo_lec_no":29,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"8개월 남아가 전신 경련으로 응급실에 내원하였다. 환아는 턱이 작고 인중이 짧고 두 눈 사이 거리가 멀어 보였고 귓바퀴가 낮게 위치하였다. 3도의 수축기 잡음이 흉골 좌연에서 청진진되었다. 흉부 X선 검사 상 흉선이 관찰되지 않았고 검사 소견 상 저칼슘혈증을 보였다. 다음 중 이 환자의 검사소견으로 합당한 것은?","stem_table":null,"options":["혈청 P 농도 감소","소변 Ca 배출 증가","혈청 부갑상샘호르몬 감소","혈청 25-OH-vitamin D3 감소","혈청 1, 25-(OH)2-vitamin D3 증가"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q69"},{"id":"2022-L30-Q39","year":2022,"qnum":39,"jokbo_lec_no":30,"lecture":"부갑상선, 부신질환의 외과적 치료","professor":"최준영/채영준","curr_lec_no":"17","curr_lecture":"부신질환의 외과적 치료","stem":"일차성 부갑상선기능항진증 수술 시 적절한 부갑상선 병변의 실체를 확인하기 위해 부갑상선 절제 전과 절제 약 10분 후에 혈액검사 수치를 비교한다. 이 검사는 다음 중 어떠한 특성을 이용한 것인가?","stem_table":null,"options":["혈중 칼슘과 짧은 반감기","혈중 부갑상선호르몬의 짧은 반감기","혈중 인(phosphorus)의 짧은 반감기","부갑상선 선종의 작은 크기","부갑상선 선종의 다발성 경향"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q39"},{"id":"2022-L30-Q45","year":2022,"qnum":45,"jokbo_lec_no":30,"lecture":"부갑상선, 부신질환의 외과적 치료","professor":"최준영/채영준","curr_lec_no":"17","curr_lecture":"부신질환의 외과적 치료","stem":"고칼슘혈증으로 부갑상선기능항진증이 의심되어 시행한 영상이다. 사용한 방사성의약품의 섭취 원리는?","stem_table":null,"options":["칼슘에 부착","당대사의 증가","미토콘드리아에 부착","혈류에 의한 조영증강","나트륨-요오드 공동운반체의 증가"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q45p96_657494d0.png","note":null,"id_simple":"2022-Q45"},{"id":"2022-L31-Q26","year":2022,"qnum":26,"jokbo_lec_no":31,"lecture":"갑상선, 부갑상선 및 골질환의 영상소견","professor":"윤태진/홍성환","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"부갑상선항진증의 단순촬영에서 뼈의 생성 증가를 보여주는 소견은?","stem_table":null,"options":["Acrolysis","Brown tumor","Rugger-jersey spine","Subperiosteal resorption","Salt and pepper appearance"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q26"},{"id":"2022-L31-Q111","year":2022,"qnum":111,"jokbo_lec_no":31,"lecture":"갑상선, 부갑상선 및 골질환의 영상소견","professor":"윤태진/홍성환","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"골다공증, 골연화증, 파제트병의 단순촬영에서 공통적으로 보일 수 있는 소견은?","stem_table":null,"options":["Looser's zone","Osseous widening","Coarse trabeculae","Cortical thickening","Picture frame vertebra"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q111"},{"id":"2022-L32-Q12","year":2022,"qnum":12,"jokbo_lec_no":32,"lecture":"갑상선, 부갑상선 질환의 핵의학 검사/치료","professor":"천기정","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음 중 일차성 부갑상선기능항진증에 의심되는 환자의 뼈스캔 소견은?","stem_table":null,"options":["가","나","다","라","마"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q125p102_3c4420eb.png","note":null,"id_simple":"2022-Q12"},{"id":"2022-L32-Q71","year":2022,"qnum":71,"jokbo_lec_no":32,"lecture":"갑상선, 부갑상선 질환의 핵의학 검사/치료","professor":"천기정","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음은 서로 다른 다섯 환자의 갑상선 초음파 영상이다. 초음파에서 보이는 결절 중 악성이 가장 의심되는 결절은?","stem_table":null,"options":["1번","2번","3번","4번","5번"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q711p103_f7de849a.png","note":null,"id_simple":"2022-Q71"},{"id":"2022-L33-Q129","year":2022,"qnum":129,"jokbo_lec_no":33,"lecture":"포도당 대사 항상성 조절 매커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"인슐린 결핍으로 인한 체내 변화로 옳은 것은?","stem_table":null,"options":["lipolysis 감소","peripheral glucose uptake 증가","케톤 생성 증가","포도당 생성 감소","glycogen 합성 증가"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q129"},{"id":"2022-L33-Q139","year":2022,"qnum":139,"jokbo_lec_no":33,"lecture":"포도당 대사 항상성 조절 매커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"50세 남성인 김철수씨는 최근 심해진 비만으로 병원에 내원하여 혈액검사를 받은 결과, 공복혈당치와 당화혈색소 수치가 정상범위를 크게 상회하여 제2형 당뇨병으로 진단받았다. 김철수씨의 대사상태에 대해 가장 가능성이 높은 설명은?","stem_table":null,"options":["근육세포로의 glucose의 유입이 증가되어 있다.","지방세포의 숫자가 정상인에 비해 크게 증가되어 있다.","지방세포에서의 AMPK활성이 증가되어 있다.","지방세포의 adiponectin 분비가 증가되어 있다.","지방조직내의 염증세포의 수는 감소되어 있다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q139"},{"id":"2022-L33-Q215","year":2022,"qnum":215,"jokbo_lec_no":33,"lecture":"포도당 대사 항상성 조절 매커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"김OO 씨는 특정 사회문제에 대하여 단식농성을 시작한지 일주일째 접어들고 있다. 현재 김OO씨의 간세포 (hepatocyte) 대사작용에 대한 기술 중 가장 가능성이 낮은 것은?","stem_table":null,"options":["주로 fatty acid를 에너지원으로 사용하고 있다.","저장된 glycogen의 분해가 활발히 일어나고 있다.","근육으로부터 유래된 아미노산으로부터 glucose를 생합성하고 있다.","지방으로부터 유래된 fatty acid로부터 ketone body를 생합성하고 있다.","지방세포로부터 유래된 glycerol로부터 glucose를 생합성하고 있다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q215"},{"id":"2022-L34-Q128","year":2022,"qnum":128,"jokbo_lec_no":34,"lecture":"당대사 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음중 췌장베타세포의 단일유전자 변이에 의한 당뇨병의 공통적인 특징으로 가장 적절한 것은?","stem_table":null,"options":["대부분 여러 세대에 걸쳐 나타나며 모계로 유전된다.","발병연령은 30~40대가 가장 흔하다.","제2형 당뇨병과 달리 비비만형이 많다.","대사증후군을 잘 동반한다.","갑상선염이나 갑상선기능항진증 등이 잘 동반된다."],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q128"},{"id":"2022-L34-Q144","year":2022,"qnum":144,"jokbo_lec_no":34,"lecture":"당대사 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음 중 제2형 당뇨병 발병 위험이 높은 경우와 가장 거리가 먼 것은?","stem_table":null,"options":["공복혈당장애","대사증후군","다낭성 난소증후군","가족성 고콜레스테롤혈증","출생시 저체중"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q144"},{"id":"2022-L34-Q203","year":2022,"qnum":203,"jokbo_lec_no":34,"lecture":"당대사 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"제1형 당뇨병의 특징에 관한 기술로 가장 적절한 것은?","stem_table":null,"options":["한국인을 포함 동아시아인에서는 타인종에 비해 발병율이 매우 높다.","소아청소년기에 호발하나 70~80대에 발병하기도 한다.","발병과 진단시기 사이에 3-5년 정도 차이가 있다.","HLA와 강한 연관을 보이며 제 2형 당뇨병보다 가족력이 흔하다.","베타세포가 파괴되어 인슐린저항성을 제대로 극복하지 못해 발생한다."],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q203"},{"id":"2022-L34-Q212","year":2022,"qnum":212,"jokbo_lec_no":34,"lecture":"당대사 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"당뇨병 가계도이다. 당뇨병의 종류 중 가장 가능성이 높은 당뇨병을 고르시오.","stem_table":null,"options":["1형 당뇨병","2형 당뇨병","LADA (latent autoimmune diabetes in adults)","MODY (Maturity onset diabetes of the young)","Mitochondrial diabetes"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q212p104_20b08673.png","note":null,"id_simple":"2022-Q212"},{"id":"2022-L35-Q151","year":2022,"qnum":151,"jokbo_lec_no":35,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음 실험에서 설명하는 당뇨병 합병증 발생 기전이 확인된 임상 연구는?","stem_table":null,"options":["ACCORD (Action to Control Cardiovascular Risk in Diabetes)","ADVANCE (Action in Diabetes and Vascular Disease: Preterax and Diamicron MR Controlled Evaluation)","VADT (Veterans Affairs Diabetes Trial)","DCCT / EDIC (Diabetes Control and Complications Trial / Epidemiology of Diabetes interventions and complications)","EMPA-REG outcome trial"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q151p104_1d1b55b9.png","note":null,"id_simple":"2022-Q151"},{"id":"2022-L35-Q171","year":2022,"qnum":171,"jokbo_lec_no":35,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"45세 남자가 10년 전 당뇨병으로 진단받고 경구혈당강하제로 치료 중이다. 당뇨병 관리와 합병증에 대해 평가를 시행하였다. 치료는?\n- 혈압 100/50mmHg, 맥박 120회/분, 호흡수 및 체온 정상\n- 혈당측정기: 측정불가(High)\n이 환자에게 혈액검사를 위한 채혈 후 가장 먼저 해야할 일은?","stem_table":null,"options":["Anti-VEGF therapy","Corticosteroid","Glycemic control","Panretinal Photocoagulation","Surgical vitrectomy"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2022/Q171p104_9c6ce181.png","note":null,"id_simple":"2022-Q171"},{"id":"2022-L35-Q176","year":2022,"qnum":176,"jokbo_lec_no":35,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"10년 전부터 제2형 당뇨병으로 투약 중인 남자가 발 궤양으로 응급실에 왔다. HbA1c 9.1%였다. 상처의 통증이나 가만히 앉아있을 때의 통증은 없었으나, 항상 발이 시린 느낌이었고 칼에 베이는 듯한 느낌이 발끝에서 가장 심했다. 걸을 때 통증은 없었고 오래 걸으면 오히려 발의 시린 증상이 호전되었다. 발이 시린 증상의 가장 가능성 높은 원인질환을 확인하기 위해 bedside에서 시행할 수 있는 검사를 고르시오.","stem_table":null,"options":["Jolly test","Head-up tilt test","Electromyography test","Ankle-brachial index","10g monofilament test"],"answer":[5],"image":null,"note":null,"id_simple":"2022-Q176"},{"id":"2022-L35-Q186","year":2022,"qnum":186,"jokbo_lec_no":35,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"74세 여자가 하지 저림과 통증으로 내원하였다. 환자는 30년 전 당뇨병을 진단받고 인슐린과 경구혈당 강하제로 조절 중이다. 비흡연자였고, 음주는 하지 않았으며, 당뇨약제 이외 복용 약제는 없었다. 환자는 양발의 이상 감각 및 저리고 찌르는 듯한 통증을 호소하였다. 통증은 안정 시와 야간에 악화되었고, 걷거나 운동 중에는 완화되었다. 하지 근력은 정상이었다. 다음 조치는?","stem_table":null,"options":["Brain MRI","Lumbar Spine AP/Lateral X-ray","Nerve Conduction Study","Pregabalin","Spine MRI"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q186"},{"id":"2022-L36-Q137","year":2022,"qnum":137,"jokbo_lec_no":36,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"80세 남자가 말이 어눌해지고 가족을 알아보지 못하여 응급실로 실려왔다. 10년 전 뇌경색이 있어 고혈압약, 고지혈증약, 아스피린 등을 복용 중이었으나 병원에 잘 가지 않았다. 최근 1개월간 기운이 약해져서 주로 집에서 누워 지내고 섭식이 감소하면서 체중이 줄은 것을 제외하면 특별한 특이 증상을 호소하지는 않았다. 과호흡이나 과일향 호흡은 관찰되지 않았다. 응급실에서 시행한 활력징후와 혈당은 다음과 같다.\n- 혈압 100/50mmHg, 맥박 120회/분, 호흡수 및 체온 정상, 혈당측정기: 측정불가(High)\n이 환자에게 혈액검사를 위한 채혈 후 가장 먼저 해야할 일은?","stem_table":null,"options":["인슐린 정주","생리식염수 정주","칼륨 투여","brain MRI 촬영","포도당 용액 정주"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q137"},{"id":"2022-L36-Q162","year":2022,"qnum":162,"jokbo_lec_no":36,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"당뇨병성 케톤산증의 초기 검사 결과에 가장 합당한 것은?","stem_table":null,"options":["혈중 인 농도 감소","혈중 칼륨 농도 감소","동맥혈 pH 감소","백혈구 수 감소","lipase 농도 감소"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q162"},{"id":"2022-L36-Q173","year":2022,"qnum":173,"jokbo_lec_no":36,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"40세 남자가 심한 전신 위약감 및 어지러움으로 응급실에 왔다. 3개월 간 7kg의 체중 감소 및 목마름, 다뇨증이 발생했다. 갈증을 해소하기 위해 하루 1L 이상의 이온음료를 섭취하였고, 전신 위약감으로 운동을 하지 못했다. 응급실 도착 시 수축기 혈압 106 mmHg, 이완기 혈압 54 mmHg, 맥박수 110/min, 체온 및 호흡수 정상, 혈당 550 mg/dL, ABGA 7.42-33.7-126-23. 우선적으로 해야할 조치는?","stem_table":null,"options":["칼슘 및 칼륨 투여","포도당 용액 정주","생리식염수 정주","인슐린 피하주사","글루카곤 피하주사"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q173"},{"id":"2022-L37-Q154","year":2022,"qnum":154,"jokbo_lec_no":37,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중에서 약리학적 기전이 나머지와 가장 다른 한 약물은?","stem_table":null,"options":["Metformin","Liraglutide","Repaglinide","Glimepiride","Gemigliptin"],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q154"},{"id":"2022-L37-Q164","year":2022,"qnum":164,"jokbo_lec_no":37,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 중 당뇨병 약제에 대한 설명으로 맞는 것은?","stem_table":null,"options":["설폰요소제는 ATP sensitive K-channel에 binding하여 인슐린 분비를 유도하여 혈당 강하 효과는 좋지만 저혈당의 위험성이 있다.","메트포민은 저혈당이 거의 오지 않는 장점이 있지만 혈당 강하 효과는 적은 편이다.","alpha-glucosidase 억제제는 지방질 섭취가 많은 서양인의 혈당 조절에 도움이 된다.","Thiazolidineidone 약제는 혈당 강하 효과 이외에도 골다공증에도 도움이 된다.","최근에 개발된 sodium-glucose cotransporter-2 억제제는 혈당 강하 효과가 좋지만 체중감소에는 도움이 되지 않는다."],"answer":[1],"image":null,"note":null,"id_simple":"2022-Q164"},{"id":"2022-L37-Q165","year":2022,"qnum":165,"jokbo_lec_no":37,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중 체중 증가 작용이 나머지 약물들에 비해 상대적으로 큰 약물은?","stem_table":null,"options":["Acarbose","Exenatide","Metformin","Pioglitazone","Empagliflozin"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q165"},{"id":"2022-L38-Q167","year":2022,"qnum":167,"jokbo_lec_no":38,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"당뇨병은 대표적 만성질환으로 지속적인 관리가 중요하다. 최근 연구 결과들을 근거로 볼 때, 당뇨병 관리 방법으로 적절하지 않은 것은?","stem_table":null,"options":["생활습관 개선이 기본이 되어야 한다.","과체중 또는 비만일 경우, 체중 감소가 혈당 조절에 도움이 된다.","저혈당이 오더라도, 혈당을 최대한 낮추는 것이 어느 시점에서나도 도움이 된다.","혈당 외에도, 혈압, 지질 등을 통합적으로 관리하는 것이 중요하다.","당뇨병의 자연 경과에 대한 이해와 이를 위한 교육이 선행되어야 한다."],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q167"},{"id":"2022-L38-Q205","year":2022,"qnum":205,"jokbo_lec_no":38,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"다음 중 당뇨병 치료제에 대한 설명 중 가장 옳은 내용은?","stem_table":null,"options":["현재까지 제 1형 당뇨병에 사용할 수 있는 약물이 insulin 이외에는 없다.","Sulfonylurea와 Meglitinide 유사체 약물은 작용기전이 다르다.","SGLT2 억제제는 신기능 저하환자에서 혈당배출 작용이 감소한다.","Glargine Degludec 등 long acting 인슐린 제제는 정맥투여 용법이 가능하다.","Metformin은 신장에서 유기음이온 수송체 (Organic Anion Transporters)에 의해 배출된다."],"answer":[1,3],"image":null,"note":null,"id_simple":"2022-Q205"},{"id":"2022-L38-Q217","year":2022,"qnum":217,"jokbo_lec_no":38,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"다음 중 당뇨병 환자의 치료에 있어서, 인슐린 치료의 적응증이 아닌 것은?","stem_table":null,"options":["당뇨병성 케토산혈증과 같은 급성 대사성 합병증이 동반될 때","경구 혈당 강하제의 일차 또는 이차 실패시","인슐린 저항성이 심한 경우, 경구용 당뇨병 치료제보다, 우선적으로 인슐린을 사용하는 것이 좋다.","심한 고혈당으로 다음, 다뇨, 다식 증상 및 체중감소가 동반될 때","신장, 간 기능 이상이 있어, 경구용 당뇨병 약제를 사용하기가 어려울 때"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q217"},{"id":"2022-L39-Q147","year":2022,"qnum":147,"jokbo_lec_no":39,"lecture":"소아청소년 당대사 이상","professor":"임재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"4세 남아가 의식이 없어 병원에 왔다. 아침에 깨워도 일어나지 않으며, 식은땀을 흘리고 있었다. 체질량지수는 14.0kg/m2(5 백분위수)였다. 1일 전 어린이집에서 운동회를 하고 저녁을 먹지 않고 잠이 들었다고 한다. 응급실에서 10% 포도당 수액 투여 후 의식이 회복되었다.\n- 혈액: 혈당 30mg/dL, 성장호르몬 20ng/mL (참고치 ≥ 10)\n- 소변: 케톤 3+\n적절한 조치는?","stem_table":null,"options":["케톤식","저지방식","관찰","글루카곤 근육 주사","옥크레오타이드 피하 주사"],"answer":[3],"image":null,"note":null,"id_simple":"2022-Q147"},{"id":"2022-L39-Q168","year":2022,"qnum":168,"jokbo_lec_no":39,"lecture":"소아청소년 당대사 이상","professor":"임재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"9세 여아가 계속 자려고만 하여 병원에 왔다. 1개월 전부터 물을 많이 마시고 소변량이 증가하였다. 체중은 1개월 동안 3kg 줄었다. 4시간 전부터 구토를 하여 아무것도 먹지 못하고 소변도 보지 못하였다. 혈압은 88/50mmHg, 호흡 30회/분, 맥박 105회/분, 체온 37.2°C이었다. 검사 결과는 다음과 같다. 초기 치료는?\n- 혈액: Na+ 133mEq/L, K+ 3.2mEq/L, 포도당 660mg/dL\n- 정맥혈: pH 7.05, HCO3- 5 mEq/L\n- 소변: 포도당 4+, 케톤 3+","stem_table":null,"options":["만니톨 정맥 주사","0.9% 식염수 정맥 주사","0.45% 식염수 정맥 주사","초속효성 인슐린 피하 주사","초속효성 인슐린 정맥 주사"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q168"},{"id":"2022-L39-Q213","year":2022,"qnum":213,"jokbo_lec_no":39,"lecture":"소아청소년 당대사 이상","professor":"임재현","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"14세 여아가 체중이 증가하여 병원에 왔다. 체질량지수는 28.2 kg/m2 (≥95 백분위수)였다. 목에 흑색 가시세포증이 있었고 복부에 자색 선조가 관찰되었다. 검사 결과는 다음과 같다. 일차적인 치료는?\n- 공복혈당 189mg/dL, 당화혈색소 8.3%, 소변 케톤 (-)","stem_table":null,"options":["관찰","메트포르민","장시간 작용 인슐린","인슐린 다회 주사요법","글루카곤유사 펩티드 수용체 작용제"],"answer":[2],"image":null,"note":null,"id_simple":"2022-Q213"},{"id":"2022-L40-Q130","year":2022,"qnum":130,"jokbo_lec_no":40,"lecture":"임신성/노인당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"다음 중 임신 중 고혈당이 주산기 합병증 및 태아에게 미치는 영향이 아닌 것은?","stem_table":null,"options":["거대아","제왕절개","분만 손상","신생아 당뇨병","신생아 호흡곤란증"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q130"},{"id":"2022-L40-Q159","year":2022,"qnum":159,"jokbo_lec_no":40,"lecture":"임신성/노인당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"다음 중 노인 당뇨병의 치료 원칙으로 맞는 것은?","stem_table":null,"options":["우울증에 대한 선별 검사는 필요하지 않다.","6개 이상의 약을 복합적
