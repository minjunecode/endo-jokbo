색체 핵형","유방 초음파","고환 초음파","뇌 자기공명영상 촬영","[판독불가]"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q12_p53.png","note":null,"id_simple":"2023-Q12"},{"id":"2023-L19-Q82","year":2023,"qnum":82,"jokbo_lec_no":19,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"27세 남성이 불임과 성욕감퇴로 병원을 방문하였다. 신장은 178cm, 체중은 63kg이었으며, 혈압과 맥박수, 호흡 등은 모두 정상이었다. 과거력에서도 특이한 사항은 없었다. 신체검사에서 양측 고환이 모두 5ml였다. 혈액검사에서 LH는 19 mIU/mL (1-10 mIU/ml), FSH는 38 mIU/ml (1-9 mIU/ml), testosterone은 150 ng/dL (300-1000 ng/dL)였다. 처음 정액검사에서 정액량은 2ml, 정자는 관찰되지 않았다. 반복 시행한 정액검사에서도 이전검사와 유사하였으며, 정자는 관찰되지 않았다. 확진을 위해 다음으로 시행해야 하는 검사는?","stem_table":null,"options":["경직장초음파검사","컴퓨터단층촬영 (sellar CT)","GnRH 자극검사","염색체검사","고환생검"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q82"},{"id":"2023-L19-Q84","year":2023,"qnum":84,"jokbo_lec_no":19,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"29세 남자가 결혼 후 임신을 원하여 방문하였다. 환자는 7년 전 뇌하수체 선종제거술을 시행받았고, 이후 부신피질호르몬, 갑상선호르몬, 테스토스테론 제제를 복용해 왔다. 테스토스테론을 중지하고 주 3회 2000 IU의 hCG를 3개월간 근육주사 하였다. 테스토스테론치는 정상화되었으나 계속 무정자증을 보여 주 3회 75IU recombinant FSH를 추가하였다. 이후 3개월째 무정자증이다. 적절한 대책은?","stem_table":null,"options":["주 3회 2000 IU의 hCG, 75 IU의 recombinant FSH 유지","테스토스테론 제제를 추가 투여","hCG의 용량을 3000 IU로 증량 투여","GnRH pulsatile infusion pump로 교체","고환에서 정자추출 후 ICSI(Intracytoplasmic sperm injection)"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q84"},{"id":"2023-L19-Q89","year":2023,"qnum":89,"jokbo_lec_no":19,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"정자형성 과정에서 시상하부-뇌하수체-고환 축의 호르몬 조절에 대한 설명이다. 틀린 것은?","stem_table":null,"options":["FSH는 남성의 사춘기에 정자형성 과정이 시작되는 데 필수적인 호르몬이다.","정상적인 정자생산을 위해서는 일정 수준의 고환 내 테스토스테론(Testosterone)이 필수적이다.","남성 성인에서 FSH의 주된 역할은 양적으로 정상적인 수준의 정자형성을 유지시키는 것이다.","테스토스테론(Testosterone)은 인히빈(Inhibin)과 함께 되먹임기전을 통해 뇌하수체에서 FSH 생성을 직접 억제한다.","FSH의 주 표적기관은 고환의 세정관 내에 존재하는 세르툴리세포(Sertoli cell)이며, 세포막에 존재하는 수용체와 결합한 뒤 다양한 세포신호전달체계를 거쳐 정자형성과정에 필요한 여러 단백질의 합성을 촉진한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q89"},{"id":"2023-L20-Q21","year":2023,"qnum":21,"jokbo_lec_no":20,"lecture":"노화와 내분비","professor":"조영민","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"노화에 따라 감소하는 호르몬이 아닌 것은?","stem_table":null,"options":["estrogen","testosterone","DHEA","GH/IGF-1","thyroxine"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q21"},{"id":"2023-L20-Q61","year":2023,"qnum":61,"jokbo_lec_no":20,"lecture":"노화와 내분비","professor":"조영민","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"노화의 근본 기전을 타겟팅하여 여러 노화 관련 질환을 치료하려는 시도를 무엇이라고 부르는가?","stem_table":null,"options":["geriatrics","gerontology","geroscience","senomorphics","senolytics"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q61"},{"id":"2023-L20-Q87","year":2023,"qnum":87,"jokbo_lec_no":20,"lecture":"노화와 내분비","professor":"조영민","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"당뇨병이 없는 정상인의 노화에 따른 당대사의 변화에 대한 설명으로 옳은 것은?","stem_table":null,"options":["인슐린 저항성이 증가한다.","인슐린 분비가 감소한다.","베타세포의 세포분열이 증가한다.","미토콘드리아 기능이 떨어지면 인슐린 감수성이 증가한다.","베타세포 노화는 당뇨병 발병과 관계 없다."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q87"},{"id":"2023-L21-Q35","year":2023,"qnum":35,"jokbo_lec_no":21,"lecture":"골의 구조와 대사","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"다음 중 뼈의 가장 많은 부분을 차지하고 있는 organic substance는?","stem_table":null,"options":["Collagen type I","Osteoblast","Osteoclast","Hydroxyapatite","Glycoprotein"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q35"},{"id":"2023-L21-Q67","year":2023,"qnum":67,"jokbo_lec_no":21,"lecture":"골의 구조와 대사","professor":"공성혜","curr_lec_no":"27","curr_lecture":"골의 구조와 대사","stem":"다음 중 조골세포에서 분비된 당단백질이 결합하여 파골세포의 분화를 촉진시키는 파골세포에 위치한 수용체는?","stem_table":null,"options":["Receptor activator of NF kappa B ligand","Receptor activator of NF kappa B","Osteoprotegerin","Interleukin-6","parathyroid hormone"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q67"},{"id":"2023-L22-Q32","year":2023,"qnum":32,"jokbo_lec_no":22,"lecture":"무기질 대사질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"55세 여자가 골다공증을 진단받고 혈액검사를 하였을 때 부갑상선 수치가 상승해 있었다. 국소화를 위한 영상검사 후 부갑상선 절제술을 시행받고 3일 뒤 퇴원했다. 퇴원 후 손이 심하게 저리고 마비되었으며 호흡곤란 증상이 나타나 응급실로 내원했다. 조치는?","stem_table":null,"options":["근전도 검사","뇌 CT 촬영","항경련제 투여","칼슘 정맥 투여","근이완제 투여"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q32"},{"id":"2023-L22-Q49","year":2023,"qnum":49,"jokbo_lec_no":22,"lecture":"무기질 대사질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"63세 남자가 1년 반 전부터 시작된 하지 위약 및 보행시 통증으로 내원하였다. 환자는 만성 B형 간염으로 3년 전부터 매일 항바이러스제인 adefovir 10mg를 복용 중이었다.\n이 환자의 검사 결과로 예측되는 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘 | 8.5 mg/dL | 8.5-10.5 |\n| 인 | 1.2 mg/dL | 2.5-4.5 |\n| 혈액요소질소 | 14 mg/dL | |\n| 혈중 크레아티닌 | 0.8 mg/dL | |\n| 부갑상선호르몬 | 26 pg/mL | 10-65 |\n| 총 단백질/알부민 | 6.0/3.7 g/dL | |\n| 알칼리 인산분해효소 | 674 U/L | 30-115 |\n| AST/ALT | 45/54 U/L | |","options":["TRP 88%","increased serum 1,25(OH)2D","Increased serum PTHrP","increased serum FGF23","Glycosuria"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q49"},{"id":"2023-L23-Q73","year":2023,"qnum":73,"jokbo_lec_no":23,"lecture":"부갑상선 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"22세 남자가 반복되는 손의 경직과 얼굴의 연축으로 왔다. 신장은 145cm이었으며 둥근 얼굴, 양손의 4,5번째 손가락의 단지가 관찰되었다. 검진상 Chvostek 및 Trousseau 징후는 양성이었다.\n영상검사 결과는 아래와 같았다. 환자의 부모, 누나와 여동생 모두 생화학적 검사에서는 이상이 없었다. 이 가족의 진단으로 가장 적절한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘/인 | 6.8/6.5 mg/dL | (8.5-10.5)/(2.5-4.5) |\n| 혈액요소질소/크레아티닌 | 15/0.8 mg/dL | |\n| 부갑상선호르몬 | 331 pg/mL | 10-65 |\n| 25(OH)D | 30.5 ng/mL | |\n| 알부민 | 43 g/dL | |","options":["아버지-pseudohypoparathyroidism Ia","어머니-pseudopseudohypoparathyroidism","아들(환자)-pseudopseudohypoparathyroidism","큰딸-pseudohypoparathyroidism Ia","작은딸-pseudopseudohypoparathyroidism"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q73_p55.png","note":null,"id_simple":"2023-Q73"},{"id":"2023-L23-Q75","year":2023,"qnum":75,"jokbo_lec_no":23,"lecture":"부갑상선 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"178세 여자가 6개월 전부터 시작된 하지 위약 및 보행시 하지 및 골반 통증으로 내원하였다.\n진단을 위해 다음에 시행할 검사는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘/인 | 6.8/1.8 mg/dL | (8.5-10.5)/(2.5-4.5) |\n| 요소질소/크레아티닌 | 15/0.8 mg/dL | |\n| 부갑상선호르몬 | 282 pg/mL | 10-65 |\n| 알칼리 인산분해효소 | 572 U/L | 30-115 |\n| AST/ALT | 19/32 U/L | |\n| 알부민 | 2.8 g/dL | |","options":["1,25(OH)2D","혈중 골특이적 알칼리 분해효소","혈중 Type I collagen C-telopeptide","혈중 25(OH)D","혈중 PTHrP"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q75"},{"id":"2023-L23-Q77","year":2023,"qnum":77,"jokbo_lec_no":23,"lecture":"부갑상선 질환","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"83세 여자가 젊을 때부터 고칼슘혈증이 있었으며 반복적인 신장 결석으로 인해 10년 전 쇄석술을 시행받았다.\n갑상선초음파, 부갑상선 스캔, 복부 CT는 아래와 같았다. 환자는 골다공증의 치료를 위해 Denosumab 60mg 피하주사를 투여하고 3개월 후 추적하였다. Denosumab 치료에 의한 반응을 평가하기 위한 가장 적절한 지표는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘/인 | 11.8/2.0 mg/dL | |\n| 혈중 요소질소/크레아티닌 | 23/1.0 mg/dL | |\n| 부갑상선호르몬 | 284 pg/mL | 10-65 |\n| 알칼리 인산분해효소 (ALP) | 101 U/L | |\n| 25-hydroxyvitamin D | 32.7 ng/mL | |","options":["칼슘","25 (OH)vitamin D3","부갑상선호르몬","C-telopeptide of collagen type 1 (CTx)","Procollagen type 1 N-terminal propeptide (PINP)"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q77_p55.png","note":null,"id_simple":"2023-Q77"},{"id":"2023-L24-Q19","year":2023,"qnum":19,"jokbo_lec_no":24,"lecture":"대사성 골질환의 진단","professor":"신찬수","curr_lec_no":"29","curr_lecture":"대사성 골질환의 진단","stem":"62세 여자 환자가 골다공증 클리닉에 내원하였다. 환자는 1년 전 본원에서 골감소증을 진단받고 칼슘 및 비타민 D만 처방받고 추적하기로 하였다. 그런데 내원 1개월 전 무릎 통증을 주소로 정형외과 의원을 방문하여 촬영한 골밀도 검사상 심한 골다공증으로 진단받았고 치료를 권유받았으나 치료를 보류하고 다시 본원을 방문하였다.\n모두 정상 소견이었다. 이 환자에서 가장 적절한 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘 | 9.5 mg/dL | 8.5-10.5 |\n| 인 | 3.0 mg/dL | 2.5-4.5 |\n| 25(OH)vitamin D3 | 32 ng/mL | 30-100 |\n| 부갑상선호르몬 | 24 pg/mL | 10-65 |","options":["정형외과 의원으로 회송","골밀도 재측정","장골능골 생검 (iliac crest bone biopsy)","Denosumab 투여","Romosozumab 투여"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q19"},{"id":"2023-L24-Q53","year":2023,"qnum":53,"jokbo_lec_no":24,"lecture":"대사성 골질환의 진단","professor":"신찬수","curr_lec_no":"29","curr_lecture":"대사성 골질환의 진단","stem":"52세 여자 환자가 최근 발생한 우측 고관절 골절을 주소로 내원하여 고관절 전치환술 (total hip replacement arthroplasty)을 시행받고 내과로 협진의뢰 되었다.\n척추 x-ray 촬영 결과 T12의 압박골절이 발견되었다. 적추 Denosumab 치료에 의한 반응을 평가하기 위한 가장 적절한 지표는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 골밀도 L1-4 T-score | -3.3 | |\n| 좌측 Femur neck | -2.6 | |\n| Total hip | -2.8 | |\n| 혈중 칼슘 | 9.2 mg/dL | 8.5-10.5 |\n| 인 | 3.3 mg/dL | 2.5-4.5 |\n| 25(OH)vitamin D3 | 18 ng/mL | 30-100 |\n| 부갑상선호르몬 | 37 pg/mL | 10-65 |\n| CTx | 0.98 ng/mL | 0.17-0.97 |\n| PINP | 34 ng/mL | 16.2-73.8 |","options":["칼슘","25 (OH)vitamin D3","부갑상선호르몬","C-telopeptide of collagen type 1 (CTx)","Procollagen type 1 N-terminal propeptide (PINP)"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q53"},{"id":"2023-L24-Q78","year":2023,"qnum":78,"jokbo_lec_no":24,"lecture":"대사성 골질환의 진단","professor":"신찬수","curr_lec_no":"29","curr_lecture":"대사성 골질환의 진단","stem":"52세 남자가 두통과 머리뼈가 커지는 듯한 증상을 호소하며 내원하였다. 과거력상 악성 종양을 포함하여 주요 질환의 병력은 없었다. 환자는 두통 이외에도 골반 부위의 통증과 열감을 호소하였다.\n환자의 bone scan 사진은 아래와 같다. 가장 가능성 높은 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 혈중 칼슘 | 9.0 mg/dL | 8.5-10.5 |\n| 인 | 3.0 mg/dL | 2.5-4.5 |\n| 알칼리 인산분해효소 | 742 U/L | 30-115 |\n| 25-hydroxyvitamin D3 | 24 ng/mL | 30-100 |\n| 부갑상선호르몬 | 33 pg/mL | 10-65 |","options":["Paget's disease of bone","Lymphoma","osteopetrosis","Osteomalacia","Albright hereditary osteodystrophy"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q78_p56.png","note":null,"id_simple":"2023-Q78"},{"id":"2023-L25-Q14","year":2023,"qnum":14,"jokbo_lec_no":25,"lecture":"대사성 골질환의 치료와 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"65세 여자 환자가 내원 2일 전 이삿짐을 옮기다가 발생한 요통을 주소로 내원하였다. 환자에서 시행한 단순 요추 방사선 촬영과 골밀도 검사는 다음과 같았다.\n이 환자에서 추가적인 골절 예방을 위해 가장 적절한 치료는?","stem_table":"| 검사 | 결과 |\n|------|------|\n| 혈중 칼슘 | 10.2 mg/dL (8.5-10.5) |\n| 인 | 3.0 mg/dL (2.5-4.5) |\n| 부갑상선호르몬 | 24 pg/mL (10-65) |\n| 골밀도 L1-4 T-score | -3.6 |\n| Femur neck T-score | -2.5 |\n| Total Hip T-score | -2.7 |","options":["치료가 필요없다","Leuprolide 즉시 중단","Denosumab + 칼슘 + 비타민 D","남성호르몬 + 칼슘 + 비타민 D","여성호르몬 + 칼슘 + 비타민 D"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q14_p56.png","note":null,"id_simple":"2023-Q14"},{"id":"2023-L25-Q36","year":2023,"qnum":36,"jokbo_lec_no":25,"lecture":"대사성 골질환의 치료와 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"72세 여자가 왼쪽에서 만져지는 목덩이로 왔다.\n환자의 99m Tc-sestamibi 스캔(좌측)과 대퇴골 골밀도 검사(우측)는 다음과 같았다.\n환자는 심한 전신 허약을 호소하여 당장 수술을 받기를 거부하였다. 다음 중 이 환자의 골량을 증가시키기 위한 치료로 적절한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 칼슘 | 13.8 mg/dL | 8.5-10.5 |\n| 인 | 1.8 mg/dL | 2.5-4.5 |\n| 부갑상선호르몬 | 382 pg/mL | 10-65 |\n| 요소질소 | 14 mg/dL | |\n| 크레아티닌 | 1.0 mg/dL | |","options":["활성 비타민 D","데노수맙 (denosumab)","시나칼셋 (cinacalcet)","티아지드 (thiazide)","부갑상선호르몬"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q36_p56.png","note":null,"id_simple":"2023-Q36"},{"id":"2023-L25-Q42","year":2023,"qnum":42,"jokbo_lec_no":25,"lecture":"대사성 골질환의 치료와 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"허리 통증과 체중감소를 호소하는 75세 남자가 아래와 같은 척추 단순 영상을 나타내었다. 환자는 2년 전 전립선암으로 전립선 절제술을 시행받고 재발 방지를 위해 GnRH agonist인 Leuprolide를 투여받고 있었다.\n이 환자의 검사 결과는 아래와 같다.","stem_table":null,"options":["치료가 필요없다","칼슘 + 비타민 D","비스포스포네이트 + 칼슘 + 비타민 D","성장호르몬 + 칼슘 + 비타민 D","부신피질호르몬 + 칼슘 + 비타민 D"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q42_p54.png","note":null,"id_simple":"2023-Q42"},{"id":"2023-L25-Q62","year":2023,"qnum":62,"jokbo_lec_no":25,"lecture":"대사성 골질환의 치료와 파제트병","professor":"신찬수","curr_lec_no":"30","curr_lecture":"대사성 골질환의 치료,골다공증","stem":"73세 여자 환자가 1달 전부터 시작된 좌측 대퇴골 통증을 주소로 내원하였다. 환자는 골다공증으로 7년 전부터 alendronate 4년, zoledronate 3년간 투여받았다고 한다.\n환자는 대퇴골에 대한 수술을 시행받았고 퇴원 예정이다. 향후 이 환자에게 필요한 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 칼슘 | 8.9 mg/dL | 8.5-10.5 |\n| 인 | 3.0 mg/dL | 2.5-4.5 |\n| 25(OH)vitamin D3 | 32 ng/mL | 30-100 |\n| 부갑상선호르몬 | 44 pg/mL | 10-65 |\n| CTx | 0.087 ng/mL | 0.17-0.97 |\n| 골밀도 L1-4 | -2.9 | |\n| Femur neck | -2.4 | |\n| Total hip | -2.7 | |","options":["Zoledronate 증량","Denosumab 범용","Zoledronate 중단","고관절 전치환술","부신피질호르몬 투여"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q62_p57.png","note":null,"id_simple":"2023-Q62"},{"id":"2023-L26-Q3","year":2023,"qnum":3,"jokbo_lec_no":26,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"10개월 남아의 손목 방사선 사진이다. 이 환아의 혈액 검사 소견 중 합당한 것은?","stem_table":null,"options":["혈청 인 농도 증가","혈청 칼슘 농도 증가","혈청 부갑상샘호르몬 농도 증가","혈청 콜레칼시페롤 (25 OH vitamin D3) 농도 증가","혈청 알칼리 인산화효소 (alkaline phosphatase) 농도 감소"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q3_p57.png","note":null,"id_simple":"2023-Q3","reparsed":true},{"id":"2023-L26-Q43","year":2023,"qnum":43,"jokbo_lec_no":26,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"10개월 남아가 전신 경련으로 응급실에 내원하였다. 환아는 턱이 작고 인중이 짧고 두 눈 사이 거리가 멀어 보였고 귓바퀴가 낮게 위치하였다. 3도의 수축기 잡음이 환골 좌연에서 청진되었다. 환아는 저칼슘혈증 소견을 보여 10% Ca gluconate 정맥주사를 투여받은 후 경련이 소실되었다. 부갑상샘호르몬 농도가 매우 낮았으며 22번 염색체 microdeletion이 확인되었다. 적절한 치료는?","stem_table":null,"options":["인","칼슘","칼슘 + Vitamin D3","칼슘 + 1,25(OH)2 vitamin D3","Burosumab (monoclonal Antibody to FGF23)"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q43"},{"id":"2023-L26-Q47","year":2023,"qnum":47,"jokbo_lec_no":26,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"다음 중 FGF 23와 부갑상선호르몬이 같은 작용을 나타내는 것은?","stem_table":null,"options":["신장 근위세뇨관의 1α-hydroxylase 발현 자극","소장의 칼슘 흡수","신장 근위세뇨관의 나트륨 인산 공동 수송체 2a (NaPi-2a) 발현 억제","신장 24-hydroxylase 발현 자극","신장 근위 세뇨관의 칼슘 재흡수"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q47"},{"id":"2023-L26-Q57","year":2023,"qnum":57,"jokbo_lec_no":26,"lecture":"구루병과 소아저칼슘혈증","professor":"이성용","curr_lec_no":"31","curr_lecture":"구루병과 소아저칼슘혈증","stem":"다음은 부갑상샘호르몬과 1,25(OH)vitamin D3의 작용에 대한 설명이다. 빈칸에 들어갈 말의 올바른 조합을 고르시오.\n\"부갑상샘호르몬은 신장에서 인의 배출은 (A)시키고 1,25(OH)vitamin D3 합성을 (B)한다. 비타민 D는 장에서 인의 흡수를 (C)한다.\"","stem_table":null,"options":["A 증가 B 촉진 C 촉진","A 증가 B 촉진 C 억제","A 증가 B 억제 C 촉진","A 감소 B 촉진 C 촉진","A 감소 B 촉진 C 억제"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q57"},{"id":"2023-L27-Q2","year":2023,"qnum":2,"jokbo_lec_no":27,"lecture":"부갑상선, 부신질환의 외과적 치료","professor":"최준영","curr_lec_no":"17","curr_lecture":"부신질환의 외과적 치료","stem":"35세 여자가 두통과 심계항진을 주소로 내원했다. 혈압이 180/120 mmHg, 맥박이 100회/분, 호흡수 18회/분, 체온은 37°C이다. 최근 약물 복용력은 없었고, 특이한 과거력 및 가족력은 없었다. 내원 당시 시행한 복부 CT와 혈액검사 결과이다.\n수술을 계획하였을 때 수술 전 일차적으로 사용하는 약제는?","stem_table":null,"options":["Propranolol","Furosemide","Doxazosin","Captopril","Nicardipine"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q2_p58.png","note":null,"id_simple":"2023-Q2"},{"id":"2023-L27-Q8","year":2023,"qnum":8,"jokbo_lec_no":27,"lecture":"부갑상선, 부신질환의 외과적 치료","professor":"최준영","curr_lec_no":"17","curr_lecture":"부신질환의 외과적 치료","stem":"55세 여자가 복통으로 응급실을 방문하여 복부 X선 촬영을 하였고 영상에서 요로결석이 발견되었다. 환자의 칼슘수치는 10.9mg/dL (참고치 8.8-10.5mg/dL)로 약간 상승해 있었으며, 부갑상선호르몬 수치는 110pg/mL (참고치 15-65pg/mL), 24시간 소변 내 칼슘은 300mg (참고치 100-250mg)이었다. DEXA 골밀도 측정치는 T score -2.0이었다. 부갑상선 수술을 결정하였을 때 수술 적응증에 해당하는 것은?","stem_table":null,"options":["요로결석으로 인한 복통 병력","55세의 나이","혈중 칼슘 수치","24시간 소변 내 칼슘 수치","골밀도 수치"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q8"},{"id":"2023-L28-Q64","year":2023,"qnum":64,"jokbo_lec_no":28,"lecture":"갑상선, 부갑상선 및 골질환의 영상소견","professor":"윤태진/홍성환","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"다음은 서로 다른 다섯 환자의 갑상선 초음파 영상이다. 초음파에서 보이는 결절 중 가장 악성이 의심되는 결절은?","stem_table":null,"options":["A","B","C","D","E"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q64_p58.png","note":null,"id_simple":"2023-Q64"},{"id":"2023-L28-Q79","year":2023,"qnum":79,"jokbo_lec_no":28,"lecture":"갑상선, 부갑상선 및 골질환의 영상소견","professor":"윤태진/홍성환","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"71세 남자. 진단은?","stem_table":null,"options":["osteoporosis","osteomalacia","osteopetrosis","Paget's disease","Hyperparathyroidism"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q79_p58.png","note":null,"id_simple":"2023-Q79"},{"id":"2023-L28-Q83","year":2023,"qnum":83,"jokbo_lec_no":28,"lecture":"갑상선, 부갑상선 및 골질환의 영상소견","professor":"윤태진/홍성환","curr_lec_no":"32","curr_lecture":"갑상선부갑상선 및 골질환의 영상소견","stem":"61세 남자 환자에서 다발성 갈비뼈 골절의 원인질환으로서 가장 가능성이 높은 것은?","stem_table":null,"options":["osteoporosis","osteomalacia","osteopetrosis","Paget's disease","Hyperparathyroidism"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q83"},{"id":"2023-L29-Q39","year":2023,"qnum":39,"jokbo_lec_no":29,"lecture":"갑상선, 부갑상선질환의 핵의학 검사 및 치료","professor":"천기정","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음 중 부갑상선종 진단에 이용하는 방사성의 약품이 아닌 것은?","stem_table":null,"options":["TI-201 chloride","Tc-99m MIBI","C-11 choline","F-18 fluorocholine","Tc-99m MDP"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q39"},{"id":"2023-L29-Q52","year":2023,"qnum":52,"jokbo_lec_no":29,"lecture":"갑상선, 부갑상선질환의 핵의학 검사 및 치료","professor":"천기정","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"폐전이가 있는 갑상선암 환자에게 갑상선절제술 후 방사성동위원소를 이용하여 반복치료를 시행하였다. 해당 치료의 분자표적으로 적합한 것은?","stem_table":null,"options":["glucose transporter","sodium/iodide symporter","somatostatin receptor","aminoacid transporter","nucleic acid symporter"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q52_p59.png","note":null,"id_simple":"2023-Q52"},{"id":"2023-L29-Q54","year":2023,"qnum":54,"jokbo_lec_no":29,"lecture":"갑상선, 부갑상선질환의 핵의학 검사 및 치료","professor":"천기정","curr_lec_no":"33","curr_lecture":"부갑상선질환의 핵의학 검사 및 치료_외과적 치료","stem":"다음 중 갑상선암의 가능성이 가장 높은 스캔 소견은?","stem_table":null,"options":["A","B","C","D","E"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q54_p59.png","note":null,"id_simple":"2023-Q54"},{"id":"2023-L30-Q93","year":2023,"qnum":93,"jokbo_lec_no":30,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"갑상선 호르몬 합성, 운반, 대사 과정에 대한 설명으로 옳은 것은?","stem_table":null,"options":["셀레늄은 갑상선호르몬 합성의 기본 물질로 갑상선호르몬 분자량의 65%를 차지한다.","요오드는 혈액으로부터 갑상선세포 안으로 pendrin을 통해 능동적으로 운반된다.","갑상선호르몬은 TPO(Thyroperoxidase)의 활성을 억제한다.","갑상선호르몬은 수용성으로 대부분 결합단백과 결합하여 운반되는데, 갑상선호르몬과 결합친화력이 가장 좋으면서 대부분의 갑상선호르몬을 운반하는 결합단백은 알부민이다.","갑상선호르몬은 세포 핵 내에 존재하는 갑상선호르몬 수용체와 결합하여 작용한다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q93"},{"id":"2023-L30-Q107","year":2023,"qnum":107,"jokbo_lec_no":30,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"40세 여자의 혈액검사 결과가 다음과 같았다.\n아래 보기 중 어떤 상황일 가능성이 높은가?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 1.6 mIU/L | 0.4~5.0 |\n| Free T4 | 1.1 ng/dL | 0.7~1.8 |\n| Total T3 | 250 ng/dL | 81~196 |","options":["3개월 전부터 금식을 통한 다이어트 중","1개월 전 피부 문제로 스테로이드 복용 중","임신 중","말단 비대증 환자","만성 신부전"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q107"},{"id":"2023-L30-Q155","year":2023,"qnum":155,"jokbo_lec_no":30,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"50세 여성의 혈액검사 결과가 다음과 같았다.\n아래 보기 중 어떤 상황일 가능성이 높은가?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 6.0 mIU/L | 0.4~5.0 |\n| Free T4 | 1.4 ng/dL | 0.7-1.8 |","options":["3개월 전부터 피부 문제로 스테로이드 복용 중","1년 전 비기능성 뇌하수체 종양을 수술한 이후","조영제를 사용한 CT 검사 이후","3개월 전부터 아스피린을 복용중인 환자","2주 전부터 그레이브스병으로 항갑상선제를 복용중인 환자"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q155"},{"id":"2023-L30-Q164","year":2023,"qnum":164,"jokbo_lec_no":30,"lecture":"갑상선 생리와 기능조절","professor":"김민주","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"27세 여자의 갑상선 기능검사와 99mTc-갑상선스캔 결과이다. 원인 질환은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 6.5 mIU/L | 0.4-4.1 |\n| Free T4 | 2.4 ng/dL | 0.7-1.8 |","options":["하시모토 갑상선염","영양막종양","중독성 다결절성 갑상선종","그레이브스병","TSH 분비 뇌하수체선종"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q164"},{"id":"2023-L31-Q126","year":2023,"qnum":126,"jokbo_lec_no":31,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"78세 여성 환자가 목 앞쪽의 갑상선 부위가 갑자기 커져서 내원하였다. 30년 전에 하시모토 갑상선염을 진단받고 2-3년간 갑상선호르몬을 복용하였고, 이후 투약 없이 별다른 증상 없이 정상 갑상선기능을 유지하고 있었다. 6개월 전 갑상선초음파 및 혈액검사를 실시했을 때 결절도 없었고 기능도 정상이라고 들었다고 한다. 갑상선 부위는 이전부터 좀 부어 있었으나 크기 변화는 없다가 병원에 다녀온 후인 최근 3-4개월 전부터 갑자기 커지기 시작했으며, 숨쉴 때 좀 답답함이 생긴 것 외에 땀이 나거나 가슴 두근거림 등의 증상은 없다고 한다. 신체검진상 갑상선은 정상인의 4-5배 이상 커졌으며 만졌을 때 압통은 없었다. 감별해야 할 질환 중 가장 가능성이 높은 질환은?","stem_table":null,"options":["갑상선림프종","무통성갑상선염","아급성갑상선염","갑상선여포암","갑상선미분화암"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q126"},{"id":"2023-L31-Q130","year":2023,"qnum":130,"jokbo_lec_no":31,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"37세 남성이 1주일간 지속된 심계항진 및 전경부 통증을 주소로 내원하였다. 신체검진상 혈압 130/60mmHg, 심박수 110회/분이었으며 갑상선 촉진상 우측 갑상선이 부어있었고 해당 부위에 압통을 호소하였다.\n갑상선스캔 사진은 다음과 같았다. 이 환자에서 향후 치료로 적절한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 티록신 | 3.23 ng/dL | 0.7~1.8 |\n| 갑상선자극호르몬 | 0.05 mIU/L | 0.45~4.5 |\n| 갑상선자가항체 | 모두 음성 | |\n| ESR | 75 mm/h | <20 |","options":["항갑상선제 치료를 시작한다.","방사성요오드치료가 필요하다.","통증이 심할 경우 스테로이드제 투여를 고려한다.","항바이러스제 또는 항생제 치료가 필요하다.","심계항진은 수일 내에 저절로 호전되므로 치료를 요하지 않는다."],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q130"},{"id":"2023-L31-Q135","year":2023,"qnum":135,"jokbo_lec_no":31,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"36세 여성이 심한 피곤감으로 시행한 검사에서 간수치 및 콜레스테롤 수치 이상으로 내원하였다. 이전 특이병력은 없었으며, 2달 전부터 일상적인 업무에도 심한 피곤감을 느꼈으며, 6달 동안 7kg의 체중 증가가 있었고, 목 부위에 나비모양의 증대 소견이 관찰되었고, 한 달간 심한 변비 증상과 머리카락이 매우 푸석해졌다고 하였다. 키 161cm, 몸무게 72.5kg, 혈압, 맥박, 호흡수, 체온은 모두 정상이었다.\n가장 먼저 시행되어야 할 치료는 무엇인가?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| CBC | 7880-13.5-215K | |\n| BUN/Cr | 24/1.2 mg/dL | |\n| Glucose | 105 mg/dL | |\n| HbA1c | 5.6% | |\n| T.cholesterol | 300 mg/dL | |\n| Triacylglyceride | 1600 mg/dL | |\n| HDL cholesterol | 40 mg/dL | |\n| LDL cholesterol | 200 mg/dL | |\n| SGOT/SGPT | 190/224 IU/mL | <40/40 |\n| γGT | 100 IU/mL | <60 |\n| TSH | 100 이상 μIU/mL | 0.3~4 |\n| FT4 | 0.21 ng/dL | 0.8~1.8 |\n| CPK | 400 IU/L | <178 |\n| TPO 항체 | +++ | |","options":["Fenofibrate","High intensity statin","Omega-3 fatty acid","갑상선 호르몬 투여","Statin과 Ezetimibe 병용투여"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q135"},{"id":"2023-L31-Q142","year":2023,"qnum":142,"jokbo_lec_no":31,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"31세 여자가 약 2개월 전부터 추위, 부종, 피로감 및 갑상선종을 주소로 내원하였다. 갑상선 촉진 시 통증은 호소하지 않았다. 환자는 6개월 전 출산하였고 현재 수유 중이라고 했다. 3-4개월 전에는 평소보다 땀이 많이 나고, 더위를 많이 탔으며, 가슴 두근거림을 자주 느꼈으나 특별한 검사를 시행하지는 않았다고 하였다.\n이 환자의 치료로 가장 적합한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 T4 | 0.34 ng/dL | 0.7~1.7 |\n| TSH | 32.1 mIU/L | 0.5~4.5 |\n| ESR | 13 mm/h | <20 |\n| 항마이크로좀 항체 | 양성 | |","options":["일시적 이상으로 경과 관찰","즉시 갑상선호르몬 T4 투여","증상 조절을 위한 베타차단제 투여","수유 중으로 활성형 갑상선호르몬제 T3 투여","갑상선기능 안정화를 위한 방사성요오드 치료"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q142"},{"id":"2023-L31-Q181","year":2023,"qnum":181,"jokbo_lec_no":31,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"42세 여성이 5개월 전부터 시작된 전신쇠약감, 부종, 체중증가를 주소로 내원하였다. 과거력상 네 번의 출산 후 매번 갑상선기능저하증으로 갑상선호르몬제를 3-6개월간 복용 후 회복되어 중단한 바 있으며, 내원 후 시행한 갑상선기능검사상 free T4 0.54 ng/dL (0.8-1.8), TSH 28 mIU/L (0.5-4.","stem_table":null,"options":["저절로 회복될 가능성이 높으므로 6개월 후 재검사한다.","갑상선염의 재발 가능성이 높으므로 스테로이드제를 투여한다.","갑상선호르몬제를 투여한다.","반복된 갑상선염으로 인한 갑상선암 발생 위험이 높으므로 갑상선절제술 후 갑상선호르몬제를 투여한다.","스테로이드제를 먼저 투여 후 갑상선호르몬제 투여를 시작한다."],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q181"},{"id":"2023-L32-Q91","year":2023,"qnum":91,"jokbo_lec_no":32,"lecture":"갑상선기능항진증","professor":"박영주","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"37세 여자가 발열과 복부통증으로 내원, 2일 전 내시경적 역행성 담췌관 조영술(ERCP) 담석제거술을 시행받았다. 이후 빈맥이 지속되어 시행한 검사결과와 목 사진이다.\n원인 질환 감별에 가장 유용한 검사는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 0.01 mIU/L | 0.4-4.1 |\n| Free T4 | 2.8 ng/dL | 0.7-1.8 |","options":["갑상선 세침흡인세포검사","갑상선스캔","혈중 ESR","혈중 TSH 수용체 항체","뇌하수체 MRI"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q91_p61.png","note":null,"id_simple":"2023-Q91"},{"id":"2023-L32-Q149","year":2023,"qnum":149,"jokbo_lec_no":32,"lecture":"갑상선기능항진증","professor":"박영주","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"67세 여성이 39.5도의 고열이 발생하여 왔다. 2주 전부터 하루 2회 갑상선약을 복용하기 시작하였으나, 무슨 약인지는 모른다고 하였다. 목이 아파서 침을 삼키기가 어렵다고 하였다.\n필요한 검사는?","stem_table":null,"options":["TSH 수용체 항체","혈소판","ESR","백혈구","간기능검사"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q149_p61.png","note":null,"id_simple":"2023-Q149"},{"id":"2023-L32-Q188","year":2023,"qnum":188,"jokbo_lec_no":32,"lecture":"갑상선기능항진증","professor":"박영주","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"30세 24주 임산부가 약물로 조절되지 않는 갑상선 기능 항진증으로 내원하였다. 환자는 체중감소 및 빈맥의 소견을 보이고 있으며 심한 안구병증이 동반되었다.\n치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| T3 | 208 ng/dL | 87-184 |\n| Free T4 | 3.0 ng/dL | 0.70-1.80 |\n| TSH | 0.1 mIU/L | 0.4-4.1 |","options":["항갑상선호르몬치료","레보티록신","갑상선 절제","고주파 절제술","방사선 동위원소 치료"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q188_p61.png","note":null,"id_simple":"2023-Q188"},{"id":"2023-L33-Q117","year":2023,"qnum":117,"jokbo_lec_no":33,"lecture":"갑상선결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"56세 여성이 최근 목의 덩이가 커지는 것 같다고 병원에 왔다. 2년 전 건강검진 시 시행한 초음파검사에서 오른쪽에 1.5cm의 혹이 발견되어 세침흡인세포검사를 받은 결과 양성인지 악성인지 확실하지 않다고 들었다고 하였다. 환자의 신체검진, 혈액검사 및 초음파검사에서 아래와 같은 소견을 보였고 결절의 크기는 2.2 x 2.1 x 1.7cm이었다.\n이 환자에서 시행하여야 할 검사는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 3.75 mIU/L | 0.34~4.25 |\n| Free T4 | 1.2 ng/dL | 0.8~1.7 |","options":["6개월 후 초음파검사","갑상선스캔","경부 컴퓨터단층촬영","세침흡인세포검사","갑상선절제술"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q117_p61.png","note":null,"id_simple":"2023-Q117"},{"id":"2023-L33-Q147","year":2023,"qnum":147,"jokbo_lec_no":33,"lecture":"갑상선결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"47세 남자가 경부 초음파 검사에서 갑상선 결절이 발견되어 방문하였다. 감별진단을 위한 검사를 시행하여 다음과 같은 결과를 얻었다.\n초음파 소견: FNAC: Atypical cell of unknown significance\n이 환자에서 결절의 진단을 위해 시행하여야 할 검사를 한 가지 고르시오.","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| Free T4 | 1.35 ng/dL | 0.80-1.90 |\n| TSH | 1.77 mIU/L | 0.40-4.10 |","options":["항 TPO 항체","항 TSH 수용체 항체","T3 억제 갑상선스캔","방사성요오드 섭취율 검사","갑상선초음파 검사"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q147"},{"id":"2023-L33-Q172","year":2023,"qnum":172,"jokbo_lec_no":33,"lecture":"갑상선결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"41세 남자가 A)와 같은 소견으로 동네 병원에서 혈액검사 시행 결과 다음과 같았다.\n기능성 결절 여부를 확인하기 위해 갑상선스캔을 시행하여 B)와 같은 결과를 얻었다.\n이 환자에서 결절의 진단을 위해 시행하여야 할 검사를 한 가지 고르시오.","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 0.17 mIU/L | 0.4-4.05 |\n| Free T4 | 1.42 ng/dL | 0.8-1.9 |","options":["항 TPO 항체","항 TSH 수용체 항체","T3 억제 갑상선스캔","방사성요오드 섭취율 검사","갑상선초음파 검사"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q172_p61.png","note":null,"id_simple":"2023-Q172"},{"id":"2023-L33-Q187","year":2023,"qnum":187,"jokbo_lec_no":33,"lecture":"갑상선결절의 진단과 치료","professor":"이가희","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"55세 남자 환자가 목의 종물이 커져서 내원하였다. 환자는 연하곤란, 호흡곤란이 있었으며 세침흡인세포검사상 양성으로 진단되었다. 갑상선 기능 검사결과 및 영상 소견이다.\n치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| T3 | 118 ng/dL | 87-184 |\n| Free T4 | 0.84 ng/dL | 0.70-1.80 |\n| TSH | 0.58 mIU/L | 0.4-4.1 |","options":["항갑상선호르몬치료","갑상선 절제","6개월 뒤 세침흡인세포검사 재시행","고주파 절제술","방사선 동위원소 치료"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q187_p62.png","note":null,"id_simple":"2023-Q187"},{"id":"2023-L34-Q139","year":2023,"qnum":139,"jokbo_lec_no":34,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"58세 남자환자가 폐의 다발성결절로 입원하여 생검을 시행할 결과 갑상선여포암으로 진단이 되었다. 이 환자의 치료 방침으로 가장 적절한 것은?","stem_table":null,"options":["암이 폐로 전이가 된 M1 환자이므로 표준항암치료를 시작한다.","갑상선절제술을 시행한 후 고용량 방사선요오드 치료를 시행한다.","폐전이가 있으므로 먼저 티로신키나제 억제제를 3개월간 투여한 후 갑상선절제술을 시행한다.","갑상선절제술을 시행한 후 목부위는 외부방사선조사를, 폐 부위는 cis-platin 계열의 항암제를 사용하여 치료한다.","예후가 매우 나쁠 것으로 예상되므로 적극적인 치료보다는 증상에 따른 지지요법(supportive care)을 시행한다."],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q139"},{"id":"2023-L34-Q183","year":2023,"qnum":183,"jokbo_lec_no":34,"lecture":"갑상선암의 진단과 치료","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선에서 발생할 수 있는 암에 대한 다음 설명 중 적절한 것은?","stem_table":null,"options":["갑상선림프종이 갑상선 밖으로 퍼졌을 때는 갑상선에서 생기는 암 중에서 가장 예후가 나쁘다.","갑상선은 혈류량이 매우 많기 때문에 전이암이 흔히 발견된다.","갑상선수질암의 표준 치료는 수술 후 방사성요오드 치료를 하는 것이다.","젊은 연령(30대)에서 발생하는 갑상선암의 경우 미분화암의 가능성이 크다.","미분화암은 여포 상피세포(Follicular epithelial cell)에서 유래한 암이다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q183"},{"id":"2023-L35-Q165","year":2023,"qnum":165,"jokbo_lec_no":35,"lecture":"갑상선의 수술적치료","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"45세 여자가 갑상선 유두암으로 갑상선전절제술 및 중앙림프절절제술을 시행받았다. 수술직후 손과 발이 저린 증상이 있었다. 혈압 120/80 mmHg, 맥박 80회/분, 호흡수 35회/분, 체온 37.2℃이었다.\n처치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| PTH | 5 pg/mL | 15-65 |\n| Ca | 8.0 mg/dL | 8.8-10.5 |\n| ionized Ca | 0.75 mmol/L | 1.05-1.35 |","options":["calcitonin 투여","생리식염수 투여","봉투를 이용한 재호흡","칼슘 및 활성형 비타민 D 투여","O2 7L/min face mask 투여"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q165"},{"id":"2023-L36-Q92","year":2023,"qnum":92,"jokbo_lec_no":36,"lecture":"갑상선결절/암의 병리 / 분자병리","professor":"원재경","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"70세 남자 환자가 전경부(anterior neck) 종괴와 목소리가 쉬는 것을 주소로 내원하였다. 환자는 20년 전부터 목에 작은 종괴가 있었으나 최근 갑자기 커졌다고 하였다. 초음파 검사상 갑상선에서 기원한 것으로 보이는 크기 7x5cm의 커다란 종괴가 갑상선 주변 조직으로 침윤하는 것이 관찰되었다. 수술 검체에서 환자의 종괴는 다음과 같은 조직학적 소견을 보였다.\n이 질환에 대한 설명으로 옳은 것은?","stem_table":null,"options":["역분화암으로 유전자의 변이는 갑상선 유두암보다 적다.","크기는 커도 갑상선암이므로 90% 이상의 10년 생존율을 보인다.","이 질환의 발생에 p53 mutation이 중요한 역할을 한다.","TERT promoter 변이는 이 질환의 발생에는 관계가 없다.","진행이 빠르진 않으므로 여유를 가지고 검사하도록 한다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q92_p63.png","note":null,"id_simple":"2023-Q92"},{"id":"2023-L36-Q162","year":2023,"qnum":162,"jokbo_lec_no":36,"lecture":"갑상선결절/암의 병리 / 분자병리","professor":"원재경","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"40세 여성 환자가 2년 전 발견된 갑상선 결절을 주소로 방문하였다. 초음파 검사상 갑상선 우엽에 크기 1.5x1cm의 주변과 경계가 좋은 고형성 종괴가 관찰되었다. 환자는 세침흡인검사 후 갑상선엽절제술을 시행받았다. 절제되어 온 검체에 대한 병리소견은 아래 사진과 같다.\n이 병변에 대한 보기 중 가장 적합한 내용은?","stem_table":null,"options":["피막의 침윤 여부는 중요하지 않다.","가장 흔한 변이로 RAS, PAX8-PPARr 유전자 변이가 있다.","혈관의 침윤 여부는 진단에 중요하지 않다.","가장 흔한 변이로 BRAF-V600E 변이가 대표적이다.","림프절 전이를 잘하기 때문에 주의가 필요하다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q162_p63.png","note":null,"id_simple":"2023-Q162"},{"id":"2023-L36-Q177","year":2023,"qnum":177,"jokbo_lec_no":36,"lecture":"갑상선결절/암의 병리 / 분자병리","professor":"원재경","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"35세 여자 환자가 건강검진상 발견된 갑상선 결절을 주소로 방문하였다. 초음파 검사상 갑상선 우엽에 크기 2x1cm의 주변과 경계가 좋지 않은 침윤성 종괴가 관찰되었다. 환자는 세침흡인검사 후 갑상선 전절제술을 시행받았다. 절제되어 온 검체에 대한 병리소견은 아래 사진과 같다.\n이 병변에 대한 보기 중 적합하지 않은 내용은?","stem_table":null,"options":["중요한 핵의 특징으로 nuclear groove, nuclear pseudo-inclusion 등이 있다.","갑상선 여포세포에서 기원한 종양의 하나이다.","특징적인 유전자 변이로 BRAF 유전자 변이가 있다.","혈행성 전이를 잘해서 폐, 뼈 등으로 전이가 종종 일어난다.","아형에 따라 더 공격적인 경향을 띠는 아형이 있는데 tall cell variant, columnar cell variant 등이 있다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q177_p63.png","note":null,"id_simple":"2023-Q177"},{"id":"2023-L37-Q106","year":2023,"qnum":106,"jokbo_lec_no":37,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"6세 여아가 목덩이(왼쪽 사진) 주소로 병원에 왔다. 임신나이 39주, 2.9kg으로 출생하였고 신생아선별검사는 정상이었다. 신생아기 황달로 광선치료 받았으며, 간헐적으로 변비가 있다. 키 110cm(10-25백분위수), 체중 25kg(90백분위수), 체질량지수 95백분위수 이상이다. 운동발달은 또래와 같았으나 말이 조금 늦었다고 한다.\n이 환자에서 가장 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 T4 | 1.1 ng/dL | 0.8-2.0 |\n| 갑상선 자극호르몬 | 12.5 mIU/L | 0.5-6.5 |\n| 갑상선초음파 | 갑상선이 제 위치에 보이지 않음 | |","options":["과염소산 방출검사를 시행한다.","목덩이는 딴곳 갑상선이므로 수술적으로 제거를 요한다.","갑상선호르몬 합성장애이므로 청력검사를 시행한다.","레보티록신 치료를 시작한다.","비만으로 인한 무증상 갑상선저하증이므로 체중을 감량해야한다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q106_p63.png","note":null,"id_simple":"2023-Q106"},{"id":"2023-L37-Q120","year":2023,"qnum":120,"jokbo_lec_no":37,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"3세 남아가 병원에 왔다. 임신나이 35주, 1.3kg (출생 시 3백분위수 미만) 출생하여 신생아중환자실 입원치료 받았고, 생후 3주경 레보티록신 25mcg/day 복용을 시작하였다. 생후 1세 시행한 갑상선 초음파에서 갑상선은 제 위치에 확인되었고 크기 적절하였다. 레보티록신 용량은 현재 35mcg/day 복용 중이다. 내원 시 키 94cm(10-25백분위수), 체중 14kg(25백분위수)이었고, 운동과 언어 발달은 정상이다.\n이 환자에서 옳은 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 T4 | 0.9 ng/dL | 0.8~2.0 |\n| 갑상선자극호르몬 | 9.4 mIU/L | 0.5~6.5 |","options":["미숙아 출생아로 일시적인 갑상선저하증이다.","레보티록신 치료를 지속한다.","3세가 되었고 성장 발달이 정상이므로 레보티록신 중단을 시도한다.","중추성 갑상선저하증이다.","선천성 갑상선형성부전이다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q120_p64.png","note":null,"id_simple":"2023-Q120"},{"id":"2023-L37-Q189","year":2023,"qnum":189,"jokbo_lec_no":37,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"7개월 여아가 영상검사 시행 후 병원에 왔다. 임신나이 35주, 2.3kg으로 출생하였고 신생아선별검사에서 갑상선 자극호르몬 수치가 높아서 신생아기부터 레보티록신 복용을 시작하였다. 이후 지속적으로 복용하다가 1개월 전(36개월째) 초음파에서 정상 위치에 갑상선이 적절한 크기로 확인되어 레보티록신 치료를 중단하였다. 신생아기 청력장애로 진단되어 이비인후과 추적 중이다.\n적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 유리 T4 | 1.3 ng/dL | 0.8-2.0 |\n| 갑상선자극호르몬 | 7.5 mIU/L | 0.5-6.5 |\n| 99mTc 스캔 | (아래 사진) | |\n| 과염소산방출검사 | 과염소산 복용 후 갑상선 요오드 섭취율 감소가 25% 이상 | |","options":["레보티록신 치료를 시작한다.","갑상선형성부전이므로 유전자검사를 시행한다.","미숙아출생아로 일시적인 갑상선저하증이다.","갑상선호르몬 합성장애이며 Pendred 증후군 가능성이 있다.","과염소산방출검사 정상이므로 유기화 장애이다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q189_p68.png","note":null,"id_simple":"2023-Q189"},{"id":"2023-L38-Q94","year":2023,"qnum":94,"jokbo_lec_no":38,"lecture":"갑상선세침흡인 / 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 세침흡인검사 판독에 있어서 Bethesda system이 갖는 의의로 옳은 것은?","stem_table":null,"options":["병리의사를 위한 분류체계로, 병리소견을 기반으로 진단의 통일성을 위해 제시되었으며, 임상적 유용성은 추후 증명이 필요하다.","각 암의 악성위험도(Risk of malignancy)를 제공하여 치료방침을 결정하는 데 도움을 준다.","Atypia of undetermined significance(AUS)의 경우는 악성위험도가 30%에 달하므로 수술을 우선적으로 고려해야 한다.","Molecular testing은 향후에는 치료방침을 결정하는 데 있어서 세침흡인검사를 대치할 것으로 기대된다.","Non-diagnostic 카테고리의 악성 위험도는 4% 미만으로, 향후 임상/초음파적 추적 관찰만이 필요하다."],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q94"},{"id":"2023-L38-Q99","year":2023,"qnum":99,"jokbo_lec_no":38,"lecture":"갑상선세침흡인 / 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"다음의 병리소견 중 부갑상선 암종으로 진단할 수 있는 소견은?","stem_table":null,"options":["종양이 갑상선과 유착되어 있다.","종양의 내부에 괴사와 출혈이 관찰되며 유사분열이 10mm2당 5개 이상 관찰된다.","종양세포 핵의 모양이 크고 이형성이 심한 bizarre nuclei가 관찰된다.","종양세포의 혈관침윤(vascular invasion)이 관찰된다.","종양이 75% 이상 oncocytic cell로 이루어져 있다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q99"},{"id":"2023-L38-Q114","year":2023,"qnum":114,"jokbo_lec_no":38,"lecture":"갑상선세침흡인 / 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 세침흡인검사(Fine needle aspiration)에 대한 설명으로 옳은 것은? *(복수정답: 1,","stem_table":null,"options":["최근에는 초음파를 이용하여 세침흡인검사를 주로 시행한다.","갑상선의 경우 핵을 잘 관찰해야 하므로 주로 Giemsa(May-Grunwald-Giemsa) 염색을 시행한다.","Liquid based cytology를 이용한 경우에는 세포의 손실이 적고 background가 잘 유지되어 있어서 보기 편하다.","Hashimoto's thyroiditis의 경우에는 배경에 림프구가 많이 관찰되면서 갑상선 여포세포는 호산성의 풍부한 세포질을 가지는 Oncocytic cell이 sheet 모양으로 관찰된다.","Follicular neoplasm의 경우에는 cellular smear를 보이면서 종양세포의 핵은 모양이 불규칙하고 groove나 pseudoinclusion을 관찰할 수 있다."],"answer":[1,4,5],"image":null,"note":null,"id_simple":"2023-Q114"},{"id":"2023-L38-Q182","year":2023,"qnum":182,"jokbo_lec_no":38,"lecture":"갑상선세침흡인 / 부갑상선질환의 병리","professor":"김영아","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"30세 여자 환자가 갑상선 결절을 주소로 내원하였다. 초음파 검사상 여러 개의 크고 작은 결절이 갑상선 전체에 걸쳐 나타났으며, 일부는 낭성 변화와 석회화를 동반하고 있었다. 환자는 세침흡인세포검사를 시행받고 정기적으로 추적 관찰을 받던 중 결절의 크기가 점진적으로 증가하면서 경부 불편감과 미용상의 이유로 절제 수술을 받았다. 다음은 절제된 갑상선 결절의 현미경 사진이다.\n이 질환에 대한 설명으로 다음 중 옳지 않은 것은?","stem_table":null,"options":["대체로 여러 개의 결절이 갑상선 전체에 걸쳐 관찰된다.","주변 실질과 유사한 세포의 증식으로 이루어져 있으며 follicle의 크기가 다양하다.","세침흡인세포검사에서 콜로이드가 잘 보이지 않고 Bethesda system 카테고리 III (Atypia of Undetermined Significance)로 진단되는 경우가 많다.","병변 내부에 낭성 변화, 섬유화 및 석회화를 동반할 수 있다.","피막은 불완전하거나 관찰되지 않는 경우가 많다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q182_p65.png","note":null,"id_simple":"2023-Q182"},{"id":"2023-L39-Q133","year":2023,"qnum":133,"jokbo_lec_no":39,"lecture":"병리실습","professor":"나희영","curr_lec_no":"49","curr_lecture":"병리실습","stem":"35세, 50세 여성 환자가 갑상선 결절을 주소로 내원하였다. 초음파 검사상 두 환자 모두 갑상선 우엽에 한 개의 종괴가 관찰되어 엽절제술을 받았다. 아래 좌, 우 사진은 각각 35세, 50세 환자의 서로 다른 갑상선 종괴의 현미경 사진이다.\n두 질환에 대한 설명으로 다음 중 옳지 않은 것은? *(복수정답: 2,","stem_table":null,"options":["좌, 우 질환을 감별하는 데는 현미경적으로 피막 및 혈관 침습을 확인하는 것이 중요하다.","좌, 우 질환은 수술 전 세침흡인세포검사에서도 감별할 수 있다.","우 질환의 경우 추후 남아있는 갑상선에 대한 절제술이 필요하다.","우 질환의 경우 분자검사에서 BRAF V600E 변이가 가장 흔하게 검출된다.","우 질환의 경우 WHO 분류에 의해 크게 세 가지로 분류된다."],"answer":[2,4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q133_p64.png","note":null,"id_simple":"2023-Q133"},{"id":"2023-L39-Q137","year":2023,"qnum":137,"jokbo_lec_no":39,"lecture":"병리실습","professor":"나희영","curr_lec_no":"49","curr_lecture":"병리실습","stem":"23세 여성환자가 갑상선 결절을 주소로 내원하였다. 초음파 검사상 갑상선 우엽에 크기 3x2cm의 주변과 비교적 경계가 좋은 고형성 종괴가 관찰되었고, 갑상선 좌엽에도 크기 1x0.5cm의 비슷한 양상의 종괴가 관찰되었다. 환자는 두 종괴에 대한 세침흡인검사 후 악성종양이라고 진단받고, 갑상선 전절제술을 시행받았다. 다음은 절제된 종괴의 대표사진이다.\n다음 중 옳지 않은 것은?","stem_table":null,"options":["환자는 갑상샘 외에도 부갑상샘, 부신에 질환이 생길 수 있다.","Familial form, sporadic form 모두 RAS 유전자의 변이가 흔하다.","오른쪽 사진의 화살표가 가리키는 것은 Amyloid이다.","면역염색에서 Calcitonin, CEA에 양성 소견을 보인다.","기원 세포는 Parafollicular C cell이다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q137_p65.png","note":null,"id_simple":"2023-Q137"},{"id":"2023-L40-Q122","year":2023,"qnum":122,"jokbo_lec_no":40,"lecture":"포도당 대사 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"다음 중 인슐린의 작용으로 올바른 조합은?","stem_table":"| 대사 경로 | 인슐린 작용 |\n|-----------|------------|\n| 글리코겐 분해(Glycogenolysis) | A |\n| 당신생(Gluconeogenesis) | 억제 |\n| 지방 분해(Lipolysis) | B |\n| 케톤 생성(Ketogenesis) | C |","options":["A 촉진, B 촉진, C 촉진","A 촉진, B 촉진, C 억제","A 촉진, B 억제, C 억제","A 억제, B 억제, C 억제","A 억제, B 억제, C 촉진"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q122"},{"id":"2023-L40-Q140","year":2023,"qnum":140,"jokbo_lec_no":40,"lecture":"포도당 대사 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"김OO씨는 특정 사회문제에 대하여 단식농성을 시작한 지 5주째 접어들고 있다. 현재 김OO씨의 체내 대사작용에 대한 기술 중 가장 가능성이 높은 것은?","stem_table":null,"options":["근육세포는 주로 glycogen을 에너지원으로 사용하고 있다.","근육세포는 단백질분해를 계속 증가하여 간세포의 gluconeogenesis를 촉진한다.","뇌(brain)는 주된 에너지원으로 ketone body를 사용하고 있다.","간세포는 주된 에너지원으로 glucose를 사용하고 있다.","지방세포의 lipolysis는 감소되어 있다."],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q140"},{"id":"2023-L40-Q150","year":2023,"qnum":150,"jokbo_lec_no":40,"lecture":"포도당 대사 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"50세 남성인 김철수씨는 최근 심해진 비만으로 병원에 내원하여 혈액검사를 받은 결과, 공복혈당치와 당화혈색소 수치가 정상범위를 크게 상위하여 제2형 당뇨병으로 진단받았다. 김철수씨의 대사상황에 대해 가장 가능성이 높은 설명은?","stem_table":null,"options":["지방세포에서의 Triacylglycerol 합성이 증가되어 있다.","지방세포로의 Fatty acid 유입이 증가되어 있다.","지방세포로의 glucose 유입이 증가되어 있다.","혈중 Adiponectin level이 감소되어 있다.","혈중 Triacylglycerol 양이 감소되어 있다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q150"},{"id":"2023-L41-Q105","year":2023,"qnum":105,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"22세 여자가 의식을 잃고 응급실에 왔다. 당시 혈중 glucose 35 mg/dl였다. 18세에 1형 당뇨병을 진단받고, 현재 인슐린 다회주사요법으로 혈당조절 중이다. 아래 저혈당에 대한 체내 보호 기전 중, 이 환자에게 의식소실의 가장 중요한 원인이 된 것으로 판단되는 것(제대로 작용하지 못해 문제가 된 것)을 1개 고르시오.","stem_table":null,"options":["내인성 인슐린 분비 감소/억제","글루카곤 분비 증가","에피네프린 분비 증가","코르티솔 분비 증가","성장호르몬 분비 증가"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q105"},{"id":"2023-L41-Q163","year":2023,"qnum":163,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"58세 남자가 6개월간 체중이 10kg 감소하여 병원에 왔다. 평소 키 174cm, 체중 86kg이었는데 특별한 이유 없이 체중이 76kg으로 감소하였으며 4개월 전부터 소변량이 늘어서 자다가 2-3회 깨는 경우가 많다고 한다. 1년 전 건강검진에서 공복혈당장애 판정을 받았다고 한다. 평소 술은 잘 마시지 않으며 복용 중인 약물이나 수술받은 적은 없다고 한다. 당뇨병의 가족력은 없었다.\n진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| 공복 시 포도당 | 296 mg/dL | |\n| 당화혈색소 | 10.3% | |\n| 혈액요소질소 | 28 mg/dL | |\n| 크레아티닌 | 1.3 mg/dL | |\n| 혈장 삼투질농도 | 298 mOsm/kg H2O | |\n| C-펩티드 | <0.1 ng/mL | 0.8~3.5 |\n| GAD65 Ab | 양성 | |\n| 소변 포도당 | 3+ | |\n| 소변 케톤 | +/- | |","options":["GCK-MODY","Type 1 Diabetes","Type 2 Diabetes","Pancreatitis Related Diabetes","Maternally Inherited Diabetes and Deaf"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q163"},{"id":"2023-L41-Q166","year":2023,"qnum":166,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음 중 추가 검사 없이 당뇨병으로 진단할 수 있는 경우는?","stem_table":null,"options":["당화혈색소가 6.5%인 경우","공복 혈당이 126 mg/dL인 경우","식후 1시간째 혈당이 180 mg/dL인 경우","75그램 당부하 2시간 혈당이 210 mg/dL인 경우","당뇨병의 전형적인 증상이 있으면서 식후 혈당이 350 mg/dL인 경우"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q166","reparsed":true},{"id":"2023-L41-Q174","year":2023,"qnum":174,"jokbo_lec_no":41,"lecture":"당대사 분류와 진단","professor":"곽수헌","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음 중 당화혈색소에 대한 설명으로 맞지 않은 것은?","stem_table":null,"options":["HbA1c가 가장 널리 사용된다.","당뇨병 진단 기준으로 사용된다.","지난 60-90일의 평균 혈당을 반영한다.","효소에 의해 촉매되어 나타나는 현상이다.","포도당이 혈색소에 비가역적으로 결합하는 원리를 이용한다."],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q174"},{"id":"2023-L42-Q97","year":2023,"qnum":97,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음에서 설명하는 만성 미세혈관합병증의 발생 기전은?\nMethylglyoxal, Glyoxal, 3-deoxyglucosone으로부터 형성되는 물질이 세포내단백질, 세포외기질, 혈장 단백질의 변형을 초래하고 이로 인해 산화스트레스 증가, 염증반응에 관여하는 유전자발현 증가 등을 통해 세포 손상을 유도한다.","stem_table":null,"options":["Polyol pathway","Hexosamine pathway","Protein kinase C pathway","Renin-angiotensin pathway","Advanced glycosylation end products pathways"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q97"},{"id":"2023-L42-Q154","year":2023,"qnum":154,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"56세 남성이 거품뇨로 내원하였다. 환자는 10년 전 당뇨병으로 진단받고 경구혈당강하제로 치료 중이다. 다음 중 환자의 신장병증 스크리닝을 위해 필요한 검사는?","stem_table":null,"options":["24hour urine albumin, serum creatinine, kidney biopsy","spot urine microalbumin, spot urine creatinine, kidney biopsy","24hour urine albumin, serum creatinine, glomerular filtration rate","spot urine microalbumin, serum creatinine, glomerular filtration rate","spot urine microalbumin, spot urine creatinine, glomerular filtration rate"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q154"},{"id":"2023-L42-Q158","year":2023,"qnum":158,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"56세 남성이 당뇨병 관리를 위해 내원하였다. 합병증 검진상 다음과 같은 소견을 보였다. 치료는?","stem_table":null,"options":["ACE Inhibitor","Anti-VEGF","Pregabalin","SGLT2 Inhibitor","Mineralocorticoid Receptor Antagonist"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q158"},{"id":"2023-L42-Q179","year":2023,"qnum":179,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"72세 여성이 발이 저리다며 왔다. 양발이 다 저리며 차갑고 시리지만, 오른쪽이 더 불편하다고 하였다. 환자의 증상은 가만히 있거나 야간에 악화되었고, 운동 시에는 오히려 호전되었다. 환자는 30년 전 당뇨병으로 진단받고 경구혈당강하제로 치료 중이다. 환자의 병력 중 당뇨병신경병증에 잘 부합하지 않는 증상은?","stem_table":null,"options":["양발이 다 저리며 차갑고 시리다.","오른쪽이 더 불편하다.","가만히 있을 때나 야간에 악화","운동 시에는 오히려 호전","30년 전 당뇨병으로 진단"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q179"},{"id":"2023-L42-Q185","year":2023,"qnum":185,"jokbo_lec_no":42,"lecture":"당뇨병의 만성합병증","professor":"문민경","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음이 설명하는 연구는?\n- 1441명의 1형당뇨병 환자를 대상으로 인슐린펌프 혹은 다회인슐린주사법을 이용한 intensive therapy가 하루 1-2회 인슐린주사를 이용한 conventional therapy에 비해 당뇨병 합병증 발생을 예방하거나 진행을 막을 수 있는지를 보고자 했던 임상연구\n- 연구기간동안 당화혈색소 7% 정도로 조절되었던 intensive 치료군에서 retinopathy, nephropathy, 심혈관질환 발생이 유의하게 적었음.\n- 철저한 혈당 조절 및 조기 혈당 조절의 이점을 증명한 연구","stem_table":null,"options":["Veterans Affairs Diabetes Trial(VADT)","UK prospective diabetes study(UKPDS)","Diabetes Control and Compliance Trial(DCCT)","Action to Control Cardiovascular Risk in Diabetes Trial(ACCORD)","Action in Diabetes and Vascular Disease: Preterax and Diamicron MR Controlled Evaluation trial(ADVANCE)"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q185"},{"id":"2023-L43-Q157","year":2023,"qnum":157,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"인슐린 결핍으로 인한 체내 변화로 옳은 것은?","stem_table":null,"options":["혈중 유리지방산 증가","혈중 아미노산 감소","케톤 생성 감소","혈중 포도당 감소","단백 합성 증가"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q157"},{"id":"2023-L43-Q170","year":2023,"qnum":170,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"80세 남자가 말이 어눌해지고 가족을 알아보지 못하여 응급실로 실려왔다. 10년 전 뇌경색이 있어 고혈압약, 고지혈증약, 아스피린 등을 복용 중이었으나 병원에 잘 가지 않았다. 최근 1개월간 기운이 약해져서 주로 집에서 누워 지내고 섭식이 감소하면서 체중이 감소한 것을 제외하면 특별한 특이 증상을 호소하지는 않았다. 과호흡이나 과일향 호흡은 관찰되지 않았다.\n이 환자에게 혈액검사를 위한 채혈 후 가장 먼저 해야할 일은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| 혈압 | 100/50 mmHg |\n| 맥박 | 120회/분 |\n| 호흡수 및 체온 | 정상 |\n| 혈당측정기 | 측정불가(high) |","options":["인슐린 정주","생리식염수 정주","칼륨 투여","brain MRI 촬영","포도당 용액 정주"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q170"},{"id":"2023-L43-Q175","year":2023,"qnum":175,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"당뇨병성 케톤산증의 임상상으로 가장 합당한 것은?","stem_table":null,"options":["저혈압","서맥","저체온","호흡수 감소","저혈당"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q175"},{"id":"2023-L43-Q176","year":2023,"qnum":176,"jokbo_lec_no":43,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"12세 남아가 복통으로 병원에 왔다. 내원 1일 전 점심에 김밥을 먹은 이후 복통을 호소하였고 오심, 구토가 있어 저녁부터 전혀 먹지 못하였다고 한다. 내원 3주 전부터 물을 많이 마시고 자주 소변을 보고 야간에도 자주 깨서 소변을 보았다. 마지막 소변은 8시간 전에 보았다. 키는 145cm (50백분위수), 체중 50kg (70백분위수)이고, 진찰상 고환 6cc, 음모는 성성숙도 1단계이다. 당뇨병 가족력은 없다.\n수액과 인슐린을 투여한지 5시간 후에 갑자기 심한 두통과 시야장애를 호소하였다. 다음 중 가장 적절한 조치는?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|-----------|------|--------|\n| pH | 7.05 | |\n| HCO3- | 8 mEq/L | |\n| 포도당 | 490 mg/dL | |\n| 당화혈색소 | 13% | |\n| Na+ | 128 mEq/L | 135-145 |\n| K+ | 5.3 mEq/L | 3.5-5.5 |\n| BUN | 32 mg/dL | 10-26 |\n| Cr | 0.9 mg/dL | |\n| 유리 T4 | 0.9 ng/dL | 0.8-2.0 |\n| 갑상선자극호르몬 | 2.4 mIU/L | 0.5-6.5 |\n| 소변 포도당 | 4+ | |\n| 소변 케톤 | 3+ | |","options":["뇌수막염 우려가 있으므로 항생제를 투여한다.","산증의 빠른 교정을 위해서 중탄산염을 주입한다.","인슐린 지속정맥 주입속도를 1/3로 감량한다.","뇌 영상검사를 시행하여 뇌부종을 진단한 후에 수액속도를 1/3로 줄인다.","즉시 만니톨을 정주한다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q176"},{"id":"2023-L44-Q111","year":2023,"qnum":111,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"당뇨병은 대표적 만성질환으로, 지속적인 관리가 중요하다. 최근 연구 결과들을 근거로 볼 때, 당뇨병 관리 방법으로 적절하지 않은 것은?","stem_table":null,"options":["환자의 나이, 동반 질환, 남은 기대 여명 등을 고려하여, 통합적인 관리가 필요하다.","과체중 또는 비만일 경우, 체중 감소가 혈당 조절 및 합병증 예방에 도움이 된다.","생활습관 개선은 한계가 있으므로 초기부터 약제를 바로 사용하는 것이 좋다.","혈당 외에도, 혈압, 지질 등을 통합적으로 관리하는 것이 중요하다.","저혈당이 오지 않는 범위에서 혈당 조절을 안정적으로 유지하는 것이 중요하다."],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q111"},{"id":"2023-L44-Q113","year":2023,"qnum":113,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"72세 남성이 운동 중 호흡곤란으로 왔다. 환자는 20년 전 당뇨병을 진단받고 Metformin과 인슐린으로 치료 중이고, 5년 전 관상동맥질환으로 수술(CABG)을 받았다. 키 170cm, 체중 71kg, 혈압 120/80 mmHg이다. Angiotensin Receptor Blocker와 Beta Blocker, High intensity Statin, Aspirin을 복용 중이다. 추가로 필요한 치료는?","stem_table":"| 검사 | 결과 |\n|------|------|\n| Fasting glucose | 106 mg/dL |\n| HbA1c | 6.8% |\n| BUN/Cr | 21/1.5 mg/dL (eGFR 48 mL/min/1.73m2) |\n| U/A albumin | 2+ |\n| Total cholesterol | 103 mg/dL |\n| Triglyceride | 117 mg/dL |\n| HDL-cholesterol | 32 mg/dL |\n| AST/ALT | 38/32 IU/L |\n| NT-proBNP | 206.1 pg/mL (0~125) |","options":["Calcium channel blocker","ezetimibe","GLP-1 receptor agonist","SGLT2 inhibitor","Thiazolidinedione"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q113"},{"id":"2023-L44-Q114","year":2023,"qnum":114,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 중 당뇨병 약제에 대한 설명으로 맞는 것은?","stem_table":null,"options":["설폰요소제는 ATP sensitive K-channel에 binding하여 인슐린 분비를 유도하여 혈당 강하 효과는 좋고 저혈당의 위험성도 낮다.","메트포민은 저혈당이 거의 오지 않는 장점이 있지만 혈당 강하 효과는 적은 편이다.","Thiazolidinedione 약제는 혈당 강하 효과 이외에도 체중 감소 효과가 있다.","GLP-1 유사체는 장에서 당분해를 지연시켜, 탄수화물 섭취가 많은 동양인의 혈당 조절에 도움이 된다.","최근에 개발된 sodium-glucose cotransporter-2 억제제는 혈당 강하 효과가 좋고, 체중 감소 효과도 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q114"},{"id":"2023-L44-Q121","year":2023,"qnum":121,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 당뇨병 치료제에 대한 설명으로 가장 옳은 내용은?","stem_table":null,"options":["Teplizumab은 제2형 당뇨병 발생을 지연시킨다.","Sulfonylurea와 Meglitinide 유사체 약물은 작용기전이 다르다.","SGLT2 억제제는 신기능 저하환자에서 혈당배출 작용이 유지된다.","Glargine, Degludec 등 Long acting 인슐린 제제는 정맥투여 용법이 가능하다.","Metformin은 신장에서 유기양이온 수송체(Organic Cation transporters)에 의해 배출된다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q121"},{"id":"2023-L44-Q138","year":2023,"qnum":138,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 중 당뇨병 환자의 치료는 경구용 당뇨병 치료제와 주사제인 인슐린 치료가 있다. 당뇨병 환자에서 인슐린 치료에 대한 설명으로 적절하지 않은 것은?","stem_table":null,"options":["임신성 당뇨병으로 진단받고 혈당이 높은 경우, 인슐린 치료가 필요하다.","당화혈색소 9% 이상의 심한 고혈당으로 다음, 다뇨, 다식 증상 및 체중감소가 동반될 때 인슐린 치료를 하는 것이 좋다.","당뇨병성 케톤산혈증과 같은 급성 대사성 합병증이 동반될 때 인슐린 치료가 권장된다.","심한 신장 또는 간 기능 이상이 있어, 경구용 당뇨병 약제를 사용하기가 어려울 때 인슐린 치료를 하여야 한다.","췌장 기능은 유지되나, 인슐린 저항성이 심한 경우, 경구용 당뇨병 치료제보다, 우선적으로 인슐린을 사용하는 것이 좋다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q138"},{"id":"2023-L44-Q143","year":2023,"qnum":143,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중 체중에 대한 영향이 나머지 약물들과 다른 약물은?","stem_table":null,"options":["Glipizide","Repaglinide","Glibenclamide","Empagliflozin","Lobeglitazone"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q143"},{"id":"2023-L44-Q173","year":2023,"qnum":173,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중에서 약리학적 기전이 나머지 약물과 가장 다른 약물은?","stem_table":null,"options":["Liraglutide","Pioglitazone","Repaglinide","Glimepiride","Sitagliptin"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q173"},{"id":"2023-L46-Q96","year":2023,"qnum":96,"jokbo_lec_no":46,"lecture":"임신성/노인 당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"다음 중 노인증후군에 대한 설명으로 맞지 않은 것은?","stem_table":null,"options":["여러 장기에 다양한 기저 원인으로 발생한다.","삶의 질이나 신체장애에 미치는 영향이 크다.","노인에서 분리된 질병으로 구별되지 않는 임상 증후군이다.","인지장애, 다약제, 우울증, 요실금, 낙상, 통증 등이 동반된다.","최대한 진단적 검사를 시행하여 원인에 맞는 치료만 시행해야 한다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q96"},{"id":"2023-L46-Q148","year":2023,"qnum":148,"jokbo_lec_no":46,"lecture":"임신성/노인 당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"임신성 당뇨병이 산모와 태아에 미치는 영향으로 맞지 않는 것은?","stem_table":null,"options":["Large for gestational age","Primary Cesarean Delivery","Clinical neonatal hypoglycemia","Increased risk of offspring obesity","Decreased risk of maternal type 2 diabetes"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q148"},{"id":"2023-L46-Q167","year":2023,"qnum":167,"jokbo_lec_no":46,"lecture":"임신성/노인 당뇨병","professor":"곽수헌","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"임신 중 나타나는 호르몬 및 에너지 대사의 변화로 맞는 것은?","stem_table":null,"options":["지방 분해가 감소한다.","임신 중 인슐린 분비능력은 감소한다.","식후 보다는 공복혈당 상승이 특징적이다.","임신 후반기로 갈수록 human placental lactogen이 감소한다.","임신 후반기에는 임신 전에 비하여 인슐린 저항성이 약 3배 증가한다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q167"},{"id":"2023-L47-Q144","year":2023,"qnum":144,"jokbo_lec_no":47,"lecture":"소아청소년 당뇨병","professor":"이영아","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"12세 남아가 체중이 많아 내원하였다. 키는 156cm(75백분위수), 체중은 65kg(97백분위수), BMI는 26.7(98백분위수)였다. 골연령은 12세로 측정되었고 고환은 양쪽 모두 4mL, 음경은 성숙속도 2단계였다. 사진과 같이 목 피부에 검은 착색 소견을 보였다. 아침 8시 공복 채혈검사를 시행하였다. 가능성이 가장 높은 검사 결과는?","stem_table":null,"options":["저혈당","인슐린 증가","코르티솔 증가","성장호르몬 감소","갑상선호르몬 감소"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q144"},{"id":"2023-L47-Q159","year":2023,"qnum":159,"jokbo_lec_no":47,"lecture":"소아청소년 당뇨병","professor":"이영아","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"12세 남아가 학교검진에서 요당이 확인되어 병원에 왔다. 키는 145cm(50백분위수), 체중 65kg(95백분위수)이고 체질량지수 99백분위수 이상이다. 진찰에서 고환 10cc, 음모는 성성숙도 2단계이다. 목 주변과 겨드랑이에 피부착색이 확인되었다. 당뇨병 가족력으로는 외할아버지(50대 진단)와 아빠(40대 진단)가 당뇨병으로 경구혈당강하제 복용중이다.\n가장 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| pH | 7.29 | |\n| HCO3- | 16 mEq/L | |\n| 포도당 | 320 mg/dL | |\n| 당화혈색소 | 9.5% | |\n| Na+ | 134 mEq/L | 135-145 |\n| K+ | 4.9 mEq/L | 3.5-5.5 |\n| BUN | 25 mg/dL | 10-26 |\n| Cr | 0.9 mg/dL | |\n| C-peptide | 0.9 ng/mL | 0.6 이상 |\n| 소변 포도당 | 4+ | |\n| 소변 케톤 | (-) | |","options":["인슐린 치료가 필요하다.","비만 2형 당뇨병이므로 경구혈당강하제 단독으로 치료한다.","유전성 당뇨병(monogenic diabetes) 가능성이 높다.","생활습관 교정하여 경구혈당강하제를 중단하고 당화혈색소 8% 미만을 유지한다.","자가면역 갑상선염 동반이 흔하다."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q159"},{"id":"2023-L47-Q171","year":2023,"qnum":171,"jokbo_lec_no":47,"lecture":"소아청소년 당뇨병","professor":"이영아","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"5세 여아가 계속 자려고 하여 병원에 왔다. 내원 1일 전부터 복통과 구토를 호소하여 잘 먹지 못하였다고 한다. 이전에 소변을 가렸었는데 3주 전부터 밤중 이불에 소변 실수를 하고 목마르다고 물을 많이 찾았다고 한다. 키는 50백분위수이고 유방은 성성숙도 1단계이다. 가족력으로는 외할머니, 아빠가 당뇨병으로 현재 경구혈당강하제 복용중이다.\n적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| pH | 7.1 | |\n| HCO3- | 9 mEq/L | |\n| 포도당 | 447 mg/dL | |\n| 당화혈색소 | 13% | |\n| Na+ | 129 mEq/L | 135-145 |\n| K+ | 4.3 mEq/L | 3.5-5.5 |\n| BUN | 32 mg/dL | 10-26 |\n| Cr | 0.8 mg/dL | |\n| 유리 T4 | 0.9 ng/dL | 0.8-2.0 |\n| TSH | 2.4 mIU/L | 0.5-6.5 |\n| 소변 포도당 | 4+ | |\n| 소변 케톤 | 3+ | |","options":["인슐린 부족이 원인이므로 0.1U/kg 주사를 정맥 볼루스로 빠르게 주입한다.","처음 포도당 수치에 따라 36~48시간 주입할 수액 주입량을 결정한다.","산증이 혈당보다 먼저 정상화되므로 pH 정상화되면 포도당 수액을 섞어준다.","혈액 K+ 농도가 감소하는 경우에 수액에 K+ 섞어준다.","평생 인슐린 치료가 필요하다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q171"},{"id":"2023-L48-Q118","year":2023,"qnum":118,"jokbo_lec_no":48,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"42세 남성이 의식 소실로 왔다. 응급실에 도착하여 시행한 혈액 검사에서 glucose 32 mg/dL였다. 포도당 정맥 주사 후 glucose 118 mg/dL로 상승하였고, 의식은 호전되었다. 1년간 잦은 공복감으로 자주 간식을 먹어 체중이 3kg 증가한 것 외, 특별한 과거 병력은 없었다. 최근 1주일은 새벽마다 심한 공복감이 있었고, 가슴 두근거림과 심한 어지러움을 호소해왔었다. 증상은 음료수 섭취로 호전되었다.\n이 환자에게 가장 우선적으로 시행해 볼 검사로 적절한 것을 고르시오.","stem_table":null,"options":["72시간 공복검사","Mixed meal test","현재 상태에서 C-peptide, Insulin 측정","HbA1c 측정","복부 CT"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q118"},{"id":"2023-L48-Q161","year":2023,"qnum":161,"jokbo_lec_no":48,"lecture":"저혈당증","professor":"구보경","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"42세 남성이 의식 소실로 왔다. 응급실에 도착하여 시행한 혈액 검사에서 glucose 32 mg/dL였다. 포도당 정맥 주사 후 glucose 118 mg/dL로 상승하였고, 의식은 호전되었다. 1년간 잦은 공복감으로 자주 간식을 먹어 체중이 3kg 증가한 것 외, 특별한 과거 병력은 없었다. 최근 1주일은 새벽마다 심한 공복감이 있었고, 가슴 두근거림과 심한 어지러움을 호소해왔었다. 증상은 음료수 섭취로 호전되었다. 위 환자의 복부 CT에서 췌장에 mass가 발견되었다.\n수술 대기 중 다시 저혈당이 발생했다. 혈당 50 mg/dL인 상태에서 채혈했을 때, 혈중 C-peptide, insulin 농도로 가장 가능성이 높은 것을 고르시오.","stem_table":null,"options":["Plasma insulin <3 μU/mL, plasma c-peptide <0.6 ng/mL","Plasma insulin >3 μU/mL, plasma c-peptide <0.6 ng/mL","Plasma insulin <3 μU/mL, plasma c-peptide >0.6 ng/mL","Plasma insulin >3 μU/mL, plasma c-peptide >0.6 ng/mL","Plasma c-peptide >0.6 ng/mL이며 plasma insulin은 예측할 수 없다."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q161","reparsed":true},{"id":"2023-L49-Q98","year":2023,"qnum":98,"jokbo_lec_no":49,"lecture":"Lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"영희는 점심에 배달음식으로 배부르게 식사를 하였다. 식후 2시간 후 영희의 체내에서 일어나고 있는 에너지대사작용으로 가장 가능성이 낮은 것은?","stem_table":null,"options":["간세포(hepatocyte)에서 glycogen 생합성이 증가되어 있다.","근육세포에서 glycogen 생합성이 증가되어 있다.","간세포에서 Chylomicron의 합성이 증가되어 있다.","간세포에서 잉여아미노산은 triacylglycerol로 전환될 수 있다.","지방세포에서 pentose phosphate pathway가 활성화되어 있다."],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q98"},{"id":"2023-L49-Q136","year":2023,"qnum":136,"jokbo_lec_no":49,"lecture":"Lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"42세의 남성이 응급실에 실려왔다. 이 남자는 고속도로 터널 공사 현장이 무너져 내리면서 갇혀 지낸 지 9일만에 구조된 상태였으며, 그동안 물 외에는 섭취한 음식 없이 버텨왔다고 하였다. 다음 중 정상인에 비해 이 환자의 호기 가스(Expiratory gas)에서의 농도가 높을 가능성이 높은 분자는?","stem_table":null,"options":["Acetoacetate","Acetone","Acetyl CoA","Benzene","3-Hydroxybutyrate"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q136"},{"id":"2023-L49-Q153","year":2023,"qnum":153,"jokbo_lec_no":49,"lecture":"Lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"27세 여성이 건강검진을 위해 검진 전날 저녁 6시 이후로 물 외에는 구강섭취하지 않은 상태다. 검진 당일 아침 공복 상태에서, 해당 검진자에게 에너지원이 되는 지질을 간으로부터 혈류로 운반하는 주된 지단백질 형태는?","stem_table":null,"options":["Very low density lipoproteins","High density lipoproteins","Low density lipoproteins","Apolipoprotein A","Chylomicrons"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q153"},{"id":"2023-L50-Q123","year":2023,"qnum":123,"jokbo_lec_no":50,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"24세 남성이 심한 복통으로 응급실에 왔다. 검사 결과 급성췌장염으로 수액 및 약물 치료를 시작하며 시행한 혈액 검사상 중성지방(Triacylglyceride)이 2000 mg/dL (정상 150 mg/dL 이하)으로 측정되었고, Amylase/Lipase가 정상의 10배 이상 상승되었다. 담도 및 췌장관에 돌이나 종양 등의 특이소견은 발견되지 않았다. 환자는 음주력은 부인하였다. 과거력상 수년 전에도 복통이 있었고 중성지방이 높다는 소견을 들었으나, 이후 특별한 약물 치료를 시행하지 않았다. 환자에게 예상되는 이상소견으로 가장 적합한 것은?","stem_table":null,"options":["PCSK9","Apolipoprotein B","Apolipoprotein A","Lipoprotein lipase","Cholesterol Ester Transfer Protein(CETP)"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q123"},{"id":"2023-L50-Q128","year":2023,"qnum":128,"jokbo_lec_no":50,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"46세 여자로 3년 전 당뇨병을 진단받고 약물 치료 중이다. 키 163cm, 몸무게 78kg으로 식단 조절과 운동 등 노력을 하였으나 10년 이상 체중감량에 성공하지 못했다. 최근 이상지질혈증도 약물 투여가 필요한 수치라고 듣고 Statin 약물 처방을 받았다. 대표적인 이차성 이상지질혈증의 하나인 이 환자에서 나타나는 이상지질혈증의 형태인 것은?","stem_table":null,"options":["Apo-A1 지단백의 증가","고밀도콜레스테롤 상승","small-dense LDL의 증가","지방조직에서 지방분해(lipolysis) 감소","Cholesterol-Ester Transfer Protein(CETP) 활성화 감소"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q128"},{"id":"2023-L50-Q145","year":2023,"qnum":145,"jokbo_lec_no":50,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"저밀도 콜레스테롤(Low density lipoprotein) 수용체가 쉽게 Lysosome에서 분해되도록 유도하여 저밀도 콜레스테롤 수용체 재활용을 현저하게 방해하는 물질로 최근 이에 대한 억제제(Inhibitor)가 저밀도 콜레스테롤을 낮추는 중요한 치료제로 사용되고 있는 물질은 무엇인가?","stem_table":null,"options":["PCSK9","Apolipoprotein A","Apolipoprotein C II","Hormone sensitive lipase","Cholesteryl Ester Transfer Protein(CETP)"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q145"},{"id":"2023-L50-Q169","year":2023,"qnum":169,"jokbo_lec_no":50,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"다음 중 간 세포에서 LDL 수용체 발현을 감소시키는 효과가 가장 큰 것은?","stem_table":null,"options":["Bile acid sequestrating resins","Fibric acids","Lipoprotein lipase","PCSK9","Statins"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q169"},{"id":"2023-L51-Q127","year":2023,"qnum":127,"jokbo_lec_no":51,"lecture":"이상지질혈증의 치료 약물 기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"다음 중 Ezetimibe 약물의 고지혈증 치료기전으로 가장 적절한 것은?","stem_table":null,"options":["소장 융모(Brush border)에서 콜레스테롤 흡수를 억제함.","위 점막 상피세포에서 콜레스테롤 대사를 촉진함.","대장 상피세포에서 콜레스테롤 대사를 억제함.","콜레스테롤과 결합해서 소변으로 배출을 증가시킴.","담즙산의 장-간 순환을 방해해서 콜레스테롤 대사를 억제함."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q127"},{"id":"2023-L51-Q134","year":2023,"qnum":134,"jokbo_lec_no":51,"lecture":"이상지질혈증의 치료 약물 기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"45세의 남성 환자가 건강검진에서 LDL cholesterol이 180mg/dL (참고치, <100 mg/dL), 그리고 triglycerides가 210 mg/dL로 높다는 진단을 받았다. 환자는 이후 Lovastatin 40mg을 처방받아, 복용 후 cholesterol을 효과적으로 낮출 수 있었다. 다음 중 lovastatin에 의한 변화로 적절치 않은 것은?","stem_table":null,"options":["LDL 수용체의 발현을 증가시켰다.","혈중 LDL 레벨을 감소시켰다.","혈중 VLDL 레벨을 감소시켰다.","근육통을 유발하였다.","Lipoprotein lipase 발현을 증가시켰다."],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q134"},{"id":"2023-L52-Q146","year":2023,"qnum":146,"jokbo_lec_no":52,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"28세 남성이 발목 부위 아킬레스건이 두꺼워 운동할 때마다 불편하여 정형외과에 내원하였다. 이전 병원에 내원하여 검사한 병력은 없었고, 아버지가 뇌졸중으로 사망하였고, 형이 36세에 불안정성 협심증으로 스텐트 시술을 시행하였다. 신체검진과 X-ray 소견상 황색건종(Tendon xanthoma)가 발견되어 혈액검사를 시행하였고, 결과는 다음과 같다.\nT.cholesterol/TG/HDL-C/LDL-C : 450/80/40/395 mg/dL\n이 환자에서 고용량의 스타틴과 에제티미브 병합 치료를 6개월간 시행하였고, 치료 후 측정한 LDL-cholesterol의 수치는 208 mg/dL였다. 이상지질혈증 치료 가이드라인을 고려하여 다음에 시행할 치료로 가장 맞는 것은?","stem_table":null,"options":["Fenofibrate","Omega-3 fatty acid","고용량 Vitamin E","PCSK9 억제제","고강도의 운동 강화 치료"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q146"},{"id":"2023-L52-Q156","year":2023,"qnum":156,"jokbo_lec_no":52,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"52세 남자로, 7년 전에 2형 당뇨병으로 진단받고, 경구약물치료 중이었고, 3년 전 불안정성 협심증이 있어 관상동맥 스텐트 시술을 받았고 고혈압약물, 항혈소판제를 복용 중이다. 가족력상 아버지가 뇌졸중과 당뇨병 병력이 있었다. 흡연력이 있고 30 pack/year였다.\nT.chol/TG/HDL/LDL = 220/170/38/145 mg/dL\n이 환자의 위험도를 고려한 1차 치료제로 가장 맞는 것은?","stem_table":null,"options":["Statin","Fenofibrate","Omega-3 fatty acid","PCSK9 억제제","약물 치료 없이 생활운동 요법만 시행"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q156"},{"id":"2023-L52-Q180","year":2023,"qnum":180,"jokbo_lec_no":52,"lecture":"이상지질혈증의 치료","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"35세 남자 환자가 건강검진에서 우연히 발견된 혈액 검사 이상소견으로 내원하였다. 가족력으로는 아버지가 44세에 뇌졸중이 발생한 바 있다.\n이 환자의 경우 일차 치료의 표적이 될 수 있는 효소는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| Total cholesterol | 347 mg/dL | 150-200 |\n| HDL cholesterol | 32 mg/dL | 40-80 |\n| Triacylglycerol | 145 mg/dL | 0-150 |\n| LDL cholesterol | 286 mg/dL | 0-100 |","options":["Acyltransferase","HMG-CoA reductase","Malate dehydrogenase","Acyl CoA dehydrogenase","Phosphocarboxylase serine kinase 9"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q180"},{"id":"2023-L53-Q102","year":2023,"qnum":102,"jokbo_lec_no":53,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"이소성 지방(ectopic fat) 축적에 의해 포도당 생산이 증가하는 장기는?","stem_table":null,"options":["갈색지방","근육","신장","비장","간"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q102"},{"id":"2023-L53-Q116","year":2023,"qnum":116,"jokbo_lec_no":53,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"키 165.2cm 체중 93.9kg, 허리둘레 116cm인 20대의 서로 다른 두 여성의 복부 CT 소견이다.\n다음 설명 중 옳을 가능성이 가장 높은 것은?","stem_table":null,"options":["A는 B보다 피하지방에 비해 내장지방이 적다.","A는 B보다 2형 당뇨병 위험이 높다.","A는 B보다 인슐린 감수성이 높다.","A는 B보다 혈압이 낮다.","A는 B보다 지방 조직내 염증이 적다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q16_p58.png","note":null,"id_simple":"2023-Q116"},{"id":"2023-L53-Q119","year":2023,"qnum":119,"jokbo_lec_no":53,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"위장관 호르몬 중 식욕을 증가시키는 것은?","stem_table":null,"options":["ghrelin","oxyntomodulin","GIP","GLP-1","PYY"],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q119"},{"id":"2023-L54-Q103","year":2023,"qnum":103,"jokbo_lec_no":54,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"다음은 다양한 항비만약제의 체중감량 효과를 나타내고 있다. G에 해당하는 약제는?","stem_table":null,"options":["bupropion/naltrexone","phentermine","phentermine/topiramate","orlistat","tirzepatide"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q103_p71.png","note":null,"id_simple":"2023-Q103"},{"id":"2023-L54-Q112","year":2023,"qnum":112,"jokbo_lec_no":54,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"WHO에서 정의하는 허리둘레는 어느 수준에서 측정하는가?","stem_table":null,"options":["A","B","C","A,B의 평균","B,C의 평균"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q112_p72.png","note":null,"id_simple":"2023-Q112"},{"id":"2023-L54-Q132","year":2023,"qnum":132,"jokbo_lec_no":54,"lecture":"비만과 관련질환의 진단과 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"다음 비만대사수술 기법 중 흡수장애를 가장 많이 일으키는 것은?","stem_table":null,"options":["A","B","C","D","모두 유사함"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q132_p72.png","note":null,"id_simple":"2023-Q132"},{"id":"2023-L55-Q131","year":2023,"qnum":131,"jokbo_lec_no":55,"lecture":"소아청소년 비만, 저혈당","professor":"이성용","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"4세 남아가 의식 저하로 내원하였다. 환아는 하루 전 가족여행을 마치고 귀가하여 저녁식사는 오후 5시경 평소의 1/3 정도의 양을 먹고 일찍 잠이 들었다. 부모는 환아가 피곤해 하는 듯하여 아침에도 충분히 늦잠을 자도록 깨우지 않았다. 오전 10시경 식은땀을 흘리고 아무리 깨워도 일어나지 못하여 응급실로 내원하였다.\n이 환자에 대한 설명으로 옳은 것은?","stem_table":"| 검사 | 결과 |\n|------|------|\n| 혈당 | 40 mg/dL |\n| 소변케톤 | 3+ |\n| 혈장 인슐린 | 1.9 uIU/mL |","options":["8-9세경 저절로 호전된다.","Diazoxide 치료에 잘 반응한다.","4-6시간 금식 시 급격하게 발생한다.","혈장 유리지방산(Free Fatty acid) 농도가 낮다.","정상 혈당 유지를 위해 15-20mg/kg/min 이상의 포도당 주입이 필요하다."],"answer":[1],"image":null,"note":null,"id_simple":"2023-Q131"},{"id":"2023-L56-Q95","year":2023,"qnum":95,"jokbo_lec_no":56,"lecture":"여성호르몬 분비 / 조절 기전","professor":"구승엽","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"여성 호르몬의 분비와 조절에 있어서 시상하부-뇌하수체-난소축(HPO axis)은 여성의 생리 주기에 따라 변화하며 되먹이기 기전에 의해 조절되는 등 긴밀한 관계를 맺고 있다. A-C 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A.에스트라디올 – B.난포자극호르몬, 황체호르몬 – C.황체형성호르몬, 생식샘자극호르몬 분비호르몬","A.생식샘자극호르몬 분비호르몬 – B.황체형성호르몬, 난포자극호르몬 – C.에스트라디올, 황체호르몬","A.난포자극호르몬 – B.에스트라디올, 황체호르몬 – C.황체형성호르몬, 생식샘자극호르몬 분비호르몬","A.황체호르몬 – B.생식샘자극호르몬 분비호르몬, 난포자극호르몬 – C.황체형성호르몬, 에스트라디올","A.생식샘자극호르몬 분비호르몬 – B.난포자극호르몬, 황체호르몬 – C.황체형성호르몬, 에스트라디올"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q95_p72.png","note":null,"id_simple":"2023-Q95"},{"id":"2023-L56-Q104","year":2023,"qnum":104,"jokbo_lec_no":56,"lecture":"여성호르몬 분비 / 조절 기전","professor":"구승엽","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"난소의 에스트로겐의 생성을 위해서는 난포막세포(theca cell)와 과립막세포(granulosa cell)가 모두 존재하여야 하며 또한 생식샘자극호르몬들이 필요하다. A-D 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A 과립막세포 - B 난포막세포 - C 투명대(zona pellucida) - D 기저막","A 과립막세포 - B 난포막세포 - C 기저막 - D 투명대(zona pellucida)","A 난포막세포 - B 과립막세포 - C 투명대(zona pellucida) - D 기저막","A 투명대(zona pellucida) - B 기저막 - C 과립막세포 - D 난포막세포","A 난포막세포 - B 과립막세포 - C 기저막 - D 투명대(zona pellucida)"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q104_p72.png","note":null,"id_simple":"2023-Q104"},{"id":"2023-L56-Q108","year":2023,"qnum":108,"jokbo_lec_no":56,"lecture":"여성호르몬 분비 / 조절 기전","professor":"구승엽","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"뇌하수체와 난소에서의 호르몬 분비는 여성의 생리주기에 따라서 변화하면 되먹이기 기전에 의해서 조절된다. 다음은 여성의 생리주기에 따른 호르몬의 변화를 나타내는 그림이다. A-D 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A 난포자극 호르몬 – B 황체형성호르몬 – C 황체호르몬 – D 에스트라디올","A 난포자극 호르몬 – B 황체형성호르몬 – C 에스트라디올 – D 황체호르몬","A 난포자극 호르몬 – B 에스트라디올 – C 황체형성호르몬 – D 황체호르몬","A 에스트라디올 – B 난포자극 호르몬 – C 황체호르몬 – D 황체형성호르몬","A 에스트라디올 – B 난포자극 호르몬 – C 황체형성호르몬 – D 황체호르몬"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q108_p73.png","note":null,"id_simple":"2023-Q108"},{"id":"2023-L57-Q151","year":2023,"qnum":151,"jokbo_lec_no":57,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"16세 여성이 일차성 무월경을 주소로 병원에 왔다. 발달 과정에 특이 사항은 없었고, 신체검사에서 신장 167cm, 체중 50kg, 유방은 Tanner stage IV, 치모는 Tanner stage I이었다. 골반 진찰에서 외음부의 형태는 정상이었으나, 질이 짧은 맹관(Blind pouch)의 형태를 보였다. 주기적 골반통증이나 후각 장애는 없었으며 골반초음파 검사에서 자궁은 관찰되지 않았다. 핵형 분석은 46,XY였다. 진단은?","stem_table":null,"options":["터너 증후군(Turner syndrome)","처녀막 막힘증(Imperforate hymen)","뮐러관 무발생증(Mullerian agenesis)","다낭성 난소증후군(Polycystic ovary syndrome)","안드로겐 무감응 증후군(Androgen insensitivity syndrome)"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q151"},{"id":"2023-L57-Q178","year":2023,"qnum":178,"jokbo_lec_no":57,"lecture":"무월경의 진단과 치료","professor":"구승엽","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"38세 여성이 6개월 전 임신 6주 5일에 계류유산으로 자궁내막소파술 시행 후 월경이 없어 병원에 왔다. 소변 임신 반응은 음성이며, 다른 내과적 질환은 없다. 자궁난관조영술 소견은 다음과 같다.\n진단은?","stem_table":null,"options":["자궁내막증(Endometriosis)","자궁내 장치(Intrauterine device)","근층내 자궁근종(Intramural myoma uteri)","자궁내막 유착증(Asherman syndrome)","양측 나팔관 폐쇄(Bilateral tubal obstruction)"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q178_p73.png","note":null,"id_simple":"2023-Q178"},{"id":"2023-L58-Q101","year":2023,"qnum":101,"jokbo_lec_no":58,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"3세 여아가 질이 잘 보이지 않아 내원하였다. 환자의 이학적 검진에서 아래와 같은 소견을 보였다. 환아의 부모가 치료를 원하는 경우 시행해볼 수 있는 치료 방법은?","stem_table":null,"options":["topical emollient","estrogen cream","metronidazole ointment","medroxyprogesterone acetate","clomiphene"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q101"},{"id":"2023-L58-Q109","year":2023,"qnum":109,"jokbo_lec_no":58,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"5살 아이가 외음부 가려움증으로 왔다. 아이의 병력 청취와 진찰 시 지켜야 할 사항으로 옳은 것은?","stem_table":null,"options":["진료실 내 환경은 병력 청취에 영향을 주지 않으므로 신경쓰지 않아도 된다.","아이의 나이에 맞는 장난감이 있으면 진료에 도움이 된다.","모든 질문은 보호자를 배제하고 아이에게만 한다.","아이의 답변을 믿을 수 없으므로 질문은 보호자에게만 한다.","학교, 좋아하는 책 등에 대한 질문은 시간만 낭비할 뿐이다."],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q109"},{"id":"2023-L58-Q141","year":2023,"qnum":141,"jokbo_lec_no":58,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"5세 여아가 비정상 질출혈로 왔다. 골반저(pelvic floor) 근육을 이완시키는 데에 가장 효과적인 자세는?","stem_table":null,"options":["Frog leg position","Knee chest position","Fowler's position","Trendelenburg position","Right lateral recumbent position"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q141"},{"id":"2023-L58-Q186","year":2023,"qnum":186,"jokbo_lec_no":58,"lecture":"미성년내분비학","professor":"김훈","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"14세 여아가 초경이 없어 병원에 왔다. 최근 몇 달간 회음부 압박감과 통증이 주기적으로 발생하였다. 신체진찰에서 질입구에 돌출된 말랑말랑한 종괴가 확인되었고, 발살바 조작(Valsalvar maneuver) 시 더욱 돌출되었다. 치료는?","stem_table":null,"options":["십자절개술(Cruciate incision)","도수정복(Manual reduction)","요관 스텐트 삽입술(Ureteral stent insertion)","페서리(Pessary)","질 폐쇄술(Colpocleisis)"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q186_p73.png","note":null,"id_simple":"2023-Q186"},{"id":"2023-L59-Q129","year":2023,"qnum":129,"jokbo_lec_no":59,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제 처방에 대한 WHO 가이드라인에서 Category 4에 속하는 경우는?","stem_table":null,"options":["경증 간경화증","유방암 가족력","Aura가 있는 migraine","산후 7주 이상의 수유부","혈소판감소증이 있는 전신루푸스"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q129"},{"id":"2023-L59-Q160","year":2023,"qnum":160,"jokbo_lec_no":59,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제와 레보노게스트렐 함유-자궁내장치의 공통된 '피임 외 부가적 이점'으로 보기 힘든 것은?","stem_table":null,"options":["골반염 예방","월경통 호전","월경과다 호전","류마티스관절염 감소","자궁내막증 수술 후 재발 방지"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q160"},{"id":"2023-L59-Q184","year":2023,"qnum":184,"jokbo_lec_no":59,"lecture":"호르몬피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"프로게스틴-피하이식기구(임플라논) 사용에 관한 WHO 가이드라인에서 Category 4에 속하는 경우는?","stem_table":null,"options":["난소암","자궁경부암","현재 유방암","현재 골반내감염","Distortion of uterine cavity"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q184"},{"id":"2023-L60-Q125","year":2023,"qnum":125,"jokbo_lec_no":60,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"23세 여성이 월경이 최근 들어 불규칙해져 내원하였다. 초경 이후 월경 주기는 35-40일 정도로 길었으며 최근 6개월간 월경이 한 번 있었다고 한다. 신체검진에서 심한 여드름이 관찰되었다. 신장 160cm, 체중은 85kg, 허리둘레 82cm이었으며, 골반초음파검사에서 양쪽 난소는 각각 아래와 같았다.\n난소의 난포 성장 단계에서 황체형성호르몬에 의해 합성되어 위 증상들이 나타나게 하는 호르몬은 무엇인가?","stem_table":null,"options":["에스트로겐","프로게스테론","테스토스테론","인히빈","인슐린"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2023/Q125_p74.png","note":null,"id_simple":"2023-Q125"},{"id":"2023-L60-Q152","year":2023,"qnum":152,"jokbo_lec_no":60,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"32세 여성이 최근 월경이 없어 내원하였다. 마지막 월경은 1년 전이었으며 이후 월경은 없었고, 그 전까지는 비교적 규칙적이었다고 한다. 약 2년 전부터 스트레스를 심하게 받았고 이로 인한 우울증으로 정신건강의학과를 다니고 있으며, 우울증약을 복용중이라고 한다. 무기력감을 호소하였으며 양측 유두에서 분비물이 나온다고 하였다.\n이후 시행해야 할 검사는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| FSH | 6.0 mIU/mL | 5-20 |\n| LH | 5.2 mIU/mL | 5-20 |\n| Estradiol | 44 pg/mL | 20-400 |\n| TSH | 2.5 mIU/mL | 0.34-4.25 |\n| Prolactin | 110 ng/mL | 1.9-25 |","options":["뇌하수체 MRI","복용약물 중단 후 프로락틴 재검사","유리 티록신 (Free T4)","유리 테스토스테론 (Free testosterone)","17-수산화프로게스테론(17-OHP)"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q152"},{"id":"2023-L60-Q168","year":2023,"qnum":168,"jokbo_lec_no":60,"lecture":"만성무배란증","professor":"이정렬","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"35세 여성이 결혼 후 임신이 되지 않아 내원하였다. 월경주기는 40-50일 간격으로 불규칙하였으며 몇 달간 월경이 없던 적이 있었다고 한다. 마지막 월경은 두달 전이라고 한다. 키는 165cm, 체중은 57kg이다. 신체검진과 부인과 검진에서 이상소견은 없었으며 부인과 초음파 검사는 정상이었다.\n임신을 위한 치료 시 일차적으로 선택해야 할 약제는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| FSH | 5.1 mIU/ml | 5-20 |\n| LH | 10.2 mIU/ml | 5-20 |\n| Estradiol | 52 pg/mL | 20-400 |\n| TSH | 2.7 mIU/L | 0.34-4.25 |\n| Prolactin | 10 ng/mL | 1.9-25 |\n| 총 테스토스테론 | 120 ng/dL | 20-80 |","options":["항안드로겐 제재(spironolactone)","방향화효소 억제제 (letrozole)","클로미펜 (clomiphene citrate)","인슐린 저항성 개선제 (metformin)","생식샘자극호르몬제재 (recombinant FSH)"],"answer":[2],"image":null,"note":null,"id_simple":"2023-Q168"},{"id":"2023-L61-Q100","year":2023,"qnum":100,"jokbo_lec_no":61,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"51세 여성이 5개월간 지속된 얼굴이 붉어지는 증상과 식은땀 때문에 병원에 왔다. 5년 전 자궁선근증으로 자궁적출술을 받았고, 내진상 특이소견은 없었다. 진단을 위해 시행할 검사는?","stem_table":null,"options":["혈중 프로락틴","혈중 테스토스테론","혈중 프로게스테론","혈중 난포자극호르몬","혈중 황체형성호르몬"],"answer":[4],"image":null,"note":null,"id_simple":"2023-Q100"},{"id":"2023-L61-Q110","year":2023,"qnum":110,"jokbo_lec_no":61,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"여성건강주도연구(Women's Health Initiative) 연구 결과 에스트로겐 단독 요법을 시행할 때 위험도가 증가하는 질환은?","stem_table":null,"options":["요추 골다공증","고관절 골절","뇌졸중","부정맥","치매"],"answer":[3],"image":null,"note":null,"id_simple":"2023-Q110"},{"id":"2023-L61-Q124","year":2023,"qnum":124,"jokbo_lec_no":61,"lecture":"폐경과 갱년기 증후군","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"49세 산과력 2-0-0-2인 여자가 1년 전부터 월경이 없어지고, 안면 홍조 및 수면장애를 호소하며 병원에 왔다. 6년 전 자궁내막증으로 왼쪽 난소 및 자궁절제술을 시행받았다. 이외 다른 병력은 없다.\n치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|------|------|--------|\n| TSH | 2.0 mIU/L | 0.34~4.25 |\n| Prolactin | 3.5 ng/mL | 1.9~25 |\n| FSH | 54 mIU/mL | 3.0~20 |\n| Estradiol | 12 pg/mL | 20~145 |","options":["에스트로겐(Estrogen)","프로게스테론(Progesterone)","레트로졸(Letrozole)","카베르골린(Cabergoline)","에스트로겐-프로게스테론(Estrogen-Progesterone)"],"answer":[5],"image":null,"note":null,"id_simple":"2023-Q124","reparsed":true},{"id":"2022-L1-Q16","year":2022,"qnum":16,"jokbo_lec_no":1,"lecture":"대사와 내분비학 개관","professor":"박영주","curr_lec_no":"01","curr_lecture":"대사와 내분비학 개관","stem":"호르몬의 분비 및 혈액내 운반과 관련하여 올바르게 기술된 것을 고르시오.","stem_table":null,"options":["스테로이드 호르몬의 세포외 분비를 위해서는 transporter의 작용이 필수적이다.","펩타이드 호르몬의 세포외 분비는 Golgi에서 세포외부로 일어난다.","혈액내에서 활성을 나타내는 호르몬은 주로 단백질과 결합되어 있는 형태이다.","호르몬 결합 단백질의 농도가 증가하면 장기적으로 전체 호르몬 농도보다 free form의 호르몬 농도에 더 큰 영향을 미친다.","혈액내에서 호르몬 결합 단백질은 호르몬을 안정화시키는 기능을 한다."],"answer":[2,5],"image":null,"note":null,"id_simple":"2022-Q16"},{"id":"2022-L2-Q7","year":2022,"qnum":7,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음은 갑상선기능이상을 유발할 수 있는 약물이다. 제시되고 있는 기전이 전혀 다른 것은?","stem_table":null,"options":["아미오다론","리치움(lithium)","인터페론 감마","리팜핀(항결핵제)","PD-L1 억제제(면역관문제)"],"answer":[4],"image":null,"note":null,"id_simple":"2022-Q7"},{"id":"2022-L2-Q43","year":2022,"qnum":43,"jokbo_lec_no":2,"lecture":"호르몬 작용기전, 기능, 조절","professor":"조성엽","curr_lec_no":"02","curr_lecture":"02·03 호르몬 작용기전·기능·조절 (1·2)","stem":"다음 중 호르몬의 분류가 적절한 것을 고르시오.",
