<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대사와 내분비 족보 퀴즈 2026 v2</title>
<style>
:root {
  --header-bg:#2c3e5d;--header-text:#fff;--body-bg:#FAFAF8;
  --sidebar-bg:#f0ede8;--sidebar-border:#ddd8d0;
  --accent:#4080b0;--accent-hover:#306090;--accent-light:#eaf1f7;
  --correct:#3a7a4a;--correct-light:#d4edda;--correct-border:#b5d8bd;
  --incorrect:#b85450;--incorrect-light:#f8d7da;--incorrect-border:#e8b4b2;
  --card-bg:#ffffff;--card-border:#e0dbd4;--card-shadow:0 1px 4px rgba(60,50,40,0.07);
  --text-primary:#2c3e5d;--text-secondary:#555555;--text-muted:#9a958c;
  --chip-bg:#e8f0f8;--chip-text:#2c5080;
  --font-stack:'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif;
  --sidebar-width:296px;
  --star-color:#e8a020;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --header-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-stack);background:var(--body-bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{
  background:var(--header-bg);color:var(--header-text);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  height:var(--header-h);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.header-left{display:flex;flex-direction:column;gap:2px;}
header h1{font-size:1rem;font-weight:700;letter-spacing:-0.02em;line-height:1.2;}
.header-sub{font-size:0.7rem;opacity:0.7;letter-spacing:0.01em;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#mobile-sidebar-btn{
  display:none;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.79rem;
  font-family:var(--font-stack);transition:background 0.15s;
}
#mobile-sidebar-btn:hover{background:rgba(255,255,255,0.2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#d0d8e4 transparent;
}
#sidebar::-webkit-scrollbar{width:5px;}
#sidebar::-webkit-scrollbar-track{background:transparent;}
#sidebar::-webkit-scrollbar-thumb{background:#d0d8e4;border-radius:10px;}

/* Single panel (no tabs) */
.sidebar-panel{flex:1;overflow-y:auto;padding:16px 14px 20px;}

/* Filter section */
.filter-section{margin-bottom:18px;}
.filter-label{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.year-btns{display:flex;flex-wrap:wrap;gap:5px;}
.yr-btn{
  background:transparent;border:1.5px solid var(--card-border);border-radius:20px;
  padding:4px 12px;font-size:0.76rem;cursor:pointer;color:var(--text-secondary);
  transition:all 0.15s;font-family:var(--font-stack);font-weight:500;
}
.yr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.yr-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
#lec-select{
  width:100%;padding:7px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  font-size:0.79rem;font-family:var(--font-stack);color:var(--text-primary);
  background:var(--card-bg);cursor:pointer;outline:none;transition:border-color 0.15s;
}
#lec-select:focus{border-color:var(--accent);}
/* scrap filter */
.scrap-filter-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.scrap-toggle-label{font-size:0.8rem;cursor:pointer;color:var(--text-secondary);user-select:none;display:flex;align-items:center;gap:5px;}
.scrap-toggle-label input{cursor:pointer;accent-color:var(--accent);}

.scope-bar{
  background:var(--accent-light);border:1px solid #c8dff4;border-radius:var(--radius-sm);
  padding:9px 11px;font-size:0.77rem;color:var(--text-secondary);margin-bottom:12px;
  line-height:1.8;
}
.scope-bar b{color:var(--text-primary);}

.sidebar-actions{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.action-btn{
  width:100%;padding:8px 12px;background:var(--header-bg);color:#fff;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-family:var(--font-stack);
  font-weight:600;transition:all 0.15s;letter-spacing:0.01em;
}
.action-btn:hover{background:var(--accent-hover);}
.action-btn.secondary{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.secondary.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;}
.action-btn.shuffle-btn{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.shuffle-btn.active{
  background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;
}
.action-btn.shuffle-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* Backup / Restore */
.backup-box{margin-bottom:14px;padding:11px 11px 12px;border:1px solid var(--sidebar-border);border-radius:var(--radius-sm);background:rgba(0,0,0,0.015);}
.backup-status{font-size:0.72rem;color:var(--correct);font-weight:600;margin-bottom:9px;line-height:1.45;}
.backup-status.warn{color:var(--incorrect);}
.backup-btns{display:flex;flex-direction:column;gap:6px;}
.backup-btn{width:100%;padding:8px 10px;background:#fff;color:var(--text-primary);border:1.5px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.79rem;font-family:var(--font-stack);font-weight:600;transition:all 0.15s;}
.backup-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.backup-hint{font-size:0.66rem;color:var(--text-muted);line-height:1.55;margin-top:8px;}

/* Divider */
.sidebar-divider{height:1px;background:var(--sidebar-border);margin:14px 0;}

/* Inline index list (inside filter panel) */
.idx-header{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.idx-scope-inline{
  font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px;padding:7px 9px;
  background:var(--card-bg);border-radius:var(--radius-sm);border:1px solid var(--card-border);
  line-height:1.6;
}
.idx-scope-inline b{color:var(--text-primary);}
.idx-list{display:flex;flex-direction:column;gap:2px;}
.idx-item{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:0.76rem;color:var(--text-primary);transition:background 0.12s;
  text-decoration:none;border:none;background:transparent;font-family:var(--font-stack);
  text-align:left;width:100%;
}
.idx-item:hover{background:var(--accent-light);}
.idx-item.idx-current{background:rgba(42,114,181,0.15);font-weight:600;}
.idx-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#d0d8e4;
}
.idx-dot.dot-correct{background:var(--correct);}
.idx-dot.dot-wrong{background:var(--incorrect);}
.idx-dot.dot-scrap{background:var(--star-color);}
.idx-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MAIN */
#main{flex:1;padding:20px 22px;max-width:880px;overflow-x:hidden;}
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.stat-chip{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;
  padding:4px 14px;font-size:0.76rem;color:var(--text-secondary);
  box-shadow:var(--card-shadow);
}
.stat-chip b{color:var(--text-primary);}

/* QUESTION CARDS FEED */
#feed{display:flex;flex-direction:column;gap:18px;}
#no-results{text-align:center;color:var(--text-muted);margin-top:80px;font-size:0.95rem;display:none;line-height:2;}

/* SINGLE CARD */
.q-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--card-shadow);
  scroll-margin-top:64px;transition:box-shadow 0.15s;
}
.q-card:hover{box-shadow:0 3px 12px rgba(20,50,90,0.11);}
.q-card-header{
  background:linear-gradient(135deg,#f5f3ef 0%,#ede9e4 100%);
  padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  border-bottom:1px solid var(--card-border);
}
.q-card-header-inner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;}
.meta-tag{
  font-size:0.67rem;font-weight:700;padding:2px 9px;border-radius:12px;
  letter-spacing:0.02em;line-height:1.5;
}
.tag-year{background:var(--header-bg);color:#fff;}
.tag-lec{background:var(--chip-bg);color:var(--chip-text);}
.tag-prof{background:#f0e8f5;color:#5a3270;}
.tag-qnum{background:#f5f0e6;color:#6a4c20;}
.tag-recovered{background:#fff8cc;color:#7a5a00;}

/* Star button: ☆/★ */
.scrap-btn{
  margin-left:auto;background:transparent;border:none;cursor:pointer;
  font-size:1.2rem;line-height:1;padding:2px 5px;border-radius:4px;
  transition:transform 0.15s,color 0.15s;flex-shrink:0;color:#c8d0da;
}
.scrap-btn:hover{transform:scale(1.25);}
.scrap-btn.starred{color:var(--star-color);}

.q-card-body{padding:18px 18px 14px;}
.q-stem{
  font-size:0.91rem;line-height:1.75;color:var(--text-primary);
  margin-bottom:14px;font-weight:500;white-space:pre-wrap;word-break:break-word;
}
/* stem table */
.stem-table-wrap{margin-bottom:14px;overflow-x:auto;}
.stem-table{width:100%;border-collapse:collapse;font-size:0.81rem;}
.stem-table th{
  background:var(--header-bg);color:#fff;padding:6px 10px;
  text-align:center;font-weight:600;border:1px solid #2a5070;
}
.stem-table td{
  border:1px solid #d0dce8;padding:5px 10px;text-align:center;background:#f7fafd;
}
.stem-table tr:nth-child(even) td{background:#eef4fa;}
/* image */
.q-image{margin-bottom:14px;text-align:center;}
.q-image img{max-width:100%;max-height:320px;border-radius:var(--radius-sm);border:1px solid var(--card-border);object-fit:contain;background:#f4f6f8;cursor:zoom-in;transition:filter 0.12s;}
.q-image img:hover{filter:brightness(0.94);}
.img-placeholder{display:inline-block;padding:8px 16px;background:#f4f6f8;border:1px dashed #c8d0da;border-radius:var(--radius-sm);color:var(--text-muted);font-size:0.8rem;}

/* choices */
.choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:#fafbfc;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  padding:10px 13px;text-align:left;cursor:pointer;font-size:0.86rem;line-height:1.55;
  color:var(--text-primary);transition:all 0.15s;font-family:var(--font-stack);
  display:flex;align-items:flex-start;gap:9px;width:100%;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);}
.choice-num{font-weight:700;font-size:0.77rem;color:var(--accent);flex-shrink:0;min-width:18px;margin-top:1px;}
/* CORRECT = green */
.choice-btn.correct-ans{background:var(--correct-light);border-color:var(--correct-border);color:#154530;font-weight:600;}
.choice-btn.correct-ans .choice-num{color:var(--correct);}
/* MY WRONG = light red */
.choice-btn.my-wrong-ans{background:var(--incorrect-light);border-color:var(--incorrect-border);color:#7a1820;}
.choice-btn.my-wrong-ans .choice-num{color:var(--incorrect);}
.choice-btn:disabled{cursor:default;}

/* answer reveal */
.answer-reveal{
  margin-top:14px;padding:11px 15px;
  background:linear-gradient(135deg,#f0faee 0%,#e5f5e0 100%);
  border:1px solid var(--correct-border);border-radius:var(--radius-sm);display:none;
  font-size:0.83rem;color:#154530;line-height:1.65;
}
.answer-reveal.show{display:block;}
.answer-reveal.wrong{background:linear-gradient(135deg,#fdf1f0 0%,#fce8e7 100%);border-color:var(--incorrect-border);color:#7a1820;}
.ans-label{font-weight:700;font-size:0.73rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--correct);margin-bottom:3px;}
.answer-reveal.wrong .ans-label{color:var(--incorrect);}

/* EXPLANATION — hidden until answered */
.expl-section{
  margin-top:12px;border-top:1px solid var(--card-border);padding-top:12px;
  display:none;
}
.expl-section.expl-visible{display:block;}
.expl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.expl-title{font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
.expl-actions{display:flex;gap:5px;}
.expl-edit-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid var(--card-border);background:transparent;color:var(--text-secondary);
  font-family:var(--font-stack);transition:all 0.12s;
}
.expl-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.expl-revert-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid #e0b870;background:transparent;color:#8a5c18;
  font-family:var(--font-stack);transition:all 0.12s;display:none;
}
.expl-revert-btn.show{display:inline-block;}
.expl-revert-btn:hover{background:#fff5e0;}
.expl-text{font-size:0.84rem;line-height:1.75;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;}
.expl-text.placeholder{color:var(--text-muted);font-style:italic;}
.expl-textarea{
  width:100%;min-height:80px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:0.84rem;line-height:1.6;font-family:var(--font-stack);
  color:var(--text-primary);resize:vertical;outline:none;
  display:none;background:#fafcff;
}
.expl-save-btn{
  display:none;margin-top:6px;padding:6px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  font-family:var(--font-stack);font-weight:600;transition:background 0.15s;
}
.expl-save-btn:hover{background:var(--accent-hover);}
.expl-paste-hint{font-size:0.72rem;color:var(--text-muted);margin-top:6px;display:none;line-height:1.5;}
.expl-paste-hint.show{display:block;}
.expl-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.expl-img-wrap{position:relative;display:inline-block;}
.expl-img{max-width:100%;max-height:340px;border:1px solid var(--card-border);border-radius:6px;cursor:zoom-in;display:block;}
.expl-img-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:0.78rem;line-height:1;cursor:pointer;padding:0;}
.expl-img-del:hover{background:rgba(184,84,80,0.95);}
/* Tabs (해설 / 메모1 / 메모2) */
.tab-bar{display:flex;align-items:center;gap:4px;border-bottom:1.5px solid var(--card-border);margin-bottom:10px;flex-wrap:wrap;}
.tab-btn{font-size:0.78rem;padding:6px 13px;border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-stack);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.12s;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;}
.tab-dot.memo1{background:#d98a3d;} .tab-dot.memo2{background:#3d7fd9;}
.sync-pill{margin-left:auto;font-size:0.64rem;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.sync-pill.on{color:#2f7a44;background:#e7f4ec;} .sync-pill.off{color:#9a3b38;background:#f7e9e8;}
.tab-pane{}
.tab-pane[hidden]{display:none;}
.memo-empty{font-size:0.82rem;color:var(--text-muted);font-style:italic;line-height:1.7;}
.memo-hint{font-size:0.68rem;color:var(--text-muted);margin-bottom:7px;line-height:1.5;}
.expl-textarea.memo-live{display:block;min-height:90px;background:#fff;}
.expl-textarea.memo-live:focus{border-color:var(--accent);background:#fafcff;}
.memo-status{font-size:0.68rem;margin-top:5px;min-height:1em;line-height:1.4;}
.memo-status.saving{color:var(--text-muted);}
.memo-status.ok{color:#2f7a44;}
.memo-status.err{color:#9a3b38;}
.offline-note{font-size:0.7rem;color:#9a3b38;background:#f7e9e8;border-radius:5px;padding:6px 9px;margin-top:7px;line-height:1.5;}
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;cursor:zoom-out;}
.img-lightbox.show{display:flex;}
.img-lightbox img{width:96vw;height:92vh;object-fit:contain;border-radius:6px;}

/* MOBILE */
@media(max-width:767px){
  #mobile-sidebar-btn{display:block;}
  .layout{flex-direction:column;}
  #sidebar{
    position:fixed;top:0;left:-310px;width:300px;height:100vh;
    z-index:200;transition:left 0.25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.2);
  }
  #sidebar.open{left:0;}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:199;
  }
  .sidebar-overlay.visible{display:block;}
  #main{padding:12px 13px;max-width:100%;}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>대사와 내분비 족보 퀴즈 2026 v2</h1>
    <div class="header-sub">2021·2022·2023·2025 &nbsp;|&nbsp; 총 805문항</div>
  </div>
  <div class="header-right">
    <button id="mobile-sidebar-btn" onclick="toggleSidebar()">필터·목록 ☰</button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <nav id="sidebar" aria-label="필터 및 문항목록">
    <div class="sidebar-panel">
      <!-- YEAR FILTER -->
      <div class="filter-section">
        <span class="filter-label">연도</span>
        <div class="year-btns" id="year-btns">
          <button class="yr-btn active" data-year="all" onclick="setYear('all')">전체</button>
          <button class="yr-btn" data-year="2025" onclick="setYear('2025')">2025</button>
          <button class="yr-btn" data-year="2023" onclick="setYear('2023')">2023</button>
          <button class="yr-btn" data-year="2022" onclick="setYear('2022')">2022</button>
          <button class="yr-btn" data-year="2021" onclick="setYear('2021')">2021</button>
        </div>
      </div>
      <!-- LECTURE FILTER (with lecture number prefix) -->
      <div class="filter-section">
        <span class="filter-label">강의</span>
        <select id="lec-select" onchange="setLecture(this.value)">
<option value="all">전체 강의</option>
<option value="01">01. 대사와 내분비학 개관</option>
<option value="02">02·03. 호르몬 작용기전·기능·조절 (1·2)</option>
<option value="04">04. 내분비대사질환의 요인,진단</option>
<option value="05">05. 시상하부,뇌하수체 생리,뇌하수체후엽질환</option>
<option value="06">06. 뇌하수체 기능부전</option>
<option value="07">07. 뇌하수체전엽질환</option>
<option value="08">08. 부신의 생리와 부신기능저하</option>
<option value="09">09. 부신피질질환</option>

ure":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"52세 남자가 2개월 전부터 시작된 심한 갈증으로 내원하였다. 소변을 자주 보고 밤에도 1-2시간 간격으로 소변을 봤다. 체중은 1kg 정도 감소하였다. 혈압은 122/82 mmHg 였고 체중은 67kg 였다. 검사 결과는 다음과 같았다.\n이에 시행한 수분제한검사 검사 결과는 4번과 같았다. 적절한 치료는?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 공복포도당 | 86 mg/dL | |\n| 크레아티닌 | 1.1 mg/dL | |\n| Na+/K+/Cl- | 146/3.9/109 mEq/L | |\n| 삼투질농도 | 302 mOsm/kg H2O | 275-295 |\n| 아르지닌바소프레신 | 0.3 pg/mL | 참고치 0.5-2.0 |","options":["리튬","수분제한","데스모프레신","티아지드","수분제한"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q11_p4.png","note":"중복 선지 존재","id_simple":"2025-Q11"},{"id":"2025-L4-Q25","year":2025,"qnum":25,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"다음 뇌하수체 호르몬 중 주요 표적장기가 간인 호르몬은?","stem_table":null,"options":["유즙분비호르몬","바소프레신","성장호르몬","프로락틴","부신피질자극호르몬"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q25"},{"id":"2025-L4-Q37","year":2025,"qnum":37,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"뇌하수체 호르몬 중에서 말초기관에서 표적호르몬을 만들지 않고 직접 표적기관에 작용하는 호르몬은?","stem_table":null,"options":["황체형성호르몬","프로락틴","여포자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q37"},{"id":"2025-L4-Q54","year":2025,"qnum":54,"jokbo_lec_no":4,"lecture":"시상하부, 뇌하수체의 생리, 뇌하수체후엽질환","professor":"공성혜","curr_lec_no":"05","curr_lecture":"시상하부,뇌하수체 생리,뇌하수체후엽질환","stem":"다음 중, 짝지어진 표적(일차) 기관에서 생성하는 호르몬이 과다한 경우, 정상적으로 감소하는 반응을 보이는 뇌하수체 전엽호르몬은?","stem_table":null,"options":["ACTH","ADH","GH","Prolactin","TRH"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q54"},{"id":"2025-L5-Q26","year":2025,"qnum":26,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"공성혜","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"35세 여자 환자에서 뇌하수체선종이 발견되었고 월경은 규칙적이라고 한다. 아침 8시 공복시에 시행한 호르몬 검사 결과는 다음과 같다. 결핍된 호르몬은?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 0.55 ng/dL | 0.8~1.7 |\n| 갑상선자극호르몬 | 0.5 mIU/L | 0.34~4.25 |\n| 코티졸 | 6.2 μg/dL | 5~25 |\n| 부신피질자극호르몬 | 15.6 pg/mL | 6~76 |\n| 프로락틴 | 15 ng/mL | 2.5~17.0 |\n| 여포자극호르몬 | 5 mIU/mL | 1~9 |\n| 황체형성호르몬 | 6 mIU/mL | 2~12 |\n| 인슐린유사성장인자-1 | 40 ng/mL | 94~269 |","options":["갑상선자극호르몬","성장호르몬","프로락틴","성선자극호르몬","부신피질자극호르몬"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q26"},{"id":"2025-L5-Q32","year":2025,"qnum":32,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"공성혜","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"60세 여자 환자에서 건강검진에서 우연히 발견된 뇌하수체 종괴로 오후 3시에 공복시에 시행한 호르몬 검사 결과에서 결핍된 뇌하수체 호르몬은?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 1.01 ng/dL | 0.8~1.7 |\n| 갑상선자극호르몬 | 3.2 mIU/L | 0.34~4.25 |\n| 코티졸 | 3.2 μg/dL | 5~25 |\n| 부신피질자극호르몬 | 22.9 pg/mL | 6~76 |\n| 프로락틴 | 12 ng/mL | 참고치 기재 오류 (2.5~17.0) |\n| 여포자극호르몬 | 3 mIU/mL | 1~9 |\n| 황체형성호르몬 | 10 mIU/mL | 2~12 |\n| 에스트로겐 | 30 pg/mL | 30~120 |\n| 인슐린유사성장인자-1 | 120 ng/mL | 94~269 |","options":["프로락틴","성장호르몬","성선자극호르몬","갑상선자극호르몬","부신피질자극호르몬"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q32"},{"id":"2025-L5-Q71","year":2025,"qnum":71,"jokbo_lec_no":5,"lecture":"뇌하수체 기능부전","professor":"공성혜","curr_lec_no":"06","curr_lecture":"뇌하수체 기능부전","stem":"비기능성 뇌하수체 종양으로 추적 관찰 중이던 45세 남자가 갑자기 발생한 심한 두통, 시야 장애, 구역, 구토를 주소로 응급실을 내원하였다. 상기 환자에서 호르몬 검사를 위해 혈액 채취 후 가장 먼저 투약해야 할 호르몬은?","stem_table":null,"options":["Testosterone","Hydrocortisone","Levothyroxine","Desmopressin","Growth hormone"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q71"},{"id":"2025-L7-Q12","year":2025,"qnum":12,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"오태정","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"21세 남성이 신체 검사에서 혈압 189/110 mmHg 으로 이차성 고혈압에 대한 평가를 위해 왔다. 혈액검사에서 저칼륨혈증이 발견되었으며, 호르몬 검사는 아래와 같다.\n- aldosterone concentration 36 ng/dL\n- plasma renin activity 0.1 ng/ml/hr\n- saline infusion test 이후 aldosterone concentration 16 ng/dL\n부신의 구조를 모식화하여 나타낸 그림에서 환자의 질병이 발생했을 것으로 생각되는 부위는?","stem_table":null,"options":["Capsule","Zona glomerulosa","Zona fasciculata","Zona reticularis","Medulla"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q12_p5.png","note":null,"id_simple":"2025-Q12"},{"id":"2025-L7-Q29","year":2025,"qnum":29,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"오태정","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"70세 여자가 저혈압과 의식 소실로 왔다. 내원 당일 38도의 발열이 있었으며, 의식 소실 전 오심과 구토증을 동반하였다. 수년 전부터 퇴행성 관절염으로 소염진통제와 관절강내 스테로이드 주사를 반복적으로 투여하였으며, 일주일전 전신마취 하에 관절치환술을 시행받았다.\n환자의 활력징후 및 혈액검사 결과는 다음과 같다.\nSBP 85 mmHg. DBP 51 mmHg. HR 80회/분, RR 21회/분\nNa 122 mmol/L K 4.5 mmol/L serum osmolarity 265 mOsm/kg. glucose 150 mg/dL\nserum cortisol 2.1 μg/dL, ACTH 2 pg/mL\nSaline infusion과 함께 가장 먼저 투여해야할 약물은?","stem_table":null,"options":["minirin","dextrose","cosyntropin","hydrocortisone","spironolactone"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q29"},{"id":"2025-L7-Q76","year":2025,"qnum":76,"jokbo_lec_no":7,"lecture":"부신의 생리와 부신기능저하","professor":"오태정","curr_lec_no":"08","curr_lecture":"부신의 생리와 부신기능저하","stem":"57세 남자가 피부가 검게 변하는 증상으로 왔다. 2년 전 결핵을 진단받아 약물치료 이후 완치 판정을 받았으며, 현재 복용 중인 약물은 없다. 수개월 전부터 기운이 없고, 입맛이 없으면서 간헐적으로 구역감을 동반하였다. 혈액검사는 다음과 같다.\nNa 128 mmol/L, K 5.4 mmol/L, serum osmolarity 270 mOsm/kg\nserum cortisol 2.0 μg/dL, ACTH 670 pg/mL\n확진을 위해 시행해야 할 검사는?","stem_table":null,"options":["skin biopsy","saline loading test","24 hour urine cortisol","Rapid ACTH stimulation test","1 mg overnight dexamethasone suppression test"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q76_p5.png","note":null,"id_simple":"2025-Q76"},{"id":"2025-L8-Q20","year":2025,"qnum":20,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"28세 여자가 무월경으로 왔다. 이전에 동반 질환은 없었으며, 1년 전부터 팔다리가 가늘어지고, 복부 팽만감이 생겨서 악화되었다. 임신 가능성은 없었으며, 혈액검사에서 아래와 같은 소견이었다.\nCBC: WBC 9710/μL Hb 13.5 g/dL, Hct 45.3%, platelet 239K/μL\nCa/P 10.1/3.6 mg/dL, Glucose 82 mg/dL\nBUN/Cr 15/0.7 mg/dL Electro 135/4.0/107/28 mmol/L\nLFT 215 mg/dL-7.0/4.1 g/dL-0.7 mg/dL-104-21/18 IU/L\nT3 150 ng/dL, free T4 1.89 ng/dL TSH 2.26 mIU/L (참고치 T3/FreeT4/TSH, 87-184 ng/dL / 0.93-2.13 ng/dl / 0.4-4.1 mlU/L)\nserum cortisol 11.0 μg/dL, 24 Hour urine cortisol 640 μg/day\nLow-dose dexamethasone suppression test plasma cortisol 3.9 μg/dL\n감별진단을 위해 처음으로 시행해야 할 검사는?","stem_table":null,"options":["ACTH","급속 ACTH 자극 검사","인슐린 유발 저혈당 검사","고용량 덱사메타손 자극 검사","아래암석정맥동 채혈검사 (Inferior petrosal sinus sampling)"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q20"},{"id":"2025-L8-Q43","year":2025,"qnum":43,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"39세 여자가 체중이 늘고, 얼굴이 동그랗게 변하면서 목 뒤에 혹이 생겨서 커지는 증상으로 왔다. 신체계측은 키 159 cm, 체중 61 kg. 혈압 126/65 mmHg. 호흡수 18 회/min 이었다. 환자의 사진에서 의심되는 질환을 선별한 검사에 필요한 약물은?","stem_table":null,"options":["saline","estrogen","captopril","ketoconazole","dexamethasone"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q43_p6.png","note":null,"id_simple":"2025-Q43"},{"id":"2025-L8-Q44","year":2025,"qnum":44,"jokbo_lec_no":8,"lecture":"부신피질질환","professor":"오태정","curr_lec_no":"09","curr_lecture":"부신피질질환","stem":"46세 여자가 다발성 척추 압박골절로 왔다. 이차성 골다공증을 감별하기 위한 검사를 시행하였다. 다음 검사 결과를 보고 원인 질환에 대한 치료 방침을 세우기 위해 다음으로 시행해야 하는 검사는?\nserum cortisol 20.0 μg/dL ACTH 2 pg/mL 24 Hour urine cortisol 590 μg/day\n1mg overnight dexamethasone suppression test plasma cortisol 5.5 μg/dL\nLow-dose dexamethasone suppression test plasma cortisol 4.9 μg/dL","stem_table":null,"options":["sella MRI","adrenal CT scan","Chest CT scan","Whole body PET CT","Tc-99m Sestamibi Scintigraphy"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q44"},{"id":"2025-L9-Q4","year":2025,"qnum":4,"jokbo_lec_no":9,"lecture":"뇌하수체, 부신의 영상","professor":"윤태진/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"31세 여성이 유즙과다를 주소로 내원하였다. 혈중 prolactin level이 190 ng/mL (정상:0 - 25 ng/mL)였다. 환자는 MRI를 시행하였고, 조영 증강 후 T1 강조영상은 다음과 같았다. 이 병변에서 예상되는 가장 흔한 dynamic contrast MRI 소견은?","stem_table":null,"options":["No enhancement","Slight enhancement","Strong enhancement","Early enhancement","Delayed enhancement"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q4_p6.png","note":null,"id_simple":"2025-Q4"},{"id":"2025-L9-Q59","year":2025,"qnum":59,"jokbo_lec_no":9,"lecture":"뇌하수체, 부신의 영상","professor":"윤태진/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"아래 조영 증강 후 T1 강조 MRI 영상에서 화살표가 가리키는 구조물과 가장 관련이 높은 호르몬은?","stem_table":null,"options":["growth hormone","LH","TSH","prolactin","oxytocin"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q59_p6.png","note":null,"id_simple":"2025-Q59"},{"id":"2025-L9-Q19","year":2025,"qnum":19,"jokbo_lec_no":9,"lecture":"뇌하수체, 부신의 영상","professor":"윤태진/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"부신 CT 와 MR 영상에서 좌측 부신의 병변에 대해 가장 가능성이 높은 진단은?","stem_table":null,"options":["adrenal adenoma","adrenal abscess","adrenal metastasis","adrenal cortical carcinoma","adrenal pheochromocytoma"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q19_p7.png","note":null,"id_simple":"2025-Q19"},{"id":"2025-L9-Q34","year":2025,"qnum":34,"jokbo_lec_no":9,"lecture":"뇌하수체, 부신의 영상","professor":"윤태진/김상윤","curr_lec_no":"11","curr_lecture":"뇌하수체,부신의 영상","stem":"비 조영증강 복부 CT이다. 측정된 HU 와 관련이 높은 병변 내 성분은?","stem_table":null,"options":["공기 (air)","지방 (fat)","요오드 (iodine)","석회 (calcification)","출혈 (hemorrhage)"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q34_p7.png","note":null,"id_simple":"2025-Q34"},{"id":"2025-L10-Q47","year":2025,"qnum":47,"jokbo_lec_no":10,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"7세 여아가 키가 작다고 병원에 왔다. 임신 나이 40주에 출생체중 2,500g (3백분위 미만)으로 태어났다. 잦은 중이염으로 치료를 받았고, 키는 110 cm, 체중은 18kg이다. 목이 넓고 가슴은 방패형이다. 유방은 만져지지 않으며, 음모는 없다. 성장곡선이다.\n치료는?","stem_table":"| 혈액 검사 | 결과 | 참고치 |\n|---|---|---|\n| 갑상샘자극호르몬 | 2.4 mIU/L | 0.5~4.5 |\n| 유리 T4 | 1.2 ng/dL | 0.7~2.0 |\n| 인슐린유사성장인자-1 | 220 ng/mL | 183~850 |\n| 9시 코티솔 | 10 μg/dL | 5~25 |\n| 염색체검사 | 45, X/46. XX | |","options":["성장호르몬","에스트로겐","갑상샘호르몬","글루코코르티코이드","생식샘자극호르믄방출호르몬작용제"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q47_p7.png","note":null,"id_simple":"2025-Q47"},{"id":"2025-L10-Q61","year":2025,"qnum":61,"jokbo_lec_no":10,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키와 체중이 작아 병원에 왔다. 임신 나이 37주에 출생체중 1,200 g (임신나이 기준 3백분위수 미만)로 출생하였다. 출생 후 황달은 없었으며, 이제까지 두부손상, 경련, 만성 설사는 없었다. 1세 때 체중 7.5 kg이었다. 발달은 정상이다. 아버지 키는 171 cm, 어머니는 키가 160 cm이다. 뼈나이는 6 세이다. 성장곡선이다. 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 갑상샘자극호르몬 | 3.2 mIU/L | 0.5~45 |\n| 유리 T4 | 1.1 ng/dL | 0.7~2.0 |\n| 인슐린유사성장인자-1 | 111 ng/mL | 100~300 |","options":["부당경량아","가족성저신장","체질성장지연","갑상샘저하증","성장호르몬결핍증"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q61"},{"id":"2025-L10-Q83","year":2025,"qnum":83,"jokbo_lec_no":10,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"11세 남아가 키가 또래에 비해 작다며 병원에 왔다. 임신 나이 40주에 출생체중 3,300 g으로 태어났으며, 발달은 정상이다. 키 137 cm (10백분위수), 체중 31.2 kg (10 백분위수) 로 1 년 전에도 키와 체중이 각각 10백분위수였다. 고환은 2 mL 음모는 성성숙도 1 단계이다. 어머니가 초등학교 졸업 때까지 키가 작았으나 현재는 162 cm이고, 아버지 키는 174 cm이다. 왼쪽 손목 X선 검사에서 뼈나이는 9세이다. 검사는?","stem_table":null,"options":["추적관찰","염색체 핵형검사","성장호르몬자극검사","인슐린유사성장인자-1","17-하이드록시프로제스테론"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q83_p7.png","note":null,"id_simple":"2025-Q83"},{"id":"2025-L11-Q17","year":2025,"qnum":17,"jokbo_lec_no":11,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"16세 남자가 양측 유방이 만져져 병원에 왔다. 키 176 cm, 몸무게 63 kg이다. 혈압 118/81 mmHg, 맥박 71 회/ 분, 호흡 13 회/분, 체온 36.5°C이다. 양측 유방은 직경 5 cm 정도 였으며, 압박을 가해 만지면 아파한다. 팔다리가 길어 보이며, 고환은 2 mL로 작고 단단하고 음경이 작으며 음모는 없다. 간은 만져지지 않는다. 진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 갑상샘자극호르몬 | 4.0 mIU/L | 0.34~4.25 |\n| 유리 T4 | 1.3 ng/dL | 0.8~1.7 |\n| 테스토스테론 | 123 ng/dL | 270~1,070 |\n| 황체형성호르몬 | 27 mIU/mL | 2.0~120 |\n| 난포자극호르몬 | 42 mIU/mL | 1.0~12.0 |\n| 인슐린유사성장인자-1 | 461 ng/mL | 193~731 |\n| 부신피질자극호르몬 | 16.0 pg/mL | 6~76 |\n| 오전 9시 코티슬 | 11.0 μg/dL | 5~25 |","options":["칼만증후군","갑상샘저하증","뇌하수체저하증","클라인펠터 증후군","생리적 여성형유방"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q17"},{"id":"2025-L11-Q72","year":2025,"qnum":72,"jokbo_lec_no":11,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"1세 여아가 흉부에서 유방덩어리가 만져져 병원에 왔다. 덩어리는 직경 2 cm 원형으로, 만지면 아파했다. 주위 피부의 변색은 없다. 유방덩어리는 생후 6개월에 만져졌으며, 크기 변화가 없다. 간과 지라는 만져지지 않는다. 질분비물이나 질출혈은 없었다. 키와 체중은 50백분위수이며, 음모는 성성숙도 1기다. Cafe-au-lait 반점은 없다. 검사는?","stem_table":null,"options":["검사없이 관찰","염색체핵형검사","유방 흡인 조직 검사","17-히드록시프로게스테론","생식샘자극호르믄방출호르몬자극검사"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q72"},{"id":"2025-L11-Q86","year":2025,"qnum":86,"jokbo_lec_no":11,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"6.5세 여아가 좌측 흉부에서 2개월 전부터 덩어리가 만져져 병원에 왔다. 덩어리는 직경 2 cm 원형으로, 만지면 아파한다. 유두는 덩어리 정중앙에 위치해 있다. 우측에서는 덩어리가 만져지지 않는다. 주위 피부의 변색은 없었다. 키는 현재 70 백분위로서 1년 전에는 50백분위였다. 음모는 없었다. 검사결과는 다음과 같다. 진단은?\n생식샘자극호르믄방출호르몬 투여 후 황체화호르몬 최고농도 8 mIU/mL\n뼈나이 9세","stem_table":null,"options":["가성(말초) 성조숙증","진성(중추) 성조숙증","유방조기발육증","맥큔-알브라이트 증후군","21 수산화효소결핍에 의한 선천부신과형성증"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q86"},{"id":"2025-L12-Q9","year":2025,"qnum":9,"jokbo_lec_no":12,"lecture":"내분비고혈압","professor":"곽수현","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"35세 남자가 조절되지 않는 고혈압으로 병원에 왔다. 6개월 전부터 혈압이 잘 조절되지 않아 지역 병원에서 3 종류의 항고혈압제 (ACE억제제, 칼슘채널차단제, 이뇨제)를 복용 중이나, 최근 측정한 혈압이 165/100 mmHg로 계속 높게 나온다. 환자는 비만하지 않고 흡연하지 않는다고 한다. 평소 술과 커피 섭취도 적으며, 약물 복용 순응도도 양호하다. 과거력에서 특별한 질환은 없었다. 다음으로 시행할 호르몬 검사는?\nHb 14.6 g/dL, WBC 6,300/ μL Platelet 245,000/ μL\nCr 0.9 mg/dL, FBS 92 mg/dL\nTotal cholesterol 188 mg/dL HDL-C 48 mg/dL, LDL-C 112 mg/dL Triglyceride 135 mg/dL\nNa+ 141 mmol/L, K+ 3.0 mmol/L","stem_table":null,"options":["혈중 바소프레신","혈중 유리 메타네프린","혈중 코르티솔 및 ACTH","혈중 갑상선자극호르몬 및 유리 T4","혈증 레닌 활성도와 알도스테론 농도"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q9"},{"id":"2025-L12-Q53","year":2025,"qnum":53,"jokbo_lec_no":12,"lecture":"내분비고혈압","professor":"곽수현","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"35세 여성이 두통, 심계항진, 발한 증상으로 병원에 왔다. 증상은 수 주 전부터 간헐적으로 반복되었고, 최근에는 더 자주 발생하고 있다. 증상이 나타날 때 혈압이 갑자기 180/100 mmHg 이상으로 상승 하고, 맥박도 110회/분 이상으로 증가한다고 한다. 환자는 불안감을 동반하며, 증상이 수 분에서 수십 분간 지속되다가 저절로 호전되기를 반복한다. 환자의 가족력에서 어머니가 40대에 부신증양으로 수술받은 병력이 있다.\n신체검진 시 혈압은 160/95 mmHg. 심박수는 105 회/ 분이었다. 체온은 정상이고 심잡음이나 폐음 이상은 없다.\n24시간 소변 분획화 metanephrine, 혈중 유리 metanephrine이 증가되어 있었다.\n진단은?","stem_table":null,"options":["쿠싱병","갈색세포종","의인성 쿠싱증후군","원발성 알도스테론증","자가면역성 부신기능저하증"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q53"},{"id":"2025-L12-Q69","year":2025,"qnum":69,"jokbo_lec_no":12,"lecture":"내분비고혈압","professor":"곽수현","curr_lec_no":"10","curr_lecture":"내분비 고혈압","stem":"40세 남자가 고혈압으로 병원에 왔다. 2년 전부터 고혈압으로 진단받아 칼슘채널차단제와 ACE억제제를 복용 중이나, 혈압은 150/95 mmHg으로 조절되지 않았다. 최근 피로감과 간헐적인 근육경련을 호소하였다. 신체검진에서 혈압은 158/100 mmHg, 심박수는 78회/분이었다. 체질량지수(BMI)는 23.4 kg/m2이다.\n비조영 부신 CT에서 양측 부신의 미만성 비대가 관찰되었고, 부신정맥채혈(adrenal venous sampling) 을 통해 양측성 부신 과증식증(bilateral aderenal hyperplasia)으로 진단되었다. 치료는?","stem_table":null,"options":["알파차단제","베타차단제","Spironolactone","Thiazide계 이뇨제","안지오텐신II 수용체 억제제"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q69"},{"id":"2025-L13-Q3","year":2025,"qnum":3,"jokbo_lec_no":13,"lecture":"부신, 신경내분비종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"다음 중 부신, 신경내분비종양 핵의학 영상검사의 원리에 해당하는 분자 표적은?","stem_table":null,"options":["insulin","calcium channel","dopamine transporter","sodium iodide symporter","norepinephrine transporter"],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q3"},{"id":"2025-L13-Q22","year":2025,"qnum":22,"jokbo_lec_no":13,"lecture":"부신, 신경내분비종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"소마토스타틴수용체 과발현이 되어 Ga-68 DOTATOC PET/CT로 진단할 수 있는 종양으로 진단 예측능이 가장 낮은 것은?","stem_table":null,"options":["인슐린종","갑상선암","갈색세포종","신경모세포종","골연화증 유발 종양"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q22"},{"id":"2025-L13-Q79","year":2025,"qnum":79,"jokbo_lec_no":13,"lecture":"부신, 신경내분비종양의 핵의학 진단, 치료","professor":"강건욱","curr_lec_no":"16","curr_lecture":"부신,신경내분비종양의 핵의학 진단,치료","stem":"췌장 신경내분비증양 다발성 간전이로 lanreotide, everolimus, sunitinib 치료에 실패한 환자에서 시행한 Ga-68 DOTATOC PET/CT 영상이다. 다음으로 시행할 것은?","stem_table":null,"options":["간절제술","인슐린 주사","I-131 MIBG 치료","F-18 FDG PET/CT","LU-177 DOTATATE 치료"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q79_p9.png","note":null,"id_simple":"2025-Q79"},{"id":"2025-L15-Q42","year":2025,"qnum":42,"jokbo_lec_no":15,"lecture":"다발성내분비질환","professor":"송영신","curr_lec_no":"12","curr_lecture":"다발성내분비질환","stem":"다발성 내분비 종양 1형 (multiple endocrine neoplasia type 1)에 대한 유전자 검사를 시행해야할 대상으로 맞는 것은?","stem_table":null,"options":["갑상선 수질암으로 진단된 42세 남자","양측성 부신 갈색세포종이 진단된 26세 여자","부갑상선기능항진증과 뇌하수체의 프로락틴 분비 선종이 동시에 진단된 35세 여자","갑상선 유두암 수술 후 병리검사에서 수질암이 함께 발견된 43세 여자의 15세 자녀 여아","혈액투석 중이며 부갑상선 4개가 커져있고 칼슘과 부갑상선호르몬 농도가 증가한 51세 남자"],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q42","reparsed":true},{"id":"2025-L16-Q6","year":2025,"qnum":6,"jokbo_lec_no":16,"lecture":"뇌하수체, 부신, 다발성내분비질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"45세 남자 환자가 발작적인 심계항진과 두통, 발한을 주소로 방문하였다. 환자는 혈압 변동이 큰 고혈압도 발견되었다. 복부 전산화 단층 촬영 소견상 부신에 크기 4x8 cm의 종괴가 발견되어 수술하였고 육안 소견 및 현미경 소견은 아래와 같았다. 이 병변에 대한 설명 중 가장 적합한 내용은?","stem_table":null,"options":["Enterochromaffin 세포들이 serotonin을 주로 분비하게 된다.","종양의 크기 및 현미경적 소견상 악성의 가능성은 없다.","24시간 소변에서 cortisol 검출이 특징적이다.","RET, VHL, NF1, SDH 등이 원인 유전자들로 밝혀지고 있다.","뇌하수체 선종의 호르몬 분비에 의한 자극이 주요 원인 중 하나이다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q6_p10_a.png","note":null,"id_simple":"2025-Q6"},{"id":"2025-L16-Q36","year":2025,"qnum":36,"jokbo_lec_no":16,"lecture":"뇌하수체, 부신, 다발성내분비질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"39세 남자 환자가 두통을 주소로 내원하여 시행한 뇌 MRI상 suprasellar mass가 관찰되어 수술을 시행한 검체의 현미경적 소견은 아래와 같다. 다음 중 옳은 기술은?","stem_table":null,"options":["G protein 신호경로의 활성화에 의해서 일어난다.","뇌하수체 전엽에서 생겨서 터키안 상방으로 침윤하는 특성을 갖고 있다.","HRAS의 변이가 있을 가능성이 높다.","MEN-2A type에 자주 동반된다.","BRAF 변이를 타겟으로 하는 약제에 반응할 가능성이 높다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q36_p10.png","note":null,"id_simple":"2025-Q36"},{"id":"2025-L16-Q89","year":2025,"qnum":89,"jokbo_lec_no":16,"lecture":"뇌하수체, 부신, 다발성내분비질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"51세 여자가 두통 및 서서히 진행하는 visual field defect를 주소로 내원하였다. 혈액 검사상 혈장 prolactin이 90 ng/mL (정상, <14ng/mL)이었고 CT 및 MRI 검사상 아래 좌측과 같은 소견이었고 수술적으로 절제한 후 병리검사에서 아래 우측과 같은 현미경적 소견이 관찰되었다. 이 환자에 대한 설명으로 옳은 것은?","stem_table":null,"options":["뇌하수체의 염증성 병변일 가능성이 높다.","뇌하수체의 비기능성 (non-functioning) 선종일 가능성은 없다.","진단을 위한 감별을 위해 수술 검체에서 prolactin에 대한 면역화학염색을 시행하는 것이 필요하다.","조직학적 소견 상 reticulin network이 유지되는 것이 특징적이다.","터키안 상방 (suprasellar area)의 두개인두종 (craniopharyngioma)일 가능성이 있다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q89_p10.png","note":null,"id_simple":"2025-Q89"},{"id":"2025-L17-Q14","year":2025,"qnum":14,"jokbo_lec_no":17,"lecture":"노화와 내분비","professor":"최성희","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"남자, 여자 모두에서 신체의 노화가 진행되면서 나타나는 대표적인 현상은 골격근의 손실 및 기능감소이다. 이를 보통 근감소증 (sarcopenia)으로 정의한다. 이와 연관된 현상으로 옳게 기술한 것은?","stem_table":null,"options":["근감소증은 주로 키와 체중감소로 진단한다.","MRI 검사에서 골격근 내부의 지방침착은 감소한다.","근감소증은 근육량, 근력, 근기능이 모두 감소한다.","노인에서의 골격근 소실은 보통 내장지방의 소실과 동반된다.","근감소증은 고지방식이 및 안정과 휴식이 중요하다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q14"},{"id":"2025-L17-Q28","year":2025,"qnum":28,"jokbo_lec_no":17,"lecture":"노화와 내분비","professor":"최성희","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"신체 노화의 대표적인 증상인 근감소증의 치료 및 관리 방법으로 가장 적절한 것은?","stem_table":null,"options":["고지방식이를 통한 체중증가가 필요하다.","근감소증을 평가하는 표준적인 방법이 존재하지 않는다.","여성호르몬, 남성호르몬 보충치료가 주된 약물치료이다.","저항성근력운동과 충분한 양질의 단백질 섭취를 권고한다.","인슐린양 성장인자의 촉진을 위해 성장호르몬 치료를 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q28"},{"id":"2025-L17-Q49","year":2025,"qnum":49,"jokbo_lec_no":17,"lecture":"노화와 내분비","professor":"최성희","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"신체의 노화가 진행되면서 일어나는 다양한 호르몬 변화의 방향성이 올바르게 기술된 것은?","stem_table":null,"options":["인슐린 분비의 증가 및 저항성 감소","뇌하수체에서 갑상샘 자극호르몬 TSH 증가","부신 Dehydroepiandrosterone (DHEA)생성 증가","성장호르몬 및 인슐린양성장인자 (IGF-1) 증가","부신 Glucocorticoid 의 일중변화 유지 및 수치 감소"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q49","reparsed":true},{"id":"2025-L18-Q38","year":2025,"qnum":38,"jokbo_lec_no":18,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"29세 남자가 결혼 후 임신을 원하여 방문하였다. 환자는 7년 전 뇌하수체 선종제거술을 시행 받았고, 이후 부신피질호르몬, 갑상선호르몬, 테스토스테론 제제를 복용해 왔다. 테스토스테론을 중지하고 주 3 회 2000 IU의 hCG (human chorionic gonadotropin) 를 3 개월간 근육주사 하였다. 테스토스테론치는 정상화 되었으나 계속 무정자증을 보여 주 3회 75 IU recombinant FSH를 추가하였다. 이후 3 개월 째 무정자증이다. 적절한 대책은?","stem_table":null,"options":["주 3회 2000 IU의 hCG, 75 IU recombinant FSH 유지","테스토스테론 제제를 추가 투여","hCG의 용량을 3000 IU로 증량 투여","GnRH pulsatile infusion pump로 교체","고환에서 정자추출 후 ICSI (intracytoplasmic spem injection)"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q38"},{"id":"2025-L18-Q45","year":2025,"qnum":45,"jokbo_lec_no":18,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"정자형성 과정에서 시상하부-뇌하수체-고환 축의 호르몬 조절에 대한 설명이다. 틀린 것은?","stem_table":null,"options":["FSH는 남성의 사춘기에 정자형성 과정이 시작되는 데 필수적인 호르몬이다.","정상적인 정자생산을 위해서는 일정 수준의 고환 내 테스토스테론 (Testosterone)이 필수적이다.","남성 성인에서 FSH의 주된 역할은 양적으로 정상적인 수준의 정자형성을 유지시키는 것이다.","테스트스테론 (Testosterone)은 인히빈 (Inhibin)과 함께 되먹임기전을 통해 뇌하수체에서 FSH 생성을 직접 억제한다.","FSH의 주 표적기관은 고환의 세정관 내에 존재하는 세르톨리세포(Sertoli cell)이며, 세포막에 존재하는 수용체와 결합한 뒤 다양한 세포신호전달체계를 거쳐 정자형성과정에 필요한 여러 단백질의 합성을 촉진한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q45"},{"id":"2025-L18-Q65","year":2025,"qnum":65,"jokbo_lec_no":18,"lecture":"남성호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"27세 남성이 불임과 성욕감퇴로 병원을 방문하였다. 신장은 178 cm 체중은 63 kg 이었으며, 혈압과 맥박수, 호흡 등은 모두 정상이었다. 과거력에서도 특이한 사항은 없었다. 신체검사에서 양측 고환이 모두 5 mL였다. 혈액검사에서 LH는 19 mIU/mL (1-10 mIU/mL). FSH는 38 mIU/mL (1-9 mIU/mL). testosterone은 150 ng/dL (300-1,000 ng/dL)였다. 처음 정액검사에서 정액양은 2mL 정자는 관찰되지 않았다. 반복 시행한 정액검사에서도 이전검사와 유사하였으며, 정자는 관찰되지 않았다. 확진을 위해 다음으로 시행해야 할 검사는?","stem_table":null,"options":["경직장초음파검사","컴퓨터단층촬영 (sellar CT)","GnRH (gonadotropin releasing homone) 자극검사","염색체검사","고환생검"],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q65"},{"id":"2025-L19-Q21","year":2025,"qnum":21,"jokbo_lec_no":19,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"정상적인 성분화 과정은 유전적인 성결정 및 성선의 성결정 과정으로 구분할 수 있다. 또한 이러한 성결정 기준에는 형태학적 기준과 정신적 기준이 포함된다. 다음은 정상적인 성결정 과정에 대한 설명이다. 맞는 것은?","stem_table":null,"options":["고환형성은 X염색체내 SRY의 존재에 의해 결정된다.","여성의 성선으로 발달하려면 에스트로젠의 역할이 중요하다.","성발달 과정의 첫 번째 단계는 성선(gonadal sex)의 결정이다.","성결정은 외생식기의 모양에 따라 확정한다.","성결정 과정에서 환자의 성정체성 및 성역할에 대한 확인이 필요하다."],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q21"},{"id":"2025-L19-Q67","year":2025,"qnum":67,"jokbo_lec_no":19,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환에서는 생식선에서의 종양발생 위험이 높아 필요시 생식선의 예방적 적출술을 시행해야 한다. 다음 중 생식선의 예방적 적출술이 반드시 필요한 질환은?","stem_table":null,"options":["46XX testicular DSD (XX male)에서의 양측고환","46XY complete gonadal dysgenesis에서 양측 흔적성선","46XY ovotesticular DSD에서 남성으로 성결정한 음낭내 고환","45XO/46XX Turner syndrome에서 양측 흔적성선","46XY 5 alpha-reductase deficiency에서 음낭내 고환"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q67"},{"id":"2025-L19-Q80","year":2025,"qnum":80,"jokbo_lec_no":19,"lecture":"성분화 이상 질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환이 의심되는 모호한 외성기를 가지고 있는 환자에서는 무엇보다 정확한 진단이 중요하다. 다음 내용 중 틀린 것은?","stem_table":null,"options":["음낭 및 음순부위에서 성선유무를 확인하는 것이 중요하다.","X염색체 및 SRY의 유무를 확인하는 염색체검사를 조기에 시행해야 한다.","초음파 또는 MRI 등을 시행하여 여성 내부생식기 유무를 확인해야 한다.","감별진단을 위해서 생식기관조영술 (genitography)을 시행하는 것이 중요하다.","혈장에서 17-OH progesterone 을 측정하여 CAH 여부를 확인한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q80"},{"id":"2025-L20-Q16","year":2025,"qnum":16,"jokbo_lec_no":20,"lecture":"소아 뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"생후 3세 여아가 병원에 왔다. 내원 시 키 85cm (3백분위수 미만), 체중 14kg (25백분위수)이다. 임신나이 35주, 1.3kg (출생시 3백분위수 미만) 출생하여 신생아중환자실 입원하였고 뇌출혈로 인한 수두증으로 수술 받은 과거력이 있다. 생후 3주째 레보티록신 25 μg/day 과 하이드로코티손 보충을 시작하였고 현재는 35 μg/day 복용 중이다. 갑상선초음파에서 갑상선은 제 위치에 확인되었고 크기 적절하였다. 운동과 언어 발달 지연이 있으나 재활치료하면서 따라잡기 발달하고 있다. 혈액검사이다. 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 1.5 ng/dL | 0.8~20 |\n| 갑상선자극호르몬 | 0.3 mIU/L | 0.5~6.5 |\n| 인슐린유사성장인자-1 | <5 ng/mL | |","options":["미숙아 출생아로 일시적인 갑상선저하증이다.","성장호르몬 자극검사를 시행한다.","3세가 되었고 따라잡기 발달하였으므로 레브티투신 중단을 고려한다.","하이드로코티손은 평상시와 발열시 복용 용량이 동일하다.","선천 갑상선형성부전이다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q16_p12.png","note":null,"id_simple":"2025-Q16"},{"id":"2025-L20-Q68","year":2025,"qnum":68,"jokbo_lec_no":20,"lecture":"소아 뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"5세 여아가 키가 작아서 병원에 왔다. 현재 키 95 cm, 체중 20kg (이전 키와 체중 성장곡선 그림 참조)이다. 임신나이 40주, 1,800g 으로 출생하였고, 신생아기 세균성 뇌수막염으로 중환자실 치료받았다. 운동과 언어발달은 정상이었다. 아버지 키는 180 cm, 어머니 키는 153 cm 로 초경을 중3 때 하였다. 검사결과이다. 적절한 설명은?","stem_table":null,"options":["선천 성장호르몬 결핍증으로 MRI 추적이 필수는 아니다.","야뇨, 다뇨 증상이 있으면 항이뇨호르몬 치료를 고려한다.","부신피질자극호르몬(ACTH) 수치가 상승되어 있는지 확인을 요한다.","성장호르몬 결핍증, 중추성 갑상선 저하증이 동반된 뇌하수체 저하증이다.","신속히 성장호르몬 치료를 시작한다."],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q68_p12.png","note":null,"id_simple":"2025-Q68"},{"id":"2025-L20-Q88","year":2025,"qnum":88,"jokbo_lec_no":20,"lecture":"소아 뇌하수체 질환","professor":"이영아","curr_lec_no":"13","curr_lecture":"소아 뇌하수체 질환","stem":"8세 남아가 키가 잘 자라지 않아서 병원에 왔다. 임신나이 39주 출생체중 3,100g 으로 주산기적 문제 없이 출생하였고, 운동, 언어발달은 정상이었다. 현재 키 121 cm, 체중 28 kg 이었고 고환은 양쪽 모두 2cc로 만져졌고 음모는 없었다. 성장곡선(그림)과 검사결과이다. 아버지 키는 180 cm, 어머니 키는 157 cm 로 초경을 초6 때 하였다.\n가장 적절한 설명은?","stem_table":null,"options":["선천 성장호르몬 결핍증으로 MRI 추적이 필수는 아니다.","야뇨, 다뇨 증상이 있으면 항이뇨호르몬 치료를 고려한다.","부신피질자극호르몬(ACTH) 수치가 상승되어 있는지 확인을 요한다.","성장호르몬 결핍증, 중추성 갑상선 저하증이 동반된 뇌하수체 저하증이다.","신속히 성장호르몬 치료를 시작한다."],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q88"},{"id":"2025-L21-Q8","year":2025,"qnum":8,"jokbo_lec_no":21,"lecture":"소아 부신질환","professor":"이영아","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"생후 18일 신생아가 신생아 선별검사 이상으로 병원에 왔다. 임신나이 37주 2,600g 으로 출생하였고 주산기적 문제는 없었다. 내원 3일 전부터 구토를 시작하여 1일 전부터는 잘 먹지 못하였고 소변은 12시간 전에 마지막으로 보았다. 내원 시 체중은 2,700g 이었다. 구강점막은 말라있었고, 구강 점막과 음낭 피부 착색이 확인되었다. 음경 크기는 정상이었고 음낭에 고환이 만져지지 않았다. 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| Glucose | 45 mg/dL | |\n| Na | 129 mmol/L | |\n| K | 7.5 mmol/L | |\n| Cl | 96 mmol/L | |\n| BUN | 51 mg/dL | |\n| Creatinine | 1.3 mg/dL | |\n| 17-OH-progesterone | 725 ng/mL | |\n| ACTH | 326 pg/mL | |\n| Cortisol | 1.8 ng/dL | |\n| Plasma renin activity | 24.7 ng/mL/hr | |","options":["저혈당이 있으므로 인슐린 주사는 투여하지 않는다.","하이드로코티손, 플루드로코티손, NaCl 경구약 복용을 즉시 시작한다.","염색체 검사를 시행한다.","5% 포도당이 들어있는 생리식염수를 근육 주사한다.","선천 부신 저형성증에 대한 유전자 검사를 시행한다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q8"},{"id":"2025-L21-Q74","year":2025,"qnum":74,"jokbo_lec_no":21,"lecture":"소아 부신질환","professor":"이영아","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"7세 남아가 음모가 나서 병원에 왔다. 임신나이 39주 2.3kg으로 출생하였고, 내원 당시 키는 130cm, 체중은 31kg이다 (키와 체중 성장곡선 참조). 진찰상 양측 고환 2cc, 음모와 음경 성성숙도 3단계이다. 아빠키 170cm, 엄마키 160cm이고, 엄마초경시기는 초등 5학년이다. 과거 다른 질환이나 수술 병력은 없었다. 검사 결과이다. 옳은 설명은?","stem_table":"| 검사 | 결과 |\n|---|---|\n| Glucose | 80 mg/dL |\n| Na | 137 mmol/L |\n| K | 5.1 mmol/L |\n| Creatinine | 0.8 mg/dL |\n| 17-OH-progesterone | 120 ng/mL |\n| 골연령 | 11세 |","options":["21-수산화효소결핍증 가능성이 높으며, 단순 남성화형이다.","GnRH 자극검사를 시행한다.","고환 초음파를 시행한다.","뇌 MRI 검사를 시행한다.","부신호르몬을 잘 보충하면 중추성 성조숙증이 발생하지 않는다."],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q74_p13.png","note":null,"id_simple":"2025-Q74"},{"id":"2025-L21-Q81","year":2025,"qnum":81,"jokbo_lec_no":21,"lecture":"소아 부신질환","professor":"이영아","curr_lec_no":"14","curr_lecture":"소아 부신 질환","stem":"7세 여아가 유방 멍울이 만져져서 병원에 왔다. 임신나이 38주, 2.9kg으로 출생하였고, 신생아선별검사를 통해 선천부신과형성증, 21-수산화효소 결핍증 조기 진단되어 부신호르몬 보충을 시작하였으며, 하이드로코티손, 플로드로코티손을 지속 복용중이다. 영아기 외부생식기 교정술을 받았다. 내원 당시 키는 129cm (90-95백분위수), 체중은 34kg (95백분위수 이상)이다. 검진 결과 유방 성성숙도 2단계, 음모 성성숙도 2단계이다. 아빠키 175cm, 엄마키 160cm이고, 엄마초경시기는 초등 6학년이다. 골연령은 11세이다. 가장 적절한 우선 조치는?","stem_table":null,"options":["하이드로코티손을 프레드니솔론으로 변경한다.","GnRH 자극검사를 시행한다.","난소 초음파를 시행한다.","뇌 MRI 검사를 시행한다.","안드로젠 과잉을 억제하는 여성호르몬 보충이 필요하다."],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q81"},{"id":"2025-L22-Q39","year":2025,"qnum":39,"jokbo_lec_no":22,"lecture":"갑상선 생리와 기능조절","professor":"박도준","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"갑상선호르몬 합성과정에 필요한 갑상선 세포내에 존재하는 A, B, C, D 에 해당하는 것이 옳게 표시된 것은?","stem_table":null,"options":["A(NIS) - B(Na+/K+ ATPase) - C(Pendrin) - D(thyroperoxidase)","A(Pendrin) - B(Na+/K+ ATPase) - C(thyroperoxidase) - D(Na+/K+ ATPase)","A(NIS) - B(Na+/K+ ATPase) - C(thyroperoxidase) - D(Pendrin)","A(Pendrin) - B(Na+/K+ ATPase) - C(thyroperoxidase) - D(NIS)","A(NIS) - B(thyroperoxidase) - C(Pendrin) - D(Na+/K+ ATPase)"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q39_p13.png","note":null,"id_simple":"2025-Q39"},{"id":"2025-L22-Q77","year":2025,"qnum":77,"jokbo_lec_no":22,"lecture":"갑상선 생리와 기능조절","professor":"박도준","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"요오드 대사에 대한 다음 설명 중 옳은 것을 고르시오.","stem_table":null,"options":["요오드는 위에서 흡수된다.","요오드의 대부분은 신장을 통해 소변으로 배설된다.","과량 섭취된 요오드의 과량분은 대변을 통해 배출된다.","갑상선에서의 요오드는 유기요오드의 형태로 저장된다.","임산부의 경우 요오드 요구량은 감소한다.> **학습부원 주**: 77번 문항 4번 선지에 대한 이의신청이 있었으며, 교수님 답변에 의해 2번이 정답이나 4번도 맞는 것으로 처리됨."],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q77"},{"id":"2025-L22-Q87","year":2025,"qnum":87,"jokbo_lec_no":22,"lecture":"갑상선 생리와 기능조절","professor":"박도준","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"Free T4와 TSH의 관계를 표시한 다음의 표에서 B, C, D, E의 진단으로 옳은 조합을 고르시오.","stem_table":null,"options":["B (primary hypothyroidism) - C(subclinical hypothyroidism) - D (inappropriate TSH secretion) - E (primary hyperthyroidism)","B (inappropriate TSH secretion) - C (subclinical hypothyroidism) - D (central hypothyroidism) - E (primary hyperthyroidism)","B (primary hypothyroidism) - C (subclinical hypothyroidism) - D (inappropriate TSH secretion) - E (central hypothyroidism)","B (subclinical hypothyroidism) - C (inappropriate TSH secretion) - D (central hypothyroidism) - E (subclinical hyperthyroidism)","B (subclinical hypothyroidism) - C (primary hyperthyroidism) - D (central hypothyroidism) - E (primary hyperthyroidism)"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q87_p14.png","note":null,"id_simple":"2025-Q87"},{"id":"2025-L23-Q56","year":2025,"qnum":56,"jokbo_lec_no":23,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"62세 여자가 4개월 전부터 시작된 전신쇠약감, 부종, 체중증가, 추위를 주소로 내원하였다. 과거력상 3번의 출산 후 매번 갑상선기능저하증으로 갑상선호르몬제를 3-6개월간 복용 후 회복되어 중단한 바 있다. 내원 후 시행한 갑상선기능검사는 다음과 같다.\n향후 이 환자의 치료로 적절한 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| free T4 | 0.43 ng/dL | 0.8-1.8 |\n| TSH | 34 mIU/L | 0.5-45 |","options":["반복된 갑상선염이 의심되므로 스테로이드제를 투여한다.","과거력을 고려하면 저절로 회복될 가능성 높으므로 1년 후 재검사한다.","갑상선호르몬제(levothyroxine, T4) 투여를 시작한다.","반복된 갑상선염으로 갑상선암 발생의 우려가 있어 갑상선절제술 후 갑상선호르몬제를 투여한다.","갑상선호르몬제를 투여하되, 반드시 스테로이드제를 먼저 투여 후 갑상선호르몬제 투여를 시작한다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q56","reparsed":true},{"id":"2025-L23-Q66","year":2025,"qnum":66,"jokbo_lec_no":23,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"41세 여자가 2주일간 지속된 전경부 통증을 주소로 내원하였다. 신체검진상 혈압 130/60 mmHg, 심박수 110회/분 이었으며 갑상선 촉진 상 좌측 갑상선이 부어있었고 해당부위에 압통을 호소하였다. 갑상선 기능 검사 상 유리티록신 418 ng/dL (0.7.~1.8 ng/dL), 갑상선자극호르몬 0.05 mIU/L (0.45~45 mIU/L) 였다. 갑상선자가항체는 모두 음성이었으며, ESR이 82 mm/h (<20) 로 증가되어 있었다. 갑상선 스캔 사진은 다음과 같았다. 이 환자에서 향후 치료로 적절한 것은?","stem_table":null,"options":["항갑상선제 치료를 시작한다.","방사성요오드치료가 필요하다.","통증이 심할 경우 스테로이드제 투여를 고려한다.","갑상선감염에 대해 항바이러스제 또는 항생제 치료가 필요하다.","향후 갑상선기능저하증의 발생 가능성이 높으므로 즉시 갑상선호르몬제 투여를 시작한다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q73_p15.png","note":null,"id_simple":"2025-Q66"},{"id":"2025-L23-Q73","year":2025,"qnum":73,"jokbo_lec_no":23,"lecture":"갑상선기능저하, 갑상선염","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"25세 여자가 약 2 주 전부터 더위 및 심계항진을 주소로 내원하였다. 환자는 2개월 전 출산하였고 현재 수유는 하지 않고 있다. 내원 후 시행한 갑상선기능검사에서 유리T4 275 ng/dL (0.7~1.7 ng/dL). TSH 0.05 mIU/L (0.5~45 mIU/L)의 소견 보였으며 ESR 13 mm/h (< 20 mm/h), 항갑상선과산화효소 항제 (anti-TPO Ab) 양성, 갑상선자극호르몬 수용체 항체 (anti-THS receptor Ab) 음성이었다. 이 환자의 치료로 가장 적합한 것은?","stem_table":null,"options":["갑상선절제술을 시행한다.","항갑상선제 투여를 시작한다.","즉시 갑상선호르몬제 투여를 시작한다.","증상 조절을 위한 베타차단제를 투여한다.","갑상선기능 안정화를 위한 방사성요오드 치료를 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2025-Q73"},{"id":"2025-L24-Q35","year":2025,"qnum":35,"jokbo_lec_no":24,"lecture":"갑상선기능항진증","professor":"이가희","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"47세 여성이 최근 4개월간 심계항진과 더위에 민감해진 증상으로 내원하였다. 땀이 많아지고, 다소 많이 먹기는 하지만 체중 변화는 없었다고 한다. 키 160cm, 체중 50kg이며, 혈압 150/90 mmHg, 맥박 108회/분, 체온은 36.9°C이다. 갑상샘은 좌측에서 직경 2.5cm의 경계가 명확한 결절이 촉지되며, 압통은 없고 림프절 종대는 관찰되지 않았다.\n혈액검사 결과는 다음과 같다.\n진단은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 혈색소 | 13.2 g/dL | 12.0~16.0 |\n| 백혈구 | 7,800/mm3 | 4,000-10,000 |\n| 혈소판 | 183,000/mm3 | 150,000-400,000 |\n| 갑상샘자극호르몬 | 0.02 mIU/L | 0.34~4.25 |\n| 유리 T4 | 1.9 ng/dL | 0.8~1.7 |\n| 항갑상샘과산화효소항체 | 18 IU/L | <35 |\n| 항갑상샘자극호르몬수용체항체 | 0.1 IU/L | <1.75 |","options":["그레이브스병","독성갑상샘종","리델갑상샘염","무통갑상샘염","하시모토갑상샘염"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q35_p15.png","note":null,"id_simple":"2025-Q35"},{"id":"2025-L24-Q55","year":2025,"qnum":55,"jokbo_lec_no":24,"lecture":"갑상선기능항진증","professor":"이가희","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"27세 여자환자가 눈물, 안구 동통 및 눈이 나오는 느낌 등으로 안과 방문하여 갑상선검사를 권유받아 시행한 혈액검사 결과는 아래와 같았다.\n이 환자에 대한 설명으로 옳은 것은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| TSH | <0.1 mIU/L | 0.4~41 |\n| free T4 | 3.25 ng/dL | 0.7~1.8 |\n| TSHR-Ab | 34 IU/L | <1.0 |","options":["안병증은 그레이브스병에서만 나타난다.","안병증과 갑상선기능항진증은 항상 동시에 나타난다.","갑상선기능항진증 처럼 TSH 수용체 항체가 안병증의 발생과 연관된다.","항갑상선제 치료로 갑상선기능이 호전되면 안병증도 비례하여 호전된다.","방사성요오드 치료 직후에 TSH 수용체 항체가 없어지면 안병증도 호전된다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q55_p15.png","note":null,"id_simple":"2025-Q55"},{"id":"2025-L24-Q90","year":2025,"qnum":90,"jokbo_lec_no":24,"lecture":"갑상선기능항진증","professor":"이가희","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"36세 여자가 3개월간 5 kg의 체중감소, 심계항진, 발한, 두통 및 손 떨림이 있어 내원하였다. 최근 1개월간은 묽은 변이 지속되었다고 한다. 갑상선기능검사 상 free T4 3.24 ng/dL (0.7~1.7 ng/dL), TSH < 0.01 mIU/L (0.5~45 mIU/L) 이었고 갑상선 스캔 소견은 다음과 같았다. 이 환자의 원인 질환으로 가장 가능성이 높은 질환은?","stem_table":null,"options":["그레이브스 병","무통성갑상선염","아급성갑상선염","TSH 분비 뇌하수체선종","갑상선호르몬에 대한 뇌하수체 내성"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q24_p14.png","note":null,"id_simple":"2025-Q90"},{"id":"2025-L25-Q30","year":2025,"qnum":30,"jokbo_lec_no":25,"lecture":"갑상선질환의 영상소견/갑상선결절의 진단과 치료","professor":"윤태진/조선욱","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"다음 갑상선 결절의 초음파 영상 소견 중 양성일 가능성이 가장 높은 결절은?","stem_table":null,"options":["Comet tail 인공물을 동반한 부분 낭성 결절","불규칙한 경계를 동반한 등에코성 고형 결절","앞뒤로 긴 모양의 저에코성 고형 결절","거대석회화를 동반한 등에코성 고형 결절","앞뒤로 긴 모양의 부분 낭중"],"answer":[1],"image":null,"note":null,"id_simple":"2025-Q30"},{"id":"2025-L25-Q31","year":2025,"qnum":31,"jokbo_lec_no":25,"lecture":"갑상선질환의 영상소견/갑상선결절의 진단과 치료","professor":"윤태진/조선욱","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"다음은 서로 다른 다섯 환자의 갑상선 초음파 영상이다. 초음파에서 보이는 결절 중 악성 결절의 가능성이 가장 높은 결절은?","stem_table":null,"options":["1","2","3","4","5"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q31_p15.png","note":null,"id_simple":"2025-Q31"},{"id":"2025-L25-Q51","year":2025,"qnum":51,"jokbo_lec_no":25,"lecture":"갑상선질환의 영상소견/갑상선결절의 진단과 치료","professor":"윤태진/조선욱","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"45세 여자가 건강검진에서 갑상샘 결절이 발견되었다며 병원에 왔다. 혈압 118/78 mmHg, 맥박 72 회/ 분, 호흡 16 회/ 분, 체온 36.4°C이다. 목 진찰에서 덩이가 만져지고, 압통은 없다. 검사 결과는 다음과 같다. 갑상샘 초음파검사 사진(사진","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 갑상샘자극호르몬 | 3.2 mIU/L | 0.34~4.25 |\n| 유리 T4 | 1.2 ng/dL | 0.7~1.24 |\n| 세침흡인세포검사 | 의미미결정비정형세포 (atypia of undetermined significance) | |\n| 99m테크네튬-갑상샘스캔 | 갑상샘 우엽에 냉결절 | |\n| 갑상샘 섭취율 | 정상 | |","options":["방사성요오드","고주파열치료","알코올경화요법","세침흡인세포검사 재시행","레보타이록신 3개월 투여 후 갑상샘 초음파검사"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q51_p16.png","note":null,"id_simple":"2025-Q51"},{"id":"2025-L26-Q13","year":2025,"qnum":13,"jokbo_lec_no":26,"lecture":"갑상선암의 진단과 치료","professor":"조선욱","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"72세 여자가 요통으로 시행한 영상학적 검사에서 악성 종양의 뼈 전이로 보여 조직검사를 시행한 결과 갑상선유두암이 의심되었고, BRAF 돌연변이가 검출되었다. 환자는 이전에 갑상선암을 앓았던 병력은 없었다. 갑상선초음파 검사를 시행하여 다음과 같은 소견을 보였다.\n갑상선결절에 대해 초음파유도하 세침흡인세포검사 시행한 결과 갑상선유두암으로 진단되었다. 다음 중 이 환자에서 가장 먼저 시행하여야 할 치료는?","stem_table":null,"options":["갑상선전절제술","방사성요오드 치료","갑상선호르몬제 치료","전신 세포독성 항암화학요법","전이성 갑상선 암의 표적치료제"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q13_p16.png","note":null,"id_simple":"2025-Q13"},{"id":"2025-L26-Q15","year":2025,"qnum":15,"jokbo_lec_no":26,"lecture":"갑상선암의 진단과 치료","professor":"조선욱","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"72세 여자 환자가 갑상선 미세유두암을 진단 받고 내원하였다. 환자는 건강 검진에서 시행한 갑상선 초음파에서 장경이 0.7cm인 결절을 진단 받았고(사진","stem_table":null,"options":["에탄을 주입술","적극적 경과관찰","체외방사선치료","방사성 동위원소 치료","T4 억제 요법"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q15"},{"id":"2025-L26-Q50","year":2025,"qnum":50,"jokbo_lec_no":26,"lecture":"갑상선암의 진단과 치료","professor":"조선욱","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"76세 여자가 최근 수 주간 경부 종괴가 갑자기 단단해지고 커지는 느낌이 있어 병원에 내원하였다. 환자는 수년 전 하시모토 갑상선염으로 진단받고 일시적으로 갑상선 호르몬제를 복용한 병력이 있으나, 최근 수년간은 약을 복용하지 않고 지내고 있었다. 신체 진찰에서 경부 우측에 약 3~4cm 크기의 단단한 갑상선 종괴가 촉지되며, 통증은 없다. 혈액검사에서 TSH와 free T4는 정상 범위이며, 갑상선 초음파에서는 저에코성의 불균질한 병변이 관찰되며, 경부 림프절은 특이소견이 없다.\n세침흡인세포검사(FNA) 결과는 림프구성 세포들이 우세하며, 일부 large atypical lymphoid cell 들이 동반되어 있었다.\n다음 중 이 환자에서 확진을 위해서 시행할 검사는 무엇인가요?","stem_table":null,"options":["혈청 티르글로블린","전신 양전자방출단층촬영","중심바늘생검","99mTo 갑상선 스캔","갑상선자극호르몬 수용체 항체"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q50_p16.png","note":null,"id_simple":"2025-Q50"},{"id":"2025-L27-Q24","year":2025,"qnum":24,"jokbo_lec_no":27,"lecture":"갑상선질환의 핵의학 검사 및 치료/갑상선세침흡인","professor":"천기정/나희영","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"경부에서 흑이 촉진되어 시행한 갑상선스캔 소견이다. 다음 중 갑상선암의 가능성이 가장 높은 소견은?","stem_table":null,"options":["A","B","C","D","E"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q24_p17.png","note":null,"id_simple":"2025-Q24"},{"id":"2025-L27-Q82","year":2025,"qnum":82,"jokbo_lec_no":27,"lecture":"갑상선질환의 핵의학 검사 및 치료/갑상선세침흡인","professor":"천기정/나희영","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선암으로 수술 후 시행한 방사성요오드(1-13","stem_table":null,"options":["I-131을 이용하여 반복 치료한다.","I-123으로 다시 검사한다.","FDG를 고용량으로 투여한다.","수술적 제거를 시도한다.","I-131 scan으로 추적 관찰한다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q82_p16.png","note":null,"id_simple":"2025-Q82"},{"id":"2025-L27-Q23","year":2025,"qnum":23,"jokbo_lec_no":27,"lecture":"갑상선질환의 핵의학 검사 및 치료/갑상선세침흡인","professor":"천기정/나희영","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 세침흡인검사(fine needle aspiration)에 대한 설명으로 옳은 것은?","stem_table":null,"options":["세침흡인검사의 경우 최종진단이 어려운 경우가 있어 최근에는 세침흡인검사보다 침생검(core needle biopsy)을 훨씬 더 많이 시행하는 추세이다.","Liquid based cytology를 이용한 경우에는 일반 도말 슬라이드보다 슬라이드를 많이 만들어 슬라이드를 모두 판독하는 데에 시간이 더 많이 소요된다.","갑상선세침흡인검사를 했을 때 가장 흔한 진단은 Malignant(악성)로 세침흡인검사를 시행한 환자의 대부분이 수술의 적응증이 된다.","Follicular neoplasm의 경우에는 세포밀도가 낮으면서 colloid가 풍부하게 보이고, 여프세프가 하나씩 흩어져 보이거나, 한층으로 펴져있는 형태로 관찰된다.","Papillary carcinoma(갑상선유두암)의 경우에는 cellular smear를 보이면서 중앙세포의 핵은 모양이 불규칙하고 groove나 pseudoinclusion을 관찰할 수 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2025-Q23"},{"id":"2025-L27-Q63","year":2025,"qnum":63,"jokbo_lec_no":27,"lecture":"갑상선질환의 핵의학 검사 및 치료/갑상선세침흡인","professor":"천기정/나희영","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선 세침흡인검사 판독에 있어서 Bethesda system에 대한 설명으로 옳은 것은?","stem_table":null,"options":["병리의사를 위한 분류체계로 병리소견을 기반으로 진단의 통일성을 위해 제시되었으며, 5개의 카테고리로 나뉘어져 있다.","Follicular neoplam 카테고리로 진단된 경우, 악성위험도가 30% 정도로 낮으며 분자 검사를 통해 진료 방침 수립에 도움을 받을 수 있으나, 최종 진단을 위해서는 진단적 엽절제술이 필요하다.","Atypia of undetermined significance (AUS) 카테고리는 indeterminate lesion이라고 부르며, 확진을 위해 추가 검사가 요구된다.","Malignant 로 나온 경우 악성위험도는 약 74% (67-83%)이므로, 추가적인 분자검사를 시행하거나, 절제술이 요구된다.","Benign 카테고리로 진단된 경우, 악성 위험도가 4% 정도로 임상상 및 초음파 소견을 고려하여 추적 관찰하게 된다."],"answer":[1,2,3,4,5],"image":null,"note":"전원 정답 처리","id_simple":"2025-Q63"},{"id":"2025-L28-Q5","year":2025,"qnum":5,"jokbo_lec_no":28,"lecture":"갑상선결절/암의 병리/분자병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"28세 여자 환자가 만져지는 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 다수의 종괴가 관찰되었고, 가장 큰 것은 1.5 x 1.0 cm으로 갑상선 세침흡인검사에서 Bethesda system category VI 로 진단받았다. 환자는 갑상선 전절제술을 시행 받았고 조직학적 소견은 다음과 같았다 (그림","stem_table":null,"options":["전반적으로 예후가 좋지만 젊은 나이에 발생한 경우에는 예후가 나쁘다.","다양한 조직학적 아형으로 나누고 있으나 아형에 따른 예후 차이는 없다.","혈행성 전이를 자주 일으켜 종양이 진행한 경우 뼈, 간, 폐 전이를 보인다.","이 증양에서 가장 흔하게 관찰되는 유전자 변이는 RAS mutation 이다.","유두상의 구조가 관찰되지 않더라도 ground glass nuclei, nuclear groove. nuclear pseudoinclusion과 같은 특징적인 핵의 소견으로 진단할 수 있다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q5_p19.png","note":null,"id_simple":"2025-Q5"},{"id":"2025-L28-Q58","year":2025,"qnum":58,"jokbo_lec_no":28,"lecture":"갑상선결절/암의 병리/분자병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"35세 남자 환자가 만져지는 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 크기 3.7 x 3.0 cm의 주변과 경계가 좋은 종괴가 관찰되었고, 갑상선 세침흡인검사에서 다음과 같은 소견으로 Bethesda system category IV 로 진단받았다 ( 그림","stem_table":null,"options":["30대의 젊은 연령에서 호발한다.","요오드 섭취가 높은 지역에서 발생 빈도가 높다.","종양의 발생에 기여하는 가장 흔한 유전자 변이는 RET mutation 이다.","림프절 전이를 흔하게 동반한다.","피막과 혈관 침습 정도 및 병기에 따라 예후가 다르다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q58_p18.png","note":null,"id_simple":"2025-Q58"},{"id":"2025-L28-Q62","year":2025,"qnum":62,"jokbo_lec_no":28,"lecture":"갑상선결절/암의 병리/분자병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"70세 남자 환자가 최근 갑자기 커지는 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 크기 6.5 x 5.0 cm의 주변과 경계가 좋지 않은 종괴가 관찰되었고, 갑상선 세침흡인검사에서 Bethesda system category VI로 진단받았다. 환자는 갑상선 전절제술을 시행받았고 조직학적 소견은 다음과 같았다. (그림","stem_table":null,"options":["PAX8-PPARγ translocation","RET/PTC gene rearrangement","RET mutation","TP53 mutation","RAS mutation"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q62_p18.png","note":null,"id_simple":"2025-Q62"},{"id":"2025-L29-Q41","year":2025,"qnum":41,"jokbo_lec_no":29,"lecture":"병리실습","professor":"나희영","curr_lec_no":"49","curr_lecture":"병리실습","stem":"47세 여자 환자가 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 갑상선 우엽에 한 개의 종괴가 관찰되어 엽절제술을 받았다. 아래 사진은 종괴의 저배율 및 고배율 현미경 사진이다. 종양에 대한 설명으로 옳은 것은?","stem_table":null,"options":["Familial form과 sporadic form이 있으며, 전자의 경우 빈도가 더 높다.","RET-PTC rearrangement 변이가 가장 흔하다.","추적 관찰에 이용할 수 있는 혈중 마커가 없어 재발 여부를 알기 어렵다.","RET mutation을 동반한 진행성 암종의 경우 Selpercatinib의 적응증이 된다.","RET mutation 중 exon 16의 M918T 변이의 경우 예후가 좋은 편이다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q41_p18.png","note":null,"id_simple":"2025-Q41"},{"id":"2025-L29-Q48","year":2025,"qnum":48,"jokbo_lec_no":29,"lecture":"병리실습","professor":"나희영","curr_lec_no":"49","curr_lecture":"병리실습","stem":"76세 여자가 갑상선 결절로 내원하였다. 환자는 이전에도 만져지던 목의 멍울이 최근에 갑자기 커졌다고 호소하였으며, 목이 쉬는 증상을 보였다. 초음파 소견상 갑상선 우엽에 7cm 크기의 종괴가 발견되어 수술적 절제술을 시행받았다. 다음 사진은 종괴의 현미경 소견이다. 종괴에 대한 설명으로 옳은 것은?","stem_table":null,"options":["가장 흔한 유전자 변이는 RAS mutation이다.","빠르게 자라지만, 예후는 좋은 편으로 갑상선 여포암과 유사하다.","한 종괴 내부에 분화가 좋은 갑상선 유두암 혹은 여포암을 동반하기도 한다.","대체로 젊은 환자에서 호발한다.","갑상선 주변조직으로의 침윤이 드문 편이다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q48_p18.png","note":null,"id_simple":"2025-Q48"},{"id":"2025-L29-Q60","year":2025,"qnum":60,"jokbo_lec_no":29,"lecture":"병리실습","professor":"나희영","curr_lec_no":"49","curr_lecture":"병리실습","stem":"35세 여자환자가 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 갑상선 우엽에 장경 1.5cm의 고형성 종괴가 관찰되었고, 세침흡인검사 후 갑상선 엽절제술을 시행 받았다. 다음은 절제된 종괴의 대표사진이다. 다음 중 옳은 것은?","stem_table":null,"options":["종양 내부에 amyloid 침착이 흔히 관찰된다.","CTNNB1 유전자 변이가 가장 흔하다.","피막(capsule)의 유무와 침범 여부가 진단에 중요하다.","면역염색에서 calcitonin, CEA에 양성 소견을 보인다.","종양세포 핵의 crowding. overlapping을 보이며 nuclear groove가 잘 보인다."],"answer":[3],"image":null,"note":null,"id_simple":"2025-Q60"},{"id":"2025-L30-Q1","year":2025,"qnum":1,"jokbo_lec_no":30,"lecture":"갑상선질환의 수술적치료 (항진증, 결절, 암)","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"55 세 남자 환자가 목의 종물이 커져서 내원하였다. 환자는 연하곤란, 호흡곤란이 있었으며 세침흡인검사상 양성으로 진단되었다. 갑상선 기능 검사결과 및 영상 소견이다. 치료는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| T3 | 118 ng/dL | 87-184 |\n| Free T4 | 0.84 ng/dL | 0.70-1.80 |\n| TSH | 0.58 mIU/L | 0.4-4.1 |","options":["항갑상선호르몬치료","갑상선 절제","6개월 뒤 세침흡인검사 재시행","고주파 절제술","방사선 동위원소 치료"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q1"},{"id":"2025-L30-Q10","year":2025,"qnum":10,"jokbo_lec_no":30,"lecture":"갑상선질환의 수술적치료 (항진증, 결절, 암)","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"36세 여자 환자, Graves' disease로 갑상선 전절제술을 시행받았다. 수술 후 6시간뒤 호흡곤란을 호소 하며 수술 부위의 swelling 및 bruise가 확인되었다 (아래사진). 우선 시행해야 할 조치는?","stem_table":null,"options":["ABGA 및 말초혈액 산소포화도 확인","환자 거상 후 심호흡 격려","창상 압박 드레싱","상처 개방 및 혈종 제거","기관 삽관"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q10_p19.png","note":null,"id_simple":"2025-Q10"},{"id":"2025-L30-Q85","year":2025,"qnum":85,"jokbo_lec_no":30,"lecture":"갑상선질환의 수술적치료 (항진증, 결절, 암)","professor":"이규언","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"45세 여자가 갑상선 유두암으로 갑상선전절제술 및 중앙림프절절제술을 시행 받았다. 수술직후 손과 발이 저린 증상이 있었다. 혈압 120/80 mmHg, 맥박 80회/ 분, 호흡수 35 회/ 분, 체온 37.2 도이었다. 혈액 검사 결과는 다음과 같았다. 환자에서 나타날 수 있는 sign은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| PTH | 5 pg/mL | 15~65 pg/mL |\n| Ca | 8.0 mg/dL | 8.8~10.5 mg/dL |\n| ionized Ca | 0.75 mmol/L | 1.05~1.35 mmol/L |","options":["Bancroft's sign","Trousseau's sign","Chadwick sign","Traube's sign","Kussmaul's sign"],"answer":[2],"image":null,"note":null,"id_simple":"2025-Q85"},{"id":"2025-L31-Q27","year":2025,"qnum":27,"jokbo_lec_no":31,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"5세 여아가 목덩이(왼쪽 사진) 주소로 병원에 왔다. 임신나이 39주 3.2kg으로 출생하였고 신생아선별검사는 정상이었다. 신생아기 황달로 광선치료 받았으며, 간헐적으로 변비가 있다. 키 110cm (10-25 백분위수), 체중 25kg (90 백분위수), 체질량지수 95 백분위수 이상이다. 운동발달은 또래와 같았으나 말이 조금 늦었다고 한다. 적절한 설명은?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|---|---|\n| 유리 T4 | 1.1 ng/dL | 0.8~20 |\n| 갑상선자극호르몬 | 11 mIU/L | 0.5~6.5 |\n| 갑상선초음파 | 갑상선이 제 위치에 보이지 않음 | |\n| 99mTc 스캔 | (오른쪽 사진 참조) | |","options":["갑상설관 낭증 (thyroglossal duct cyst) 진단을 위해 초음파 검사를 시행한다.","딴곳 갑상선이 목덩이 원인이므로 수술적으로 제거한다.","갑상선호르몬 합성장애이므로 유전자 검사를 시행한다.","레보티록신 치료를 시작한다.","비만이 갑상선 저하증 원인이므로 체중 감량이 필요하다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q27_p19.png","note":null,"id_simple":"2025-Q27"},{"id":"2025-L31-Q40","year":2025,"qnum":40,"jokbo_lec_no":31,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"그레이브스병으로 methimazole 2.5 mg/일로 복용 중인 임산부가 정상 분만을 하였다.\n**[산모 임신 38주 혈액 검사]**\n총 T3 241 ng/dL (87-18","stem_table":null,"options":["모체의 상승된 혈중 T3","임산부가 복용한 항갑상선제","모체의 혈중 TSH 수용체 항체","모체의 혈중 갑상선과산화효소 항체","태아의 뇌하수체-갑상선 축의 미성숙"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2025/Q40_p20.png","note":null,"id_simple":"2025-Q40"},{"id":"2025-L31-Q70","year":2025,"qnum":70,"jokbo_lec_no":31,"lecture":"소아갑상선질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"생후 15일 여아가 황달로 병원에 왔다. 신생아 선별검사에서 갑상선자극호르몬 수치가 약간 높다고 들었다. 아이 대변 색깔은 황색이다. 오빠가 선천 갑상선 저하증으로 신생아기 레보티록신 투약을 시작하였는데 만 3세 중단하고 현재 8세까지 투약 없이 잘 지내고 있다. 검사결과이다. 적절한 조치는?","stem_table":"| 검사 | 결과 | 참고치 |\n|---|
