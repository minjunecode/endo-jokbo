"2021-L4-Q4": "**비내분비성 질환(non-endocrine systemic disease)**은 내분비계 자체의 이상이 아니라 전신 질환의 영향으로 다양한 호르몬 대사 변화를 초래한다. 제시된 기전들(전구물질 생성 변화, 결합단백량 변화, 내분비기관 혈류 변화, 호르몬 대사 변화, 조직 저항성 변화)은 모두 전신 질환이 내분비계에 미치는 간접적 영향에 해당한다.\n\n오답 이유: ①약제는 합성 억제, 분비 촉진/억제, 수용체 차단 등 특이적 기전. ②환경인자는 내분비 교란 물질 등 외부 노출 기전. ③유전성요인은 유전자 돌연변이로 인한 합성/구조 이상. ④자가면역성요인은 항체 또는 세포독성 면역에 의한 내분비선 파괴/자극.\n\n💡 **비내분비성 전신 질환 → 결합단백, 혈류, 대사 등 간접적 경로로 다발적 호르몬 이상 유발 (sick euthyroid 등이 대표 예)**",
"2021-L4-Q17": "**Primary adrenal insufficiency(일차성 부신기능부전)는 부신 자체의 파괴 또는 기능 소실**로 cortisol이 감소하는 것으로, 기능 분류상 **hormone underproduction**이다. '출혈(hemorrhage)'에 의한 일차성 부신기능부전(예: Waterhouse-Friderichsen syndrome)은 발생 기전(요인) 면에서 **necrosis/hemorrhage**로 분류되며, 'altered tissue response(조직 반응 변화)'가 아니다.\n\n오답 이유(나머지 올바른 매칭): ①하시모토 갑상선염 = hormone underproduction + autoimmune(맞음). ③1형 당뇨 = hormone underproduction + autoimmune(맞음). ④그레이브스병 = hormone overproduction + autoimmune(맞음). ⑤원발성 부갑상선기능항진증 = hormone overproduction + neoplastic growth(맞음).\n\n💡 **일차성 부신기능부전(출혈 원인) = hormone underproduction + necrosis/hemorrhage (altered tissue response X)**",
"2025-L4-Q11": "【정답: ③ 데스모프레신(Desmopressin)】\n혈청 Na⁺ 146 mEq/L(고나트륨혈증), 혈장 삼투압 302 mOsm/kg(상승), AVP 0.3 pg/mL(참고치 0.5~2.0, 저하) — 이는 전형적인 중추성 요붕증(central DI) 소견이다. 수분제한검사 결과(지문 내 '4번 결과')가 제시되었으며, 혈청 AVP가 낮은 상태에서 소변 농축이 불량하므로 ADH 유사체인 데스모프레신(DDAVP)이 표준 치료이다.\n① 리튬 — 신성 DI를 유발하는 약물, 치료와 무관. ② 수분제한 — DI 환자에게 수분제한은 탈수를 악화시킴. ④ 티아지드 — 신성 DI에 보조적으로 사용하는 역설적 치료제. ⑤ 수분제한 — ②와 동일 (중복 선지).\n💡 중추성 DI: AVP 저하 → DDAVP 투여 / 신성 DI: AVP 높거나 정상 → 티아지드·인도메타신·저염식.",
"2025-L4-Q25": "【정답: ③ 성장호르몬(GH)】\n성장호르몬의 주요 표적장기는 간(liver)으로, 간에서 IGF-1(Insulin-like growth factor-1)을 합성·분비하도록 자극한다. IGF-1이 GH의 실제 성장 촉진 효과를 대부분 매개한다.\n① 유즙분비호르몬(Prolactin) — 유방이 주요 표적. ② 바소프레신(ADH) — 신장 집합관이 표적. ④ 프로락틴 — ①과 동일(중복 개념). ⑤ ACTH — 부신피질이 표적.\n💡 GH의 이중 표적: 직접 효과(지방분해, 인슐린 길항)는 여러 조직에, 성장 촉진 효과는 간→IGF-1 경유.",
"2025-L4-Q37": "【정답: ② 프로락틴(Prolactin)】\n뇌하수체 전엽 호르몬 중 ACTH·TSH·LH·FSH는 각각 부신피질·갑상선·생식선에서 표적호르몬(cortisol·T3/T4·sex steroids)을 생성시키는 트로픽 호르몬이다. 반면 프로락틴(PRL)은 유방·유즙 분비에 직접 작용하며, 별도의 표적 '호르몬'을 만들지 않는다. 따라서 피드백 축도 도파민에 의한 억제 중심으로 작동한다.\n① LH, ③ FSH — 생식선에서 성호르몬 생성을 자극. ④ TSH — 갑상선에서 T3/T4 생성. ⑤ ACTH — 부신피질에서 cortisol 생성.\n💡 GH도 간에서 IGF-1 생성을 유도하지만 선지에 없음. PRL은 표적호르몬 없이 직접 작용하는 유일한 전엽 호르몬.",
"2025-L4-Q54": "【정답: ① ACTH】\n뇌하수체-표적기관 음성 피드백(negative feedback) 축이 존재하는 호르몬만 표적호르몬 과다 시 뇌하수체 호르몬이 감소한다. ACTH-cortisol 축: cortisol 과다 → ACTH 감소. ② ADH(바소프레신) — 뇌하수체 후엽 호르몬으로 전형적인 시상하부-뇌하수체-표적기관 음성피드백 축이 없다(삼투압·혈압에 의해 조절). ③ GH — IGF-1에 의한 음성 피드백은 있으나 '표적기관에서 표적호르몬을 만드는' 고전적 삼중 축이 아닌 somatostatin 매개 조절이 더 중요. ④ Prolactin — 별도의 표적호르몬이 없으므로 음성피드백 축 없음. ⑤ TRH — 시상하부 호르몬으로 뇌하수체 전엽 호르몬이 아님.\n💡 전형적 음성피드백 3축: CRH-ACTH-cortisol / TRH-TSH-T3/T4 / GnRH-LH/FSH-sex steroids.",
"2025-L5-Q26": "【정답: ① 갑상선자극호르몬(TSH)】\n표 분석: Free T4 0.55 ng/dL(↓, 참고치 0.8~1.7) + TSH 0.5 mIU/L(정상 하한, 0.34~4.25). 이 조합은 '중추성 갑상선기능저하증(central hypothyroidism)'의 전형 — Free T4가 낮은데 TSH가 정상이거나 낮으면 TSH 자체가 결핍된 것이다. IGF-1 40 ng/mL(↓↓, 참고치 94~269)이지만 성장호르몬 결핍 판단은 기저치만으로 불충분(자극검사 필요). 코티졸 6.2 μg/dL는 참고치 하한이나 ACTH 15.6 pg/mL로 축 자체는 보존. 월경 규칙적이므로 성선 축 보존.\n② GH — IGF-1 낮으나 기저치만으로 결핍 확진 불가(자극검사 필요). ③ PRL — 정상 범위. ④ 성선자극호르몬 — 월경 규칙적이므로 결핍 아님. ⑤ ACTH — cortisol이 낮은 편이나 ACTH도 정상 범위 내.\n💡 중추성 갑상선기능저하증: Free T4↓ + TSH 낮거나 부적절하게 정상.",
"2025-L5-Q32": "【정답: ③ 성선자극호르몬(Gonadotropin, LH/FSH)】\n60세 폐경 후 여성: 에스트로겐 30 pg/mL(참고치 30~120으로 하한)이면 폐경 후 에스트로겐은 정상적으로 매우 낮아야 하므로 여기서는 FSH/LH가 보상적으로 크게 상승해야 정상이다. FSH 3 mIU/mL(↓↓, 참고치 1~9는 폐경 전 범위 — 폐경 후 FSH는 통상 20~100 mIU/mL로 상승), LH 10 mIU/mL(역시 폐경 후 정상 대비 낮음). 즉, 폐경 후여성에서 에스트로겐이 낮음에도 FSH/LH가 부적절하게 낮은 것은 성선자극호르몬 결핍을 시사한다.\n① PRL — 12 ng/mL로 정상. ② GH — IGF-1 120 ng/mL(정상 범위 94~269 내). ④ TSH — 3.2 mIU/L, Free T4 1.01(정상). ⑤ ACTH — cortisol 3.2 μg/dL가 낮으나 ACTH 22.9 pg/mL(정상 범위 내)이므로 중추성 부신기능 이상도 의심되지만, 검사 시각이 오후 3시(코티졸 일중 변동, 오전이 아님)인 점 고려 시 단독 판단 어렵고, 가장 명확한 결핍은 성선자극호르몬.\n💡 폐경 후에는 FSH가 보상적으로 높아야 정상; 낮으면 중추성 성선기능저하증.",
"2025-L5-Q71": "【정답: ② Hydrocortisone】\n비기능성 뇌하수체 종양 환자에서 갑자기 발생한 심한 두통·시야 장애·구역·구토 = 뇌하수체졸중(pituitary apoplexy). 이때 뇌하수체 전엽이 광범위하게 손상되어 급성 범뇌하수체 기능부전이 발생하며, 가장 생명을 위협하는 결핍은 부신피질호르몬(cortisol) 결핍이다. 혈액 채취 후(검사 결과가 나오기 전에) 즉시 고용량 hydrocortisone을 정맥 투여해야 한다.\n① Testosterone — 중요하지 않은 급성 응급 처치. ③ Levothyroxine — 갑상선호르몬 결핍도 발생하지만 갑작스런 투여는 cortisol 부족 시 부신위기를 악화시킬 수 있으므로 cortisol 보충 후 투여. ④ Desmopressin — 요붕증이 동반될 수 있으나 최우선 아님. ⑤ GH — 급성기 응급 치료 대상 아님.\n💡 뇌하수체졸중 응급처치: 혈액 채취(cortisol 검사) → 즉시 IV hydrocortisone → 수술 여부 결정.",
"2023-L4-Q13": "【정답: ⑤ 데스모프레신(Desmopressin)】\n25세 남자, 다뇨(하루 15회+야뇨 5회), 심한 갈증, 체중 감소, 구강 건조 — 심한 요붕증 증상. 이미지(수분제한검사 결과)를 통해 DDAVP 투여 후 소변 삼투압이 상승했다면 중추성 요붕증 확진. 혈당 정상(84 mg/dL)이므로 당뇨병성 다음다뇨는 아님.\n① 리튬 — 신성 DI를 유발하는 약물, 치료와 무관. ② 수분제한 — DI에서 수분제한은 위험. ③ 염분제한 — 신성 DI의 보조 처치이나 중추성에서는 부적절. ④ 티아지드 — 신성 DI 치료.\n💡 수분제한검사: 수분제한 후 소변 농축 불량 → DDAVP 투여 후 소변 삼투압 상승이면 중추성 DI 확진.",
"2023-L4-Q66": "【정답: ② 성장호르몬(GH)】\n60세 여성 호르몬 검사: Free T4 0.9(정상), TSH 3.2(정상), cortisol 19.2 μg/dL(정상), ACTH 32.9(정상), PRL 12(정상), FSH 3/LH 10(폐경 후 여성치고 낮으나), 에스트로겐 30(하한), IGF-1 101 ng/mL(참고치 94~269, 정상 하한). IGF-1이 정상 범위 내(간신히)이므로 GH 결핍을 확진하려면 자극 검사(인슐린 유발 저혈당 검사 또는 GHRH+arginine 검사)가 반드시 필요하다. 반면 다른 항목들은 기저치 이상이 명확하거나 반대로 명확히 정상.\n① PRL — 정상 범위로 결핍 의심 없음. ③ 성선자극호르몬 — 폐경 후 FSH/LH가 낮은 것이 이상하나 에스트로겐 보충 중일 가능성 등 고려. ④ TSH — 정상. ⑤ ACTH — 정상.\n💡 GH는 맥동성 분비로 기저치 변동이 커서 단일 기저치로 결핍 진단 불가 → 자극검사 필수.",
"2023-L4-Q68": "【정답: ③ 성선자극호르몬(Gonadotropin)】\n60세 여성, 뇌하수체 종괴: Free T4 1.01(정상), TSH 3.2(정상), cortisol 13.21 μg/dL(정상), ACTH 22.9(정상), PRL 12(정상), FSH 3 mIU/mL(↓ — 폐경 후 여성에서 FSH는 통상 >20~40 mIU/mL이어야 하는데 3으로 낮음), LH 10 mIU/mL(폐경 후 정상 대비 낮음), 에스트로겐 30 pg/mL(하한), IGF-1 120(정상 범위).\n폐경 후 여성에서 FSH/LH가 낮은 것은 성선자극호르몬 결핍의 직접 증거이며 기저치로 결핍 진단이 가능하다.\n② GH — IGF-1 120으로 정상 범위 내, 자극검사 필요. ④ TSH — 정상. ⑤ ACTH — 정상.\n💡 폐경 후 여성에서 FSH <10 mIU/mL = 중추성 성선기능저하증 강력 시사.",
"2023-L4-Q80": "【정답: ① 유즙분비호르몬(Prolactin)】\n뇌하수체 전엽 호르몬 중 표적기관에서 별도의 '호르몬'을 생성하지 않고 직접 표적조직(유방)에 작용하는 호르몬은 프로락틴이다. 나머지 선지들(② LH, ③ FSH, ④ TSH, ⑤ ACTH)은 각각 생식선·갑상선·부신피질에서 호르몬 합성을 유도하는 트로픽 호르몬이다.\n💡 2025년도 동일 개념 문항(2025-L4-Q37)과 선지 배열이 다름. 프로락틴은 도파민에 의해 긴장성 억제를 받는 유일한 전엽 호르몬이기도 함.",
"2023-L4-Q90": "【정답: ③ 중추성 요붕증(Central DI)】\n29세 여성, 3개월간 다음·다뇨, 혈청 Na 145 mEq/L(경계 고나트륨), 크레아티닌 정상. 이미지(수분제한검사 그래프)에서 수분제한 후 소변 삼투압이 충분히 상승하지 않다가 DDAVP 투여 후 크게 상승한 패턴 → 중추성 DI 확진.\n① 일차다음증 — 수분제한 검사에서 소변 삼투압이 정상적으로 올라감. ② 정상반응 — 해당 없음. ④ 신성 DI — DDAVP 투여 후에도 소변 농축 안 됨. ⑤ SIADH — 저나트륨혈증 + 소변 Na 증가 패턴, 여기서는 고나트륨혈증.\n💡 수분제한검사 판독: DDAVP 반응성으로 중추성/신성 DI 감별.",
"2023-L5-Q33": "【정답: ③ Sheehan 증후군】\n산후 출혈로 인한 허혈성 뇌하수체 괴사로 발생하는 뇌하수체기능저하증. 출산 후 수유 불가, 무월경이 초기 증상이며, 수년에 걸쳐 다른 뇌하수체 호르몬도 순차적으로 결핍된다(GH→LH/FSH→TSH→ACTH 순).\n① 뇌수종 — 뇌척수액 이상. ② Kallmann 증후군 — GnRH 뉴런 이동 장애로 성선기능저하증+후각 상실, 산후 출혈과 무관. ④ 정중파열증후군 — 선천성 중추신경계 기형. ⑤ 시상하부성 성선기능저하증 — GnRH 분비 장애이나 산후 출혈이 원인이 아님.\n💡 Sheehan 증후군: 분만 후 뇌하수체 용적 증가(생리적) 상태에서 출혈→저혈압→허혈 손상. 프로락틴 결핍(수유 불가)이 첫 증상.",
"2023-L5-Q60": "【정답: ③ Rapid ACTH stimulation test(급속 ACTH 자극검사)】\n시상하부-뇌하수체-표적기관 축 dynamic test: ① 인슐린 저혈당 검사 — 시상하부(CRH 분비)·뇌하수체(ACTH/GH 분비) 반응 평가. ② GnRH 자극 검사 — 뇌하수체(LH/FSH) 반응 평가. ③ 급속 ACTH 자극검사 — ACTH(합성 유사체 cosyntropin)를 주입하여 부신피질(일차 기관)의 cortisol 반응을 평가 → 일차 기관 기능 평가. ④ TRH 자극 검사 — 뇌하수체(TSH) 반응 평가. ⑤ 당부하 검사(OGTT) — GH 억제 여부 평가(말단비대증 확진).\n💡 급속 ACTH 자극검사: 부신피질 자체 기능(일차 기관) 확인. 뇌하수체 이차성 부신기능저하가 만성화되면 부신 위축으로 이 검사에서도 비정상 나올 수 있음.",
"2022-L4-Q84": "【정답: ⑤ GH(성장호르몬)】\n뇌하수체기능부전 시 대부분의 경우 뇌하수체 호르몬 대신 표적장기 호르몬으로 보충한다(예: ACTH 결핍 → cortisol 보충, TSH 결핍 → levothyroxine 보충, LH/FSH 결핍 → 성호르몬 보충). 그러나 GH는 표적 장기 호르몬이 없으므로(IGF-1은 치료제가 아님) 반드시 재조합 GH(recombinant GH) 자체를 투여해야 한다.\n① PRL — 결핍 시 보충 불필요(수유 목적 외). ② ACTH — cortisol로 보충. ③ TSH — levothyroxine으로 보충. ④ FSH — 생식 목적 시 gonadotropin 투여, 그 외 성호르몬으로 보충.\n💡 GH는 표적 호르몬 없이 직접 작용 → 반드시 rGH 직접 보충.",
"2022-L4-Q99": "【정답: ④ 갑상선자극호르몬(TSH)】\n30세 여성, 뇌하수체선종. 검사 결과(선지/문제 파싱 오류 있으나 재구성): Free T4 0.65 ng/dL(참고치 0.6~1.7 — 정상 하한 경계), TSH 1.2 mIU/L(정상). 코티졸 5.2 μg/dL(정상 하한), ACTH 12.9(정상), PRL 12(정상), FSH 8/LH 4(정상), IGF-1 30 ng/mL(↓↓, 참고치 94~269). IGF-1이 현저히 낮으나 GH 결핍 진단은 자극검사 필요. Free T4가 낮은데 TSH가 부적절하게 정상인 것은 중추성 갑상선기능저하증 = TSH 결핍의 직접 증거. 이는 기저치만으로 결핍 확진이 가능하다.\n② GH — IGF-1이 매우 낮으나 자극검사 필요. ① PRL — 정상. ③ 성선자극호르몬 — FSH/LH 정상. ⑤ ACTH — cortisol이 낮은 편이나 ACTH 정상, 경계값.\n💡 중추성 갑상선기능저하증: Free T4↓ + TSH 부적절하게 정상(상승 않음) = 기저치로 진단 가능.",
"2022-L4-Q22": "【정답: ① 프로락틴(Prolactin)】\n뇌하수체 줄기(stalk) 손상 시 시상하부-뇌하수체 문맥 순환이 차단되어 시상하부 호르몬이 뇌하수체 전엽에 도달하지 못한다. 대부분의 전엽 호르몬(GH·TSH·ACTH·LH·FSH)은 방출 자극을 받지 못해 분비가 감소한다. 그러나 프로락틴은 시상하부로부터 주로 억제 신호(도파민)를 받는데, 줄기 손상으로 이 억제가 차단되면 오히려 프로락틴 분비가 증가한다(stalk syndrome).\n💡 시상하부의 도파민 → 뇌하수체 전엽으로의 이동 차단 → 프로락틴 억제 소실 → 고프로락틴혈증.",
"2022-L4-Q25": "【정답: ② 비기능성 뇌하수체 선종(Non-functioning pituitary adenoma)】\n42세 여성, 건강검진 우연히 발견된 뇌하수체 선종, 시야 장애 없음, 월경 규칙적, 유즙 분비 없음, 약물 복용 없음. 검사(선지 파싱 오류 있으나 재구성): 갑상선 기능 정상(Free T4 0.91, TSH 2.9), 코티졸·ACTH 정상, 에스트로겐 34(정상), IGF-1 220(정상). 호르몬 과잉 없음, 기능 저하 없음 → 비기능성 뇌하수체 선종.\n① 프로락틴분비 선종 — 고프로락틴혈증, 유즙 분비, 월경 불규칙 등이 있어야 함. ③ 쿠싱병 — cortisol 과잉. ④ 말단비대증 — IGF-1 과잉, GH 과잉.\n💡 비기능성 선종: 호르몬 과잉 및 결핍 없는 우연 발견 선종 → 관찰 또는 크기·증상에 따라 수술.",
"2022-L4-Q61": "【정답: ① 수분제한】\n폐암 항암치료 중 64세 남성, Na 131 mEq/L, 삼투압 270 mOsm/kg(저나트륨혈증 + 저삼투압), BUN/Cr 10/0.4(BUN 낮음 → 희석 양상), 부종 없음, 체위성 저혈압 없음. 갑상선·부신 기능 정상(선지 내 cortisol 18.2, T4 0.99 정상). 소변 Na 및 삼투압 미제시이나 폐암 환자에서 전형적인 SIADH 패턴(유효순환혈액량 정상, 희석성 저나트륨혈증). SIADH의 1차 치료는 수분제한이다.\n② 데스모프레신 — ADH 작용제로 SIADH에 금기. ③ 3% NaCl — 증상성·중증 저나트륨혈증에만(이 경우 증상 없음). ④ 갑상선호르몬 — 갑상선기능저하증 유발 저나트륨혈증에만. ⑤ 글루코코르티코이드 — 부신기능저하증 유발 저나트륨혈증에만(여기서 cortisol 정상).\n💡 SIADH: 원인 치료 + 수분제한(500~1000 mL/일). 중증 시 tolvaptan 또는 3% NaCl.",
"2022-L4-Q102": "【정답: ② 도파민(Dopamine)】\n프로락틴은 뇌하수체 전엽 호르몬 중 유일하게 시상하부로부터 주로 억제 조절을 받는다. 시상하부 아치형핵(arcuate nucleus)에서 분비된 도파민(dopamine)이 문맥순환을 통해 뇌하수체 전엽 유즙분비세포(lactotroph)의 D2 수용체에 결합하여 프로락틴 분비를 긴장성으로 억제한다.\n① 성장호르몬 — 관계 없음. ③ 성선자극호르몬 — 억제자가 아님. ④ 갑상선자극호르몬 — 관계 없음. ⑤ ACTH — 관계 없음.\n💡 도파민 차단제(항정신병약, 메토클로프라미드 등) → 고프로락틴혈증 유발.",
"2022-L4-Q56": "【정답: ④ FSH – Testosterone】\n뇌하수체-표적기관 음성 피드백 축이 성립하려면 뇌하수체 호르몬이 표적기관을 자극하여 표적 호르몬을 생성하고, 표적 호르몬이 뇌하수체를 음성 피드백하는 구조여야 한다. FSH는 남성에서 세르톨리 세포, 여성에서 난포를 자극하지만 남성에서 LH가 테스토스테론 생성을 주로 자극한다. 다만 FSH-testosterone 축도 교과서적으로 인정되며 음성피드백이 성립한다.\n① ACTH-norepinephrine — 부신수질의 카테콜아민이지만 ACTH의 직접 표적은 부신피질(cortisol). ② GH-insulin — 대립 관계이나 GH의 표적 호르몬이 인슐린은 아님(IGF-1이 표적). ③ Prolactin-estrogen — 에스트로겐이 PRL 분비를 자극하지만 PRL의 표적 호르몬이 에스트로겐은 아님. ⑤ TSH-calcitonin — 갑상선 호르몬은 T3/T4이며 칼시토닌은 TSH의 표적 호르몬이 아님.\n💡 고전적 축: CRH-ACTH-cortisol / TRH-TSH-T4 / GnRH-LH/FSH-sex steroids.",
"2022-L4-Q76": "【정답: ④ 항갑상선제는 즉시 중단하고 회복된 후 방사성요오드 치료 또는 수술적 치료를 고려한다.】\n메티마졸(methimazole) 복용 중 WBC 200/μL, ANC 10/μL = 무과립구증(agranulocytosis, 0.1~0.5% 발생). 항갑상선제의 가장 위험한 부작용으로, 즉시 약을 중단해야 하며 회복 후 동일 계열 약(PTU 포함)은 교차 반응 위험으로 재투여하지 않는다.\n① 동일 약 재투여 — 금기. ② 약 유지 + 항생제 — 위험. ③ 감량 유지 — 금기. ⑤ PTU로 교체 — 교차 반응 가능성으로 금기; 회복 후 방사성요오드 또는 수술 선택.\n💡 무과립구증: ATD 즉시 중단 → 감염 치료 → 회복 후 비약물적 치료(RAI 또는 수술).",
"2022-L4-Q77": "【정답: ④ 인슐린 유발 저혈당 검사(Insulin-induced hypoglycemia test)】\n뇌하수체 호르몬 '분비 감소' 평가(저하 진단) = 자극 검사(stimulation test). 인슐린 유발 저혈당 검사(ITT)는 저혈당 스트레스로 CRH-ACTH-cortisol 및 GH 분비 축을 동시에 자극하여 뇌하수체 예비능을 평가한다.\n① 경구 당부하 검사 — GH 억제 평가(말단비대증 확진, 과잉 진단). ② 식염수 부하 검사 — SIADH 등 평가, 뇌하수체 호르몬 감소 진단에 해당 없음. ③ 급속 ACTH 자극 검사 — 부신피질(표적 기관) 기능 평가, 뇌하수체 ACTH 분비능 직접 평가 아님. ⑤ Dexamethasone 억제 검사 — cortisol 과잉(쿠싱증후군) 확인, 저하 진단과 반대.\n💡 인슐린 저혈당 검사: 뇌하수체 GH·ACTH 예비능 평가의 gold standard (금기: 관상동맥질환, 간질, cortisol <100 nmol/L).",
"2022-L4-Q94": "【정답: ④ 신성 요붕증(Nephrogenic DI)】\n29세 여성, 다음·다뇨, 혈청 Na 145 mEq/L, 소변량 6,200 mL/day, 소변 삼투압 112 mOsm/kg(현저히 낮음). 수분제한검사 이미지 결과: 수분제한 후에도 소변 삼투압이 충분히 상승하지 않고, DDAVP 투여 후에도 소변 삼투압이 크게 상승하지 않는 패턴 → 신장이 ADH에 반응하지 못하는 신성 DI.\n③ 중추성 DI — DDAVP 투여 후 소변 삼투압이 크게 상승해야 함. ① 일차다음증 — 수분제한 시 소변이 정상적으로 농축됨. ② 정상반응 — 해당 없음. ⑤ SIADH — 저나트륨혈증, 소변 삼투압 높음.\n💡 수분제한검사: ①수분제한 후 Uosm 상승 없음 + ②DDAVP 후 Uosm 상승 있음 = 중추성 DI / ①②모두 안 오름 = 신성 DI.",
"2022-L5-Q116": "【정답: ④ 시야 결손(Visual field defect)】\n이미지(img_2022/Q116_p84.png)는 뇌하수체 종괴 또는 두개인두종(craniopharyngioma) 등 안장상부(suprasellar) 병변을 시사한다. 시신경교차(optic chiasm)가 안장 바로 위에 위치하므로 이 부위 종괴는 시신경교차 압박 → 양측두 시야결손(bitemporal hemianopia)을 유발한다.\n① 유즙 분비 — 프로락틴 과잉 분비 선종에서 발생, 이미지 병변과 직접 연결 어려움. ② 말단 비대 — GH 과잉 분비. ③ 요붕증 — 뇌하수체 후엽 또는 시상하부 침범 시. ⑤ 고혈압 — 쿠싱증후군 등과 관련.\n💡 안장상부 종괴 → optic chiasm 압박 → 양측두 반맹(bitemporal hemianopia). 가장 특징적 증상.",
"2022-L5-Q24": "【정답: ① 고용량 hydrocortisone 정맥 주사】\n32세 여성, 부신 양측절제술 후 prednisolone+fludrocortisone 복용 중(만성 부신기능부전), 결핵약 복용 시작 후 쇠약 악화. 혈압 82/46 mmHg(저혈압), 맥박 110(빈맥), Na 122 mEq/L(저나트륨), K 5.0 mEq/L(고칼륨) → 급성 부신위기(adrenal crisis). 리팜핀 등 결핵약은 코르티코스테로이드 대사를 촉진하여 기존 용량이 부족해질 수 있다.\n이 경우 즉각적인 고용량 hydrocortisone IV가 생명을 구하는 치료.\n② 급속 ACTH 자극검사 — 이미 양측 부신 없으므로 의미 없음. ③ Fludrocortisone 증량 — 단독으로는 불충분(글루코코르티코이드 부족). ④ Cosyntropin — ACTH 자극제, 부신이 없으면 효과 없음. ⑤ 3% saline — 저나트륨 치료이나 원인 치료인 코르티코스테로이드가 우선.\n💡 부신위기: 즉시 IV hydrocortisone 100 mg → 이후 지속 주입 또는 6시간마다 반복.",
"2022-L5-Q109": "【정답: ② Hydrocortisone】\n2025-L5-Q71과 동일 임상 상황: 비기능성 뇌하수체 종양 환자에서 뇌하수체졸중(pituitary apoplexy). 뇌하수체 광범위 괴사로 가장 위험한 급성 부신피질호르몬 결핍이 발생하므로 혈액 채취 후 즉시 hydrocortisone을 정맥 투여한다.\n① Testosterone — 급성기 응급 치료 불필요. ③ Levothyroxine — cortisol 보충 전 단독 투여 시 부신위기 악화 위험. ④ Desmopressin — 요붕증 동반 가능하나 최우선 아님. ⑤ GH — 급성기 응급 아님.\n💡 뇌하수체졸중 응급: 채혈 → IV hydrocortisone 즉시 → 신경외과 협진.",
"2021-L5-Q1": "【정답: ④ Epinephrine】\n44세 여성, 시력 저하(시신경교차 압박 시사) + 극심한 피로 → 뇌하수체 종괴/범뇌하수체기능부전 의심. 뇌하수체 전엽 손상 시 영향받는 호르몬: Cortisol(ACTH 결핍), Prolactin(감소 또는 stalk 손상 시 증가), Thyroxin(TSH 결핍), Progesterone(LH/FSH 결핍). 에피네프린(Epinephrine)은 부신수질에서 교감신경 자극에 의해 분비되며, 뇌하수체 호르몬의 직접 조절을 받지 않는다.\n💡 부신피질 기능(cortisol)은 ACTH 의존적이지만, 부신수질 기능(epinephrine)은 교감신경 지배로 뇌하수체와 무관.",
"2021-L5-Q14": "【정답: ③ Cortisol에 의한 CRH 분비 조절】\n음성 피드백: 표적 호르몬이 상위 조절 호르몬을 억제하는 것. Cortisol이 시상하부의 CRH 분비 및 뇌하수체의 ACTH 분비를 억제 → 음성 피드백.\n① Estrogen에 의한 LH 분비 증가 — 배란 직전의 양성 피드백(positive feedback). ② Glucose에 의한 insulin 분비 조절 — 포도당이 인슐린 분비를 자극하는 것은 양성 피드백 기전(글루코스 상승→인슐린 상승→글루코스 하강의 음성피드백이라고 볼 수 있으나 엄밀히는 직접 자극 조절). ④ 자율신경계에 의한 cortisol 분비 조절 — 신경계 조절로 피드백 기전 아님. ⑤ 혈중 칼슘 농도에 의한 PTH 분비 조절 — Ca²⁺ 저하→PTH 상승은 음성 피드백이나, CaSR에 의한 직접 이온 감지 기전.\n💡 고전적 음성 피드백: Cortisol↑→CRH·ACTH 억제 / T4↑→TRH·TSH 억제 / 성호르몬↑→GnRH·LH/FSH 억제.",
"2021-L5-Q18": "【정답: ① 프로락틴(Prolactin)】\n뇌하수체 전엽 호르몬 중 시상하부 방출호르몬의 자극을 받지 않는 호르몬은 프로락틴이다. 프로락틴은 시상하부에서 도파민(dopamine)에 의해 긴장성 억제를 주로 받는다. TRH가 프로락틴 분비를 자극하기도 하지만 생리적 주요 조절은 도파민에 의한 억제이다.\n② GH — GHRH에 의해 자극. ③ 성선자극호르몬(LH/FSH) — GnRH에 의해 자극. ④ TSH — TRH에 의해 자극. ⑤ ACTH — CRH에 의해 자극.\n💡 프로락틴 조절의 특수성: 방출 자극 호르몬보다 억제 호르몬(도파민)이 주도적.",
"2021-L5-Q19": "【정답: ② 에스트라디올(Estradiol)】\n호르몬 분비 주기: 성장호르몬(GH) — 수면 관련 박동성, 수 시간. 갑상선자극호르몬(TSH) — 일주기(circadian), 24시간. 부신피질자극호르몬(ACTH) — 일주기, 24시간. 성선자극호르몬방출호르몬(GnRH) — 박동성, 60~120분. 에스트라디올 — 월경 주기에 따라 변동하는 ~28일(약 1개월) 주기.\n💡 분비 주기 길이: GnRH(1~2시간) < GH(수면 주기, 수시간) < ACTH/TSH(24시간 일주기) < 에스트라디올(월경 주기, ~28일).",
"2021-L6-Q21": "【정답: ⑤ 데스모프레신(Desmopressin)】\n2023-L4-Q13과 동일 임상 상황(29세 여성, 다음·다뇨, 혈청 Na 145, 소변 삼투압 112, 소변량 6,200 mL). 수분제한검사 이미지에서 중추성 DI 확진(DDAVP 투여 후 소변 농축) → 데스모프레신 치료.\n① 리튬 — 신성 DI 유발제. ② 수분제한 — DI에서 위험. ③ 염분제한 — 신성 DI 보조. ④ 티아지드 — 신성 DI 치료.\n💡 중추성 DI = AVP 결핍 → DDAVP(V2 수용체 작용) 치료.",
"2021-L6-Q22": "【정답: ⑤ 당질 글루코코르티코이드 투약】\n64세 남성, 폐암 항암치료 중, Na 131 mEq/L, 삼투압 270(저나트륨·저삼투압), BUN/Cr 10/0.4(희석), 부종 없음. 2021년도 문항에는 소변 Na 36 mEq/L, 소변 삼투압 380 mOsm/kg(고농도)이 추가로 제시됨. 코티졸 2.2 μg/dL(↓↓), 급속 ACTH 자극검사 후 코티졸 5.6 μg/dL(자극에도 18 μg/dL 미달 → 부신 반응 불충분).\n→ 부신피질기능저하증에 의한 저나트륨혈증. 글루코코르티코이드 투여가 근본 치료.\n반면 2022-L4-Q61(유사 증례)에서는 cortisol 18.2로 정상 → SIADH → 수분제한이 정답. 두 문항의 차이점은 cortisol 수치.\n① 염분제한 — SIADH 치료이나 여기선 부신기능저하증. ② Tolvaptan — SIADH 치료. ③ 3% NaCl — 중증 증상성 저나트륨혈증 시. ④ 갑상선호르몬 — 갑상선기능저하증 유발 저나트륨에 해당.\n💡 부신기능저하증 저나트륨혈증: ACTH 부족→피부색소침착 없음(이차성)/cortisol 부족→ADH 억제 소실→희석성 저Na. 치료는 코르티코스테로이드.",
"2021-L6-Q29": "【정답: ① ADH(바소프레신)】\n정상인의 뇌 T1 강조영상에서 뇌하수체 후엽(posterior pituitary)은 특징적인 'bright spot'(고신호 강도)으로 나타난다. 이는 바소프레신(ADH)과 옥시토신이 신경분비과립으로 저장되어 있기 때문이다. 중추성 요붕증 환자에서는 이 bright spot이 소실된다.\n② LH, ③ ACTH, ④ Prolactin, ⑤ GH — 모두 뇌하수체 전엽 호르몬. 전엽은 T1에서 특별한 고신호 없음.\n💡 뇌하수체 후엽 T1 bright spot = ADH(바소프레신) + 옥시토신 저장 과립. DI 진단에 참고.",
"2021-L7-Q20": "【정답: ④ GH(성장호르몬)】\n GH는 맥동성(pulsatile) 분비로 하루 중 대부분 시간에는 혈중 농도가 거의 측정되지 않을 정도로 낮다. 따라서 단순 기저 혈중 GH 측정으로는 결핍 여부 평가가 불가능하고, 인슐린 저혈당 검사·GHRH+arginine 검사 등 자극검사가 필요하다.\n① LH, ② FSH — 기저치 측정 및 폐경 상태 등 임상 맥락으로 평가 가능. ③ Prolactin — 기저치 측정으로 과잉/결핍 평가. ⑤ TSH — 기저치(+ Free T4)로 평가 가능.\n💡 GH와 함께 자극검사가 필요한 경우: 쿠싱증후군(억제검사, dexamethasone), SIADH(water loading) 등도 참고.",
"2021-L7-Q23": "【정답: ① Levothyroxine – free T4 수치를 정상 범위 안에서 절반의 위쪽으로 유지한다.】\n범뇌하수체기능부전 환자 호르몬 보충 목표:\n- Levothyroxine: TSH가 억제되어 모니터링 불가 → free T4를 정상 범위 중~상위(upper half)로 유지. ✓\n- Testosterone: LH/FSH로 조절 불가 → 혈중 testosterone 수치를 정상 남성 범위로 유지해야 하며, 자녀 계획 없으므로 gonadotropin 치료 불필요.\n- Recombinant GH: GH 수치 자체보다 IGF-1 수치를 연령·성별 정상 범위로 유지.\n- Hydrocortisone: 증상 및 임상 판단 기반 조절; 기저 cortisol 수치만으로 조절 불충분(스트레스 용량 교육 등).\n- Gonadotropin: 자녀 계획 없으면 불필요.\n② Testosterone — LH/FSH 수치 목표 설정 불가(중추성 결핍). ③ rGH — IGF-1이 목표 지표. ④ Hydrocortisone — 아침 cortisol로 조절하지 않음. ⑤ Gonadotropin — 자녀 계획 없으면 적응증 아님.\n💡 중추성 갑상선기능저하증 치료 모니터링: TSH 아닌 free T4 기준.",
"2021-L7-Q101": "【정답: ② 고용량 hydrocortisone 정맥 주사】\n2022-L5-Q24와 동일 임상 상황: 부신 양측절제술 후 스테로이드 복용 중 결핵약 복용 시작 후 급성 부신위기. 혈압 92/50(저혈압), 맥박 110(빈맥), Na 122(저나트륨), K 5.0(고칼륨).\n① 결핵약 중단 — 결핵 치료 중단은 위험; 리팜핀이 스테로이드 대사를 촉진하므로 용량 증량이 필요하지 중단은 아님. ③ Fludrocortisone 증량 — 단독으로는 불충분. ④ 급속 ACTH 자극검사 — 부신 없으므로 의미 없음. ⑤ Sellar MRI — 급성 위기에서 검사 우선이 아님.\n💡 부신위기: 즉시 IV hydrocortisone 100 mg bolus → 50~100 mg q6~8h 유지. 원인(리팜핀 유발 대사 가속)은 스테로이드 증량으로 해결.",
"2025-L7-Q12": "【정답 ②】 Zona glomerulosa. 임상 소견(이차성 고혈압 + 저칼륨혈증 + 고알도스테론혈증 + 저레닌)은 원발성 알도스테론증(Primary hyperaldosteronism)에 해당하며, aldosterone은 부신피질 최외층인 zona glomerulosa에서 분비된다. Saline infusion 후에도 aldosterone이 16 ng/dL로 억제되지 않아(>10 ng/dL) 원발성 알도스테론증이 확진된다. ①Capsule은 피막으로 호르몬 분비 없음. ③Zona fasciculata는 cortisol. ④Zona reticularis는 DHEA. ⑤Medulla는 catecholamine. 💡 GFR 순서: Glomerulosa→Aldosterone, Fasciculata→Cortisol, Reticularis→androgen(DHEA).",
"2025-L7-Q29": "【정답 ④】 Hydrocortisone. 이 환자는 관절 내 스테로이드 반복 투여 → HPA 축 억제 → 이차성 부신기능저하증이 있는 상태에서 수술(major stress)을 받아 부신 위기(adrenal crisis)가 발생하였다. 소견: 저혈압·저나트륨혈증·구역·저코티솔(2.1 μg/dL)·ACTH 억제(2 pg/mL). 즉각적인 Saline 수액 보충과 함께 IV hydrocortisone 100 mg bolus가 1차 치료이다. ①Minirin(desmopressin)은 DI 치료. ②Dextrose는 저혈당 교정. ③Cosyntropin은 진단 목적 자극 검사(위기 시 치료 먼저). ⑤Spironolactone은 알도스테론 길항제. 💡 부신 위기: saline + hydrocortisone IV — 진단검사보다 치료 먼저.",
"2025-L7-Q76": "【정답 ④】 Rapid ACTH stimulation test(급속 ACTH 자극 검사). 결핵 기왕력 + 색소침착 + 저나트륨·고칼륨·저코티솔(2.0 μg/dL)·고ACTH(670 pg/mL) → 일차성 부신기능저하증(Addison's disease) 강력 의심. 확진을 위해 Rapid ACTH stimulation test(cosyntropin 250 μg IM/IV 후 60분 cortisol<18 μg/dL 이면 확진)를 시행한다. ①Skin biopsy는 피부 색소 감별에 불필요. ②Saline loading test는 알도스테론 과다 확인용. ③24 hour urine cortisol은 과다 진단(쿠싱)에 사용. ⑤Dexamethasone suppression test는 쿠싱 선별. 💡 ACTH 상승 + 코티솔 저하 → 1차성. ACTH 저하 + 코티솔 저하 → 2차성·3차성.",
"2025-L8-Q20": "【정답 ①】 ACTH 측정. 24HU 코티솔 640 μg/day(정상 80-120)으로 상승, 1 mg overnight DST 3.9 μg/dL(기준 <1.8 억제 미달) → 쿠싱 증후군 확진. 다음 단계는 ACTH 의존성 여부를 판단하기 위해 혈장 ACTH를 측정한다. ACTH ↑이면 ACTH 의존성(뇌하수체·이소성), ACTH 억제(<5-10 pg/mL)이면 ACTH 비의존성(부신 종양)을 시사한다. ②급속 ACTH 자극 검사는 부신기능저하 확인용. ③인슐린 유발 저혈당 검사는 GH/ACTH 예비능 평가용. ④고용량 DST는 ACTH 의존성 쿠싱에서 원인 감별(뇌하수체 vs 이소성) 단계에 사용. ⑤IPSS는 뇌하수체 vs 이소성 확인의 최종 단계. 💡 쿠싱 확인 후: ACTH측정 → (↑) 뇌하수체 MRI/고용량DST/IPSS → (↓) 부신 CT.",
"2025-L8-Q43": "【정답 ⑤】 Dexamethasone. 사진(이미지 문항)에서 moon face, buffalo hump, central obesity가 관찰되는 쿠싱 증후군 의심 환자이다. 쿠싱 증후군 선별 검사로는 1 mg overnight dexamethasone suppression test가 가장 흔히 사용되며, 이에 사용되는 약물이 dexamethasone이다. ①Saline은 원발성 알도스테론증 확진(saline suppression test) 또는 수액 보충용. ②Estrogen은 호르몬 치료용. ③Captopril은 고혈압·알도스테론증 감별. ④Ketoconazole은 코티솔 합성 억제제(치료제). 💡 쿠싱 선별: 1) 1 mg overnight DST 2) 24HU 유리 코티솔 3) 자정 타액/혈장 코티솔.",
"2025-L8-Q44": "【정답 ②】 Adrenal CT. ACTH 2 pg/mL로 억제되어 있고, 24HU 코티솔과 DST에서 억제 실패 → ACTH 비의존성 쿠싱 증후군 확인. 원인이 부신 종양(선종/암종)임을 확인하기 위해 Adrenal CT를 시행한다. ①Sella MRI는 ACTH 의존성(쿠싱병, 뇌하수체 ACTH 분비 종양)에서 시행. ③Chest CT는 이소성 ACTH 증후군(ACTH ↑) 원인 탐색에 사용. ④Whole body PET CT는 이소성 병변 탐색에 사용하나 1차 검사가 아님. ⑤Sestamibi scintigraphy는 부갑상선 선종 탐색용. 💡 ACTH 억제 → 부신 CT, ACTH 상승 → 뇌하수체 MRI (이후 감별 필요 시 고용량 DST/IPSS).",
"2023-L7-Q6": "【정답 ⑤】 급속 부신피질자극호르몬 자극 검사(Rapid ACTH stimulation test). 이미지 문항(MRI)에서 시신경교차 압박하는 뇌하수체 종양이 보이며 시야 장애가 동반된 경우, 수술 전 뇌하수체 기능 평가가 필요하다. 특히 코티솔 결핍 여부 확인이 가장 급하며, 급속 ACTH 자극 검사로 부신피질 예비능을 평가한다. ①경과관찰은 시야 장애가 있으면 부적절. ②하추체정맥채혈은 쿠싱병 vs 이소성 감별에 사용. ③경구당부하검사는 말단거대증(GH 과다) 확진에 사용. ④하룻밤 덱사메타손억제검사는 쿠싱 선별용. 💡 시야 장애(시신경 압박) 동반 뇌하수체 종양 → 수술 전 뇌하수체 기능 평가(ACTH axis 우선).",
"2023-L7-Q23": "【정답 ③】 경구당부하검사(Oral glucose tolerance test, OGTT). 반지/신발이 맞지 않음 + 땀 많음 → 말단거대증(acromegaly) 의심. GH와 IGF-1이 상승되어 있을 것으로 예상되며, 말단거대증 확진에는 경구당부하검사 후 GH 억제 여부를 확인한다(정상: GH <1 ng/mL로 억제, 말단거대증: 억제 실패). ①경과관찰은 진단 전 부적절. ②하추체정맥채혈은 ACTH 의존성 쿠싱 원인 감별용. ④하룻밤 덱사메타손억제검사는 쿠싱 선별용. ⑤급속 ACTH 자극 검사는 부신기능저하 평가용. 💡 말단거대증 확진: OGTT 후 GH nadir >1 ng/mL (최근 기준 >0.4 ng/mL).",
"2023-L7-Q76": "【정답 ②】 카베르골린(Cabergoline). Prolactin 764 ng/mL로 현저히 상승 + 뇌하수체 대선종 + 양귀쪽반맹 → 프로락틴분비 거대선종(Prolactinoma macroadenoma). 프로락틴종은 외과적 절제 전에 도파민 효능제(cabergoline 또는 bromocriptine)가 1차 치료이며, 도파민 효능제로 종양 크기 감소와 시야 장애 개선이 기대된다. ①남성호르몬 보충은 증상 완화용이나 원인 치료 아님. ③방사선치료는 약물 실패 후 3차 선택. ④소마토스타틴유사제는 GH 종양(말단거대증) 치료제. ⑤경접형골동수술은 도파민 효능제 치료 실패 또는 뇌척수액 비루 등 합병증 시 고려. 💡 프로락틴종: 도파민 효능제가 1차 치료 (크기에 상관없이). 수술은 약물 실패·불내성·합병증 시.",
"2023-L8-Q11": "【정답 ②】 고용량 hydrocortisone 정맥 주사. 양측 부신절제술 후 prednisolone + fludrocortisone으로 유지 중인 환자가 결핵 치료 시작(rifampicin이 glucocorticoid 대사 촉진) 후 부신 위기를 일으켰다. 저혈압(82/46), 빈맥, 저나트륨·고칼륨, 저혈당 위험 → 즉각 IV hydrocortisone 100 mg (이후 지속 주입 또는 6시간마다 반복)과 수액 보충이 필요하다. ①3% saline은 심한 저나트륨혈증(증상성) 치료이나 부신 위기의 1차 약물 아님. ③급속 ACTH 자극검사는 이미 부신절제술로 진단이 명확하므로 불필요. ④Cosyntropin은 진단용. ⑤인슐린 내성 검사는 위기 상황에 금기. 💡 rifampicin은 CYP3A4 유도 → steroid 대사 가속 → 용량 증가 필요.",
"2023-L8-Q26": "【정답 ①】 A (Zona glomerulosa). Aldosterone synthase(CYP11B2)는 aldosterone 합성의 최종 효소로, 부신피질 최외층인 zona glomerulosa에만 발현된다. 부신 단면 모식도에서 가장 바깥쪽 층(A)이 zona glomerulosa에 해당한다. ②B는 zona fasciculata(cortisol). ③C는 zona reticularis(DHEA). ④D는 수질(medulla, catecholamine). ⑤A & B는 zona glomerulosa+fasciculata이나 CYP11B2는 glomerulosa에 한정. 💡 CYP11B1=cortisol 합성 마지막 단계(fasciculata·reticularis), CYP11B2=aldosterone 합성(glomerulosa).",
"2023-L8-Q29": "【정답 ①】 Addison's disease(자가면역성 일차성 부신기능저하증). 일차성 부신기능저하증에서는 부신피질 자체가 파괴되어 glucocorticoid와 mineralocorticoid 모두 결핍된다. 따라서 fludrocortisone(mineralocorticoid 보충)이 필요하다. ②Autoimmune hypophysitis, ③Craniopharyngioma, ⑤Pituitary apoplexy는 뇌하수체 손상 → 이차성 부신기능저하증으로 ACTH 결핍이 원인; aldosterone 분비는 RAAS에 의해 조절되므로 mineralocorticoid 보충 불필요. ④Iatrogenic(외인성 steroid) 억제는 이차성에 해당. 💡 1차성 부신기능저하 = mineralocorticoid 결핍(기립성 저혈압, 고칼륨혈증 동반) → fludrocortisone 필수.",
"2023-L9-Q20": "【정답 ④】 Low-dose dexamethasone suppression test(LDDST). 쿠싱 증후군 선별·확진에 사용하는 검사: ① 1 mg overnight DST ② 24 hour urine free cortisol ③ Midnight plasma cortisol(또는 자정 타액 코티솔) ④ LDDST(2일간 0.5 mg q6h). 이 중 LDDST는 선별이자 확진에 모두 사용한다. ①Plasma ACTH는 원인 감별(ACTH 의존성 여부) 단계에 사용. ②Random plasma cortisol은 일내변동이 크므로 단독으로 쿠싱 진단 불가. ③Rapid ACTH stimulation test는 부신기능저하 확인용. ⑤High-dose DST는 쿠싱 확인 후 원인 감별(뇌하수체 vs 이소성) 단계. 💡 쿠싱 선별 → 확진 → 원인 감별 3단계를 구분해야 한다.",
"2023-L9-Q40": "【정답 ③】 Easy bruising(쉽게 멍듦). 쿠싱 증후군에 비교적 특이적인 소견: 넓은 자주빛 선조(>1 cm), 쉽게 멍듦·피부 위축, 근위부 근력 저하, 달모양 얼굴+buffalo hump+central obesity, 골다공증성 골절. ①Obesity, ②Moon face, ④Hyperglycemia, ⑤Hypercholesterolemia는 대사증후군에도 흔히 나타나 특이도가 낮다. Easy bruising과 피부 위축은 코티솔의 단백질 이화 작용(피부 콜라겐 분해)에 의해 발생하며, 일반 비만에서는 드물다. 💡 쿠싱 특이 소견: 자주빛 넓은 선조, easy bruising, 피부 위축, 근위부 근병증.",
"2023-L9-Q45": "【정답 ⑤】 Laparoscopic adrenalectomy(복강경 부신절제술). 검사 결과: 1 mg overnight DST 12.8 μg/dL(억제 실패), 24HU 코티솔 708 μg/day(상승), midnight plasma cortisol 8 μg/dL(상승), ACTH 4 pg/mL(억제). ACTH가 4 pg/mL로 억제 → ACTH 비의존성 쿠싱 증후군(부신 선종). 이미지(CT)에서 단측 부신 선종이 확인될 것이며, 치료는 복강경 부신절제술이다. ①Ketoconazole은 수술 불가 시 코티솔 합성 억제 약물치료. ②Gamma knife는 뇌하수체 방사선치료(ACTH 의존성). ③Bilateral adrenalectomy는 뇌하수체 쿠싱병의 최후 수단. ④Transsphenoidal resection은 뇌하수체 ACTH 종양 수술. 💡 ACTH 억제 + 부신 선종 → 복강경 부신절제술이 표준.",
"2022-L6-Q52": "【정답 ①】 2번 뇌신경(시신경, Optic nerve, CN II). 뇌하수체 종양이 시신경교차(optic chiasm)를 압박하면 bilateral temporal hemianopsia(양귀쪽반맹)가 발생하며, 이는 시신경(CN II)의 시야 경로 손상이다. 시야검사에서 temporal field defect, MRI에서 sellar mass with suprasellar extension 확인. ②3번(동안신경) 압박 시 복시·안검하수. ③4번(활차신경) 압박 시 상사근 마비. ④5번(삼차신경) 압박 시 안면 감각 이상. ⑤6번(외전신경) 압박 시 수평 복시. 💡 뇌하수체 종양 + 시야 장애 = CN II(시신경교차 압박) = bitemporal hemianopsia.",
"2022-L6-Q91": "【정답 ②】 PIT-1, TPIT, SF-1 등 transcription factor 발현 양상이 뇌하수체선종 분류에 중요하다. WHO 2022 분류는 세포 분화 계통을 transcription factor로 구분한다(PIT-1 계통: GH/PRL/TSH 세포; TPIT: ACTH 세포; SF-1: LH/FSH 세포). ①소아에서 GH 분비 종양은 거인증(gigantism)이며, 말단비대증은 골단 융합 후 성인에서 발생. ③비기능성 선종은 mass effect로 발견되므로 기능성에 비해 늦게 발견된다(호르몬 과다 증상 없으므로). ④기능성 선종 중 가장 흔한 것은 prolactinoma이고, Cushing disease(ACTH 분비)가 아님. ⑤정상 뇌하수체는 reticulin network 유지, 선종은 이 network가 소실되는 것이 특징. 💡 WHO 분류: 뇌하수체선종의 분화는 transcription factor(PIT-1/TPIT/SF-1)로 결정.",
"2022-L6-Q115": "【정답 ⑤】 경접형골동수술(Transsphenoidal surgery). 검사 소견: 뇌하수체 거대선종 + 양귀쪽반맹(시신경 압박 증거) + 범뇌하수체기능저하(LH/FSH 저하→성선기능저하, Free T4 저하·TSH 정상→이차성 갑상선기능저하, GH/IGF-1 저하, 코티솔 저하). 중추신경 압박과 여러 호르몬 결핍이 있는 비기능성 뇌하수체 거대선종의 치료는 수술(transsphenoidal surgery)이다. 프로락틴이 52 ng/mL로 약간 상승되어 있으나 이는 stalk compression effect에 의한 것으로 prolactinoma에서의 현저한 상승(>200 ng/mL)과 구별된다. ③도파민 작용제는 진성 prolactinoma 1차 치료이나, stalk compression에 의한 mild hyperprolactinemia는 해당 안 됨. 💡 비기능성 거대선종 + 시야 장애 → 수술(도파민 효능제로 치료 안 됨).",
"2022-L6-Q59": "【정답 ⑤】 경과 관찰(관해 판정). 말단거대증 수술 3개월 후: 75 g 포도당 억제검사 후 GH 0.3 ng/mL(최신 기준 <1 ng/mL, 일부 <0.4 ng/mL) → 생화학적 관해; Sellar MRI에 잔류 종양 없음. 따라서 추가 치료 없이 경과 관찰이 적절하다. 단, 지문이 파싱 오류로 일부 옵션이 불명확하나, 정답 ⑤는 '관해 확인 후 경과 관찰'에 해당한다. ①브로모크립틴은 도파민 효능제로 말단거대증 일부에서 보조적으로 사용. ②소마토스타틴유사체는 수술 불충분 후 2차 약물치료. ③재수술은 잔류 종양이 있을 때. ④방사선치료는 수술+약물 실패 시. 💡 말단거대증 관해 기준: 포도당 억제 후 GH <1 ng/mL + IGF-1 정상화.",
"2022-L7-Q3": "【정답 ④】 Zona fasciculata. 검사 결과: ACTH 2.1 pg/mL(억제), 24HU 코티솔 320 μg/day(상승), 1 mg overnight DST 7.9 μg/dL(억제 실패) → ACTH 비의존성 쿠싱 증후군(부신 종양). Cortisol은 zona fasciculata에서 분비되므로 부신 선종이 이 부위에서 발생한 것이다. 불임은 코티솔 과다에 의한 시상하부-뇌하수체-생식선 축 억제로 발생. ①Capsule: 피막. ②Medulla: catecholamine. ③Zona glomerulosa: aldosterone. ⑤Zona reticularis: androgen(DHEA). 💡 ACTH 억제 + 코티솔 과다 = ACTH 비의존성 → 부신 zona fasciculata 종양(선종/암종).",
"2022-L7-Q38": "【정답】이차성 부신기능저하증에서 분비량이 보존되는 호르몬: Aldosterone(mineralocorticoid). 이차성(뇌하수체 ACTH 결핍)에서는 ACTH가 없어 cortisol(glucocorticoid)과 DHEA는 감소하지만, aldosterone은 주로 RAAS(renin-angiotensin-aldosterone system)의 조절을 받으므로 비교적 보존된다. 따라서 이차성에서는 mineralocorticoid 보충이 불필요하다. 💡 일차성 vs 이차성 구분: 일차성 = 전해질 이상(Na↓, K↑), 피부 색소침착(ACTH↑), mineralocorticoid 결핍 동반; 이차성 = ACTH 결핍이나 aldosterone 상대적 보존.",
"2022-L7-Q18": "【정답】 염류코르티코이드(aldosterone)를 생성하는 부위: Zona glomerulosa (부신피질 최외층, 그림의 해당 층). 부신 단면 모식도에서 가장 바깥쪽 피질층이 zona glomerulosa이며, aldosterone synthase(CYP11B2)에 의해 aldosterone을 합성한다. 💡 GFR: Glomerulosa=Aldosterone/salt(mineralocorticoid), Fasciculata=cortisol/sugar(glucocorticoid), Reticularis=DHEA/sex steroids. 수질(Medulla)=catecholamine.",
"2022-L8-Q83": "【정답 ②】 Glucocorticoid 투여. 76세 여자, 관절 주사 반복 투여 기왕력(3개월 전 중단) + 전신 쇠약·구역·구토·저혈압(90/60) + Na 121 mEq/L 저하, BUN/Cr 상승(prerenal azotemia) + 저삼투압혈증. 외인성 스테로이드 중단 후 HPA 축 회복 불완전 → 이차성 부신기능저하증(steroid withdrawal)으로 인한 부신 부전. 치료는 glucocorticoid(IV hydrocortisone). ①0.9% NaCl만으로는 부신 위기의 근본 원인(glucocorticoid 결핍) 미해결. ③갑상선호르몬 보충: 갑상선기능저하 증거 없음. ④베타차단제: 혈압 저하 환자에게 금기. ⑤항갑상선제: 해당 없음. 💡 장기 스테로이드 사용 후 중단 + 쇠약·저나트륨·저혈압 → 스테로이드 위기 가능성.",
"2022-L8-Q36": "【정답 ③】 골밀도 증가. 쿠싱 증후군은 코티솔 과다로 골형성 억제·골흡수 증가 → 골다공증(골밀도 감소)이 초래된다. ①부종: 코티솔의 mineralocorticoid 유사 작용(Na/H₂O 저류). ②고혈압: 혈관 반응성 증가, 염분 저류. ④저칼륨혈증: mineralocorticoid 유사 작용(특히 이소성 ACTH 증후군에서 현저). ⑤동맥경화증: 대사이상(당뇨·이상지질혈증·고혈압) 복합 결과. 💡 코티솔 과다 → 골다공증(골밀도 감소), 피부 위축, 근위부 근병증.",
"2022-L8-Q53": "【정답 ①】 ACTH. 쿠싱 증후군 확진 후(24HU 코티솔 660, 1 mg overnight DST 7.9, LDDST 19 μg/dL) 원인 감별을 위해 혈장 ACTH를 먼저 측정한다. ACTH ↑(>20-40 pg/mL) → ACTH 의존성(뇌하수체 or 이소성); ACTH 억제(<5-10 pg/mL) → ACTH 비의존성(부신 종양). ②DHEA-S는 부신 안드로겐 과다 평가용. ③Morning plasma cortisol 단독은 이미 과다 확인됨. ④Plasma metanephrine은 갈색세포종 선별용. ⑤Cortisol binding globulin은 결합단백 평가(진단 보조적). 💡 쿠싱 증후군 확진 후 첫 감별 단계는 반드시 혈장 ACTH.",
"2022-L8-Q75": "【정답 ③】 부신 쿠싱증후군(Adrenal Cushing syndrome). Midnight salivary cortisol 10 nmol/L(상승), 24HU UFC 290 μg/day(상승), ACTH 4.0 pg/mL(억제), 복부 CT에서 단측 부신 종양 확인 → ACTH 비의존성 부신 쿠싱증후군. ①쿠싱병: ACTH 상승. ②갈색세포종: 카테콜아민 과다(고혈압 발작·두통·발한 등), aldosterone과 renin은 정상이나 본 환자 aldosterone 22 ng/dL. ④이소성 쿠싱증후군: ACTH 현저히 상승, 저칼륨혈증 두드러짐. ⑤일차성 알도스테론증: 알도스테론 상승+레닌 억제+저칼륨혈증; 본 환자 renin 2.9(정상)이므로 불일치. 💡 ACTH 억제 + 부신 단측 종양 = 부신 쿠싱증후군.",
"2022-L8-Q86": "【정답 ⑤】 아래바위정맥동굴 채혈술(Inferior petrosal sinus sampling, IPSS). 쿠싱병(뇌하수체 ACTH 분비 종양) vs 이소성 ACTH 증후군의 감별에서 가장 정확도가 높은 검사는 IPSS이다. 양측 하추체정맥동(inferior petrosal sinus)에서 동시 채혈하여 중심/말초 ACTH 비율을 측정한다(CRH 자극 후 비율 ≥3이면 쿠싱병). ①혈중 ACTH 농도: 매우 높으면 이소성 시사이나 겹침 있어 정확도 낮음. ②고용량 DST: 뇌하수체 종양은 억제(50%), 이소성은 억제 안 됨; 정확도 약 80%. ③24시간 소변 코티솔: 과다 확인용, 감별 불가. ④뇌하수체 MRI: 종양이 작으면 위음성 많음. 💡 IPSS는 쿠싱병 vs 이소성 감별의 gold standard.",
"2022-L8-Q96": "【정답 ⑤】 부신피질 zona fasciculata의 세포 증식. Moon face + central obesity + 혈장·소변 cortisol 증가 → 쿠싱 증후군. Aldosterone 정상이므로 연관된 부신 변화는 cortisol 생성 부위인 zona fasciculata의 과형성/종양. ①비기능성 선종: 호르몬 과다 없음. ②두개인두종: suprasellar 종양으로 뇌하수체 기능 저하를 유발하나 cortisol 과다 아님. ③부신수질 종양(갈색세포종): catecholamine 과다, cortisol 과다 아님. ④Zona glomerulosa 증식: 알도스테론 과다 → 원발성 알도스테론증. 💡 Cortisol 과다 = zona fasciculata(GFR 구분 숙지).",
"2022-L8-Q80": "【정답 ④】 Right adrenalectomy(우측 부신절제술). ACTH 2.3 pg/mL(억제) + 24HU UFC 324 μg/day(상승) + 1 mg overnight DST 4.2 μg/dL(억제 실패) + 부신 CT 우측 선종 3.2 cm → ACTH 비의존성 부신 쿠싱증후군(우측 부신 선종). 치료는 복강경 또는 개방 우측 부신절제술이다. ①Mitotane: 부신피질암 치료제. ②Etomidate: 응급 수술 전 코티솔 빠른 억제용(IV, 중증). ③Metyrapone: 코티솔 합성 억제 약물(수술 전후 보조). ⑤Radio frequency ablation: 일반적으로 1차 치료 아님. 💡 부신 선종에 의한 ACTH 비의존성 쿠싱 → 해당 측 부신절제술.",
"2021-L8-Q24": "【정답 ②】 Rapid ACTH stimulation test(급속 부신피질자극호르몬 자극 검사). 산후 출혈 + 수유 불가 + 무월경 → Sheehan 증후군(산후 뇌하수체 경색) 의심. 뇌하수체 기저호르몬 결과: LH/FSH 저하, Estradiol 저하, Free T4 저하(TSH 정상→이차성), GH/IGF-1 저하, ACTH 31(정상이나 morning 낮은 경우), Cortisol 6.9 μg/dL(경계). 코티솔이 낮아 부신피질 예비능 평가가 필요하며, 급속 ACTH 자극 검사(cosyntropin 250 μg IV 후 60분 cortisol)로 HPA 축 기능을 평가한다. ①GnRH 자극 검사: 성선기능 평가이나 이미 LH/FSH 저하로 뚜렷함. ③경구당부하검사: GH 과다(말단거대증) 확인. ④Sella MRI: 형태학적 평가(기능 평가 아님). ⑤Dexamethasone suppression test: 코티솔 과다(쿠싱) 평가. 💡 Sheehan 증후군 → 범뇌하수체기능저하 → ACTH 축 평가가 생명 관련으로 우선.",
"2021-L8-Q26": "【정당 ⑤】 경구당부하검사 후 성장호르몬 측정(OGTT with GH suppression test). 당뇨병 + GH 4.5 ng/mL(현저 상승, 기준 <0.17) + IGF-1 610 ng/mL(상승) → 말단거대증 강력 의심. 확진을 위해 75 g 포도당 부하 후 GH 억제 실패(nadir >1 ng/mL, 일부 기준 >0.4)를 확인한다. ①Saline loading test: 알도스테론 과다(원발성 알도스테론증) 확진. ②Rapid ACTH stimulation test: 부신기능저하 평가. ③Dexamethasone suppression test: 쿠싱 선별. ④OGTT 후 cortisol 측정: 쿠싱에서 혈당 변화에 코티솔이 반응 안 하는 것 확인 시 사용(드물게). 💡 말단거대증 확진 = OGTT 후 GH 억제 실패; 당뇨병 동반은 GH 과다의 결과.",
"2021-L8-Q27": "【정답 ②】 소마토스타틴유사체(Somatostatin analogue). 말단거대증 접형동수술 3개월 후: GH 3.5 ng/mL(여전히 상승), IGF-1 532(상승). MRI에서 잔류 종양 없으나 호르몬 수치 정상화 실패 → 불완전 관해. 약물 치료로 소마토스타틴 수용체 유사체(octreotide, lanreotide)를 사용하여 GH 억제를 시도한다. ①Ketoconazole: 코티솔 합성 억제(쿠싱 치료). ③재수술: MRI에 잔류 종양이 없으므로 우선 약물 치료 선택. ④방사선치료: 약물 실패 후 또는 보조적으로 고려. ⑤경과관찰: GH/IGF-1이 여전히 비정상이므로 불가. 💡 말단거대증 수술 후 호르몬 미정상화: SSA(somatostatin analogue)로 2차 약물치료.",
"2021-L11-Q28": "【정답 ①】 추적관찰(경과 관찰). 검사 결과: 모든 뇌하수체 호르몬 정상 범위(LH/FSH/E2/TSH/ACTH/Cortisol/IGF-1 정상). 프로락틴 32 ng/mL로 약간 상승하나, 증상(시력 저하·시야 장애 없음)이 없고 월경 규칙적이며 유즙 분비 없고 종양이 작은 경우(영상 결과에 따라 micro 또는 작은 macro). 이처럼 증상이 없고 호르몬 이상이 경미한 비기능성 혹은 소형 prolactinoma는 추적관찰이 적절하다. ②카베르골린: 증상이 있는 프로락틴종에 사용. ③감마나이프: 수술·약물 실패 후. ④경구피임제: 무월경·불임 증상 완화용이나 종양 치료 아님. ⑤수술: 증상(시야장애 등) 있거나 약물 실패 시. 💡 무증상 소형 뇌하수체 우연 발견종(incidentaloma) → 추적관찰 우선.",
"2021-L11-Q31": "【정답 ③】 프로락틴분비종(Prolactinoma). Prolactin 392 ng/mL(현저 상승), LH/FSH 저하, 테스토스테론 저하(115 ng/mL, 정상 300-900) → 프로락틴 과다에 의한 hypogonadotropic hypogonadism. GH 4.5, IGF-1 210(참고치 54-436, 정상) → 말단거대증 아님. ACTH/코티솔 정상. MRI에서 뇌하수체 종양과 bitemporal hemianopsia → 프로락틴분비 거대선종. ①쿠싱병: ACTH 상승·코티솔 과다. ②말단거대증: GH 현저 상승·IGF-1 상승. ④TSH 분비선종: TSH 상승·갑상선기능항진 증상. ⑤비기능성 선종: 호르몬 과다 없음, prolactin은 경미하게 상승(stalk 압박). 💡 Prolactin >200 ng/mL + 거대선종 = prolactinoma 진단(stalk compression으로는 prolactin이 이렇게 높지 않음).",
"2021-L11-Q32": "【정답 ②】 도파민효능제(Dopamine agonist). 직전 문항(31번)에서 프로락틴분비 거대선종으로 진단. 프로락틴종의 1차 치료는 도파민 효능제(cabergoline 또는 bromocriptine)이며, 종양 크기와 관계없이 1차 약물치료를 시행한다. 시야 장애도 약물 치료 후 호전 기대할 수 있음. ①경과관찰: 시야 장애 동반 시 부적절. ③소마토스타틴 유사체: GH 종양(말단거대증) 치료. ④감마나이프: 약물 실패·수술 후 보조. ⑤경접형골동수술: 도파민 효능제 실패·불내성·뇌척수액 비루 등 합병증 시. 💡 Prolactinoma 치료 원칙: DA agonist 1차(cabergoline > bromocriptine).",
"2021-L12-Q35": "【정답 ②】 말단거대증(외모 변화를 자각하지 못하는 경우도 수술 적응). 말단거대증은 소마토스타틴 유사체가 아닌 경우 수술(transsphenoidal surgery)이 1차 치료이며, 증상 자각 여부에 관계없이 GH/IGF-1 과다로 인한 합병증(심혈관·대사·관절 등) 예방을 위해 수술 적응이 된다. ①정상 시력의 Rathke's cleft cyst: 경과관찰 가능. ③무월경으로 발견된 프로락틴종: 도파민 효능제 1차 치료(수술 아님). ④시력·호르몬 장애 없는 2 cm 비기능성 선종: 추적관찰 가능. ⑤방사선·항암 치료 후 발견된 비기능성 종양: 방사선 치료 후 변화일 가능성, 경과관찰 우선. 💡 수술 적응증: 1) 말단거대증/쿠싱병(약물 실패 시 또는 1차), 2) 시야 장애 동반, 3) 도파민 효능제 실패 prolactinoma.",
"2021-L12-Q36": "【정답 ⑤】 뇌하수체 줄기(pituitary stalk) 병변도 stalk를 보존하며 제거할 수 있다. 경접형골동 수술(transsphenoidal surgery)의 특성상 뇌하수체 줄기 병변에 대해서도 줄기를 최대한 보존하는 방향으로 수술이 가능하다. ①대부분 경접형골동(transsphenoidal) 접근이며, 개두술은 특수한 경우에 한함. ②시신경과 뇌하수체 줄기를 경계 짓는 것은 안장격막(diaphragma sellae)이 아닌 구조이며, 실제로 수술 시 상방으로 시신경·줄기가 노출된다. ③뇌척수액 유출(CSF leak)은 가능한 합병증이나 '대부분 동반'되지는 않는다(오히려 최소화하도록 노력). ④시신경은 수술 시야에서 직접 확인하기 어려우며, 뇌하수체 줄기와의 관계를 간접적으로 파악한다. 💡 경접형골동수술: 비내시경 또는 현미경 접근, 비강→접형골동→안장 순.",
"2021-L14-Q42": "【정답 ③】 Aldosterone-Cortisol-DHEA-Norepinephrine (Zona glomerulosa-Zona fasciculata-Zona reticularis-Medulla 순). 부신의 층별 호르몬: Zona glomerulosa → Aldosterone(mineralocorticoid), Zona fasciculata → Cortisol(glucocorticoid), Zona reticularis → DHEA(androgen), Medulla → Epinephrine/Norepinephrine(catecholamine). 💡 암기: GFR = Glomerulosa/Fasciculata/Reticularis = Salt(Aldo)/Sugar(Cortisol)/Sex(DHEA), Medulla = catecholamines.",
"2021-L14-Q44": "【정답 ④】 Aldosterone. 이미지 문항으로, (ㄱ)은 부신 생리 도식에서 RAAS 경로의 최종 산물인 aldosterone에 해당한다. Renin → Angiotensin I → ACE → Angiotensin II → Zona glomerulosa → Aldosterone 분비. Aldosterone은 신장 집합관에서 Na 재흡수·K 배설을 증가시켜 혈압 조절에 관여한다. ①Cortisol: ACTH에 의해 조절, zona fasciculata. ②ACTH: 뇌하수체 전엽 분비, cortisol 자극. ③DHEA: zona reticularis. ⑤Epinephrine: 부신수질. 💡 RAAS 최종 산물 = aldosterone(zona glomerulosa), 주 조절인자 = angiotensin II + K⁺ + ACTH(부차적).",
"2021-L15-Q43": "【정답 ①】 두통(headache)은 코티솔 과잉분비에 의한 직접적 증상이 아니다. 쿠싱 증후군에서 코티솔 과다로 발생하는 증상: 고혈압, 고혈당(인슐린 저항성), 녹내장(안압 상승), 골다공증(골형성 억제), moon face, buffalo hump, central obesity, 선조, 쉽게 멍듦, 근위부 근병증, 무월경 등. 두통은 비특이적이며 코티솔의 직접적 병리기전으로 설명되지 않는다. ②고혈압: 혈관 감수성 증가 및 Na 저류. ③고혈당: 포도당신생합성 증가·인슐린 저항성. ④녹내장: 코티솔이 안압 조절에 영향. ⑤골다공증: 골형성 억제·골흡수 촉진. 💡 두통은 뇌하수체 종양의 mass effect로 생길 수 있으나, 코티솔 과다 자체의 직접 증상은 아님.",
"2021-L15-Q45": "【정답 ③】 Cushing's disease(뇌하수체 ACTH 분비 선종). 내인성 쿠싱 증후군의 원인 빈도: 1위 Cushing's disease(뇌하수체 ACTH 종양, ~70%) > 2위 Adrenocortical adenoma(~15-20%) > 3위 Ectopic ACTH syndrome(~10%) > Adrenocortical carcinoma(드묾) > Macronodular adrenal hyperplasia(매우 드묾). ①부신 선종, ②부신암, ④이소성 ACTH, ⑤대결절 부신과형성은 모두 Cushing's disease보다 드물다. 💡 쿠싱 증후군 원인 1위 = 쿠싱병(뇌하수체 ACTH 종양).",
"2021-L15-Q46": "【정답 ⑤】 Rapid ACTH stimulation test(급속 ACTH 자극 검사). 이 검사는 부신기능저하증 진단(부신의 ACTH 반응 평가)에 사용되며, 쿠싱 증후군 선별/진단 검사가 아니다. 쿠싱 증후군 선별·진단 검사: ① 1 mg overnight DST ② 24 hour urine free cortisol ③ Low-dose DST ④ Midnight plasma cortisol(또는 자정 타액 코티솔). 💡 Rapid ACTH stimulation test → 부신기능저하 진단. Dexamethasone suppression test → 쿠싱 선별/확진. 방향이 반대임에 주의.",
"2021-L15-Q48": "【정답 ①】 Adrenal CT. ACTH 65 pg/mL로 억제되지 않음(>5 pg/mL) → ACTH 의존성 쿠싱 증후군. 따라서 원인 감별은 뇌하수체(쿠싱병) vs 이소성 ACTH 증후군이며, 부신 CT는 ACTH 비의존성(부신 종양) 경우에 1차로 사용된다. ACTH 의존성에서 부신은 bilateral hyperplasia를 보일 뿐 원인 판별에 도움 안 됨. ②CRH test: 뇌하수체 ACTH 종양은 CRH에 반응(ACTH/cortisol 상승), 이소성은 반응 없음 → 감별에 유용. ③High dose DST: 쿠싱병 vs 이소성 감별에 사용. ④IPSS: 가장 정확한 감별 검사. ⑤Sella MRI: 뇌하수체 종양 확인. 💡 ACTH 의존성 쿠싱 감별: CRH test/고용량DST/Sella MRI/IPSS가 유용. 부신 CT는 ACTH 비의존성에 사용.",
"2021-L17-Q102": "【정답 ①】 Mineralocorticoid(fludrocortisone). 일차성 부신피질기능저하증(Addison's disease)에서는 부신피질 전체가 파괴 → glucocorticoid + mineralocorticoid + androgen 모두 결핍. 이차성(ACTH 결핍)에서는 aldosterone은 RAAS에 의해 비교적 보존되어 mineralocorticoid 보충이 불필요하다. 따라서 일차성에서만 추가로 필요한 것은 mineralocorticoid(fludrocortisone)이다. ②Glucocorticoid: 일차성·이차성 모두 필요(hydrocortisone). ③Catecholamine: 부신수질도 손상되나 임상적으로 보충 불필요. ④Estrogen: 부신피질기능저하의 표준 치료제 아님. ⑤DHEA: 일부 여성에서 보조적으로 사용될 수 있으나 필수 아님. 💡 일차성 부신기능저하 = glucocorticoid + mineralocorticoid 모두 보충 필요. 이차성 = glucocorticoid만.",
"2025-L12-Q9": "[정답 ⑤] 혈중 레닌 활성도(PRA)와 알도스테론 농도(PAC) — 저항성 고혈압 + 저칼륨혈증(K⁺ 3.0)의 조합은 일차성 알도스테론증(primary aldosteronism, PA)을 강하게 시사하며, PA 선별의 1차 검사는 PAC/PRA 비(ARR)이다.\n[오답] ① 바소프레신: 저칼륨·저항성 고혈압과 무관. ② 유리 메타네프린: 갈색세포종 의심 시 — 본 증례는 발작성 증상 없음. ③ 코르티솔·ACTH: 쿠싱증후군 의심 시(체중증가·보름달 얼굴 등 없음). ④ TSH·fT4: 갑상선 기능이상 의심 시.\n💡 저항성 고혈압 + 저칼륨혈증 → PA 선별(ARR) 최우선.",
"2025-L12-Q53": "[정답 ②] 갈색세포종(Pheochromocytoma) — 발작성 고혈압·두통·심계항진·발한의 3대 증상 + 24h 소변 분획화 메타네프린 및 혈중 유리 메타네프린 상승 + 부신종양 가족력(어머니 부신수술)이 모두 부합한다.\n[오답] ① 쿠싱병: 비만·월상안면·피부선조 등 필요. ③ 의인성 쿠싱: 외인성 스테로이드 투여력 없음. ④ 원발성 알도스테론증: 저칼륨혈증과 지속성 고혈압, 메타네프린 정상. ⑤ 자가면역성 부신기능저하증: 저혈압·저나트륨혈증 양상.\n💡 갈색세포종의 biochemical diagnosis = plasma free metanephrine 또는 24h 소변 분획화 metanephrine.",
"2025-L12-Q69": "[정답 ③] Spironolactone(미네랄로코르티코이드 수용체 길항제) — 부신정맥채혈에서 양측성 부신 과증식증으로 확인된 PA는 수술 적응이 아니며, MR 길항제(spironolactone 또는 eplerenone)가 1차 약물치료이다.\n[오답] ① 알파차단제: 갈색세포종 수술 전 전처치. ② 베타차단제: PA에서 단독 사용 시 레닌 억제로 검사 교란 가능, 1차제 아님. ④ Thiazide 이뇨제: PA의 근본 치료 아님. ⑤ ARB: PA의 병인(알도스테론 과잉)에 특이적이지 않음.\n💡 일측성 PA → 부신 절제술 / 양측성 PA → MR 길항제 약물치료.",
"2023-L10-Q15": "[정답 ①] 저칼륨혈증 교정 후 선별검사 시행 — 저칼륨혈증은 알도스테론 분비를 억제하여 ARR이 위음성으로 나올 수 있으므로, K⁺를 교정한 후 선별검사를 시행해야 한다.\n[오답] ② PAC 절대값도 ARR 해석에 함께 고려한다(PAC≥15 ng/dL + ARR≥30). ③ Spironolactone은 4주 중단이 필요하다(2주 아님). ④ 가장 흔한 확진검사는 경구나트륨부하검사. ⑤ 확진검사는 체액량 확대(Na 부하)로 알도스테론 억제 실패를 확인하는 것 — 체액량 감소와 반대.\n💡 PA 선별 전 K⁺ 교정 필수 + 스피로노락톤 4주 중단.",
"2023-L10-Q85": "[정답 ④] 부신정맥채혈 재시행 — AVS 편측화 비(LR): 우측 = 218/72 = 3.03, 좌측 = 384/120 = 3.20, LR = 3.03/3.20 = 0.95. 좌측이 근소 우세이나 통상적 편측화 기준(≥2~4)에 미달. 컨트롤 비(양측 cortisol/IVC cortisol 비교)도 재확인 필요. 결과가 불명확하므로 재채혈.\n[오답] ① 우측 절제술: 우측 편측화 미충족. ② 좌측 절제술: LR이 기준 미달로 확신 부족. ③ 소듐 채널 차단제: 해당 없음. ⑤ MR 길항제: 편측성 여부 판단 전에는 수술 가능성 열어두어야 함.\n💡 AVS 결과 불명확(LR 기준 미달) → 재채혈이 원칙.",
"2022-L9-Q48": "[정답 ③] Doxazosin(알파1 차단제) — 소변 메타네프린·노르메타네프린 현저 상승 + CT 부신종괴 = 갈색세포종. 수술 전 혈압 조절 1차 약제는 알파 차단제(phenoxybenzamine 또는 doxazosin/prazosin).\n[오답] ① Propranolol: 알파 차단 선행 없이 베타차단 시 고혈압 위기 위험. ② Furosemide: 이뇨제 단독 부적절. ④ Metyrosine: 카테콜아민 합성 억제, 보조적 사용. ⑤ Nicardipine: 칼슘채널차단제, 보조 가능하나 1차 아님.\n💡 갈색세포종 수술 전: 알파 차단 먼저 → 그 다음 필요 시 베타 차단 추가(순서 중요).",
"2022-L9-Q88": "[정답 ②] 우측 부신 절제술 — 혈장/24h 소변 메타네프린·노르메타네프린 현저 상승 = 갈색세포종. AVS상 우측 편측화비 = (2640/160) / (1200/150 환산 아닌 우측/IVC 비율) 우세 → 우측 병변. CT에서 우측 부신 종괴 확인 후 우측 절제술.\n[오답] ① 좌측 절제술: AVS 우측 편측화. ③ 양측 절제술: 단측 병변. ④ Spironolactone: 갈색세포종 치료 아님. \n💡 갈색세포종 = 생화학 확진 → 영상 위치 확인 → 알파차단 후 수술.",
"2022-L9-Q103": "[정답 ③] 0.9% 식염수 부하검사 — 덱사메타손억제검사 정상(코르티솔 1.0, 쿠싱 배제) + 24h 소변 메타네프린 정상 35 μg(갈색세포종 배제). 다음 단계: ARR 선별 후 PA 확진을 위한 식염수 정맥 부하검사.\n[오답] ① 부신정맥채혈: PA 확진 후 편측화 평가 단계. ② 부신 CT: 기능검사 먼저 시행. ④ 저용량 덱사메타손 억제: 쿠싱 의심 시. ⑤ 급속 ACTH 자극검사: 부신기능저하 의심 시.\n💡 PA 선별(ARR) 양성 → 확진(식염수 부하) → 편측화(AVS) 순서.",
"2022-L9-Q21": "[정답 ③] Alpha-blocker(알파 차단제) — 젊은 남성 + 발작성 두통·발한·심계항진 + 혈압 170/120 + 부신 CT 종괴 = 갈색세포종. 혈압 조절 1차 약제는 알파 차단제.\n[오답] ① Thiazide: 갈색세포종 혈압 조절에 부적합. ② Beta-blocker: 알파 차단 선행 없이 사용 시 고혈압 위기. ④ Potassium sparing diuretics: PA 치료제. ⑤ ACE 억제제: 갈색세포종 1차 치료 아님.\n💡 갈색세포종 혈압 조절: 알파차단(phenoxybenzamine/doxazosin) 우선.",
"2022-L9-Q100": "[정답 ③] Pheochromocytoma — 두통·두근거림의 발작성 증상 + 저항성 고혈압 3종류 약제에도 불구. 레닌 활성 0.12(저하) + 알도스테론 17 ng/dL(정상범위 내이지만 레닌 억제에도 알도스테론이 적절히 감소하지 않는 경우 PA 의심 가능하나), 임상 증상과 가장 부합하는 것은 갈색세포종. 파싱된 선지 오류로 ③ Pheochromocytoma 선택.\n[오답] ① Pituitary adenoma: 직접적 내분비 고혈압 원인 아님. ② Pancreatic islet cell tumor: 저혈당·소화증상. ④ Adrenal adenoma(PA): 알도스테론/레닌 비율 상승 시 의심 — 임상 증상이 갈색세포종에 더 합당. ⑤ Parathyroid adenoma: 고혈압과 직접 관계 미약.\n💡 발작성 3대 증상(두통·발한·심계항진) + 저항성 고혈압 → 갈색세포종 우선 의심.",
"2021-L16-Q47": "[정답 ⑤] Mineralocorticoid receptor antagonist(스피로노락톤 등) — PA 선별검사(ARR) 시행 전 MR 길항제는 반드시 4주 이상 중단. 스피로노락톤은 레닌을 자극해 ARR 위음성, 또는 알도스테론 분비 자극으로 위양성 유발.\n[오답] ① 알파차단제: ARR에 영향 없음. ② 베타차단제: 레닌 억제 → ARR 위양성 가능하나 '반드시' 중단 필수는 아님(권고). ③ 칼슘채널차단제: ARR에 최소 영향, 중단 불필요. ④ ARB: 레닌 상승 유발, 중단 권고이나 절대 필수 아님.\n💡 PA 선별 전 필수 중단: MR 길항제(spironolactone/eplerenone) 4주.",
"2021-L16-Q49": "[정답 ⑤] Plasma free metanephrines — 갈색세포종 진단 생화학검사 중 민감도 가장 높음(96~100%). 카테콜아민 중간 대사물로 종양 내에서 지속 생성되어 발작 사이에도 상승 유지.\n[오답] ① 24h VMA: 민감도 64~74%로 낮음. ② 24h urine catecholamines: 민감도 약 75%. ③ 24h total metanephrines: 민감도 77~83%, 혈장 유리 메타네프린보다 낮음. ④ Plasma catecholamines: 발작 시 채혈 필요, 일상 시 민감도 낮음.\n💡 갈색세포종 최고 민감도 = Plasma free metanephrines.",
"2021-L16-Q50": "[정답 ①] Right aldosterone producing adenoma — PRA 감소 + 알도스테론 상승 = PA. AVS 결과(우측 편측 우세로 기술된 원문 맥락) → 우측 선종. 수술(우측 부신 절제술) 적응.\n[오답] ② 좌측 선종: AVS 좌측 편측화 아님. ③ 특발성 고알도스테론증: 양측성 → 약물치료. ④ GRA(Glucocorticoid remediable aldosteronism): 가족력 없고 덱사메타손으로 억제됨. ⑤ Pheochromocytoma: 메타네프린 상승 증거 없음.\n💡 PA 편측화 확인 → 일측성 절제 / 양측성 → 약물(MR 길항제).",
"2021-L16-Q71": "[정답 ①] Prazosin(알파1 차단제) — 24h 소변 norepinephrine·epinephrine·metanephrine·normetanephrine 현저 상승 + 혈장 metanephrine·normetanephrine 크게 증가 = 갈색세포종 확진. 수술 전 처치 1차 약제는 알파1 차단제(prazosin/doxazosin/phenoxybenzamine).\n[오답] ② Atenolol: 알파 차단 선행 없이 베타차단 시 고혈압 위기. ③ Salbutamol: 베타2 항진제, 혈압 상승 우려. ④ L-dopa: 도파민 전구체, 금기. ⑤ Dexamethasone: 적응 없음.\n💡 수술 전 처치: 알파차단(10~14일) → 필요 시 베타차단 추가(순서 반드시 알파 먼저).",
"2025-L9-Q4": "[정답 ⑤] Delayed enhancement — 뇌하수체 미세선종(prolactinoma)은 정상 뇌하수체 전엽보다 혈류 공급이 적어 조영제 유입이 느리다. Dynamic contrast MRI에서 정상 전엽이 빠른 증강(early peak)을 보이는 반면, 선종은 지연 증강(delayed enhancement) 또는 상대적 저신호로 나타난다.\n[오답] ① No enhancement: 낭성 또는 완전 무혈관 병변. ② Slight enhancement: 어느 정도 증강은 있으나 지연이 핵심. ③ Strong enhancement: 정상 전엽·뇌수막종. ④ Early enhancement: 정상 전엽의 특징.\n💡 뇌하수체 미세선종 dynamic MRI = 지연·상대적 저증강 (정상 전엽 대비).",
"2025-L9-Q59": "[정답 ⑤] Oxytocin — T1 강조 MRI에서 뇌하수체 후엽(posterior pituitary)은 지질 성분으로 인해 자연 고신호(T1 bright spot)로 보인다. 화살표가 후엽을 가리키는 경우 관련 호르몬은 ADH와 옥시토신이며, 선지 중 oxytocin(⑤)을 선택. (2023년 유사 문항은 ADH가 정답으로 나오기도 함 — 화살표 구조물과 제시된 선지에 따라 결정.)\n[오답] ① GH, ② LH, ③ TSH, ④ Prolactin: 모두 전엽 호르몬.\n💡 T1 high signal 'bright spot' = 뇌하수체 후엽 → ADH & Oxytocin 저장·분비.",
"2025-L9-Q19": "[정답 ①] Adrenal adenoma — 부신 선종은 지질이 풍부해 비조영 CT에서 HU가 낮고(≤10 HU), chemical shift MRI에서 신호 소실(dropout), 조영증강 CT에서 빠른 washout을 보인다.\n[오답] ② Abscess: 감염 임상 증거 필요. ③ Metastasis: HU 높음·washout 느림. ④ Cortical carcinoma: 크고 불규칙·HU 높음. ⑤ Pheochromocytoma: T2 고신호·강한 조영증강·느린 washout.\n💡 부신 adenoma = 낮은 HU(≤10) + 빠른 washout + chemical shift dropout.",
"2025-L9-Q34": "[정답 ②] 지방(Fat) — 비조영 CT에서 음의 HU 값(-20~-100 HU 범위)을 보이는 병변 내 성분은 지방이다. 부신 선종은 세포 내 지질(lipid-rich)로 HU ≤10이 진단 기준.\n[오답] ① 공기: HU 약 -1000. ③ 요오드(조영제): HU 100~400. ④ 석회화: HU 400~1000. ⑤ 급성 출혈: HU 50~80.\n💡 CT 낮은 HU(음수~10 이하) = 지방 성분 = 부신 선종에 유리한 소견.",
"2023-L14-Q51": "[정답 ⑤] Delayed enhancement — 2025-L9-Q4와 동일 임상 시나리오(31세 여성, prolactin 190 ng/mL, prolactinoma). 뇌하수체 미세선종은 dynamic contrast MRI에서 정상 전엽보다 조영제 도달이 늦어 지연 증강을 보인다.\n[오답] ①②③④: No/slight/strong/early enhancement는 뇌하수체 선종의 전형 소견이 아님.\n💡 Prolactinoma dynamic MRI = delayed(지연) enhancement 가장 흔한 소견.",
"2023-L14-Q72": "[정답 ①] ADH(항이뇨호르몬, vasopressin) — 정상인 T1 강조 MRI에서 화살표가 가리키는 밝은 구조물(T1 bright spot)은 뇌하수체 후엽이며, 후엽에서 저장·분비되는 주요 호르몬은 ADH와 옥시토신이다.\n[오답] ② LH, ③ ACTH, ④ Prolactin, ⑤ GH: 모두 뇌하수체 전엽 호르몬.\n💡 T1 bright spot(뇌하수체 후엽) → ADH/옥시토신; bright spot 소실 시 요붕증 시사.",
"2023-L14-Q86": "[정답 ②] Adrenal adenoma — CT/MRI에서 좌측 부신 병변이 낮은 attenuation(낮은 HU)·chemical shift MRI 신호 소실 패턴을 보이면 adenoma가 가장 가능성 높다.\n[오답] ① Abscess: 임상적 감염 증거 필요. ③ Metastasis: HU 높고 washout 느림. ④ Cortical carcinoma: 크고 불규칙. ⑤ Pheochromocytoma: T2 매우 밝음·강한 조영증강.\n💡 부신 우연종 평가: 비조영 CT HU ≤10 → adenoma 진단 가능.",
"2022-L12-Q30": "[정답 ①] ADH — 정상인 T1 강조 뇌하수체 MRI에서 화살표가 가리키는 후엽 bright spot의 관련 호르몬은 ADH(vasopressin). 2023-L14-Q72와 동일 개념.\n[오답] ② LH, ③ ACTH, ④ TSH, ⑤ GH: 전엽 호르몬.\n💡 T1 고신호 뇌하수체 후엽 = ADH + 옥시토신 저장소.",
"2022-L12-Q40": "[정답 ①] Adrenal adenoma — 비조영 CT에서 부신 병변 HU ≤10(지방 성분)이면 adenoma를 우선 진단한다.\n[오답] ② Metastasis: HU 높음. ③ Calcification: HU 매우 높음. ④ Pheochromocytoma: T2 고신호·강한 조영증강. ⑤ Cortical carcinoma: 크고 이질성·HU 높음.\n💡 비조영 CT HU ≤10 = 부신 선종(adenoma) 진단적.",
"2021-L9-Q30": "[정답 ④] Dynamic contrast enhancement MRI — Prolactin 190 ng/mL + 유즙과다 = prolactinoma 의심. 병변 감별 및 정확한 위치 확인을 위한 가장 적절한 영상검사는 dynamic contrast enhancement MRI(DCE-MRI)다. 미세선종은 동적 조영에서 지연 증강으로 정상 전엽과 구별.\n[오답] ① T2WI: 보조적. ② Non-contrast T1WI: 후엽 bright spot 확인 용도. ③ FDG PET: 내분비 선종 1차 아님. ⑤ Contrast CT: 방사선 피폭, MRI보다 해상도 낮음.\n💡 뇌하수체 선종 감별 최적 영상 = Dynamic gadolinium-enhanced MRI.",
"2021-L21-Q56": "[정답 ④] 과거 영상과 비교 — 건강검진 CT에서 우연 발견된 부신 종괴(adrenal incidentaloma)는 먼저 기존 영상과 비교해 크기 변화를 확인한다. 크기 <4 cm + 양성 영상 특성 → 추적 관찰.\n[오답] ① 초음파: 부신 평가 CT/MRI보다 열등. ② 조직검사: 기능검사·영상 먼저. ③ 조영증강 CT: 비조영 HU ≤10이면 adenoma 우선 진단 가능. ⑤ Chemical shift MRI: 비조영 HU 10~20으로 애매할 때.\n💡 부신 우연종 첫 조치 = 이전 영상 비교(크기 변화 확인).",
"2021-L21-Q57": "[정답 ④] 조영증강 CT 상 높은 Washout Rate — 부신 선종은 absolute washout ≥60%, relative washout ≥40%로 조영제가 빠르게 씻겨나가며, 이것이 악성 병변과의 감별에 가장 유용하다.\n[오답] ① 낭성 변화: 선종의 전형 아님. ② 내부 출혈: 드묾. ③ Chemical shift MRI 신호강도 유지: 선종은 반대로 신호 소실(dropout). ⑤ 비조영 CT HU 30 이상: 선종은 HU ≤10 전형.\n💡 부신 선종 = 낮은 HU(≤10) + 빠른 washout + chemical shift dropout.",
"2025-L15-Q42": "[정답 ③] 부갑상선기능항진증 + 뇌하수체 프로락틴 분비 선종 동시 진단 35세 여자 — MEN1의 3대 구성요소는 ① 부갑상선 종양(>95%), ② 췌장 신경내분비종양, ③ 뇌하수체 선종. 2개 이상 존재 → MEN1.\n[오답] ① 갑상선 수질암: MEN2A/2B. ② 양측성 갈색세포종: MEN2A/2B 또는 VHL. ④ 갑상선 수질암+유두암 혼재 환자의 자녀: MEN2 배제 대상(유두암은 MEN2 구성 아님). ⑤ 혈액투석 + 부갑상선 4개 비대: 이차성(요독성) 부갑상선기능항진증.\n💡 MEN1 = 3P: Parathyroid(부갑상선) + Pancreas(췌장 신경내분비) + Pituitary(뇌하수체).",
"2025-L15-Q57b": "[정답 ⑤] PTH(부갑상선호르몬) + 24시간 소변 메타네프린 — 갑상선 수질암(MTC) + 아버지 갑상선암 + 남동생 신결석 = MEN2A 의심(MTC + 갈색세포종 + 부갑상선기능항진증). 수술 전 ① 갈색세포종 배제(메타네프린) + ② 부갑상선기능항진증 확인(PTH/Ca) 필수. 갈색세포종 미배제 수술 시 고혈압 위기 위험.\n[오답] ① 인슐린·가스트린: MEN1 관련. ② 글루카곤·프로락틴: MEN1 관련. ③ 가스트린·PTH: 가스트린은 MEN2A 불필요. ④ 칼시토닌·갑상선글로블린: 수술 후 추적.\n💡 MEN2A 수술 전: 갈색세포종(메타네프린) 먼저 배제 → 부갑상선기능항진증(PTH/Ca) 확인.",
"2025-L15-Q18b": "[정답 ②] RET — MEN2(MTC + 갈색세포종 + 부갑상선기능항진증)의 원인 유전자는 RET proto-oncogene(10번 염색체 q11.2)의 germline gain-of-function 변이.\n[오답] ① RB1: 망막모세포종. ③ MYC: 비특이적 종양유전자. ④ MENIN: MEN1 원인유전자(11번 염색체 q13, tumor suppressor). ⑤ CDKN1B: MEN4 관련.\n💡 MEN1 = MENIN / MEN2A·2B = RET.",
"2023-L11-Q10": "[정답 ⑤] Pheochromocytoma → plasma or 24h urine metanephrine — 갈색세포종 선별 최적 검사는 혈장 유리 메타네프린(민감도 96~100%) 또는 24h 소변 분획화 메타네프린.\n[오답] ① Insulinoma 선별: 72h 금식검사(혈당/인슐린/C-peptide). ② Parathyroid adenoma: Ca + PTH(free T4/TSH는 갑상선). ③ MTC 선별: 혈중 calcitonin(PTH·경부초음파는 부갑상선). ④ Pituitary adenoma: 호르몬별 검사 + sellar MRI.\n💡 갈색세포종 선별 = metanephrine(혈장 또는 24h 소변) 최고 민감도.",
"2023-L11-Q22": "[정답 ③] RET — MEN type 2(A 및 B)는 RET proto-oncogene의 germline 활성화(gain-of-function) 변이로 발생.\n[오답] ① MENIN: MEN1. ② MYC: 비특이적. ④ EGFR: 폐암·대장암. ⑤ RB1: 망막모세포종.\n💡 MEN2 = RET gain-of-function / MEN1 = MENIN loss-of-function(tumor suppressor).",
"2023-L11-Q59": "[정답 ①] 부갑상선 종양(원발성 부갑상선기능항진증) + 췌장 인슐린 분비 종양 동시 진단 26세 남자 — MEN1의 전형: 2개 이상 구성 종양 동시 발현.\n[오답] ② 갑상선 수질암 진단된 여성의 자녀: MEN2 RET 검사 대상. ③ 갑상선 유두암+수질암 혼재: MEN2 고려. ④ 양측성 갈색세포종: MEN2A/VHL. ⑤ 부갑상선 종양이나 PTH·Ca 정상: 기능적 종양 아님, MEN1 기준 미달.\n💡 MEN1 = 부갑상선 + 췌장 신경내분비(인슐린종·가스트린종 등) + 뇌하수체.",
"2022-L10-Q14": "[정답 ②] RET — MEN type 2의 원인 유전자. (2023-L11-Q22와 동일 개념)\n[오답] ① MENIN: MEN1. ③ RB1: 망막모세포종. ④ EGFR: 폐암. ⑤ MYC: 비특이적.\n💡 MEN2 = RET gain-of-function / MEN1 = MENIN loss-of-function.",
"2022-L10-Q62": "[정답 ②] Pheochromocytoma → plasma or 24h urine metanephrine — 2023-L11-Q10과 동일 개념.\n[오답] ① Parathyroid adenoma → free T4/TSH: 잘못된 조합(부갑상선 선별은 Ca+PTH). ③ Pituitary adenoma → LH/FSH/estradiol: 성선기능만 평가. ④ MTC → PTH + neck sono: MTC 선별은 calcitonin. ⑤ Insulinoma → glucose + gastrin: gastrin은 가스트린종 표지자.\n💡 갈색세포종 선별의 핵심 = metanephrine 계열.",
"2022-L10-Q114": "[정답 ④] 뇌하수체 호르몬 검사 + sellar MRI — 양측 부갑상선 종양(원발성 부갑상선기능항진증) + 췌장 종양 = MEN1 확진. 세 번째 구성요소인 뇌하수체 선종 선별을 위해 뇌하수체 호르몬 검사와 sellar MRI 시행.\n[오답] ① 갑상선기능검사: MEN1에서 갑상선 주요 표적 아님. ② 비스포스포네이트: 골다공증 치료이지 진단 다음 단계 아님. ③ 일측 부갑상선 절제: MEN1에서는 양측 침범이 흔해 3.5개 절제 또는 전절제+자가이식 원칙. ⑤ RET 유전자 검사: MEN2에서 시행.\n💡 MEN1 확진 후 → 뇌하수체 선별 = sellar MRI + 호르몬 검사.",
"2022-L10-Q122": "[정답 ⑤] Parathyroid adenoma(부갑상선 종양) — MEN1에서 가장 높은 빈도(>95%)로 발생하는 종양은 부갑상선 종양(원발성 부갑상선기능항진증)이다.\n[오답] ① Pituitary adenoma: 약 30~40% 빈도. ② Pancreatic islet cell tumor: 약 30~70%. ③ Pheochromocytoma: MEN2의 구성요소, MEN1에서 드묾. ④ Adrenal adenoma: MEN1에서 드묾.\n💡 MEN1 빈도 순: 부갑상선(>95%) > 췌장 신경내분비(30~70%) > 뇌하수체(30~40%).",
"2021-L19-Q55": "[정답 ①] MEN1 유전자(MENIN) — 부갑상선기능항진증(반복 요로결석·골다공증·압박골절) + 가스트린종 병력(위궤양·설사·위종양 수술) + 가족력(형제·아버지 위종양·요로결석) = MEN1 전형. 확인 유전자: 11번 염색체 q13의 MENIN.\n[오답] ② RET: MEN2. ③ NF1: 신경섬유종증 1형. ④ VHL: 폰히펠-린다우병. ⑤ BRAF: 갑상선 유두암·흑색종.\n💡 MEN1 = MENIN gene, 11q13, tumor suppressor.",
"2021-L19-Q63": "[정답 ①] MEN1 — 반복적 의식저하(저혈당 = insulinoma) + 가족력(형·누나 위종양=가스트린종, 아버지 흉선암·요로결석) + 복부 CT 췌장종양 + 부갑상선 스캔 이상 = MEN1의 3대 구성(부갑상선 + 췌장 신경내분비 + 흉선 유암종 포함).\n[오답] ② MEN2A: MTC + 갈색세포종 + 부갑상선기능항진증. ③ MEN2B: MTC + 갈색세포종 + 점막 신경종. ④ NF1: cafe-au-lait·피부섬유종 등. ⑤ VHL: 혈관모세포종·신세포암.\n💡 저혈당(insulinoma) + 부갑상선 + 췌장종양 가족력 = MEN1 우선.",
"2021-L20-Q53": "[정답 ②] 갈색세포종(Pheochromocytoma) — MEN type 2(A 및 B) 모두에서 갈색세포종이 특징적으로 발생한다. MEN2에서는 양측성이 많으며 부신수질 기원.\n[오답] ① 갑상선유두암: MEN2는 수질암(MTC), 유두암 아님. ③ 갑상선기능항진증: MEN2 특징 아님. ④ 알도스테론분비선종: MEN2와 무관. ⑤ 쿠싱병: MEN2와 무관.\n💡 MEN2 = 갑상선 수질암(필수) + 갈색세포종 + (MEN2A: 부갑상선기능항진증 / MEN2B: 점막 신경종).",
"2021-L20-Q54": "[정답 ①] 소변 24시간 Metanephrine 검사 — 고칼슘혈증(부갑상선기능항진증) + 경부초음파 이상 = MEN2A 가능성 시사. MEN2에서 수술 전 갈색세포종 배제가 필수이므로 24h 소변 메타네프린(또는 혈장 유리 메타네프린)을 먼저 확인.\n[오답] ② 24h Cortisol: 쿠싱증후군 의심 시. ③ 24h Prolactin: 소변으로 측정하지 않음. ④ 24h Albumin: 신장 질환 선별. ⑤ 24h Immunoglobulin: 해당 없음.\n💡 MEN2 의심 + 고칼슘혈증 → 갈색세포종 우선 배제(메타네프린) 후 수술.",
"2025-L13-Q3": "【정답 ⑤ norepinephrine transporter】 MIBG(metaiodobenzylguanidine)는 노르에피네프린의 구조적 유사체로, 크롬친화세포(chromaffin cell)의 norepinephrine transporter(NET)를 통해 세포 내로 유입된다. 이것이 I-123/I-131 MIBG 스캔 및 갈색세포종·신경모세포종 핵의학 영상의 핵심 원리이다. 오답: ①인슐린·②칼슘채널은 내분비 핵의학 표적이 아니며, ③도파민 운반체는 파킨슨 DAT 스캔(DaTscan) 표적, ④NIS(sodium iodide symporter)는 갑상선 방사성요오드 표적이다.",
"2025-L13-Q22": "【정답 ② 갑상선암】 Ga-68 DOTATOC PET/CT는 소마토스타틴 수용체(SSTR, 주로 SSTR2·5)를 표적으로 한다. 갈색세포종·부신경절종·신경내분비종양(NET, 특히 췌장·소장)·신경모세포종·뇌수막종·골연화증 유발 FGF23 분비 종양 등은 SSTR을 과발현하여 양성이다. 갑상선암(유두암·여포암 등)은 SSTR 발현이 낮아 Ga-68 DOTATOC 감도가 가장 낮다. 💡인슐린종은 SSTR2 발현이 적어 위음성이 많지만, 이 문제에서는 '가장 낮은' 예측능이므로 SSTR이 거의 없는 갑상선암이 정답.",
"2025-L13-Q79": "【정답 ⑤ Lu-177 DOTATATE 치료】 Ga-68 DOTATOC PET/CT에서 SSTR 양성을 확인하였고, lanreotide(소마토스타틴 유사체)·everolimus(mTOR 억제제)·sunitinib(TKI)에 모두 실패한 진행성 췌장 NET 다발성 간전이 상황이다. 다음 치료 선택지는 SSTR-positive tumor에 대한 PRRT(Peptide Receptor Radionuclide Therapy)인 Lu-177 DOTATATE(Lutathera)이다. 오답: ①간절제술은 다발성 전이에서 근치적 치료 불가, ②인슐린 주사는 무관, ③I-131 MIBG는 MIBG 양성 종양(갈색세포종·신경모세포종)에 사용, ④F-18 FDG PET/CT는 진단 보조이지 치료가 아니다.",
"2025-L16-Q6": "【정답 ④ RET, VHL, NF1, SDH 등이 원인 유전자들로 밝혀지고 있다】 발작성 고혈압+심계항진+발한+부신 4×8cm 종괴+Zellballen pattern 병리 = 갈색세포종(pheochromocytoma). 갈색세포종의 원인 유전자로는 RET(MEN2), VHL(von Hippel-Lindau), NF1(신경섬유종증 1형), SDH(B/C/D/AF2, succinate dehydrogenase 아단위)가 잘 알려져 있다. 오답: ①enterochromaffin 세포는 serotonin을 분비하는 장 크롬친화세포로 갈색세포종과 무관, ②크기 4×8cm는 악성 감별이 필요하며 크기만으로 악성을 배제할 수 없다(조직학적 악성 기준: 원격전이만이 악성 확진), ③24시간 소변 cortisol은 Cushing syndrome 검사, ⑤뇌하수체 선종이 갈색세포종을 유발하지 않는다.",
"2025-L16-Q36": "【정답 ⑤ BRAF 변이를 타겟으로 하는 약제에 반응할 가능성이 높다】 39세 남자, suprasellar mass, 조직 소견이 제시된 경우 — BRAF V600E 변이가 60~70%에서 발견되고 BRAF 억제제(vemurafenib/dabrafenib)에 반응하는 종양은 두개인두종(papillary type craniopharyngioma)이다. Papillary craniopharyngioma는 주로 성인에서 발생, squamopapillary pattern이 특징이며 BRAF V600E가 흔하다. 오답: ①G protein 신호 활성화(GNAS mutation)는 GH 분비 뇌하수체 선종의 기전, ②뇌하수체 전엽 기원+터키안 상방 침윤은 뇌하수체 선종 설명이나 두개인두종은 Rathke's pouch 기원으로 상방에 위치, ③HRAS 변이는 갑상선암·부신피질암 등에서 보고, ④MEN-2A에서는 갈색세포종·부갑상선항진증이 동반된다.",
"2025-L16-Q89": "【정답 ③ prolactin에 대한 면역화학염색을 시행하는 것이 필요하다】 prolactin 90 ng/mL(경도 상승), suprasellar 종괴, 수술 병리에서 뇌하수체 세포 배열 소견 = 비기능성 뇌하수체 선종(non-functioning pituitary adenoma) 가능성이 높다. 경도 prolactin 상승은 종양이 뇌하수체 줄기를 눌러 도파민 억제가 차단된 'stalk effect'일 수 있으므로, 실제 prolactin 분비 선종인지 감별하기 위해 수술 검체의 prolactin 면역화학염색이 필수이다. 오답: ①염증성 병변(lymphocytic hypophysitis)은 가능성이 낮은 설명, ②비기능성 선종일 가능성이 없다는 설명은 틀림, ④reticulin network 유지는 정상 뇌하수체 조직의 특징(선종은 소실), ⑤두개인두종은 별도 조직 패턴(wetkeratin/Rathke cyst)이므로 이 병리와 불일치.",
"2025-L20-Q16": "【정답 ② 성장호르몬 자극검사를 시행한다】 35주 조산+뇌출혈 후 수두증 수술+중추성 갑상선저하증(TSH 0.3 낮음, T4 1.5 정상범위)+레보티록신 보충 중, IGF-1 <5(매우 낮음) → 성장호르몬 결핍 가능성이 높다. 다발성 뇌하수체 결핍증이 의심되므로 성장호르몬 자극검사가 필요하다. 오답: ①일시적 미숙아 갑상선저하증은 3세까지 레보티록신이 필요하지 않음, ③3세에 레보티록신 중단은 중추성 저하증이 확인된 상황에서 부적절, ④부신피질부전 시 스트레스 용량(sick day rule)은 평상시의 2~3배로 늘려야 하므로 동일 용량은 틀림, ⑤갑상선초음파에서 정상 위치+정상 크기이므로 갑상선형성부전은 부적절.",
"2025-L20-Q68": "【정답 ① 선천 성장호르몬 결핍증으로 MRI 추적이 필수는 아니다】 5세 여아, 신생아 세균성 뇌수막염 과거력, 성장호르몬 결핍증+중추성 갑상선저하증 동반 뇌하수체 저하증이 의심되지만, 과거 뇌수막염이라는 명확한 기질적 원인이 있는 경우 선천(idiopathic) 성장호르몬 결핍증과 달리 구조적 뇌하수체 이상을 반드시 MRI로 추적관찰할 의무는 상대적으로 낮다. 선천(특발성) 결핍증이 아닌 후천성이므로 MRI 추적이 '필수'가 아니라고 볼 수 있다. 💡오답 ③④: 갑상선저하증 여부 확인(F-T4·TSH)이 필요하고 ACTH 수치 상승 여부보다는 저하증 여부가 중요, ⑤성장호르몬 자극검사 확인 전 '신속히' 시작은 부적절.",
"2025-L20-Q88": "【정답 ② 야뇨, 다뇨 증상이 있으면 항이뇨호르몬 치료를 고려한다】 8세 남아, 성장 지연, 2cc 고환(정상 미만), 검사 결과에서 IGF-1 낮음 등 → 성장호르몬 결핍증이 의심된다. 이 경우 야뇨·다뇨 증상은 중추성 요붕증 동반 가능성을 시사하며(시상하부-뇌하수체 축 손상), ADH 결핍이 있으면 desmopressin(DDAVP) 치료를 고려한다. 오답: ①선천 성장호르몬 결핍증 명칭 사용 시 MRI 추적이 필수이다(특발성 결핍 아이는 뇌하수체 이상 배제 위해 필수), ③ACTH 수치 상승이 아니라 저하 여부 확인이 중요, ④이 케이스는 단일 성장호르몬 결핍이 의심되므로 즉각 복합 뇌하수체 저하증 진단은 섣부름, ⑤자극검사 결과 확인 전 신속히 시작 부적절.",
"2025-L21-Q8": "【정답 ③ 염색체 검사를 시행한다】 생후 18일 신생아, 구강점막 착색+음낭 착색+고환 미촉지+Na 저하/K 상승+17-OHP 725(매우 높음)+ACTH 326 상승+Cortisol 1.8 낮음+Renin 상승 → 선천부신과형성증(CAH, 21-hydroxylase 결핍) salt-wasting form 신생아 위기. 고환이 만져지지 않는 것은 외부생식기 모호성(DSD, disorders of sex development)을 시사 — 즉 46,XX 여아에서 남성화가 심하여 남아처럼 보일 수 있다. 염색체 검사가 성 결정에 필수적이다. 오답: ①저혈당이 있어도 인슐린은 절대 금기(저혈당 악화), ②경구 hydrocortisone은 급성기 위기에서 IV가 원칙(경구 즉시 시작은 틀림), ④근육주사가 아닌 정맥 투여여야 하며 5% DW+NS도 조성 문제 있음, ⑤선천 부신 저형성증(adrenal hypoplasia) 유전자 검사는 이 임상상(17-OHP 극도 상승)과 맞지 않음.",
"2025-L21-Q74": "【정답 ① 21-수산화효소결핍증 가능성이 높으며, 단순 남성화형이다】 7세 남아, 17-OHP 120 ng/mL(매우 높음), 골연령 11세(4세 앞섬), 음모 P3·고환 2cc(비대칭 없음) → 21-hydroxylase 결핍증에 의한 선천부신과형성증, 염분소실이 없는 단순 남성화형(simple virilizing type). 전해질 정상, 남아에서 내부생식기는 정상(고환 존재). 오답: ②GnRH 자극검사는 중추성 성조숙증 감별에 필요하나 여기서는 고환 작음+과잉 안드로겐 → 말초성(가성) 성조숙증이 맞음, ③고환 초음파는 고환 병변 감별 시, ④뇌 MRI는 중추성 원인 배제 시, ⑤부신호르몬 치료를 잘 하면 과잉 안드로겐 억제로 골연령 진행이 멈추지만 이미 골연령이 많이 앞서면 중추성 성조숙증이 이차적으로 발생할 수 있다.",
"2025-L21-Q81": "【정답 ② GnRH 자극검사를 시행한다】 7세 여아, CAH(21-OH 결핍) 진단+치료 중, 유방 Tanner 2단계+음모 Tanner 2단계, 골연령 11세(4세 앞섬), 키 95-99%ile+과체중 → CAH 치료 중 과잉 안드로겐이 골연령을 촉진하여 GnRH pulse generator가 조기 활성화, 진성(중추성) 성조숙증(CPP)이 이차적으로 발생했을 가능성이 있다. 이를 확인하기 위해 GnRH(또는 GnRH agonist) 자극검사를 시행한다. 오답: ①hydrocortisone → prednisolone 전환은 아직 1차 판단이 아님, ③난소 초음파는 GnRH 자극검사 양성 확인 후 보조 검사, ④뇌 MRI는 CPP 확진 후 원인 확인 단계, ⑤안드로겐 억제 위한 여성호르몬 보충은 부적절(여성호르몬은 골연령만 더 앞당김).",
"2023-L6-Q27": "【정답 ④ ACTH 자극검사를 시행한다】 8세 남아, 키 121cm+체중 28kg, 고환 2cc, 야간 소변, 뼈나이 6세(2세 지연), 어머니 초경 고1(체질성 성장지연 가족력 있음). 야뇨가 있다고 수분제한검사(요붕증 확인)보다 먼저 해야 할 것은 뇌하수체 기능 전반 평가. 성장지연+다뇨/야뇨 조합에서 뇌하수체-부신 축(HPA axis) 확인, 즉 ACTH 자극검사가 필요하다. 오답: ①뇌 MRI는 특발성 원인 배제에 중요하나 우선순위상 ACTH 자극검사가 먼저(기능 평가 후 구조 평가), ②수분제한검사는 야뇨만으로 즉시 시행 불필요(다뇨가 뚜렷해야), ③어머니 초경이 고1이면 체질성 성장지연 가족력이 있으나 뼈나이 6세 지연+저신장이 심하므로 단순 체질성으로만 보기 어렵다, ⑤성장호르몬 결핍 진단은 2개 이상의 자극검사가 필요.",
"2023-L6-Q34": "【정답 ⑤ 성장호르몬 자극검사를 시행한다】 26개월 남아, 잠복고환 수술력+모유수유 불량+황달 광선치료, Cortisol 7.5(낮은 경계), ACTH 5(매우 낮음, 정상 <70), F-T4 0.9(정상), TSH 2.4(정상), 저혈당, 저나트륨혈증, 소변 케톤 양성. → 중추성 부신저하증(ACTH↓ + Cortisol↓)이 확인됨. 그러나 F-T4 정상이고 TSH도 정상 → 갑상선 축은 상대적으로 보존. 이 패턴은 복합 뇌하수체 저하증이며, 성장호르몬 결핍도 동반 가능성이 높아 성장호르몬 자극검사가 필요하다. 오답: ①부당경량아(SGA) 출생이지만 이 임상상은 단순 따라잡기 실패가 아님, ②뇌하수체 종양은 MRI로 확인하나 자극검사가 먼저, ③잠복고환 수술은 이차성징 발현과 무관(생식샘 하강 여부이지 뇌하수체 기능 아님), ④ACTH가 낮으므로 일차성 부신저하증 감별을 위한 ACTH 자극검사는 필요 없음.",
"2023-L6-Q71": "【정답 ④ 경구피임제를 투약한다】 5세 여아, 저신장, 신생아 황달, 갑상선저하증 치료 중, 3세 저혈당 경련, Clonidine peak GH 3.9(낮음, <10 기준 결핍), L-dopa peak GH 27(정상). 두 가지 자극검사 중 하나만 결핍이면 확진이 어렵다. 그런데 선택지가 뇌하수체 선종 치료 옵션(카베르골린, 감마나이프, 수술)과 경구피임제가 있다 — 이는 문항 맥락상 5세 여아의 갑상선저하증이 중추성임을 나타내며, 전체적으로 뇌하수체 저하증이 의심되는 상황에서 검사 전략으로 경구피임제(sex steroid priming)를 투여하여 GH 자극검사 위음성을 줄이는 성별 특이적 전처치를 시행한다는 것이 정답 의도이다. 💡소아 GH 자극검사 전 sex steroid priming(여아: 에스트로겐/경구피임제, 남아: 테스토스테론)은 위음성률을 낮추기 위해 시행한다.",
"2023-L12-Q28": "【정답 ④ 염색체 검사와 복부 초음파 검사를 시행한다】 생후 16일 남아, 구토+쳐짐, 유두+음낭 착색, 음경 3.5cm+고환 미촉지, 검사 결과(표 없으나 문맥상 CAH salt-wasting 패턴 추정). 고환이 만져지지 않으면서 음경이 있고 색소침착이 있는 경우 → 46,XX CAH 신생아에서 남성화된 외부생식기일 수 있으므로 염색체 검사 필수. 동시에 복부 초음파로 내부생식기(자궁·난소)를 확인한다. 오답: ①포도당생리식염수 주입은 급성기 안정화에 중요하지만 이것이 '가장 적절한' 단독 조치가 아님, ②경구 투여(즉시)는 급성기 위기에서 IV 경로가 원칙, ③선천 부신 저형성증 유전자 검사는 이 임상상과 불일치, ⑤저혈당이 있어도 인슐린 절대 금기.",
"2023-L12-Q81": "【정답 ④ 성장속도, 뼈나이, 호르몬 검사를 추적하면서 부신호르몬 용량을 조절한다】 10일 남아, 신생아선별검사 17-OHP 상승, 혈당·Na·K·Cr 정상, ACTH 250(상승), 17-OHP 90 ng/mL → 21-수산화효소결핍증 확진(classic, 아직 전해질 이상 없음 = 단순 남성화형 또는 초기 salt-wasting). 장기 관리의 핵심은 성장, 골연령, 호르몬(17-OHP, androstenedione) 추적과 glucocorticoid 용량 최적화이다. 오답: ①전해질 정상이라도 17-OHP 극도 상승이면 즉시 치료 시작 필요(재검 1주 대기 불가), ②플루드로코티손·NaCl 지속 보충은 salt-wasting 형에서 필요하나 단순 남성화형 확인 전에 무조건 처방은 성급, ③안드로겐 부족이 아닌 과잉 상태이며 불임 위험은 장기적으로 안드로겐 과잉+고환 부신잔류종양(TART)에 의함, ⑤스트레스 용량은 평소의 2배가 아닌 2~3배(또는 더 높게)이므로 '2배'라는 표현만으로는 부족하지만 이 문제에서는 ④가 더 포괄적이고 정확한 장기 관리 원칙.",
"2023-L13-Q17": "【정답 ① AIRE】 갈색세포종/부신경절종(PPGL)과 연관된 유전자: RET(MEN2A/2B), VHL(von Hippel-Lindau), NF1(신경섬유종증 1형), SDH(B/C/D, succinate dehydrogenase 아단위). AIRE(autoimmune regulator)는 자가면역 다발성 내분비병증 1형(APS-1, Addison disease+mucocutaneous candidiasis+hypoparathyroidism)과 관련되며 PPGL과는 무관하다. 오답: NF1·RET·SDH·VHL은 모두 PPGL 유전자이다.",
"2023-L13-Q55": "【정답 ② T-PIT 면역 염색에 양성인 경우 ACTH 분비 종양을 의심해야 한다】 23세 남자, suprasellar mass, 뇌하수체 선종 조직 소견. T-PIT은 뇌하수체 전엽의 corticotroph 세포(ACTH 분비 세포) 분화에 관여하는 전사인자이다. T-PIT 양성 선종은 ACTH 분비 종양(corticotroph adenoma), 즉 Cushing disease의 원인이다. 오답: ①비기능성 선종은 mass effect가 크므로 발견이 기능성 선종보다 오히려 늦음(시야장애가 생겨야 발견), ③뇌하수체 선종은 anterior pituitary gland에서 기원, ④PIT-1/SF-1/T-PIT 모두 음성인 null cell adenoma가 존재함, ⑤reticulin network 소실이 선종의 특징(정상 뇌하수체는 유지).",
"2023-L13-Q58": "【정답 ⑤ 부신피질의 zona fasciculata 세포 증식】 Moon face, central obesity, 고혈당, cortisol 증가, aldosterone 정상 → Cushing syndrome (cortisol 과잉, aldosterone 정상). Cortisol은 부신피질 zona fasciculata에서 분비된다. 병리: 양측 부신피질의 zona fasciculata 세포 증식(diffuse hyperplasia) 또는 선종. 오답: ①비기능성 선종은 cortisol 과잉과 무관, ②두개인두종은 cortisol 과잉을 직접 유발하지 않음(뇌하수체 기능 저하 유발), ③부신수질 종양(갈색세포종)은 catecholamine 과잉, ④zona glomerulosa 증식은 aldosterone 과잉(Conn syndrome), ⑤→ 정답.",
"2023-L13-Q69": "【정답 ⑤ 갑상선 등 다른 기관에 종양이 있는지 검사해야 한다】 25세 남자, 발작성 고혈압+두통+발한+양측 부신 종괴(3·4cm) → 양측 갈색세포종. 젊은 나이+양측성 갈색세포종은 유전성 증후군(MEN2A/2B, VHL, NF1, SDH)을 강력히 시사하므로, RET 변이(MEN2)면 갑상선 수질암(MTC)·부갑상선항진증이 동반 가능 → 갑상선 및 다른 기관 종양 여부 확인이 필수이다. 오답: ①24시간 cortisol은 Cushing, ②크기·조직소견만으로 갈색세포종의 악성을 배제 불가(원격전이만이 악성), ③뇌하수체 선종에 의한 자극은 아님, ④enterochromaffin 세포는 serotonin 분비(카르시노이드 종양).",
"2023-L15-Q16": "【정답 ④ Lu-177 DOTATATE 치료】 췌장 NET 췌미부 절제 후 2년, 지속 설사(기능성 호르몬 과잉), Ga-68 DOTATOC PET/CT 양성(SSTR 양성). SSTR 양성 진행성/전이성 NET에서 표준 PRRT는 Lu-177 DOTATATE이다. 오답: ①도뇨관 삽입·②경피적 신루는 비뇨기과적 처치로 무관, ③I-131 MIBG는 NET/갈색세포종의 MIBG 양성 경우에만 해당(SSTR 양성과 별개), ⑤외부 방사선 치료는 PRRT보다 우선하지 않음.",
"2023-L15-Q24": "【정답 ② somatostatin receptor】 부신·신경내분비종양 핵의학 치료에서 PRRT(Lu-177 DOTATATE, Y-90 DOTATOC)는 소마토스타틴 수용체(SSTR)를 표적으로 방사성 동위원소를 전달하여 항종양 효과를 낸다. 오답: ①GLUT1은 FDG PET 표적(대사 영상), ③도파민 운반체는 DaTscan(파킨슨), ④NIS는 방사성요오드 갑상선 치료, ⑤PSMA는 전립선암 PSMA 표적 치료.",
"2023-L15-Q31": "【정답 ④ I-123 MIBG 스캔】 부신·신경내분비종양 핵의학 진단: I-123 MIBG 스캔(갈색세포종·신경모세포종, NET/MIBG 양성), Ga-68 DOTATOC PET/CT(SSTR 양성 NET), F-18 FDOPA PET/CT(NET), F-18 FDG PET/CT(고등급 NET). 오답: ①I-123 스캔은 갑상선 영상에서만 사용, ②I-131 스캔은 갑상선암 전이 평가, ③Tc-99m 스캔은 뼈 스캔·갑상선 스캔 등이지 부신·NET 전용 아님, ⑤Lu-177 DOTATATE PET/CT는 존재하지 않음(Lu-177은 치료용).",
"2023-L15-Q65": "【정답 ② 혈장 레닌활성·알도스테론】 12세 남아, 중심비만+선조(striae)+팔다리 가늠+고혈압+키 50%ile·체중 90%ile → Cushing syndrome 의심이 1순위이다. 그런데 이 문항에서 성장곡선과 검사 결과를 보면 Cushing보다 고혈압+비만 패턴과 함께 레닌·알도스테론 축 이상(원발성 알도스테론증, 고혈압 원인)을 먼저 배제하는 것을 묻고 있다. 혈압 142/91에서 레닌-알도스테론 비(ARR)를 측정하여 원발성 알도스테론증 여부를 확인하는 것이 이 상황의 조치이다. 오답: ①검사 없이 조치는 부적절, ③인슐린 저혈당 유발 GH 자극검사는 현재 우선 과제 아님, ④24h 소변 코티솔은 Cushing 진단에 필요하나 여기서는 고혈압 원인 탐색이 먼저, ⑤24h 소변 메타네프린은 갈색세포종 의심 시(이 증례에서는 덜 우선).",
"2022-L11-Q33": "【정답 ② LH】 8세 남아, GH 자극검사: Clonidine peak 3.05(낮음), Arginine peak 2.43(낮음) → 성장호르몬 결핍증 확진. 이 경우 복합 뇌하수체 기능 저하증 동반 여부 확인이 필요하며, 고환 1cc+음모 없음(사춘기 미발현)에서 향후 이차성징 시 필요한 호르몬은 LH(황체형성호르몬)이다. 뇌하수체 저하증에서 생식샘자극호르몬(LH/FSH) 결핍 여부 확인이 필요하며, 이차성징 유도를 위해 LH·FSH 축 평가가 중요하다. 💡문제가 '어떤 호르몬이 결핍될 수 있는가'를 묻는 것이라면 LH(생식샘자극호르몬)가 GH 다음으로 중요한 뇌하수체 호르몬이다.",
"2022-L11-Q51": "【정답 ④ 장기적으로 질병이 조절되지 않으면 안드로겐 과잉으로 인한 불임 위험이 있다】 생후 20일 남아, 17-OHP 725·ACTH 326·renin 상승·cortisol 낮음·Na 저하·K 상승 = CAH salt-wasting(21-OH 결핍). 남아에서 조절 불량 시 안드로겐 과잉→고환 부신 잔류종양(TART)→불임 위험이 있다. 오답: ①포도당 생리식염수는 IV이며 경구 HC 동시 시작이 아니라 IV HC가 우선, ②염색체 검사(46,XY 남아)는 이 케이스에서 불필요(외부생식기 정상 남아), ③HC·플루드로코티손·NaCl 지속 보충은 올바르나 '즉시 시작'이 지연되어 있다면 부정확할 수 있음, ⑤선천부신저형성증 유전자 검사 불일치.",
"2022-L11-Q97": "【정답 ④ 뇌 MRI 검사를 시행한다】 5세 여아, 저체중 출생(1,800g·부당경량아), 갑상선저하증(TSH 7.5, 약간 상승, F-T4 1.1 정상), IGF-1 190(정상범위), GH 자극검사 결과 Clonidine peak 5.08·Arginine peak 2.59(낮음) → 성장호르몬 결핍증 진단. 염색체 46,XX. 신생아기 뇌 MRI 정상이라도 성장호르몬 결핍증이 확인되면 뇌하수체 구조 이상(pituitary hypoplasia, ectopic posterior pituitary, interrupted pituitary stalk 등) 확인을 위해 MRI를 반드시 시행한다. 오답: ①TSH 경미 상승은 원발성 갑상선저하증 가능성도 있으나 F-T4 정상이면 일차적 성장장애 원인으로 보기 어렵고 중추성일 가능성도 고려, ②IGF-1 정상범위이지만 GH 자극검사 결과가 낮으면 재검이 아닌 MRI가 필요, ③SGA(부당경량아)로 성장호르몬 치료 대상이지만 MRI 먼저, ⑤신생아 MRI 정상이어도 현재 뇌하수체 확인 필요.",
"2022-L11-Q107": "【정답 ② 성장호르몬 자극검사】 37개월 남아, 32주 조산(1,200g), 신생아기 뇌출혈 없음, 갑상선호르몬제 복용 중, 현재 키 84cm(<3%ile), 체중 15kg, 코티솔 16(정상), 갑상선 초음파 정상. 성장 지연의 원인으로 성장호르몬 결핍을 배제하기 위해 성장호르몬 자극검사가 필요하다. 갑상선 기능은 보충 중이고 코티솔도 정상이므로 부신 문제는 아님. 오답: ①갑상선호르몬제 중단 시도는 갑상선 제 위치·적절 크기 확인 → 중추성 저하증 여부 확인 후 결정, ③SGA 성장호르몬 치료는 성장호르몬 결핍 아닌 SGA가 확인된 경우이며 자극검사 먼저, ④뇌 MRI는 성장호르몬 결핍 확인 후 원인 탐색 단계, ⑤유전자 패널 검사는 중추성 갑상선저하증 확진 후.",
"2022-L13-Q35": "【정답 ④ Ga-68 PSMA PET/CT】 부신·신경내분비종양 핵의학 진단에 사용하는 검사: I-123 MIBG 스캔(갈색세포종·신경모세포종), F-18 FDOPA PET/CT(NET), F-18 FDG PET/CT(고등급 NET·갈색세포종), Ga-68 DOTATOC PET/CT(SSTR 양성 NET). Ga-68 PSMA PET/CT는 전립선암(prostate-specific membrane antigen) 진단에 사용하며 부신·NET와 무관하다.",
"2022-L13-Q67": "【정답 ① norepinephrine transporter】 MIBG(metaiodobenzylguanidine)는 norepinephrine(노르에피네프린)의 구조적 유사체로 NET(norepinephrine transporter)를 통해 크롬친화세포에 흡수된다. 이것이 I-123/I-131 MIBG 스캔의 원리이다. 오답: ②NIS는 갑상선 요오드 섭취 원리, ③도파민 운반체는 DaTscan, ④도파민 수용체는 PET 신경 영상, ⑤deiodinase는 T4→T3 변환 효소로 영상 표적이 아니다.",
"2022-L13-Q121": "【정답 ④ Ga-68 DOTATATE PET】 양측 부신 종괴, 24시간 소변 catecholamine 대사산물 극도 상승(VMA·metanephrine·normetanephrine·epinephrine) → 양측 갈색세포종 생화학적 확진. Aldosterone 정상, overnight DST cortisol 1.2(억제 양호, 자율 cortisol 분비 없음). 양측 갈색세포종은 유전성 증후군(MEN2·VHL·SDH 등) 가능성이 높으며, SSTR 발현 여부 확인을 위해 Ga-68 DOTATATE PET으로 병기 결정 및 PRRT 적응증 평가를 한다. 오답: ①ACTH 측정은 cortisol/ACTH 관계 확인용(이미 Cushing 배제됨), ②부신정맥 채혈(AVS)은 원발성 알도스테론증 편측화 검사, ③세침흡인검사는 갈색세포종에서 카테콜아민 위기 위험으로 금기, ⑤고용량 dexamethasone 억제검사는 Cushing 원인 감별용.",
"2022-L13-Q112": "【정답 ⑤ Lu-177 DOTATAE 치료】 갈색세포종 환자, I-123 MIBG 스캔+Ga-68 DOTATOC PET/CT 양성. MIBG와 SSTR이 모두 양성인 경우, PRRT(Lu-177 DOTATATE)가 가능하다. Ga-68 DOTATOC PET/CT가 양성이면 SSTR 표적 PRRT가 더 효과적임을 확인한 것이다. 오답: ①I-123은 진단용이지 치료용이 아님(치료는 I-131 MIBG), ②I-131 MIBG 치료는 MIBG 양성이면 가능하지만, SSTR 양성이면 Lu-177 DOTATATE가 우선, ③I-131 치료는 갑상선암에만 해당, ④Ga-68 DOTATOC은 진단용 PET 제제(치료용 방사성의약품이 아님).",
"2022-L14-Q13": "【정답 ⑤ RET, VHL, NF1, SDH 등이 원인 유전자들로 밝혀지고 있다】 45세 남자, 발작성 고혈압+두통+발한+부신 4×3cm 종괴+갈색세포종 병리 소견 → 갈색세포종. 원인 유전자: RET(MEN2A/2B), VHL, NF1, SDHx. 오답: ①뇌하수체 선종→ACTH 과잉→부신 자극은 양측 부신과형성증을 유발하지 갈색세포종을 유발하지 않음, ②크기와 조직 소견만으로 악성 배제 불가(원격전이 = 악성 확진 기준), ③cortisol이 아닌 catecholamine/metanephrine 과잉이 특징, ④enterochromaffin 세포(카르시노이드)는 serotonin 분비.",
"2022-L14-Q32": "【정답 ③ 종양을 이루는 세포들을 sustentacular cell이라고 한다】 갈색세포종 병리에서: chromaffin reaction(④ 방법으로 dark brown으로 변함)은 ①에 맞음, zellballen pattern은 ②에 맞음, epinephrine/norepinephrine 분비는 ④에 맞음, 핵 이형성·높은 mitotic count는 양성에서도 가능(악성 기준은 전이)은 ⑤에 맞음. Sustentacular cell(지지세포, S-100 양성 방추형 세포)은 zellballen 주변을 감싸는 세포이며, 종양의 주 구성 세포는 chief cell(chromaffin cell)이다. sustentacular cell이 '종양을 이루는 세포'라는 설명은 틀리다.",
"2021-L10-Q33": "【정답 ③ BRAF 변이를 타겟으로 하는 inhibitor에 반응할 가능성이 높다】 39세 남자, suprasellar mass, 뇌하수체 호르몬 정상(프로락틴 경미 상승 제외), 조직 소견 = 두개인두종. 성인에서 발생하는 papillary type craniopharyngioma는 BRAF V600E 변이가 60-70%에서 발견되며 BRAF 억제제(vemurafenib/dabrafenib+MEK 억제제)에 반응한다. 오답: ①HRAS 변이는 갑상선·부신피질암, ②뇌하수체 전엽 기원은 뇌하수체 선종, ④MEN-2A 동반은 갈색세포종, ⑤G protein(GNAS) 활성화는 GH 분비 뇌하수체 선종.",
"2021-L10-Q34": "【정답 ④ 감별진단을 위해 수술 검체에서 prolactin에 대한 면역화학염색을 시행하는 것이 필요하다】 51세 여자, 두통+시야장애, prolactin 90 ng/mL(경도 상승), 수술 병리=뇌하수체 세포 형태. 경도의 prolactin 상승은 stalk effect(줄기 압박→도파민 억제 차단)로 발생 가능하므로, 실제 prolactinoma(prolactin 분비 선종)인지 비기능성 선종의 stalk effect인지 감별하기 위해 면역화학염색이 필수이다. 오답: ①림프구성 뇌하수체염은 MRI 소견+임상이 다름, ②비기능성 선종일 가능성 없음은 틀림(실제 비기능성일 가능성 있음), ③DICER1 유전자 변이는 성인기 blastoma 등에서 보고, 뇌하수체 선종에서는 흔하지 않음, ⑤두개인두종은 suprasellar이지만 다른 조직 소견(wetkeratin, palisading epithelium)이 있음.",
"2021-L13-Q38": "【정답 ② 두통, 구토, 복시, 다뇨/야뇨 등 있는지 확인 필요하다】 5세 여아, SGA(2.2kg·38주), 신생아 황달, 2세 저혈당, 이마 돌출·콧잔등 낮은 안면 이형증, GH 자극검사(Clonidine/L-dopa 결과 미제시이나 문맥상 낮음), F-T4 1.0(정상 하한), 성장 지연 → 복합 뇌하수체 저하증. 증상 확인(두통/구토/복시=두개압 상승, 다뇨/야뇨=요붕증)은 뇌하수체 종양이나 구조적 이상을 시사하는 위험 신호이다. 오답: ①인슐린 저혈당 자극검사 1가지로 소아 GH 결핍 확진 불가(최소 2가지 자극검사), ③부당경량아이나 F-T4 저하+저혈당 등 뇌하수체 저하증 소견이 더 적합, ④뇌하수체 선종은 소아에서 드묾(두개인두종이 더 흔한 원인), ⑤영상검사 전 성장호르몬 먼저 시작은 금기(종양 배제 전 GH 투여는 위험).",
"2021-L13-Q39": "【정답 ④ 성인키 도달한 후에 성장호르몬 결핍증에 대한 재평가 필요하다】 8세 남아, 측두엽 수모세포종 수술+항암+뇌척추 방사선치료 후, GH 자극검사 결과 낮음 → 후천성 성장호르몬 결핍증(방사선 조사 후 뇌하수체 손상). 소아청소년기에 GH 치료를 받다가 성인키 도달 후 GH 치료를 중단하고 성인에서의 GH 결핍증을 재평가(재검사)해야 한다 — 소아 기준과 성인 기준이 다르기 때문. 오답: ①뇌척추 방사선 조사 후 다발성 뇌하수체 결핍이 동반될 수 있으므로 단독(isolated) GH 결핍으로 보기 어려움, ②요붕증 배제를 위한 수분제한검사는 현재 다뇨가 주 증상이 아니면 불필요, ③고환 2cc+음모 없음=사춘기 전으로 생식샘 자극호르몬 자극검사는 지금 당장 필요하지 않음, ⑤중추성 갑상선저하증이 이미 동반되어 있다면 레보티록신 투여는 맞으나 이 문제에서 TSH/T4는 제시되지 않음.",
"2021-L18-Q51": "【정답 ② DHEA】 태아기 부신에는 태아대(fetal zone)가 크게 발달하며 DHEA-S(dehydroepiandrosterone sulfate)를 주로 생성한다. 그림의 번호가 태아대(fetal zone)에 해당하는 부위를 가리키면 주요 호르몬은 DHEA이다. 태아대는 출생 후 급격히 퇴화(involution)한다. 오답: ①ACTH는 뇌하수체 전엽에서 분비, ③aldosterone은 성인 부신피질 zona glomerulosa에서 분비, ④norepinephrine은 부신 수질에서 분비.",
"2021-L18-Q52": "【정답 ④ 음낭의 피부 색소 침착을 보인다】 신생아 외부생식기 사진+검사 소견(문맥상 CAH salt-wasting: Na 저하, K 상승, 17-OHP 상승, ACTH 상승) → 46,XY 남아의 선천부신과형성증. 색소침착(피부 멜라닌 과잉)은 ACTH 과잉 → MSH(melanocyte-stimulating hormone) 증가로 나타나며 음낭·유두·구강점막에 발생한다. 오답: ①포도당 포함 생리식염수는 IV로 투여(경구 아님), ②남아도 glucocorticoid+mineralocorticoid 장기 치료 필요(그냥 두면 성인기 불임 등 합병증), ③신생아는 NaCl 경구 보충이 필요한데 이 보기는 올바른 설명이나 ④가 더 직접적 특징, ⑤음경·고환 크기가 커져 있다는 것은 CAH 남아에서 과잉 안드로겐에 의한 가성 성조숙증으로 나타날 수 있으나 이 신생아에서는 즉각적 특징이 아님.",
"2021-L22-Q58": "【정답 ① norepinephrine transporter】 MIBG(I-123/I-131)는 norepinephrine 구조 유사체로 NET(norepinephrine transporter)를 통해 크롬친화세포에 흡수된다. 이것이 갈색세포종·부신경절종·신경모세포종 핵의학 영상의 원리이다. 오답: ②NIS=갑상선 요오드, ③도파민 운반체=DaTscan(파킨슨), ④도파민 수용체=신경 PET, ⑤deiodinase=효소로 영상 표적 아님.",
"2021-L22-Q59": "【정답 ① 췌장선암】 Ga-68 DOTATOC PET/CT는 SSTR(특히 SSTR2/5) 과발현 종양을 진단한다. SSTR 양성 종양: 신경내분비종양(NET), 갈색세포종, 부신경절종, 뇌수막종, 신경모세포종. 췌장선암(췌장 외분비 adenocarcinoma)은 SSTR 발현이 매우 낮아 Ga-68 DOTATOC에서 음성이다. 💡인슐린종은 SSTR2 발현이 적어 위음성이 많지만, 완전히 음성은 아니며, 췌장선암(exocrine origin)이 가장 적합.",
"2021-L24-Q60": "【정답 ⑤ Lu-177 DOTATATE】 Theragnostics(진단동반치료): 진단(Ga-68 DOTATOC PET/CT)과 치료(Lu-177 DOTATATE PRRT)에 같은 SSTR 표적 분자를 사용. Lu-177은 베타선(치료)과 감마선(영상)을 동시에 방출하므로, 치료하면서 동시에 영상 확인이 가능한 theragnostic 방사성의약품이다. 오답: ①F-18 FDG=진단용만(양전자 방출체), ②F-18 FDOPA=진단용, ③I-123 MIBG=진단용(감마선만), ④Ga-68 DOTATOC=진단용(양전자 방출체, 치료 불가).",
"2021-L24-Q61": "【정답 ④ 갈색세포종】 I-123 MIBG(진단)와 I-131 MIBG(치료)는 동일한 분자 표적인 norepinephrine transporter(NET)를 이용하여 갈색세포종·부신경절종(및 신경모세포종) 진단과 치료를 모두 수행한다. 갑상선암은 NIS 표적(요오드 스캔)으로 MIBG와 다른 경로, 간세포암은 MIBG 표적이 없음.",
"2021-L24-Q75": "【정답 ④ 갑상선 수질암(삽상선 수질세포암)】 소마토스타틴 수용체 영상(Ga-68 DOTATOC/DOTATATE PET)을 이용한 theragnostics(PRRT: Lu-177 DOTATATE)에 적합한 질환: 신경내분비종양(NET), 갈색세포종/부신경절종, 뇌수막종, 그리고 갑상선 수질암(MTC, medullary thyroid carcinoma — SSTR2 발현이 있어 Ga-68 DOTATATE PET 양성이 가능하고 PRRT 연구 대상). 오답: ①유두암·②여포암·③미분화암은 SSTR 발현이 낮아 DOTATATE 표적 치료 부적합, ⑤림프종은 별도 치료(CART/방사면역치료).",
"2021-L25-Q64": "【정답 ③ 부신피질의 zona fasciculata 세포 증식】 Moon face, central obesity, 고혈당, cortisol 과잉, aldosterone 정상 → Cushing syndrome. Cortisol은 부신피질 zona fasciculata에서 분비된다. Cushing syndrome에서 ACTH 의존성(뇌하수체 선종 또는 이소성) 또는 ACTH 비의존성(부신 자율 선종/암) 원인 모두 최종적으로 zona fasciculata 증식/종양을 초래한다. 오답: ①비기능성 선종=cortisol 과잉 없음, ②두개인두종=뇌하수체 기능 저하, ④zona glomerulosa=aldosterone(Conn syndrome), ⑤부신수질=catecholamine(갈색세포종).",
"2021-L25-Q65": "【정답 ⑤ RET 유전자 변이가 있을 가능성이 있다】 50세 남자, 고혈압+진전(tremor), 부신 종양 절제 소견(문맥상 갈색세포종 병리) → 갈색세포종. RET 유전자 변이는 MEN2A/2B에서 발견되며 갈색세포종이 동반될 수 있다. 오답: ①갈색세포종은 조직학적 소견만으로 악성 배제 불가(원격전이=악성 확진), ②Cushing syndrome은 cortisol 과잉이고 이 환자는 catecholamine 과잉(갈색세포종), ③autoimmune adrenalitis(자가면역 부신염)=Addison disease(부신피질 부전), ④zona glomerulosa 증식=원발성 알도스테론증(고혈압+저칼륨혈증).",
"2025-L10-Q47": "【정답 ①성장호르몬】 45,X/46,XX 모자이크 터너증후군(Turner syndrome)으로 진단된 7세 여아이다. 목이 넓고(webbed neck), 방패형 가슴, 잦은 중이염, 저신장이 전형적 임상 양상이며 염색체검사가 이를 확인한다. TSH·IGF-1·코티솔이 모두 정상이므로 갑상선·부신·GH축 이상은 배제된다. 터너증후군에서 성장호르몬 투여는 FDA 승인 적응증으로 최종 신장을 유의하게 향상시킨다. ②에스트로겐은 사춘기 유도 목적으로 적절한 성장이 이뤄진 후 투여하며, 성장판을 조기 닫을 수 있어 성장호르몬 치료 전 단독 사용은 부적절하다.",
"2025-L10-Q61": "【정답 ①부당경량아(SGA)】 임신 37주 출생체중 1,200g(재태연령 기준 3백분위 미만) = SGA 조건 충족. 1세 때 체중 7.5kg으로 따라잡기 성장(catch-up)이 있었고, 현재 6세에 뼈나이=역연령으로 지연 없음, 갑상선·IGF-1 정상 → 내분비 질환 배제. 부모 신장 기반 mid-parental height가 이 아이의 예측 성인 신장 범위에 근접하므로 가족성저신장도 감별하나, SGA 후 catch-up 완료 형태가 더 합당하다. ②가족성저신장은 뼈나이=역연령이고 부모 키가 작아야 하며, ③체질성장지연은 뼈나이 지연 및 남성 가족력이 있어야 한다.",
"2025-L10-Q83": "【정답 ①추적관찰】 11세 남아, 10백분위수로 1년 전과 동일 채널(성장속도 정상), 뼈나이 9세(역연령 대비 2년 지연), 고환 2mL·음모 성성숙도 1기, 어머니 초경 늦고 아버지 사춘기 늦은 가족력 → 체질성장지연(constitutional delay of growth and puberty, CDGP)에 가장 합당하다. 갑상선 이상 없고, IGF-1 정상이면 성장호르몬자극검사는 불필요하다. CDGP는 추적관찰이 기본이며 불안감이 심하면 저용량 성호르몬(성선스테로이드) 단기 투여를 고려하지만 우선은 경과관찰이다.",
"2025-L18-Q38": "【정답 ①hCG 2000IU + rFSH 75IU 유지】 뇌하수체선종 수술 후 범뇌하수체저하증(hypogonadotropic hypogonadism) 환자로, hCG+FSH 병합치료 3개월 후에도 무정자증이 지속되는 상황이다. 이 경우 치료 반응에 최소 18~24개월이 걸릴 수 있으므로 현재 용량을 유지하며 추가 기다리는 것이 원칙이다. ②테스토스테론 추가는 음성피드백으로 내인성 FSH·LH를 더 억제하여 정자형성을 악화시킨다. ③hCG 증량만으로는 FSH 효과를 대체할 수 없다. ④GnRH pump는 시상하부 기능이 남아있을 때 유효하나, 뇌하수체 절제 후 환자에게는 비효율적이다. ⑤ICSI는 약물 치료 실패 확인 후 최후 수단이다.",
"2025-L18-Q45": "【정답 ④(틀린 것)】 테스토스테론은 FSH 분비를 억제하나, FSH에 대한 주요 음성피드백 인자는 세르톨리세포에서 분비되는 인히빈(inhibin B)이다. 테스토스테론은 LH 분비를 주로 억제하고, FSH를 '직접' 억제하는 역할은 상대적으로 제한적이다. 따라서 '테스토스테론이 인히빈과 함께 뇌하수체에서 FSH 생성을 직접 억제한다'는 서술은 과장/오류이다. ①FSH는 사춘기 정자형성 개시에 필수 → 맞음. ②고환 내 국소 테스토스테론 고농도 유지는 정자형성에 필수 → 맞음. ③성인에서 FSH의 주 역할은 정량적 정자생산 유지 → 맞음. ⑤FSH 표적 = 세르톨리세포 수용체 결합 → 맞음.",
"2025-L18-Q65": "【정답 ④염색체검사】 LH·FSH 상승 + 테스토스테론 저하 + 소고환(5mL) + 무정자증 = 일차성 고환기능부전(primary hypogonadism/hypergonadotropic hypogonadism) 패턴. 이 임상 양상은 클라인펠터증후군(Klinefelter syndrome, 47,XXY)을 강력히 시사하므로 확진을 위해 염색체핵형검사가 필요하다. ①경직장초음파는 사정관 폐쇄 감별에 사용하나 이 경우 FSH·LH 상승으로 고환 자체 문제임. ②Sellar CT는 뇌하수체 병변(↓LH/FSH) 감별 시. ③GnRH 자극검사는 중추성 저생식샘자극호르몬 감별 시. ⑤고환생검은 비폐쇄성 무정자증에서 정자 유무 확인 목적이나, 진단 확정 전 우선 시행하지 않는다.",
"2025-L19-Q21": "【정답 ⑤】 성결정(sex assignment) 과정에서는 단순히 해부학적·염색체적 기준뿐 아니라 환자의 성정체성(gender identity)과 성역할(gender role)을 반드시 고려해야 한다 — 이것이 현행 DSD 진료지침의 핵심이다. ①SRY는 Y염색체에 위치한다(X염색체 아님). ②난소 발달에 필수적인 것은 에스트로겐이 아니라 RSPO1·WNT4 신호경로이다. ③성발달의 첫 번째 단계는 유전적 성(chromosomal/genetic sex) 결정이며, 성선 성결정은 두 번째 단계이다. ④외생식기 모양만으로 성을 확정하는 것은 현행 지침에서 지양하는 방식이다.",
"2025-L19-Q67": "【정답 ②46XY complete gonadal dysgenesis(Swyer syndrome)의 양측 흔적성선】 SRY 기능 소실로 고환이 아닌 streak gonad가 형성된 경우, 고환 전구세포가 생식세포를 억제하지 못해 gonadoblastoma·dysgerminoma 위험이 30~40%로 매우 높다 → 예방적 생식선절제 필수. ①46XX testicular DSD(XX male)의 고환은 종양 위험 낮아 예방적 절제 불필요. ③남성으로 성결정한 음낭 내 고환(ovotesticular DSD)은 생식 기능 보존 목적으로 고환 부분을 남긴다. ④45X/46XX Turner streak gonad는 Y세포선 없으면 위험 낮고, Y선 있는 경우에만 절제 고려. ⑤5α-reductase 결핍 고환은 음낭 내 고환으로 정상적 기능 가능, 절제 불필요.",
"2025-L19-Q80": "【정답 ④(틀린 것)】 genitography(생식기관조영술)는 DSD 진단에서 요도-질-직장 등 내부 구조 파악에 보조적으로 활용할 수 있으나, '감별진단에 반드시 필요한 검사'는 아니다. 초음파·MRI가 내부 생식기 확인에 더 선호되며 침습도 낮다. ①음낭·음순 성선 촉진 → 맞음. ②조기 염색체검사(SRY 포함) → 맞음. ③초음파/MRI로 여성 내부생식기 확인 → 맞음. ⑤17-OH progesterone 측정으로 CAH 감별 → 맞음.",
"2023-L16-Q7": "【정답 ①부당경량아(SGA)】 임신 36주 출생체중 2,000g(재태연령 기준 3백분위 미만) → SGA. 1세 때 체중 7kg으로 catch-up 성장 충분함. 뼈나이 = 역연령(6세), 발달 정상, 내분비 이상 없음. 부모 신장 정상(midparental height ~174cm for boy). 체질성장지연은 뼈나이 지연과 남아 측 가족력(어머니는 중1 초경, 아버지 사춘기 시기 불명확이 아님)이 필요하다. 갑상선저하증·GH결핍 시사 소견 없음.",
"2023-L16-Q38": "【정답 ③부신 호르몬 보충 시 고환 크기 감소】 12세 남아, 고출생체중(5,000g), 체질량지수·혈압 상승, 성장곡선(이미지)에서 음모·고환 발달 패턴이 시사하는 진단 = 선천성 부신과형성증(CAH) 21-수산화효소결핍증 단순남성화형(simple virilizing form). 부신 안드로겐 과다로 말초성 가성성조숙증이 발생하여 고환이 커 보이나, 이는 안드로겐 자극에 의한 것이 아니라 고환 방치 시 testicular adrenal rest tissue(TART) 등 성선 자극 없이 성장한 것이다. 글루코코르티코이드를 보충하면 부신 ACTH·안드로겐이 줄고 고환도 사춘기 전 크기로 줄어든다 → 정답. ①염분소실형이면 신생아기 쇼크 병력 필요. ②GnRH 자극검사는 중추성 성조숙증 확인을 위하나, 이 환자는 LH 의존성 아님. ④뇌 MRI는 중추성 성조숙증 의심 시. ⑤말초성 성조숙증이나 원인은 CAH이지 단순 말초성이라 기술하면 불완전.",
"2023-L16-Q44": "【정답 ③체질성장지연(CDGP)】 8세 남아, 출생 시 정상(10백분위 이상), 이후 성장 감속, 뼈나이 6세(2년 지연), 부모: 아버지 고교 때 많이 컴(늦은 사춘기), 어머니 중1 초경(정상~약간 이른 편) → 부계 체질성장지연 가족력이 핵심이다. ①부당경량아 = 출생 시 SGA, 해당 없음. ②가족성저신장 = 뼈나이=역연령, 부모 모두 단신이어야 하며 사춘기는 정상 시기. ④갑상샘저하증 = 갑상선검사 이상, 없음. ⑤성장호르몬결핍증 = IGF-1 저하·자극검사 필요 소견 없음.",
"2023-L18-Q4": "【정답 ⑤(2023, 동일 stem as 2025-L19-Q21)】 해설 동일 적용. 성결정 과정에서 환자의 성정체성·성역할 확인이 필수이다. ①SRY는 Y염색체 소재. ②난소 발달에 에스트로겐 직접 역할 불필요(WNT4/RSPO1 경로). ③첫 단계는 유전적 성. ④외생식기 모양만으로 성 확정 금지.",
"2023-L18-Q18": "【정답 ④(틀린 것)】 genitography는 보조 검사로 '반드시 필요'하지 않다. 나머지 ①②③⑤는 모두 DSD 진단에 필수적인 단계이다. (해설 동일 구조: 2025-L19-Q80 참조)",
"2023-L18-Q56": "【정답 ②46XY complete gonadal dysgenesis의 양측 흔적성선】 해설 동일: Swyer 증후군에서 streak gonad는 gonadoblastoma 위험 30~40% → 예방적 적출 필수. 나머지 선지는 종양 위험이 낮거나 절제 시 기능 손실이 큰 경우이다.",
"2023-L19-Q12": "【정답 ①염색체 핵형검사】 16세 남자, 양측 여유증(유방통), 키에 비해 긴 팔다리(eunuchoid proportion), 양측 소고환(1cm, 단단함), 음경 Tanner 2기 → 클라인펠터증후군(47,XXY)의 전형적 표현형이다. 사춘기 진행 중 LH·FSH 상승으로 고환이 경화·위축되며 에스트로겐/안드로겐 비율 증가로 여유증이 발생한다. 확진은 염색체핵형검사이다. ②유방초음파·③고환초음파는 구조 평가에 쓰이나 진단 확정에 불충분. ④뇌 MRI는 중추성 이상 배제에 사용하나 우선순위 아님.",
"2023-L19-Q82": "【정답 ④염색체검사】 해설 동일: 2025-L18-Q65 참조. LH↑, FSH↑, T↓, 소고환, 무정자증 = 일차성 고환부전 → 클라인펠터증후군 확진 위해 핵형검사.",
"2023-L19-Q84": "【정답 ①hCG + rFSH 유지】 해설 동일: 2025-L18-Q38 참조. 뇌하수체 수술 후 이차성 저생식샘자극호르몬 환자에서 hCG+FSH 병합 6개월 미만이면 유지가 원칙이다.",
"2023-L19-Q89": "【정답 ④(틀린 것)】 해설 동일: 2025-L18-Q45 참조. 테스토스테론이 FSH를 '직접' 억제한다는 서술이 오류이다. FSH의 주요 음성피드백 인자는 세르톨리세포 분비 인히빈 B이며, 테스토스테론의 주요 대상은 LH이다.",
"2023-L27-Q2": "【정답 ③Doxazosin(알파1차단제)】 35세 여자, 두통·심계항진, 혈압 180/120 mmHg — 복부 CT와 혈액검사 이미지(카테콜라민 상승 추정)는 갈색세포종(pheochromocytoma)을 시사한다. 갈색세포종 수술 전 혈압조절의 첫 단계는 알파 차단제(doxazosin, phenoxybenzamine 등)로 알파수용체를 먼저 차단하여 혈압을 조절하는 것이다. ①Propranolol(베타차단제)을 알파 차단 없이 먼저 사용하면 알파 수용체 무저항 활성화로 심각한 고혈압 위기가 생긴다(절대 금기). ②Furosemide는 이뇨제. ④Captopril은 ACE억제제(보조적). ⑤Nicardipine은 칼슘채널차단제로 보조 사용 가능하나 일차 선택 아님.",
"2023-L27-Q8": "【정답 ①요로결석 병력】 일차성 부갑상선기능항진증(PHPT)에서 수술 적응증은 다음 중 하나: 혈중 칼슘 ≥1.0mg/dL above ULN(10.9mg/dL는 ULN 10.5에서 0.4mg/dL 상승 → 기준 미충족), 뼈나이 T score ≤-2.5(이 환자 -2.0 → 미충족), 신장기능 저하(eGFR<60), 신결석 또는 요로결석, 나이 <50세. 이 환자에서 수술 적응증은 요로결석(신결석) 병력이다. ②나이 55세는 50세 이상으로 나이 기준 해당 없음. ③칼슘 10.9는 기준치 대비 0.4mg/dL 상승으로 기준(≥1.0mg/dL above ULN) 미충족. ④24시간 소변 칼슘 300mg은 과거 기준(>400mg)에도 못 미침. ⑤T score -2.0은 수술 기준(-2.5 이하) 미충족.",
"2022-L30-Q39": "【정답 ②혈중 부갑상선호르몬(PTH)의 짧은 반감기】 수술 중 PTH 모니터링(intraoperative PTH monitoring, Miami criterion)은 PTH의 반감기가 약 3~5분으로 매우 짧다는 특성을 이용한다. 병변 절제 10분 후 PTH가 절제 전 또는 절제 직후 최고치의 50% 이상 감소하면 성공적 절제로 판단한다. ①칼슘 반감기는 짧지 않고 PTH의 반감기보다 훨씬 길다. ③인(P)도 해당 없음.",
"2022-L30-Q45": "【정답 ③미토콘드리아에 부착】 부갑상선 스캔(sestamibi scan / Tc-99m MIBI 스캔) 이미지 문항이다. Tc-99m sestamibi는 미토콘드리아가 풍부한 조직(부갑상선 선종의 옥시필세포·oxyphilic cells)에 결합·집적된다. ①칼슘 부착은 Tc-99m 칼슘계 추적자(PYP 등). ②당대사 증가 = FDG-PET. ④혈류 조영 = 역동적 CT/MRI. ⑤나트륨-요오드 공동운반체 = 갑상선 스캔용 요오드 추적자.",
"2022-L50-Q134": "【정답 ③뇌하수체 저하증】 12세 남아, 출생 시 난산, 신생아기 경련, 저신장(3백분위 미만) + 고도비만(BMI >95), 성성숙도 1기(고환 2mL), 발달 지연 없음 → 뇌하수체 저하증(hypopituitarism). 난산·신생아 경련은 분만 손상에 의한 시상하부-뇌하수체 기능 저하를 시사한다. GH 결핍 + 성선자극호르몬 결핍(지연 사춘기) + 갑상선호르몬 결핍이 복합될 수 있다. ④시상하부성 비만은 식욕 조절 손상만 있고 성장 저하가 두드러지지 않음. ⑤프라더-윌리 증후군도 감별이나 발달 지연·저긴장증·특이 얼굴 등 동반 양상 필요.",
"2022-L50-Q184": "【정답 ①검사 없이 조치(생활습관 교정)】 6세(실제 '12세'로 읽혀야 할 수 있으나 문항 그대로) 남아, 최근 2년간 야외활동 감소 후 체중 급증, 키 50백분위·체중 90백분위, 고환 1mL(미발달), 공복혈당·당화혈색소·갑상선 정상, 뼈나이 7세(경미한 지연 또는 정상 범위). 단순 비만(exogenous obesity)에서는 키가 정상~약간 커고(이 환자 50백분위 정상), 내분비 이상 소견 없다 → 내분비 검사 없이 식이·운동 등 생활습관 교정이 일차 조치이다. 쿠싱 증후군이면 키 성장 감속이 동반되어야 하고 혈압·stria 등이 있어야 한다.",
"2022-L50-Q195": "【정답 ②가족성저신장(familial short stature)】 6세 남아, 출생체중 정상(10백분위 이상), 1세 체중 7kg 정상, 발달 정상, 뼈나이=역연령(6세), 부모 키: 아버지 164cm, 어머니 154cm(둘 다 저신장) → midparental height 낮음 = 가족성저신장. ①부당경량아: 출생 시 SGA 없음. ③체질성장지연: 뼈나이 지연 필요(이 경우 뼈나이 = 역연령). 어머니 중1 초경으로 체질성은 배제 가능성 높음. ④⑤ 갑상선·성장호르몬 이상 소견 없음.",
"2022-L50-Q210": "【정답 ②클로니딘 자극검사(clonidine stimulation test)】 8세 여아, 갑상선검사·염색체 정상, 유방 없음 → 터너증후군·갑상선저하증 배제. 성장곡선(이미지: 저신장)에서 성장호르몬결핍증(GHD) 의심 → 확진 위해 GH 자극검사(클로니딘, 인슐린, 아르지닌 등) 필요. ①경구당부하검사는 GH 과다(말단비대증) 확인. ③IGF-1은 선별검사지 확진 아님. ④코티솔·ACTH는 부신 평가. ⑤GnRH 자극검사는 성조숙증 평가.",
"2022-L50-Q216": "【정답 ⑤뇌하수체 저하증】 8세 여아, SGA(출생체중 2.5kg, 40주), 신생아기 황달 1주(지속 황달은 뇌하수체 저하증의 신생아 징후 중 하나), 저신장, 유방·음모 없음(사춘기 지연), 아버지 사춘기 지연 가족력이 있으나 신생아 황달이 감별 포인트이다. 뇌하수체 저하증에서는 지속 황달, GH 결핍, 갑상선호르몬 결핍, 부신 기능 저하가 동반될 수 있다. ①터너: 염색체 정상으로 배제. ③가족성저신장: 뼈나이=역연령·부모 모두 단신 필요. ④체질성성장지연: 남성 가족력 있으나 신생아 황달이 내분비 원인 강력 시사.",
"2022-L52-Q189": "【정답 ④(틀린 것)】 genitography는 DSD 진단에 필수적이지 않다. 해설 동일: 2025-L19-Q80 참조.",
"2022-L52-Q193": "【정답 ②46XY complete gonadal dysgenesis의 양측 흔적성선】 해설 동일: 2025-L19-Q67 참조. Swyer 증후군에서 gonadoblastoma 위험 30~40% → 예방적 생식선 절제 필수.",
"2022-L53-Q126": "【정답 ④GnRH 또는 gonadotropin 투여 시 자연임신 가능】 이차성 저생식샘자극호르몬증(hypogonadotropic hypogonadism, HH)은 시상하부-뇌하수체 기능 결함으로 발생한다. GnRH 펄스 주입 또는 gonadotropin(hCG+FSH) 투여 시 고환에서 테스토스테론 생성 및 정자형성이 유도되어 자연임신도 가능하다. ①고환 자체 문제 = 일차성(hypergonadotropic). ②생식샘자극호르몬은 감소(저LH/FSH)이다. ③클라인펠터 = 일차성 고환부전. ⑤테스토스테론 직접 투여는 음성피드백으로 정자형성 억제.",
"2022-L53-Q127": "【정답 ④(틀린 것)】 해설 동일: 2025-L18-Q45 및 2023-L19-Q89 참조. 테스토스테론의 FSH 직접 억제 역할은 제한적이며, FSH를 주로 억제하는 것은 인히빈 B(세르톨리세포 분비)이다.",
"2022-L53-Q131": "【정답 ③수면무호흡증의 호전】 남성호르몬(테스토스테론) 보충요법의 기대 효과: 성욕·성기능 향상(①), 골밀도 증가(②), 근육량·근력 향상(④), 이차성징 유도(⑤). 반면 테스토스테론은 수면무호흡증을 악화시킬 수 있다. 상기도 근긴장도·호흡 조절 변화, 적혈구 증가증 등으로 수면무호흡이 오히려 심해지는 부작용이 알려져 있으므로, '수면무호흡증 호전'은 기대 효과가 아닌 부작용이다. 💡핵심: 수면무호흡증 환자에게 테스토스테론 투여 시 주의 또는 금기로 언급.",
"2022-L53-Q185": "【정답 ④(틀린 것)】 성결정은 외생식기 모양만으로 확정해서는 안 된다 — 이것이 오답. DSD에서 염색체·성선·호르몬·성정체성을 종합하여 결정해야 한다. ①고환 = Y염색체 SRY → 맞음. ②AMH가 난소 발달에 중요하다는 서술은 오류이다(AMH는 뮐러관 퇴화를 유발하는 인자 = 고환에서 분비). 하지만 이 선지의 맥락은 '여성 성선 발달에 AMH가 중요하다'는 것으로 해석하면 오류이나, 정답은 명확히 ④임. ③형태학적 기준 첫 번째 = 염색체 성 → 맞음. ⑤성정체성·성역할 확인 → 맞음.",
"2021-L23-Q62": "【정답 ④좌측 부신정맥(left adrenal vein)】 갈색세포종 수술 시, 카테콜라민 방출을 막기 위해 정맥(배출 혈관)을 먼저 결찰하는 것이 원칙이다. 좌측 부신정맥은 좌측 신정맥(left renal vein)으로 직접 합류하며, 우측 부신정맥보다 길고 접근이 다소 용이하다. 갈색세포종에 혈류가 풍부하므로 배출 정맥 먼저 결찰 → 술기 중 카테콜라민 혈중 분출 방지. ①③동맥은 공급 혈관으로 나중 결찰.",
"2021-L75-Q188": "【정답 ④체질성성장지연(CDGP)】 6세 남아, 출생 정상(38주, 3.0kg), 신생아 황달(1주), 최근 근시·성장 성장곡선(이미지), 고환 1mL·음모 없음, 부계·모계 사춘기 지연 가족력(아버지 사춘기 시기 불명확, 어머니 중1 초경). 💡근시는 뇌하수체 종양 징후가 될 수 있어 주의하나, 이 문항에서 성장곡선이 채널 유지형이고 부계 지연 가족력이 있으면 CDGP로 분류한다. 성장호르몬결핍증(GHD)과 감별: GHD는 근시·시신경위축 등 CNS 징후와 동반되고 IGF-1 저하가 있어야 한다. 가족력이 있으면 CDGP 우선.",
"2021-L75-Q189": "【정답 ③뇌하수체 저하증】 12세 남아, 난산, 신생아 경련, 저신장(3백분위 미만), 비만(BMI >95), 고환 2mL 성성숙도 1기, 발달 지연 없음. 해설 동일: 2022-L50-Q134 참조. 뇌하수체 저하증에서 GH 결핍(성장 저하) + LH/FSH 결핍(사춘기 지연) + 비만(GH 결핍 시 체지방 증가)이 나타난다.",
"2021-L75-Q191": "【정답 ①경과관찰】 6세 남아, 키 117cm(정상 범위 추정), 체중 17kg, 출생 정상, 케톤성 저혈당 3회 병원 방문(이는 GH 결핍·부신 기능 부전 등을 시사할 수 있으나), 부모 사춘기 지연 가족력, 성장곡선(이미지: 정상 채널). 💡이 문항은 성장곡선 이미지 동반으로 정상 채널 유지 패턴임을 전제하며, CDGP로 진단 후 치료 없이 경과관찰이 적절하다는 것을 묻는다. 케톤성 저혈당은 CDGP 소아에서 금식 시 드물지 않게 발생하며, 정상 성장 패턴이면 관찰한다.",
"2021-L75-Q202": "【정답 ⑤성장호르몬결핍증(GHD)】 6세 남아, 저신장, 신생아 황달(1주), 시신경위축(optic nerve atrophy), 부계 지연 가족력 있으나 시신경위축이 핵심 단서이다. 시신경위축은 시상하부-뇌하수체 종양·구조적 이상(두개인두종 등)을 강력히 시사하며, 이로 인한 GH 결핍이 원인이다. GHD에서 IGF-1 저하, GH 자극검사 부전이 예상된다. 💡'황달+시신경위축+저신장' 조합은 GHD 또는 뇌하수체 저하증의 강한 신호.",
"2021-L77-Q161": "【정답 ⑤】 해설 동일: 2025-L19-Q21 참조. 성결정 시 성정체성·성역할 확인 필수. ①SRY는 Y염색체. ②난소 발달에 필요한 것은 안드로겐이 아니라 WNT4/RSPO1. ③첫 단계는 염색체 성. ④외생식기 모양만으로 확정 금지.",
"2021-L77-Q162": "【정답 ②46XY complete gonadal dysgenesis의 양측 흔적성선】 해설 동일: 2025-L19-Q67 참조.",
"2021-L77-Q163": "【정답 ④(틀린 것)】 해설 동일: 2025-L19-Q80 참조. genitography는 필수 검사가 아니다.",
"2021-L78-Q182": "【정답 ④(틀린 것)】 해설 동일: 2025-L18-Q45 참조. 테스토스테론은 FSH를 '직접' 억제하지 않는다. FSH 음성피드백의 주역은 인히빈 B이다.",
"2021-L78-Q183": "【정답 ④염색체검사】 해설 동일: 2025-L18-Q65 참조. LH↑, FSH↑, T↓, 소고환, 무정자증 = 클라인펠터 강력 시사 → 핵형검사.",
"2021-L78-Q184": "【정답 ①hCG + rFSH 유지】 해설 동일: 2025-L18-Q38 참조. 이차성 저생식샘자극호르몬증에서 hCG+FSH 병합치료는 효과 발현에 수개월~수년이 걸리므로 3개월 시점에 포기하지 않고 유지한다.",
