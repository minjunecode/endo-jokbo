소견으로 가장 가능성이 높은 것은?","stem_table":null,"options":["뇌하수체의 비기능성 (non-functioning) 선종","터키안 상방 (suprasellar area)의 두개인두종 (craniopharyngioma)","부신피질 (adrenal cortex)의 zona fasciculata 부분의 세포 증식","부신피질 (adrenal cortex)의 zona glomerulosa 부분의 세포 증식","부신수질의 종양성 병변"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q64"},{"id":"2021-L25-Q65","year":2021,"qnum":65,"jokbo_lec_no":25,"lecture":"부신 질환의 병리","professor":"원재경","curr_lec_no":"15","curr_lecture":"뇌하수체,부신,다발성내분비종양의 병리","stem":"50세 남자 환자가 고혈압과 사지 진전 (tremor)를 주소로 내원하였다. 부신에 종양이 발견되어 절제하였고 아래와 같은 소견이었다. 다음 중 옳은 기술을 고르시오.","stem_table":null,"options":["이 종양의 조직학적 소견상 악성일 가능성은 배제할 수 있다.","이 환자는 Cushing syndrome일 가능성이 높다.","부신피질에 autoimmune adrenalitis 가능성이 있다.","부신피질 (adrenal cortex)에 zona glomerulosa 부분의 세포 증식이 있다.","RET 유전자 변이가 있을 가능성이 있다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q65_p136.png","note":null,"id_simple":"2021-Q65"},{"id":"2021-L26-Q104","year":2021,"qnum":104,"jokbo_lec_no":26,"lecture":"갑상선 생리와 기능조절","professor":"이가희","curr_lec_no":"40","curr_lecture":"갑상선 생리와 기능조절","stem":"다음 갑상선호르몬 합성 과정 중, 갑상선자극호르몬에 의하여 활성화되지만 항갑상선제 methimazole에 의해 억제되지 않는 것은?","stem_table":null,"options":["요오드의 섭취(transport)","요오드의 산화(oxidation)","요오드의 유기화(organification)","티로닌의 결합(coupling)","탈요오드화(deiodination)"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q104"},{"id":"2021-L27-Q6","year":2021,"qnum":6,"jokbo_lec_no":27,"lecture":"갑상선 기능저하증","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"52세 여자가 유방암 진단 후 PET-CT 검사(좌)에서 이상 소견을 발견하고 왔다. 초음파 검사(우)를 시행하였다. 다음으로 필요한 검사는?","stem_table":null,"options":["TSH","경부 CT 검사","후두내시경검사","미세침흡인검사","thyroperoxidase 항체"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q6_p137.png","note":null,"id_simple":"2021-Q6"},{"id":"2021-L27-Q67","year":2021,"qnum":67,"jokbo_lec_no":27,"lecture":"갑상선 기능저하증","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"36세 여자가 1개월 전부터 앞 목이 붓는다며 병원에 왔다. 3주 전부터 가슴이 두근거리고, 땀이 많이 난다고 하였다. 3개월 전에 3.5 kg 남아를 정상 분만하였으며 모유 수유는 하지 않는다고 하였다. 혈압 135/80 mmHg, 맥박 114회/분, 호흡 18회/분이다. 갑상샘은 전체적으로 크게 만져지며 압통은 없다. 검사 결과는 다음과 같다. 진단은?\n혈액 T3 312 ng/dL (참고치 77~13","stem_table":null,"options":["리델갑상샘염","그레이브스병","아급성갑상선염","하시모토갑상선염","일과성 갑상샘중독증을 동반한 만성갑상샘염"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q67"},{"id":"2021-L27-Q105","year":2021,"qnum":105,"jokbo_lec_no":27,"lecture":"갑상선 기능저하증","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"73세 여자가 평소 기운 없음, 만성 피로, 식욕 없음 등의 증상으로 집안에서만 지내던 중 의식이 저하되어 응급실에 왔다. 활력징후 상 저체온 상태를 보였고 맥박수는 분당 46회였다. 신체검진에서 심음은 작게 들렸다. 갑상선기능 저하증에 의한 의식저하 의심 하에 검사를 진행하였다. 다음 중 bedside에서 환자가 갑상선기능저하 상태인지 확인할 수 있는 검사소견은?","stem_table":null,"options":["항 TPOAb (+)","갑상선스캔 섭취율 감소","Basal metabolic rate 감소","Doppler 초음파검사 상 혈류 증가","Deep tendon reflex (DTR)의 relaxation time 증가"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q105"},{"id":"2021-L27-Q107","year":2021,"qnum":107,"jokbo_lec_no":27,"lecture":"갑상선 기능저하증","professor":"문재훈","curr_lec_no":"41","curr_lecture":"갑상선기능저하,갑상선염","stem":"27세 여자가 약 2개월 전부터 추위, 부종, 피로감 및 갑상선종을 주소로 내원하였다. 목 부위의 통증은 없었다. 환자는 6개월 전 출산하였으며, 3~4개월 전에는 현 주소와는 달리 발한, 더위, 심계항진의 증상이 있었으나, 당시에는 증상이 심하지 않아 병원에 가지 않았다고 하였다. 내원 후 시행한 갑상선기능검사 상 free T4 0.25 ng/dl (0.7~1.7 ng/dL), TSH 25.7 mIU/L (0.5~4.5 mIU/L) 결과였고 ESR 23 sec, 항마이크로솜 항체 양성이었다. 향후 치료에 대한 설명으로 옳은 것은?","stem_table":null,"options":["증상 조절을 위해 베타차단제를 갑상선호르몬제와 병용하여야 한다.","갑상선기능이 불안정하므로 방사성요오드 치료 후 갑상선호르몬제 투여를 고려한다.","갑상선기능저하증이므로 활성형 갑상선호르몬제인 T3 제제의 투여를 우선 고려한다.","갑상선호르몬제 투여가 필요하며 공복에 복용하는 것이 흡수에 유리하다.","향후 목 부위 통증이 일반적으로 동반되므로 소염제, 스테로이드 제제의 투여가 필요하다."],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q107"},{"id":"2021-L28-Q66","year":2021,"qnum":66,"jokbo_lec_no":28,"lecture":"갑상선 기능항진증","professor":"조선욱","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"30세 남자가 오른쪽 목에 덩이가 만져져서 왔다. 6개월 전부터 체중이 줄고 땀이 많이 났다고 한다. 앞목 부위에서 2.0cm의 덩이가 부드럽게 만져졌고 압통은 없으며 덩이는 잘 움직였다. 혈압 140/80 mmHg, 맥박 98회/분, 호흡 14회/분이다. 검사 결과이다. 다음 검사는?\nT3 280 ng/dL (참고치 77~13","stem_table":null,"options":["갑상샘초음파","갑상샘스캔","목 컴퓨터단층촬영","혈청 갑상샘글로불린","덩이 가는바늘흡인세포검사"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q66"},{"id":"2021-L28-Q68","year":2021,"qnum":68,"jokbo_lec_no":28,"lecture":"갑상선 기능항진증","professor":"조선욱","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"52세 여자가 2주 전부터 시작된 심계항진을 주소로 왔다. 손떨림과 loose stool이 동반되었으나, 체중 변화는 없었다. 갑상선은 경도로 커져 있었고, 압통은 없었으며, 결절은 만져지지 않았다. 안구 돌출은 없었다. 검사 결과이다. 감별진단은?\nTotal T3 378 (87~184 ng/dl), free T4 2.7 ng/dl (0.7~1.8 ng/dl), TSH <0.05 uU/ml (0.4~4.1 uI/ml), anti-TSH receptor antibody 37.5 (<1.22 IU/L), 99m-Tc thyroid scan : 20분 Tc-99m 섭취율 : 8.5% (1.7~4%)","stem_table":null,"options":["항 Tg 항체","항 TPO 항체","TRH 자극 검사","99mTc 갑상선스캔","T3 억제 갑상선스캔"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q68"},{"id":"2021-L28-Q106","year":2021,"qnum":106,"jokbo_lec_no":28,"lecture":"갑상선 기능항진증","professor":"조선욱","curr_lec_no":"42","curr_lecture":"갑상선기능항진증","stem":"47세 여자가 1주 전부터 발생한 목 부위 통증으로 내원하였다. 3주 전 감기증상 있었으며 심장이 두근거리며 더위를 못 참고 땀을 많이 흘리며 손떨림이 있다고 호소하였다. 통증은 목 부위부터 귀 뒤까지 나타났으며 신체검진에서 갑상선이 단단하게 만져지고 심한 압통이 있었다. 갑상선기능검사 상 free T4 3.20 ng/dl (0.7~1.7 ng/dL), TSH 0.01 mIU/L (0.5~4.5 mIU/L)의 소견 보였으며 ESR 120 sec, 항마이크로솜 항체는 음성이었다. 갑상선스캔 소견은 다음과 같다. 환자의 향후 치료에 대한 설명으로 옳은 것은?","stem_table":null,"options":["심한 통증이 지속되면 갑상선절제술을 고려해야한다.","방사성요오드 치료가 환자의 증상 경감에 효과적이다.","일시적 갑상선중독증이므로 베타차단제 투여로 증상을 조절한다.","항갑상선제 치료를 시작하되 약제로는 methimazole이 우선 고려된다.","향후 갑상선기능저하증이 발생할 수 있으므로 즉시 예방적인 levothyroxine 투여가 필요하다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q106_p138.png","note":null,"id_simple":"2021-Q106"},{"id":"2021-L29-Q81","year":2021,"qnum":81,"jokbo_lec_no":29,"lecture":"갑상선 결절 개요","professor":"박영주","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"35년간 만성 갑상선염(하시모토 갑상선염)에 동반된 갑상선기능저하증으로 갑상선호르몬 투여받던 환자가 갑자기 목 부위가 부어서 내원하였다. 검진상 갑상선 종대가 심해졌고 내원 직전 시행한 갑상선기능검사상 TSH 수치는 다음과 같았다.\nTSH 2.4 (정상 0.4~4.1 μIU/ml)\n이 환자에서 진단에 도움이 될 수 있는 다음 단계 검사로 가장 필요한 것은?","stem_table":null,"options":["Free T4 측정","Total T3 측정","갑상선미세침흡인세포검사","99m-technetium 갑상선스캔","갑상선조직생검"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q81"},{"id":"2021-L29-Q103","year":2021,"qnum":103,"jokbo_lec_no":29,"lecture":"갑상선 결절 개요","professor":"박영주","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"53세 여자 환자가 피곤함, 체중감소 등의 증상으로 동네병원에서 검사받은 결과 TSH <0.01 mU/L (정상 0.4-4.1 mU/L) 소견을 보여 내원하였다. 검진소견은 아래와 같다. 이 환자에서 보이는 갑상선중독증의 원인을 진단하는데 도움이 되는 검사는?","stem_table":null,"options":["항 Tg 항체","항 TPO 항체","TRH 자극 검사","99mTc 갑상선스캔","T3 억제 갑상선스캔"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q20_p135.png","note":null,"id_simple":"2021-Q103"},{"id":"2021-L30-Q69","year":2021,"qnum":69,"jokbo_lec_no":30,"lecture":"갑상선 결절의 핵의학 검사","professor":"천기정","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"갑상선기능항진증으로 시행한 갑상선스캔에서 섭취 감소가 보이는 경우는?","stem_table":null,"options":["Graves' disease","Toxic multinodular goiter","TSH pituitary adenoma","Trophoblastic tumor","Struma ovary"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q69"},{"id":"2021-L30-Q70","year":2021,"qnum":70,"jokbo_lec_no":30,"lecture":"갑상선 결절의 핵의학 검사","professor":"천기정","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"고칼슘혈증이 있는 환자에서 시행한 영상 소견이다. 사용한 방사성의약품은?","stem_table":null,"options":["Tc-99m pertechnetate","Tc-99m MIBI","I-123 MIBG","I-123 iodine","Ga-68 DOTATOC"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q70_p138.png","note":null,"id_simple":"2021-Q70"},{"id":"2021-L30-Q72","year":2021,"qnum":72,"jokbo_lec_no":30,"lecture":"갑상선 결절의 핵의학 검사","professor":"천기정","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"분화 갑상선암으로 수술 후 추적관찰 중인 환자에서 시행한 FDG PET/CT와 방사성요오드 SPECT/CT 영상이다. 우측 폐 소견에 대해 옳지 않은 것은?","stem_table":null,"options":["폐 원발암의 가능성이 있다.","폐 전이의 가능성이 있다.","분화도가 나쁜 병소이다.","조직검사가 필요하다.","방사성요오드 재치료가 필요하다."],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q72_p139.png","note":null,"id_simple":"2021-Q72"},{"id":"2021-L30-Q73","year":2021,"qnum":73,"jokbo_lec_no":30,"lecture":"갑상선 결절의 핵의학 검사","professor":"천기정","curr_lec_no":"45","curr_lecture":"갑상선질환의 핵의학 검사 및 치료,갑상선세침흡인","stem":"핵의학 검체 검사의 원리를 설명하는 모식도이다. 측정을 위해 한정된 양을 미리 알고 있어야하는 요소 두 가지는?","stem_table":null,"options":["가, 나","가, 다","나, 다","다, 라","다, 마"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q73_p139.png","note":null,"id_simple":"2021-Q73"},{"id":"2021-L31-Q74","year":2021,"qnum":74,"jokbo_lec_no":31,"lecture":"갑상선 결절의 영상과 세침검사","professor":"윤태진","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"다음 갑상선 결절의 초음파 영상 소견 중 양성 가능성이 가장 높은 소견은?","stem_table":null,"options":["Comet tail 인공물을 동반한 부분 낭종","침상 경계를 동반한 등에코성 고형 결절","앞뒤로 긴 모양의 저에코성 고형 결절","거대석회화를 동반한 등에코성 고형 결절","앞뒤로 긴 모양의 부분 낭종"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q74"},{"id":"2021-L32-Q77","year":2021,"qnum":77,"jokbo_lec_no":32,"lecture":"갑상선 결절의 세포병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"다음 중 갑상선 세침흡인검사에 관한 설명으로 옳은 것은?","stem_table":null,"options":["갑상선 중심 침생검(core needle biopsy)에 비해 indeterminate(AUS/FLUS) category 빈도가 낮다.","비교적 간단하고 빠르고 경제적인 검사이나 심한 출혈 등의 합병증 위험이 높다.","검사 목적은 기능성 또는 염증성 질환으로부터 수술이 필요한 종양성 질환을 구별하기 위함이다.","Bethesda system에서 follicular neoplasm으로 진단되는 경우 악성도는 60~75%에 달한다.","검사 결과 부적절 검체로 분류되는 경우가 매우 적어 5% 이내이다."],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q77"},{"id":"2021-L32-Q78","year":2021,"qnum":78,"jokbo_lec_no":32,"lecture":"갑상선 결절의 세포병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"28세 여자 환자가 갑상선 결절을 주소로 내원하였다. 갑상선 초음파검사에서 갑상선에 여러 개의 결절이 관찰되었다. 갑상선 결절 중 가장 큰 결절에서 갑상선 세침흡인검사를 시행하였고 그 결과는 다음 그림과 같았다. 이 질환에 대한 설명으로 맞는 것은?","stem_table":null,"options":["추가적인 molecular testing이 필요하다.","위와 같은 소견을 보이는 경우 risk of malignancy는 10~30%이다.","Bethsda system 중 Benign category로 진단할 수 있다.","다시 세침흡인검사를 시행해야 한다.","TSH-binding inhibitor immunoglobulin의 생성이 이 질환의 원인이다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q78_p139.png","note":null,"id_simple":"2021-Q78"},{"id":"2021-L32-Q80","year":2021,"qnum":80,"jokbo_lec_no":32,"lecture":"갑상선 결절의 세포병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"45세 남자 환자가 만져지는 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 크기 4.0 x 3.0 cm의 주변과 경계가 좋은 종괴가 관찰되었고, 갑상선 세침흡인검사에서 다음과 같은 소견으로 follicular neoplasm으로 진단받았다 (그림","stem_table":null,"options":["PAX8-PPARγ translocation","RET/PTC gene rearrangement","BRAF V600E mutation","TP53 mutation","CTNNB1 mutation"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q80_p139.png","note":null,"id_simple":"2021-Q80"},{"id":"2021-L32-Q82","year":2021,"qnum":82,"jokbo_lec_no":32,"lecture":"갑상선 결절의 세포병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"37세 여자 환자가 만져지는 갑상선 결절을 주소로 내원하였다. 초음파 검사 상 다수의 종괴가 관찰되었고, 가장 큰 것은 1.5x1.2cm으로 갑상선 세침흡인검사에서 Bethesda system category VI로 진단받았다. 환자는 갑상선 전절제술을 시행 받았고 조직학적 소견은 다음 그림과 같았다. 이 환자의 종양에서 발생한 종양에 대한 설명으로 맞는 것을 고르시오.","stem_table":null,"options":["예후가 좋은 편이나 젊은 나이에 발생한 경우에는 예후가 나쁘다.","그림에서 관찰되는 psammoma body는 다른 종양에서도 관찰되기 때문에 진단에 도움이 되지 않는다.","혈행성 전이를 자주 일으켜 뼈, 간, 폐 전이를 보인다.","위 환자와 같이 다발성 종양으로 나타나는 경우가 흔해서 18~87%에서 나타난다.","nuclear grooves, nuclear pseudoinclusion 등과 같은 특징적인 핵의 소견이 없어도 유두상의 구조가 있으면 진단할 수 있다."],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q82_p140.png","note":null,"id_simple":"2021-Q82"},{"id":"2021-L32-Q110","year":2021,"qnum":110,"jokbo_lec_no":32,"lecture":"갑상선 결절의 세포병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"다음 갑상선암 중에서 기원세포가 다른 암은?","stem_table":null,"options":["유두암","여포암","수질암","미분화암","휘틀세포암"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q110"},{"id":"2021-L33-Q109","year":2021,"qnum":109,"jokbo_lec_no":33,"lecture":"갑상선 결절의 치료와 추적관찰","professor":"박영주","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"55세 여자가 앞 목덩이로 왔다. 갑상선이 비대해져 있었고, 경부 전산화단층촬영 및 흉부 단순촬영 결과는 다음과 같다. 미세침흡인세포검사 결과는 양성이다. 치료는?","stem_table":null,"options":["결과 관찰","갑상선 절제술","갑상선 호르몬제 복용","고주파 절제술 (radiofrequency ablation)","에탄올 주입술 (percutaneous ethanol injection)"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q109_p140.png","note":null,"id_simple":"2021-Q109"},{"id":"2021-L34-Q83","year":2021,"qnum":83,"jokbo_lec_no":34,"lecture":"갑상선암의 분류와 진단","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선암 환자에서 발생할 수 있는 유전적 변화에 대한 설명이다. 옳은 것은?","stem_table":null,"options":["전세계적으로 가장 흔히 발견되는 유전적 이상은 BRAF/PTC의 fusion이다.","80% 이상의 갑상선암에서 p53 유전자의 이상이 발견된다.","BRAF 유전자의 돌연변이는 갑상선여포암에서는 발견되지 않는다.","갑상선유두암과 갑상선여포암은 유전자 이상을 공유하기 때문에 분화된 갑상선암이라고 불린다.","RAS 돌연변이는 MEN(Multiple endocrine neoplasia)과 동반된 갑상선 암에서 흔히 발견된다."],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q83"},{"id":"2021-L34-Q84","year":2021,"qnum":84,"jokbo_lec_no":34,"lecture":"갑상선암의 분류와 진단","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선암의 예후에 대한 설명이다. 적절한 것은?","stem_table":null,"options":["분화 갑상선암에 있어 여자가 남자에 비해 예후가 나쁘다.","가장 예후가 나쁜 갑상선암은 미분화 갑상선암이다.","RAS 돌연변이가 있는 것이 가장 예후가 나쁘다.","갑상선수질암에서 thyroglobulin이 높은 경우에는 예후가 나쁘다.","분화갑상선암에서 가장 예후가 나쁜 variant는 classic variant이다."],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q84"},{"id":"2021-L34-Q85","year":2021,"qnum":85,"jokbo_lec_no":34,"lecture":"갑상선암의 분류와 진단","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"갑상선유두암으로 10년전 수술을 받고 추적관찰하던 중 최근 갑자기 thyroglobulin이 증가하였고, I-123 스캔에서는 이상이 없었으나 PET 검사에서 우측 폐 우엽과 하엽에 다발성 전이가 발견되었다. 이 환자의 향후 치료에 대해 적절한 설명은?","stem_table":null,"options":["고용량(150-200mCi)의 I-131로 방사성요오드 치료를 우선 시행한다.","폐전이 부위에 Gamma knife 방사선조사를 고려한다.","Cisplatin을 base로 한 chemotherapy를 시행한다.","Tyrosine kinase inhibitor 치료가 도움이 될 수 있다.","우측폐 절제를 시행한 후 고용량 I-131 치료를 시행한다."],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q85"},{"id":"2021-L35-Q7","year":2021,"qnum":7,"jokbo_lec_no":35,"lecture":"갑상선 결절(암)의 외과적 치료","professor":"최준영","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"45세 여자가 초음파 이상 소견으로 내원하였다. 양엽에 각각 1개의 결절이 발견되었다. (우측: 우엽 장경 0.6cm, 좌측: 좌엽 장경 1.5cm). 갑상선기능은 정상이었다. 다음 조치는?","stem_table":null,"options":["경과 관찰","후두내시경검사","우측 미세침흡인검사","좌측 미세침흡인검사","양측 미세침흡인검사"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q8_p140.png","note":null,"id_simple":"2021-Q7"},{"id":"2021-L35-Q8","year":2021,"qnum":8,"jokbo_lec_no":35,"lecture":"갑상선 결절(암)의 외과적 치료","professor":"최준영","curr_lec_no":"47","curr_lecture":"갑상선질환의 수술적 치료","stem":"54세 여자가 1일전 갑자기 발생한 목의 통증과 덩이로 왔다. 갑상선기능은 정상이었다. 다음 조치는?","stem_table":null,"options":["경과 관찰","미세침흡인","중심바늘생검","고주파 절제술","갑상선 엽절제술"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q36_p140.png","note":null,"id_simple":"2021-Q8"},{"id":"2021-L36-Q79","year":2021,"qnum":79,"jokbo_lec_no":36,"lecture":"갑상선 결절의 수술 및 분자병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"다음 중 갑상선에서 발생하는 암에 관한 설명으로 옳은 것은?","stem_table":null,"options":["Papillary carcinoma는 우리나라에서 갑상선암의 80% 정도를 차지하는 가장 흔한 암이다.","Follicular adenoma와 follicular carcinoma는 별개의 질환으로 follicular adenoma에서 follicular carcinoma로 진행하지 않는다.","2017년 개정된 WHO 분류에서 minimally invasive follicular carcinoma는 혈관 침습 없이 피막 침습만 있는 경우로 정의한다.","Poorly differentiated carcinoma는 follicular carcinoma가 진행해서 발생하고, undifferentiated carcinoma는 papillary carcinoma가 진행해서 발생한다.","Undifferentiated carcinma는 면역조직화학염색이나 전자현미경 소견에서도 상피세포 분화의 증거를 찾을 수 없다."],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q79"},{"id":"2021-L36-Q92","year":2021,"qnum":92,"jokbo_lec_no":36,"lecture":"갑상선 결절의 수술 및 분자병리","professor":"박소연","curr_lec_no":"46","curr_lecture":"갑상선 결절,암의 병리,분자병리","stem":"21세 여자환자가 갑상선의 다발성 종괴를 주소로 갑상선 절제술을 시행받았다. 다음은 환자의 절제된 갑상선의 현미경 소견이다. 이 질환에 대한 설명으로 옳지 않은 것은?","stem_table":null,"options":["피막(Capsule)의 유무가 진단에 중요하다.","세침흡인검사로 악성과 양성을 감별할 수 있다.","Psammoma bodies가 흔히 관찰된다.","가장 흔한 유전자 이상은 RET/PTC rearrangement이다.","종양세포 핵의 crowding, overlapping을 보이며 nuclear groove가 잘 보인다."],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q92_p141.png","note":null,"id_simple":"2021-Q92"},{"id":"2021-L38-Q5","year":2021,"qnum":5,"jokbo_lec_no":38,"lecture":"갑상선 암의 추적, 예후","professor":"박도준","curr_lec_no":"44","curr_lecture":"갑상선암의 진단과 치료","stem":"80세 여자가 갑상선과 골밀도 검사 이상으로 왔다. 갑상선초음파 (우측 2.5x2x.35cm 크기 결절, 좌측정상), 갑상선스캔과 대퇴부 골밀도검사 소견이다. 혈청 TSH 0.15 mIU/L (정상 0.4~4.","stem_table":null,"options":["경과 관찰","베타차단제","미세침흡인검사","T3 억제스캔 검사","방사성요오드 치료"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q5_p141.png","note":null,"id_simple":"2021-Q5"},{"id":"2021-L39-Q37","year":2021,"qnum":37,"jokbo_lec_no":39,"lecture":"소아 갑상선 질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"생후 14일 된 신생아가 황달로 광선치료 위해 입원하였다. 임신나이 37주, 3.1kg으로 주산기적 문제없이 출생하였다. 완전 모유수유 중으로 체중은 3.1kg 이었다. 모유를 빠는 힘 정상이었고, 대변도 매일 잘 보았다. 혀는 두껍지 않았고, 배꼽 탈장 없었고, 근긴장도 정상이었다. 혈액 검사 결과는 다음과 같다. 우선적인 조치는?\n유리 T4 0.69 ng/dL (정상치 0.7~1.","stem_table":null,"options":["티록신 결합글로불린 검사","갑상선 스캔 검사","모유 일시중단","레보티록신 투여","추적관찰"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q37"},{"id":"2021-L39-Q40","year":2021,"qnum":40,"jokbo_lec_no":39,"lecture":"소아 갑상선 질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"생후 14일 된 남아가 신생아 선별검사에서 총 T4 수치가 낮아서 병원에 왔다. 이란성 쌍생아 중 둘째로 임신나이 37주, 1.8kg 출생하였고 주산기적 문제는 없었다. 완전 모유수유 중이며 체중은 2.1kg 이었다. 황달이 있고, 2일에 한번 노란색 대변을 보았다. 진찰상 음경 3.0cm 이고, 고환이 한쪽에서만 촉지되었다. 혈액 검사결과는 다음과 같다. 이란성 쌍생아 첫째는 여아로 2.5kg 체중으로 출생하였고, 신생아 선별검사에서 총 T4 수치 정상이었다고 한다. 가장 옳은 조치는?\n유리 T4 1.0 ng/dL (정상치 0.7~1.","stem_table":null,"options":["티록신 결합글로불린 검사","잠복고환 수술","모유 일시중단","레보티록신 투여","쌍생아 첫째도 갑상선기능검사 시행"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q40"},{"id":"2021-L39-Q41","year":2021,"qnum":41,"jokbo_lec_no":39,"lecture":"소아 갑상선 질환","professor":"이영아","curr_lec_no":"48","curr_lecture":"소아갑상선질환","stem":"37개월된 남아가 검사결과 확인 위해 병원에 왔다. 신생아기 선천성 갑상선저하증 진단받고 레보티록신 치료를 받았다. 1개월 전 (생후 36개월째) 키와 체중이 또래 평균 범주이고, 운동 및 언어 발달 정상이었다. 갑상선 총음파상 갑상선이 적절한 크기로 잘 형성되어 있어서 레보티록신을 중단을 시도하였다. 약물 중단 1개월 후 혈액 및 영상검사 결과는 다음과 같다. 가장 옳은 설명은?\n1개월간 레보티록신 중단하고 시행한 검사:\n(","stem_table":null,"options":["영상검사 결과가 정상이므로 보상성 갑상선 저하증이 호전될 가능성이 높다.","경미한 갑상선 형성부전이므로 투약 없이 추적한다.","요오드 섭취를 제한한다.","갑상선 호르몬 유기화 장애이므로 즉시 레보티록신을 투여한다.","청력장애가 동반되어 있다면 pendred 증후군 가능성이 높다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q41"},{"id":"2021-L40-Q86","year":2021,"qnum":86,"jokbo_lec_no":40,"lecture":"병리실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"32세 여자 환자가 초음파에서 발견된 갑상선 우엽의 종괴를 주소로 내원하여, 세침흡인검사 후 갑상선 우엽 절제술을 시행받았다. 다음은 절제된 갑상선 종괴의 현미경 사진이다. 이 질환에 대한 설명으로 옳은 것은?","stem_table":null,"options":["피막(Capsule)의 유무가 진단에 중요하다.","세침흡인검사로 악성과 양성을 감별할 수 있다.","Psammoma bodies가 흔히 관찰된다.","가장 흔한 유전자 이상은 RET/PTC rearrangement이다.","종양세포 핵의 crowding, overlapping을 보이며 nuclear groove가 잘 보인다."],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q86_p142.png","note":null,"id_simple":"2021-Q86"},{"id":"2021-L40-Q89","year":2021,"qnum":89,"jokbo_lec_no":40,"lecture":"병리실습","professor":"김영아","curr_lec_no":"49","curr_lecture":"병리실습","stem":"38세 여자환자가 초음파에서 발견된 갑상선 좌엽의 종괴를 주소로 내원하여, 세침흡인검사 후 갑상선 우엽 절제술을 받았다. 다음은 절제된 갑상선 종괴의 현미경 사진이다. 이 질환에서 가장 흔하게 관찰되는 유전자 변이는?","stem_table":null,"options":["RAS mutation","BRAF mutation" ote":null,"id_simple":"2021-Q199"},{"id":"2021-L54-Q200","year":2021,"qnum":200,"jokbo_lec_no":54,"lecture":"포도당 대사 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"김00씨는 특정 사회문제에 대하여 단식농성을 시작한 지 4주째 접어들고 있다. 현재 김00씨의 체내 대사작용에 대한 기술 중 가장 가능성이 높은 것은?","stem_table":null,"options":["근육세포는 주로 fatty acid를 에너지원으로 사용하고 있다.","근육세포는 단백질분해를 계속 증가하여 간세포의 gluconeogenseis를 촉진한다.","뇌(brain)는 주된 에너지원으로 glucose를 사용하고 있다.","간세포는 주된 에너지원으로 glucose를 사용하고 있다.","지방세포의 lipolysis는 감소되어 있다."],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q200"},{"id":"2021-L54-Q204","year":2021,"qnum":204,"jokbo_lec_no":54,"lecture":"포도당 대사 항상성 조절 메커니즘","professor":"최경호","curr_lec_no":"53","curr_lecture":"포도당 대사항상성","stem":"50세 남성인 김철수씨는 최근 심해진 비만으로 병원에 내원하여 혈액검사를 받은 결과, 공복혈당치와 당화혈색소 수치가 정상범위를 크게 상회하여 제2형 당뇨를 진단받았다. 김철수씨의 대사상황에 대해 가장 가능성이 높은 설명은?","stem_table":null,"options":["지방세포에서의 triacylglycerol합성이 증가되어 있다.","지방세포로의 fatty acid 유입이 증가되어 있다.","지방세포로의 glucose 유입이 증가되어 있다.","지방세포로의 adiponectin 분비가 증가되어 있다.","혈중 triacylglycerol량이 증가되어 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q204"},{"id":"2021-L55-Q123","year":2021,"qnum":123,"jokbo_lec_no":55,"lecture":"당뇨병의 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음은 제1형 당뇨병의 자연경과를 보여주는 그림이다. 각각의 시기와 관련된 위험인자나 표현형으로 가장 적절하지 못한 것은?","stem_table":null,"options":["A – HLA DR3/DR4","B – 바이러스","C – 보상적 인슐린 과분비","D – GAD항체 양성","E – HbA1c 10%"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q123_p147.png","note":null,"id_simple":"2021-Q123"},{"id":"2021-L55-Q124","year":2021,"qnum":124,"jokbo_lec_no":55,"lecture":"당뇨병의 분류와 진단","professor":"박경수","curr_lec_no":"54","curr_lecture":"당대사 분류와 진단","stem":"다음은 제 2형 당뇨병 발병과정에서의 인슐린감수성과 인슐린분비능의 변화를 표시한 그래프이다. 초록색 선은 Normal Glucose tolerance인 사람들의 인슐린감수성과 인슐린분비능 관계이다.\n42세 남자, 제2형 당뇨병 가족력(+), 최근 5년간 체중 10kg 증가, 공복혈당 98mg/dL, 당부하후 2시간째 혈당 130mg/dL, 5년 전 이 남자의 인슐린 감수성과 인슐린 분비능이 A 지점에 있었다면 지금 A~E중 어느 위치에 있을 가능성이 제일 높을까?","stem_table":null,"options":["A","B","C","D","E"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q124_p148.png","note":null,"id_simple":"2021-Q124"},{"id":"2021-L56-Q125","year":2021,"qnum":125,"jokbo_lec_no":56,"lecture":"당뇨병의 만성합병증","professor":"곽수헌","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음 중 Maturity onset diabetes of the young(MODY)에 대한 설명으로 가장 적절하지 못한 것은?","stem_table":null,"options":["제2형 당뇨병처럼 대사증후군이 잘 동반한다.","25세 이전에 잘 발병해서 종종 제1형 당뇨병으로 오진되기도 한다.","여러 세대에 걸쳐 당뇨병이 있다.","베타세포 기능장애가 주된 병인이다.","제1형, 제2형 당뇨병과 달리 단일유전자 이상에 의한 당뇨병이다."],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q125"},{"id":"2021-L56-Q126","year":2021,"qnum":126,"jokbo_lec_no":56,"lecture":"당뇨병의 만성합병증","professor":"곽수헌","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음 중 당뇨병의 미세혈관 합병증에 대한 설명으로 옳지 않은 것은?","stem_table":null,"options":["당뇨병성 미세혈관 합병증은 당뇨병에 특이적이다.","당뇨병성 망막병증은 성인 실명의 가장 흔한 원인이다.","당뇨병성 콩팥병은 신대체요법을 받게 되는 가장 흔한 원인이다.","당화혈색소를 1% 감소시키면 미세혈관 합병증이 37% 정도 감소한다.","고혈당의 정도와 노출기간은 미세혈관 합병증 발생에 비례하지 않는다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q126"},{"id":"2021-L56-Q127","year":2021,"qnum":127,"jokbo_lec_no":56,"lecture":"당뇨병의 만성합병증","professor":"곽수헌","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음 중 당뇨병의 대혈관 합병증에 대한 설명으로 맞는 것은?","stem_table":null,"options":["대혈관 합병증은 당뇨병에 특이적이다.","고혈당 외에도 인슐린 저항성이 병태 생리에 중요하다.","당뇨병 환자에서 관상동맥질환은 1개 혈관만 침범하는 특징이 있다.","당뇨병 환자에서는 중성지방에 비해 LDL 콜레스테롤이 많이 상승한다.","당뇨병 환자에서는 증상이 없어도 정기적인 심혈관질환 검사가 필요하다."],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q127"},{"id":"2021-L56-Q128","year":2021,"qnum":128,"jokbo_lec_no":56,"lecture":"당뇨병의 만성합병증","professor":"곽수헌","curr_lec_no":"55","curr_lecture":"55·56 당뇨병의 만성합병증 (1·2)","stem":"다음 중 당뇨 콩팥병증을 선별하기 위해 사용하는 검사는?","stem_table":null,"options":["콩팥초음파, 콩팥생검","콩팥초음파, 사구체 여과율","콩팥초음파, 소변 알부민 크레아틴 비","소변 알부민 크레아틴 비, 콩팥생검","소변 알부민 크레아틴 비, 사구체 여과율"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q128"},{"id":"2021-L57-Q130","year":2021,"qnum":130,"jokbo_lec_no":57,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"당뇨병성 케톤산증의 초기 소견으로 합당한 것은?","stem_table":null,"options":["혈중 인 농도 감소","혈중 칼륨 농도 감소","동맥혈 pH 감소","백혈구 수 감소","lipase 농도 감소"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q130"},{"id":"2021-L57-Q131","year":2021,"qnum":131,"jokbo_lec_no":57,"lecture":"당뇨병의 급성합병증","professor":"정혜승","curr_lec_no":"57","curr_lecture":"당뇨병의 급성합병증","stem":"80세 남자가 말이 어눌해지고 가족을 알아보지 못하여 응급실로 실려왔다. 10년 전 뇌경색이 있어 고혈압과 고지혈증 약제, 아스피린 등을 복용중이었으나 병원에 잘 가지 않았다. 최근 1개월 간 기운이 약해져서 주로 집에서 누워 지내고 섭식이 감소하면서 체중이 준 것을 제외하면 특이 증상을 호소하지는 않았다. 과호흡이나 과일향 호흡은 관찰되지 않았다. 응급실에서 시행한 활력징후와 혈당은 다음과 같다.\n혈압 100/50mmHg, 맥박 120회/분, 호흡수 및 체온 정상, 혈당측정기: 측정불가(high)\n이 환자에게 혈액검사를 위한 채혈 후 가장 먼저 해야 할 일은?","stem_table":null,"options":["인슐린 정주","생리식염수 정주","칼륨 투여","brain MRI 촬영","포도당 용액 정주"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q131"},{"id":"2021-L58-Q133","year":2021,"qnum":133,"jokbo_lec_no":58,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중에서 약리학적 기전이 나머지와 가장 다른 한 약물은?","stem_table":null,"options":["pioglitazone","repaglinide","glimepride","gemigliptin","liraglutide"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q133"},{"id":"2021-L58-Q134","year":2021,"qnum":134,"jokbo_lec_no":58,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음의 당뇨병 치료제 중 소화기 부작용이 나머지 약물들에 비해 상대적으로 적은 약물은?","stem_table":null,"options":["acarbose","exenatide","metformin","liraglutide","empaglifozin"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q134"},{"id":"2021-L59-Q132","year":2021,"qnum":132,"jokbo_lec_no":59,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"다음 중 괄호 안에 순서대로 들어갈 알맞은 약물 조합을 선택하시오.\n당뇨병 치료를 위해 인슐린을 자가 투약하고 있는 환자가 혈당을 적극적으로 관리하는 중이다. 이 환자는 끼니 식사 전에 ( )을 투여하고, 매일 1회 잠자기 전에 ( )을 투여하고 있다.","stem_table":null,"options":["aspirin – NPH","gluisine – Lispro","Lispro – Glargine","Determir – Gluisine","Degludec – Regular"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q132"},{"id":"2021-L59-Q198","year":2021,"qnum":198,"jokbo_lec_no":59,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"55세 남자가 당뇨병으로 5년간 metformin 1g/day를 투약해왔다. 400mg/g Cr의 단백뇨 및 망막 병증이 동반된 상태로 eGFR 59.0 mL/min/1.73m²를 유지 중이다. 최근 심부전으로 타병원 입원치료 후 방문하였고, 방문 당시 HbA1c 8.0% 였다. 환자의 동반질환을 고려할 때, 가장 도움이 될 수 있는 당뇨병 약제를 고르시오.","stem_table":null,"options":["Dipeptidyl Peptidase-4 inhibitor","Insulin","Sodium glucose co-transporter inhibitor","Sulfonylurea","Thiazolidinedione"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q198"},{"id":"2021-L59-Q201","year":2021,"qnum":201,"jokbo_lec_no":59,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"다음 당뇨병 환자 중 고강도의 저항성 운동을 피해야 하는 경우를 고르시오.","stem_table":null,"options":["평소 운동을 하지 않던 당뇨병 환자","근육량이 적은 당뇨병 환자","증식성 망막병증이 있는 당뇨병 환자","인슐린을 사용 중인 당뇨병 환자","경한 심부전증이 동반된 당뇨병 환자"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q201"},{"id":"2021-L59-Q203","year":2021,"qnum":203,"jokbo_lec_no":59,"lecture":"당뇨병의 치료원칙과 관리","professor":"임수","curr_lec_no":"59","curr_lecture":"당뇨병의 치료원칙과 관리","stem":"당뇨병 환자의 혈당관리 수준을 평가할 때, HbA1c는 최근 2-3개월의 평균적인 혈당 수준을 반영한다. HbA1c 7%는 최근 2-3개월간의 평균 혈당이 어느 정도였음을 보여주는가?","stem_table":null,"options":["97 mg/dL","126 mg/dL","154 mg/dL","183 mg/dL","212 mg/dL"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q203","reparsed":true},{"id":"2021-L60-Q195","year":2021,"qnum":195,"jokbo_lec_no":60,"lecture":"소아청소년 당대사 이상","professor":"김재헌","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"3세 남아가 의식이 없어 병원에 왔다. 아침에 깨워도 일어나지 못하고 식은땀을 흘리고 있었다. 체질량지수는 14.4kg/m² (10백분위수)였다. 1일 전 놀이공원에 다녀와서 저녁을 먹지 않고 잠이 들었다고 한다. 응급실에서 10% 포도당 수액 투여 후 의식이 회복되었다. 검사결과이다. 적절한 조치는?\n혈액: 혈당 35mg/dL, 소변: 케톤 3+","stem_table":null,"options":["케톤식","저지방식","고탄수화물식","글루카곤 근육주사","옥트레오타이드 피하주사"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q195"},{"id":"2021-L60-Q196","year":2021,"qnum":196,"jokbo_lec_no":60,"lecture":"소아청소년 당대사 이상","professor":"김재헌","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"9세 여아가 계속 자려고만 하여 병원에 왔다. 1개월 전부터 물을 많이 마시고 소변량이 증가하였다. 체중은 1개월동안 3KG 줄었다. 4시간 전부터는 구토를 하여 아무것도 먹지 못하고 소변도 보지 못하며 계속 자려고만 하였다. 혈압은 106/70mmHg, 호흡 30회/분, 맥박 105회/분, 체온 37.2도였다. 검사결과는 다음과 같다. 초기 치료는?\n혈액: Na⁺ 133mEq/L, K⁺ 3.2 mEq/L, 포도당 460 mg/dL, 정맥혈: pH 7.10, HCO₃⁻: 6mEq/L, 소변: 포도당 4+, 케톤 3+","stem_table":null,"options":["만니톨 정맥주사","0.9% 식염수 정맥주사","0.45% 식염수 정맥주사","속효성 인슐린 피하주사","조속효성 인슐린 정맥주사"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q196"},{"id":"2021-L60-Q197","year":2021,"qnum":197,"jokbo_lec_no":60,"lecture":"소아청소년 당대사 이상","professor":"김재헌","curr_lec_no":"62","curr_lecture":"소아청소년 당뇨병","stem":"12세 남아가 체중이 많아 병원에 왔다. 체질량지수는 28.2kg/m²(>95백분위수) 였고, 고환은 양쪽 모두 2ML, 음경은 성성숙도 1단계였다. 목에 흑색가시세포종이 있었다. 검사결과는 다음과 같다. 치료는?\n공복혈당 189 mg/dL, 당화혈색소 7.9%, 소변 케톤(-), 자가항체 모두 음성","stem_table":null,"options":["관찰","메트포르민","장시간 작용 인슐린","인슐린 다회 주사법","글루카곤유사 펩티드 수용체 작용제"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q197"},{"id":"2021-L61-Q135","year":2021,"qnum":135,"jokbo_lec_no":61,"lecture":"임신성 당뇨병","professor":"장학철","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"임신성 당뇨병의 진단기준이 지난 30년간 변경되어 왔다. 이러한 이유는 초기 임신성 당뇨병 진단 기준이 임신 성적보다는 산모의 당뇨병 발생 위험을 배경으로 진단기준이 설정되었기 때문이다. 다음의 임신성 당뇨병 진단기준 중 임신 성적에 근거한 임신성 당뇨병 진단기준은?","stem_table":null,"options":["WHO 당뇨병 진단기준","NDDG 임신성 당뇨병 진단기준","O'Sullivan 진단기준","Carpenter-Coustan 진단기준","IADPSG 진단기준"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q135"},{"id":"2021-L61-Q136","year":2021,"qnum":136,"jokbo_lec_no":61,"lecture":"임신성 당뇨병","professor":"장학철","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"임신 28주에 임신성 당뇨병으로 진단된 32세 산모가 2주간의 혈당을 측정하여 내원하였다. 현재 임신성 당뇨병 식사 2000 칼로리와 가벼운 운동으로 조절 중이다. 자가 혈당 측정치의 평균치는 아래와 같다. 다음 조치는?","stem_table":null,"options":["그대로 유지하면서 2주간 경과를 지켜본다.","식사 처방을 1700 칼로리로 감량한다.","인슐린을 추가 처방한다.","경구혈당강하제를 추가 처방한다.","당화혈색소를 검사한다."],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q136a_p150.png","note":null,"id_simple":"2021-Q136"},{"id":"2021-L61-Q137","year":2021,"qnum":137,"jokbo_lec_no":61,"lecture":"임신성 당뇨병","professor":"장학철","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"임신 14주인 35세 산모가 산전검사에서 요당이 검출되어 왔다. 2년 전 건강검진에서 당뇨병을 진단받았으나, 특별한 관리는 받지 않았다. 내원하여 시행한 공복혈당은 146mg/dL, 당화혈색소는 6.9%였다. 다음 조치는?","stem_table":null,"options":["당뇨병 교육 + 인슐린요법","100g 경구당부하검사","50g 경구당부하검사","갑상선기능검사","미세단백뇨 검사"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q137"},{"id":"2021-L62-Q138","year":2021,"qnum":138,"jokbo_lec_no":62,"lecture":"노인 당뇨병","professor":"장학철","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"노인에서는 여러 요인에 의해서 당뇨병 발생이 증가하는 것으로 알려지고 있다. 다음 중 노인 당뇨병 발생 위험을 증가시키는 주요 원인은?","stem_table":null,"options":["식습관의 변화","자가면역","불규칙적인 운동","근육량 감소","TSH 증가"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q138"},{"id":"2021-L62-Q139","year":2021,"qnum":139,"jokbo_lec_no":62,"lecture":"노인 당뇨병","professor":"장학철","curr_lec_no":"60","curr_lecture":"임신성 노인 당뇨병","stem":"노인 당뇨병 관리에서 정기적인 노인증후군 평가를 강조하고 있다. 다음 중 노인에서 초기 진료 및 매년 정기적인 평가가 권장되는 노인증후군은?","stem_table":null,"options":["다약제","우울증","인지기능장애","만성통증","만성콩팥병"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q139"},{"id":"2021-L63-Q141","year":2021,"qnum":141,"jokbo_lec_no":63,"lecture":"저혈당증","professor":"오태정","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"54세 환자가 위암으로 위절제술을 시행 받았다. 오후 3시경 식은땀을 동반한 어지러움증이 반복되었으며, 상기 증상 발생 시 시행한 간이 혈당측정 검사에서 50mg/dL으로 저혈당이 확인되었다. 사탕을 섭취한 이후 수분 내에 식은땀과 어지러움증은 호전되었다. 위절제술 이후 위 배출시간이 짧아지면서 소장에 분포한 위장관 내분비 세포에서 분비되는 물질로 환자의 증상과 관련이 있는 것은?","stem_table":null,"options":["ghrelin","amylase","leptin","gastrin","glucagon like peptide 1"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q141"},{"id":"2021-L63-Q142","year":2021,"qnum":142,"jokbo_lec_no":63,"lecture":"저혈당증","professor":"오태정","curr_lec_no":"61","curr_lecture":"저혈당증","stem":"70세 여자가 의식소실로 응급실에 내원하였다. 내원당시 시행한 혈액검사에서 plasma glucose 42mg/dL의 저혈당이 확인되었으며, 당뇨병의 병력 및 혈당강하제 투약력은 없었다. 환자에서 저혈당이 유발된 원인질환을 감별하기 위해 시행한 검사에서 insulin, c-peptide의 상승소견이 확인되었으며, 인슐린 자가항체는 검출되지 않았다. 다음 검사는?","stem_table":null,"options":["glycated hemoglobin","glycated albumin","GAD-Ab","pancreas CT","sellar MRI"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q142"},{"id":"2021-L65-Q143","year":2021,"qnum":143,"jokbo_lec_no":65,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"27세 여성이 건강검진을 위해 검진 전날 저녁 6시 이후로 물 외에는 경구로 섭취하지 않은 상태이다. 검진 당일 아침 공복상태에서, 해당 검진자에게 에너지원이 되는 지질을 간으로부터 혈류로 운반하는 주된 지단백질 형태는?","stem_table":null,"options":["Very low density lipoproteins","high density lipoproteins","low density lipoproteins","Apolipoprotein A","Chylomicrons"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q143"},{"id":"2021-L65-Q145","year":2021,"qnum":145,"jokbo_lec_no":65,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"42세 남성이 건강검진을 위해 내원하였다. 검진 당일 실수로 충분한 양의 아침식사를 한 뒤 오전 9시에 검진기관에 내원한 상태였다. 다음 중 해당 검진자에게 혈액검사를 시행할 경우, 공복시 검사와 비교할 때 혈중 중성지방 수치에 영향을 주는 영양소는?","stem_table":null,"options":["glucose","fatty acids","amino acids","모두 맞음","모두 틀림"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q145"},{"id":"2021-L65-Q190","year":2021,"qnum":190,"jokbo_lec_no":65,"lecture":"lipoprotein particle의 생성, 대사, 기능의 이해","professor":"권오빈","curr_lec_no":"65","curr_lecture":"지질대사(Lipoprotein)","stem":"인슐린저항성, 당뇨병이 있는 환자에서 지질단백 대사는 특징적인 양상을 보인다. 말초 조직과 간에서의 인슐린저항성에 의한 지질단백 대사의 변화 중 옳은 것은?","stem_table":null,"options":["고밀도콜레스테롤 상승","Apo-B 지단백의 증가","Apo-A1 지단백의 증가","지방조직에서 중성지방분해 감소","Choleteryl Esther Transfer Protein (CETP) 활성화 감소"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q190"},{"id":"2021-L66-Q144","year":2021,"qnum":144,"jokbo_lec_no":66,"lecture":"이상지질혈증의 약물치료기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"35세의 남자 환자가 건강검진에서 우연히 발견된 혈액검사 이상소견으로 내원하였다. 가족력으로는 아버지가 44세에 뇌졸중이 발생한 바 있다. 재검한 공복 혈액 검사 소견은 다음과 같다. 이 환자의 경우 일차치료의 표적이 될 수 있는 효소는?\ntotal cholesterol: 347mg/dL(참고치 150-200), high density lipoprotein cholesterol: 32mg/dL(참고치 40-80), Triacylglycerol: 145mg/dL(참고치 0-150), Low density lipoprotein cholesterol: 286mg/dL(참고치 0-100)","stem_table":null,"options":["acyltransferase","HMG-CoA reductase","malate dehydrogenase","Acyl CoA dehydrogenase","phosphocarboxylase serine kinase 9"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q144"},{"id":"2021-L66-Q146","year":2021,"qnum":146,"jokbo_lec_no":66,"lecture":"이상지질혈증의 약물치료기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"45세 남성 환자가 건강검진에서 LDL cholesterol이 180mg/dL(참고치, <100mg/dL), 그리고 triglycerides가 210mg/dL로 높다는 진단을 받았다. 환자는 lovastatin 40mg 복용 후 호전되었다. 다음 중 lovastatin 영향으로 적절치 않은 것은?","stem_table":null,"options":["LDL 수용체의 발현을 증가시켰다.","혈중 LDL 레벨을 감소시켰다.","혈중 VLDL 레벨을 감소시켰다.","근육통을 유발하였다.","lipoprotein lipase 발현을 증가시켰다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q146"},{"id":"2021-L66-Q147","year":2021,"qnum":147,"jokbo_lec_no":66,"lecture":"이상지질혈증의 약물치료기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"다음 고지혈증 약제 중 말초 지방세포에서 간으로 fatty acid 공급을 억제하는 약물로 가장 적절한 것은?","stem_table":null,"options":["bile acid sequestrating resins","ezetimibe","fibric acids","niacin","statins"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q147"},{"id":"2021-L66-Q148","year":2021,"qnum":148,"jokbo_lec_no":66,"lecture":"이상지질혈증의 약물치료기전","professor":"조정현","curr_lec_no":"67","curr_lecture":"이상지질혈증의 치료약물기전","stem":"간세포에서 LDL 수용체 발현을 감소시키는 효과가 가장 큰 것은?","stem_table":null,"options":["bile acid sequestrating resins","fibric acids","lipoprotein lipase","PCSK9","statins"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q148"},{"id":"2021-L67-Q164","year":2021,"qnum":164,"jokbo_lec_no":67,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"저밀도 콜레스테롤(low density lipoprotein)의 대사에 주요하며 저밀도 콜레스테롤 수용체에 부착되어 간 세포내에서 쉽게 lysozome 내의 분해를 유도하며, 저밀도콜레스테롤 수용체의 재활용을 방해하는 물질은 무엇인가?","stem_table":null,"options":["PCSK9","Apolipoprotein A","Apolipoprotein C2","hormone sensitive lipase","cholesterylester transfer protein(CETP)"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q164"},{"id":"2021-L67-Q205","year":2021,"qnum":205,"jokbo_lec_no":67,"lecture":"이상지질혈증의 종류","professor":"최성희","curr_lec_no":"66","curr_lecture":"이상지질혈증의 종류","stem":"34세 남자가 심한 복통으로 응급실에 왔다. 검사결과 췌장염으로 수액 및 약물치료를 시작하며 시행한 혈액검사상 중성지방이 2000mg/dL 이상 (정상 150mg/dl 이하)으로 측정되었고, 담도 및 췌장관에 돌이나 종양 등의 특이 소견은 발견되지 않았따. 환자는 응급실 내원 전에 육류를 위주로 식사를 하였으나 음주는 시행하지 않았다. 과거력상 4년 전에 갑작스러운 시력장애로 망막에 이상이 있어 치료를 받았으며, 그 당시에도 중성지방이 높다는 소견을 들었으나 특별한 약물치료를 시행하지 않았다. 환자에게 예상되는 이상소견으로 가장 적합한 것은?","stem_table":null,"options":["PCSK9","Apolipoprotein A","Lipoprotein Lipase","Apolipoprotein B","Cholesteryl Ester Transfer Protein (CETP)"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q205"},{"id":"2021-L68-Q206","year":2021,"qnum":206,"jokbo_lec_no":68,"lecture":"이상지질혈증의 치료원칙","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"65세 남자가 LDL 콜레스테롤 수치가 높아 내원하였다. 5년 전에 2형 당뇨병으로 진단받고, 경구 약물치료 중이었고, 3년 전부터 고혈압으로 항고혈압제제 복용 중이었다. 가족력상 아버지가 50세에 뇌졸중으로 사망하였고, 고모도 50대에 심근경색으로 사망하였다. 흡연력이 있고 40 pack/year였다. 키 173cm, 몸무게 83kg, 음주력은 소주 1병/주이다. 이 환자의 치료로 가장 맞는 것은?","stem_table":null,"options":["statin","Omega-3 fatty acid","fenofibrate","PCSK9 억제제","약물치료 없이 생활운동 요법만 시행"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q206"},{"id":"2021-L68-Q207","year":2021,"qnum":207,"jokbo_lec_no":68,"lecture":"이상지질혈증의 치료원칙","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"45세 남자가 심한 피곤함으로 시행한 검사에서 간수치 및 콜레스테롤 수치 이상으로 내원하였다. 이전 특이병력은 없었으며, 2달 전부터 일상적인 업무에도 심한 피로감을 느꼈으며, 2달 동안 4KG의 체중증가가 있었고, 목부위가 약간 커진 것이 관찰되었다. 키 173cm, 몸무게 74.5kg, 혈압, 맥박, 호흡수, 체온은 모두 정상이었다. 혈액검사 소견은 다음과 같다. 가장 먼저 시행되어야 할 치료는 무엇인가?","stem_table":null,"options":["fenofibrate","high intensity statin","omega-3 fatty acid","갑상선 호르몬 투여","statin과 ezetimibe 병용 투여"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q207_p152.png","note":null,"id_simple":"2021-Q207"},{"id":"2021-L68-Q208","year":2021,"qnum":208,"jokbo_lec_no":68,"lecture":"이상지질혈증의 치료원칙","professor":"최성희","curr_lec_no":"68","curr_lecture":"이상지질혈증의 치료","stem":"26세 남자가 발목 부위 아킬레스건이 두꺼워 운동할때마다 불편하여 정형외과에 내원하였다. 이전 병원에 내원하여 검사한 병력은 없었고, 아버지가 심근경색, 형이 34세에 불안정성 협심증으로 스텐트 시술을 시행하였다. 신체검진과 X-ray 소견 상 황색건종(tendon xanthoma)가 발견되어 혈액검사를 시행하였고, 결과는 다음과 같다.\nT. cholesterol/TG/HDL-C/LDL-cholesterol: 420/80/40/360 mg/dl\n이 환자에서 고용량의 스타틴과 에제티미브 병합치료를 6개월간 시행하였으나 LDL-cholesterol의 수치는 198mg/dl 였다. 고지혈증 치료 가이드라인을 고려하여 다음에 시행할 치료로 가장 맞는 것은?","stem_table":null,"options":["fenofibrate","omega-3 fatty acid","고용량 vitamin E","PCSK9 억제제","고강도의 운동강화치료"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q208"},{"id":"2021-L69-Q149","year":2021,"qnum":149,"jokbo_lec_no":69,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"체질량지수에 관한 일반적인 설명으로 옳은 것은?","stem_table":null,"options":["같은 체질량지수인 경우 남성이 여성보다 체지방률이 높다.","체질량지수와 2형 당뇨병 발생 위험의 관계는 J-curve 패턴을 보인다.","체질량지수가 낮으면 낮을수록 사망률이 낮다.","같은 체질량지수일 경우 동양인이 서양인에 비해 당뇨병 위험이 높다.","체질량지수가 증가하면 심혈관질환 위험도는 낮아진다."],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q149"},{"id":"2021-L69-Q150","year":2021,"qnum":150,"jokbo_lec_no":69,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"시상하부에서 식욕 조절을 담당하는 주된 요소가 아닌 것은?","stem_table":null,"options":["leptin","POMC","AgRP","Melanocortin 4 receptor","GLP-2"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q150"},{"id":"2021-L69-Q151","year":2021,"qnum":151,"jokbo_lec_no":69,"lecture":"비만과 관련질환의 병태생리","professor":"조영민","curr_lec_no":"69","curr_lecture":"비만과 관련질환의 병태생리","stem":"키 165.2cm, 체중 93.9kg, 허리둘레 116cm인 20대의 서로 다른 여성의 복부 CT 소견이다. 두 여성의 CT 결과에 따라 예상할 수 있는 소견은?","stem_table":null,"options":["A는 B보다 복부지방 중 피하지방 비율이 높다.","A는 B보다 다낭성난소증후군 위험이 높다.","A는 B보다 내당능(glucose tolerance)이 우수하다.","A는 B보다 간내지방(intrahepatic lipid) 함량이 적다.","A는 B보다 인슐린 감수성이 높다."],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q151_p152.png","note":null,"id_simple":"2021-Q151"},{"id":"2021-L70-Q152","year":2021,"qnum":152,"jokbo_lec_no":70,"lecture":"비만의 내과적 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"28세 여자가 항비만약제 부작용으로 왔다. 환자는 키 162cm, 체중 97kg이었으며, 1주전 인근 의원에서 처방받은 약을 투여한 후 식사를 하면 쉽게 배가 부르고, 소화가 안되며, 가슴쓰림 증상이 있다가, 하루 전부터 구토가 발생하였다. 가장 의심이 되는 약제는?","stem_table":null,"options":["locaserin","phentermine","sibutramine","orlistat","liraglutide"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q152"},{"id":"2021-L70-Q153","year":2021,"qnum":153,"jokbo_lec_no":70,"lecture":"비만의 내과적 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"다음 중 약제 복용 후 체중이 증가할 가능성이 가장 낮은 약제는?","stem_table":null,"options":["glucocorticoid","DDP-5 inhibitor","thiazolidinedione","atypical antipsychotics","tricyclic antidepressants"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q153"},{"id":"2021-L70-Q155","year":2021,"qnum":155,"jokbo_lec_no":70,"lecture":"비만의 내과적 치료","professor":"조영민","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"아래 그래프는 탄수화물 함량이 다른 4가지 식이요법 이후 1년간의 체중감소 효과를 나타내고 있다. 이중 탄수화물 함량이 가장 낮은 식이요법은?","stem_table":null,"options":["zone","LEARN","ornish","atkins","해당없음"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q155_p152.png","note":null,"id_simple":"2021-Q155"},{"id":"2021-L71-Q154","year":2021,"qnum":154,"jokbo_lec_no":71,"lecture":"비만의 외과적 치료","professor":"이혁준","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"비만수술로 가장 많이 시행되는 위 소매절제술 이후 가장 흔한 합병증은?","stem_table":null,"options":["장폐색증","철분결핍","위궤양출혈","체중 재증가","역류성 식도염"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q154"},{"id":"2021-L71-Q156","year":2021,"qnum":156,"jokbo_lec_no":71,"lecture":"비만의 외과적 치료","professor":"이혁준","curr_lec_no":"70","curr_lecture":"비만과 관련질환의 진단과 치료","stem":"비만을 동반한 제 2형 당뇨에서 비만수술 또는 대사수술의 혈당조절 효과가 가장 클 것으로 기대되는 환자는?","stem_table":null,"options":["60세 이상인 환자","인슐린은 사용하는 환자","당화혈색소가 9 이상인 환자","C-peptide가 6 이상인 환자","당뇨가 10년 이상 있는 환자"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q156"},{"id":"2021-L72-Q194","year":2021,"qnum":194,"jokbo_lec_no":72,"lecture":"소아청소년 비만","professor":"김재현","curr_lec_no":"63","curr_lecture":"소아청소년 비만,저혈당","stem":"14세 남아가 체중이 많이 나가 병원에 왔다. 성장도표는 그림과 같다. 진단은?","stem_table":null,"options":["단순비만","뇌하수체 저하증","시상하부성 비만","프라더-윌리 증후군","가성 부갑상샘 저하증"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q194_p153.png","note":null,"id_simple":"2021-Q194"},{"id":"2021-L73-Q157","year":2021,"qnum":157,"jokbo_lec_no":73,"lecture":"정리강의","professor":"조영민","curr_lec_no":"정리","curr_lecture":"정리강의/기타","stem":"35세 남자가 비만치료를 위해 왔다. 키 170cm에 체중 130kg으로 체질량지수 45이다. 체중조절을 위해 식이요법, 운동요법, 약물치료 등을 1년 이상 받았으나 효과는 미미하였다. 경도의 수면무호흡증 외에 다른 기저질환은 없었다. 이 환자에서 적절한 치료는?","stem_table":null,"options":["심리치료 추가","비만치료 약물 변경","조절형 위밴드술","위소매 절제술","위전절제술"],"answer":[4],"image":null,"note":"2026 커리큘럼 미매칭 (족보강의#73)","id_simple":"2021-Q157"},{"id":"2021-L74-Q158","year":2021,"qnum":158,"jokbo_lec_no":74,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"나이가 들면 혈중 호르몬 농도에 변화가 일어난다. 다음 중 나이가 들면서 증가하는 호르몬은?","stem_table":null,"options":["성장호르몬","테스토스테론","멜라토닌","에스트라디올","코티솔"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q158"},{"id":"2021-L74-Q159","year":2021,"qnum":159,"jokbo_lec_no":74,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"74세 여자가 혈당조절이 불량하여 입원하였다. 최근 낙상은 없었지만 다리 힘이 빠진다고 하였다. 근감소증이 의심되어 평가하려고 한다. 악력을 측정했더니 10kg이었다. 근감소에 진단을 위하여 다음으로 시행할 검사는?","stem_table":null,"options":["chair stand test","DXA","gait speed","SPPB","TUG"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q159"},{"id":"2021-L74-Q160","year":2021,"qnum":160,"jokbo_lec_no":74,"lecture":"노인내분비학","professor":"장학철","curr_lec_no":"22","curr_lecture":"노화와 내분비","stem":"나이가 들면, 체중에 변화가 없더라도 신체구성에 변화가 일어난다. 노인에서 관찰되는 신체구성 변화의 특징적인 것은?","stem_table":null,"options":["골량의 증가","상체 근육량의 증가","하체 근육량의 감소","복강내 지방량의 감소","근육간 지방조직량의 감소"],"answer":[3],"image":null,"note":null,"id_simple":"2021-Q160"},{"id":"2021-L75-Q188","year":2021,"qnum":188,"jokbo_lec_no":75,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키가 작아 병원에 왔다. 키는 107cm, 체중 17kg였다. 임신나이 38주에 출생체중 3.0kg으로 질식분만으로 출생하였으며, 황달이 첫 1주일동안 있었따. 최근 6개월 사이 근시가 생겼다. 4세 이후 수면 중 소변을 보지는 않는다. 고환은 1ml이며, 음모는 없다. 아버지 키는 170cm로, 사춘기 시작 시기는 불명확하다. 어머니 키는 158cm로 초경은 중1때 있었다. 검사결과는 다음과 같다. 성장곡선이다. 진단은?","stem_table":null,"options":["부당경량아","갑상샘저하증","가족성저신장","체질성성장지연","성장호르몬 결핍증"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q188_p154.png","note":null,"id_simple":"2021-Q188"},{"id":"2021-L75-Q189","year":2021,"qnum":189,"jokbo_lec_no":75,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"12세 남아가 키가 작고 체중이 많아 병원에 왔다. 어렸을 때부터 계속 작고 체중이 많이 나가는 편이었다. 출생시 난산이었으며, 신생아기에 경련으로 병원에 입원했던 적이 있으나 발달 지연은 없었다. 키는 134cm(<3백분위수), 체질량지수 25.2kg/m²(>95백분위수)였고, 고환은 양쪽 모두 2ml, 음경은 성성숙도 1단계였다. 진단은?","stem_table":null,"options":["단순비만","쿠싱 증후군","뇌하수체 저하증","시상하부성 비만","프라더-윌리 증후군"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q189_p154.png","note":null,"id_simple":"2021-Q189"},{"id":"2021-L75-Q191","year":2021,"qnum":191,"jokbo_lec_no":75,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 성장 상담을 위해 병원에 왔다. 키는 117cm, 체중 17kg였다. 임신나이 38주에 출생 체중 3.0kg으로 질식분만으로 출생하였따. 간은 만져지지 않았다. 고환은 1mL이며 음모는 없다. 지금까지 케톤성 저혈당으로 3회 응급실을 방문하였다. 아버지 키는 170cm로, 사춘기 시작시기는 불명확하다. 어머니 키는 158cm로 초경은 중1 때 있었다. 부모는 아이 키가 작아 걱정을 하였으나 아이는 키에 관한 스트레스가 없다. 검사결과는 다음과 같다. 성장곡선이다. 조치는?","stem_table":null,"options":["경과관찰","고단백식이 권장","성장호르몬 투여","생우유 하루에 600mL 섭취 권장","생식샘자극호르몬방출호르몬작용제 투여"],"answer":[1],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q191_p154.png","note":null,"id_simple":"2021-Q191"},{"id":"2021-L75-Q202","year":2021,"qnum":202,"jokbo_lec_no":75,"lecture":"성장 장애","professor":"신충호","curr_lec_no":"20","curr_lecture":"성장 장애","stem":"6세 남아가 키가 작아 병원에 왔다. 키는 107cm, 체중 17kg였다. 임신나이 38주에 출생체중 3.0kg으로 질식분만으로 출생하였으며, 황달이 첫 1주일동안 있었다. 최근 자주 넘어지고 부딪혀 멍이 잘 들어 시력저하를 의심하여 시행한 안저검사에서 시신경위축이 발견되었다. 고환은 1ML이며, 음모는 없다. 아버지 키는 170cm로, 사춘기 시작시기는 불명확하다. 어머니 키는 158cm로 초경은 중1때 있었다. 검사결과는 다음과 같다. 성장곡선이다. 진단은?","stem_table":null,"options":["부당경량아","갑상샘저하증","가족성저신장","체질성성장지연","성장호르몬결핍증"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q202_p147.png","note":null,"id_simple":"2021-Q202"},{"id":"2021-L76-Q192","year":2021,"qnum":192,"jokbo_lec_no":76,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"13세 남아가 음경이 작아 보인다며 병원에 왔다. 키 149cm(10 백분위수), 체중 58kg (75 백분위수)다. 음경신장길이(streched penile length)는 50 백분위수(남아 13세 기준)로 치골지방에 대부분 묻혀 있었다. 음모는 성성숙도 2기, 고환은 6mL로 부드럽게 만져졌다. 여성형 유방이 좌측에서 관찰되었다. 조치는?","stem_table":null,"options":["경과관찰","염색체 핵형","갑상샘기능검사","성장호르몬자극검사","생식샘자극호르몬 방출호르몬 자극검사"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q192"},{"id":"2021-L76-Q193","year":2021,"qnum":193,"jokbo_lec_no":76,"lecture":"사춘기 이상","professor":"신충호","curr_lec_no":"21","curr_lecture":"사춘기 이상","stem":"생식샘자극호르몬방출호르몬(GnRH)을 정맥 주사하였을 때, 황체화호르몬(LH)의 증가가 관찰되는 경우는?","stem_table":null,"options":["6세 여아에서 유방 성성숙도 1이면서 음모 성성숙도 3","7세 여아에서 유방 성성숙도 3기","8세 여아(1년 전 백혈병 치료 위해 부설판 사용)에서 유방 성성숙도 1","9세 남아에서 고환 3ML이면서 음모 성성숙도 3","14세 남아에서 고환 2ML이면서 냄새 못맡음"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q193"},{"id":"2021-L77-Q161","year":2021,"qnum":161,"jokbo_lec_no":77,"lecture":"성분화 이상질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"다음은 정상적인 성발달 과정과 치료계획 시 성결정 과정에 대한 설명이다. 맞는 것은?","stem_table":null,"options":["고환형성은 X염색체내 SRY의 존재에 의해 결정된다.","여성의 성선으로 발달하려면 androgen의 역할이 중요하다.","성발달 과정의 첫 번째 단계는 성선(gonadal sex)의 결정이다.","성결정은 외생식기의 모양에 따라 확정한다.","성결정 과정에서 환자의 성정체성 및 성역할에 대한 확인이 필요하다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q161"},{"id":"2021-L77-Q162","year":2021,"qnum":162,"jokbo_lec_no":77,"lecture":"성분화 이상질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환에서는 생식선에서의 종양발생 위험이 높아 필요시 생식선의 예방적 적출술을 시행해야 한다. 다음 중 생식선의 예방적 적출술이 반드시 필요한 질환은?","stem_table":null,"options":["46XX testicular disorder of sex development (XX male)에서의 양측 고환","46XY complete gonadal dysgenesis에서 양측 흔적성선","46XY ovotesticular disorder of sex development에서 남성으로 성결정한 음낭내 고환","45XO/46XX Turner syndrome에서 양측 흔적성선","46XY 5 alpha-reductase deficiency에서 음낭내 고환"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q162"},{"id":"2021-L77-Q163","year":2021,"qnum":163,"jokbo_lec_no":77,"lecture":"성분화 이상질환","professor":"임영재","curr_lec_no":"19","curr_lecture":"성분화 이상 질환","stem":"성분화 이상 질환이 의심되는 모호한 외성기 (ambiguous genitalia)를 가지고 있는 환자에서는 무엇보다 정확한 진단이 중요하다. 진단과 관련된 다음 내용 중 틀린 것은 무엇인가?","stem_table":null,"options":["음낭 및 음순부위에서 성선유무를 확인하는 것이 중요하다.","X염색체 및 SRY의 유무를 확인하는 염색체검사를 조기에 시행해야 한다.","초음파 또는 MRI 등을 시행하여 여성 내부생식기 유무를 확인해야 한다.","감별진단을 위해서 생식기관조영술 (genitography)를 시행하는 것이 중요하다.","혈장에서 17-OH progesterone을 측정하여 선천성 부신 증식증 (CAH) 여부를 확인한다."],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q163"},{"id":"2021-L78-Q182","year":2021,"qnum":182,"jokbo_lec_no":78,"lecture":"남성 호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"정자형성과정에서 시상하부-뇌하수체-고환 축의 호르몬 조절에 대한 설명이다. 틀린 것은?","stem_table":null,"options":["FSH는 남성의 사춘기에 정자형성 과정이 시작되는 데 필수적인 호르몬이다.","정상적인 정자생산을 위해서는 일정 수준의 고환 내 테스토스테론이 필수적이다.","남성 성인에서 FSH의 주된 역할은 양적으로 정상적인 수준의 정자형성을 유지시키는 것이다.","테스토스테론은 인히빈(inhibin)과 함께 되먹임기전을 통해 뇌하수체에서 FSH 생성을 직접 억제한다.","FSH의 주 표적기관은 고환의 세정관 내에 존재하는 세르톨리 세포(sertoli cell)이며, 세포막에 존재하는 수용체와 결합한 뒤 다양한 세포신호전달체계를 거쳐 정자형성과정에 필요한 여러 단백질의 합성을 촉진한다."],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q182"},{"id":"2021-L78-Q183","year":2021,"qnum":183,"jokbo_lec_no":78,"lecture":"남성 호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"27세 남성이 불임과 성욕감퇴로 병원을 방문하였다. 신장은 178cm, 체중은 63kg이었으며, 혈압과 맥박수, 호흡 등은 모두 정상이었다. 과거력에서도 특이한 사항은 없었따. 신체검사에서 양측 고환이 모두 5ml였다. 혈액검사에서 LH는 19mIU/ML(1-10mIU/ml), FSH는 38mIU/ml(1-9mIU/ml), testosterone은 150ng/dL(300-1000 ng/dL)였다. 처음 정액검사에서 정액량은 2ml, 정자는 관찰되지 않았다. 반복 시행한 정액검사에서도 이전검사와 유사하였으며, 정자는 관찰되지 않았다. 확진을 위해 다음으로 시행해야 하는 검사는?","stem_table":null,"options":["경직장초음파검사","컴퓨터단층촬영 (sellar CT)","GnRH 자극검사","염색체검사","고환생검"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q183"},{"id":"2021-L78-Q184","year":2021,"qnum":184,"jokbo_lec_no":78,"lecture":"남성 호르몬의 역할과 고환의 이상","professor":"조민철","curr_lec_no":"18","curr_lecture":"남성호르몬의 역할과 고환의 이상","stem":"29세 남자가 결혼 후 임신을 원하여 방문하였다. 환자는 7년 전 뇌하수체 선종제거술을 시행받았고, 이후 부신피질호르몬, 갑상선 호르몬, 테스토스테론 제제를 복용해왔다. 테스토스테론을 중지하고 주 3회 2000IU의 hCG를 3개월간 근육주사하였다. 테스토스테론치는 정상화 되었으나 계속 무정자증을 보여 주 3회 75IU recombinant FSH를 추가하였다. 이후 3개월째 무정자증이다. 적절한 조치는?","stem_table":null,"options":["주 3회 2000IU의 hCG, 75IU의 recombinant FSH 유지","테스토스테론 제제를 추가 투여","hCG의 용량을 3000IU로 증량 투여","GnRH pulsatile infusion pump로 교체","고환에서 정자추출 후 ICSI(intracytoplasmic sperm injection)"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q184"},{"id":"2021-L79-Q185","year":2021,"qnum":185,"jokbo_lec_no":79,"lecture":"여성호르몬의 분비조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"여성호르몬의 분비와 조절에 있어서 시상하부-뇌하수체-난소축(HPO axis)은 여성의 생리주기에 따라 변화하며 되먹이기 기전에 의해 조절되는 등 긴밀한 관계를 맺고 있다. A~C 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A. 에스트라디올 – B. 난포자극호르몬 – C. 황체호르몬 – D. 황체형성호르몬","A. 에스트라디올 – B. 난포자극호르몬 – C. 난포자극호르몬 – D. 황체호르몬","A. 난포자극호르몬 – B. 황체형성호르몬 – C. 황체호르몬 – D. 에스트라디올","A. 난포자극호르몬 – B. 황체형성호르몬 – C. 에스트라디올 – D. 황체호르몬","A. 난포자극호르몬 – B. 에스트라디올 – C. 황체형성호르몬 – D. 황체호르몬"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q185_p156.png","note":null,"id_simple":"2021-Q185"},{"id":"2021-L79-Q186","year":2021,"qnum":186,"jokbo_lec_no":79,"lecture":"여성호르몬의 분비조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"뇌하수체와 난소에서의 호르몬 분비는 여성의 생리주기에 따라서 변화하며 되먹이기 기전에 의해서 조절된다. 다음은 여성의 생리주기에 따른 호르몬의 변화를 나타내는 그림이다. A~D 빈칸에 알맞은 조합으로 이루어진 항목은?","stem_table":null,"options":["A. 난포막세포, B. 난포자극호르몬, C. 과립막세포 D. 황체형성호르몬","A. 난포막세포, B. 황체형성호르몬, C. 과립막세포, D. 난포자극호르몬","A. 과립막세포, B. 난포자극호르몬, C. 난포막세포, D. 황체형성호르몬","A. 과립막세포, B. 황체형성호르몬, C. 난포막세포, D. 난포자극호르몬","A. 과립막세포, B. 난포자극호르몬, C. 난포막세포, D. 황체호르몬"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q186_p156.png","note":null,"id_simple":"2021-Q186"},{"id":"2021-L79-Q187","year":2021,"qnum":187,"jokbo_lec_no":79,"lecture":"여성호르몬의 분비조절 기전","professor":"이정렬","curr_lec_no":"72","curr_lecture":"여성호르몬의 분비와 조절기전","stem":"난소의 에스트로겐의 생성을 위해서는 난포막세포와 과립막세포가 모두 존재하여야 하며 또한 생식샘자극호르몬들이 필요하다. 이러한 과정은 아래 그림으로 설명될 수 있는데, A-D 빈칸에 알맞은 조합으로 이루어진 항목은 무엇인가?","stem_table":null,"options":["A. 난포막세포, B. 난포자극호르몬, C. 과립막세포 D. 황체형성호르몬","A. 난포막세포, B. 황체형성호르몬, C. 과립막세포, D. 난포자극호르몬","A. 과립막세포, B. 난포자극호르몬, C. 난포막세포, D. 황체형성호르몬","A. 과립막세포, B. 황체형성호르몬, C. 난포막세포, D. 난포자극호르몬","A. 과립막세포, B. 난포자극호르몬, C. 난포막세포, D. 황체호르몬"],"answer":[2],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q187_p156.png","note":null,"id_simple":"2021-Q187"},{"id":"2021-L80-Q166","year":2021,"qnum":166,"jokbo_lec_no":80,"lecture":"무월경의 진단과 치료","professor":"김석현","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"32세 여성이 6개월간의 무월경을 주소로 내원하였다. 환자의 초경연령은 14세 였고, 28일 주기로 규칙적 월경을 보여 오던 중이었으나, 최근 6개월 전부터 생리주기가 불규칙해졌다. 분만력은 없었고 신체검진과 골반진찰에서 특이 소견은 없었다. 감별 진단을 위해 시행해야 할 검사가 아닌 것은?","stem_table":null,"options":["소변 임신반응 검사 (Urine hCG)","혈중 갑상선 자극 호르몬 (serum TSH)","혈중 프로락틴 (serum prolactin)","혈중 난포 자극 호르몬 (serum FSH)","자궁내막 조직검사 (endometrial biopsy)"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q166"},{"id":"2021-L80-Q171","year":2021,"qnum":171,"jokbo_lec_no":80,"lecture":"무월경의 진단과 치료","professor":"김석현","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"16세 환자가 일차성 무월경을 주소로 내원하였다. 환자는 건강해 보였으며, 발달 과정에 특이 사항은 없었다. 신체검사에서 신장 161cm, 체중 50kg, 유방은 tanner stage 4, 음모는 tanner stage 4였다. 골반진찰에서 외음부의 형태는 정상이었으나, 질이 짧은 맹관(blind pouch)의 형태를 보였다. 주기적 골반통증이나 후각장애는 없었으며 골반초음파 검사에서 자궁은 관찰되지 않았다. 핵형분석은 46 XX였다. 진단은?","stem_table":null,"options":["터너증후군 (turner syndrome)","뮐러관 무형성증 (mullerian agenesis)","안드로겐 무감응 증후군 (androgen insensitivity syndrome)","다낭성 난소증후군 (polycystic ovary syndrome)","처녀막 막힘증 (imperforate hymen)"],"answer":[2],"image":null,"note":null,"id_simple":"2021-Q171"},{"id":"2021-L80-Q172","year":2021,"qnum":172,"jokbo_lec_no":80,"lecture":"무월경의 진단과 치료","professor":"김석현","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"36세 여성이 8개월간의 무월경을 주소로 내원하였다. 환자는 2회의 임신 및 정상 질식분만력이 있으며, 이외 병력상 특이사항은 없었다. 요중 임신반응 검사는 음성, 혈중 갑상선자극호르몬(TSH), 프로락틴(PRL) 수치는 정상 범위였으나 난포자극호르몬(FSH) 수치는 42mIU/ml로 상승된 소견을 보였다. 이 환자에 대한 설명으로 옳은 것은?","stem_table":null,"options":["혈중 난포자극호르몬(FSH) 수치를 다시 측정하여 15mIU/ml이면 조기난소부전으로 진단할 수 있다.","조기난소부전으로 진단되면 더 이상 임신은 불가하다.","취약 X 증후군 돌연변이(FMR1 mutation)에 의해서 조기 난소부전이 발생하지는 않으므로 이에 대한 유전자 검사는 필요치 않다.","대부분의 조기 난소부전의 원인은 흡연이다.","방사선이나 항암제 치료에 의한 성선 독성, 자가면역질환 등의 원인이 밝혀져 있다."],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q172","reparsed":true},{"id":"2021-L80-Q173","year":2021,"qnum":173,"jokbo_lec_no":80,"lecture":"무월경의 진단과 치료","professor":"김석현","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"31세 여성이 난임을 주소로 내원하였다. 첫째 아기는 1년 6개월 전 임신 39주 1일에 질식분만하였다. 2개월 전 임신 6주 5일에 계류유산으로 자궁내막 소파술 시행 후 자궁내막염으로 항생제치료를 받은 이력이 있다. 다른 내과적 질환은 없었다. 자궁난관조영술 소견이다. 치료는?","stem_table":null,"options":["탐색적 개복술 (exploratory laparotomy)","메도트렉세이트 (methotrexate)","자궁경부원추절제술 (large loop excision of the transformation zone)","수술적 자궁경 (operative hysteroscopy)","레트로졸 (letrozole)"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q173_p157.png","note":null,"id_simple":"2021-Q173"},{"id":"2021-L80-Q175","year":2021,"qnum":175,"jokbo_lec_no":80,"lecture":"무월경의 진단과 치료","professor":"김석현","curr_lec_no":"73","curr_lecture":"무월경의 진단 및 치료","stem":"18세 여성이 초경이 없어 내원하였다. 신체검사에서 유방 tanner stage 4, 음모 tanner stage 1였고 양쪽 서혜부에서 종괴가 만져졌다. 골반진찰에서 질은 길이 4cm에 맹관이었으며, 초음파에서 자궁은 확인되지 않았다. 혈청검사에서 여포자극호르몬은 40.0mIU/ml(참고치 5-20mIU/ml), 황체형성호르몬 25mIU/ml(참고치 5-20mIU/ml), 테스토스테론은 11.6ng/mL(참고치 0.2-0.8ng/ml)였다. 핵형은 46, XY로 확인되었다. 이 환자에서 향후 악성종양을 예방하기 위해 시행되어야 할 치료는?","stem_table":null,"options":["생식선절제술 (gonadectomy)","정소고정술 (orchiopexy)","에스트로겐 - 프로게스테론 보충요법 (estrogen- progesterone replacement therapy)","생식샘자극호르몬분비호르몬 작용제 (GnRH agonist)","카베골린 (carbegoline)"],"answer":[1],"image":null,"note":null,"id_simple":"2021-Q175"},{"id":"2021-L81-Q165","year":2021,"qnum":165,"jokbo_lec_no":81,"lecture":"미성년 내분비학","professor":"황규리","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"11세 여아가 3개월 전부터 시작된 하복부 통증으로 내원하였다. 통증의 양상은 한달에 한번씩 심해지는 양상이었으며, 근 외음부 통증도 동반되었다. 신체진찰은 다음과 같다. 처치는?","stem_table":null,"options":["경과관찰","세침 천자","십자모양 절개","외음부 전절제","자궁내시경 수술"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q167_p158.png","note":null,"id_simple":"2021-Q165"},{"id":"2021-L81-Q167","year":2021,"qnum":167,"jokbo_lec_no":81,"lecture":"미성년 내분비학","professor":"황규리","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"생후 13개월 여아의 부모가 아이의 외부 생식기가 이상하게 보인다고 내원하였다. 환아의 신체진찰소견은 다음과 같다. 치료는?\n*(주: 이미지는 Q71번 CT 이미지와 공유. 별도 image 확인 필요)*","stem_table":null,"options":["경과관찰","경구 항생제 투여","정맥 항생제 투여","국소 에스트로겐 크림 도포","경구 에스트로겐 투여"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q71_p133.png","note":null,"id_simple":"2021-Q167"},{"id":"2021-L81-Q174","year":2021,"qnum":174,"jokbo_lec_no":81,"lecture":"미성년 내분비학","professor":"황규리","curr_lec_no":"74","curr_lecture":"미성년 내분비학","stem":"7세 여아가 음모가 보여 병원에 왔다. 3개월 전부터 여드름이 생겼다. 음모 성성숙도 2기 중반, 유방은 성성숙도 1기다. 키 120cm, 체중 25kg, 최근 1년 사이에 키와 체중이 많이 증가하였다. 부모 키는 모두 50백분위수이다. 최근 한약이나 영양제를 복용한 적은 없다. 뼈나이는 9세이다. 성장곡선이다. 검사는?","stem_table":null,"options":["갑상선자극호르몬","인슐린유사성장인자-1","17-하이드록시프로게스테론","경구당부하검사(성장호르몬측정)","생식샘자극호르몬방출호르몬 자극검사"],"answer":[3],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q174_p158.png","note":null,"id_simple":"2021-Q174"},{"id":"2021-L82-Q168","year":2021,"qnum":168,"jokbo_lec_no":82,"lecture":"호르몬 피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제 처방에 관한 WHO 가이드라인에서 category 4에 속하는 경우는?","stem_table":null,"options":["경증 간경화증","유방암 가족력","중증 혈소판감소증","aura가 없는 migraine","과거 또는 현재 정맥혈전증"],"answer":[5],"image":null,"note":null,"id_simple":"2021-Q168"},{"id":"2021-L82-Q169","year":2021,"qnum":169,"jokbo_lec_no":82,"lecture":"호르몬 피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제와 레보노게스트렐함유-자궁내장치의 공통된 피임 효과 외에 부가적 이점으로 보기 어려운 것은?","stem_table":null,"options":["빈혈예방","월경통호전","월경과다 호전","류마티스 관절염 감소","자궁내막증 수술 후 약물치료"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q169"},{"id":"2021-L82-Q170","year":2021,"qnum":170,"jokbo_lec_no":82,"lecture":"호르몬 피임법","professor":"지병철","curr_lec_no":"75","curr_lecture":"호르몬피임법","stem":"복합경구피임제의 복용을 잊었을 때의 대처법은 가능한 한 빨리 빠진 날만큼 복용하고 이후 한알씩 복용하는 것이다. 이때 7일간 추가 피임이 필요한 경우는?","stem_table":null,"options":["가, 다","가, 라","나, 다","나, 라","가, 나, 다, 라"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q170_p158.png","note":null,"id_simple":"2021-Q170"},{"id":"2021-L83-Q176","year":2021,"qnum":176,"jokbo_lec_no":83,"lecture":"만성 무배란증","professor":"지병철","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"다낭성난소증후군의 진단 기준 항목이 아닌 것은?","stem_table":null,"options":["다모증","희소월경","serum testosterone","75g 경구 당부하검사","초음파에서 다낭성난소 모양"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q176"},{"id":"2021-L83-Q177","year":2021,"qnum":177,"jokbo_lec_no":83,"lecture":"만성 무배란증","professor":"지병철","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"산과력 0-0-0-0인 24세 미혼여자가 최근 6개월간 월경이 없다고 병원을 방문하였다. 초경때부터 2-3개월 주기로 월경을 하다가 이후로는 1년에 4-5회 월경을 하였으며 최근 약 10kg 가량 체중이 늘면서 6개월째 월경이 없었다. 혈압 120/80mmHg, 키 160cm, 체중 75kg이며 다모증이나 여드름은 관찰되지 않았다. 요 임신반응은 음성이었다. 골반초음파에서 자궁은 정상이나 자궁내막 두께가 15mm로 약간 증가해 있으며 양측 난소는 전형적인 다낭성난소 모양이었다. 이 환자의 초기 처치로 가장 적절하지 않은 것은?","stem_table":null,"options":["serum LH/FSH 측정","serum testosterone 측정","serum TSH/prolactin 측정","metformin 투여 후 배란 확인","프로게스테론 투여 후 소퇴성 출혈 확인"],"answer":[4],"image":null,"note":null,"id_simple":"2021-Q177"},{"id":"2021-L83-Q179","year":2021,"qnum":179,"jokbo_lec_no":83,"lecture":"만성 무배란증","professor":"지병철","curr_lec_no":"76","curr_lecture":"만성무배란증","stem":"산과력 0-0-0-0인 29세 여자가 임신이 되지 않아 병원을 방문하였다. 결혼은 2년 전에 하였으며 월경은 1-4개월 간격으로 불규칙하였다. 키는 160cm, 체중은 75kg이며 얼굴에 여드름이 있고 배꼽아래 검고 굵은 털이 많이 나 있었다. 자궁난관조영술과 정액검사는 정상, 요 임신반응은 음성이었으며 월경 3일째 혈액검사결과는 다음과 같다. 임신을 위한 처치는?","stem_table":null,"options":["인공수정술","체외수정술","복합경구피임제","경구배란유도제","항안드로겐제제"],"answer":[4],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q179_p159.png","note":null,"id_simple":"2021-Q179"},{"id":"2021-L84-Q178","year":2021,"qnum":178,"jokbo_lec_no":84,"lecture":"폐경과 갱년기 증후군 병태생리, 치료, 건강관리","professor":"구승엽","curr_lec_no":"77","curr_lecture":"폐경및갱년기증후군 병태생리","stem":"여성건강주도연구(Women's health initia 련 유전자는?","stem_table":null,"options":["RB1","RET","MYC","MENIN","CDKIB"],"answer":[2],"image":null,"note":"복합문항 Q57&Q18 중 두 번째 문제 (강의15 MEN). qnum 18은 강의38에도 존재하므로 id에 b 추가","id_simple":"2025-Q18b"},{"id":"2021-L33-Q76","year":2021,"qnum":76,"jokbo_lec_no":33,"lecture":"갑상선 결절의 치료와 추적관찰","professor":"박영주","curr_lec_no":"43","curr_lecture":"갑상선질환의 영상소견,갑상선결절의 진단과 치료","stem":"다음 초음파에서 보이는 결절 중 악성 가능성이 가장 높은 것은?","stem_table":null,"options":["(이미지①)","(이미지②)","(이미지③)","(이미지④)","(이미지⑤)"],"answer":[5],"image":"https://gmdlzrgobwtzycnhcsug.supabase.co/storage/v1/object/public/site/img_2021/Q76_p136.png","note":"이미지 선택형 문항(5개 갑상선 초음파 이미지). PDF p136. 정답키 2021 Lec33에 76. 5 확인.","id_simple":"2021-Q76","recovered":true},{"id":"2021-L47-Q98","year":2021,"qnum":98,"jokbo_lec_no":47,"lecture":"부갑상선질환과 칼슘 대사이상","professor":"김상완","curr_lec_no":"28","curr_lecture":"부갑상선 질환","stem":"다발장기 부전으로 집중치료실(ICU)에 입원 중인 82세 남자가 저칼슘혈증으로 의뢰되었다. 환자는 1개월전에 Covid-19 폐렴 및 호흡 부전으로 입원하였다. 환자의 혈중 칼슘은 입원 시 9.2 mg/dL에서 어제 7.6 mg/dL으로 감소되었다. 이 환자에서 가장 먼저 확인해야할 사항은?","stem_table":null,"options":["혈중 인","혈중 비타민 D","혈중 부갑상선호르몬","마지막 수혈 날짜","혈중 알부민"],"answer":[],"image":null,"note":"정답키에 미수록(2021 AK 전체 검색 결과 없음). 문항 본문·선지는 PDF p145에서 추출. 정답 불명. [정답키 미수록]","id_simple":"2021-Q98","recovered":true},{"id":"2023-L44-Q115","year":2023,"qnum":115,"jokbo_lec_no":44,"lecture":"당뇨병 치료제의 약리학","professor":"정재용","curr_lec_no":"58","curr_lecture":"당뇨병 치료제의 약리학","stem":"다음 중 당뇨병 약제에 대한 설명으로 맞는 것은?","stem_table":null,"options":["설폰요소제는 ATP sensitive K-channel에 binding하여 인슐린 분비를 유도하여 혈당 강하 효과는 좋고 저혈당의 위험성도 낮다.","메트포민은 저혈당이 거의 오지 않는 장점이 있지만 혈당 강하 효과는 적은 편이다.","Thiazolidinedione 약제는 혈당 강하 효과 이외에도 체중 감소 효과가 있다.","GLP-1 유사체는 장에서 당분해를 지연시켜, 탄수화물 섭취가 많은 동양인의 혈당 조절에 도움이 된다.","최근에 개발된 sodium-glucose cotransporter-2 억제제는 혈당 강하 효과가 좋고, 체중 감소 효과도 있다."],"answer":[1,4],"image":null,"note":"복수 정답 문항 (AK: 1,4). PDF p67. 2023 AK 정답키에 '115. 1,4' 확인. DB에 Q115 누락 확인.","id_simple":"2023-Q115","recovered":true}];

const EXPLANATIONS = /*EXPL_START*/{
"2025-L1-Q33": "**TSH 0.25 (↓), Free T4 1.6 (정상 범위 내)** — TSH가 억제되어 있으나 T4가 정상인 경우, 이는 **무증상 갑상선기능항진증(subclinical hyperthyroidism)**의 전형적 패턴이다. 뇌하수체가 약간 과도한 갑상선호르몬에 반응해 TSH를 낮춘 상태이나 말초 호르몬은 아직 정상 범위에 있다.\n\n오답 이유: ①비갑상선질환(sick euthyroid)은 T3 감소가 특징적이며 TSH는 다양하게 변할 수 있으나 Free T4는 보통 낮거나 정상 범주에서도 맥락(급성 질환)이 있어야 함. ④중추성 갑상선기능항진증은 TSH가 정상~증가하면서 T4도 높아야 함. ⑤갑상선호르몬저항성은 TSH와 T4 모두 상승 또는 TSH 부적절하게 정상이면서 T4↑.\n\n💡 **TSH↓ + T4 정상 = 무증상 갑상선기능항진증**",
"2025-L2-Q2": "**단백질·펩타이드 호르몬의 반감기는 수 분(minute) 내외**다. 이들은 신장·간에서 빠르게 분해되고 결합단백질 없이 순환하므로 반감기가 짧다(예: insulin ~5분, GH ~20분).\n\n오답 이유: ①결합단백질에 결합된 호르몬은 비활성 형태(활성은 free form). ②결합단백질은 주로 **간**에서 합성. ③결합형은 반감기가 **길다**(대사 보호). ⑤결합단백질 감소 시 초기에 free form 증가 → 피드백으로 전체 호르몬 양 재조정됨(free form 장기적으로 변화 없음).\n\n💡 **펩타이드 호르몬 반감기 = 수 분, 결합단백질은 간 합성, 결합형이 반감기 길다**",
"2025-L2-Q7": "**Thyroid hormone(T3) 수용체(TR)는 호르몬 부재 시 코억제인자(corepressor)와 결합**하여 전사를 억제하고 있다가, T3 결합 시 코억제인자를 방출하고 코활성인자(coactivator)를 모집하여 유전자 발현을 활성화한다.\n\n오답 이유: ①Estrogen 수용체는 **homodimer**로 작용. ②Androgen 수용체는 **세포질**에서 안드로겐과 결합 후 핵으로 이동. ③호르몬 결합부위는 **ligand-binding domain(LBD)**이며, DNA-binding domain(DBD)은 DNA 결합 담당. ④Vitamin D 수용체(VDR)는 retinoid **X** receptor(RXR)와 heterodimer 형성(retinoid A 아님).\n\n💡 **TR = 호르몬 없을 때 corepressor 결합(억제 활성), T3 결합 시 활성화**",
"2025-L2-Q46": "**배란 직전 에스트로겐 급상승이 LH surge를 유발**하는 것은 내분비계에서 대표적인 **양성되먹임(positive feedback)** 예시다. 높은 에스트로겐이 시상하부·뇌하수체를 자극하여 더 많은 LH를 분비시킨다.\n\n오답 이유: ①고혈당 → glucagon 감소(음성되먹임). ②부교감신경은 cortisol 분비에 직접적 조절 기전이 아님(HPA axis는 주로 스트레스/시상하부 경로). ③혈중 Ca²⁺ 증가 → PTH 감소(음성되먹임). ⑤Cortisol → CRH 억제(음성되먹임).\n\n💡 **Estrogen → LH surge = 대표적 positive feedback (배란 유발)**",
"2025-L2-Q52": "**EPO 수용체는 cytokine receptor 계열**로, 수용체 자체에 kinase 활성이 없고 수용체에 결합된 **JAK2(Janus kinase 2)**를 활성화 → **STAT5** 인산화 → 핵 내 유전자 발현 조절 경로를 사용한다.\n\n오답 이유: ①Adenylyl cyclase-cAMP는 GPCR(Gs) 경로. ②Ras-MAPK는 receptor tyrosine kinase(RTK) 경로. ④SMAD2/3는 TGF-β/serine kinase receptor 경로. ⑤PI3K-Akt는 RTK(예: insulin receptor) 하위 경로.\n\n💡 **EPO → JAK2-STAT5 (cytokine receptor family)**",
"2025-L2-Q64": "**Cortisol은 스테로이드 호르몬으로, 세포 내 핵 수용체에 결합 후 특정 유전자의 전사를 조절(새로운 유전자 발현 유도 또는 억제)**하여 작용한다(genomic action이 주된 기전).\n\n오답 이유: ①Vasopressin(ADH)은 수분 재흡수·혈압 조절 호르몬(V2 receptor-cAMP, V1 receptor-Ca²⁺). ③Mineralocorticoid(aldosterone)는 세포 **내** 핵 수용체를 통해 작용(세포막 수용체 X). ④Insulin은 혈당이 **높을** 때 분비·작용. ⑤태아기에 성호르몬은 성분화(external genitalia, brain)에 결정적으로 작용.\n\n💡 **Cortisol = 스테로이드 → 핵 수용체 → 유전자 발현 조절 (genomic action)**",
"2025-L2-Q84": "**Thyroid hormone(T3, T4)은 tyrosine(아미노산) 2개에 요오드가 결합하여 만들어지는 아미노산 유도체(amino acid derivative)**다.\n\n오답 이유: ②GnRH는 10개 아미노산으로 이루어진 **펩타이드** 호르몬. ③LH는 glycoprotein(**대형 단백질**). ④PTH는 84개 아미노산 **펩타이드** 호르몬. ⑤Retinoids는 vitamin A 유도체로 **지질(steroid-like)** 계열.\n\n💡 **아미노산 유도체: Thyroid hormone(tyrosine+I), catecholamines(tyrosine), melatonin/serotonin(tryptophan)**",
"2025-L3-Q78": "**케토코나졸(ketoconazole)은 스테로이드 합성 효소(CYP11A1, CYP11B1 등)를 억제**하여 부신에서의 코르티솔 생성 자체를 줄이는 약물로, 쿠싱증후군(Cushing syndrome)에서 호르몬 **생성 억제** 목적으로 사용한다.\n\n오답 이유: ①②베타차단제는 갑상선중독증의 증상 완화나 갈색세포종 수술 전처치로 사용되지만, 호르몬 **생성**이 아닌 말초 **효과**(교감신경 차단)를 억제. ③염류코르티코이드 수용체 차단제(예: spironolactone)는 aldosterone의 **수용체 결합을 차단**하는 것이지 호르몬 생성 억제 X. ⑤소마토스타틴 유도체는 GH 분비 억제에 쓰이며, prolactinoma에는 **도파민 작용제(cabergoline, bromocriptine)** 사용.\n\n💡 **ketoconazole = 스테로이드 합성 효소 억제 → 코르티솔 생성 감소 (쿠싱 치료)**",
"2023-L1-Q30": "**LH–testosterone 쌍**이 정상적인 뇌하수체-표적기관 축(시상하부-뇌하수체-성선 축)을 구성한다. LH는 뇌하수체 전엽에서 분비되어 고환 Leydig 세포를 자극하고, testosterone이 음성되먹임으로 LH 분비를 억제하는 구조다.\n\n오답 이유: ①CRH는 시상하부 호르몬(뇌하수체 호르몬 아님). ②GH의 조절호르몬은 GHRH/somatostatin이며, somatostatin은 GH의 표적기관 호르몬이 아님. ③Prolactin–estrogen은 정식 음성되먹임 축으로 보기 어려움(도파민이 prolactin 억제, estrogen은 prolactin 분비 자극 가능). ⑤TRH는 시상하부 호르몬이며 TSH는 뇌하수체 호르몬으로, 쌍 자체가 뇌하수체-표적기관 축이 아님.\n\n💡 **HPG 축: (GnRH→) LH → testosterone → 음성되먹임으로 LH 억제**",
"2023-L1-Q46": "**TSH 2.1 mIU/L(정상), Free T4 낮음** 패턴은 **중추성(뇌하수체성) 갑상선기능저하증**이다. 뇌하수체 기능 이상으로 TSH 분비가 부적절하게 낮거나 정상인데도 T4가 낮은 경우, 즉 negative feedback이 깨진 상태다. '뇌하수체기능저하증(hypopituitarism)'으로 분류된다.\n\n오답 이유: ①무증상 갑상선기능저하증은 TSH↑, T4 정상. ③비갑상선질환은 T3 주로 감소, T4는 다양, TSH는 정상~낮음(맥락 필요). ④갑상선호르몬저항성은 TSH 정상~증가 + T4↑. ⑤일차성 갑상선기능저하증은 TSH↑ + T4↓.\n\n💡 **TSH 부적절하게 정상(낮지 않음) + T4↓ = 중추성(뇌하수체) 갑상선기능저하증**",
"2023-L2-Q25": "**Estrogen에 의한 LH surge(분비 증가)**는 배란 전 양성되먹임의 대표적 예시다. 배란 직전 높은 에스트로겐이 뇌하수체 LH 분비를 촉진하여 배란을 유도한다.\n\n오답 이유: ①혈당↑ → insulin↑, glucagon↓ (모두 음성되먹임). ②자율신경계 → cortisol 조절은 음성되먹임(HPA axis). ③혈중 Ca²⁺↑ → PTH↓(음성되먹임). ⑤Cortisol↑ → CRH↓(음성되먹임).\n\n💡 **Estrogen → LH 분비 증가 = positive feedback (배란 메커니즘)**",
"2023-L2-Q37": "**EPO 수용체는 cytokine receptor 계열**로 JAK(Janus kinase)–STAT 신호경로를 통해 작용한다. EPO 결합 → JAK2 활성화 → STAT5 인산화 → 적혈구 생성 유전자 발현.\n\n오답 이유: ①cAMP는 GPCR-Gs 경로. ②Ras-MAPK는 RTK 경로. ④SMAD는 TGF-β(serine-threonine kinase receptor) 경로. ⑤PI3K-Akt는 RTK(인슐린 수용체 등) 하위 경로.\n\n💡 **EPO → JAK2 → STAT5 (cytokine receptor 신호)**",
"2023-L2-Q41": "**Thyroid hormone receptor(TR)는 호르몬 부재 시 corepressor와 결합하여 전사를 억제**한다. T3 결합 후 corepressor 해리 및 coactivator 모집으로 유전자 발현이 활성화된다. TR은 스테로이드 수용체 superfamily에 속하지만, 스테로이드 수용체와 달리 호르몬 없이도 핵에 위치하며 DNA에 결합해 억제 상태로 있는 특징이 있다.\n\n오답 이유: ①Estrogen 수용체(ER)는 **homodimer**로 작용(heterodimer X). ②Androgen 수용체(AR)는 세포질에서 결합 후 핵으로 이동. ③호르몬 결합 부위는 LBD(ligand-binding domain), DNA 결합은 DBD. ④VDR은 retinoid **X** receptor(RXR)와 heterodimer 형성(retinoid A receptor X).\n\n💡 **TR = 핵에 상주, 리간드 없으면 corepressor와 결합(전사 억제)**",
"2023-L2-Q48": "**Cortisol은 핵 수용체(glucocorticoid receptor, GR)에 결합 후 특정 유전자의 전사를 활성화 또는 억제**하는 genomic action이 주된 기전이다. 새로운 mRNA 및 단백질 합성을 통해 다양한 대사 효과를 나타낸다.\n\n오답 이유: ①Vasopressin은 수분 조절 호르몬(세포 성장 조절 X). ③Mineralocorticoid는 세포 **내** 핵 수용체(MR) 통해 작용(세포막 수용체 X). ④Insulin은 혈당 **높을** 때(고혈당 상태) 분비·작용. ⑤태아기 성호르몬은 성 분화에 결정적 역할.\n\n💡 **Cortisol → GR → 핵 내 유전자 발현 조절 (genomic action)**",
"2023-L2-Q50": "**Thyroid hormone(T3, T4)은 tyrosine에서 유래한 아미노산 유도체(amino acid derivative)**다. 갑상선 여포세포에서 thyroglobulin의 tyrosine 잔기에 요오드가 결합하고 coupling 반응을 거쳐 합성된다.\n\n오답 이유: ②GnRH는 10개 아미노산 **펩타이드**. ③LH는 α·β 소단위 glycoprotein(**대형 단백질**). ④PTH는 84 aa **펩타이드**. ⑤Retinoids는 vitamin A 계열 **지용성 소분자(지질 유사체)**.\n\n💡 **아미노산 유도체: thyroid hormone(tyrosine), catecholamines(tyrosine), melatonin(tryptophan)**",
"2023-L2-Q63": "**펩타이드·단백질 호르몬은 결합단백질 없이 혈중을 free 형태로 순환하며 신장·간에서 빠르게 분해**되므로 반감기가 수 분 내외로 짧다.\n\n오답 이유: ①결합단백질에 결합된 호르몬은 비활성(free form이 활성). ②결합단백질은 주로 **간** 합성. ③결합형 반감기는 free form보다 **길다**(분해로부터 보호). ⑤결합단백질 감소 시 초기 free form 증가 → 피드백으로 총 호르몬 감소 조절 → 장기적으로 free form은 유사하게 유지.\n\n💡 **펩타이드 호르몬 반감기 = 수 분(짧음), 결합단백질 결합 시 반감기 연장**",
"2023-L3-Q5": "**TSH 정상 + Free T4(또는 T3) 이상 소견이 의심될 때 추가로 확인할 검사**는 **혈중 free T3**다. TSH가 정상 범위인데 T4가 낮거나 애매한 경우, 조직 활성화 호르몬인 free T3를 확인하여 갑상선 기능 상태(특히 T3 toxicosis, 중추성 이상 등)를 감별한다.\n\n오답 이유: ②TRH 자극 검사는 중추성 기능저하 감별에 사용되나, 현재 맥락(TSH 정상)에서는 우선순위가 낮음. ③Total T4는 결합단백질 변화에 영향받아 기능 평가에 free T4가 더 적절. ④뇌하수체 MRI는 TSH 이상이 중추성으로 강하게 의심될 때 시행. ⑤혈중 결합단백 측정은 total/free 호르몬 불일치를 설명할 때 보조적으로 사용.\n\n💡 **TSH 정상 + T4 이상 소견 시 → free T3 추가 확인으로 갑상선 기능 상태 정밀 평가**",
"2023-L3-Q70": "**25세 여성, 2형 당뇨병, 어머니·여동생 동일 질환** — 이 조합은 **MODY(Maturity-Onset Diabetes of the Young)**를 강하게 시사한다. MODY는 GCK, HNF1A 등 특정 유전자 돌연변이에 의한 단일 유전자 당뇨병으로, 젊은 나이에 2형 당뇨 표현형 + 강한 가족력이 있을 때 특정 **표적 유전자 검사(targeted gene sequencing)**가 진단에 필요하다.\n\n오답 이유: ①골다공증은 다유전자성, 특정 표적 유전자 검사 불필요(일반적). ②그레이브스병은 자가면역 질환, 특정 표적 유전자 검사 대상 아님. ③45세 남성 2형 당뇨는 일반적 다인성 당뇨로 MODY 가능성 낮음. ④갑상선유두암은 가족성 수질암(RET 유전자) 등이 표적 유전자 검사 대상이나, **유두**암은 대부분 산발성.\n\n💡 **젊은 나이 + 2형 당뇨 표현형 + 강한 가족력 → MODY 의심 → 특정 유전자(GCK, HNF1A 등) 검사**",
"2023-L3-Q74": "**방사성 요오드(radioactive iodine)**는 갑상선 세포를 직접 파괴(ablation)하여 갑상선기능을 변화시키는 **물리적/방사선 기전**이며, 나머지는 모두 **면역 매개** 또는 **약물 대사 기전**이다.\n\n오답 이유: ①인터페론 감마는 면역 조절을 통해 갑상선염(자가면역 활성화) 유발. ③CTLA-4 억제제(면역관문억제제)는 자가면역 활성화로 갑상선 기능 이상 유발. ④아미오다론은 요오드 과부하 + 직접 독성으로 기능 항진/저하 모두 가능. ⑤면역억제제(tacrolimus 등)는 면역 억제를 통해 갑상선 자가면역 억제 가능.\n\n💡 **방사성 요오드 = 방사선에 의한 직접 조직 파괴, 나머지는 면역/대사 기전 갑상선 기능 이상**",
"2022-L1-Q16": "**두 정답(②,⑤) 모두 옳은 이유:**\n\n②**펩타이드 호르몬의 세포외 분비(exocytosis)는 조면소포체(ER)→Golgi→분비과립(secretory granule)→세포외부** 경로를 따른다. Golgi 이후 분비과립을 통해 exocytosis가 일어나므로, '**Golgi에서 세포외부로**'라는 표현이 핵심 경로를 요약한 것으로 옳다.\n\n⑤**결합단백질은 호르몬을 단백분해로부터 보호하여 반감기를 연장**(안정화)하는 기능을 한다.\n\n오답 이유: ①스테로이드 호르몬은 지용성으로 세포막을 자유롭게 통과(transporter 불필요, 또는 단순 확산). ③혈액 내 **활성** 호르몬은 **free form**(단백질 비결합형). ④결합단백질 농도 증가 시, 초기엔 free form 감소하나 피드백으로 총 호르몬이 증가하여 결국 free form은 정상 유지 → 장기적으로 **free form보다 총 호르몬 농도에 더 큰 영향**.\n\n💡 **펩타이드 호르몬: ER→Golgi→분비과립→exocytosis / 결합단백질 = 안정화·반감기 연장**",
"2022-L2-Q7": "**리팜핀(rifampin)**은 갑상선 기능에 직접 작용하는 것이 아니라, **간 cytochrome P450 효소(CYP)를 강력히 유도**하여 갑상선호르몬(T4)의 대사·분해를 촉진함으로써 갑상선기능저하를 유발한다. 이는 **호르몬 대사 가속** 기전으로, 나머지와 기전이 근본적으로 다르다.\n\n오답 이유(같은 기전 그룹): ①아미오다론 — 요오드 과부하 + 직접 독성(Wolff-Chaikoff effect, Jod-Basedow). ②리튬 — 갑상선호르몬 합성·분비 억제. ③인터페론 감마 — 자가면역 유발(갑상선염). ⑤PD-L1 억제제 — 면역관문억제 → 자가면역 갑상선 기능 이상.\n\n💡 **리팜핀 = CYP 유도 → 갑상선호르몬 분해 촉진 (대사 기전) ≠ 면역/독성/합성억제 기전**",
"2022-L2-Q43": "**Thyroid hormone은 tyrosine에서 유래한 아미노산 유도체(amino acid derivative)**로 호르몬을 분류한다.\n\n오답 이유: ①Dopamine은 **아미노산 유도체**(catecholamine, tyrosine 유래), small peptide X. ②GnRH는 10개 아미노산으로 이루어진 **small peptide**. ③LH는 α·β 소단위로 구성된 **glycoprotein(large protein)**. ⑤Retinoids는 vitamin A 계열 **지용성 소분자**로 large protein X.\n\n💡 **호르몬 분류: TH = 아미노산 유도체, GnRH = 펩타이드, LH = glycoprotein, dopamine = 아미노산 유도체, retinoids = 지질 유사체**",
"2022-L2-Q63": "**Cytokine receptor(JAK-STAT 수용체)에는 cytokine 결합 → JAK 활성화 → STAT 인산화 → 핵 내 전사 활성화** 경로가 연결된다. Prolactin, EPO, GH 등의 수용체가 여기 속한다.\n\n오답 이유: ②Tyrosine kinase receptor(RTK)의 하위 신호는 주로 **Ras-MAPK, PI3K-Akt** 등이며, Smad는 serine-threonine kinase receptor(TGF-β 계열) 경로. ③G-protein coupled receptor → adenylyl cyclase-**cAMP** 또는 PLC-IP3/DAG 경로(Ras X). ④Nuclear receptor는 직접 핵 내 전사 인자 역할(세포내 second messenger X). ⑤Serine kinase receptor(TGF-β receptor) → Smad 활성화(diacylglycerol X).\n\n💡 **Cytokine receptor(EPO, GH, prolactin) → JAK → STAT**",
"2022-L2-Q108": "**Estrogen에 의한 LH 분비 증가**는 배란 전 LH surge를 유발하는 대표적 **양성되먹임(positive feedback)**이다. 높은 에스트로겐이 시상하부·뇌하수체를 자극하여 GnRH·LH 분비를 더욱 증가시킨다.\n\n오답 이유: ②혈당↓ → GH↑ (저혈당이 GH 자극이나, 이것은 음성되먹임 구조가 아닌 신호 자극 반응). ③Cortisol → CRH 억제(음성되먹임). ④자율신경 → cortisol 조절(신경성 자극, positive feedback 아님). ⑤Ca²⁺↑ → PTH↓(음성되먹임).\n\n💡 **Estrogen → LH surge = positive feedback의 대표 예**",
"2022-L2-Q72": "**Hormone responsive element(HRE)는 동일한 염기서열이 정방향(direct repeat) 또는 역방향(inverted repeat, palindrome)으로 반복**되는 구조를 가지며, 스테로이드 수용체 dimer가 이 반복 서열에 결합하여 전사를 조절한다.\n\n오답 이유: ①스테로이드 호르몬 수용체는 핵 내에서 **직접 DNA(HRE)에 결합**하는 것이 핵심 기전. ②Zinc-finger domain은 **DNA 결합**에 관여(호르몬 결합 X → 호르몬 결합은 LBD). ③스테로이드 수용체는 **Nuclear localization signal(NLS)을 가지고** 있어야 핵 내 이동 가능. ④Variable region은 수용체의 **N-terminal** 부위에 위치(C-terminal X).\n\n💡 **HRE = palindrome 또는 direct repeat 서열, 스테로이드 수용체 dimer가 결합**",
"2022-L2-Q92": "**Vitamin D receptor(VDR)는 세포질이 아닌 핵 내에서 vitamin D(calcitriol)와 결합**한다. VDR은 핵에 상주하며 리간드 결합 후 RXR과 heterodimer를 형성하여 vitamin D response element(VDRE)에 결합한다.\n\n오답 이유: ①Progesterone receptor는 같은 스테로이드 수용체이며, RXR과 heterodimer X(progesterone receptor는 homodimer). ③Orphan nuclear receptor는 핵에 상주하는 경우가 많음. ④RXR은 VDR, RAR, TR 등 다양한 파트너와 **heterodimer 형성**. ⑤Thyroid hormone receptor(TR)는 RXR과 **heterodimer**를 형성(homodimer X).\n\n💡 **VDR = 핵에서 칼시트리올과 결합 → RXR과 heterodimer → VDRE에 결합**",
"2022-L3-Q31": "**25세 여성, 2형 당뇨병, 어머니·여동생 동일 질환** — 젊은 나이에 발병한 2형 당뇨 + 상염색체 우성 가족력 패턴은 **MODY(Maturity-Onset Diabetes of the Young)**를 강하게 시사한다. MODY는 GCK, HNF1A, HNF4A 등 특정 유전자의 돌연변이로 발생하며, **표적 유전자 검사**가 진단·치료 방침 결정에 필수적이다.\n\n오답 이유: ①65세 골다공증은 다인성, 특정 유전자 검사 불필요. ②그레이브스병은 자가면역 질환, 특정 표적 유전자 검사 대상 아님. ③45세 2형 당뇨는 일반적 다인성 당뇨로 MODY 가능성 낮음. ④갑상선유두암은 주로 산발성(가족성 수질암은 RET 유전자 검사 대상이지만, **유두**암은 해당 X).\n\n💡 **젊은 발병 + 2형 당뇨 표현형 + 강한 가족력 → MODY → 특정 유전자 검사 필요**",
"2021-L2-Q9": "**Thyroid hormone(T3, T4)은 지용성 아미노산 유도체**로 세포막을 통과하여 핵 내 수용체(TR, thyroid hormone receptor)에 직접 결합하여 유전자 발현을 조절한다.\n\n오답 이유: ①Dopamine은 아미노산 유도체이나 세포막 GPCR에 결합(수용성, 핵 수용체 X). ②GnRH는 펩타이드 호르몬 → 세포막 GPCR. ③LH는 glycoprotein → 세포막 수용체(GPCR). ⑤Somatostatin은 펩타이드 → 세포막 GPCR.\n\n💡 **핵 수용체 결합 호르몬: 스테로이드, thyroid hormone(T3), vitamin D, retinoids — 모두 지용성**",
"2021-L2-Q10": "**Progesterone은 testosterone 합성의 중간 전구체**다. 스테로이드 호르몬 합성 경로: Cholesterol → pregnenolone → **progesterone** → 17-hydroxyprogesterone → androstenedione → **testosterone**. 따라서 progesterone 없이는 testosterone 합성 불가.\n\n오답 이유: ①스테로이드 호르몬은 **cholesterol**로부터 효소 반응을 거쳐 합성되며, 유전자 전사·번역 과정이 아닌 lipid 변환 과정. ②Signal peptide는 ER 이동을 돕고, mature hormone에서는 **제거됨**. ③Estrogen은 **testosterone(androgen)**을 전구체로 하여 aromatase에 의해 합성(corticosterone X). ④스테로이드 호르몬은 지용성이므로 분비과립(secretory granule) 없이 세포막을 통해 자유롭게 분비.\n\n💡 **스테로이드 합성 순서: Cholesterol→Pregnenolone→Progesterone→Testosterone→Estrogen**",
"2021-L2-Q11": "**Prolactin 수용체는 cytokine receptor 계열**로, JAK2-**STAT5** 신호경로를 통해 유선 발달·유즙 분비 등의 효과를 나타낸다.\n\n오답 이유: ②Insulin 수용체는 receptor tyrosine kinase(RTK) → IRS-1 → PI3K-Akt(또는 Ras-MAPK); Smad는 TGF-β 경로. ③Glucagon 수용체는 GPCR-Gs → adenylyl cyclase-**cAMP** (Ras X). ④GH 수용체는 cytokine receptor 계열 → JAK2-STAT5 (cAMP X; cAMP가 주된 하위 신호 아님). ⑤BMP(Bone morphogenic protein)는 TGF-β superfamily → serine kinase receptor → **SMAD1/5/8** (diacylglycerol X).\n\n💡 **Prolactin, GH, EPO → Cytokine receptor → JAK2 → STAT (prolactin=STAT5)**",
"2021-L2-Q12": "**Vitamin D receptor(VDR)는 retinoid X receptor(RXR)와 heterodimer를 형성**하여 vitamin D response element(VDRE)에 결합, 전사 조절.\n\n오답 이유: ①Estrogen receptor(ER)는 **세포질**에서 estrogen과 결합 후 핵으로 이동(핵에서 결합 X — 단, 이 점은 classical pathway 기준). ③Thyroid hormone receptor(TR)는 RXR과 **heterodimer** 형성(homodimer X). ④Orphan nuclear receptor 중 일부는 **리간드가 밝혀지지 않은** 것이지, 알려진 경우도 있다는 표현은 맞지만 이 선지 자체는 모순적이지 않아 함정 선지임. 결국 핵심 옳은 정답은 ②. ⑤Retinoid A receptor(RAR)는 **RXR과 heterodimer** 형성(단독 작용 X).\n\n💡 **VDR-RXR heterodimer = vitamin D 신호의 핵심; TR-RXR heterodimer = thyroid hormone 신호**",
"2021-L2-Q13": "**Ligand binding domain(LBD)은 호르몬 결합뿐 아니라 수용체 간 dimer 형성에도 관여**한다. LBD의 dimerization interface를 통해 homodimer 또는 heterodimer(예: RXR과)가 형성된다.\n\n오답 이유: ①스테로이드 수용체는 세포 내 가용성 단백질이며 **transmembrane domain 없음**. ②DBD(DNA-binding domain)의 아미노산 서열은 수용체마다 다름(결합하는 HRE 서열이 달라 특이성 생성). ③NLS는 주로 **hinge region(D domain)**에 위치. ④Zinc finger domain은 **DNA 결합**에 중요(ligand 결합 X — ligand 결합은 LBD).\n\n💡 **LBD 기능: 리간드 결합 + dimer 형성 + coactivator/corepressor 상호작용**",
"2021-L3-Q2": "**1형 당뇨병은 췌장 β세포 파괴로 인한 인슐린(insulin) 분비 절대적 감소**에 의해 발생한다. 호르몬 **분비 감소(hormone underproduction)**로 인한 대사질환의 대표적 예시다.\n\n오답 이유: ①고지혈증은 주로 지질 대사 이상(일부 갑상선기능저하증 등 호르몬 관련 가능하나 직접적 호르몬 분비 감소 대표 예 아님). ②신성고혈압은 레닌-안지오텐신계 활성화 등(신장 기전). ④근감소성 비만은 에너지 대사 이상. ⑤허혈성 심질환은 동맥경화 기전.\n\n💡 **1형 당뇨병 = 자가면역에 의한 β세포 파괴 → 인슐린 분비 감소 = 내분비질환의 전형적 hormone underproduction**",
"2021-L3-Q15": "**체중감소·식욕부진·음모·겨드랑이털 소실은 갑상선기능저하증이 아닌 부신기능부전(Addison병)의 증상**이다. 갑상선기능저하증의 전형 증상은 체중 **증가**, 무기력, 변비, 서맥, 피부 건조, 추위 민감 등이다.\n\n오답 이유(나머지 올바른 매칭): ①체중감소+식욕부진+과색소침착(손금·점막) = 부신기능부전(ACTH 과잉). ②유루증+무월경+두통 = 프로락틴 분비 뇌하수체선종. ③월상안+중심성 비만+자색 줄무늬 = 쿠싱증후군. ⑤체중감소+식욕증가+떨림+빈맥+불안 = 갑상선기능항진증.\n\n💡 **갑상선기능저하증 = 체중 증가, 피로, 서맥, 추위 민감 (체중감소·식욕부진 X)**",
"2021-L3-Q16": "**문항의 표(B)는 ACTH 증가 + cortisol 증가 패턴**으로, 이는 **Cushing disease(뇌하수체 ACTH 분비 선종)**에 해당한다. 뇌하수체 종양이 ACTH를 과잉 분비 → 부신 cortisol 과잉 → 음성 되먹임 불충분(종양이 되먹임에 저항).\n\n오답 이유: ①Hypopituitarism은 ACTH↓ + cortisol↓. ②Graves disease는 TSH↓ + T4↑(갑상선 축). ④Diabetes insipidus는 ADH↓ + 소변 희석(삼투압 축). ⑤Primary adrenal insufficiency(Addison)는 ACTH↑ + cortisol↓.\n\n💡 **ACTH↑ + cortisol↑ → Cushing disease(뇌하수체 선종, ACTH-dependent). ACTH↓ + cortisol↑ → adrenal Cushing(ACTH-independent)**",
"2021-L4-Q3": "**아미오다론(amiodarone)은 다량의 요오드를 함유**하고 있어 요오드 과부하에 의해 갑상선기능항진증(아미오다론 유발 갑상선기능항진증 type 1: Jod-Basedow 효과) 또는 갑상선기능저하증을 유발할 수 있다. 그레이브스병과 유사한 기능항진증을 일으킬 수 있다.\n\n오답 이유: ①Rifampin은 CYP 유도로 갑상선호르몬 **대사 촉진** → 갑상선기능저하; 갑상선염 X. ②Tacrolimus(면역억제제)는 주로 **신독성, 고혈압** 부작용; 2형 당뇨 유발도 가능하나 tacrolimus에 의한 당뇨는 췌장 β세포 독성(그러나 정확하게는 type 2보다 post-transplant DM). ④Ketoconazole은 스테로이드 합성 효소 억제 → **cortisol 감소** (부신성 쿠싱 유발 X). ⑤Glucocorticoid 투여는 HPA axis 억제로 내인성 ACTH↓ → **ACTH 비의존성(non-ACTH-dependent)** 쿠싱 유발.\n\n💡 **아미오다론 = 요오드 과부하 → 갑상선기능 항진 또는 저하 모두 가능 (그레이브스병 유사 기능항진증 포함)**",
